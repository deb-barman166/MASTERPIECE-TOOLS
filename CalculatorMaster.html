  { id:'matrix',       cat:'Technical',  label:'Matrix',             icon:'matrix',     desc:'Add, multiply, determinant, inverse' },
];
const REGISTRY_MAP = Object.fromEntries(REGISTRY.map(r => [r.id, r]));
const CATEGORY_ORDER = ['Everyday','Finance','Math','Science','Education','Technical'];

// Populated later — each module attaches { render(container), onNav() } here.
const Calculators = {};

/* ------------------------------------------------------------
   ROUTER — extremely small hash-based router.
   #  or #dashboard      -> dashboard
   #calc/<id>            -> a specific calculator
   #history               -> full history page
------------------------------------------------------------- */
const Router = {
  pendingShareParams: null,

  init(){
    window.addEventListener('hashchange', () => Router.resolve());
    Router.resolve();
  },
  resolve(){
    let hash = window.location.hash.replace(/^#\/?/, '');
    // Support optional trailing "?s=<encoded json>" for shareable pre-filled links.
    Router.pendingShareParams = null;
    const qIdx = hash.indexOf('?s=');
    if (qIdx !== -1) {
      const raw = hash.slice(qIdx + 3);
      hash = hash.slice(0, qIdx);
      try { Router.pendingShareParams = JSON.parse(decodeURIComponent(raw)); }
      catch(e) { Router.pendingShareParams = null; }
    }
    if (!hash || hash === 'dashboard') {
      View.renderDashboard();
    } else if (hash === 'history') {
      View.renderFullHistory();
    } else if (hash.startsWith('calc/')) {
      const id = hash.slice(5);
      if (REGISTRY_MAP[id]) {
        View.renderCalculator(id);
      } else {
        View.renderDashboard();
      }
    } else {
      View.renderDashboard();
    }
    Nav.syncActive();
    SidebarUI.closeMobile();
  },
  go(hash){ window.location.hash = hash; }
};

/* ------------------------------------------------------------
   SIDEBAR NAVIGATION
------------------------------------------------------------- */
const Nav = {
  filterQuery: '',

  render(){
    const nav = document.getElementById('sidebar-nav');
    const q = Nav.filterQuery.trim().toLowerCase();
    let html = '';

    // Dashboard link always first
    html += `<button class="nav-item" data-nav="dashboard">${icon('home','ic')}<span>Dashboard</span></button>`;

    // Pinned section (feature: pin any calculator above categories, separate from favorites)
    const pins = MState.pinned.map(id => REGISTRY_MAP[id]).filter(Boolean)
      .filter(r => !q || r.label.toLowerCase().includes(q));
    if (pins.length) {
      html += `<div class="nav-section-label">Pinned</div>`;
      pins.forEach(r => { html += Nav.item(r); });
    }

    // Favorites section
    const favs = MState.favorites.map(id => REGISTRY_MAP[id]).filter(Boolean)
      .filter(r => !q || r.label.toLowerCase().includes(q));
    if (favs.length) {
      html += `<div class="nav-section-label">Favorites</div>`;
      favs.forEach(r => { html += Nav.item(r); });
    }

    // Grouped by category, collapsible
    CATEGORY_ORDER.forEach(cat => {
      const items = REGISTRY.filter(r => r.cat === cat && (!q || r.label.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q)));
      if (!items.length) return;
      // Auto-expand a category if the active search matches inside it, even if collapsed
      const collapsed = !q && MState.isCategoryCollapsed(cat);
      html += `<button class="nav-section-label nav-cat-toggle" data-cat="${Util.esc(cat)}" aria-expanded="${!collapsed}">
        ${icon('chevron','nav-cat-chev' + (collapsed ? ' collapsed' : ''))}<span>${Util.esc(cat)}</span>
      </button>`;
      html += `<div class="nav-cat-group${collapsed ? ' collapsed' : ''}" data-cat-group="${Util.esc(cat)}">`;
      items.forEach(r => { html += Nav.item(r); });
      html += `</div>`;
    });

    if (q && !favs.length && !pins.length && CATEGORY_ORDER.every(cat => !REGISTRY.some(r => r.cat===cat && (r.label.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q))))) {
      html += `<div class="empty-hint">No calculators match "${Util.esc(Nav.filterQuery)}"</div>`;
    }

    nav.innerHTML = html;

    // Wire clicks
    nav.querySelectorAll('[data-nav="dashboard"]').forEach(el => {
      el.addEventListener('click', () => Router.go('#dashboard'));
    });
    nav.querySelectorAll('[data-calc-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.fav-star') || e.target.closest('.pin-btn')) return;
        Router.go('#calc/' + el.getAttribute('data-calc-id'));
      });
    });
    nav.querySelectorAll('.fav-star').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-fav-id');
        MState.toggleFavorite(id);
        Nav.render();
        Nav.syncActive();
      });
    });
    nav.querySelectorAll('.pin-btn').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-pin-id');
        MState.togglePinned(id);
        Nav.render();
        Nav.syncActive();
      });
    });
    nav.querySelectorAll('.nav-cat-toggle').forEach(el => {
      el.addEventListener('click', () => {
        const cat = el.getAttribute('data-cat');
        MState.toggleCategoryCollapsed(cat);
        const group = nav.querySelector(`[data-cat-group="${CSS.escape(cat)}"]`);
        const chev = el.querySelector('.nav-cat-chev');
        if (group) group.classList.toggle('collapsed');
        if (chev) chev.classList.toggle('collapsed');
        el.setAttribute('aria-expanded', group && !group.classList.contains('collapsed'));
      });
    });
  },

  item(r){
    const isFav = MState.isFavorite(r.id);
    const isPinned = MState.isPinned(r.id);
    return `<button class="nav-item" data-calc-id="${r.id}">
      ${icon(r.icon,'ic')}<span>${Util.esc(r.label)}</span>
      <span class="pin-btn ${isPinned?'is-pinned':''}" data-pin-id="${r.id}" title="${isPinned?'Unpin':'Pin to top'}">${icon('pin')}</span>
      <span class="fav-star ${isFav?'is-fav':''}" data-fav-id="${r.id}" title="${isFav?'Remove from favorites':'Add to favorites'}">${icon('star')}</span>
    </button>`;
  },

  syncActive(){
    const hash = window.location.hash.replace(/^#\/?/, '');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    if (!hash || hash === 'dashboard') {
      const el = document.querySelector('[data-nav="dashboard"]');
      if (el) el.classList.add('active');
    } else if (hash.startsWith('calc/')) {
      const id = hash.slice(5);
      document.querySelectorAll(`[data-calc-id="${id}"]`).forEach(el => el.classList.add('active'));
    }
  }
};

/* ------------------------------------------------------------
   COMBOBOX — progressive enhancement for every <select> in the app.
   The native <select> stays in the DOM as the source of truth (hidden
   visually) so every existing `sel.value` / `addEventListener('change')`
   call site keeps working untouched. This layer only adds a custom
   animated trigger + listbox on top and forwards choices back down
   to the real <select>, dispatching a genuine 'change' event.
   Call Combobox.scan(container) after any innerHTML swap that may
   contain <select> elements (mirrors how the app already re-renders
   calculator panels).
------------------------------------------------------------- */
const Combobox = {
  _openInstance: null,

  scan(root){
    (root || document).querySelectorAll('select:not([data-cbx-done])').forEach(sel => Combobox._enhance(sel));
  },

  _enhance(sel){
    sel.setAttribute('data-cbx-done', '1');
    sel.setAttribute('tabindex', '-1');
    sel.classList.add('cbx-native');

    const wrap = document.createElement('div');
    wrap.className = 'cbx' + (sel.classList.contains('filter-select') ? ' cbx-sm' : '');
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'cbx-trigger';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    if (sel.disabled) trigger.disabled = true;
    const label = document.createElement('span');
    label.className = 'cbx-label';
    trigger.appendChild(label);
    trigger.insertAdjacentHTML('beforeend', icon('chevron', 'cbx-chev'));

    const list = document.createElement('div');
    list.className = 'cbx-list';
    list.setAttribute('role', 'listbox');

    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    wrap.appendChild(trigger);
    wrap.appendChild(list);

    function buildOptions(){
      list.innerHTML = '';
      Array.from(sel.options).forEach(opt => {
        const row = document.createElement('div');
        row.className = 'cbx-opt' + (opt.value === sel.value ? ' active' : '');
        row.setAttribute('role', 'option');
        row.dataset.value = opt.value;
        row.textContent = opt.textContent;
        if (opt.disabled) row.classList.add('disabled');
        row.addEventListener('click', () => {
          if (opt.disabled) return;
          Combobox._choose(sel, opt.value, wrap, trigger, label, list);
        });
        list.appendChild(row);
      });
    }
    function syncLabel(){
      const opt = sel.options[sel.selectedIndex];
      label.textContent = opt ? opt.textContent : '';
    }

    buildOptions();
    syncLabel();

    // Keep the custom UI in sync if code elsewhere sets sel.value or
    // repopulates sel.innerHTML directly (several modules do this).
    const mo = new MutationObserver(() => { buildOptions(); syncLabel(); });
    mo.observe(sel, { childList:true, attributes:true, attributeFilter:['value'] });
    sel.addEventListener('change', syncLabel);

    trigger.addEventListener('click', () => {
      if (trigger.disabled) return;
      wrap.classList.contains('open') ? Combobox._close(wrap, trigger) : Combobox._open(wrap, trigger, list);
    });
    trigger.addEventListener('keydown', (e) => Combobox._keyOnTrigger(e, sel, wrap, trigger, label, list));
    wrap._cbxCleanup = () => mo.disconnect();
  },

  _open(wrap, trigger, list){
    if (Combobox._openInstance && Combobox._openInstance.wrap !== wrap) {
      Combobox._close(Combobox._openInstance.wrap, Combobox._openInstance.trigger);
    }
    wrap.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
    const active = list.querySelector('.cbx-opt.active') || list.querySelector('.cbx-opt');
    if (active) active.classList.add('kbd-focus');
    Combobox._openInstance = { wrap, trigger };
    document.addEventListener('click', Combobox._onDocClick, true);
    // Reflow-then-animate so the CSS transition actually plays
    requestAnimationFrame(() => wrap.classList.add('open-anim'));
  },
  _close(wrap, trigger){
    wrap.classList.remove('open', 'open-anim');
    trigger.setAttribute('aria-expanded', 'false');
    wrap.querySelectorAll('.cbx-opt.kbd-focus').forEach(el => el.classList.remove('kbd-focus'));
    if (Combobox._openInstance && Combobox._openInstance.wrap === wrap) Combobox._openInstance = null;
    document.removeEventListener('click', Combobox._onDocClick, true);
  },
  _onDocClick(e){
    if (!Combobox._openInstance) return;
    if (!Combobox._openInstance.wrap.contains(e.target)) {
      Combobox._close(Combobox._openInstance.wrap, Combobox._openInstance.trigger);
    }
  },
  _choose(sel, value, wrap, trigger, label, list){
    if (sel.value !== value) {
      sel.value = value;
      sel.dispatchEvent(new Event('change', { bubbles:true }));
    }
    list.querySelectorAll('.cbx-opt').forEach(el => el.classList.toggle('active', el.dataset.value === value));
    const opt = sel.options[sel.selectedIndex];
    label.textContent = opt ? opt.textContent : '';
    Combobox._close(wrap, trigger);
    trigger.focus();
  },
  _keyOnTrigger(e, sel, wrap, trigger, label, list){
    const opts = Array.from(list.querySelectorAll('.cbx-opt:not(.disabled)'));
    const isOpen = wrap.classList.contains('open');
    const focused = list.querySelector('.cbx-opt.kbd-focus');
    let idx = focused ? opts.indexOf(focused) : opts.findIndex(o => o.classList.contains('active'));

    if (['ArrowDown','ArrowUp','Enter',' ','Escape','Home','End'].includes(e.key)) e.preventDefault();

    if (!isOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ')) {
      return Combobox._open(wrap, trigger, list);
    }
    if (!isOpen) return;

    if (e.key === 'Escape') return Combobox._close(wrap, trigger);
    if (e.key === 'ArrowDown') idx = Math.min(idx + 1, opts.length - 1);
    else if (e.key === 'ArrowUp') idx = Math.max(idx - 1, 0);
    else if (e.key === 'Home') idx = 0;
    else if (e.key === 'End') idx = opts.length - 1;
    else if (e.key === 'Enter' || e.key === ' ') {
      if (opts[idx]) Combobox._choose(sel, opts[idx].dataset.value, wrap, trigger, label, list);
      return;
    } else return;

    opts.forEach(o => o.classList.remove('kbd-focus'));
    if (opts[idx]) { opts[idx].classList.add('kbd-focus'); opts[idx].scrollIntoView({ block:'nearest' }); }
  }
};

/* ------------------------------------------------------------
   COMMAND PALETTE — Cmd/Ctrl+K quick jump + expression runner.
   Distinct from the topbar search: this is a full-screen overlay
   with keyboard-first navigation, shown/hidden via open()/close().
------------------------------------------------------------- */
const CommandPalette = {
  _idx: 0,
  _results: [],

  open(){
    if (document.getElementById('cmdk-root').innerHTML) return; // already open
    const root = document.getElementById('cmdk-root');
    root.innerHTML = `
      <div class="cmdk-backdrop" id="cmdk-backdrop">
        <div class="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
          <div class="cmdk-input-row">
            ${icon('search','cmdk-search-ic')}
            <input type="text" id="cmdk-input" placeholder="Jump to a calculator or type an expression…" autocomplete="off">
            <kbd class="cmdk-esc">Esc</kbd>
          </div>
          <div class="cmdk-list" id="cmdk-list" role="listbox"></div>
          <div class="cmdk-foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
            <span><kbd>↵</kbd> select</span>
            <span><kbd>Esc</kbd> close</span>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('cmdk-input');
    CommandPalette._renderResults('');
    requestAnimationFrame(() => { root.querySelector('.cmdk-backdrop').classList.add('open'); input.focus(); });

    input.addEventListener('input', () => CommandPalette._renderResults(input.value));
    input.addEventListener('keydown', CommandPalette._onKeydown);
    document.getElementById('cmdk-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'cmdk-backdrop') CommandPalette.close();
    });
  },

  close(){
    const root = document.getElementById('cmdk-root');
    const backdrop = root.querySelector('.cmdk-backdrop');
    if (!backdrop) return;
    backdrop.classList.remove('open');
    setTimeout(() => { root.innerHTML = ''; }, 160);
  },

  toggle(){
    document.getElementById('cmdk-root').innerHTML ? CommandPalette.close() : CommandPalette.open();
  },

  _renderResults(query){
    const q = query.trim().toLowerCase();
    const list = document.getElementById('cmdk-list');
    let results;
    if (!q) {
      // Empty state: pinned first, then recents, then everything else
      const pinned = MState.pinned.map(id => REGISTRY_MAP[id]).filter(Boolean).map(r => ({ r, tag:'Pinned' }));
      const recents = MState.recentCalcIds.filter(id => !MState.pinned.includes(id)).slice(0,4)
        .map(id => REGISTRY_MAP[id]).filter(Boolean).map(r => ({ r, tag:'Recent' }));
      const rest = REGISTRY.filter(r => !MState.pinned.includes(r.id) && !MState.recentCalcIds.slice(0,4).includes(r.id))
        .map(r => ({ r, tag:r.cat }));
      results = [...pinned, ...recents, ...rest];
    } else {
      results = REGISTRY.filter(r => r.label.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q))
        .map(r => ({ r, tag:r.cat }));
    }
    CommandPalette._results = results;
    CommandPalette._idx = 0;

    if (!results.length) {
      list.innerHTML = `<div class="cmdk-empty">No calculators match "${Util.esc(query)}" — press <kbd>↵</kbd> to try it as an expression</div>`;
      return;
    }
    list.innerHTML = results.map((item, i) => `
      <div class="cmdk-item${i===0?' active':''}" data-idx="${i}" role="option">
        <span class="cmdk-item-ic">${icon(item.r.icon)}</span>
        <span class="cmdk-item-text">
          <span class="cmdk-item-label">${Util.esc(item.r.label)}</span>
          <span class="cmdk-item-desc">${Util.esc(item.r.desc)}</span>
        </span>
        <span class="cmdk-item-tag">${Util.esc(item.tag)}</span>
      </div>`).join('');
    list.querySelectorAll('.cmdk-item').forEach(el => {
      el.addEventListener('mouseenter', () => CommandPalette._setActive(+el.dataset.idx));
      el.addEventListener('click', () => CommandPalette._choose(+el.dataset.idx));
    });
  },

  _setActive(idx){
    CommandPalette._idx = idx;
    document.querySelectorAll('.cmdk-item').forEach(el => el.classList.toggle('active', +el.dataset.idx === idx));
    const active = document.querySelector('.cmdk-item.active');
    if (active) active.scrollIntoView({ block:'nearest' });
  },

  _choose(idx){
    const item = CommandPalette._results[idx];
    const q = document.getElementById('cmdk-input').value.trim();
    CommandPalette.close();
    if (item) {
      Router.go('#calc/' + item.r.id);
    } else if (q) {
      // No calculator matched — treat as a universal-calculator expression.
      Router.go('#dashboard');
      setTimeout(() => {
        const uInput = document.getElementById('universal-input');
        if (uInput) { uInput.value = q; Universal.run(q); }
      }, 30);
    }
  },

  _onKeydown(e){
    const max = CommandPalette._results.length - 1;
    if (e.key === 'ArrowDown') { e.preventDefault(); CommandPalette._setActive(Math.min(CommandPalette._idx + 1, max)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); CommandPalette._setActive(Math.max(CommandPalette._idx - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); CommandPalette._choose(CommandPalette._idx); }
    else if (e.key === 'Escape') { e.preventDefault(); CommandPalette.close(); }
  }
};

/* ------------------------------------------------------------
   MODAL — generic confirm / prompt style modal
------------------------------------------------------------- */
const Modal = {
  open(opts){
    const root = document.getElementById('modal-root');
    const id = 'modal-' + Util.uid();
    root.innerHTML = `
      <div class="modal-backdrop" id="${id}">
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-head">
            <h3>${Util.esc(opts.title||'')}</h3>
            ${opts.body ? `<p>${opts.body}</p>` : ''}
          </div>
          <div class="modal-body" id="${id}-body"></div>
          <div class="modal-actions" id="${id}-actions"></div>
        </div>
      </div>`;
    const backdrop = document.getElementById(id);
    const bodyEl = document.getElementById(id+'-body');
    const actionsEl = document.getElementById(id+'-actions');
    if (opts.bodyHTML) bodyEl.innerHTML = opts.bodyHTML; else bodyEl.remove();

    (opts.actions || []).forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (a.cls || 'btn-ghost');
      btn.textContent = a.label;
      btn.addEventListener('click', () => {
        if (a.onClick) a.onClick();
        if (a.close !== false) Modal.close();
      });
      actionsEl.appendChild(btn);
    });

    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) Modal.close(); });
    document.addEventListener('keydown', Modal._escHandler = (e) => { if (e.key === 'Escape') Modal.close(); });
  },
  close(){
    document.getElementById('modal-root').innerHTML = '';
    if (Modal._escHandler) document.removeEventListener('keydown', Modal._escHandler);
  }
};

const Dash = {
  sessionStats(){
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const todayCount = MState.history.filter(h => h.ts >= startOfToday).length;
    const total = MState.history.length;
    const freq = {};
    MState.history.forEach(h => { freq[h.calcId] = (freq[h.calcId]||0) + 1; });
    let topId = null, topCount = 0;
    Object.keys(freq).forEach(id => { if (freq[id] > topCount) { topCount = freq[id]; topId = id; } });
    const topCalc = topId ? REGISTRY_MAP[topId] : null;
    return { todayCount, total, topCalc, topCount };
  },
  toolCard(r){
    if (!r) return '';
    const isFav = MState.isFavorite(r.id);

/* ------------------------------------------------------------
   RESULT PANEL RENDERER — shared by every calculator module.
   Renders the sticky right-hand result card given a result spec:
   { label, value, unit, valueClass, sub, extras:[{k,v}], steps:[str],
     onCopy, onReuse, onReset }
------------------------------------------------------------- */
const ResultPanel = {
  empty(container, hint){
    container.innerHTML = `<div class="result-card">
      <div class="rc-empty">
        ${icon('calc')}
        <div>${Util.esc(hint || 'Fill in the fields to see your result here.')}</div>
      </div>
    </div>`;
  },

  render(container, spec){
    let html = `<div class="result-card">`;
    html += `<div class="result-main">
      <div class="rm-label">${Util.esc(spec.label || 'Result')}</div>
      <div class="rm-value ${spec.valueClass||''}">${spec.value}${spec.unit?`<span class="rm-unit">${Util.esc(spec.unit)}</span>`:''}</div>
      ${spec.sub ? `<div class="rm-sub">${spec.sub}</div>` : ''}
    </div>`;

    if (spec.extras && spec.extras.length) {
      html += `<div class="result-extra">`;
      spec.extras.forEach(ex => {
        html += `<div class="re-row"><span class="re-k">${Util.esc(ex.k)}</span><span class="re-v">${ex.v}</span></div>`;
      });
      html += `</div>`;
    }

    if (spec.steps && spec.steps.length) {
      html += `<div class="steps-block"><div class="sb-title">Steps</div>`;
      spec.steps.forEach((s,i) => {
        html += `<div class="step-line"><span class="sl-num">${i+1}.</span>${s}</div>`;
      });
      html += `</div>`;
    }

    html += `<div class="result-actions">
      <div class="cbx-menu-wrap" id="rp-copy-wrap">
        <button class="btn btn-soft btn-sm" id="rp-copy">${icon('copy')} Copy</button>
        <button class="btn btn-soft btn-sm btn-icon-only" id="rp-copy-more" title="More copy formats" aria-label="More copy formats" aria-haspopup="true" aria-expanded="false">${icon('chevron')}</button>
        <div class="cbx-menu" id="rp-copy-menu" role="menu">
          <div class="cbx-menu-item" data-fmt="plain" role="menuitem">Plain text</div>
          <div class="cbx-menu-item" data-fmt="markdown" role="menuitem">Markdown</div>
          <div class="cbx-menu-item" data-fmt="csv" role="menuitem">CSV row</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="rp-share" title="Copy a shareable link to this result">${icon('link')} Share</button>
      <button class="btn btn-ghost btn-sm" id="rp-reset">${icon('reset')} Reset</button>
    </div></div>`;

    container.innerHTML = html;

    const plainText = spec.copyText || buildPlainCopyText();
    function buildPlainCopyText(){
      const label = spec.label || 'Result';
      const val = spec.plainValue !== undefined ? spec.plainValue : Util.stripHtml(String(spec.value));
      const subText = spec.sub ? Util.stripHtml(String(spec.sub)) : '';
      return `${label}: ${val}${spec.unit?' '+spec.unit:''}${subText?' ('+subText+')':''}`;
    }
    const buildFormatted = (fmt) => {
      const label = spec.label || 'Result';
      const val = spec.plainValue !== undefined ? spec.plainValue : Util.stripHtml(String(spec.value));
      const sub = spec.sub ? Util.stripHtml(String(spec.sub)) : '';
      const extras = (spec.extras||[]).map(ex => [Util.stripHtml(ex.k), Util.stripHtml(String(ex.v))]);
      if (fmt === 'plain') {
        let out = `${label}: ${val}${spec.unit?' '+spec.unit:''}`;
        if (sub) out += ` (${sub})`;
        extras.forEach(([k,v]) => out += `\n${k}: ${v}`);
        return out;
      }
      if (fmt === 'markdown') {
        let out = `**${label}:** ${val}${spec.unit?' '+spec.unit:''}`;
        if (sub) out += `  \n*${sub}*`;
        if (extras.length) out += '\n\n' + extras.map(([k,v]) => `- **${k}:** ${v}`).join('\n');
        return out;
      }
      if (fmt === 'csv') {
        const headers = [label, ...(sub?['Detail']:[]), ...extras.map(([k]) => k)];
        const values = [val + (spec.unit?' '+spec.unit:''), ...(sub?[sub]:[]), ...extras.map(([,v]) => v)];
        const esc = (s) => /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
        return headers.map(esc).join(',') + '\n' + values.map(esc).join(',');
      }
      return plainText;
    };

    document.getElementById('rp-copy').addEventListener('click', () => {
      Util.copyToClipboard(plainText);
      Toast.show('Copied to clipboard', 'ok');
    });
    const menu = document.getElementById('rp-copy-menu');
    const moreBtn = document.getElementById('rp-copy-more');
    moreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('open');
      moreBtn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#rp-copy-wrap')) { menu.classList.remove('open'); moreBtn.setAttribute('aria-expanded','false'); }
    });
    menu.querySelectorAll('.cbx-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        Util.copyToClipboard(buildFormatted(item.dataset.fmt));
        Toast.show('Copied as ' + item.textContent, 'ok');
        menu.classList.remove('open');
        moreBtn.setAttribute('aria-expanded','false');
      });
    });
    const shareBtn = document.getElementById('rp-share');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        if (spec.shareParams && MState.currentCalcId) {
          const encoded = encodeURIComponent(JSON.stringify(spec.shareParams));
          const url = window.location.origin + window.location.pathname + '#calc/' + MState.currentCalcId + '?s=' + encoded;
          Util.copyToClipboard(url);
          Toast.show('Shareable link copied', 'ok');
        } else {
          Util.copyToClipboard(plainText);
          Toast.show('Result copied (this calculator does not support pre-filled links yet)', 'ok');
        }
      });
    }
    document.getElementById('rp-reset').addEventListener('click', () => {
      if (spec.onReset) spec.onReset();
    });
  },

  error(container, message){
    container.innerHTML = `<div class="result-card">
      <div class="rc-empty" style="color:var(--danger)">
        ${icon('alert')}
        <div>${Util.esc(message)}</div>
      </div>
    </div>`;
  }
};

/* ------------------------------------------------------------
   FIELD ERROR HELPER — shared validation display utility.
   Shows/clears an inline error message under an input, and
   toggles the `.err` class on the input itself.
------------------------------------------------------------- */
const FieldErr = {
  set(inputId, msg){
    const input = document.getElementById(inputId);
    const errEl = document.getElementById(inputId + '-err');
    if (input) input.classList.add('err');
    if (errEl) errEl.textContent = msg;
  },
  clear(inputId){
    const input = document.getElementById(inputId);
    const errEl = document.getElementById(inputId + '-err');
    if (input) input.classList.remove('err');
    if (errEl) errEl.textContent = '';
  },
  clearAll(ids){
    ids.forEach(FieldErr.clear);
  }
};

/* ------------------------------------------------------------
   PER-CALCULATOR HISTORY PANEL (slide-in modal) — shows history
   filtered to one calculator id, with reuse/delete/favorite.
------------------------------------------------------------- */
const CalcHistoryPanel = {
  open(calcId, label){
    const items = MState.history.filter(h => h.calcId === calcId);
    const bodyHTML = items.length
      ? `<div class="history-list">${items.map(h => HistoryPage.itemHTML(h)).join('')}</div>`
      : `<div class="empty-hint">No history yet for ${Util.esc(label)}.</div>`;
    Modal.open({
      title: label + ' — History',
      body: `${items.length} saved calculation${items.length===1?'':'s'}`,
      bodyHTML,
      actions: [
        { label:'Close', cls:'btn-ghost' },
      ]
    });
    HistoryPage.wireItemButtons(document.getElementById('modal-root'), () => CalcHistoryPanel.open(calcId, label));
  }
};

/* ------------------------------------------------------------
   FULL HISTORY PAGE
------------------------------------------------------------- */
const HistoryPage = {
  filterCalc: 'all',
  filterQuery: '',
  showFavOnly: false,

  render(container){
    const items = HistoryPage.filtered();
    container.innerHTML = `
      <div class="card card-pad">
        <div class="section-title">${icon('clock')} Full Calculation History <span class="pill-count">${MState.history.length}</span></div>
        <div class="section-sub">Every saved calculation across all calculators, stored locally on this device.</div>
        <div class="toolbar">
          <div class="search-mini">
            ${icon('search')}
            <input type="text" class="input" id="hist-search" placeholder="Search history…" value="${Util.esc(HistoryPage.filterQuery)}">
          </div>
          <select class="filter-select" id="hist-filter-calc"></select>
          <button class="btn btn-sm ${HistoryPage.showFavOnly?'btn-primary':'btn-ghost'}" id="hist-fav-toggle">${icon('star')} Favorites</button>
          <div class="toolbar-spacer"></div>
          <button class="btn btn-ghost btn-sm" id="hist-export-json">${icon('download')} JSON</button>
          <button class="btn btn-ghost btn-sm" id="hist-export-csv">${icon('download')} CSV</button>
          <button class="btn btn-ghost btn-sm" id="hist-import">${icon('upload')} Import</button>
          <button class="btn btn-danger btn-sm" id="hist-clear">${icon('trash')} Clear</button>
        </div>
        <div class="history-list" id="hist-list"></div>
      </div>
      <input type="file" id="hist-import-file" accept="application/json" style="display:none">
    `;

    // Filter dropdown options
    const filterSel = document.getElementById('hist-filter-calc');
    filterSel.innerHTML = `<option value="all">All calculators</option>` +
      REGISTRY.map(r => `<option value="${r.id}" ${HistoryPage.filterCalc===r.id?'selected':''}>${Util.esc(r.label)}</option>`).join('');
    filterSel.value = HistoryPage.filterCalc;

    HistoryPage.renderList();

    filterSel.addEventListener('change', () => { HistoryPage.filterCalc = filterSel.value; HistoryPage.renderList(); });
    document.getElementById('hist-search').addEventListener('input', Util.debounce((e) => {
      HistoryPage.filterQuery = e.target.value; HistoryPage.renderList();
    }, 180));
    document.getElementById('hist-fav-toggle').addEventListener('click', () => {
      HistoryPage.showFavOnly = !HistoryPage.showFavOnly;
      HistoryPage.render(container);
    });
    document.getElementById('hist-export-json').addEventListener('click', () => {
      Util.download('calculator-master-history.json', MState.exportJSON(), 'application/json');
      Toast.show('Exported as JSON', 'ok');
    });
    document.getElementById('hist-export-csv').addEventListener('click', () => {
      Util.download('calculator-master-history.csv', MState.exportCSV(), 'text/csv');
      Toast.show('Exported as CSV', 'ok');
    });
    document.getElementById('hist-import').addEventListener('click', () => {
      document.getElementById('hist-import-file').click();
    });
    document.getElementById('hist-import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const added = MState.importJSON(reader.result);
          Toast.show(`Imported ${added} new record${added===1?'':'s'}`, 'ok');
          HistoryPage.render(container);
        } catch(err) {
          Toast.show(err.message || 'Import failed', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
    document.getElementById('hist-clear').addEventListener('click', () => {
      Modal.open({
        title: 'Clear history?',
        body: 'This removes all non-favorited calculations from this device. This cannot be undone.',
        actions: [
          { label:'Cancel', cls:'btn-ghost' },
          { label:'Keep favorites, clear rest', cls:'btn-soft', onClick: () => {
              const removed = MState.clearHistory(true);
              HistoryPage.render(container);
              Toast.show('History cleared (favorites kept)','ok', removed.length ? {
                label:'Undo',
                onClick(){ MState.restoreHistoryBulk(removed); HistoryPage.render(container); Toast.show('Restored','ok'); }
              } : null);
            } },
          { label:'Clear everything', cls:'btn-danger', onClick: () => {
              const removed = MState.clearHistory(false);
              HistoryPage.render(container);
              Toast.show('History cleared','ok', removed.length ? {
                label:'Undo',
                onClick(){ MState.restoreHistoryBulk(removed); HistoryPage.render(container); Toast.show('Restored','ok'); }
              } : null);
            } },
        ]
      });
    });
  },

  filtered(){
    const q = HistoryPage.filterQuery.trim().toLowerCase();
    return MState.history.filter(h => {
      if (HistoryPage.filterCalc !== 'all' && h.calcId !== HistoryPage.filterCalc) return false;
      if (HistoryPage.showFavOnly && !h.fav) return false;
      if (q && !(h.expr||'').toLowerCase().includes(q) && !(h.resultText||'').toLowerCase().includes(q)) return false;
      return true;
    });
  },

  renderList(){
    const list = document.getElementById('hist-list');
    if (!list) return;
    const items = HistoryPage.filtered();
    if (!items.length) {
      list.innerHTML = `<div class="empty-hint">No matching history.</div>`;
      return;
    }
    list.innerHTML = items.map(HistoryPage.itemHTML).join('');
    HistoryPage.wireItemButtons(list, () => HistoryPage.renderList());
  },

  itemHTML(h){
    const meta = REGISTRY_MAP[h.calcId] || {icon:'calc'};
    const note = MState.notes[h.id];
    return `<div class="hist-item-wrap">
      <div class="hist-item" data-hist-id="${h.id}" data-hist-calc="${h.calcId}">
        <div class="hi-ic">${icon(meta.icon)}</div>
        <div class="hi-main">
          <div class="hi-expr">${Util.esc(h.expr)}</div>
          <div class="hi-meta">${Util.esc(h.calcLabel || (REGISTRY_MAP[h.calcId]||{}).label || '')} · ${Util.fmtDate(h.ts, true)}</div>
          ${note ? `<div class="hi-note-preview">${icon('edit')}${Util.esc(note)}</div>` : ''}
        </div>
        <div class="hi-result">${Util.esc(h.resultText)}</div>
        <button class="hi-note-btn ${note?'has-note':''}" data-note-toggle="${h.id}" title="${note?'Edit note':'Add note'}">${icon('edit')}</button>
        <button class="hi-fav ${h.fav?'is-fav':''}" data-fav-toggle="${h.id}" title="Favorite">${icon('star')}</button>
        <button class="hi-del" data-del="${h.id}" title="Delete">${icon('trash')}</button>
      </div>
      <div class="hi-note-editor" id="note-editor-${h.id}" style="display:none;">
        <textarea class="input hi-note-input" placeholder="Add a note about this calculation…" rows="2">${Util.esc(note||'')}</textarea>
        <div class="hi-note-actions">
          <button class="btn btn-primary btn-sm" data-note-save="${h.id}">Save</button>
          <button class="btn btn-ghost btn-sm" data-note-cancel="${h.id}">Cancel</button>
        </div>
      </div>
    </div>`;
  },

  wireItemButtons(scope, onChange){
    scope.querySelectorAll('[data-fav-toggle]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        MState.toggleHistoryFav(el.getAttribute('data-fav-toggle'));
        if (onChange) onChange();
      });
    });
    scope.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const result = MState.deleteHistory(el.getAttribute('data-del'));
        if (onChange) onChange();
        if (result) {
          Toast.show('Deleted', 'ok', {
            label:'Undo',
            onClick(){
              MState.restoreHistoryEntry(result.removed, result.idx);
              if (onChange) onChange();
              Toast.show('Restored', 'ok');
            }
          });
        }
      });
    });
    scope.querySelectorAll('[data-note-toggle]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-note-toggle');
        const editor = document.getElementById('note-editor-' + id);
        if (editor) {
          const showing = editor.style.display !== 'none';
          // Close any other open note editors first so only one is open at a time.
          scope.querySelectorAll('.hi-note-editor').forEach(ed => { ed.style.display = 'none'; });
          editor.style.display = showing ? 'none' : 'block';
          if (!showing) {
            const ta = editor.querySelector('textarea');
            if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
          }
        }
      });
    });
    scope.querySelectorAll('[data-note-save]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-note-save');
        const editor = document.getElementById('note-editor-' + id);
        const ta = editor ? editor.querySelector('textarea') : null;
        MState.saveNote(id, ta ? ta.value : '');
        Toast.show('Note saved', 'ok');
        if (onChange) onChange();
      });
    });
    scope.querySelectorAll('[data-note-cancel]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-note-cancel');
        const editor = document.getElementById('note-editor-' + id);
        if (editor) editor.style.display = 'none';
      });
    });
    scope.querySelectorAll('[data-hist-id]').forEach(el => {
      el.addEventListener('click', () => {
        const calcId = el.getAttribute('data-hist-calc');
        if (REGISTRY_MAP[calcId]) {
          Modal.close();
          Router.go('#calc/' + calcId);
        }
      });
    });
  }
};

/* ============================================================
   CALCULATOR MODULES
   Each module exposes: Calculators[id] = { render(container) }
   render() builds the form + wires events + computes results
   using ExprParser / plain math, then calls ResultPanel.render()
   and MState.addHistory() on every successful computation.
   ============================================================ */

/* ---------------- 1. BASIC CALCULATOR ---------------- */
Calculators.basic = (function(){
  let expr = '';
  let memory = 0;

  function render(container){
    expr = '';
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="expr-display">
            <div class="ed-expr" id="basic-hist-line">&nbsp;</div>
            <div class="ed-live" id="basic-live">0</div>
          </div>
          <div class="field-row-2" style="margin-bottom:10px;">
            <div class="field" style="flex:1;">
              <label>Or type any expression directly</label>
              <input type="text" class="input" id="basic-direct" placeholder="e.g. (45+30)*2 - 15%" autocomplete="off">
            </div>
          </div>
          <div class="memory-row" id="basic-memory-row">
            <button class="mem-btn" data-mem="mc" title="Memory clear">MC</button>
            <button class="mem-btn" data-mem="mr" title="Memory recall">MR</button>
            <button class="mem-btn" data-mem="mplus" title="Memory add">M+</button>
            <button class="mem-btn" data-mem="mminus" title="Memory subtract">M−</button>
            <span class="mem-indicator" id="basic-mem-indicator" title="A value is stored in memory">M</span>
          </div>
          <div class="keypad" id="basic-keypad"></div>
          <div class="info-box"><b>Tip:</b> supports brackets, %, ^ (power), √, sin/cos/tan, log, ln, and factorial (!). Press Enter to evaluate, Esc to clear.</div>
          <div class="basic-recent" id="basic-recent"></div>
        </div>
        <div class="result-panel" id="basic-result"></div>
      </div>
    `;
    buildKeypad();
    ResultPanel.empty(document.getElementById('basic-result'), 'Your calculation will appear here.');
    renderRecent();
    updateMemIndicator();

    const direct = document.getElementById('basic-direct');
    direct.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { expr = direct.value; updateLive(); evaluate(); }
    });
    direct.addEventListener('input', () => { expr = direct.value; updateLive(); });

    document.querySelectorAll('[data-mem]').forEach(btn => {
      btn.addEventListener('click', () => handleMemory(btn.getAttribute('data-mem')));
    });

    document.addEventListener('keydown', keyHandler);
    container._cleanup = () => document.removeEventListener('keydown', keyHandler);
  }

  function handleMemory(action){
    if (action === 'mc') { memory = 0; Toast.show('Memory cleared', 'ok'); }
    else if (action === 'mr') { expr = Util.fmt(memory); updateLive(); }
    else if (action === 'mplus' || action === 'mminus') {
      // Use the last evaluated/live number if possible, else try to evaluate current expr
      let val;
      try { val = ExprParser.evaluate(expr || '0', {angleMode: MState.angleMode}); }
      catch(e) { Toast.show('Nothing valid to add to memory', 'warn'); return; }
      memory += action === 'mplus' ? val : -val;
      Toast.show((action === 'mplus' ? 'Added to' : 'Subtracted from') + ' memory', 'ok');
    }
    updateMemIndicator();
  }

  function updateMemIndicator(){
    const ind = document.getElementById('basic-mem-indicator');
    if (ind) ind.classList.toggle('active', memory !== 0);
  }

  function renderRecent(){
    const wrap = document.getElementById('basic-recent');
    if (!wrap) return;
    const recent = MState.history.filter(h => h.calcId === 'basic').slice(0, 5);
    if (!recent.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `<div class="basic-recent-label">Recent</div>` + recent.map(h => `
      <button class="basic-recent-item" data-reuse="${h.id}" title="Click to reuse">
        <span class="bri-expr">${Util.esc(h.expr)}</span>
        <span class="bri-eq">=</span>
        <span class="bri-result">${Util.esc(h.resultText)}</span>
      </button>`).join('');
    wrap.querySelectorAll('[data-reuse]').forEach(el => {
      el.addEventListener('click', () => {
        const entry = MState.history.find(h => h.id === el.getAttribute('data-reuse'));
        if (entry) { expr = String(entry.resultRaw !== undefined ? entry.resultRaw : entry.resultText); updateLive(); }
      });
    });
  }

  function keyHandler(e){
    // Only act if basic calculator is the active view
    if (MState.currentCalcId !== 'basic') return;
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return; // let direct input handle its own keys
    if (/[0-9+\-*/.^%()!]/.test(e.key)) { append(e.key); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === '=') { evaluate(); e.preventDefault(); }
    else if (e.key === 'Backspace') { expr = expr.slice(0,-1); updateLive(); e.preventDefault(); }
    else if (e.key === 'Escape') { clearAll(); e.preventDefault(); }
  }

  function buildKeypad(){
    const keys = [
      ['C','clear'],['(',''],[')',''],['⌫','del'],
      ['7',''],['8',''],['9',''],['÷','op'],
      ['4',''],['5',''],['6',''],['×','op'],
      ['1',''],['2',''],['3',''],['−','op'],
      ['0',''],['.',''],['%','op'],['+','op'],
      ['=','eq']
    ];
    const kp = document.getElementById('basic-keypad');
    kp.innerHTML = keys.map(([label,cls]) => `<button class="${cls}" data-key="${Util.esc(label)}">${Util.esc(label)}</button>`).join('');
    kp.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => handleKeypad(btn.getAttribute('data-key')));
    });
  }

  function handleKeypad(key){
    if (key === 'C') return clearAll();
    if (key === '⌫') { expr = expr.slice(0,-1); return updateLive(); }
    if (key === '=') return evaluate();
    const map = {'÷':'/', '×':'*', '−':'-'};
    append(map[key] || key);
  }

  function append(ch){
    expr += ch;
    updateLive();
  }

  function clearAll(){
    expr = '';
    updateLive();
    document.getElementById('basic-hist-line').innerHTML = '&nbsp;';
    const direct = document.getElementById('basic-direct');
    if (direct) direct.value = '';
    ResultPanel.empty(document.getElementById('basic-result'), 'Your calculation will appear here.');
  }

  function updateLive(){
    const live = document.getElementById('basic-live');
    const direct = document.getElementById('basic-direct');
    if (live) live.textContent = expr || '0';
    if (direct && direct.value !== expr) direct.value = expr;
  }

  function evaluate(){
    if (!expr.trim()) return;
    try {
      const result = ExprParser.evaluate(expr, {angleMode: MState.angleMode});
      const resultText = Util.fmt(result);
      document.getElementById('basic-hist-line').textContent = expr + ' =';
      document.getElementById('basic-live').textContent = resultText;
      MState.saveLastAnswer(result);

      ResultPanel.render(document.getElementById('basic-result'), {
        label: 'Result',
        value: Util.esc(resultText),
        plainValue: resultText,
        copyText: resultText,
        steps: [`${Util.esc(expr)} = <b>${Util.esc(resultText)}</b>`],
        onReset: clearAll
      });

      MState.addHistory({ calcId:'basic', calcLabel:'Basic Calculator', expr: expr, resultText, resultRaw: result });
      expr = resultText; // allow chaining
      renderRecent();
    } catch(e) {
      ResultPanel.error(document.getElementById('basic-result'), e.message || 'Invalid expression');
      Toast.show(e.message || 'Invalid expression', 'error');
    }
  }

  return { render };
})();

/* ---------------- 2. PERCENTAGE MASTER ---------------- */
Calculators.percentage = (function(){
  const MODES = [
    { id:'of',        label:'% of a number' },
    { id:'change',     label:'% change (increase/decrease)' },
    { id:'increase',   label:'Increase by %' },
    { id:'decrease',   label:'Decrease by %' },
    { id:'reverse',    label:'Reverse % (find original)' },
    { id:'successive', label:'Successive % (e.g. two discounts)' },
    { id:'discount',   label:'Discount amount & final price' },
    { id:'tax',        label:'Tax / GST addition' },
    { id:'commission', label:'Commission calculator' },
    { id:'tip',        label:'Tip calculator & bill split' },
    { id:'marks',      label:'Marks percentage' },
    { id:'attendance', label:'Attendance percentage' },
  ];
  let mode = 'of';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="pct-mode"></select>
          </div>
          <div id="pct-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="pct-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="pct-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="pct-result"></div>
      </div>
    `;
    const sel = document.getElementById('pct-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');

    // If this page was opened via a shared link (#calc/percentage?s=...),
    // restore the mode + field values it encoded, then auto-calculate.
    const shared = Router.pendingShareParams;
    if (shared && shared.mode) { mode = shared.mode; Router.pendingShareParams = null; }

    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('pct-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('pct-result'), 'Choose a calculation type and fill in the values.');

    if (shared) {
      Object.keys(shared).forEach(key => {
        if (key === 'mode') return;
        const el = document.getElementById(key);
        if (el) el.value = shared[key];
      });
      compute();
    }

    document.getElementById('pct-calc').addEventListener('click', compute);
    document.getElementById('pct-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('pct-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'of': return `
        <div class="field-grid f1">
          <div class="field"><label>Percentage <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="18"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
          <div class="field"><label>Of number <span class="req">*</span></label>
            <input type="number" class="input" id="pf-num" placeholder="2500">
            <span class="field-err" id="pf-num-err"></span>
          </div>
        </div>`;
      case 'change': return `
        <div class="field-grid">
          <div class="field"><label>Original value <span class="req">*</span></label><input type="number" class="input" id="pf-old" placeholder="200"><span class="field-err" id="pf-old-err"></span></div>
          <div class="field"><label>New value <span class="req">*</span></label><input type="number" class="input" id="pf-new" placeholder="250"><span class="field-err" id="pf-new-err"></span></div>
        </div>`;
      case 'increase': case 'decrease': return `
        <div class="field-grid">
          <div class="field"><label>Base value <span class="req">*</span></label><input type="number" class="input" id="pf-base" placeholder="500"><span class="field-err" id="pf-base-err"></span></div>
          <div class="field"><label>Percentage <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="20"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
        </div>`;
      case 'reverse': return `
        <div class="field-grid">
          <div class="field"><label>Result value (after %) <span class="req">*</span></label><input type="number" class="input" id="pf-result" placeholder="590"><span class="field-err" id="pf-result-err"></span></div>
          <div class="field"><label>Percentage applied <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="18"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
        </div>
        <div class="select-inline" style="margin-top:6px;">
          <span class="chip-radio active" data-rev="increase">Was an increase</span>
          <span class="chip-radio" data-rev="decrease">Was a decrease</span>
        </div>`;
      case 'successive': return `
        <div class="field-grid">
          <div class="field"><label>Base value <span class="req">*</span></label><input type="number" class="input" id="pf-base" placeholder="1000"><span class="field-err" id="pf-base-err"></span></div>
          <div class="field"><label>First % (+/-) <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-p1" placeholder="-10"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-p1-err"></span>
          </div>
          <div class="field"><label>Second % (+/-) <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-p2" placeholder="-5"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-p2-err"></span>
          </div>
        </div>
        <div class="info-box">Use negative numbers for discounts/decreases, positive for increases. Example: two discounts of 10% then 5%.</div>`;
      case 'discount': return `
        <div class="field-grid">
          <div class="field"><label>Marked price (MRP) <span class="req">*</span></label><input type="number" class="input" id="pf-mrp" placeholder="1200"><span class="field-err" id="pf-mrp-err"></span></div>
          <div class="field"><label>Discount % <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="25"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
        </div>`;
      case 'tax': return `
        <div class="field-grid">
          <div class="field"><label>Base amount <span class="req">*</span></label><input type="number" class="input" id="pf-base" placeholder="1000"><span class="field-err" id="pf-base-err"></span></div>
          <div class="field"><label>Tax / GST rate <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="18"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
        </div>`;
      case 'commission': return `
        <div class="field-grid">
          <div class="field"><label>Sale amount <span class="req">*</span></label><input type="number" class="input" id="pf-base" placeholder="50000"><span class="field-err" id="pf-base-err"></span></div>
          <div class="field"><label>Commission rate <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="5"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
        </div>`;
      case 'tip': return `
        <div class="field-grid">
          <div class="field"><label>Bill amount <span class="req">*</span></label><input type="number" class="input" id="pf-base" placeholder="1200"><span class="field-err" id="pf-base-err"></span></div>
          <div class="field"><label>Tip percentage <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pf-pct" placeholder="10"><span class="suffix">%</span></div>
            <span class="field-err" id="pf-pct-err"></span>
          </div>
        </div>
        <div class="field" style="margin-top:12px;">
          <label>Split between</label>
          <select class="input" id="pf-split">
            ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}">${n} ${n===1?'person':'people'}</option>`).join('')}
          </select>
        </div>`;
      case 'marks': return `
        <div class="field-grid">
          <div class="field"><label>Marks obtained <span class="req">*</span></label><input type="number" class="input" id="pf-obt" placeholder="432"><span class="field-err" id="pf-obt-err"></span></div>
          <div class="field"><label>Maximum marks <span class="req">*</span></label><input type="number" class="input" id="pf-max" placeholder="500"><span class="field-err" id="pf-max-err"></span></div>
        </div>`;
      case 'attendance': return `
        <div class="field-grid">
          <div class="field"><label>Classes attended <span class="req">*</span></label><input type="number" class="input" id="pf-obt" placeholder="78"><span class="field-err" id="pf-obt-err"></span></div>
          <div class="field"><label>Total classes held <span class="req">*</span></label><input type="number" class="input" id="pf-max" placeholder="90"><span class="field-err" id="pf-max-err"></span></div>
        </div>`;
      default: return '';
    }
  }

  let reverseDirection = 'increase';

  function renderFields(){
    document.getElementById('pct-fields').innerHTML = fieldsFor(mode);
    Combobox.scan(document.getElementById('pct-fields'));
    if (mode === 'reverse') {
      reverseDirection = 'increase';
      document.querySelectorAll('[data-rev]').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('[data-rev]').forEach(x=>x.classList.remove('active'));
          el.classList.add('active');
          reverseDirection = el.getAttribute('data-rev');
        });
      });
    }
  }

  function num(id, label, errs){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    return Util.toNum(v);
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('pct-result');
    const errs = [];
    // clear old field errors first
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));

    let out;
    try {
      switch(mode){
        case 'of': {
          const pct = num('pf-pct','Percentage',errs), n = num('pf-num','Number',errs);
          if (errs.length) break;
          const val = (pct/100) * n;
          out = { label:'Result', value: Util.fmt(val), sub:`${Util.fmt(pct)}% of ${Util.fmt(n)}`,
            steps:[`${Util.fmt(pct)}% of ${Util.fmt(n)} = (${Util.fmt(pct)} ÷ 100) × ${Util.fmt(n)}`, `= ${Util.fmt(pct/100)} × ${Util.fmt(n)} = <b>${Util.fmt(val)}</b>`],
            expr:`${Util.fmt(pct)}% of ${Util.fmt(n)}`, raw: val };
          break;
        }
        case 'change': {
          const o = num('pf-old','Original value',errs), nn = num('pf-new','New value',errs);
          if (errs.length) break;
          if (o === 0) { errs.push(['pf-old','Original value cannot be zero']); break; }
          const diff = nn - o;
          const pct = (diff/o)*100;
          const isInc = diff >= 0;
          out = { label: isInc ? 'Increase' : 'Decrease', value:(isInc?'+':'')+Util.fmt(pct), unit:'%',
            valueClass: isInc?'pos':'neg',
            sub:`From ${Util.fmt(o)} to ${Util.fmt(nn)}`,
            extras:[{k:'Absolute change', v:Util.fmt(diff)}],
            steps:[`% change = (New − Old) ÷ Old × 100`, `= (${Util.fmt(nn)} − ${Util.fmt(o)}) ÷ ${Util.fmt(o)} × 100`, `= ${Util.fmt(diff)} ÷ ${Util.fmt(o)} × 100 = <b>${Util.fmt(pct)}%</b>`],
            expr:`% change from ${Util.fmt(o)} to ${Util.fmt(nn)}`, raw: pct };
          break;
        }
        case 'increase': case 'decrease': {
          const base = num('pf-base','Base value',errs), pct = num('pf-pct','Percentage',errs);
          if (errs.length) break;
          const sign = mode === 'increase' ? 1 : -1;
          const delta = base * (pct/100) * sign;
          const val = base + delta;
          out = { label: mode==='increase'?'Increased value':'Decreased value', value: Util.fmt(val),
            sub:`${Util.fmt(base)} ${mode==='increase'?'+':'−'} ${Util.fmt(pct)}%`,
            extras:[{k:'Change amount', v:(mode==='increase'?'+':'−')+Util.fmt(Math.abs(delta))}],
            steps:[`${mode==='increase'?'Increase':'Decrease'} = ${Util.fmt(base)} × ${Util.fmt(pct)}% = ${Util.fmt(Math.abs(delta))}`, `Result = ${Util.fmt(base)} ${mode==='increase'?'+':'−'} ${Util.fmt(Math.abs(delta))} = <b>${Util.fmt(val)}</b>`],
            expr:`${Util.fmt(base)} ${mode==='increase'?'increased':'decreased'} by ${Util.fmt(pct)}%`, raw: val };
          break;
        }
        case 'reverse': {
          const result = num('pf-result','Result value',errs), pct = num('pf-pct','Percentage',errs);
          if (errs.length) break;
          const factor = reverseDirection === 'increase' ? (1 + pct/100) : (1 - pct/100);
          if (factor === 0) { errs.push(['pf-pct','This percentage makes the original value undefined']); break; }
          const original = result / factor;
          out = { label:'Original value', value: Util.fmt(original),
            sub:`Before a ${pct}% ${reverseDirection}`,
            steps:[`Original = Result ÷ (1 ${reverseDirection==='increase'?'+':'−'} %) `, `= ${Util.fmt(result)} ÷ ${Util.fmt(factor)} = <b>${Util.fmt(original)}</b>`],
            expr:`Reverse ${pct}% ${reverseDirection} from ${Util.fmt(result)}`, raw: original };
          break;
        }
        case 'successive': {
          const base = num('pf-base','Base value',errs), p1 = num('pf-p1','First %',errs), p2 = num('pf-p2','Second %',errs);
          if (errs.length) break;
          const afterFirst = base * (1 + p1/100);
          const afterSecond = afterFirst * (1 + p2/100);
          const netPct = ((afterSecond - base) / base) * 100;
          out = { label:'Final value', value: Util.fmt(afterSecond),
            sub:`Net effective change: ${netPct>=0?'+':''}${Util.fmt(netPct)}%`,
            extras:[{k:'After first %', v:Util.fmt(afterFirst)}, {k:'Net % vs single', v:(netPct>=0?'+':'')+Util.fmt(netPct)+'%'}],
            steps:[`After 1st: ${Util.fmt(base)} × (1 ${p1>=0?'+':''}${Util.fmt(p1/100)}) = ${Util.fmt(afterFirst)}`,
                   `After 2nd: ${Util.fmt(afterFirst)} × (1 ${p2>=0?'+':''}${Util.fmt(p2/100)}) = <b>${Util.fmt(afterSecond)}</b>`,
                   `Net change vs. simply adding ${Util.fmt(p1+p2)}%: actual is ${Util.fmt(netPct)}%`],
            expr:`${Util.fmt(base)} with ${Util.fmt(p1)}% then ${Util.fmt(p2)}%`, raw: afterSecond };
          break;
        }
        case 'discount': {
          const mrp = num('pf-mrp','Marked price',errs), pct = num('pf-pct','Discount %',errs);
          if (errs.length) break;
          const discAmt = mrp * (pct/100);
          const final = mrp - discAmt;
          out = { label:'Final price', value: Util.fmt(final),
            sub:`After ${Util.fmt(pct)}% discount on ${Util.fmt(mrp)}`,
            extras:[{k:'Discount amount', v:'−'+Util.fmt(discAmt)}, {k:'You save', v:Util.fmt(discAmt)}],
            steps:[`Discount = ${Util.fmt(mrp)} × ${Util.fmt(pct)}% = ${Util.fmt(discAmt)}`, `Final price = ${Util.fmt(mrp)} − ${Util.fmt(discAmt)} = <b>${Util.fmt(final)}</b>`],
            expr:`${Util.fmt(mrp)} with ${Util.fmt(pct)}% discount`, raw: final };
          break;
        }
        case 'tax': {
          const base = num('pf-base','Base amount',errs), pct = num('pf-pct','Tax rate',errs);
          if (errs.length) break;
          const taxAmt = base * (pct/100);
          const total = base + taxAmt;
          out = { label:'Total (incl. tax)', value: Util.fmt(total),
            sub:`${Util.fmt(base)} + ${Util.fmt(pct)}% tax`,
            extras:[{k:'Tax amount', v:'+'+Util.fmt(taxAmt)}],
            steps:[`Tax = ${Util.fmt(base)} × ${Util.fmt(pct)}% = ${Util.fmt(taxAmt)}`, `Total = ${Util.fmt(base)} + ${Util.fmt(taxAmt)} = <b>${Util.fmt(total)}</b>`],
            expr:`${Util.fmt(base)} plus ${Util.fmt(pct)}% tax`, raw: total };
          break;
        }
        case 'commission': {
          const base = num('pf-base','Sale amount',errs), pct = num('pf-pct','Commission rate',errs);
          if (errs.length) break;
          const comm = base * (pct/100);
          out = { label:'Commission earned', value: Util.fmt(comm),
            sub:`${Util.fmt(pct)}% of ${Util.fmt(base)}`,
            extras:[{k:'Net to seller', v:Util.fmt(base-comm)}],
            steps:[`Commission = ${Util.fmt(base)} × ${Util.fmt(pct)}% = <b>${Util.fmt(comm)}</b>`],
            expr:`${Util.fmt(pct)}% commission on ${Util.fmt(base)}`, raw: comm };
          break;
        }
        case 'tip': {
          const base = num('pf-base','Bill amount',errs), pct = num('pf-pct','Tip percentage',errs);
          if (errs.length) break;
          const splitEl = document.getElementById('pf-split');
          const split = splitEl ? Util.clamp(Math.round(Util.toNum(splitEl.value,1)),1,10) : 1;
          const tip = base * (pct/100);
          const total = base + tip;
          const perPerson = total / split;
          out = { label:'Total bill (incl. tip)', value: Util.fmt(total),
            sub:`${Util.fmt(base)} bill + ${Util.fmt(pct)}% tip`,
            extras: split > 1
              ? [{k:'Tip amount', v:Util.fmt(tip)}, {k:`Per person (${split})`, v:Util.fmt(perPerson)}]
              : [{k:'Tip amount', v:Util.fmt(tip)}],
            steps:[
              `Tip = ${Util.fmt(base)} × ${Util.fmt(pct)}% = <b>${Util.fmt(tip)}</b>`,
              `Total = ${Util.fmt(base)} + ${Util.fmt(tip)} = <b>${Util.fmt(total)}</b>`,
              ...(split > 1 ? [`Per person = ${Util.fmt(total)} ÷ ${split} = <b>${Util.fmt(perPerson)}</b>`] : [])
            ],
            expr:`${Util.fmt(pct)}% tip on ${Util.fmt(base)}${split>1?` split ${split} ways`:''}`, raw: total };
          break;
        }
        case 'marks': case 'attendance': {
          const obt = num('pf-obt', mode==='marks'?'Marks obtained':'Classes attended', errs);
          const max = num('pf-max', mode==='marks'?'Maximum marks':'Total classes', errs);
          if (errs.length) break;
          if (max === 0) { errs.push(['pf-max','Total cannot be zero']); break; }
          if (obt > max) { errs.push(['pf-obt', (mode==='marks'?'Marks obtained':'Classes attended') + ' cannot exceed the total']); break; }
          const pct = (obt/max)*100;
          let grade = '';
          if (mode==='marks') {
            grade = pct>=90?'A+':pct>=80?'A':pct>=70?'B+':pct>=60?'B':pct>=50?'C':pct>=40?'D':'F';
          }
          out = { label: mode==='marks'?'Percentage':'Attendance', value: Util.fmt(pct), unit:'%',
            valueClass: mode==='attendance' && pct<75 ? 'neg':'pos',
            sub: mode==='marks' ? `Grade: ${grade}` : (pct<75?'Below typical 75% requirement':'Meets typical 75% requirement'),
            steps:[`${Util.fmt(obt)} ÷ ${Util.fmt(max)} × 100 = <b>${Util.fmt(pct)}%</b>`],
            expr:`${Util.fmt(obt)} out of ${Util.fmt(max)}`, raw: pct };
          break;
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id, msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;

    const resultText = out.value + (out.unit || '');
    // Collect current field values so a "Share" link can reproduce this exact
    // calculation when opened fresh (see Router.pendingShareParams + render()).
    const shareParams = { mode };
    document.querySelectorAll('#pct-fields input').forEach(inp => { shareParams[inp.id] = inp.value; });
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), unit: out.unit, valueClass: out.valueClass,
      sub: out.sub, extras: out.extras, steps: out.steps,
      plainValue: resultText, copyText: `${out.expr} = ${resultText}`,
      shareParams,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'percentage', calcLabel:'Percentage Master', expr: out.expr, resultText, resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 3. PROFIT & LOSS ---------------- */
Calculators.profitloss = (function(){
  const MODES = [
    { id:'basic',    label:'Profit / Loss from CP & SP' },
    { id:'findsp',   label:'Find SP from CP & desired profit/loss %' },
    { id:'findcp',   label:'Find CP from SP & profit/loss %' },
    { id:'markup',   label:'Marked price & discount → SP, profit%' },
  ];
  let mode = 'basic';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="pl-mode"></select>
          </div>
          <div id="pl-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="pl-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="pl-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="pl-result"></div>
      </div>
    `;
    const sel = document.getElementById('pl-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('pl-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('pl-result'), 'Enter values to calculate profit or loss.');
    document.getElementById('pl-calc').addEventListener('click', compute);
    document.getElementById('pl-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('pl-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'basic': return `
        <div class="field-grid">
          <div class="field"><label>Cost Price (CP) <span class="req">*</span></label><input type="number" class="input" id="pl-cp" placeholder="800"><span class="field-err" id="pl-cp-err"></span></div>
          <div class="field"><label>Selling Price (SP) <span class="req">*</span></label><input type="number" class="input" id="pl-sp" placeholder="950"><span class="field-err" id="pl-sp-err"></span></div>
        </div>`;
      case 'findsp': return `
        <div class="field-grid">
          <div class="field"><label>Cost Price (CP) <span class="req">*</span></label><input type="number" class="input" id="pl-cp" placeholder="800"><span class="field-err" id="pl-cp-err"></span></div>
          <div class="field"><label>Desired profit/loss % <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pl-pct" placeholder="15"><span class="suffix">%</span></div>
            <span class="hint">Use negative for a planned loss</span>
            <span class="field-err" id="pl-pct-err"></span>
          </div>
        </div>`;
      case 'findcp': return `
        <div class="field-grid">
          <div class="field"><label>Selling Price (SP) <span class="req">*</span></label><input type="number" class="input" id="pl-sp" placeholder="920"><span class="field-err" id="pl-sp-err"></span></div>
          <div class="field"><label>Profit/loss % <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pl-pct" placeholder="15"><span class="suffix">%</span></div>
            <span class="hint">Use negative if it was sold at a loss</span>
            <span class="field-err" id="pl-pct-err"></span>
          </div>
        </div>`;
      case 'markup': return `
        <div class="field-grid">
          <div class="field"><label>Cost Price (CP) <span class="req">*</span></label><input type="number" class="input" id="pl-cp" placeholder="600"><span class="field-err" id="pl-cp-err"></span></div>
          <div class="field"><label>Marked Price (MP) <span class="req">*</span></label><input type="number" class="input" id="pl-mp" placeholder="900"><span class="field-err" id="pl-mp-err"></span></div>
          <div class="field"><label>Discount on MP <span class="req">*</span></label>
            <div class="input-suffix-wrap"><input type="number" class="input" id="pl-pct" placeholder="10"><span class="suffix">%</span></div>
            <span class="field-err" id="pl-pct-err"></span>
          </div>
        </div>`;
      default: return '';
    }
  }
  function renderFields(){ document.getElementById('pl-fields').innerHTML = fieldsFor(mode); }

  function num(id, label, errs){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    return Util.toNum(v);
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('pl-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    if (mode === 'basic') {
      const cp = num('pl-cp','Cost Price',errs), sp = num('pl-sp','Selling Price',errs);
      if (!errs.length) {
        if (cp <= 0) { errs.push(['pl-cp','Cost Price must be greater than zero']); }
        else {
          const diff = sp - cp;
          const pct = (diff/cp)*100;
          const isProfit = diff >= 0;
          out = {
            label: isProfit ? 'Profit' : 'Loss',
            value: Util.fmt(Math.abs(diff)),
            valueClass: isProfit ? 'pos':'neg',
            sub: `${Util.fmt(Math.abs(pct))}% ${isProfit?'profit':'loss'}`,
            extras:[{k:'CP', v:Util.fmt(cp)},{k:'SP', v:Util.fmt(sp)}],
            steps:[`${isProfit?'Profit':'Loss'} = SP − CP = ${Util.fmt(sp)} − ${Util.fmt(cp)} = ${Util.fmt(diff)}`,
                   `${isProfit?'Profit':'Loss'}% = (${isProfit?'Profit':'Loss'} ÷ CP) × 100 = <b>${Util.fmt(Math.abs(pct))}%</b>`],
            expr:`CP ${Util.fmt(cp)}, SP ${Util.fmt(sp)}`, raw: diff
          };
        }
      }
    } else if (mode === 'findsp') {
      const cp = num('pl-cp','Cost Price',errs), pct = num('pl-pct','Percentage',errs);
      if (!errs.length) {
        if (cp <= 0) { errs.push(['pl-cp','Cost Price must be greater than zero']); }
        else {
          const sp = cp * (1 + pct/100);
          const isProfit = pct >= 0;
          out = {
            label:'Selling Price needed', value: Util.fmt(sp), valueClass: isProfit?'pos':'neg',
            sub:`For a ${Util.fmt(Math.abs(pct))}% ${isProfit?'profit':'loss'}`,
            steps:[`SP = CP × (1 ${pct>=0?'+':'−'} ${Util.fmt(Math.abs(pct))}%) = ${Util.fmt(cp)} × ${Util.fmt(1+pct/100)}`, `= <b>${Util.fmt(sp)}</b>`],
            expr:`SP for CP ${Util.fmt(cp)} at ${Util.fmt(pct)}%`, raw: sp
          };
        }
      }
    } else if (mode === 'findcp') {
      const sp = num('pl-sp','Selling Price',errs), pct = num('pl-pct','Percentage',errs);
      if (!errs.length) {
        const factor = 1 + pct/100;
        if (factor === 0) { errs.push(['pl-pct','This percentage makes CP undefined (100% loss)']); }
        else {
          const cp = sp / factor;
          const isProfit = pct >= 0;
          out = {
            label:'Cost Price', value: Util.fmt(cp),
            sub:`If sold at ${Util.fmt(Math.abs(pct))}% ${isProfit?'profit':'loss'}`,
            steps:[`CP = SP ÷ (1 ${pct>=0?'+':'−'} ${Util.fmt(Math.abs(pct))}%) = ${Util.fmt(sp)} ÷ ${Util.fmt(factor)}`, `= <b>${Util.fmt(cp)}</b>`],
            expr:`CP for SP ${Util.fmt(sp)} at ${Util.fmt(pct)}%`, raw: cp
          };
        }
      }
    } else if (mode === 'markup') {
      const cp = num('pl-cp','Cost Price',errs), mp = num('pl-mp','Marked Price',errs), pct = num('pl-pct','Discount %',errs);
      if (!errs.length) {
        if (cp <= 0) { errs.push(['pl-cp','Cost Price must be greater than zero']); }
        else {
          const discAmt = mp * (pct/100);
          const sp = mp - discAmt;
          const profit = sp - cp;
          const profitPct = (profit/cp)*100;
          const isProfit = profit >= 0;
          out = {
            label:'Selling Price', value: Util.fmt(sp),
            sub:`Resulting ${isProfit?'profit':'loss'}: ${Util.fmt(Math.abs(profitPct))}%`,
            valueClass: isProfit?'pos':'neg',
            extras:[{k:'Discount given', v:Util.fmt(discAmt)},{k:isProfit?'Profit':'Loss', v:Util.fmt(Math.abs(profit))}],
            steps:[`SP = MP − Discount = ${Util.fmt(mp)} − ${Util.fmt(discAmt)} = ${Util.fmt(sp)}`,
                   `${isProfit?'Profit':'Loss'} = SP − CP = ${Util.fmt(sp)} − ${Util.fmt(cp)} = ${Util.fmt(profit)}`,
                   `${isProfit?'Profit':'Loss'}% = <b>${Util.fmt(Math.abs(profitPct))}%</b>`],
            expr:`CP ${Util.fmt(cp)}, MP ${Util.fmt(mp)}, ${Util.fmt(pct)}% discount`, raw: sp
          };
        }
      }
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    const resultText = out.value;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), valueClass: out.valueClass, sub: out.sub,
      extras: out.extras, steps: out.steps, plainValue: resultText, copyText: `${out.expr} → ${out.label}: ${resultText}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'profitloss', calcLabel:'Profit & Loss', expr: out.expr, resultText, resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 4. FINANCE SUITE ---------------- */
Calculators.finance = (function(){
  const MODES = [
    { id:'si',        label:'Simple Interest' },
    { id:'ci',        label:'Compound Interest' },
    { id:'emi',       label:'Loan EMI' },

  function render(container){

      <div class="calc-layout">

          <div class="field" style="margin-bottom:14px;">

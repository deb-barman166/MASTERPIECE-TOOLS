      bit:{label:'Bits',f:0.125}, byte:{label:'Bytes (B)',f:1}, kb:{label:'Kilobytes (KB)',f:1024}, mb:{label:'Megabytes (MB)',f:1048576}, gb:{label:'Gigabytes (GB)',f:1073741824}, tb:{label:'Terabytes (TB)',f:1099511627776}
    }},
  };
  const CAT_ORDER = ['length','area','volume','mass','temperature','speed','time','pressure','energy','power','force','angle','frequency','data'];

  let cat = 'length';
  let fromU = 'km', toU = 'mi';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="uc-pinned-bar" id="uc-pinned-bar"></div>
          <div class="field" style="margin-bottom:14px;">
            <label>Category</label>
            <select class="input" id="uc-cat"></select>
          </div>
          <div class="field-grid">
            <div class="field">
              <label>From</label>
              <select class="input" id="uc-from"></select>
              <input type="number" class="input" id="uc-val" placeholder="Enter value" style="margin-top:8px;" value="1">
            </div>
            <div class="field">
              <label>To</label>
              <select class="input" id="uc-to"></select>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost btn-sm" id="uc-swap">⇅ Swap units</button>
            <button class="btn btn-ghost btn-sm" id="uc-pin-toggle">${icon('star')} <span id="uc-pin-label">Pin this pair</span></button>
          </div>
          <div class="info-box" id="uc-temp-note" style="display:none;">Temperature uses non-linear conversion formulas (not a simple multiply).</div>
        </div>
        <div class="result-panel" id="uc-result"></div>
      </div>
    `;
    const catSel = document.getElementById('uc-cat');
    catSel.innerHTML = CAT_ORDER.map(c => `<option value="${c}">${c==='temperature'?'Temperature':CATS[c].label}</option>`).join('');
    catSel.value = cat;
    catSel.addEventListener('change', () => { cat = catSel.value; resetUnitsForCat(); populateUnitSelects(); compute(); renderPinnedBar(); updatePinButton(); });

    populateUnitSelects();
    renderPinnedBar();
    updatePinButton();

    document.getElementById('uc-val').addEventListener('input', Util.debounce(compute, 150));
    document.getElementById('uc-from').addEventListener('change', () => { fromU = document.getElementById('uc-from').value; compute(); updatePinButton(); });
    document.getElementById('uc-to').addEventListener('change', () => { toU = document.getElementById('uc-to').value; compute(); updatePinButton(); });
    document.getElementById('uc-swap').addEventListener('click', () => {
      const f = document.getElementById('uc-from'), t = document.getElementById('uc-to');
      const tmp = f.value; f.value = t.value; t.value = tmp;
      fromU = f.value; toU = t.value;
      f.dispatchEvent(new Event('change'));
      t.dispatchEvent(new Event('change'));
      compute();
      updatePinButton();
    });
    document.getElementById('uc-pin-toggle').addEventListener('click', () => {
      const nowPinned = MState.toggleConversionPin(cat, fromU, toU);
      Toast.show(nowPinned ? 'Pair pinned' : 'Pair unpinned', 'ok');
      updatePinButton();
      renderPinnedBar();
    });

    compute();
  }

  function updatePinButton(){
    const btn = document.getElementById('uc-pin-toggle');
    const label = document.getElementById('uc-pin-label');
    if (!btn) return;
    const pinned = MState.isConversionPinned(cat, fromU, toU);
    btn.classList.toggle('is-pinned-btn', pinned);
    if (label) label.textContent = pinned ? 'Pinned' : 'Pin this pair';
  }

  function renderPinnedBar(){
    const bar = document.getElementById('uc-pinned-bar');
    if (!bar) return;
    if (!MState.pinnedConversions.length) { bar.innerHTML = ''; bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    bar.innerHTML = MState.pinnedConversions.map(p => {
      const catLabel = p.cat === 'temperature' ? 'Temperature' : (CATS[p.cat] ? CATS[p.cat].label : p.cat);
      const fromLabel = p.cat === 'temperature' ? (TEMP_LABELS[p.from]||p.from).split(' (')[0] : (CATS[p.cat] && CATS[p.cat].units[p.from] ? CATS[p.cat].units[p.from].label.split(' (')[0] : p.from);
      const toLabel = p.cat === 'temperature' ? (TEMP_LABELS[p.to]||p.to).split(' (')[0] : (CATS[p.cat] && CATS[p.cat].units[p.to] ? CATS[p.cat].units[p.to].label.split(' (')[0] : p.to);
      return `<button class="uc-pin-chip" data-pin-cat="${p.cat}" data-pin-from="${p.from}" data-pin-to="${p.to}" title="${Util.esc(catLabel)}">
        ${Util.esc(fromLabel)} → ${Util.esc(toLabel)}
      </button>`;
    }).join('');
    bar.querySelectorAll('.uc-pin-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        cat = chip.getAttribute('data-pin-cat');
        const targetFrom = chip.getAttribute('data-pin-from');
        const targetTo = chip.getAttribute('data-pin-to');
        const catSel = document.getElementById('uc-cat');
        catSel.value = cat;
        catSel.dispatchEvent(new Event('change')); // triggers resetUnitsForCat()+populateUnitSelects() AND syncs the category combobox's visible label
        // The category's change handler just reset fromU/toU to that category's
        // defaults — now override with the pinned pair's actual units.
        fromU = targetFrom; toU = targetTo;
        const fromSel = document.getElementById('uc-from'), toSel = document.getElementById('uc-to');
        fromSel.value = fromU; toSel.value = toU;
        fromSel.dispatchEvent(new Event('change')); // syncs that combobox's visible label too
        toSel.dispatchEvent(new Event('change'));
        compute();
        renderPinnedBar();
        updatePinButton();
      });
    });
  }

  function resetUnitsForCat(){
    if (cat === 'temperature') { fromU = 'c'; toU = 'f'; return; }
    const keys = Object.keys(CATS[cat].units);
    fromU = keys[0]; toU = keys[1] || keys[0];
  }

  const TEMP_LABELS = { c:'Celsius (°C)', f:'Fahrenheit (°F)', k:'Kelvin (K)' };

  function populateUnitSelects(){
    document.getElementById('uc-temp-note').style.display = cat === 'temperature' ? 'block' : 'none';
    const fromSel = document.getElementById('uc-from'), toSel = document.getElementById('uc-to');
    let optsHTML;
    if (cat === 'temperature') {
      optsHTML = Object.entries(TEMP_LABELS).map(([code,label]) => `<option value="${code}">${label}</option>`).join('');
    } else {
      const units = CATS[cat].units;
      optsHTML = Object.entries(units).map(([code,u]) => `<option value="${code}">${Util.esc(u.label)}</option>`).join('');
    }
    fromSel.innerHTML = optsHTML; toSel.innerHTML = optsHTML;
    fromSel.value = fromU; toSel.value = toU;
  }

  function tempToCelsius(v, unit){
    if (unit==='c') return v;
    if (unit==='f') return (v-32)*5/9;
    if (unit==='k') return v-273.15;
  }
  function celsiusTo(v, unit){
    if (unit==='c') return v;
    if (unit==='f') return v*9/5+32;
    if (unit==='k') return v+273.15;
  }

  function compute(){
    const resEl = document.getElementById('uc-result');
    const valEl = document.getElementById('uc-val');
    const v = valEl.value;
    ErrBanner.clear();
    valEl.classList.remove('err');
    if (v === '' ) { ResultPanel.empty(resEl, 'Enter a value to convert.'); return; }
    if (!Util.isNum(v)) { valEl.classList.add('err'); ResultPanel.error(resEl, 'Please enter a valid number'); return; }
    const num = Util.toNum(v);

    let result, fromLabel, toLabel;
    if (cat === 'temperature') {
      if (fromU==='k' && num < 0) { valEl.classList.add('err'); ResultPanel.error(resEl, 'Kelvin cannot be negative (absolute zero is 0K)'); return; }
      const celsius = tempToCelsius(num, fromU);
      if (celsius < -273.15) { valEl.classList.add('err'); ResultPanel.error(resEl, 'Temperature is below absolute zero'); return; }
      result = celsiusTo(celsius, toU);
      fromLabel = {c:'°C',f:'°F',k:'K'}[fromU]; toLabel = {c:'°C',f:'°F',k:'K'}[toU];
    } else {
      const units = CATS[cat].units;
      const fBase = num * units[fromU].f;
      result = fBase / units[toU].f;
      fromLabel = fromU; toLabel = toU;
    }

    const resultText = Util.fmt(result);
    ResultPanel.render(resEl, {
      label: `${Util.fmt(num)} ${fromLabel} equals`,
      value: Util.esc(resultText), unit: toLabel,
      plainValue: resultText,
      copyText: `${Util.fmt(num)} ${fromLabel} = ${resultText} ${toLabel}`,
      onReset: () => { document.getElementById('uc-val').value='1'; compute(); }
    });
    MState.addHistory({ calcId:'unitconvert', calcLabel:'Unit Converter', expr:`${Util.fmt(num)} ${fromLabel} → ${toLabel}`, resultText: resultText+' '+toLabel, resultRaw: result });
  }

  return { render, CATS, CAT_ORDER }; // exposed for Universal calculator reuse
})();

/* ---------------- 10. DATE & TIME ---------------- */
Calculators.datetime = (function(){
  const MODES = [
    { id:'age',       label:'Age calculator' },
    { id:'diff',      label:'Date difference' },
    { id:'countdown', label:'Countdown to a date (live)' },
    { id:'addsub',    label:'Add / subtract days' },
    { id:'leapyear',  label:'Leap year checker' },
    { id:'timeconv',  label:'Time unit conversion' },
  ];
  let mode = 'age';
  let countdownTimer = null;

  function stopCountdown(){
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="dt-mode"></select>
          </div>
          <div id="dt-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="dt-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="dt-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="dt-result"></div>
      </div>
    `;
    const sel = document.getElementById('dt-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { stopCountdown(); mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('dt-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('dt-result'), 'Enter dates to calculate.');
    document.getElementById('dt-calc').addEventListener('click', compute);
    document.getElementById('dt-reset').addEventListener('click', () => { stopCountdown(); renderFields(); ResultPanel.empty(document.getElementById('dt-result')); ErrBanner.clear(); });
    container._cleanup = () => stopCountdown();
  }

  function fieldsFor(m){
    switch(m){
      case 'age': return `
        <div class="field-grid">
          <div class="field"><label>Date of birth <span class="req">*</span></label><input type="date" class="input" id="dt-birth"><span class="field-err" id="dt-birth-err"></span></div>
          <div class="field"><label>As of date</label><input type="date" class="input" id="dt-asof" value="${todayStr()}"><span class="field-err" id="dt-asof-err"></span></div>
        </div>`;
      case 'diff': return `
        <div class="field-grid">
          <div class="field"><label>Start date <span class="req">*</span></label><input type="date" class="input" id="dt-start"><span class="field-err" id="dt-start-err"></span></div>
          <div class="field"><label>End date <span class="req">*</span></label><input type="date" class="input" id="dt-end" value="${todayStr()}"><span class="field-err" id="dt-end-err"></span></div>
        </div>`;
      case 'countdown': return `
        <div class="field-grid">
          <div class="field"><label>Target date <span class="req">*</span></label><input type="date" class="input" id="dt-target"><span class="field-err" id="dt-target-err"></span></div>
          <div class="field"><label>Target time</label><input type="time" class="input" id="dt-targettime" value="00:00"></div>
        </div>
        <div class="field" style="margin-top:8px;"><label>What's this for? (optional)</label><input type="text" class="input" id="dt-targetlabel" placeholder="e.g. Project deadline, Birthday"></div>`;
      case 'addsub': return `
        <div class="field-grid">
          <div class="field"><label>Start date <span class="req">*</span></label><input type="date" class="input" id="dt-base" value="${todayStr()}"><span class="field-err" id="dt-base-err"></span></div>
          <div class="field"><label>Number of days <span class="req">*</span></label><input type="number" class="input" id="dt-days" placeholder="30" step="1"><span class="field-err" id="dt-days-err"></span></div>
        </div>
        <div class="select-inline" style="margin-top:6px;">
          <span class="chip-radio active" data-op="add">Add</span>
          <span class="chip-radio" data-op="sub">Subtract</span>
        </div>`;
      case 'leapyear': return `
        <div class="field-grid f1">
          <div class="field"><label>Year <span class="req">*</span></label><input type="number" class="input" id="dt-year" placeholder="2024" step="1"><span class="field-err" id="dt-year-err"></span></div>
        </div>`;
      case 'timeconv': return `
        <div class="field-grid">
          <div class="field"><label>Value <span class="req">*</span></label><input type="number" class="input" id="dt-val" placeholder="90"><span class="field-err" id="dt-val-err"></span></div>
          <div class="field"><label>From unit</label>
            <select class="input" id="dt-from"><option value="sec">Seconds</option><option value="min" selected>Minutes</option><option value="hr">Hours</option><option value="day">Days</option><option value="week">Weeks</option></select>
          </div>
        </div>
        <div class="info-box">Converts to all other time units at once — see the result panel.</div>`;
      default: return '';
    }
  }
  let addOp = 'add';
  function renderFields(){
    document.getElementById('dt-fields').innerHTML = fieldsFor(mode);
    Combobox.scan(document.getElementById('dt-fields'));
    if (mode === 'addsub') {
      addOp = 'add';
      document.querySelectorAll('[data-op]').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('[data-op]').forEach(x=>x.classList.remove('active'));
          el.classList.add('active'); addOp = el.getAttribute('data-op');
        });
      });

  }

  function computeCountdown(resEl){
    stopCountdown();
    const dateEl = document.getElementById('dt-target');
    const timeEl = document.getElementById('dt-targettime');
    const labelEl = document.getElementById('dt-targetlabel');
    if (!dateEl.value) {
      document.getElementById('dt-target-err').textContent = 'Target date is required';
      dateEl.classList.add('err');
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    const [y,m,d] = dateEl.value.split('-').map(Number);
    const [hh,mm] = (timeEl.value || '00:00').split(':').map(Number);
    const target = new Date(y, m-1, d, hh, mm, 0);
    const label = (labelEl.value || '').trim();

    function tick(){
      const now = new Date();
      const diffMs = target.getTime() - now.getTime();
      const past = diffMs < 0;
      const absMs = Math.abs(diffMs);
      const totalSec = Math.floor(absMs/1000);
      const days = Math.floor(totalSec/86400);
      const hrs = Math.floor((totalSec%86400)/3600);
      const mins = Math.floor((totalSec%3600)/60);
      const secs = totalSec%60;
      resEl.innerHTML = `
        <div class="result-card">
          <div class="result-main">
            <div class="rm-label">${past ? 'TIME SINCE' : 'COUNTING DOWN TO'}${label ? ' · ' + Util.esc(label) : ''}</div>
            <div class="countdown-grid">
              <div class="cd-unit"><span class="cd-num">${days}</span><span class="cd-label">days</span></div>
              <div class="cd-unit"><span class="cd-num">${String(hrs).padStart(2,'0')}</span><span class="cd-label">hrs</span></div>
              <div class="cd-unit"><span class="cd-num">${String(mins).padStart(2,'0')}</span><span class="cd-label">min</span></div>
              <div class="cd-unit"><span class="cd-num">${String(secs).padStart(2,'0')}</span><span class="cd-label">sec</span></div>
            </div>
            <div class="rm-sub" style="margin-top:10px;">${past ? 'Passed' : 'Target'}: ${Util.esc(target.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}))}</div>
          </div>
          <div class="result-actions">
            <button class="btn btn-ghost btn-sm" id="cd-stop">${icon('reset')} Stop & reset</button>
          </div>
        </div>`;
      const stopBtn = document.getElementById('cd-stop');
      if (stopBtn) stopBtn.addEventListener('click', () => { stopCountdown(); renderFields(); ResultPanel.empty(resEl); });
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
    MState.addHistory({ calcId:'datetime', calcLabel:'Date & Time', expr:`Countdown to ${dateEl.value}${label?' ('+label+')':''}`, resultText: target.toLocaleDateString(), resultRaw: target.getTime() });
  }

  function parseDate(id, label, errs){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!v) { errs.push([id, label + ' is required']); return null; }
    const parts = v.split('-').map(Number);
    const d = new Date(parts[0], parts[1]-1, parts[2]);
    if (isNaN(d.getTime())) { errs.push([id, 'Invalid date']); return null; }
    return d;
  }
  function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); } // m is 1-indexed month

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('dt-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    if (mode === 'countdown') { computeCountdown(resEl); return; }

    try {
      if (mode === 'age') {
        const birth = parseDate('dt-birth','Date of birth',errs);
        const asofEl = document.getElementById('dt-asof');
        const asof = asofEl.value ? parseDate('dt-asof','As-of date',errs) : new Date();
        if (!errs.length) {
          if (birth > asof) { errs.push(['dt-birth','Date of birth must be before the as-of date']); }
          else {
            let years = asof.getFullYear() - birth.getFullYear();
            let months = asof.getMonth() - birth.getMonth();
            let days = asof.getDate() - birth.getDate();
            if (days < 0) { months--; days += daysInMonth(asof.getFullYear(), asof.getMonth()); }
            if (months < 0) { years--; months += 12; }
            const totalDays = Math.round((asof-birth)/86400000);
            out = { label:'Age', value:`${years}y ${months}m ${days}d`,
              extras:[{k:'Total days lived', v:Util.fmt(totalDays)},{k:'Total weeks', v:Util.fmt(Math.floor(totalDays/7))},{k:'Next birthday in', v: nextBirthdayText(birth, asof)}],
              steps:[`From ${Util.fmtDate(birth.getTime())} to ${Util.fmtDate(asof.getTime())}`, `= <b>${years} years, ${months} months, ${days} days</b>`],
              expr:`Age from ${birth.toISOString().slice(0,10)}`, raw: years };
          }
        }
      } else if (mode === 'diff') {
        const start = parseDate('dt-start','Start date',errs), end = parseDate('dt-end','End date',errs);
        if (!errs.length) {
          const [earlier, later] = start <= end ? [start,end] : [end,start];
          const totalDays = Math.round((later-earlier)/86400000);
          const weeks = Math.floor(totalDays/7), remDays = totalDays%7;
          out = { label:'Difference', value: Util.fmt(totalDays)+' days',
            extras:[{k:'In weeks', v:`${weeks}w ${remDays}d`},{k:'In months (approx)', v:Util.fmt(totalDays/30.44)},{k:'In years (approx)', v:Util.fmt(totalDays/365.25)}],
            steps:[`|${Util.fmtDate(end.getTime())} − ${Util.fmtDate(start.getTime())}| = <b>${totalDays} days</b>`],
            expr:`Days between ${start.toISOString().slice(0,10)} and ${end.toISOString().slice(0,10)}`, raw: totalDays };
        }
      } else if (mode === 'addsub') {
        const base = parseDate('dt-base','Start date',errs);
        const daysEl = document.getElementById('dt-days');
        const days = Util.isNum(daysEl.value) ? Util.toNum(daysEl.value) : NaN;
        if (isNaN(days)) errs.push(['dt-days','Number of days is required']);
        if (!errs.length) {
          const result = new Date(base);
          result.setDate(result.getDate() + (addOp==='add' ? days : -days));
          const weekday = result.toLocaleDateString(undefined, {weekday:'long'});
          out = { label:`Resulting date`, value: Util.fmtDate(result.getTime()),
            sub: weekday,
            steps:[`${Util.fmtDate(base.getTime())} ${addOp==='add'?'+':'−'} ${Util.fmt(days)} days = <b>${Util.fmtDate(result.getTime())}</b>`],
            expr:`${base.toISOString().slice(0,10)} ${addOp==='add'?'+':'−'} ${days}d`, raw: result.getTime() };
        }
      } else if (mode === 'leapyear') {
        const yEl = document.getElementById('dt-year');
        const y = Util.isNum(yEl.value) ? Math.round(Util.toNum(yEl.value)) : NaN;
        if (isNaN(y)) { errs.push(['dt-year','Year is required']); }
        else {
          const leap = isLeap(y);
          out = { label: leap?'Leap year':'Not a leap year', value: leap?'Yes ✓':'No', valueClass: leap?'pos':'neg',
            sub: `${y} has ${leap?366:365} days`,
            steps:[`Divisible by 4? ${y%4===0?'Yes':'No'}`, `Divisible by 100? ${y%100===0?'Yes':'No'}`, `Divisible by 400? ${y%400===0?'Yes':'No'}`, `Rule: leap if (÷4 and not ÷100) or ÷400 → <b>${leap?'Leap year':'Not a leap year'}</b>`],
            expr:`Is ${y} a leap year?`, raw: leap };
        }
      } else if (mode === 'timeconv') {
        const valEl = document.getElementById('dt-val');
        const fromU = document.getElementById('dt-from').value;
        if (!Util.isNum(valEl.value)) { errs.push(['dt-val','Value is required']); }
        else {
          const v = Util.toNum(valEl.value);
          const toSec = {sec:1,min:60,hr:3600,day:86400,week:604800};
          const secs = v * toSec[fromU];
          out = { label: 'In seconds', value: Util.fmt(secs),
            extras:[
              {k:'Minutes', v:Util.fmt(secs/60)},{k:'Hours', v:Util.fmt(secs/3600)},
              {k:'Days', v:Util.fmt(secs/86400)},{k:'Weeks', v:Util.fmt(secs/604800)},
            ],
            steps:[`${Util.fmt(v)} ${fromU} = <b>${Util.fmt(secs)} seconds</b>`], expr:`${Util.fmt(v)} ${fromU} to all units`, raw: secs };
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), valueClass: out.valueClass, sub: out.sub, extras: out.extras, steps: out.steps,
      plainValue: out.value, copyText: `${out.expr} → ${out.label}: ${out.value}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'datetime', calcLabel:'Date & Time', expr: out.expr, resultText: out.value, resultRaw: out.raw });
  }

  function nextBirthdayText(birth, asof){
    let next = new Date(asof.getFullYear(), birth.getMonth(), birth.getDate());
    if (next < asof || (next.getFullYear()===asof.getFullYear() && next.getMonth()===asof.getMonth() && next.getDate()===asof.getDate())) {
      if (next < asof) next = new Date(asof.getFullYear()+1, birth.getMonth(), birth.getDate());
    }
    const days = Math.round((next-asof)/86400000);
    return days === 0 ? 'Today! 🎉' : `${days} days`;
  }

  return { render };
})();

/* ---------------- 11. STUDENT TOOLS ---------------- */
Calculators.student = (function(){
  const MODES = [
    { id:'percentage', label:'Marks percentage & grade' },
    { id:'average',    label:'Simple average of scores' },
    { id:'weighted',   label:'Weighted average (credits/weights)' },
    { id:'gpa',        label:'GPA calculator (4.0 scale)' },
    { id:'cgpa',       label:'CGPA to Percentage (10-point scale)' },
    { id:'required',   label:'Required marks for target average' },
    { id:'attendance', label:'Attendance percentage' },
  ];
  let mode = 'percentage';
  const GPA_SCALE = {'A+':4.0,'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'C-':1.7,'D+':1.3,'D':1.0,'F':0.0};

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="su-mode"></select>
          </div>
          <div id="su-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="su-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="su-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="su-result"></div>
      </div>
    `;
    const sel = document.getElementById('su-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('su-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('su-result'), 'Enter values to calculate.');
    document.getElementById('su-calc').addEventListener('click', compute);
    document.getElementById('su-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('su-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'percentage': return `
        <div class="field-grid">
          <div class="field"><label>Marks obtained <span class="req">*</span></label><input type="number" class="input" id="su-obt" placeholder="432"><span class="field-err" id="su-obt-err"></span></div>
          <div class="field"><label>Maximum marks <span class="req">*</span></label><input type="number" class="input" id="su-max" placeholder="500"><span class="field-err" id="su-max-err"></span></div>
        </div>`;
      case 'average': return `
        <div class="field f1">
          <label>Scores (comma separated) <span class="req">*</span></label>
          <textarea class="input" id="su-scores" rows="2" placeholder="78, 85, 92, 67, 74"></textarea>
          <span class="field-err" id="su-scores-err"></span>
        </div>`;
      case 'weighted': return `
        <div class="field f1">
          <label>Score:Weight pairs, one per line <span class="req">*</span></label>
          <textarea class="input" id="su-pairs" rows="4" placeholder="85:2\n90:3\n70:1"></textarea>
          <span class="hint">Format: score:weight — e.g. exam score 85 with weight 2 (like credit hours)</span>
          <span class="field-err" id="su-pairs-err"></span>
        </div>`;
      case 'gpa': return `
        <div class="field f1">
          <label>Grade:Credits pairs, one per line <span class="req">*</span></label>
          <textarea class="input" id="su-gpa-pairs" rows="4" placeholder="A:3\nB+:4\nA-:3"></textarea>
          <span class="hint">Valid grades: A+ A A- B+ B B- C+ C C- D+ D F</span>
          <span class="field-err" id="su-gpa-pairs-err"></span>
        </div>`;
      case 'cgpa': return `
        <div class="field f1">
          <label>CGPA (out of 10) <span class="req">*</span></label>
          <input type="number" class="input" id="su-cgpa" placeholder="8.4" step="0.01" min="0" max="10">
          <span class="hint">Uses the common multiplier of 9.5 (widely used by Indian universities incl. CBSE/AICTE-affiliated institutions) — always confirm with your specific institution, as some use a different factor.</span>
          <span class="field-err" id="su-cgpa-err"></span>
        </div>`;
      case 'required': return `
        <div class="field-grid">
          <div class="field"><label>Current average <span class="req">*</span></label><input type="number" class="input" id="su-curavg" placeholder="72"><span class="field-err" id="su-curavg-err"></span></div>
          <div class="field"><label>Exams/tests completed <span class="req">*</span></label><input type="number" class="input" id="su-donecount" placeholder="3" step="1"><span class="field-err" id="su-donecount-err"></span></div>
          <div class="field"><label>Total exams/tests <span class="req">*</span></label><input type="number" class="input" id="su-totalcount" placeholder="5" step="1"><span class="field-err" id="su-totalcount-err"></span></div>
          <div class="field"><label>Target overall average <span class="req">*</span></label><input type="number" class="input" id="su-target" placeholder="80"><span class="field-err" id="su-target-err"></span></div>
        </div>`;
      case 'attendance': return `
        <div class="field-grid">
          <div class="field"><label>Classes attended <span class="req">*</span></label><input type="number" class="input" id="su-obt" placeholder="78"><span class="field-err" id="su-obt-err"></span></div>
          <div class="field"><label>Total classes held <span class="req">*</span></label><input type="number" class="input" id="su-max" placeholder="90"><span class="field-err" id="su-max-err"></span></div>
        </div>`;
      default: return '';
    }
  }
  function renderFields(){ document.getElementById('su-fields').innerHTML = fieldsFor(mode); }

  function num(id, label, errs){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    return Util.toNum(v);
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('su-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input, textarea.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'percentage' || mode === 'attendance') {
        const obt = num('su-obt', mode==='percentage'?'Marks obtained':'Classes attended', errs);
        const max = num('su-max', mode==='percentage'?'Maximum marks':'Total classes', errs);
        if (!errs.length) {
          if (max === 0) errs.push(['su-max','Total cannot be zero']);
          else if (obt > max) errs.push(['su-obt', (mode==='percentage'?'Marks obtained':'Classes attended') + ' cannot exceed the total']);
          else if (obt < 0) errs.push(['su-obt','Cannot be negative']);
          else {
            const pct = (obt/max)*100;
            if (mode === 'percentage') {
              const grade = pct>=90?'A+':pct>=80?'A':pct>=70?'B+':pct>=60?'B':pct>=50?'C':pct>=40?'D':'F';
              out = { label:'Percentage', value: Util.fmt(pct), unit:'%', sub:`Grade: ${grade}`,
                steps:[`${Util.fmt(obt)} ÷ ${Util.fmt(max)} × 100 = <b>${Util.fmt(pct)}%</b> (Grade ${grade})`], expr:`${obt}/${max} marks`, raw: pct };
            } else {
              out = { label:'Attendance', value: Util.fmt(pct), unit:'%', valueClass: pct<75?'neg':'pos',
                sub: pct<75 ? 'Below typical 75% requirement' : 'Meets typical 75% requirement',
                steps:[`${Util.fmt(obt)} ÷ ${Util.fmt(max)} × 100 = <b>${Util.fmt(pct)}%</b>`], expr:`${obt}/${max} attendance`, raw: pct };
            }
          }
        }
      } else if (mode === 'average') {
        const raw = document.getElementById('su-scores').value;
        const scores = raw.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).map(Number);
        if (!raw.trim() || scores.some(isNaN) || !scores.length) { errs.push(['su-scores','Enter valid comma-separated numbers']); }
        else {
          const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
          out = { label:'Average', value: Util.fmt(avg), extras:[{k:'Highest', v:Util.fmt(Math.max(...scores))},{k:'Lowest', v:Util.fmt(Math.min(...scores))},{k:'Count', v:String(scores.length)}],
            steps:[`Average = Σscores ÷ count = ${Util.fmt(scores.reduce((a,b)=>a+b,0))} ÷ ${scores.length} = <b>${Util.fmt(avg)}</b>`], expr:`avg of [${scores.join(', ')}]`, raw: avg };
        }
      } else if (mode === 'weighted') {
        const raw = document.getElementById('su-pairs').value;
        const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
        if (!lines.length) { errs.push(['su-pairs','Enter at least one score:weight pair']); }
        else {
          const pairs = [];
          let bad = false;
          lines.forEach(l => {
            const [s,w] = l.split(':').map(x=>x && x.trim());
            const sn = Number(s), wn = Number(w);
            if (s===undefined || w===undefined || isNaN(sn) || isNaN(wn)) bad = true;
            else pairs.push([sn,wn]);
          });
          if (bad || !pairs.length) { errs.push(['su-pairs','Each line must be in the form score:weight, e.g. 85:2']); }
          else {
            const totalWeight = pairs.reduce((a,[,w])=>a+w,0);
            if (totalWeight === 0) { errs.push(['su-pairs','Total weight cannot be zero']); }
            else {
              const weightedSum = pairs.reduce((a,[s,w])=>a+s*w,0);
              const wavg = weightedSum/totalWeight;
              out = { label:'Weighted average', value: Util.fmt(wavg),
                steps:[`Σ(score×weight) ÷ Σweight = ${Util.fmt(weightedSum)} ÷ ${Util.fmt(totalWeight)} = <b>${Util.fmt(wavg)}</b>`],
                expr:`weighted avg of ${pairs.length} items`, raw: wavg };
            }
          }
        }
      } else if (mode === 'gpa') {
        const raw = document.getElementById('su-gpa-pairs').value;
        const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
        if (!lines.length) { errs.push(['su-gpa-pairs','Enter at least one grade:credits pair']); }
        else {
          const pairs = [];
          let bad = false, badGrade = null;
          lines.forEach(l => {
            const [g,c] = l.split(':').map(x=>x && x.trim());
            const cn = Number(c);
            if (!g || c===undefined || isNaN(cn)) { bad = true; return; }
            const gradeKey = g.toUpperCase();
            if (!(gradeKey in GPA_SCALE)) { badGrade = g; return; }
            pairs.push([gradeKey, cn]);
          });
          if (badGrade) { errs.push(['su-gpa-pairs', `Unknown grade "${badGrade}" — use A+ A A- B+ B B- C+ C C- D+ D F`]); }
          else if (bad || !pairs.length) { errs.push(['su-gpa-pairs','Each line must be grade:credits, e.g. A:3']); }
          else {
            const totalCredits = pairs.reduce((a,[,c])=>a+c,0);
            if (totalCredits === 0) { errs.push(['su-gpa-pairs','Total credits cannot be zero']); }
            else {
              const totalPoints = pairs.reduce((a,[g,c])=>a+GPA_SCALE[g]*c,0);
              const gpa = totalPoints/totalCredits;
              out = { label:'GPA', value: Util.fmt(gpa,{decimals:2}), extras:[{k:'Total credits', v:Util.fmt(totalCredits)},{k:'Quality points', v:Util.fmt(totalPoints)}],
                steps:[`GPA = Σ(grade points×credits) ÷ Σcredits = ${Util.fmt(totalPoints)} ÷ ${Util.fmt(totalCredits)} = <b>${Util.fmt(gpa)}</b>`],
                expr:`GPA from ${pairs.length} courses`, raw: gpa };
            }
          }
        }
      } else if (mode === 'cgpa') {
        const cgpa = num('su-cgpa','CGPA',errs);
        if (!errs.length) {
          if (cgpa < 0 || cgpa > 10) { errs.push(['su-cgpa','CGPA must be between 0 and 10']); }
          else {
            const pct = cgpa * 9.5;
            out = { label:'Equivalent percentage', value: Util.fmt(pct,{decimals:2}), unit:'%',
              sub:`${Util.fmt(cgpa)} CGPA × 9.5`,
              extras:[{k:'Formula used', v:'% = CGPA × 9.5'}],
              steps:[`Percentage = CGPA × 9.5 = ${Util.fmt(cgpa)} × 9.5 = <b>${Util.fmt(pct,{decimals:2})}%</b>`,
                     `This is the standard multiplier for CBSE/most AICTE-affiliated institutions — check your university's official conversion if this is for a formal application.`],
              expr:`${Util.fmt(cgpa)} CGPA to percentage`, raw: pct };
          }
        }
      } else if (mode === 'required') {
        const curavg = num('su-curavg','Current average',errs), done = num('su-donecount','Completed',errs), total = num('su-totalcount','Total',errs), target = num('su-target','Target average',errs);
        if (!errs.length) {
          if (!Number.isInteger(done) || !Number.isInteger(total) || done<0 || total<=0) { errs.push(['su-totalcount','Counts must be whole numbers, total > 0']); }
          else if (done > total) { errs.push(['su-donecount','Completed cannot exceed total']); }
          else if (done === total) { errs.push(['su-donecount','No remaining exams to plan for — all are already completed']); }
          else {
            const remaining = total - done;
            const neededAvg = (target*total - curavg*done) / remaining;
            const feasible = neededAvg <= 100 && neededAvg >= 0;
            out = { label:`Avg needed in remaining ${remaining}`, value: Util.fmt(neededAvg), unit:'%',
              valueClass: feasible ? 'pos' : 'neg',
              sub: neededAvg > 100 ? 'Not achievable even with 100% — target may be out of reach' : (neededAvg < 0 ? 'Target already secured!' : ''),
              steps:[`Needed total = target × total tests = ${Util.fmt(target)} × ${total} = ${Util.fmt(target*total)}`,
                     `Already earned = current avg × completed = ${Util.fmt(curavg)} × ${done} = ${Util.fmt(curavg*done)}`,
                     `Required avg = (needed total − already earned) ÷ remaining = <b>${Util.fmt(neededAvg)}%</b>`],
              expr:`Required avg for target ${target}%`, raw: neededAvg };
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), unit: out.unit, valueClass: out.valueClass, sub: out.sub, extras: out.extras, steps: out.steps,
      plainValue: out.value, copyText: `${out.expr} → ${out.label}: ${out.value}${out.unit||''}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'student', calcLabel:'Student Tools', expr: out.expr, resultText: out.value+(out.unit||''), resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 12. PHYSICS ---------------- */
Calculators.physics = (function(){
  const MODES = [
    { id:'speed',    label:'Speed, distance, time' },
    { id:'force',    label:'Force (F = ma)' },
    { id:'work',     label:'Work (W = Fd)' },
    { id:'ke',       label:'Kinetic energy' },
    { id:'pe',       label:'Potential energy' },
    { id:'power',    label:'Power (P = W/t)' },
    { id:'momentum', label:'Momentum (p = mv)' },
    { id:'density',  label:'Density (ρ = m/V)' },
    { id:'pressure', label:'Pressure (P = F/A)' },
  ];
  let mode = 'speed';
  let speedUnit = 'mps'; // 'mps' or 'kmph' — only affects the Speed field in the speed mode
  let speedFieldPrefill = null; // carries a converted value across a unit-toggle re-render

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="ph-mode"></select>
          </div>
          <div id="ph-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="ph-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="ph-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="ph-result"></div>
      </div>
    `;
    const sel = document.getElementById('ph-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('ph-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('ph-result'), 'Choose a formula and enter known values.');
    document.getElementById('ph-calc').addEventListener('click', compute);
    document.getElementById('ph-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('ph-result')); ErrBanner.clear(); });
  }

  // For solve-for-X style forms, we let the user choose which variable to solve for.
  const SPEC = {
    speed:    { vars:[['d','Distance (m)'],['t','Time (s)'],['v','Speed (m/s)']], solve:['v','d','t'] },
    force:    { vars:[['m','Mass (kg)'],['a','Acceleration (m/s²)'],['f','Force (N)']], solve:['f','m','a'] },
    work:     { vars:[['f','Force (N)'],['d','Distance (m)'],['w','Work (J)']], solve:['w','f','d'] },
    power:    { vars:[['w','Work (J)'],['t','Time (s)'],['p','Power (W)']], solve:['p','w','t'] },
    momentum: { vars:[['m','Mass (kg)'],['v','Velocity (m/s)'],['p','Momentum (kg·m/s)']], solve:['p','m','v'] },
    density:  { vars:[['m','Mass (kg)'],['vol','Volume (m³)'],['rho','Density (kg/m³)']], solve:['rho','m','vol'] },
    pressure: { vars:[['f','Force (N)'],['a','Area (m²)'],['p','Pressure (Pa)']], solve:['p','f','a'] },
  };
  let solveFor = {};

  function fieldsFor(m){
    if (m === 'ke') return `
      <div class="field-grid">
        <div class="field"><label>Mass (kg) <span class="req">*</span></label><input type="number" class="input" id="ph-m" placeholder="2"><span class="field-err" id="ph-m-err"></span></div>
        <div class="field"><label>Velocity (m/s) <span class="req">*</span></label><input type="number" class="input" id="ph-v" placeholder="3"><span class="field-err" id="ph-v-err"></span></div>
      </div>`;
    if (m === 'pe') return `
      <div class="field-grid">
        <div class="field"><label>Mass (kg) <span class="req">*</span></label><input type="number" class="input" id="ph-m" placeholder="2"><span class="field-err" id="ph-m-err"></span></div>
        <div class="field"><label>Height (m) <span class="req">*</span></label><input type="number" class="input" id="ph-h" placeholder="5"><span class="field-err" id="ph-h-err"></span></div>
        <div class="field"><label>Gravity g (m/s²)</label><input type="number" class="input" id="ph-g" placeholder="9.8" value="9.8"><span class="field-err" id="ph-g-err"></span></div>
      </div>`;
    const spec = SPEC[m];
    if (!spec) return '';
    if (!(m in solveFor)) solveFor[m] = spec.solve[0];
    const chips = spec.solve.map(key => {
      const label = spec.vars.find(v=>v[0]===key)[1].split(' (')[0];
      return `<span class="chip-radio ${solveFor[m]===key?'active':''}" data-solvevar="${key}">${Util.esc(label)}</span>`;
    }).join('');
    const inputVars = spec.vars.filter(([key]) => key !== solveFor[m]);
    const inputsHTML = inputVars.map(([key,label]) => {
      // Speed mode (feature 31): let the person enter/read velocity in km/h
      // instead of m/s. The toggle only appears next to the v field itself;
      // internally everything still computes in SI (m/s) at the boundary.
      if (m === 'speed' && key === 'v') {
        const displayLabel = speedUnit === 'kmph' ? 'Speed (km/h)' : 'Speed (m/s)';
        const prefill = speedFieldPrefill !== null ? speedFieldPrefill : '';
        return `<div class="field">
          <label style="display:flex;align-items:center;justify-content:space-between;">
            <span>${Util.esc(displayLabel)} <span class="req">*</span></span>
            <span class="unit-toggle" id="ph-speed-unit-toggle">
              <button type="button" class="unit-toggle-opt ${speedUnit==='mps'?'active':''}" data-unit="mps">m/s</button>
              <button type="button" class="unit-toggle-opt ${speedUnit==='kmph'?'active':''}" data-unit="kmph">km/h</button>
            </span>
          </label>
          <input type="number" class="input" id="ph-v" placeholder="e.g. 10" value="${Util.esc(String(prefill))}"><span class="field-err" id="ph-v-err"></span>
        </div>`;
      }
      return `<div class="field"><label>${Util.esc(label)} <span class="req">*</span></label><input type="number" class="input" id="ph-${key}" placeholder="e.g. 10"><span class="field-err" id="ph-${key}-err"></span></div>`;
    }).join('');
    return `<div class="field" style="margin-bottom:10px;"><label>Solve for</label><div class="select-inline">${chips}</div></div>
      <div class="field-grid">${inputsHTML}</div>`;
  }

  function renderFields(){
    document.getElementById('ph-fields').innerHTML = fieldsFor(mode);
    document.querySelectorAll('[data-solvevar]').forEach(el => {
      el.addEventListener('click', () => { solveFor[mode] = el.getAttribute('data-solvevar'); speedFieldPrefill = null; renderFields(); });
    });
    document.querySelectorAll('.unit-toggle-opt').forEach(el => {
      el.addEventListener('click', () => {
        const newUnit = el.getAttribute('data-unit');
        if (newUnit === speedUnit) return;
        // Convert whatever value is currently typed so switching units doesn't
        // silently change the physical quantity the person meant to enter.
        const vInput = document.getElementById('ph-v');
        speedFieldPrefill = null;
        if (vInput && vInput.value !== '' && Util.isNum(vInput.value)) {
          const cur = Util.toNum(vInput.value);
          speedFieldPrefill = newUnit === 'kmph' ? Util.fmt(cur*3.6, {decimals:4}) : Util.fmt(cur/3.6, {decimals:4});
        }
        speedUnit = newUnit;
        renderFields();
      });
    });
  }

  function num(id, label, errs){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    return Util.toNum(v);
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('ph-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'ke') {
        const m = num('ph-m','Mass',errs), v = num('ph-v','Velocity',errs);
        if (!errs.length) { const ke = 0.5*m*v*v;
          out = { label:'Kinetic Energy', value: Util.fmt(ke), unit:'J', steps:[`KE = ½mv² = ½×${Util.fmt(m)}×${Util.fmt(v)}² = <b>${Util.fmt(ke)} J</b>`], expr:`KE m=${m}kg v=${v}m/s`, raw: ke };
        }
      } else if (mode === 'pe') {
        const m = num('ph-m','Mass',errs), h = num('ph-h','Height',errs);
        const gEl = document.getElementById('ph-g');
        const g = gEl.value !== '' ? Util.toNum(gEl.value) : 9.8;
        if (!errs.length) { const pe = m*g*h;
          out = { label:'Potential Energy', value: Util.fmt(pe), unit:'J', steps:[`PE = mgh = ${Util.fmt(m)}×${Util.fmt(g)}×${Util.fmt(h)} = <b>${Util.fmt(pe)} J</b>`], expr:`PE m=${m}kg h=${h}m`, raw: pe };
        }
      } else {
        const spec = SPEC[mode];
        const target = solveFor[mode];
        const inputVars = spec.vars.filter(([key]) => key !== target);
        const vals = {};
        inputVars.forEach(([key,label]) => { vals[key] = num('ph-'+key, label, errs); });
        // Speed mode (feature 31): the v field may be entered in km/h — convert
        // to m/s at this boundary so every formula below stays in SI throughout.
        if (mode === 'speed' && 'v' in vals && speedUnit === 'kmph' && !isNaN(vals.v)) {
          vals.v = vals.v / 3.6;
        }
        if (!errs.length) {
          let result, formula, unit, label;
          if (mode === 'speed') {
            if (target==='v') { if(vals.t===0){errs.push(['ph-t','Time cannot be zero']);} else {result=vals.d/vals.t; formula=`v = d ÷ t = ${Util.fmt(vals.d)} ÷ ${Util.fmt(vals.t)}`; unit='m/s'; label='Speed';
              if (speedUnit === 'kmph') { result = result*3.6; formula += ` = ${Util.fmt(vals.d/vals.t)} m/s`; unit='km/h'; }
            } }
            else if (target==='d') { result=vals.v*vals.t; formula=`d = v × t = ${Util.fmt(vals.v)} × ${Util.fmt(vals.t)}`; unit='m'; label='Distance'; }
            else { if(vals.v===0){errs.push(['ph-v','Speed cannot be zero']);} else {result=vals.d/vals.v; formula=`t = d ÷ v = ${Util.fmt(vals.d)} ÷ ${Util.fmt(vals.v)}`; unit='s'; label='Time';} }
          } else if (mode === 'force') {
            if (target==='f') { result=vals.m*vals.a; formula=`F = m × a = ${Util.fmt(vals.m)} × ${Util.fmt(vals.a)}`; unit='N'; label='Force'; }
            else if (target==='m') { if(vals.a===0){errs.push(['ph-a','Acceleration cannot be zero']);} else {result=vals.f/vals.a; formula=`m = F ÷ a`; unit='kg'; label='Mass';} }
            else { if(vals.m===0){errs.push(['ph-m','Mass cannot be zero']);} else {result=vals.f/vals.m; formula=`a = F ÷ m`; unit='m/s²'; label='Acceleration';} }
          } else if (mode === 'work') {
            if (target==='w') { result=vals.f*vals.d; formula=`W = F × d = ${Util.fmt(vals.f)} × ${Util.fmt(vals.d)}`; unit='J'; label='Work'; }
            else if (target==='f') { if(vals.d===0){errs.push(['ph-d','Distance cannot be zero']);} else {result=vals.w/vals.d; formula=`F = W ÷ d`; unit='N'; label='Force';} }
            else { if(vals.f===0){errs.push(['ph-f','Force cannot be zero']);} else {result=vals.w/vals.f; formula=`d = W ÷ F`; unit='m'; label='Distance';} }
          } else if (mode === 'power') {
            if (target==='p') { if(vals.t===0){errs.push(['ph-t','Time cannot be zero']);} else {result=vals.w/vals.t; formula=`P = W ÷ t`; unit='W'; label='Power';} }
            else if (target==='w') { result=vals.p*vals.t; formula=`W = P × t`; unit='J'; label='Work'; }
            else { if(vals.p===0){errs.push(['ph-p','Power cannot be zero']);} else {result=vals.w/vals.p; formula=`t = W ÷ P`; unit='s'; label='Time';} }
          } else if (mode === 'momentum') {
            if (target==='p') { result=vals.m*vals.v; formula=`p = m × v`; unit='kg·m/s'; label='Momentum'; }
            else if (target==='m') { if(vals.v===0){errs.push(['ph-v','Velocity cannot be zero']);} else {result=vals.p/vals.v; formula=`m = p ÷ v`; unit='kg'; label='Mass';} }
            else { if(vals.m===0){errs.push(['ph-m','Mass cannot be zero']);} else {result=vals.p/vals.m; formula=`v = p ÷ m`; unit='m/s'; label='Velocity';} }
          } else if (mode === 'density') {
            if (target==='rho') { if(vals.vol===0){errs.push(['ph-vol','Volume cannot be zero']);} else {result=vals.m/vals.vol; formula=`ρ = m ÷ V`; unit='kg/m³'; label='Density';} }
            else if (target==='m') { result=vals.rho*vals.vol; formula=`m = ρ × V`; unit='kg'; label='Mass'; }
            else { if(vals.rho===0){errs.push(['ph-rho','Density cannot be zero']);} else {result=vals.m/vals.rho; formula=`V = m ÷ ρ`; unit='m³'; label='Volume';} }
          } else if (mode === 'pressure') {
            if (target==='p') { if(vals.a===0){errs.push(['ph-a','Area cannot be zero']);} else {result=vals.f/vals.a; formula=`P = F ÷ A`; unit='Pa'; label='Pressure';} }
            else if (target==='f') { result=vals.p*vals.a; formula=`F = P × A`; unit='N'; label='Force'; }
            else { if(vals.p===0){errs.push(['ph-p','Pressure cannot be zero']);} else {result=vals.f/vals.p; formula=`A = F ÷ P`; unit='m²'; label='Area';} }
          }
          if (!errs.length) {
            out = { label, value: Util.fmt(result), unit, steps:[`${formula} = <b>${Util.fmt(result)} ${unit}</b>`], expr:`${mode} solve for ${label}`, raw: result };
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), unit: out.unit, steps: out.steps,
      plainValue: out.value+' '+out.unit, copyText: `${out.expr} → ${out.label}: ${out.value} ${out.unit}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'physics', calcLabel:'Physics', expr: out.expr, resultText: out.value+' '+out.unit, resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 13. ELECTRONICS ---------------- */
Calculators.electronics = (function(){
  const MODES = [
    { id:'ohm',        label:"Ohm's Law (V, I, R)" },
    { id:'power',      label:'Electrical power (P = VI)' },
    { id:'seriesR',    label:'Series resistance' },
    { id:'parallelR',  label:'Parallel resistance' },
    { id:'divider',    label:'Voltage divider' },
    { id:'ledR',       label:'LED resistor calculator' },
    { id:'rc',         label:'RC time constant' },
    { id:'db',         label:'Decibel (dB) calculator' },
  ];
  let mode = 'ohm';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="el-mode"></select>
          </div>
          <div id="el-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="el-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="el-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="el-result"></div>
      </div>
    `;
    const sel = document.getElementById('el-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('el-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('el-result'), 'Choose a calculation and enter known values.');
    document.getElementById('el-calc').addEventListener('click', compute);
    document.getElementById('el-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('el-result')); ErrBanner.clear(); });
  }

  let ohmSolve = 'v';
  function fieldsFor(m){
    switch(m){
      case 'ohm': {
        const chips = ['v','i','r'].map(k => `<span class="chip-radio ${ohmSolve===k?'active':''}" data-ohm="${k}">${k.toUpperCase()}</span>`).join('');
        const labels = {v:'Voltage (V)', i:'Current (A)', r:'Resistance (Ω)'};
        const need = ['v','i','r'].filter(k=>k!==ohmSolve);
        return `<div class="field" style="margin-bottom:10px;"><label>Solve for</label><div class="select-inline">${chips}</div></div>
          <div class="field-grid">${need.map(k=>`<div class="field"><label>${labels[k]} <span class="req">*</span></label><input type="number" class="input" id="el-${k}" placeholder="e.g. 10"><span class="field-err" id="el-${k}-err"></span></div>`).join('')}</div>`;
      }
      case 'power': return `
        <div class="field-grid">
          <div class="field"><label>Voltage (V)</label><input type="number" class="input" id="el-v" placeholder="12"><span class="field-err" id="el-v-err"></span></div>
          <div class="field"><label>Current (A)</label><input type="number" class="input" id="el-i" placeholder="2"><span class="field-err" id="el-i-err"></span></div>
        </div>`;
      case 'seriesR': case 'parallelR': return `
        <div class="field f1">
          <label>Resistor values (Ω), comma separated <span class="req">*</span></label>
          <textarea class="input" id="el-rs" rows="2" placeholder="100, 220, 330"></textarea>
          <span class="field-err" id="el-rs-err"></span>
        </div>`;
      case 'divider': return `
        <div class="field-grid">
          <div class="field"><label>Input voltage Vin</label><input type="number" class="input" id="el-vin" placeholder="12"><span class="field-err" id="el-vin-err"></span></div>
          <div class="field"><label>R1 (Ω, top)</label><input type="number" class="input" id="el-r1" placeholder="1000"><span class="field-err" id="el-r1-err"></span></div>
          <div class="field"><label>R2 (Ω, bottom)</label><input type="number" class="input" id="el-r2" placeholder="2000"><span class="field-err" id="el-r2-err"></span></div>
        </div>
        <div class="info-box">Vout is measured across R2 (the bottom resistor).</div>`;
      case 'ledR': return `
        <div class="field-grid">
          <div class="field"><label>Supply voltage (V)</label><input type="number" class="input" id="el-vs" placeholder="5"><span class="field-err" id="el-vs-err"></span></div>
          <div class="field"><label>LED forward voltage (V)</label><input type="number" class="input" id="el-vled" placeholder="2"><span class="field-err" id="el-vled-err"></span></div>
          <div class="field"><label>Desired current (mA)</label><input type="number" class="input" id="el-ima" placeholder="20"><span class="field-err" id="el-ima-err"></span></div>
        </div>`;
      case 'rc': return `
        <div class="field-grid">
          <div class="field"><label>Resistance (Ω)</label><input type="number" class="input" id="el-r" placeholder="1000"><span class="field-err" id="el-r-err"></span></div>
          <div class="field"><label>Capacitance (µF)</label><input type="number" class="input" id="el-c" placeholder="1"><span class="field-err" id="el-c-err"></span></div>
        </div>`;
      case 'db': return `
        <div class="select-inline" style="margin-bottom:10px;">
          <span class="chip-radio active" data-dbtype="voltage">Voltage ratio</span>
          <span class="chip-radio" data-dbtype="power">Power ratio</span>
        </div>
        <div class="field-grid">
          <div class="field"><label>Output level (V₂ or P₂)</label><input type="number" class="input" id="el-p2" placeholder="10"><span class="field-err" id="el-p2-err"></span></div>
          <div class="field"><label>Reference level (V₁ or P₁)</label><input type="number" class="input" id="el-p1" placeholder="1"><span class="field-err" id="el-p1-err"></span></div>
        </div>`;
      default: return '';
    }
  }
  let dbType = 'voltage';
  function renderFields(){
    document.getElementById('el-fields').innerHTML = fieldsFor(mode);
    if (mode === 'ohm') {
      document.querySelectorAll('[data-ohm]').forEach(el => el.addEventListener('click', () => { ohmSolve = el.getAttribute('data-ohm'); renderFields(); }));
    }
    if (mode === 'db') {
      dbType = 'voltage';
      document.querySelectorAll('[data-dbtype]').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('[data-dbtype]').forEach(x=>x.classList.remove('active'));
          el.classList.add('active'); dbType = el.getAttribute('data-dbtype');
        });
      });
    }
  }

  function num(id, label, errs){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    return Util.toNum(v);
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('el-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input, textarea.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'ohm') {
        if (ohmSolve === 'v') { const i=num('el-i','Current',errs), r=num('el-r','Resistance',errs);
          if(!errs.length){ const v=i*r; out={label:'Voltage',value:Util.fmt(v),unit:'V',steps:[`V = I × R = ${Util.fmt(i)} × ${Util.fmt(r)} = <b>${Util.fmt(v)} V</b>`],expr:`V=IR I=${i}A R=${r}Ω`,raw:v}; } }
        else if (ohmSolve === 'i') { const v=num('el-v','Voltage',errs), r=num('el-r','Resistance',errs);
          if(!errs.length){ if(r===0){errs.push(['el-r','Resistance cannot be zero']);} else { const i=v/r; out={label:'Current',value:Util.fmt(i),unit:'A',steps:[`I = V ÷ R = ${Util.fmt(v)} ÷ ${Util.fmt(r)} = <b>${Util.fmt(i)} A</b>`],expr:`I=V/R V=${v}V R=${r}Ω`,raw:i}; } } }
        else { const v=num('el-v','Voltage',errs), i=num('el-i','Current',errs);
          if(!errs.length){ if(i===0){errs.push(['el-i','Current cannot be zero']);} else { const r=v/i; out={label:'Resistance',value:Util.fmt(r),unit:'Ω',steps:[`R = V ÷ I = ${Util.fmt(v)} ÷ ${Util.fmt(i)} = <b>${Util.fmt(r)} Ω</b>`],expr:`R=V/I V=${v}V I=${i}A`,raw:r}; } } }
      } else if (mode === 'power') {
        const v=num('el-v','Voltage',errs), i=num('el-i','Current',errs);
        if(!errs.length){ const p=v*i; out={label:'Power',value:Util.fmt(p),unit:'W',steps:[`P = V × I = ${Util.fmt(v)} × ${Util.fmt(i)} = <b>${Util.fmt(p)} W</b>`],expr:`P=VI V=${v}V I=${i}A`,raw:p}; }
      } else if (mode === 'seriesR' || mode === 'parallelR') {
        const raw = document.getElementById('el-rs').value;
        const rs = raw.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).map(Number);
        if (!raw.trim() || rs.some(isNaN) || rs.some(r=>r<=0) || !rs.length) { errs.push(['el-rs','Enter valid positive resistor values, comma separated']); }
        else if (mode === 'seriesR') {
          const total = rs.reduce((a,b)=>a+b,0);
          out = { label:'Total resistance', value: Util.fmt(total), unit:'Ω', steps:[`R_total = ${rs.map(Util.fmt).join(' + ')} = <b>${Util.fmt(total)} Ω</b>`], expr:`series [${rs.join(', ')}]`, raw: total };
        } else {
          const invSum = rs.reduce((a,b)=>a+1/b,0);
          const total = 1/invSum;
          out = { label:'Total resistance', value: Util.fmt(total), unit:'Ω', steps:[`1/R_total = ${rs.map(r=>'1/'+Util.fmt(r)).join(' + ')}`, `R_total = <b>${Util.fmt(total)} Ω</b>`], expr:`parallel [${rs.join(', ')}]`, raw: total };
        }
      } else if (mode === 'divider') {
        const vin=num('el-vin','Vin',errs), r1=num('el-r1','R1',errs), r2=num('el-r2','R2',errs);
        if(!errs.length){ if(r1+r2===0){errs.push(['el-r1','R1+R2 cannot both be zero']);} else { const vout=vin*r2/(r1+r2);
          out={label:'Vout',value:Util.fmt(vout),unit:'V',steps:[`Vout = Vin × R2 ÷ (R1+R2) = ${Util.fmt(vin)} × ${Util.fmt(r2)} ÷ ${Util.fmt(r1+r2)} = <b>${Util.fmt(vout)} V</b>`],expr:`divider Vin=${vin} R1=${r1} R2=${r2}`,raw:vout}; } }
      } else if (mode === 'ledR') {
        const vs=num('el-vs','Supply voltage',errs), vled=num('el-vled','LED forward voltage',errs), ima=num('el-ima','Desired current',errs);
        if(!errs.length){
          if (vled >= vs) { errs.push(['el-vled','LED forward voltage must be less than supply voltage']); }
          else if (ima <= 0) { errs.push(['el-ima','Current must be greater than zero']); }
          else { const amps = ima/1000; const r = (vs-vled)/amps;
            out={label:'Resistor needed',value:Util.fmt(r),unit:'Ω',steps:[`R = (Vsupply − Vled) ÷ I = (${Util.fmt(vs)} − ${Util.fmt(vled)}) ÷ ${Util.fmt(amps)} = <b>${Util.fmt(r)} Ω</b>`],expr:`LED Vs=${vs} Vled=${vled} I=${ima}mA`,raw:r};
          }
        }
      } else if (mode === 'rc') {
        const r=num('el-r','Resistance',errs), cUf=num('el-c','Capacitance',errs);
        if(!errs.length){ const c = cUf/1e6; const tau = r*c;
          out={label:'Time constant τ',value:Util.fmt(tau),unit:'s',extras:[{k:'In milliseconds', v:Util.fmt(tau*1000)}],
            steps:[`τ = R × C = ${Util.fmt(r)} × ${Util.fmt(cUf)}µF = <b>${Util.fmt(tau)} s</b>`],expr:`RC R=${r}Ω C=${cUf}µF`,raw:tau};
        }
      } else if (mode === 'db') {
        const p2=num('el-p2','Output level',errs), p1=num('el-p1','Reference level',errs);
        if(!errs.length){
          if (p1 <= 0 || p2 <= 0) { errs.push(['el-p1','Both levels must be greater than zero']); }
          else { const mult = dbType==='voltage'?20:10; const db = mult*Math.log10(p2/p1);
            out={label:'Decibels',value:Util.fmt(db),unit:'dB',steps:[`dB = ${mult}×log₁₀(${Util.fmt(p2)}/${Util.fmt(p1)}) = <b>${Util.fmt(db)} dB</b>`],expr:`dB ${dbType} ratio ${p2}/${p1}`,raw:db};
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), unit: out.unit, extras: out.extras, steps: out.steps,
      plainValue: out.value+' '+out.unit, copyText: `${out.expr} → ${out.label}: ${out.value} ${out.unit}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'electronics', calcLabel:'Electronics', expr: out.expr, resultText: out.value+' '+out.unit, resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 14. PROGRAMMER ---------------- */
Calculators.programmer = (function(){
  const MODES = [
    { id:'baseconv',  label:'Base conversion (bin/oct/dec/hex)' },
    { id:'bitvisual', label:'Bit visualizer (click to toggle)' },
    { id:'bitwise',   label:'Bitwise operations' },
    { id:'ascii',     label:'ASCII / Unicode lookup' },
    { id:'datasize',  label:'Data size conversion' },
  ];
  let mode = 'baseconv';
  let bitState = new Array(32).fill(0); // bitvisual mode's live bit state, index 0 = MSB (bit 31)

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="pg-mode"></select>
          </div>
          <div id="pg-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="pg-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="pg-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="pg-result"></div>
      </div>
    `;
    const sel = document.getElementById('pg-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('pg-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('pg-result'), 'Enter a value to convert or compute.');
    document.getElementById('pg-calc').addEventListener('click', compute);
    document.getElementById('pg-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('pg-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'baseconv': return `
        <div class="field-grid">
          <div class="field"><label>Value <span class="req">*</span></label><input type="text" class="input" id="pg-val" placeholder="255"><span class="field-err" id="pg-val-err"></span></div>
          <div class="field"><label>From base</label>
            <select class="input" id="pg-frombase"><option value="10">Decimal</option><option value="2">Binary</option><option value="8">Octal</option><option value="16">Hexadecimal</option></select>
          </div>
        </div>
        <div class="info-box">Shows the value converted into all four number systems at once.</div>`;
      case 'bitvisual': return `
        <div class="bitvis-readout" id="bitvis-readout"></div>
        <div class="bitvis-grid" id="bitvis-grid"></div>
        <div class="form-actions" style="margin-top:14px;">
          <button type="button" class="btn btn-ghost btn-sm" id="bitvis-clear">Clear all</button>
          <button type="button" class="btn btn-ghost btn-sm" id="bitvis-fill">Set all</button>
          <button type="button" class="btn btn-ghost btn-sm" id="bitvis-invert">Invert</button>
        </div>
        <div class="info-box">Click any bit to flip it. Bit 31 is the most significant (leftmost); bit 0 is the least significant.</div>`;
      case 'bitwise': return `
        <div class="field-grid">
          <div class="field"><label>A (decimal) <span class="req">*</span></label><input type="number" class="input" id="pg-a" placeholder="12" step="1"><span class="field-err" id="pg-a-err"></span></div>
          <div class="field"><label>B (decimal, if needed)</label><input type="number" class="input" id="pg-b" placeholder="10" step="1"><span class="field-err" id="pg-b-err"></span></div>
        </div>
        <div class="info-box">Shows AND, OR, XOR, NOT A, left/right shifts at once.</div>`;
      case 'ascii': return `
        <div class="field f1">
          <label>Character or decimal code <span class="req">*</span></label>
          <input type="text" class="input" id="pg-char" placeholder="A or 65" maxlength="6">
          <span class="hint">Type a single character to get its code, or a number to get the character</span>
          <span class="field-err" id="pg-char-err"></span>
        </div>`;
      case 'datasize': return `
        <div class="field-grid">
          <div class="field"><label>Value <span class="req">*</span></label><input type="number" class="input" id="pg-dsval" placeholder="1024"><span class="field-err" id="pg-dsval-err"></span></div>
          <div class="field"><label>Unit</label>
            <select class="input" id="pg-dsunit"><option value="B">Bytes</option><option value="KB" selected>KB</option><option value="MB">MB</option><option value="GB">GB</option><option value="TB">TB</option><option value="bit">Bits</option></select>
          </div>
        </div>`;
      default: return '';
    }
  }
  function renderFields(){
    document.getElementById('pg-fields').innerHTML = fieldsFor(mode);
    Combobox.scan(document.getElementById('pg-fields'));
    const formActions = document.getElementById('pg-calc').closest('.form-actions');
    const resultPanel = document.getElementById('pg-result');
    if (mode === 'bitvisual') {
      if (formActions) formActions.style.display = 'none';
      if (resultPanel) resultPanel.style.display = 'none';
      initBitVisualizer();
    } else {
      if (formActions) formActions.style.display = '';
      if (resultPanel) resultPanel.style.display = '';
    }
  }

  function initBitVisualizer(){
    const grid = document.getElementById('bitvis-grid');
    if (!grid) return;
    grid.innerHTML = bitState.map((bit, i) => {
      const bitIndex = 31 - i; // i=0 is the leftmost cell (MSB, bit 31)
      const byteBoundary = bitIndex % 8 === 0 && bitIndex !== 0;
      return `<button type="button" class="bitvis-cell ${bit?'on':''}" data-bitidx="${bitIndex}" title="Bit ${bitIndex}">${bit}</button>${byteBoundary?'<span class="bitvis-gap"></span>':''}`;
    }).join('');
    grid.querySelectorAll('.bitvis-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        const idx = +cell.getAttribute('data-bitidx');
        bitState[31-idx] = bitState[31-idx] ? 0 : 1;
        initBitVisualizer(); // cheap enough at 32 cells to just fully re-render
      });
    });
    updateBitReadout();

    document.getElementById('bitvis-clear').onclick = () => { bitState = new Array(32).fill(0); initBitVisualizer(); };
    document.getElementById('bitvis-fill').onclick = () => { bitState = new Array(32).fill(1); initBitVisualizer(); };
    document.getElementById('bitvis-invert').onclick = () => { bitState = bitState.map(b => b?0:1); initBitVisualizer(); };
  }

  function updateBitReadout(){
    const readout = document.getElementById('bitvis-readout');
    if (!readout) return;
    // bitState[0] is bit31 (MSB) ... bitState[31] is bit0 (LSB)
    const binStr = bitState.join('');
    const unsigned = parseInt(binStr, 2) >>> 0;
    const signed = unsigned | 0; // reinterpret as signed 32-bit (two's complement)
    const hex = unsigned.toString(16).toUpperCase().padStart(8,'0');
    const popcount = bitState.reduce((a,b)=>a+b,0);
    readout.innerHTML = `
      <div class="bitvis-stat"><span class="bv-label">Unsigned</span><span class="bv-val">${Util.fmt(unsigned)}</span></div>
      <div class="bitvis-stat"><span class="bv-label">Signed (2's comp.)</span><span class="bv-val">${Util.fmt(signed)}</span></div>
      <div class="bitvis-stat"><span class="bv-label">Hex</span><span class="bv-val">0x${hex}</span></div>
      <div class="bitvis-stat"><span class="bv-label">Bits set</span><span class="bv-val">${popcount}</span></div>
    `;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('pg-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'baseconv') {
        const raw = document.getElementById('pg-val').value.trim();
        const fromBase = parseInt(document.getElementById('pg-frombase').value, 10);
        const validChars = { 2:/^[01]+$/, 8:/^[0-7]+$/, 10:/^\d+$/, 16:/^[0-9a-fA-F]+$/ };
        if (!raw) { errs.push(['pg-val','Enter a value']); }
        else if (!validChars[fromBase].test(raw)) { errs.push(['pg-val', `Not a valid base-${fromBase} number`]); }
        else {
          const decVal = parseInt(raw, fromBase);
          if (!Number.isSafeInteger(decVal) || decVal < 0) { errs.push(['pg-val','Number is too large or invalid']); }
          else {
            out = { label:'Decimal', value: String(decVal),
              extras:[
                {k:'Binary', v: decVal.toString(2)},
                {k:'Octal', v: decVal.toString(8)},
                {k:'Hexadecimal', v: decVal.toString(16).toUpperCase()},
              ],
              steps:[`${raw} (base ${fromBase}) = <b>${decVal}</b> in decimal`], expr:`${raw} base${fromBase} → all bases`, raw: decVal };
          }
        }
      } else if (mode === 'bitwise') {
        const aEl = document.getElementById('pg-a'), bEl = document.getElementById('pg-b');
        if (!Util.isNum(aEl.value)) { errs.push(['pg-a','Value A is required']); }
        else {
          const a = Math.trunc(Util.toNum(aEl.value));
          const b = Util.isNum(bEl.value) ? Math.trunc(Util.toNum(bEl.value)) : null;
          const extras = [
            {k:'NOT A', v: String(~a)},
            {k:'A << 1', v: String(a << 1)},
            {k:'A >> 1', v: String(a >> 1)},
          ];
          if (b !== null) {
            extras.unshift({k:'A OR B', v: String(a|b)});
            extras.unshift({k:'A AND B', v: String(a&b)});
            extras.push({k:'A XOR B', v: String(a^b)});
          }
          const bitwiseSteps = [`A = ${a} = 0b${(a>>>0).toString(2)}`, b!==null?`B = ${b} = 0b${(b>>>0).toString(2)}`:''].filter(Boolean);
          out = { label:'A in binary', value: (a>>>0).toString(2), extras, steps: bitwiseSteps,
            expr:`bitwise A=${a}${b!==null?' B='+b:''}`, raw: a };
        }
      } else if (mode === 'ascii') {
        const raw = document.getElementById('pg-char').value;
        if (!raw) { errs.push(['pg-char','Enter a character or code']); }
        else if (/^\d+$/.test(raw.trim())) {
          const code = parseInt(raw.trim(),10);
          if (code < 0 || code > 1114111) { errs.push(['pg-char','Code out of valid Unicode range']); }
          else {
            let ch; try { ch = String.fromCodePoint(code); } catch(e) { ch = '�'; }
            out = { label:'Character', value: ch || '(non-printable)', extras:[{k:'Decimal', v:String(code)},{k:'Hex', v:'0x'+code.toString(16).toUpperCase()},{k:'Binary', v:code.toString(2)}],
              steps:[`Code point ${code} = <b>"${ch}"</b>`], expr:`char for code ${code}`, raw: ch };
          }
        } else {
          const ch = [...raw][0]; // first grapheme-ish unit (handles most BMP + surrogate pairs reasonably)
          const code = ch.codePointAt(0);
          out = { label:'Code point', value: String(code), extras:[{k:'Hex', v:'0x'+code.toString(16).toUpperCase()},{k:'Binary', v:code.toString(2)},{k:'Character', v:ch}],
            steps:[`"${ch}" = <b>${code}</b> (decimal code point)`], expr:`code for "${ch}"`, raw: code };
        }
      } else if (mode === 'datasize') {
        const valEl = document.getElementById('pg-dsval');
        const unit = document.getElementById('pg-dsunit').value;
        if (!Util.isNum(valEl.value)) { errs.push(['pg-dsval','Enter a value']); }
        else {
          const v = Util.toNum(valEl.value);
          const toBytes = {bit:0.125, B:1, KB:1024, MB:1024**2, GB:1024**3, TB:1024**4};
          const bytes = v * toBytes[unit];
          out = { label:'In bytes', value: Util.fmt(bytes),
            extras:[
              {k:'Bits', v: Util.fmt(bytes*8)}, {k:'KB', v: Util.fmt(bytes/1024)},
              {k:'MB', v: Util.fmt(bytes/1024**2)}, {k:'GB', v: Util.fmt(bytes/1024**3)}, {k:'TB', v: Util.fmt(bytes/1024**4)},
            ],
            steps:[`${Util.fmt(v)} ${unit} = <b>${Util.fmt(bytes)} bytes</b>`], expr:`${v}${unit} to all data units`, raw: bytes };
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(String(out.value)), extras: out.extras, steps: out.steps,
      plainValue: String(out.value), copyText: `${out.expr} → ${out.label}: ${out.value}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'programmer', calcLabel:'Programmer', expr: out.expr, resultText: String(out.value), resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 15. NUMBER THEORY ---------------- */
Calculators.numtheory = (function(){
  const MODES = [
    { id:'prime',       label:'Prime checker' },
    { id:'factors',     label:'All factors of a number' },
    { id:'primefactor', label:'Prime factorization' },
    { id:'gcdlcm',      label:'GCD & LCM' },
    { id:'fibonacci',   label:'Fibonacci sequence' },
    { id:'armstrong',   label:'Armstrong number checker' },
    { id:'palindrome',  label:'Palindrome number checker' },
    { id:'divisibility',label:'Divisibility checker' },
  ];
  let mode = 'prime';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>

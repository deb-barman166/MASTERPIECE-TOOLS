<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Calculator Master — The Father of Calculators</title>
<style>
/* ============================================================
   CALCULATOR MASTER — DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#faf8f3;
  --bg-elev:#ffffff;
  --bg-elev-2:#f4f1e8;
  --border:#e4ddc9;
  --border-soft:#eee9da;
  --text:#211d14;
  --text-dim:#655c47;
  --text-faint:#948a70;
  --accent:#96660f;
  --accent-dim:#f2e6cb;
  --accent-text:#7a530c;
  --accent-2:#1f6f5c;
  --accent-2-dim:#dcefe9;
  --danger:#b3392a;
  --danger-dim:#fbe9e4;
  --warn:#a6741a;
  --warn-dim:#f6ecd6;
  --radius:10px;
  --radius-sm:6px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(43,33,10,.06), 0 1px 1px rgba(43,33,10,.04);
  --shadow-md:0 6px 16px rgba(43,33,10,.09), 0 1px 3px rgba(43,33,10,.05);
  --shadow-lg:0 16px 40px rgba(43,33,10,.14), 0 3px 10px rgba(43,33,10,.07);
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sidebar-w:272px;
  --header-h:60px;
  --dur:180ms;
  --ease:cubic-bezier(.2,.9,.25,1);
  --font-scale:1;
  --density:1;
}
[data-theme="dark"]{
  --bg:#141210;
  --bg-elev:#1c1a15;
  --bg-elev-2:#232019;
  --border:#3a3427;
  --border-soft:#2b2820;
  --text:#f3efe3;
  --text-dim:#bcb29a;
  --text-faint:#83795f;
  --accent:#dba848;
  --accent-dim:#3a2e14;
  --accent-text:#eec06e;
  --accent-2:#4db39a;
  --accent-2-dim:#173229;
  --danger:#e57e6f;
  --danger-dim:#3a201c;
  --warn:#e0ab55;
  --warn-dim:#3a2f14;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 6px 16px rgba(0,0,0,.4);
  --shadow-lg:0 20px 44px rgba(0,0,0,.55);
}
/* Accent theme presets (feature 14) — swap the two accent hues app-wide */
[data-accent="pine"]{ --accent:#1f6f5c; --accent-dim:#dcefe9; --accent-text:#155947; --accent-2:#96660f; --accent-2-dim:#f2e6cb; }
[data-theme="dark"][data-accent="pine"]{ --accent:#4db39a; --accent-dim:#173229; --accent-text:#7fd0ba; --accent-2:#dba848; --accent-2-dim:#3a2e14; }
[data-accent="slate"]{ --accent:#3f5470; --accent-dim:#e4e9f0; --accent-text:#2c3d54; --accent-2:#96660f; --accent-2-dim:#f2e6cb; }
[data-theme="dark"][data-accent="slate"]{ --accent:#8fa8c9; --accent-dim:#232b38; --accent-text:#b3c6e0; --accent-2:#dba848; --accent-2-dim:#3a2e14; }
[data-accent="brick"]{ --accent:#a6452c; --accent-dim:#f5e2da; --accent-text:#873723; --accent-2:#1f6f5c; --accent-2-dim:#dcefe9; }
[data-theme="dark"][data-accent="brick"]{ --accent:#e0876c; --accent-dim:#3a2117; --accent-text:#eeab96; --accent-2:#4db39a; --accent-2-dim:#173229; }
/* Density mode (feature 12) */
[data-density="compact"]{ --density:.74; }
/* Font scale (feature 13) — zoom is broadly supported (Chromium/WebKit)
   and scales the whole app shell proportionally (text, padding, icons)
   without requiring every px value in this file to be converted to rem. */
[data-fontsize="sm"] #app{ zoom:.93; }
[data-fontsize="lg"] #app{ zoom:1.08; }
@supports not (zoom:1){
  /* Firefox fallback: transform scale on the app root. Slightly less
     precise (can introduce subpixel blur) but keeps the feature working. */
  [data-fontsize="sm"] #app{ transform:scale(.93); transform-origin:top left; width:calc(100% / .93); }
  [data-fontsize="lg"] #app{ transform:scale(1.08); transform-origin:top left; width:calc(100% / 1.08); }
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background var(--dur),color var(--dur);
}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
svg{width:16px;height:16px;flex-shrink:0;display:inline-block;vertical-align:-3px;}
.ic{width:16px;height:16px;flex-shrink:0;}
::selection{background:var(--accent);color:#fff;}
a{color:var(--accent-text);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elev);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:40;
  transition:transform var(--dur) ease;
}
#sidebar .brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 18px 14px;
  border-bottom:1px solid var(--border-soft);
  flex-shrink:0;
}
#sidebar .brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(150deg,var(--accent),#6e4c0c);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:15px;flex-shrink:0;letter-spacing:-.02em;
  box-shadow:0 4px 10px rgba(150,102,15,.35);
}
#sidebar .brand .name{font-weight:800;font-size:15.5px;letter-spacing:-.01em;line-height:1.15;}
#sidebar .brand .tag{font-size:10.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
#sidebar-search{
  margin:12px 14px;
  position:relative;
}
#sidebar-search input{
  width:100%;
  padding:9px 12px 9px 32px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--bg-elev-2);
  font-size:13px;
  color:var(--text);
  outline:none;
  transition:border-color var(--dur),box-shadow var(--dur);
}
#sidebar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
#sidebar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);pointer-events:none;}
#sidebar-nav{flex:1;overflow-y:auto;padding:4px 10px 14px;}
.nav-section-label{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-faint);padding:14px 10px 6px;
}
.nav-cat-toggle{
  display:flex;align-items:center;gap:5px;border:none;background:none;width:100%;
  cursor:pointer;text-align:left;transition:color var(--dur);
}
.nav-cat-toggle:hover{color:var(--text-dim);}
.nav-cat-chev{width:11px;height:11px;transition:transform var(--dur) var(--ease);transform:rotate(90deg);flex-shrink:0;}
.nav-cat-chev.collapsed{transform:rotate(0deg);}
.nav-cat-group{
  display:block;overflow:hidden;
  max-height:1200px;
  transition:max-height var(--dur) var(--ease),opacity var(--dur) var(--ease);
  opacity:1;
}
.nav-cat-group.collapsed{max-height:0;opacity:0;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:calc(9px * var(--density)) 10px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:600;color:var(--text-dim);
  cursor:pointer;user-select:none;
  transition:background var(--dur),color var(--dur);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item .ic{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--bg-elev-2);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:var(--accent-text);}
.nav-item .fav-star{margin-left:auto;width:13px;height:13px;opacity:0;flex-shrink:0;}
.nav-item .pin-btn{width:13px;height:13px;opacity:0;flex-shrink:0;}
.nav-item .pin-btn{margin-left:auto;}
.nav-item .fav-star{margin-left:6px;}
.nav-item:hover .fav-star,.nav-item:hover .pin-btn{opacity:.5;}
.nav-item .fav-star.is-fav{opacity:1;color:var(--warn);}
.nav-item .pin-btn.is-pinned{opacity:1;color:var(--accent-text);transform:rotate(0deg);}
#sidebar-footer{
  padding:12px 14px;border-top:1px solid var(--border-soft);
  display:flex;gap:8px;flex-shrink:0;
}
.icon-btn{
  width:34px;height:34px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-elev-2);border:1px solid var(--border);
  color:var(--text-dim);flex-shrink:0;
  transition:background var(--dur),color var(--dur),border-color var(--dur);
}
.icon-btn:hover{background:var(--accent-dim);color:var(--accent-text);border-color:var(--accent);}
.icon-btn svg{width:16px;height:16px;}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}

/* ---------- Main ---------- */
#main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;min-height:100vh;}
#topbar{
  height:var(--header-h);flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  padding:0 20px;
  background:var(--bg-elev);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
#menu-toggle{display:none;}
#topbar .crumb{font-size:13px;color:var(--text-faint);font-weight:600;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#topbar .crumb b{color:var(--text);font-weight:700;}
#topbar-spacer{flex:1;}
#global-search-wrap{position:relative;width:280px;max-width:40vw;}
#global-search{
  width:100%;padding:8px 12px 8px 32px;border-radius:999px;
  border:1px solid var(--border);background:var(--bg-elev-2);
  font-size:13px;outline:none;transition:border-color var(--dur),box-shadow var(--dur),width var(--dur);
}
#global-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
#global-search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}
#global-search-wrap kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:10.5px;color:var(--text-faint);background:var(--bg-elev);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--mono);
}
#content{flex:1;padding:22px 26px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  padding:calc(9px * var(--density)) calc(15px * var(--density));border-radius:var(--radius-sm);
  font-size:13px;font-weight:700;border:1px solid transparent;
  transition:background var(--dur),border-color var(--dur),color var(--dur),transform var(--dur);
  user-select:none;
}
.btn:active{transform:scale(.97);}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(150,102,15,.3);}
[data-theme="dark"] .btn-primary{box-shadow:0 2px 8px rgba(219,168,72,.3);}
.btn-primary:hover{background:var(--accent-text);}
.btn-soft{background:var(--accent-dim);color:var(--accent-text);}
.btn-soft:hover{filter:brightness(1.05);}
.btn-ghost{background:var(--bg-elev-2);color:var(--text-dim);border-color:var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text-faint);}
.btn-danger{background:var(--danger-dim);color:var(--danger);}
.btn-danger:hover{filter:brightness(1.05);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Cards ---------- */
.card{
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
}
.card-pad{padding:calc(20px * var(--density));}
.section-title{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:0 0 3px;display:flex;align-items:center;gap:8px;}
.section-sub{font-size:12.5px;color:var(--text-faint);margin:0 0 16px;}

/* ---------- Grid of tool cards ---------- */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;}
.tool-card{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 14px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:10px;
  transition:transform var(--dur),box-shadow var(--dur),border-color var(--dur);
  position:relative;
}
.tool-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent);}
.tool-card .ti-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-dim);color:var(--accent-text);
}
.tool-card .ti-icon svg{width:19px;height:19px;}
.tool-card .ti-title{font-size:13.5px;font-weight:700;line-height:1.25;}
.tool-card .ti-desc{font-size:11.5px;color:var(--text-faint);line-height:1.35;}
.tool-card .ti-fav{
  position:absolute;top:10px;right:10px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;border-radius:6px;
  color:var(--text-faint);opacity:0;transition:opacity var(--dur),color var(--dur),background var(--dur);
}
.tool-card:hover .ti-fav{opacity:1;}
.tool-card .ti-fav.is-fav{opacity:1;color:var(--warn);}
.tool-card .ti-fav svg{width:14px;height:14px;}
.tool-card .ti-fav:hover{background:var(--bg-elev-2);}

/* ---------- Dashboard hero / universal bar ---------- */
.hero{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 22px),
    linear-gradient(135deg,var(--accent) 0%,#6e4c0c 100%);
  border-radius:var(--radius-lg);padding:28px 26px;color:#fff;margin-bottom:20px;
  position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.08);
}
[data-theme="dark"] .hero{background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 22px),
    linear-gradient(135deg,#8a621f 0%,#4d3610 100%);}
.hero::after{
  content:"";position:absolute;right:-40px;top:-40px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);
}
.hero .eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  opacity:.8;margin:0 0 8px;position:relative;z-index:1;
}
.hero h1{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.015em;position:relative;z-index:1;}
.hero p{margin:0 0 16px;font-size:13px;opacity:.9;max-width:520px;position:relative;z-index:1;}
.uni-input-row{display:flex;gap:8px;position:relative;z-index:1;}
#universal-input{
  flex:1;padding:13px 16px;border-radius:12px;border:none;font-size:14.5px;
  background:rgba(255,255,255,.96);color:#211d14;outline:none;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
}
#universal-input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.5),0 6px 20px rgba(0,0,0,.15);}
.uni-go{
  padding:13px 20px;border-radius:12px;border:none;background:rgba(0,0,0,.22);
  color:#fff;font-weight:700;font-size:13.5px;flex-shrink:0;
  transition:background var(--dur);
}
.uni-go:hover{background:rgba(0,0,0,.32);}
.uni-examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1;}
.uni-chip{
  font-size:11.5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.16);
  color:#fff;cursor:pointer;transition:background var(--dur);border:1px solid rgba(255,255,255,.25);
}
.uni-chip:hover{background:rgba(255,255,255,.28);}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
.stat-strip{
  display:flex;align-items:center;gap:18px;padding:13px 18px;margin-bottom:18px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
}
.stat-item{display:flex;flex-direction:column;gap:1px;}
.stat-item-wide{flex:1;min-width:0;}
.stat-num{font-family:var(--mono);font-size:19px;font-weight:800;color:var(--text);line-height:1;}
.stat-num-sm{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--text);line-height:1.3;display:flex;align-items:center;gap:6px;}
.stat-num-sm svg{width:14px;height:14px;color:var(--accent-text);flex-shrink:0;}
.stat-label{font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.stat-divider{width:1px;align-self:stretch;background:var(--border-soft);}
@media (max-width:520px){.stat-strip{flex-wrap:wrap;gap:12px;}}

/* ---------- Onboarding welcome card ---------- */
.onboarding-card{
  position:relative;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow-sm);
  opacity:0;transform:translateY(-8px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.onboarding-card.show{opacity:1;transform:translateY(0);}
.onboarding-close{
  position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);
  background:none;border:none;transition:background var(--dur);
}
.onboarding-close:hover{background:var(--bg-elev-2);color:var(--text);}
.onboarding-close svg{width:13px;height:13px;}
.onboarding-title{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px;padding-right:24px;}
.onboarding-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.onboarding-item{display:flex;gap:10px;font-size:12.5px;color:var(--text-dim);line-height:1.45;}
.onboarding-item b{color:var(--text);}
.oi-num{
  width:20px;height:20px;border-radius:50%;background:var(--accent-dim);color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
}
@media (max-width:760px){.onboarding-grid{grid-template-columns:1fr;}}
@media (max-width:760px){.dash-grid{grid-template-columns:1fr;}}
.mini-list{display:flex;flex-direction:column;gap:2px;}
.mini-row{
  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background var(--dur);
}
.mini-row:hover{background:var(--bg-elev-2);}
.mini-row .mr-ic{width:30px;height:30px;border-radius:8px;background:var(--accent-dim);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mini-row .mr-ic svg{width:15px;height:15px;}
.mini-row .mr-main{flex:1;min-width:0;}
.mini-row .mr-title{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-row .mr-sub{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-row .mr-val{font-size:12px;font-weight:700;color:var(--accent-text);flex-shrink:0;font-family:var(--mono);}
.empty-hint{font-size:12px;color:var(--text-faint);padding:14px 8px;text-align:center;}

/* ---------- Calculator view ---------- */
.calc-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.calc-header .ch-icon{
  width:44px;height:44px;border-radius:12px;background:var(--accent-dim);color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.calc-header .ch-icon svg{width:22px;height:22px;}
.calc-header .ch-text{flex:1;min-width:200px;}
.calc-header h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;}
.calc-header .ch-sub{font-size:12.5px;color:var(--text-faint);margin-top:1px;}
.calc-header .ch-actions{display:flex;gap:8px;margin-left:auto;}

.calc-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:16px;align-items:start;}
.calc-layout > *{min-width:0;} /* prevents wide content (e.g. the amortization table) from stretching the grid track past the viewport */
@media (max-width:860px){.calc-layout{grid-template-columns:minmax(0,1fr);}}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-grid.f1{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
.field label .req{color:var(--danger);}
.field .hint{font-size:10.5px;color:var(--text-faint);font-weight:500;}
.input, select.input, textarea.input{
  padding:calc(10px * var(--density)) 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-elev-2);font-size:13.5px;color:var(--text);outline:none;width:100%;
  transition:border-color var(--dur),box-shadow var(--dur);
  font-family:var(--sans);
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);background:var(--bg-elev);}
.input.err{border-color:var(--danger);}
.input.err:focus{box-shadow:0 0 0 3px var(--danger-dim);}
.input-suffix-wrap{position:relative;}
.input-suffix-wrap .input{padding-right:44px;}
.input-suffix-wrap .suffix{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--text-faint);font-weight:700;pointer-events:none;}
.field-err{font-size:11px;color:var(--danger);font-weight:600;min-height:0;}
.field-row-2{display:flex;gap:8px;}
.field-row-2 .field{flex:1;}
.select-inline{display:flex;gap:8px;flex-wrap:wrap;}
.chip-radio{
  padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--bg-elev-2);
  font-size:12px;font-weight:700;color:var(--text-dim);transition:all var(--dur);user-select:none;
}
.chip-radio.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip-radio:hover:not(.active){border-color:var(--accent);color:var(--accent-text);}
.unit-toggle{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex-shrink:0;}
.unit-toggle-opt{padding:3px 8px;font-size:10.5px;font-weight:700;color:var(--text-faint);background:var(--bg-elev-2);transition:background var(--dur),color var(--dur);}
.unit-toggle-opt.active{background:var(--accent);color:#fff;}
.unit-toggle-opt:not(.active):hover{color:var(--text-dim);}
.form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}

/* Result panel */
.result-panel{position:sticky;top:76px;}

/* ---------- Amortization schedule (Finance EMI) ---------- */
.amort-wrap{margin-top:14px;border-top:1px solid var(--border-soft);}

/* ---------- Prime factorization tree ---------- */
.ftree-wrap{margin-top:14px;border-top:1px solid var(--border-soft);padding:16px 20px;}

/* ---------- Bit visualizer (Programmer) ---------- */
.bitvis-readout{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
.bitvis-stat{background:var(--bg-elev-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:9px 12px;display:flex;flex-direction:column;gap:2px;}
.bv-label{font-size:9.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
.bv-val{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--text);}
.bitvis-grid{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:12px;background:var(--bg-elev-2);border-radius:var(--radius-sm);border:1px solid var(--border-soft);}
.bitvis-cell{
  width:24px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--bg-elev);
  font-family:var(--mono);font-size:12px;font-weight:800;color:var(--text-faint);
  transition:background var(--dur),color var(--dur),border-color var(--dur);flex-shrink:0;
}
.bitvis-cell:hover{border-color:var(--accent-text);}
.bitvis-cell.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.bitvis-gap{width:8px;flex-shrink:0;}
.ftree-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:14px;}
.ftree-canvas{overflow-x:auto;padding-bottom:6px;}
.ftree-node{display:flex;flex-direction:column;align-items:center;}
.ftree-circle{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:800;background:var(--bg-elev-2);border:2px solid var(--border);
  color:var(--text-dim);flex-shrink:0;position:relative;z-index:1;
}
.ftree-circle.is-prime{background:var(--accent);border-color:var(--accent);color:#fff;}
.ftree-children{display:flex;gap:22px;margin-top:8px;position:relative;padding-top:14px;}
.ftree-children::before{
  content:"";position:absolute;top:0;left:50%;width:1px;height:14px;background:var(--border);
}
.ftree-node .ftree-children > .ftree-node{position:relative;}
.ftree-children > .ftree-node::before{
  content:"";position:absolute;top:-14px;left:50%;width:50%;height:14px;
  border-top:1px solid var(--border);
}
.ftree-children > .ftree-node:first-child::before{left:50%;border-left:1px solid var(--border);border-top-left-radius:6px;}
.ftree-children > .ftree-node:last-child::before{left:0;border-right:1px solid var(--border);border-top-right-radius:6px;}
.amort-toggle{
  display:flex;align-items:center;gap:8px;width:100%;padding:14px 20px;
  background:none;border:none;font-size:12.5px;font-weight:700;color:var(--text-dim);
  transition:color var(--dur);
}
.amort-toggle:hover{color:var(--text);}
.amort-chev{width:13px;height:13px;transition:transform var(--dur) var(--ease);flex-shrink:0;}
.amort-chev.open{transform:rotate(90deg);}
.amort-body{padding:0 20px 16px;}
.amort-table-scroll{max-height:320px;max-width:100%;overflow-y:auto;overflow-x:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);}
.amort-table{min-width:480px;}
.amort-table{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono);}
.amort-table th{
  position:sticky;top:0;background:var(--bg-elev-2);text-align:right;padding:8px 10px;
  font-family:var(--sans);font-weight:700;color:var(--text-faint);text-transform:uppercase;
  font-size:9.5px;letter-spacing:.04em;border-bottom:1px solid var(--border-soft);
}
.amort-table th:first-child,.amort-table td:first-child{text-align:left;}
.amort-table td{padding:6px 10px;text-align:right;color:var(--text-dim);border-bottom:1px solid var(--border-soft);}
.amort-table tbody tr:last-child td{border-bottom:none;}
.amort-table tbody tr:hover td{background:var(--bg-elev-2);}
.result-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.result-card .rc-empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;}
.result-card .rc-empty svg{width:32px;height:32px;margin-bottom:10px;opacity:.4;}
.result-main{
  padding:20px;background:linear-gradient(160deg,var(--accent-dim),var(--bg-elev) 70%);
  border-bottom:1px solid var(--border);
}
.result-main .rm-label{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.result-main .rm-value{font-size:28px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono);word-break:break-word;line-height:1.15;color:var(--accent-text);}
.result-main .rm-value.neg{color:var(--danger);}
.result-main .rm-value.pos{color:var(--accent-2);}
.result-main .rm-unit{font-size:14px;font-weight:600;color:var(--text-dim);margin-left:4px;}
.result-main .rm-sub{font-size:12px;color:var(--text-dim);margin-top:6px;}

/* ---------- Countdown widget (Date & Time) ---------- */
.countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
.cd-unit{display:flex;flex-direction:column;align-items:center;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 4px;}
.cd-num{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--accent-text);line-height:1.1;font-variant-numeric:tabular-nums;}
.cd-label{font-size:9.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
.result-extra{padding:12px 20px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border-soft);}
.result-extra:last-of-type{border-bottom:none;}
.re-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;gap:10px;}
.re-row .re-k{color:var(--text-faint);font-weight:600;}
.re-row .re-v{font-weight:700;font-family:var(--mono);text-align:right;}
.steps-block{padding:14px 20px;}
.steps-block .sb-title{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.step-line{
  font-size:12px;font-family:var(--mono);color:var(--text-dim);padding:6px 0;
  border-top:1px dashed var(--border-soft);line-height:1.5;
}
.step-line:first-child{border-top:none;}
.step-line .sl-num{color:var(--accent-text);font-weight:700;margin-right:6px;}
.result-actions{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;}
.cbx-menu-wrap{position:relative;display:flex;}
.cbx-menu-wrap #rp-copy{border-top-right-radius:0;border-bottom-right-radius:0;}
.btn-icon-only{padding:9px 8px;border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid rgba(0,0,0,.1);}
.btn-icon-only svg{width:12px;height:12px;transform:rotate(90deg);transition:transform var(--dur);}
.btn-icon-only[aria-expanded="true"] svg{transform:rotate(270deg);}
.cbx-menu{
  position:absolute;bottom:calc(100% + 6px);left:0;min-width:150px;z-index:40;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);padding:5px;
  opacity:0;transform:translateY(6px) scale(.98);pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.cbx-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.cbx-menu-item{padding:8px 10px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-dim);}
.cbx-menu-item:hover{background:var(--bg-elev-2);color:var(--text);}
.error-banner{
  margin:0 0 14px;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--danger-dim);color:var(--danger);font-size:12.5px;font-weight:600;
  display:flex;gap:9px;align-items:flex-start;
}
.error-banner svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.hidden{display:none !important;}

/* History table area (used inside calculator view + history page) */
.history-list{display:flex;flex-direction:column;gap:8px;}
.hist-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);background:var(--bg-elev-2);cursor:pointer;
  transition:border-color var(--dur),background var(--dur);
}
.hist-item:hover{border-color:var(--accent);background:var(--bg-elev);}
.hist-item .hi-ic{width:28px;height:28px;border-radius:8px;background:var(--accent-dim);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hist-item .hi-ic svg{width:14px;height:14px;}
.hist-item .hi-main{flex:1;min-width:0;}
.hist-item .hi-expr{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-item .hi-meta{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
.hist-item .hi-result{font-size:12.5px;font-weight:800;font-family:var(--mono);color:var(--accent-text);flex-shrink:0;}
.hist-item .hi-fav{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);border-radius:6px;}
.hist-item .hi-fav.is-fav{color:var(--warn);}
.hist-item .hi-fav:hover{background:var(--bg-elev);}
.hist-item .hi-fav svg{width:14px;height:14px;}
.hist-item .hi-del{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);border-radius:6px;}
.hist-item .hi-del:hover{background:var(--danger-dim);color:var(--danger);}
.hist-item .hi-del svg{width:14px;height:14px;}
.hist-item .hi-note-btn{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);border-radius:6px;}
.hist-item .hi-note-btn:hover{background:var(--bg-elev);color:var(--text-dim);}
.hist-item .hi-note-btn.has-note{color:var(--accent-text);}
.hist-item .hi-note-btn svg{width:13px;height:13px;}
.hi-note-preview{
  display:flex;align-items:flex-start;gap:5px;margin-top:4px;font-size:11px;color:var(--text-dim);
  font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hi-note-preview svg{width:11px;height:11px;flex-shrink:0;margin-top:1px;opacity:.7;}
.hi-note-editor{
  margin:4px 2px 0;padding:10px;border-radius:var(--radius-sm);
  background:var(--bg-elev-2);border:1px solid var(--border-soft);
}
.hi-note-input{resize:vertical;min-height:44px;font-size:12.5px;margin-bottom:8px;}
.hi-note-actions{display:flex;gap:6px;}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.toolbar-spacer{flex:1;}
.search-mini{position:relative;}
.search-mini input{padding-left:30px;width:200px;}
.search-mini svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-faint);}
.filter-select{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elev-2);font-size:12.5px;font-weight:600;}

/* ---------- Combobox (animated <select> replacement) ---------- */
.cbx{position:relative;width:100%;}
.cbx .cbx-native{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;
}
.cbx-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px * var(--density)) calc(12px * var(--density));
  border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elev);
  font-size:calc(13.5px * var(--font-scale));font-weight:600;text-align:left;color:var(--text);
  transition:border-color var(--dur),box-shadow var(--dur),background var(--dur);
}
.cbx.cbx-sm .cbx-trigger{padding:8px 10px;font-size:calc(12.5px * var(--font-scale));font-weight:600;background:var(--bg-elev-2);}
.cbx-trigger:hover{border-color:var(--text-faint);}
.cbx-trigger:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.cbx-trigger[disabled]{opacity:.5;cursor:not-allowed;}
.cbx-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbx-chev{width:15px;height:15px;flex-shrink:0;color:var(--text-faint);transition:transform var(--dur) var(--ease);}
.cbx.open .cbx-chev{transform:rotate(180deg);}
.cbx-list{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);padding:5px;max-height:280px;overflow-y:auto;
  opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top center;
  pointer-events:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.cbx.open .cbx-list{display:block;}
.cbx:not(.open) .cbx-list{display:none;}
.cbx.open-anim .cbx-list{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.cbx-opt{
  padding:8px 10px;border-radius:var(--radius-sm);font-size:calc(13px * var(--font-scale));font-weight:500;
  cursor:pointer;transition:background var(--dur);color:var(--text);
}
.cbx-opt:hover,.cbx-opt.kbd-focus{background:var(--bg-elev-2);}
.cbx-opt.active{background:var(--accent-dim);color:var(--accent-text);font-weight:700;}
.cbx-opt.disabled{opacity:.4;cursor:not-allowed;}
@media (prefers-reduced-motion:reduce){
  .cbx-list,.cbx-chev{transition:none;}
}
.pill-count{
  font-size:10.5px;font-weight:700;background:var(--accent-dim);color:var(--accent-text);
  padding:2px 8px;border-radius:999px;
}

/* Matrix grid */
.matrix-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.matrix-block{display:flex;flex-direction:column;gap:8px;}
.matrix-dims{display:flex;gap:8px;align-items:center;}
.matrix-dims .input{width:56px;text-align:center;padding:7px 4px;}
.matrix-grid{display:inline-grid;gap:5px;padding:10px;background:var(--bg-elev-2);border-radius:var(--radius-sm);border:1px solid var(--border);}
.matrix-grid input{width:52px;height:38px;text-align:center;border-radius:7px;border:1px solid var(--border);background:var(--bg-elev);font-size:12.5px;font-family:var(--mono);}
.matrix-result-grid{display:inline-grid;gap:5px;padding:10px;background:var(--accent-dim);border-radius:var(--radius-sm);}
.matrix-result-grid .mcell{width:56px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg-elev);border-radius:7px;font-size:12px;font-weight:700;font-family:var(--mono);color:var(--accent-text);}

/* Toast */
#toast-stack{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
#toast-stack .toast{pointer-events:auto;}
.toast{
  background:var(--text);color:var(--bg);padding:10px 10px 10px 18px;border-radius:999px;font-size:12.5px;font-weight:700;
  box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px);transition:opacity var(--dur),transform var(--dur);
  display:flex;align-items:center;gap:10px;
}
[data-theme="dark"] .toast{background:var(--bg-elev);color:var(--text);border:1px solid var(--border);}
.toast.show{opacity:1;transform:translateY(0);}
.toast svg{width:14px;height:14px;flex-shrink:0;}
.toast-msg{padding-right:2px;}
.toast-action{
  flex-shrink:0;background:rgba(255,255,255,.16);color:inherit;border:none;
  padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;
  transition:background var(--dur);
}
.toast-action:hover{background:rgba(255,255,255,.28);}
[data-theme="dark"] .toast-action{background:var(--accent-dim);color:var(--accent-text);}
[data-theme="dark"] .toast-action:hover{filter:brightness(1.1);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,11,15,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--bg-elev);border-radius:var(--radius-lg);max-width:420px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden;}
.modal-head{padding:18px 20px 0;}
.modal-head h3{margin:0 0 4px;font-size:15.5px;font-weight:800;}
.modal-head p{margin:0;font-size:12.5px;color:var(--text-faint);}
.modal-body{padding:16px 20px;max-height:60vh;overflow-y:auto;}
.modal-actions{padding:14px 20px 20px;display:flex;gap:8px;justify-content:flex-end;}

/* ---------- Command palette ---------- */
.cmdk-backdrop{
  position:fixed;inset:0;background:rgba(20,16,8,.5);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px;
  opacity:0;transition:opacity var(--dur) var(--ease);
}
.cmdk-backdrop.open{opacity:1;}
.cmdk{
  background:var(--bg-elev);border-radius:var(--radius-lg);max-width:560px;width:100%;
  box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden;
  transform:translateY(-10px) scale(.98);transition:transform var(--dur) var(--ease);
}
.cmdk-backdrop.open .cmdk{transform:translateY(0) scale(1);}
.cmdk-input-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
.cmdk-search-ic{width:17px;height:17px;color:var(--text-faint);flex-shrink:0;}
#cmdk-input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--text);font-family:inherit;}
#cmdk-input::placeholder{color:var(--text-faint);}
.cmdk-esc{flex-shrink:0;}
.cmdk-list{max-height:min(50vh,420px);overflow-y:auto;padding:6px;}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;}
.cmdk-item.active{background:var(--accent-dim);}
.cmdk-item-ic{width:17px;height:17px;color:var(--text-dim);flex-shrink:0;}
.cmdk-item.active .cmdk-item-ic{color:var(--accent-text);}
.cmdk-item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.cmdk-item-label{font-size:13.5px;font-weight:700;color:var(--text);}
.cmdk-item-desc{font-size:11.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmdk-item-tag{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}
.cmdk-empty{padding:24px 16px;text-align:center;font-size:13px;color:var(--text-faint);}
.cmdk-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border-soft);background:var(--bg-elev-2);}
.cmdk-foot span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-faint);}
kbd{
  display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;
  background:var(--bg-elev-2);border:1px solid var(--border);border-radius:5px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-dim);box-shadow:0 1px 0 var(--border);
}

/* ---------- Shortcuts panel ---------- */
.kbd-shortcut-list{display:flex;flex-direction:column;gap:2px;}
.kbd-shortcut-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;font-size:13px;}
.kbd-shortcut-row span{color:var(--text-dim);}

/* ---------- Settings panel ---------- */
.settings-block{display:flex;flex-direction:column;gap:16px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.settings-label{font-size:13px;font-weight:700;color:var(--text);}
.settings-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;max-width:250px;}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch-track{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background var(--dur);}
.switch-track::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform var(--dur) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + .switch-track{background:var(--accent);}
.switch input:checked + .switch-track::before{transform:translateX(16px);}
.switch input:focus-visible + .switch-track{box-shadow:0 0 0 3px var(--accent-dim);}
.accent-swatches{display:flex;gap:8px;}
.accent-swatch{
  width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:transform var(--dur),border-color var(--dur);position:relative;
}
.accent-swatch:hover{transform:scale(1.1);}
.accent-swatch.active{border-color:var(--text);}
.accent-swatch.active::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--bg-elev);
}


/* Keyboard hint footer for calculators with keypad */
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;}
.keypad button{
  padding:12px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev-2);
  font-size:15px;font-weight:700;color:var(--text);transition:background var(--dur),transform var(--dur);
}
.keypad button:active{transform:scale(.95);background:var(--accent-dim);}
.keypad button.op{color:var(--accent-text);background:var(--accent-dim);}
.keypad button.eq{background:var(--accent);color:#fff;grid-column:span 2;}
.keypad button.clear{color:var(--danger);}
.memory-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.mem-btn{
  flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg-elev-2);
  font-size:11.5px;font-weight:800;color:var(--text-dim);transition:background var(--dur),color var(--dur);
}
.mem-btn:hover{background:var(--accent-dim);color:var(--accent-text);}
.mem-indicator{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:var(--text-faint);border:1px solid var(--border-soft);flex-shrink:0;
}
.mem-indicator.active{color:var(--accent-text);border-color:var(--accent-text);background:var(--accent-dim);}
.basic-recent{margin-top:14px;}
.basic-recent-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:6px;}
.basic-recent-item{
  display:flex;align-items:center;gap:6px;width:100%;padding:7px 9px;border-radius:var(--radius-sm);
  background:none;border:none;font-size:12px;text-align:left;transition:background var(--dur);margin-bottom:2px;
}
.basic-recent-item:hover{background:var(--bg-elev-2);}
.bri-expr{color:var(--text-dim);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.bri-eq{color:var(--text-faint);flex-shrink:0;}
.bri-result{color:var(--accent-text);font-family:var(--mono);font-weight:800;flex-shrink:0;}
.expr-display{
  background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:10px;
}
.expr-display .ed-expr{font-size:13px;color:var(--text-faint);min-height:16px;font-family:var(--mono);word-break:break-all;}
.expr-display .ed-live{font-size:24px;font-weight:800;font-family:var(--mono);margin-top:4px;word-break:break-all;}

/* Info box */
.info-box{background:var(--accent-dim);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--accent-text);line-height:1.5;margin-top:12px;}

/* ---------- Unit converter pinned pairs ---------- */
.uc-pinned-bar{display:none;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.uc-pin-chip{
  padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--bg-elev-2);
  font-size:11.5px;font-weight:700;color:var(--text-dim);transition:background var(--dur),border-color var(--dur);
}
.uc-pin-chip:hover{background:var(--accent-dim);color:var(--accent-text);border-color:var(--accent-text);}
#uc-pin-toggle.is-pinned-btn{color:var(--accent-text);border-color:var(--accent-text);background:var(--accent-dim);}
.info-box b{font-weight:800;}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;}
.badge-soft{background:var(--accent-dim);color:var(--accent-text);}
.badge-warn{background:var(--warn-dim);color:var(--warn);}
.badge-danger{background:var(--danger-dim);color:var(--danger);}
.badge-ok{background:var(--accent-dim);color:var(--accent-2);}

/* responsive */
@media (max-width:900px){
  :root{--sidebar-w:250px;}
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  #sidebar-backdrop.open{display:block;}
  #main{margin-left:0;}
  #menu-toggle{display:flex;}
  #content{padding:16px 14px 50px;}
  .hero{padding:20px 16px;}
  .uni-input-row{flex-direction:column;}
  #global-search-wrap{width:150px;}
}
@media (max-width:520px){
  .field-grid{grid-template-columns:1fr;}
  .tool-grid{grid-template-columns:repeat(2,1fr);}
  .result-main .rm-value{font-size:23px;}
}

/* ---------- Print styles ---------- */
@media print{
  #sidebar,#sidebar-backdrop,#topbar,#toast-stack,#modal-root,#cmdk-root,#menu-toggle{display:none !important;}
  #main{margin-left:0 !important;}
  #content{padding:0 !important;max-width:100% !important;}
  body{background:#fff !important;color:#000 !important;}
  .calc-layout{grid-template-columns:1fr !important;display:block !important;}
  .card,.result-panel,.result-card{box-shadow:none !important;border:1px solid #ccc !important;page-break-inside:avoid;margin-bottom:14px;}
  .form-actions,.result-actions,.ch-actions{display:none !important;}
  /* Inputs/selects still show their current value in print by default; just
     strip the interactive chrome so they read as a plain record of what was entered. */
  .input,select.input,.cbx-trigger{border:none !important;background:none !important;padding:2px 0 !important;color:#000 !important;box-shadow:none !important;}
  .cbx-chev,.cbx-list,.field-err,.hint{display:none !important;}
  .rm-value{color:#000 !important;}
}
</style>

/* ============================================================
   CALCULATOR MASTER — APPLICATION SCRIPT
   Modular internal architecture using ES classes / namespaces,

/* ------------------------------------------------------------
   ICONS — tiny inline SVG library (stroke-based, 24x24 viewBox)
   Kept as raw path strings so <svg> shells can be reused.
------------------------------------------------------------- */
const ICONS = {

function icon(name, cls){
  const p = ICONS[name] || ICONS.calc;
  // 'ic' is always included as a size-safety default so a bare icon() call
  // can never render unconstrained (see: dashboard hero star regression).
  const classes = ['ic', cls||''].join(' ').trim();
  return `<svg class="${classes}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ------------------------------------------------------------
   UTILITIES
------------------------------------------------------------- */
const Util = {
  uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); },

  esc(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },

  // Number formatting: locale-aware grouping, trims trailing float noise.
  fmt(n, opts){
    opts = opts || {};
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    if (!Number.isFinite(n)) return n > 0 ? '∞' : '-∞';
    // Global precision/grouping preferences (Settings) apply only when the
    // caller hasn't explicitly requested a specific decimals/grouping —
    // most call sites want "smart" formatting, so we only override the
    // default *smart* decimal cap, not any explicitly-requested decimals.
    const prefs = (typeof MState !== 'undefined' && MState.prefs) ? MState.prefs : null;
    const decimals = opts.decimals !== undefined ? opts.decimals : null;
    const grouping = opts.grouping !== undefined ? opts.grouping : (prefs ? prefs.thousandsSep : true);
    let v = n;
    if (Math.abs(v) < 1e-12) v = 0;
    let str;
    if (decimals !== null) {
      str = v.toFixed(decimals);
    } else {
      // smart precision: up to N significant decimals (default 8, or the
      // user's configured precision when this is a "fixed" style value),
      // strip trailing zeros
      const cap = (prefs && opts.useSmartCap !== false && prefs.precision !== undefined && opts.smartDecimals) ? prefs.precision : 8;
      if (Math.abs(v) >= 1e15 || (Math.abs(v) < 1e-9 && v !== 0)) {
        return v.toExponential(6).replace(/\.?0+e/, 'e');
      }
      str = v.toFixed(cap);
      str = str.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    }
    if (grouping !== false) {
      const parts = str.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      str = parts.join('.');
    }
    return str;
  },

  // Indian numbering system (lakh/crore) formatter, used optionally for INR-flavored calcs.
  fmtIndian(n, decimals){
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    if (!Number.isFinite(n)) return n > 0 ? '∞' : '-∞';
    const neg = n < 0; n = Math.abs(n);
    const d = decimals !== undefined ? decimals : 2;
    let [intPart, decPart] = n.toFixed(d).split('.');
    let last3 = intPart.slice(-3);
    let rest = intPart.slice(0, -3);
    if (rest !== '') last3 = ',' + last3;
    rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    let out = rest + last3;
    if (decPart) out += '.' + decPart;
    return (neg ? '-' : '') + out;
  },

  clamp(v, lo, hi){ return Math.min(Math.max(v, lo), hi); },

  isNum(v){ return v !== '' && v !== null && v !== undefined && !Number.isNaN(Number(v)); },

  toNum(v, fallback){
    if (v === '' || v === null || v === undefined) return fallback !== undefined ? fallback : NaN;
    const n = Number(v);
    return Number.isNaN(n) ? (fallback !== undefined ? fallback : NaN) : n;
  },

  debounce(fn, ms){
    let t;
    return function(...args){ clearTimeout(t); t = setTimeout(() => fn.apply(this,args), ms); };
  },

  copyToClipboard(text){
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(()=>Util.fallbackCopy(text));
    } else {
      Util.fallbackCopy(text);
    }
  },
  fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  },
  stripHtml(html){
    if (html === null || html === undefined) return '';
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html);
    return (tmp.textContent || tmp.innerText || '').trim();
  },

  download(filename, content, mime){
    const blob = new Blob([content], {type: mime || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  },

  timeAgo(ts){
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    const m = Math.floor(s/60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h/24);
    if (d < 30) return d + 'd ago';
    const mo = Math.floor(d/30);
    if (mo < 12) return mo + 'mo ago';
    return Math.floor(mo/12) + 'y ago';
  },

  fmtDate(ts, includeTime){
    const d = new Date(ts);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let s = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    if (includeTime) {
      let h = d.getHours(), mm = d.getMinutes();
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
      s += `, ${h}:${String(mm).padStart(2,'0')} ${ap}`;
    }
    return s;
  }
};

/* ------------------------------------------------------------
   SAFE EXPRESSION PARSER
   Recursive-descent parser + evaluator for arithmetic expressions.
   Supports: + - * / ^ % (mod when between numbers, or trailing
   percent operator), parentheses, unary +/-, decimals,
   factorial (!), and function calls (sin, cos, sqrt, log, etc).
   No eval() is used anywhere.
------------------------------------------------------------- */
class ExprError extends Error {}

class ExprParser {
  constructor(input, opts){
    this.src = input;
    this.pos = 0;
    this.len = input.length;
    this.angleMode = (opts && opts.angleMode) || 'deg'; // 'deg' | 'rad'
  }

  static evaluate(input, opts){
    const p = new ExprParser(input, opts);
    const tokens = p.tokenize();
    p.tokens = tokens; p.tpos = 0;
    const result = p.parseExpression();
    p.skipTrailingPercent(); // handled inline already, but guard
    if (p.tpos < p.tokens.length) {
      throw new ExprError('Unexpected token: ' + p.tokens[p.tpos].value);
    }
    if (Number.isNaN(result)) throw new ExprError('Invalid calculation (NaN)');
    return result;
  }

  skipTrailingPercent(){ /* no-op placeholder for symmetry */ }

  tokenize(){
    const toks = [];
    const s = this.src;
    let i = 0;
    const n = s.length;
    const isDigit = c => c >= '0' && c <= '9';
    const isAlpha = c => /[a-zA-Z_]/.test(c);
    while (i < n) {
      const c = s[i];
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if (isDigit(c) || (c === '.' && isDigit(s[i+1]))) {
        let j = i;
        while (j < n && (isDigit(s[j]) || s[j] === '.')) j++;
        // scientific notation e.g. 1.2e-5
        if (s[j] === 'e' || s[j] === 'E') {
          let k = j+1;
          if (s[k] === '+' || s[k] === '-') k++;
          if (isDigit(s[k])) {
            j = k;
            while (j < n && isDigit(s[j])) j++;
          }
        }
        toks.push({type:'num', value: s.slice(i,j)});
        i = j; continue;
      }
      if (isAlpha(c)) {
        let j = i;
        while (j < n && /[a-zA-Z0-9_]/.test(s[j])) j++;
        toks.push({type:'ident', value: s.slice(i,j)});
        i = j; continue;
      }
      if ('+-*/^%!(),'.includes(c)) {
        toks.push({type:'op', value: c});
        i++; continue;
      }
      if (c === '×') { toks.push({type:'op', value:'*'}); i++; continue; }
      if (c === '÷') { toks.push({type:'op', value:'/'}); i++; continue; }
      if (c === '√') { toks.push({type:'ident', value:'sqrt'}); i++; continue; }
      if (c === 'π') { toks.push({type:'num', value: String(Math.PI)}); i++; continue; }
      throw new ExprError(`Unexpected character "${c}" at position ${i+1}`);
    }
    return toks;
  }

  peek(){ return this.tokens[this.tpos]; }
  next(){ return this.tokens[this.tpos++]; }
  expectOp(v){
    const t = this.peek();
    if (!t || t.type !== 'op' || t.value !== v) throw new ExprError(`Expected "${v}"`);
    this.tpos++;
  }

  // Grammar (lowest to highest precedence):
  // expr    := term (('+'|'-') term)*
  // term    := percentTerm (('*'|'/') percentTerm)*
  // percentTerm := unary ('%' unary?)*      -- handles "X%" and "X % Y" (mod)
  // unary   := ('-'|'+') unary | power
  // power   := postfix ('^' unary)?
  // postfix := primary ('!')*
  // primary := number | ident '(' expr (',' expr)* ')' | ident | '(' expr ')'

  parseExpression(){
    let left = this.parseTerm();
    while (true) {
      const t = this.peek();
      if (t && t.type === 'op' && (t.value === '+' || t.value === '-')) {
        this.next();
        const right = this.parseTerm();
        left = t.value === '+' ? left + right : left - right;
      } else break;
    }
    return left;
  }

  parseTerm(){
    let left = this.parsePercentTerm();
    while (true) {
      const t = this.peek();
      if (t && t.type === 'op' && (t.value === '*' || t.value === '/')) {
        this.next();
        const right = this.parsePercentTerm();
        if (t.value === '/') {
          if (right === 0) throw new ExprError('Division by zero');
          left = left / right;
        } else left = left * right;
      } else if (t && (t.type === 'num' || (t.type==='ident' && !['e'].includes(t.value)) || (t.type==='op' && t.value === '('))) {
        // implicit multiplication e.g. "2(3+4)" or "2√9" -- rare but safe to support
        const right = this.parsePercentTerm();
        left = left * right;
      } else break;
    }
    return left;
  }

  parsePercentTerm(){
    let left = this.parseUnary();
    while (true) {
      const t = this.peek();
      if (t && t.type === 'op' && t.value === '%') {
        this.next();
        const nt = this.peek();
        // "X % Y" where Y follows on same precedence looks like modulus;
        // but "X%" trailing (no operand right before + - * / ) close/end means percent-of-100
        const isModContext = nt && (nt.type === 'num' || nt.type === 'ident' || (nt.type==='op' && nt.value==='('));
        if (isModContext) {
          const right = this.parseUnary();
          if (right === 0) throw new ExprError('Modulo by zero');
          left = left % right;
        } else {
          left = left / 100;
        }
      } else break;
    }
    return left;
  }

  parseUnary(){
    const t = this.peek();
    if (t && t.type === 'op' && (t.value === '-' || t.value === '+')) {
      this.next();
      const v = this.parseUnary();
      return t.value === '-' ? -v : v;
    }
    return this.parsePower();
  }

  parsePower(){
    const base = this.parsePostfix();
    const t = this.peek();
    if (t && t.type === 'op' && t.value === '^') {
      this.next();
      const exp = this.parseUnary();
      return Math.pow(base, exp);
    }
    return base;
  }

  parsePostfix(){
    let v = this.parsePrimary();
    while (true) {
      const t = this.peek();
      if (t && t.type === 'op' && t.value === '!') {
        this.next();
        v = ExprParser.factorial(v);
      } else break;
    }
    return v;
  }

  parsePrimary(){
    const t = this.peek();
    if (!t) throw new ExprError('Unexpected end of expression');
    if (t.type === 'num') { this.next(); return parseFloat(t.value); }
    if (t.type === 'op' && t.value === '(') {
      this.next();
      const v = this.parseExpression();
      this.expectOp(')');
      return v;
    }
    if (t.type === 'ident') {
      this.next();
      const name = t.value.toLowerCase();
      const nt = this.peek();
      if (nt && nt.type === 'op' && nt.value === '(') {
        this.next();
        const args = [];
        if (!(this.peek() && this.peek().type==='op' && this.peek().value===')')) {
          args.push(this.parseExpression());
          while (this.peek() && this.peek().type === 'op' && this.peek().value === ',') {
            this.next();
            args.push(this.parseExpression());
          }
        }
        this.expectOp(')');
        return ExprParser.callFn(name, args, this.angleMode);
      }
      return ExprParser.constant(name);
    }
    throw new ExprError('Unexpected token: ' + t.value);
  }

  static factorial(n){
    if (n < 0 || !Number.isFinite(n)) throw new ExprError('Factorial requires a non-negative number');
    if (Math.abs(n - Math.round(n)) > 1e-9) {
      // gamma approximation for non-integers (rare use) — Stirling
      return ExprParser.gamma(n+1);
    }
    n = Math.round(n);
    if (n > 170) throw new ExprError('Factorial too large');
    let r = 1;
    for (let i=2;i<=n;i++) r*=i;
    return r;
  }
  static gamma(z){
    const g=7, p=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    if (z < 0.5) return Math.PI / (Math.sin(Math.PI*z) * ExprParser.gamma(1-z));
    z -= 1; let x = p[0];
    for (let i=1;i<g+2;i++) x += p[i]/(z+i);
    const t = z + g + 0.5;
    return Math.sqrt(2*Math.PI) * Math.pow(t, z+0.5) * Math.exp(-t) * x;
  }

  static constant(name){
    switch(name){
      case 'pi': return Math.PI;
      case 'e': return Math.E;
      case 'ans': return MState.lastAnswer || 0;
      default: throw new ExprError('Unknown identifier: ' + name);
    }
  }

  static callFn(name, args, angleMode){
    const a = args[0];
    const toRad = v => angleMode === 'deg' ? v * Math.PI / 180 : v;
    const fromRad = v => angleMode === 'deg' ? v * 180 / Math.PI : v;
    switch(name){
      case 'sin': return Math.sin(toRad(a));
      case 'cos': return Math.cos(toRad(a));
      case 'tan': {
        const rad = toRad(a);
        const c = Math.cos(rad);
        if (Math.abs(c) < 1e-12) throw new ExprError('Tan undefined at this angle');
        return Math.tan(rad);
      }
      case 'asin': if (a<-1||a>1) throw new ExprError('asin domain is [-1,1]'); return fromRad(Math.asin(a));
      case 'acos': if (a<-1||a>1) throw new ExprError('acos domain is [-1,1]'); return fromRad(Math.acos(a));
      case 'atan': return fromRad(Math.atan(a));
      case 'sinh': return Math.sinh(a);
      case 'cosh': return Math.cosh(a);
      case 'tanh': return Math.tanh(a);
      case 'log': return args.length>1 ? Math.log(args[1])/Math.log(a) : (a<=0 ? (()=>{throw new ExprError('log domain must be > 0')})() : Math.log10(a));
      case 'ln': if (a<=0) throw new ExprError('ln domain must be > 0'); return Math.log(a);
      case 'sqrt': if (a<0) throw new ExprError('sqrt of negative number'); return Math.sqrt(a);
      case 'cbrt': return Math.cbrt(a);
      case 'abs': return Math.abs(a);
      case 'round': return args.length>1 ? Math.round(a*Math.pow(10,args[1]))/Math.pow(10,args[1]) : Math.round(a);
      case 'floor': return Math.floor(a);
      case 'ceil': return Math.ceil(a);
      case 'exp': return Math.exp(a);
      case 'pow': return Math.pow(a, args[1]);
      case 'max': return Math.max(...args);
      case 'min': return Math.min(...args);
      case 'fact': return ExprParser.factorial(a);
      case 'mod': return a % args[1];
      default: throw new ExprError('Unknown function: ' + name);
    }
  }
}

/* ------------------------------------------------------------
   STORAGE LAYER — safe localStorage wrapper.
   Falls back to in-memory store if localStorage is unavailable
   (private browsing quota errors, disabled storage, etc.)
------------------------------------------------------------- */
const Store = (function(){
  const NS = 'calcMaster.';
  let memFallback = {};
  let usingFallback = false;

  function testLS(){
    try {
      const k = '__cm_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch(e) { return false; }
  }
  usingFallback = !testLS();

  function get(key, fallback){
    try {
      if (usingFallback) {
        return key in memFallback ? memFallback[key] : fallback;
      }
      const raw = window.localStorage.getItem(NS + key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch(e) {
      console.warn('Store.get failed for', key, e);
      return fallback;
    }
  }

  function set(key, value){
    try {
      if (usingFallback) {
        memFallback[key] = value;
        return true;
      }
      window.localStorage.setItem(NS + key, JSON.stringify(value));
      return true;
    } catch(e) {
      console.warn('Store.set failed for', key, e);
      if (e && e.name === 'QuotaExceededError') {
        Toast.show('Storage full — try clearing old history', 'warn');
      }
      return false;
    }
  }

  function remove(key){
    try {
      if (usingFallback) { delete memFallback[key]; return; }
      window.localStorage.removeItem(NS + key);
    } catch(e){}
  }

  return { get, set, remove, isUsingFallback: () => usingFallback };
})();

/* ------------------------------------------------------------
   TOAST — small transient notifications
------------------------------------------------------------- */
const Toast = {
  show(msg, kind, action){
    const stack = document.getElementById('toast-stack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast';
    let ic = 'check';
    if (kind === 'warn') ic = 'alert';
    if (kind === 'error') ic = 'alert';
    el.innerHTML = icon(ic) + '<span class="toast-msg">' + Util.esc(msg) + '</span>';
    if (action && action.label && typeof action.onClick === 'function') {
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.textContent = action.label;
      btn.addEventListener('click', () => {
        action.onClick();
        el.classList.remove('show');
        setTimeout(()=> el.remove(), 220);
      });
      el.appendChild(btn);
    }
    stack.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    const dismissMs = action ? 5000 : 2400; // give the person time to notice/click an action
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=> el.remove(), 220);
    }, dismissMs);
  }
};

/* ------------------------------------------------------------
   APPLICATION STATE (MState)
   Central mutable state + persistence for: theme, favorites,
   history, angle mode, last answer (for `ans` in expressions).
------------------------------------------------------------- */
const MState = {
  theme: Store.get('theme', 'light'),
  favorites: Store.get('favorites', []),      // array of calculator ids
  pinned: Store.get('pinned', []),            // array of calculator ids, pinned above categories
  collapsedCats: Store.get('collapsedCats', []), // category names currently collapsed in sidebar
  history: Store.get('history', []),          // array of {id, calcId, expr, result, resultText, ts, fav}
  angleMode: Store.get('angleMode', 'deg'),
  lastAnswer: Store.get('lastAnswer', 0),
  recentCalcIds: Store.get('recentCalcIds', []), // most-recently-visited calculator ids
  currentCalcId: null,
  notes: Store.get('calcNotes', {}),          // { historyEntryId: 'note text' }
  prefs: Store.get('prefs', { precision:2, thousandsSep:true, density:'comfortable', fontSize:'md', accent:'brass' }),
  pinnedConversions: Store.get('pinnedConversions', []), // [{cat, from, to}] for unit converter quick-access

  saveTheme(t){ this.theme = t; Store.set('theme', t); },
  saveAngleMode(m){ this.angleMode = m; Store.set('angleMode', m); },
  saveLastAnswer(n){ this.lastAnswer = n; Store.set('lastAnswer', n); },
  savePrefs(p){ Object.assign(this.prefs, p); Store.set('prefs', this.prefs); },
  saveNote(entryId, text){
    if (text && text.trim()) this.notes[entryId] = text.trim();
    else delete this.notes[entryId];
    Store.set('calcNotes', this.notes);
  },

  togglePinned(calcId){
    const idx = this.pinned.indexOf(calcId);
    if (idx >= 0) this.pinned.splice(idx,1);
    else this.pinned.unshift(calcId);
    Store.set('pinned', this.pinned);
    return this.pinned.includes(calcId);
  },
  isPinned(calcId){ return this.pinned.includes(calcId); },

  toggleConversionPin(cat, from, to){
    const idx = this.pinnedConversions.findIndex(p => p.cat===cat && p.from===from && p.to===to);
    if (idx >= 0) { this.pinnedConversions.splice(idx,1); Store.set('pinnedConversions', this.pinnedConversions); return false; }
    this.pinnedConversions.unshift({cat, from, to});
    if (this.pinnedConversions.length > 8) this.pinnedConversions.length = 8; // keep the bar tidy
    Store.set('pinnedConversions', this.pinnedConversions);
    return true;
  },
  isConversionPinned(cat, from, to){
    return this.pinnedConversions.some(p => p.cat===cat && p.from===from && p.to===to);
  },

  toggleCategoryCollapsed(cat){
    const idx = this.collapsedCats.indexOf(cat);
    if (idx >= 0) this.collapsedCats.splice(idx,1);
    else this.collapsedCats.push(cat);
    Store.set('collapsedCats', this.collapsedCats);
  },
  isCategoryCollapsed(cat){ return this.collapsedCats.includes(cat); },

  toggleFavorite(calcId){
    const idx = this.favorites.indexOf(calcId);
    if (idx >= 0) this.favorites.splice(idx,1);
    else this.favorites.unshift(calcId);
    Store.set('favorites', this.favorites);
    return this.favorites.includes(calcId);
  },
  isFavorite(calcId){ return this.favorites.includes(calcId); },

  pushRecent(calcId){
    this.recentCalcIds = [calcId, ...this.recentCalcIds.filter(id => id !== calcId)].slice(0, 8);
    Store.set('recentCalcIds', this.recentCalcIds);
  },

  addHistory(entry){
    const rec = {
      id: Util.uid(),
      calcId: entry.calcId,
      calcLabel: entry.calcLabel || '',
      expr: entry.expr || '',
      resultText: entry.resultText || '',
      resultRaw: (entry.resultRaw !== undefined ? entry.resultRaw : null),
      ts: Date.now(),
      fav: false
    };
    this.history.unshift(rec);
    if (this.history.length > 500) this.history.length = 500; // cap growth
    Store.set('history', this.history);
    return rec;
  },
  toggleHistoryFav(id){
    const rec = this.history.find(h => h.id === id);
    if (!rec) return;
    rec.fav = !rec.fav;
    Store.set('history', this.history);
  },
  deleteHistory(id){
    const idx = this.history.findIndex(h => h.id === id);
    if (idx === -1) return null;
    const [removed] = this.history.splice(idx, 1);
    Store.set('history', this.history);
    return { removed, idx };
  },
  restoreHistoryEntry(removed, idx){
    if (!removed) return;
    const at = Math.min(idx, this.history.length);
    this.history.splice(at, 0, removed);
    Store.set('history', this.history);
  },
  clearHistory(keepFavs){
    const removed = keepFavs ? this.history.filter(h => !h.fav) : this.history.slice();
    this.history = keepFavs ? this.history.filter(h => h.fav) : [];
    Store.set('history', this.history);
    return removed;
  },
  restoreHistoryBulk(removed){
    if (!removed || !removed.length) return;
    const existingIds = new Set(this.history.map(h=>h.id));
    removed.forEach(r => { if (!existingIds.has(r.id)) this.history.push(r); });
    this.history.sort((a,b)=> b.ts - a.ts);
    Store.set('history', this.history);
  },
  exportJSON(){
    return JSON.stringify({
      exportedAt: new Date().toISOString(),
      app: 'Calculator Master',
      version: 2,
      history: this.history,
      favorites: this.favorites,
      pinned: this.pinned,
      notes: this.notes,
      prefs: this.prefs
    }, null, 2);
  },
  exportCSV(){
    const rows = [['Date','Calculator','Expression','Result','Favorite']];
    this.history.forEach(h => {
      rows.push([
        Util.fmtDate(h.ts, true),
        h.calcLabel || h.calcId,
        (h.expr||'').replace(/"/g,'""'),
        (h.resultText||'').replace(/"/g,'""'),
        h.fav ? 'Yes' : 'No'
      ]);
    });
    return rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  },
  importJSON(text){
    let data;
    try { data = JSON.parse(text); }
    catch(e) { throw new Error('Invalid JSON file'); }
    if (!data || !Array.isArray(data.history)) throw new Error('File does not contain valid history data');
    const existingIds = new Set(this.history.map(h=>h.id));
    let added = 0;
    data.history.forEach(h => {
      if (h && h.id && !existingIds.has(h.id)) {
        this.history.push(h);
        existingIds.add(h.id);
        added++;
      }
    });
    this.history.sort((a,b)=> b.ts - a.ts);
    if (Array.isArray(data.favorites)) {
      data.favorites.forEach(f => { if (!this.favorites.includes(f)) this.favorites.push(f); });
      Store.set('favorites', this.favorites);
    }
    if (Array.isArray(data.pinned)) {
      data.pinned.forEach(p => { if (!this.pinned.includes(p)) this.pinned.push(p); });
      Store.set('pinned', this.pinned);
    }
    if (data.notes && typeof data.notes === 'object') {
      Object.assign(this.notes, data.notes);
      Store.set('calcNotes', this.notes);
    }
    if (data.prefs && typeof data.prefs === 'object') {
      Object.assign(this.prefs, data.prefs);
      Store.set('prefs', this.prefs);
    }
    Store.set('history', this.history);
    return added;
  }
};

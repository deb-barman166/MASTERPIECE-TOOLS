            <select class="input" id="nt-mode"></select>
          </div>
          <div id="nt-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="nt-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="nt-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="nt-result"></div>
      </div>
    `;
    const sel = document.getElementById('nt-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('nt-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('nt-result'), 'Enter a number to analyze.');
    document.getElementById('nt-calc').addEventListener('click', compute);
    document.getElementById('nt-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('nt-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'prime': case 'factors': case 'primefactor': case 'armstrong': case 'palindrome':
        return `<div class="field-grid f1"><div class="field"><label>Number <span class="req">*</span></label><input type="number" class="input" id="nt-n" placeholder="97" step="1"><span class="field-err" id="nt-n-err"></span></div></div>`;
      case 'gcdlcm': return `
        <div class="field f1">
          <label>Numbers (comma separated, at least 2) <span class="req">*</span></label>
          <input type="text" class="input" id="nt-nums" placeholder="24, 36, 60">
          <span class="field-err" id="nt-nums-err"></span>
        </div>`;
      case 'fibonacci': return `<div class="field-grid f1"><div class="field"><label>Number of terms <span class="req">*</span></label><input type="number" class="input" id="nt-terms" placeholder="15" step="1"><span class="field-err" id="nt-terms-err"></span></div></div>`;
      case 'divisibility': return `
        <div class="field-grid">
          <div class="field"><label>Number <span class="req">*</span></label><input type="number" class="input" id="nt-n" placeholder="360" step="1"><span class="field-err" id="nt-n-err"></span></div>
          <div class="field"><label>Divisor</label><input type="number" class="input" id="nt-d" placeholder="12" step="1"><span class="field-err" id="nt-d-err"></span></div>
        </div>`;
      default: return '';
    }
  }
  function renderFields(){ document.getElementById('nt-fields').innerHTML = fieldsFor(mode); }

  function isPrime(n){
    if (n < 2) return false;
    if (n < 4) return true;
    if (n % 2 === 0) return false;
    for (let i=3;i*i<=n;i+=2) if (n%i===0) return false;
    return true;
  }
  function allFactors(n){
    const fs = [];
    for (let i=1;i*i<=n;i++) if (n%i===0) { fs.push(i); if (i!==n/i) fs.push(n/i); }
    return fs.sort((a,b)=>a-b);
  }
  function primeFactorize(n){
    const factors = []; let d=2, x=n;
    while (d*d<=x) { while (x%d===0){ factors.push(d); x/=d; } d++; }
    if (x>1) factors.push(x);
    return factors;
  }

  // Builds a genuine binary "factor tree" (the classic teaching diagram),
  // not just the flat factor list — each composite node splits into its
  // smallest prime factor and the remaining quotient, recursively, until
  // every leaf is prime. { value, isPrime, left, right }
  function buildFactorTree(n){
    if (isPrime(n) || n <= 1) return { value:n, isPrime:true, left:null, right:null };
    let smallest = n;
    for (let d=2; d*d<=n; d++) { if (n%d===0) { smallest = d; break; } }
    const other = n / smallest;
    return { value:n, isPrime:false, left: buildFactorTree(smallest), right: buildFactorTree(other) };
  }
  function gcdOf(a,b){ a=Math.abs(a);b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a; }

  function numField(id,label,errs,opts){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id,label+' is required']); return NaN; }
    const n = Util.toNum(v);
    if (opts && opts.int && !Number.isInteger(n)) { errs.push([id,label+' must be a whole number']); return NaN; }
    if (opts && opts.positive && n <= 0) { errs.push([id,label+' must be greater than zero']); return NaN; }
    return n;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('nt-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'prime') {
        const n = numField('nt-n','Number',errs,{int:true});
        if (!errs.length) {
          if (n > 1e12) { errs.push(['nt-n','Please use a smaller number for prime checking']); }
          else { const p = isPrime(n);
            out = { label: p?'Prime':'Not prime', value: p?'Yes ✓':'No', valueClass: p?'pos':'neg',
              steps:[p ? `${n} has no divisors other than 1 and itself → <b>prime</b>` : (n<2 ? `${n} is less than 2, so it's not prime by definition` : `${n} is divisible by at least one number other than 1 and itself → <b>not prime</b>`)],
              expr:`Is ${n} prime?`, raw: p };
          }
        }
      } else if (mode === 'factors') {
        const n = numField('nt-n','Number',errs,{int:true,positive:true});
        if (!errs.length) {
          if (n > 1e8) { errs.push(['nt-n','Please use a smaller number']); }
          else { const fs = allFactors(n);
            out = { label:'Factors', value: fs.length>40 ? fs.slice(0,40).join(', ')+`, … (${fs.length} total)` : fs.join(', '),
              extras:[{k:'Count', v:String(fs.length)}, {k:'Sum of factors', v:Util.fmt(fs.reduce((a,b)=>a+b,0))}],
              steps:[`Factors of ${n}: <b>${fs.join(', ')}</b>`], expr:`factors of ${n}`, raw: fs.length };
          }
        }
      } else if (mode === 'primefactor') {
        const n = numField('nt-n','Number',errs,{int:true,positive:true});
        if (!errs.length) {
          if (n === 1) { out = { label:'Prime factorization', value:'1 has no prime factors', steps:['1 is a unit, not composed of primes.'], expr:'factorize 1', raw:null }; }
          else if (n > 1e12) { errs.push(['nt-n','Please use a smaller number']); }
          else { const factors = primeFactorize(n); const counts={};
            factors.forEach(f=>counts[f]=(counts[f]||0)+1);
            const expr2 = Object.entries(counts).map(([p,c])=>c>1?`${p}^${c}`:`${p}`).join(' × ');
            out = { label:'Prime factorization', value: expr2, steps:[`${n} = ${factors.join(' × ')} = <b>${expr2}</b>`], expr:`factorize ${n}`, raw: expr2,
              factorTree: n <= 1e7 ? buildFactorTree(n) : null }; // skip the tree for huge numbers — flat list already covers those, and a tree with 30+ leaves stops being a useful diagram
          }
        }
      } else if (mode === 'gcdlcm') {
        const raw = document.getElementById('nt-nums').value;
        const nums = raw.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).map(Number);
        if (!raw.trim() || nums.some(isNaN) || nums.some(n=>!Number.isInteger(n)||n<=0) || nums.length < 2) {
          errs.push(['nt-nums','Enter at least 2 positive whole numbers, comma separated']);
        } else {
          const gcd = nums.reduce((a,b)=>gcdOf(a,b));
          const lcm = nums.reduce((a,b)=> (a*b)/gcdOf(a,b));
          out = { label:'GCD', value: Util.fmt(gcd), extras:[{k:'LCM', v:Util.fmt(lcm)}],
            steps:[`GCD(${nums.join(', ')}) = <b>${Util.fmt(gcd)}</b>`, `LCM(${nums.join(', ')}) = <b>${Util.fmt(lcm)}</b>`], expr:`GCD/LCM of [${nums.join(', ')}]`, raw: gcd };
        }
      } else if (mode === 'fibonacci') {
        const terms = numField('nt-terms','Number of terms',errs,{int:true,positive:true});
        if (!errs.length) {
          if (terms > 200) { errs.push(['nt-terms','Please use 200 terms or fewer']); }
          else {
            const seq = [0,1];
            while (seq.length < terms) seq.push(seq[seq.length-1]+seq[seq.length-2]);
            const shown = seq.slice(0, terms);
            out = { label:`${terms}th term`, value: Util.fmt(shown[terms-1] || 0),
              extras:[{k:'Sequence', v: shown.length<=20 ? shown.map(Util.fmt).join(', ') : shown.slice(0,20).map(Util.fmt).join(', ')+', …' }],
              steps:[`Sequence: ${shown.slice(0,Math.min(12,shown.length)).map(Util.fmt).join(', ')}${shown.length>12?', …':''}`], expr:`Fibonacci ${terms} terms`, raw: shown[terms-1] };
          }
        }
      } else if (mode === 'armstrong') {
        const n = numField('nt-n','Number',errs,{int:true,positive:true});
        if (!errs.length) {
          const digits = String(Math.trunc(n)).split('').map(Number);
          const power = digits.length;
          const sum = digits.reduce((a,d)=>a+Math.pow(d,power),0);
          const isArm = sum === n;
          out = { label: isArm?'Armstrong number':'Not an Armstrong number', value: isArm?'Yes ✓':'No', valueClass:isArm?'pos':'neg',
            steps:[`Digits: ${digits.join(', ')} (power ${power})`, `Sum of digits^${power} = ${digits.map(d=>`${d}^${power}`).join(' + ')} = <b>${sum}</b>`, sum===n?`Equals original number → <b>Armstrong</b>`:`Does not equal ${n} → <b>not Armstrong</b>`],
            expr:`Is ${n} Armstrong?`, raw: isArm };
        }
      } else if (mode === 'palindrome') {
        const n = numField('nt-n','Number',errs,{int:true});
        if (!errs.length) {
          const s = String(Math.abs(Math.trunc(n)));
          const rev = s.split('').reverse().join('');
          const isPal = s === rev;
          out = { label: isPal?'Palindrome':'Not a palindrome', value: isPal?'Yes ✓':'No', valueClass:isPal?'pos':'neg',
            steps:[`${s} reversed is ${rev}`, isPal?'They match → <b>palindrome</b>':'They differ → <b>not a palindrome</b>'], expr:`Is ${n} a palindrome?`, raw: isPal };
        }
      } else if (mode === 'divisibility') {
        const n = numField('nt-n','Number',errs,{int:true}), d = numField('nt-d','Divisor',errs,{int:true});
        if (!errs.length) {
          if (d === 0) { errs.push(['nt-d','Divisor cannot be zero']); }
          else { const divisible = n % d === 0;
            out = { label: divisible?'Divisible':'Not divisible', value: divisible?'Yes ✓':'No', valueClass:divisible?'pos':'neg',
              extras: divisible ? [{k:'Quotient', v:Util.fmt(n/d)}] : [{k:'Remainder', v:Util.fmt(n%d)}],
              steps:[`${n} ÷ ${d} = ${Util.fmt(n/d)}`, divisible?`No remainder → <b>divisible</b>`:`Remainder ${Util.fmt(n%d)} → <b>not divisible</b>`], expr:`Is ${n} divisible by ${d}?`, raw: divisible };
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(String(out.value)), valueClass: out.valueClass, extras: out.extras, steps: out.steps,
      plainValue: String(out.value), copyText: `${out.expr} → ${out.label}: ${out.value}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'numtheory', calcLabel:'Number Theory', expr: out.expr, resultText: String(out.value), resultRaw: out.raw });

    // Prime factorization tree (feature 32) — the classic teaching diagram,
    // shown below the standard result when available.
    if (out.factorTree) {
      renderFactorTree(resEl, out.factorTree);
    }
  }

  function renderFactorTree(resEl, tree){
    const wrap = document.createElement('div');
    wrap.className = 'ftree-wrap';
    wrap.innerHTML = `<div class="ftree-title">Factor tree</div><div class="ftree-canvas" id="ftree-canvas"></div>`;
    resEl.appendChild(wrap);
    const canvas = wrap.querySelector('#ftree-canvas');
    canvas.appendChild(renderTreeNode(tree));
  }

  function renderTreeNode(node){
    const el = document.createElement('div');
    el.className = 'ftree-node';
    const circle = document.createElement('div');
    circle.className = 'ftree-circle' + (node.isPrime ? ' is-prime' : '');
    circle.textContent = node.value;
    el.appendChild(circle);
    if (!node.isPrime && node.left && node.right) {
      const children = document.createElement('div');
      children.className = 'ftree-children';
      children.appendChild(renderTreeNode(node.left));
      children.appendChild(renderTreeNode(node.right));
      el.appendChild(children);
    }
    return el;
  }

  return { render };
})();

/* ---------------- 16. MATRIX ---------------- */
Calculators.matrix = (function(){
  const MODES = [
    { id:'add',       label:'Addition (A + B)' },
    { id:'subtract',  label:'Subtraction (A − B)' },
    { id:'multiply',  label:'Multiplication (A × B)' },
    { id:'transpose', label:'Transpose (Aᵀ)' },
    { id:'determinant', label:'Determinant' },
    { id:'trace',       label:'Trace (sum of diagonal)' },
    { id:'inverse',   label:'Inverse' },
    { id:'identity',  label:'Identity matrix generator' },
  ];
  let mode = 'add';
  let dimsA = {r:2,c:2}, dimsB = {r:2,c:2};

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose operation</label>
            <select class="input" id="mx-mode"></select>
          </div>
          <div id="mx-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="mx-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="mx-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="mx-result"></div>
      </div>
    `;
    const sel = document.getElementById('mx-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('mx-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('mx-result'), 'Set dimensions, fill in values, then calculate.');
    document.getElementById('mx-calc').addEventListener('click', compute);
    document.getElementById('mx-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('mx-result')); ErrBanner.clear(); });
  }

  function needsB(){ return ['add','subtract','multiply'].includes(mode); }
  function needsA(){ return mode !== 'identity'; }

  function matrixInputHTML(label, id, dims){
    let cells = '';
    for (let i=0;i<dims.r;i++) for (let j=0;j<dims.c;j++) cells += `<input type="number" id="${id}-${i}-${j}" value="0">`;
    return `<div class="matrix-block">
      <div class="matrix-dims">
        <b>${Util.esc(label)}</b>
        <input type="number" class="input" id="${id}-rows" min="1" max="8" value="${dims.r}" step="1"> ×
        <input type="number" class="input" id="${id}-cols" min="1" max="8" value="${dims.c}" step="1">
        <button class="btn btn-ghost btn-sm" data-resize="${id}">Resize</button>
      </div>
      <div class="matrix-grid" id="${id}-grid" style="grid-template-columns:repeat(${dims.c}, auto);">${cells}</div>
    </div>`;
  }

  function renderFields(){
    let html = '<div class="matrix-wrap">';
    if (mode === 'identity') {
      html += `<div class="field"><label>Size (n)</label><input type="number" class="input" id="mx-idsize" value="3" min="1" max="10" step="1"></div>`;
    } else {
      if (needsA()) html += matrixInputHTML('Matrix A', 'mxA', dimsA);
      if (needsB()) html += matrixInputHTML('Matrix B', 'mxB', dimsB);
    }
    html += '</div>';
    document.getElementById('mx-fields').innerHTML = html;

    document.querySelectorAll('[data-resize]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-resize');
        const r = Util.clamp(Math.round(Util.toNum(document.getElementById(id+'-rows').value,2)),1,8);
        const c = Util.clamp(Math.round(Util.toNum(document.getElementById(id+'-cols').value,2)),1,8);
        if (id === 'mxA') dimsA = {r,c}; else dimsB = {r,c};
        renderFields();
      });
    });
  }

  function readMatrix(id, dims){
    const m = [];
    for (let i=0;i<dims.r;i++) {
      const row = [];
      for (let j=0;j<dims.c;j++) {
        const el = document.getElementById(`${id}-${i}-${j}`);
        row.push(Util.toNum(el ? el.value : '0', 0));
      }
      m.push(row);
    }
    return m;
  }

  function determinant(mat){
    const n = mat.length;
    const m = mat.map(row => [...row]);
    let det = 1;
    for (let i=0;i<n;i++){
      let pivot = i;
      for (let k=i+1;k<n;k++) if (Math.abs(m[k][i]) > Math.abs(m[pivot][i])) pivot = k;
      if (Math.abs(m[pivot][i]) < 1e-10) return 0;
      if (pivot !== i) { [m[i],m[pivot]]=[m[pivot],m[i]]; det *= -1; }
      det *= m[i][i];
      for (let k=i+1;k<n;k++){
        const factor = m[k][i]/m[i][i];
        for (let j=i;j<n;j++) m[k][j] -= factor*m[i][j];
      }
    }
    return det;
  }
  function inverse(mat){
    const n = mat.length;
    const aug = mat.map((row,i) => [...row, ...Array.from({length:n},(_,j)=> i===j?1:0)]);
    for (let i=0;i<n;i++){
      let pivot = i;
      for (let k=i+1;k<n;k++) if (Math.abs(aug[k][i]) > Math.abs(aug[pivot][i])) pivot=k;
      if (Math.abs(aug[pivot][i]) < 1e-10) return null;
      [aug[i],aug[pivot]] = [aug[pivot],aug[i]];
      const div = aug[i][i];
      for (let j=0;j<2*n;j++) aug[i][j] /= div;
      for (let k=0;k<n;k++){
        if (k===i) continue;
        const factor = aug[k][i];
        for (let j=0;j<2*n;j++) aug[k][j] -= factor*aug[i][j];
      }
    }
    return aug.map(row => row.slice(n));
  }

  function renderMatrixGridHTML(mat){
    const cols = mat[0] ? mat[0].length : 1;
    let html = `<div class="matrix-result-grid" style="grid-template-columns:repeat(${cols}, auto);">`;
    mat.forEach(row => row.forEach(val => { html += `<div class="mcell">${Util.esc(Util.fmt(val))}</div>`; }));
    html += '</div>';
    return html;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('mx-result');
    let out;

    try {
      if (mode === 'identity') {
        const nEl = document.getElementById('mx-idsize');
        const n = Util.clamp(Math.round(Util.toNum(nEl.value,3)),1,10);
        const I = Array.from({length:n},(_, i) => Array.from({length:n},(_, j) => i===j?1:0));
        out = { gridHTML: renderMatrixGridHTML(I), label:`${n}×${n} Identity matrix`, expr:`identity(${n})`, raw: n };
      } else if (mode === 'transpose') {
        const A = readMatrix('mxA', dimsA);
        const T = Array.from({length:dimsA.c},(_, j) => Array.from({length:dimsA.r},(_, i) => A[i][j]));
        out = { gridHTML: renderMatrixGridHTML(T), label:`Transpose (${dimsA.c}×${dimsA.r})`, expr:`transpose of ${dimsA.r}x${dimsA.c} matrix`, raw: null };
      } else if (mode === 'determinant') {
        if (dimsA.r !== dimsA.c) { ErrBanner.show('Determinant requires a square matrix (rows = columns).'); return; }
        const A = readMatrix('mxA', dimsA);
        const det = determinant(A);
        out = { label:'Determinant', value: Util.fmt(det), expr:`det of ${dimsA.r}x${dimsA.c} matrix`, raw: det };
      } else if (mode === 'trace') {
        if (dimsA.r !== dimsA.c) { ErrBanner.show('Trace requires a square matrix (rows = columns) — it is the sum of the main diagonal.'); return; }
        const A = readMatrix('mxA', dimsA);
        let tr = 0;
        const diagTerms = [];
        for (let i=0;i<dimsA.r;i++) { tr += A[i][i]; diagTerms.push(Util.fmt(A[i][i])); }
        out = { label:'Trace', value: Util.fmt(tr), sub:`sum of diagonal: ${diagTerms.join(' + ')}`, expr:`trace of ${dimsA.r}x${dimsA.c} matrix`, raw: tr };
      } else if (mode === 'inverse') {
        if (dimsA.r !== dimsA.c) { ErrBanner.show('Inverse requires a square matrix (rows = columns).'); return; }
        const A = readMatrix('mxA', dimsA);
        const inv = inverse(A);
        if (!inv) { ErrBanner.show('This matrix is singular (determinant is 0) and has no inverse.'); return; }
        out = { gridHTML: renderMatrixGridHTML(inv), label:`Inverse (${dimsA.r}×${dimsA.c})`, expr:`inverse of ${dimsA.r}x${dimsA.c} matrix`, raw: null };
      } else if (mode === 'add' || mode === 'subtract') {
        if (dimsA.r !== dimsB.r || dimsA.c !== dimsB.c) { ErrBanner.show('Both matrices must have the same dimensions for addition/subtraction.'); return; }
        const A = readMatrix('mxA', dimsA), B = readMatrix('mxB', dimsB);
        const R = A.map((row,i) => row.map((v,j) => mode==='add' ? v+B[i][j] : v-B[i][j]));
        out = { gridHTML: renderMatrixGridHTML(R), label: mode==='add'?'A + B':'A − B', expr:`${mode} ${dimsA.r}x${dimsA.c} matrices`, raw: null };
      } else if (mode === 'multiply') {
        if (dimsA.c !== dimsB.r) { ErrBanner.show(`Cannot multiply: A has ${dimsA.c} columns but B has ${dimsB.r} rows. They must match.`); return; }
        const A = readMatrix('mxA', dimsA), B = readMatrix('mxB', dimsB);
        const R = Array.from({length:dimsA.r},()=>Array(dimsB.c).fill(0));
        for (let i=0;i<dimsA.r;i++) for (let j=0;j<dimsB.c;j++) { let s=0; for (let k=0;k<dimsA.c;k++) s+=A[i][k]*B[k][j]; R[i][j]=s; }
        out = { gridHTML: renderMatrixGridHTML(R), label:`A × B (${dimsA.r}×${dimsB.c})`, expr:`multiply ${dimsA.r}x${dimsA.c} by ${dimsB.r}x${dimsB.c}`, raw: null };
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (!out) return;

    if (out.gridHTML) {
      resEl.innerHTML = `<div class="result-card">
        <div class="result-main"><div class="rm-label">${Util.esc(out.label)}</div></div>
        <div class="steps-block" style="padding-top:16px;">${out.gridHTML}</div>
        <div class="result-actions">
          <button class="btn btn-ghost btn-sm" id="mx-rp-reset">${icon('reset')} Reset</button>
        </div>
      </div>`;
      document.getElementById('mx-rp-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(resEl); });
      MState.addHistory({ calcId:'matrix', calcLabel:'Matrix', expr: out.expr, resultText: out.label, resultRaw: out.raw });
    } else {
      ResultPanel.render(resEl, {
        label: out.label, value: Util.esc(out.value), sub: out.sub, plainValue: out.value,
        copyText: `${out.expr} → ${out.label}: ${out.value}`,
        onReset: () => { renderFields(); ResultPanel.empty(resEl); }
      });
      MState.addHistory({ calcId:'matrix', calcLabel:'Matrix', expr: out.expr, resultText: out.value, resultRaw: out.raw });
    }
  }

  return { render };
})();

/* ============================================================
   UNIVERSAL CALCULATOR — full implementation
   Pattern-matches natural language input and routes to the
   appropriate calculator's math, then renders a self-contained
   result card directly on the dashboard (also logs to history
   under the resolved calculator's id, so it appears in that
   calculator's own history too).
   ============================================================ */
(function(){
  const UNIT_WORD_MAP = {
    km:'km', kilometer:'km', kilometers:'km', kilometre:'km', kilometres:'km',
    m:'m', meter:'m', meters:'m', metre:'m', metres:'m',
    cm:'cm', centimeter:'cm', centimeters:'cm',
    mm:'mm', millimeter:'mm', millimeters:'mm',
    mi:'mi', mile:'mi', miles:'mi',
    yd:'yd', yard:'yd', yards:'yd',
    ft:'ft', foot:'ft', feet:'ft',
    in:'in', inch:'in', inches:'in',
    kg:'kg', kilogram:'kg', kilograms:'kg',
    g:'g', gram:'g', grams:'g',
    lb:'lb', lbs:'lb', pound:'lb', pounds:'lb',
    oz:'oz', ounce:'oz', ounces:'oz',
    l:'l', liter:'l', liters:'l', litre:'l', litres:'l',
    ml:'ml', milliliter:'ml', milliliters:'ml',
    gal:'gal', gallon:'gal', gallons:'gal',
  };
  const UNIT_ALTERNATION = Object.keys(UNIT_WORD_MAP).sort((a,b)=>b.length-a.length).join('|');
  const TEMP_WORDS = { c:'c', celsius:'c', f:'f', fahrenheit:'f', k:'k', kelvin:'k' };

  const PATTERNS = [
    { name:'pct_of', re: new RegExp(`^(\\d+(?:\\.\\d+)?)\\s*%?\\s*(?:percent\\s*)?of\\s*(\\d+(?:\\.\\d+)?)$`, 'i'),
      run: (m) => {
        const pct = parseFloat(m[1]), n = parseFloat(m[2]);
        const val = (pct/100)*n;
        return { calcId:'percentage', calcLabel:'Percentage Master', label:`${Util.fmt(pct)}% of ${Util.fmt(n)}`, value: Util.fmt(val),
          steps:[`(${Util.fmt(pct)} ÷ 100) × ${Util.fmt(n)} = <b>${Util.fmt(val)}</b>`], raw: val };
      } },
    { name:'increase_by', re: /(\d+(?:\.\d+)?)\s*increased\s*by\s*(\d+(?:\.\d+)?)\s*%/i,
      run:(m)=>{ const base=parseFloat(m[1]), pct=parseFloat(m[2]); const val=base*(1+pct/100);
        return { calcId:'percentage', calcLabel:'Percentage Master', label:`${Util.fmt(base)} increased by ${Util.fmt(pct)}%`, value:Util.fmt(val),
          steps:[`${Util.fmt(base)} × (1 + ${Util.fmt(pct/100)}) = <b>${Util.fmt(val)}</b>`], raw: val }; } },
    { name:'decrease_by', re: /(\d+(?:\.\d+)?)\s*decreased\s*by\s*(\d+(?:\.\d+)?)\s*%/i,
      run:(m)=>{ const base=parseFloat(m[1]), pct=parseFloat(m[2]); const val=base*(1-pct/100);
        return { calcId:'percentage', calcLabel:'Percentage Master', label:`${Util.fmt(base)} decreased by ${Util.fmt(pct)}%`, value:Util.fmt(val),
          steps:[`${Util.fmt(base)} × (1 − ${Util.fmt(pct/100)}) = <b>${Util.fmt(val)}</b>`], raw: val }; } },
    { name:'gst_with', re: /(\d+(?:\.\d+)?)\s*with\s*(\d+(?:\.\d+)?)\s*%\s*(gst|tax)/i,
      run:(m)=>{ const base=parseFloat(m[1]), pct=parseFloat(m[2]); const val=base*(1+pct/100);
        return { calcId:'percentage', calcLabel:'Percentage Master', label:`${Util.fmt(base)} with ${Util.fmt(pct)}% ${m[3].toUpperCase()}`, value:Util.fmt(val),
          steps:[`${Util.fmt(base)} + ${Util.fmt(pct)}% tax = <b>${Util.fmt(val)}</b>`], raw: val }; } },
    { name:'discount_off', re: /(\d+(?:\.\d+)?)\s*%\s*off\s*(?:of\s*)?(\d+(?:\.\d+)?)/i,
      run:(m)=>{ const pct=parseFloat(m[1]), mrp=parseFloat(m[2]); const val=mrp*(1-pct/100);
        return { calcId:'percentage', calcLabel:'Percentage Master', label:`${Util.fmt(pct)}% off ${Util.fmt(mrp)}`, value:Util.fmt(val),
          steps:[`${Util.fmt(mrp)} − ${Util.fmt(pct)}% = <b>${Util.fmt(val)}</b>`], raw: val }; } },
    { name:'profit_cp_sp', re: /profit.*?cp\s*(\d+(?:\.\d+)?).*?sp\s*(\d+(?:\.\d+)?)/i,
      run:(m)=>{ const cp=parseFloat(m[1]), sp=parseFloat(m[2]); const diff=sp-cp; const pct=cp!==0?(diff/cp)*100:0; const isP=diff>=0;
        return { calcId:'profitloss', calcLabel:'Profit & Loss', label:`CP ${Util.fmt(cp)}, SP ${Util.fmt(sp)}`, value:`${isP?'Profit':'Loss'} of ${Util.fmt(Math.abs(diff))} (${Util.fmt(Math.abs(pct))}%)`,
          steps:[`${isP?'Profit':'Loss'} = SP − CP = ${Util.fmt(diff)}`, `${isP?'Profit':'Loss'}% = <b>${Util.fmt(Math.abs(pct))}%</b>`], raw: diff }; } },
    { name:'cp_sp_direct', re: /\bcp\s*(\d+(?:\.\d+)?)\s*(?:and\s*)?sp\s*(\d+(?:\.\d+)?)/i,
      run:(m)=>{ const cp=parseFloat(m[1]), sp=parseFloat(m[2]); const diff=sp-cp; const pct=cp!==0?(diff/cp)*100:0; const isP=diff>=0;
        return { calcId:'profitloss', calcLabel:'Profit & Loss', label:`CP ${Util.fmt(cp)}, SP ${Util.fmt(sp)}`, value:`${isP?'Profit':'Loss'} of ${Util.fmt(Math.abs(diff))} (${Util.fmt(Math.abs(pct))}%)`,
          steps:[`${isP?'Profit':'Loss'} = SP − CP = ${Util.fmt(diff)}`, `${isP?'Profit':'Loss'}% = <b>${Util.fmt(Math.abs(pct))}%</b>`], raw: diff }; } },
    { name:'circle_area', re: /area\s*of\s*(?:a\s*)?circle\s*(?:with\s*)?radius\s*(\d+(?:\.\d+)?)/i,
      run:(m)=>{ const r=parseFloat(m[1]); const area=Math.PI*r*r;
        return { calcId:'geometry', calcLabel:'Geometry', label:`Area of circle, radius ${Util.fmt(r)}`, value:Util.fmt(area)+' sq units',
          steps:[`πr² = π×${Util.fmt(r)}² = <b>${Util.fmt(area)}</b>`], raw: area }; } },
    { name:'sqrt_of', re: /sqrt\s*of\s*(\d+(?:\.\d+)?)/i,
      run:(m)=>{ const n=parseFloat(m[1]); if(n<0) return null; const val=Math.sqrt(n);
        return { calcId:'scientific', calcLabel:'Scientific', label:`√${Util.fmt(n)}`, value:Util.fmt(val), steps:[`√${Util.fmt(n)} = <b>${Util.fmt(val)}</b>`], raw: val }; } },
    { name:'factorial', re: /(\d+)\s*factorial/i,
      run:(m)=>{ const n=parseInt(m[1],10); if(n>170||n<0) return null; let r=1; for(let i=2;i<=n;i++) r*=i;
        return { calcId:'scientific', calcLabel:'Scientific', label:`${n}!`, value:Util.fmt(r), steps:[`${n}! = <b>${Util.fmt(r)}</b>`], raw: r }; } },
    { name:'is_prime', re: /is\s*(\d+)\s*(?:a\s*)?prime/i,
      run:(m)=>{ const n=parseInt(m[1],10); const isP = n>=2 && (n<4 || (n%2!==0 && (()=>{ for(let i=3;i*i<=n;i+=2) if(n%i===0) return false; return true; })()));
        return { calcId:'numtheory', calcLabel:'Number Theory', label:`Is ${n} prime?`, value: isP?'Yes ✓':'No', steps:[isP?`${n} has no divisors other than 1 and itself.`:`${n} is not prime.`], raw: isP }; } },
    { name:'gcd_of', re: /gcd\s*of\s*(\d+)\s*and\s*(\d+)/i,
      run:(m)=>{ let a=parseInt(m[1],10), b=parseInt(m[2],10); const oa=a,ob=b; while(b){[a,b]=[b,a%b];}
        return { calcId:'numtheory', calcLabel:'Number Theory', label:`GCD(${oa}, ${ob})`, value:Util.fmt(a), steps:[`GCD(${oa}, ${ob}) = <b>${Util.fmt(a)}</b>`], raw: a }; } },
    { name:'lcm_of', re: /lcm\s*of\s*(\d+)\s*and\s*(\d+)/i,
      run:(m)=>{ let x=parseInt(m[1],10), y=parseInt(m[2],10); let a=x,b=y; while(b){[a,b]=[b,a%b];} const lcm=(x*y)/a;
        return { calcId:'numtheory', calcLabel:'Number Theory', label:`LCM(${x}, ${y})`, value:Util.fmt(lcm), steps:[`LCM(${x}, ${y}) = <b>${Util.fmt(lcm)}</b>`], raw: lcm }; } },
    { name:'to_base', re: /(\d+)\s*to\s*(binary|decimal|octal|hex(?:adecimal)?)\b/i,
      run:(m)=>{ const n=parseInt(m[1],10); const targetMap={binary:2,decimal:10,octal:8,hex:16,hexadecimal:16}; const base=targetMap[m[2].toLowerCase()];
        const val = base===10 ? String(n) : n.toString(base).toUpperCase();
        return { calcId:'programmer', calcLabel:'Programmer', label:`${n} in ${m[2]}`, value: val, steps:[`${n} (decimal) = <b>${val}</b> (base ${base})`], raw: val }; } },
    { name:'temp_convert', re: new RegExp(`(-?\\d+(?:\\.\\d+)?)\\s*(celsius|fahrenheit|kelvin|c|f|k)\\s*to\\s*(celsius|fahrenheit|kelvin|c|f|k)\\b`, 'i'),
      run:(m)=>{
        const v=parseFloat(m[1]); const from=TEMP_WORDS[m[2].toLowerCase()], to=TEMP_WORDS[m[3].toLowerCase()];
        if (!from || !to) return null;
        const toC = (val,u) => u==='c'?val : u==='f'?(val-32)*5/9 : val-273.15;
        const fromC = (val,u) => u==='c'?val : u==='f'?val*9/5+32 : val+273.15;
        const c = toC(v, from);
        if (c < -273.15) return null;
        const result = fromC(c, to);
        const labelUnit = {c:'°C',f:'°F',k:'K'};
        return { calcId:'unitconvert', calcLabel:'Unit Converter', label:`${Util.fmt(v)}${labelUnit[from]} to ${labelUnit[to]}`, value: Util.fmt(result)+labelUnit[to],
          steps:[`${Util.fmt(v)}${labelUnit[from]} = <b>${Util.fmt(result)}${labelUnit[to]}</b>`], raw: result }; } },
    { name:'unit_convert', re: new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${UNIT_ALTERNATION})\\s*to\\s*(${UNIT_ALTERNATION})\\b`, 'i'),
      run:(m)=>{
        const v = parseFloat(m[1]);
        const fromKey = UNIT_WORD_MAP[m[2].toLowerCase()], toKey = UNIT_WORD_MAP[m[3].toLowerCase()];
        const CATS = Calculators.unitconvert.CATS;
        let cat=null, units=null;
        for (const c of Calculators.unitconvert.CAT_ORDER) {
          if (c==='temperature') continue;
          if (CATS[c].units[fromKey] && CATS[c].units[toKey]) { cat=c; units=CATS[c].units; break; }
        }
        if (!cat) return null;
        const result = (v*units[fromKey].f)/units[toKey].f;
        return { calcId:'unitconvert', calcLabel:'Unit Converter', label:`${Util.fmt(v)} ${fromKey} to ${toKey}`, value: Util.fmt(result)+' '+toKey,
          steps:[`${Util.fmt(v)} ${fromKey} = <b>${Util.fmt(result)} ${toKey}</b>`], raw: result }; } },
  ];

  Universal.run = function(text){
    text = (text||'').trim();
    const wrap = document.getElementById('universal-result-wrap');
    if (!wrap) return; // not on dashboard
    if (!text) { wrap.innerHTML=''; return; }

    // First try natural-language patterns.
    for (const p of PATTERNS) {
      const m = text.match(p.re);
      if (m) {
        let result;
        try { result = p.run(m); } catch(e) { result = null; }
        if (result) {
          renderUniversalResult(wrap, text, result);
          MState.addHistory({ calcId: result.calcId, calcLabel: result.calcLabel, expr: text, resultText: result.value, resultRaw: result.raw });
          return;
        }
      }
    }

    // Fall back to raw math expression evaluation.
    try {
      const val = ExprParser.evaluate(text, {angleMode: MState.angleMode});
      const resultText = Util.fmt(val);
      MState.saveLastAnswer(val);
      renderUniversalResult(wrap, text, { calcId:'basic', calcLabel:'Basic Calculator', label:text, value: resultText, steps:[`${Util.esc(text)} = <b>${Util.esc(resultText)}</b>`], raw: val });
      MState.addHistory({ calcId:'basic', calcLabel:'Basic Calculator', expr: text, resultText, resultRaw: val });
    } catch(e) {
      wrap.innerHTML = `<div class="card card-pad" style="margin-bottom:20px;">
        <div class="error-banner" style="margin:0;">${icon('alert')}<span>Couldn't understand that. Try a math expression like "45*3" or a phrase like "18% of 2500", "10 km to miles", or "area of circle radius 10".</span></div>
      </div>`;
    }
  };

  function renderUniversalResult(wrap, text, result){
    const meta = REGISTRY_MAP[result.calcId];
    wrap.innerHTML = `<div class="card card-pad" style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span class="badge badge-soft">${meta ? Util.esc(meta.label) : 'Calculator'}</span>
      </div>
      <div class="rm-label" style="margin-bottom:4px;">${Util.esc(result.label)}</div>
      <div class="rm-value" style="font-size:26px;">${Util.esc(String(result.value))}</div>
      ${result.steps ? `<div class="steps-block" style="padding-left:0;padding-right:0;">${result.steps.map((s,i)=>`<div class="step-line"><span class="sl-num">${i+1}.</span>${s}</div>`).join('')}</div>` : ''}
      <div class="result-actions" style="padding-left:0;padding-right:0;">
        <button class="btn btn-soft btn-sm" id="uni-copy">${icon('copy')} Copy</button>
        ${meta ? `<button class="btn btn-ghost btn-sm" id="uni-open-calc">${icon('chevron')} Open in ${Util.esc(meta.label)}</button>` : ''}
      </div>
    </div>`;
    document.getElementById('uni-copy').addEventListener('click', () => {
      Util.copyToClipboard(`${result.label}: ${result.value}`);
      Toast.show('Copied to clipboard', 'ok');
    });
    const openBtn = document.getElementById('uni-open-calc');
    if (openBtn) openBtn.addEventListener('click', () => Router.go('#calc/' + result.calcId));
  }
})();

/* ============================================================
   APP BOOTSTRAP
   ============================================================ */
(function initApp(){
  // Apply saved theme
  function applyTheme(t){
    document.body.setAttribute('data-theme', t);
    const sunIcon = document.getElementById('theme-icon-sun');
    if (sunIcon) {
      sunIcon.innerHTML = t === 'dark'
        ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
    }
  }
  applyTheme(MState.theme);
  SettingsPanel.applyAll();

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = MState.theme === 'dark' ? 'light' : 'dark';
    MState.saveTheme(next);
    applyTheme(next);
  });

  document.getElementById('menu-toggle').addEventListener('click', SidebarUI.openMobile);
  document.getElementById('sidebar-backdrop').addEventListener('click', SidebarUI.closeMobile);

  document.getElementById('history-btn').addEventListener('click', () => Router.go('#history'));

  document.getElementById('data-btn').addEventListener('click', () => {
    Modal.open({
      title:'Import / Export Data',
      body:'Back up your calculation history and favorites, or restore from a previous export.',
      bodyHTML: `<div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-soft btn-block" id="modal-export-json">${icon('download')} Export as JSON</button>
        <button class="btn btn-soft btn-block" id="modal-export-csv">${icon('download')} Export as CSV</button>
        <button class="btn btn-ghost btn-block" id="modal-import">${icon('upload')} Import from JSON</button>
        <input type="file" id="modal-import-file" accept="application/json" style="display:none">
      </div>`,
      actions:[{label:'Close', cls:'btn-ghost'}]
    });
    document.getElementById('modal-export-json').addEventListener('click', () => {
      Util.download('calculator-master-history.json', MState.exportJSON(), 'application/json');
      Toast.show('Exported as JSON', 'ok');
    });
    document.getElementById('modal-export-csv').addEventListener('click', () => {
      Util.download('calculator-master-history.csv', MState.exportCSV(), 'text/csv');
      Toast.show('Exported as CSV', 'ok');
    });
    document.getElementById('modal-import').addEventListener('click', () => document.getElementById('modal-import-file').click());
    document.getElementById('modal-import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const added = MState.importJSON(reader.result);
          Toast.show(`Imported ${added} new record${added===1?'':'s'}`, 'ok');
          Modal.close();
          Router.resolve();
        } catch(err) { Toast.show(err.message || 'Import failed', 'error'); }
      };
      reader.readAsText(file);
    });
  });

  // Sidebar search filters nav
  document.getElementById('sidebar-search-input').addEventListener('input', Util.debounce((e) => {
    Nav.filterQuery = e.target.value;
    Nav.render();
    Nav.syncActive();
  }, 150));

  // Global topbar search: acts as a calculator search / jump box.
  document.getElementById('global-search').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim();
    if (!q) return;
    const qLower = q.toLowerCase();
    const matchedCalc = REGISTRY.find(r => r.label.toLowerCase().includes(qLower));
    if (matchedCalc && !/\d/.test(q)) {
      Router.go('#calc/' + matchedCalc.id);
      e.target.value = '';
    } else {
      // Treat as a universal-calculator style query: jump to dashboard and run it there.
      Router.go('#dashboard');
      setTimeout(() => {
        const uInput = document.getElementById('universal-input');
        if (uInput) { uInput.value = q; Universal.run(q); }
      }, 30);
      e.target.value = '';
    }
  });

  // Global keyboard shortcuts: Cmd/Ctrl+K opens the command palette,
  // '?' opens the shortcuts panel (unless focus is in a text field),
  // Cmd/Ctrl+\ toggles the theme.
  document.addEventListener('keydown', (e) => {
    const inField = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      CommandPalette.toggle();
    } else if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
      e.preventDefault();
      const next = MState.theme === 'dark' ? 'light' : 'dark';
      MState.saveTheme(next);
      applyTheme(next);
    } else if (e.key === '?' && !inField && !document.getElementById('cmdk-root').innerHTML) {
      e.preventDefault();
      ShortcutsPanel.open();
    }
  });
  document.getElementById('settings-btn').addEventListener('click', () => SettingsPanel.open());

  // Initial render
  Nav.render();
  Router.init();
})();

</script>

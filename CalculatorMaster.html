    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('fn-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('fn-result'), 'Enter values to calculate.');
    document.getElementById('fn-calc').addEventListener('click', compute);
    document.getElementById('fn-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('fn-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'si': case 'ci': return `
        <div class="field-grid">
          <div class="field"><label>Principal <span class="req">*</span></label><input type="number" class="input" id="fn-p" placeholder="10000"><span class="field-err" id="fn-p-err"></span></div>
          <div class="field"><label>Annual rate <span class="req">*</span></label><div class="input-suffix-wrap"><input type="number" class="input" id="fn-r" placeholder="8"><span class="suffix">%</span></div><span class="field-err" id="fn-r-err"></span></div>
          <div class="field"><label>Time (years) <span class="req">*</span></label><input type="number" class="input" id="fn-t" placeholder="3"><span class="field-err" id="fn-t-err"></span></div>
          ${m==='ci' ? `<div class="field"><label>Compounding frequency</label>
            <select class="input" id="fn-freq"><option value="annually">Annually</option><option value="semi-annually">Semi-annually</option><option value="quarterly">Quarterly</option><option value="monthly">Monthly</option></select></div>` : ''}
        </div>`;
      case 'emi': return `
        <div class="field-grid">
          <div class="field"><label>Loan amount <span class="req">*</span></label><input type="number" class="input" id="fn-p" placeholder="500000"><span class="field-err" id="fn-p-err"></span></div>
          <div class="field"><label>Annual interest rate <span class="req">*</span></label><div class="input-suffix-wrap"><input type="number" class="input" id="fn-r" placeholder="9"><span class="suffix">%</span></div><span class="field-err" id="fn-r-err"></span></div>
          <div class="field"><label>Tenure (months) <span class="req">*</span></label><input type="number" class="input" id="fn-n" placeholder="60"><span class="field-err" id="fn-n-err"></span></div>
        </div>`;
      case 'sip': return `
        <div class="field-grid">
          <div class="field"><label>Monthly investment <span class="req">*</span></label><input type="number" class="input" id="fn-m" placeholder="5000"><span class="field-err" id="fn-m-err"></span></div>
          <div class="field"><label>Expected annual return <span class="req">*</span></label><div class="input-suffix-wrap"><input type="number" class="input" id="fn-r" placeholder="12"><span class="suffix">%</span></div><span class="field-err" id="fn-r-err"></span></div>
          <div class="field"><label>Duration (years) <span class="req">*</span></label><input type="number" class="input" id="fn-y" placeholder="10"><span class="field-err" id="fn-y-err"></span></div>
        </div>`;
      case 'cagr': return `
        <div class="field-grid">
          <div class="field"><label>Initial value <span class="req">*</span></label><input type="number" class="input" id="fn-iv" placeholder="100000"><span class="field-err" id="fn-iv-err"></span></div>
          <div class="field"><label>Final value <span class="req">*</span></label><input type="number" class="input" id="fn-fv" placeholder="250000"><span class="field-err" id="fn-fv-err"></span></div>
          <div class="field"><label>Duration (years) <span class="req">*</span></label><input type="number" class="input" id="fn-y" placeholder="5"><span class="field-err" id="fn-y-err"></span></div>
        </div>`;
      case 'roi': return `
        <div class="field-grid">
          <div class="field"><label>Amount invested <span class="req">*</span></label><input type="number" class="input" id="fn-cost" placeholder="100000"><span class="field-err" id="fn-cost-err"></span></div>
          <div class="field"><label>Amount returned <span class="req">*</span></label><input type="number" class="input" id="fn-ret" placeholder="115000"><span class="field-err" id="fn-ret-err"></span></div>
        </div>`;
      case 'inflation': return `
        <div class="field-grid">
          <div class="field"><label>Current amount <span class="req">*</span></label><input type="number" class="input" id="fn-p" placeholder="100000"><span class="field-err" id="fn-p-err"></span></div>
          <div class="field"><label>Annual inflation rate <span class="req">*</span></label><div class="input-suffix-wrap"><input type="number" class="input" id="fn-r" placeholder="6"><span class="suffix">%</span></div><span class="field-err" id="fn-r-err"></span></div>
          <div class="field"><label>Years from now <span class="req">*</span></label><input type="number" class="input" id="fn-y" placeholder="10"><span class="field-err" id="fn-y-err"></span></div>
        </div>
        <div class="info-box">Shows how much future money will be <b>worth in today's purchasing power</b>, and how much you'd need in the future to match today's value.</div>`;
      case 'fv': return `
        <div class="field-grid">
          <div class="field"><label>Present value <span class="req">*</span></label><input type="number" class="input" id="fn-p" placeholder="50000"><span class="field-err" id="fn-p-err"></span></div>
          <div class="field"><label>Annual rate <span class="req">*</span></label><div class="input-suffix-wrap"><input type="number" class="input" id="fn-r" placeholder="7"><span class="suffix">%</span></div><span class="field-err" id="fn-r-err"></span></div>
          <div class="field"><label>Years <span class="req">*</span></label><input type="number" class="input" id="fn-t" placeholder="10"><span class="field-err" id="fn-t-err"></span></div>
        </div>`;
      case 'pv': return `
        <div class="field-grid">
          <div class="field"><label>Future value <span class="req">*</span></label><input type="number" class="input" id="fn-fv" placeholder="100000"><span class="field-err" id="fn-fv-err"></span></div>
          <div class="field"><label>Annual rate <span class="req">*</span></label><div class="input-suffix-wrap"><input type="number" class="input" id="fn-r" placeholder="6"><span class="suffix">%</span></div><span class="field-err" id="fn-r-err"></span></div>
          <div class="field"><label>Years <span class="req">*</span></label><input type="number" class="input" id="fn-t" placeholder="8"><span class="field-err" id="fn-t-err"></span></div>
        </div>`;
      default: return '';
    }
  }
  function renderFields(){ document.getElementById('fn-fields').innerHTML = fieldsFor(mode); Combobox.scan(document.getElementById('fn-fields')); }

  function num(id, label, errs, opts){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    const n = Util.toNum(v);
    if (opts && opts.positive && n <= 0) { errs.push([id, label + ' must be greater than zero']); return NaN; }
    if (opts && opts.nonneg && n < 0) { errs.push([id, label + ' cannot be negative']); return NaN; }
    return n;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('fn-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'si') {
        const p = num('fn-p','Principal',errs,{positive:true}), r = num('fn-r','Rate',errs), t = num('fn-t','Time',errs,{positive:true});
        if (!errs.length) {
          const si = p*r*t/100;
          const total = p+si;
          out = { label:'Simple Interest', value:Util.fmt(si), extras:[{k:'Total amount', v:Util.fmt(total)},{k:'Principal', v:Util.fmt(p)}],
            steps:[`SI = P × R × T ÷ 100 = ${Util.fmt(p)} × ${Util.fmt(r)} × ${Util.fmt(t)} ÷ 100`, `= <b>${Util.fmt(si)}</b>`, `Total repayable = P + SI = ${Util.fmt(total)}`],
            expr:`SI: P${Util.fmt(p)} R${Util.fmt(r)}% T${Util.fmt(t)}y`, raw: si };
        }
      } else if (mode === 'ci') {
        const p = num('fn-p','Principal',errs,{positive:true}), r = num('fn-r','Rate',errs), t = num('fn-t','Time',errs,{positive:true});
        const freqSel = document.getElementById('fn-freq');
        const freqKey = freqSel ? freqSel.value : 'annually';
        const n = FREQ[freqKey] || 1;
        if (!errs.length) {
          const amount = p * Math.pow(1 + (r/100)/n, n*t);
          const ci = amount - p;
          out = { label:'Compound Interest', value:Util.fmt(ci), extras:[{k:'Maturity amount', v:Util.fmt(amount)},{k:'Compounding', v:freqKey}],
            steps:[`A = P(1 + r/n)^(nt) = ${Util.fmt(p)}(1 + ${Util.fmt(r/100)}/${n})^(${n}×${Util.fmt(t)})`, `A = <b>${Util.fmt(amount)}</b>`, `CI = A − P = ${Util.fmt(amount)} − ${Util.fmt(p)} = <b>${Util.fmt(ci)}</b>`],
            expr:`CI: P${Util.fmt(p)} R${Util.fmt(r)}% T${Util.fmt(t)}y ${freqKey}`, raw: ci };
        }
      } else if (mode === 'emi') {
        const p = num('fn-p','Loan amount',errs,{positive:true}), annualR = num('fn-r','Rate',errs,{nonneg:true}), n = num('fn-n','Tenure',errs,{positive:true});
        if (!errs.length) {
          let emi, totalPay, totalInt;
          const monthlyR = annualR/12/100;
          if (annualR === 0) {
            emi = p/n; totalPay = p; totalInt = 0;
          } else {
            const r = monthlyR;
            emi = p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
            totalPay = emi*n; totalInt = totalPay - p;
          }
          // Amortization schedule (feature 24): month-by-month principal/interest split.
          const schedule = [];
          let balance = p;
          const roundedN = Math.round(n);
          for (let m=1; m<=roundedN && balance > 0.005; m++) {
            const interestPortion = annualR === 0 ? 0 : balance * monthlyR;
            let principalPortion = emi - interestPortion;
            if (m === roundedN || principalPortion > balance) principalPortion = balance; // absorb rounding on final row
            balance = Math.max(0, balance - principalPortion);
            schedule.push({ month:m, payment: principalPortion+interestPortion, principal: principalPortion, interest: interestPortion, balance });
          }
          out = { label:'Monthly EMI', value:Util.fmt(emi), extras:[{k:'Total payment', v:Util.fmt(totalPay)},{k:'Total interest', v:Util.fmt(totalInt)}],
            steps:[`r = R/12/100 = ${Util.fmt(annualR)}/12/100 = ${Util.fmt(annualR/12/100)}`, `EMI = P·r·(1+r)^N ÷ [(1+r)^N − 1] = <b>${Util.fmt(emi)}</b>`, `Over ${n} months → total interest ${Util.fmt(totalInt)}`],
            expr:`EMI: P${Util.fmt(p)} R${Util.fmt(annualR)}% N${n}mo`, raw: emi, schedule };
        }
      } else if (mode === 'sip') {
        const m = num('fn-m','Monthly investment',errs,{positive:true}), annualR = num('fn-r','Return rate',errs), years = num('fn-y','Duration',errs,{positive:true});
        if (!errs.length) {
          const months = years*12;
          const mr = annualR/12/100;
          let fv, invested = m*months;
          if (mr === 0) { fv = invested; }
          else { fv = m * ((Math.pow(1+mr,months)-1)/mr) * (1+mr); }
          const gains = fv - invested;
          out = { label:'Maturity value', value:Util.fmt(fv), extras:[{k:'Total invested', v:Util.fmt(invested)},{k:'Estimated gains', v:Util.fmt(gains)}],
            steps:[`Monthly rate = ${Util.fmt(annualR)}/12/100 = ${Util.fmt(mr)}`, `FV = M × [((1+r)^n − 1)/r] × (1+r) = <b>${Util.fmt(fv)}</b>`, `Invested ${Util.fmt(invested)} over ${months} months, gained ${Util.fmt(gains)}`],
            expr:`SIP: ₹${Util.fmt(m)}/mo R${Util.fmt(annualR)}% ${years}y`, raw: fv };
        }
      } else if (mode === 'cagr') {
        const iv = num('fn-iv','Initial value',errs,{positive:true}), fv = num('fn-fv','Final value',errs,{positive:true}), y = num('fn-y','Duration',errs,{positive:true});
        if (!errs.length) {
          const cagr = (Math.pow(fv/iv, 1/y) - 1) * 100;
          out = { label:'CAGR', value:Util.fmt(cagr), unit:'%', valueClass: cagr>=0?'pos':'neg',
            steps:[`CAGR = [(Final/Initial)^(1/Years) − 1] × 100`, `= [(${Util.fmt(fv)}/${Util.fmt(iv)})^(1/${Util.fmt(y)}) − 1] × 100 = <b>${Util.fmt(cagr)}%</b>`],
            expr:`CAGR ${Util.fmt(iv)}→${Util.fmt(fv)} over ${y}y`, raw: cagr };
        }
      } else if (mode === 'roi') {
        const cost = num('fn-cost','Amount invested',errs,{positive:true}), ret = num('fn-ret','Amount returned',errs,{nonneg:true});
        if (!errs.length) {
          const gain = ret - cost;
          const roi = (gain/cost)*100;
          out = { label:'ROI', value:Util.fmt(roi), unit:'%', valueClass: roi>=0?'pos':'neg', extras:[{k:'Net gain/loss', v:Util.fmt(gain)}],
            steps:[`Gain = Returned − Invested = ${Util.fmt(ret)} − ${Util.fmt(cost)} = ${Util.fmt(gain)}`, `ROI = (Gain ÷ Invested) × 100 = <b>${Util.fmt(roi)}%</b>`],
            expr:`ROI: cost ${Util.fmt(cost)} return ${Util.fmt(ret)}`, raw: roi };
        }
      } else if (mode === 'inflation') {
        const p = num('fn-p','Current amount',errs,{positive:true}), r = num('fn-r','Inflation rate',errs), y = num('fn-y','Years',errs,{positive:true});
        if (!errs.length) {
          const futureNeeded = p * Math.pow(1+r/100, y);
          const todayWorth = p / Math.pow(1+r/100, y);
          out = { label:`Value needed in ${y}y`, value:Util.fmt(futureNeeded), extras:[{k:`Today's ${Util.fmt(p)} will feel like`, v:Util.fmt(todayWorth)+' (in today\'s money)'}],
            steps:[`Future equivalent = P × (1+r)^t = ${Util.fmt(p)} × (1+${Util.fmt(r/100)})^${y} = <b>${Util.fmt(futureNeeded)}</b>`,
                   `Today's-value equivalent of ${Util.fmt(p)} received in ${y}y = P ÷ (1+r)^t = ${Util.fmt(todayWorth)}`],
            expr:`Inflation: ${Util.fmt(p)} R${Util.fmt(r)}% ${y}y`, raw: futureNeeded };
        }
      } else if (mode === 'fv') {
        const p = num('fn-p','Present value',errs,{positive:true}), r = num('fn-r','Rate',errs), t = num('fn-t','Years',errs,{positive:true});
        if (!errs.length) {
          const fv = p*Math.pow(1+r/100,t);
          out = { label:'Future Value', value:Util.fmt(fv),
            steps:[`FV = PV × (1+r)^t = ${Util.fmt(p)} × (1+${Util.fmt(r/100)})^${Util.fmt(t)} = <b>${Util.fmt(fv)}</b>`],
            expr:`FV of ${Util.fmt(p)} at ${Util.fmt(r)}% for ${t}y`, raw: fv };
        }
      } else if (mode === 'pv') {
        const fv = num('fn-fv','Future value',errs,{positive:true}), r = num('fn-r','Rate',errs), t = num('fn-t','Years',errs,{positive:true});
        if (!errs.length) {
          const denom = Math.pow(1+r/100,t);
          if (denom === 0) { errs.push(['fn-r','Invalid rate for this calculation']); }
          else {
            const pv = fv/denom;
            out = { label:'Present Value', value:Util.fmt(pv),
              steps:[`PV = FV ÷ (1+r)^t = ${Util.fmt(fv)} ÷ (1+${Util.fmt(r/100)})^${Util.fmt(t)} = <b>${Util.fmt(pv)}</b>`],
              expr:`PV of ${Util.fmt(fv)} at ${Util.fmt(r)}% for ${t}y`, raw: pv };
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    const resultText = out.value + (out.unit||'');
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), unit: out.unit, valueClass: out.valueClass,
      extras: out.extras, steps: out.steps, plainValue: resultText, copyText: `${out.expr} → ${out.label}: ${resultText}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'finance', calcLabel:'Finance Suite', expr: out.expr, resultText, resultRaw: out.raw });

    // Amortization schedule (feature 24) — appended below the result card,
    // collapsed by default since it can be 60+ rows for a typical loan.
    if (out.schedule && out.schedule.length) {
      renderAmortization(resEl, out.schedule);
    }
  }

  function renderAmortization(resEl, schedule){
    const wrap = document.createElement('div');
    wrap.className = 'amort-wrap';
    wrap.innerHTML = `
      <button class="amort-toggle" id="amort-toggle" aria-expanded="false">
        ${icon('chevron','amort-chev')}
        <span>Amortization schedule (${schedule.length} months)</span>
      </button>
      <div class="amort-body" id="amort-body" style="display:none;">
        <div class="amort-table-scroll">
          <table class="amort-table">
            <thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
            <tbody>
              ${schedule.map(row => `<tr>
                <td>${row.month}</td>
                <td>${Util.fmt(row.payment)}</td>
                <td>${Util.fmt(row.principal)}</td>
                <td>${Util.fmt(row.interest)}</td>
                <td>${Util.fmt(row.balance)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    resEl.appendChild(wrap);
    const toggle = document.getElementById('amort-toggle');
    const body = document.getElementById('amort-body');
    toggle.addEventListener('click', () => {
      const showing = body.style.display !== 'none';
      body.style.display = showing ? 'none' : 'block';
      toggle.setAttribute('aria-expanded', String(!showing));
      toggle.querySelector('.amort-chev').classList.toggle('open', !showing);
    });
  }

  return { render };
})();

/* ---------------- 5. ALGEBRA ---------------- */
Calculators.algebra = (function(){
  const MODES = [
    { id:'linear',    label:'Linear equation (ax + b = c)' },
    { id:'quadratic', label:'Quadratic equation (ax² + bx + c = 0)' },
    { id:'exponent',  label:'Exponents (aⁿ)' },
    { id:'logarithm', label:'Logarithm (log base b of x)' },
    { id:'ratio',     label:'Ratio simplifier & scaling' },
    { id:'proportion',label:'Proportion solver (a:b = c:x)' },
    { id:'sequence',  label:'Arithmetic / Geometric sequence' },
    { id:'factorize', label:'Prime factorization' },
  ];
  let mode = 'linear';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="al-mode"></select>
          </div>
          <div id="al-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="al-calc">${icon('calc')} Calculate</button>

          </div>
        </div>
        <div class="result-panel" id="al-result"></div>
      </div>
    `;
    const sel = document.getElementById('al-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('al-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('al-result'), 'Choose a calculation type and fill in the values.');
    document.getElementById('al-calc').addEventListener('click', compute);
    document.getElementById('al-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('al-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'linear': return `
        <div class="info-box" style="margin-bottom:10px;margin-top:0;">Solve for x in: <b>ax + b = c</b></div>
        <div class="field-grid" style="grid-template-columns:1fr 1fr 1fr;">
          <div class="field"><label>a</label><input type="number" class="input" id="al-a" placeholder="2"><span class="field-err" id="al-a-err"></span></div>

        </div>`;
      case 'quadratic': return `
        <div class="info-box" style="margin-bottom:10px;margin-top:0;">Solve: <b>ax² + bx + c = 0</b></div>
        <div class="field-grid" style="grid-template-columns:1fr 1fr 1fr;">
          <div class="field"><label>a</label><input type="number" class="input" id="al-a" placeholder="1"><span class="field-err" id="al-a-err"></span></div>
          <div class="field"><label>b</label><input type="number" class="input" id="al-b" placeholder="-5"><span class="field-err" id="al-b-err"></span></div>
          <div class="field"><label>c</label><input type="number" class="input" id="al-c" placeholder="6"><span class="field-err" id="al-c-err"></span></div>
        </div>`;
      case 'exponent': return `
        <div class="field-grid">
          <div class="field"><label>Base (a)</label><input type="number" class="input" id="al-base" placeholder="2"><span class="field-err" id="al-base-err"></span></div>
          <div class="field"><label>Exponent (n)</label><input type="number" class="input" id="al-exp" placeholder="10"><span class="field-err" id="al-exp-err"></span></div>
        </div>`;
      case 'logarithm': return `
        <div class="field-grid">
          <div class="field"><label>x (value)</label><input type="number" class="input" id="al-x" placeholder="1000"><span class="field-err" id="al-x-err"></span></div>
          <div class="field"><label>Base (b)</label><input type="number" class="input" id="al-base" placeholder="10"><span class="field-err" id="al-base-err"></span></div>
        </div>`;
      case 'ratio': return `
        <div class="field-grid">
          <div class="field"><label>First value</label><input type="number" class="input" id="al-a" placeholder="24"><span class="field-err" id="al-a-err"></span></div>
          <div class="field"><label>Second value</label><input type="number" class="input" id="al-b" placeholder="36"><span class="field-err" id="al-b-err"></span></div>
        </div>`;
      case 'proportion': return `
        <div class="info-box" style="margin-bottom:10px;margin-top:0;">Solve for x in: <b>a : b = c : x</b></div>
        <div class="field-grid" style="grid-template-columns:1fr 1fr 1fr;">
          <div class="field"><label>a</label><input type="number" class="input" id="al-a" placeholder="2"><span class="field-err" id="al-a-err"></span></div>
          <div class="field"><label>b</label><input type="number" class="input" id="al-b" placeholder="5"><span class="field-err" id="al-b-err"></span></div>
          <div class="field"><label>c</label><input type="number" class="input" id="al-c" placeholder="8"><span class="field-err" id="al-c-err"></span></div>
        </div>`;
      case 'sequence': return `
        <div class="field-grid">
          <div class="field"><label>First term (a₁)</label><input type="number" class="input" id="al-a" placeholder="3"><span class="field-err" id="al-a-err"></span></div>
          <div class="field"><label>Common difference/ratio (d or r)</label><input type="number" class="input" id="al-d" placeholder="4"><span class="field-err" id="al-d-err"></span></div>
          <div class="field"><label>Number of terms (n)</label><input type="number" class="input" id="al-n" placeholder="10"><span class="field-err" id="al-n-err"></span></div>
        </div>
        <div class="select-inline" style="margin-top:6px;">
          <span class="chip-radio active" data-seq="arith">Arithmetic (+d)</span>
          <span class="chip-radio" data-seq="geo">Geometric (×r)</span>
        </div>`;
      case 'factorize': return `
        <div class="field-grid f1">
          <div class="field"><label>Positive integer</label><input type="number" class="input" id="al-n" placeholder="360" step="1"><span class="field-err" id="al-n-err"></span></div>
        </div>`;
      default: return '';
    }
  }
  let seqType = 'arith';
  function renderFields(){
    document.getElementById('al-fields').innerHTML = fieldsFor(mode);
    if (mode === 'sequence') {
      seqType = 'arith';
      document.querySelectorAll('[data-seq]').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('[data-seq]').forEach(x=>x.classList.remove('active'));
          el.classList.add('active'); seqType = el.getAttribute('data-seq');
        });
      });
    }
  }

  function num(id, label, errs, opts){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    const n = Util.toNum(v);
    if (opts && opts.positive && n <= 0) { errs.push([id, label + ' must be greater than zero']); return NaN; }
    if (opts && opts.int && !Number.isInteger(n)) { errs.push([id, label + ' must be a whole number']); return NaN; }
    return n;
  }

  function primeFactorize(n){
    n = Math.round(n);
    const factors = [];
    let d = 2;
    let x = n;
    while (d*d <= x) {
      while (x % d === 0) { factors.push(d); x /= d; }
      d++;
    }
    if (x > 1) factors.push(x);
    return factors;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('al-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'linear') {
        const a = num('al-a','a',errs), b = num('al-b','b',errs), c = num('al-c','c',errs);
        if (!errs.length) {
          if (a === 0) {
            if (b === c) out = { label:'Solution', value:'Infinite solutions', sub:'a = 0 and b = c: any x works', steps:['With a=0, the equation becomes b = c, which is always true.'], expr:`0x+${b}=${c}`, raw:null };
            else { errs.push(['al-a','a cannot be 0 unless b equals c (no solution otherwise)']); }
          } else {
            const x = (c-b)/a;
            out = { label:'x =', value: Util.fmt(x), steps:[`x = (c − b) ÷ a = (${Util.fmt(c)} − ${Util.fmt(b)}) ÷ ${Util.fmt(a)}`, `= <b>${Util.fmt(x)}</b>`], expr:`${Util.fmt(a)}x+${Util.fmt(b)}=${Util.fmt(c)}`, raw:x };
          }
        }
      } else if (mode === 'quadratic') {
        const a = num('al-a','a',errs), b = num('al-b','b',errs), c = num('al-c','c',errs);
        if (!errs.length) {
          if (a === 0) { errs.push(['al-a','a cannot be 0 for a quadratic equation']); }
          else {
            const disc = b*b - 4*a*c;
            if (disc > 0) {
              const sq = Math.sqrt(disc);
              const x1 = (-b+sq)/(2*a), x2 = (-b-sq)/(2*a);
              out = { label:'Two real roots', value:`x₁=${Util.fmt(x1)}, x₂=${Util.fmt(x2)}`,
                extras:[{k:'Discriminant', v:Util.fmt(disc)}],
                steps:[`Δ = b² − 4ac = ${Util.fmt(b)}² − 4×${Util.fmt(a)}×${Util.fmt(c)} = ${Util.fmt(disc)}`, `x = (−b ± √Δ) ÷ 2a`, `x₁ = <b>${Util.fmt(x1)}</b>, x₂ = <b>${Util.fmt(x2)}</b>`],
                expr:`${Util.fmt(a)}x²+${Util.fmt(b)}x+${Util.fmt(c)}=0`, raw:x1 };
            } else if (disc === 0) {
              const x = -b/(2*a);
              out = { label:'One repeated root', value:`x = ${Util.fmt(x)}`, extras:[{k:'Discriminant', v:'0'}],
                steps:[`Δ = b² − 4ac = 0 → one repeated root`, `x = −b ÷ 2a = <b>${Util.fmt(x)}</b>`], expr:`${Util.fmt(a)}x²+${Util.fmt(b)}x+${Util.fmt(c)}=0`, raw:x };
            } else {
              const re = -b/(2*a), im = Math.sqrt(-disc)/(2*a);
              out = { label:'Complex roots', value:`${Util.fmt(re)} ± ${Util.fmt(im)}i`, extras:[{k:'Discriminant', v:Util.fmt(disc)}],
                steps:[`Δ = b² − 4ac = ${Util.fmt(disc)} (negative → complex roots)`, `x = ${Util.fmt(re)} ± ${Util.fmt(im)}i`], expr:`${Util.fmt(a)}x²+${Util.fmt(b)}x+${Util.fmt(c)}=0`, raw:re };
            }
          }
        }
      } else if (mode === 'exponent') {
        const base = num('al-base','Base',errs), exp = num('al-exp','Exponent',errs);
        if (!errs.length) {
          const val = Math.pow(base, exp);
          if (!Number.isFinite(val)) { errs.push(['al-exp','Result is too large or undefined']); }
          else out = { label:'Result', value: Util.fmt(val), steps:[`${Util.fmt(base)}^${Util.fmt(exp)} = <b>${Util.fmt(val)}</b>`], expr:`${Util.fmt(base)}^${Util.fmt(exp)}`, raw: val };
        }
      } else if (mode === 'logarithm') {
        const x = num('al-x','x',errs,{positive:true}), base = num('al-base','Base',errs,{positive:true});
        if (!errs.length) {
          if (base === 1) { errs.push(['al-base','Base cannot be 1']); }
          else {
            const val = Math.log(x)/Math.log(base);
            out = { label:`log base ${Util.fmt(base)}`, value: Util.fmt(val), steps:[`log_${Util.fmt(base)}(${Util.fmt(x)}) = ln(${Util.fmt(x)}) ÷ ln(${Util.fmt(base)}) = <b>${Util.fmt(val)}</b>`], expr:`log_${Util.fmt(base)}(${Util.fmt(x)})`, raw: val };
          }
        }
      } else if (mode === 'ratio') {
        const a = num('al-a','First value',errs), b = num('al-b','Second value',errs);
        if (!errs.length) {
          if (a===0 && b===0) { errs.push(['al-a','Both values cannot be zero']); }
          else {
            const g = (function gcd(x,y){ x=Math.abs(x);y=Math.abs(y); while(y){[x,y]=[y,x%y];} return x||1; })(a,b);
            const sa = a/g, sb = b/g;
            out = { label:'Simplified ratio', value:`${Util.fmt(sa)} : ${Util.fmt(sb)}`, extras:[{k:'Decimal', v:Util.fmt(a/(b||1))}],
              steps:[`GCD(${Util.fmt(a)}, ${Util.fmt(b)}) = ${Util.fmt(g)}`, `${Util.fmt(a)} ÷ ${Util.fmt(g)} : ${Util.fmt(b)} ÷ ${Util.fmt(g)} = <b>${Util.fmt(sa)} : ${Util.fmt(sb)}</b>`],
              expr:`${Util.fmt(a)}:${Util.fmt(b)} simplified`, raw: sa/sb };
          }
        }
      } else if (mode === 'proportion') {
        const a = num('al-a','a',errs), b = num('al-b','b',errs), c = num('al-c','c',errs);
        if (!errs.length) {
          if (a === 0) { errs.push(['al-a','a cannot be 0']); }
          else {
            const x = (b*c)/a;
            out = { label:'x =', value: Util.fmt(x), steps:[`a:b = c:x → x = (b × c) ÷ a`, `x = (${Util.fmt(b)} × ${Util.fmt(c)}) ÷ ${Util.fmt(a)} = <b>${Util.fmt(x)}</b>`], expr:`${Util.fmt(a)}:${Util.fmt(b)}=${Util.fmt(c)}:x`, raw:x };
          }
        }
      } else if (mode === 'sequence') {
        const a1 = num('al-a','First term',errs), d = num('al-d','Common difference/ratio',errs), n = num('al-n','Number of terms',errs,{positive:true,int:true});
        if (!errs.length) {
          if (n > 1000) { errs.push(['al-n','Please use 1000 terms or fewer']); }
          else if (seqType === 'arith') {
            const an = a1 + (n-1)*d;
            const sum = n/2 * (2*a1 + (n-1)*d);
            const terms = [];
            for (let i=0;i<Math.min(n,8);i++) terms.push(Util.fmt(a1+i*d));
            out = { label:`${n}th term`, value: Util.fmt(an), extras:[{k:'Sum of series', v:Util.fmt(sum)}],
              steps:[`aₙ = a₁ + (n−1)d = ${Util.fmt(a1)} + (${n}−1)×${Util.fmt(d)} = <b>${Util.fmt(an)}</b>`, `Sum = n/2 × [2a₁ + (n−1)d] = <b>${Util.fmt(sum)}</b>`,
                     `First terms: ${terms.join(', ')}${n>8?', …':''}`],
              expr:`AP a₁=${Util.fmt(a1)} d=${Util.fmt(d)} n=${n}`, raw: an };
          } else {
            if (d === 0) { errs.push(['al-d','Ratio cannot be 0 for a geometric sequence']); }
            else {
              const an = a1 * Math.pow(d, n-1);
              const sum = d === 1 ? a1*n : a1*(Math.pow(d,n)-1)/(d-1);
              const terms = [];
              for (let i=0;i<Math.min(n,8);i++) terms.push(Util.fmt(a1*Math.pow(d,i)));
              out = { label:`${n}th term`, value: Util.fmt(an), extras:[{k:'Sum of series', v:Util.fmt(sum)}],
                steps:[`aₙ = a₁ × r^(n−1) = ${Util.fmt(a1)} × ${Util.fmt(d)}^${n-1} = <b>${Util.fmt(an)}</b>`, `Sum = a₁(rⁿ−1)/(r−1) = <b>${Util.fmt(sum)}</b>`,
                       `First terms: ${terms.join(', ')}${n>8?', …':''}`],
                expr:`GP a₁=${Util.fmt(a1)} r=${Util.fmt(d)} n=${n}`, raw: an };
            }
          }
        }
      } else if (mode === 'factorize') {
        const n = num('al-n','Integer',errs,{positive:true,int:true});
        if (!errs.length) {
          if (n === 1) out = { label:'Prime factorization', value:'1 (unit, no prime factors)', steps:['1 has no prime factors.'], expr:'factorize 1', raw:null };
          else if (n > 1e12) { errs.push(['al-n','Please use a smaller number (≤ 1,000,000,000,000)']); }
          else {
            const factors = primeFactorize(n);
            const counts = {};
            factors.forEach(f => counts[f] = (counts[f]||0)+1);
            const expr2 = Object.entries(counts).map(([p,c]) => c>1?`${p}^${c}`:`${p}`).join(' × ');
            out = { label:'Prime factorization', value: expr2, steps:[`${Util.fmt(n)} = ${factors.join(' × ')}`, `= <b>${expr2}</b>`], expr:`factorize ${n}`, raw: expr2 };
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), unit: out.unit, valueClass: out.valueClass, sub: out.sub,
      extras: out.extras, steps: out.steps, plainValue: out.value, copyText: `${out.expr} → ${out.label}: ${out.value}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'algebra', calcLabel:'Algebra', expr: out.expr, resultText: out.value, resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 6. GEOMETRY ---------------- */
Calculators.geometry = (function(){
  const SHAPES_2D = [
    { id:'circle', label:'Circle', fields:[{id:'r',label:'Radius'}] },
    { id:'sector', label:'Circular Sector', fields:[{id:'r',label:'Radius'},{id:'theta',label:'Angle (degrees)'}] },
    { id:'square', label:'Square', fields:[{id:'s',label:'Side'}] },

    { id:'rhombus', label:'Rhombus', fields:[{id:'d1',label:'Diagonal 1'},{id:'d2',label:'Diagonal 2'}] },
    { id:'ellipse', label:'Ellipse', fields:[{id:'a',label:'Semi-major axis'},{id:'b',label:'Semi-minor axis'}] },

  const SHAPES_3D = [
    { id:'sphere', label:'Sphere', fields:[{id:'r',label:'Radius'}] },
    { id:'cube', label:'Cube', fields:[{id:'s',label:'Side'}] },
    { id:'cuboid', label:'Cuboid', fields:[{id:'l',label:'Length'},{id:'w',label:'Width'},{id:'h',label:'Height'}] },
    { id:'cylinder', label:'Cylinder', fields:[{id:'r',label:'Radius'},{id:'h',label:'Height'}] },
    { id:'cone', label:'Cone', fields:[{id:'r',label:'Radius'},{id:'h',label:'Height'}] },
    { id:'pyramid', label:'Square Pyramid', fields:[{id:'s',label:'Base side'},{id:'h',label:'Height'}] },
  ];
  let dim = '2d';
  let shapeId = 'circle';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="select-inline" style="margin-bottom:12px;">
            <span class="chip-radio active" data-dim="2d">2D Shapes</span>
            <span class="chip-radio" data-dim="3d">3D Shapes</span>
          </div>
          <div class="field" style="margin-bottom:14px;">
            <label>Choose a shape</label>
            <select class="input" id="geo-shape"></select>
          </div>
          <div id="geo-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="geo-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="geo-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="geo-result"></div>
      </div>
    `;
    document.querySelectorAll('[data-dim]').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('[data-dim]').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        dim = el.getAttribute('data-dim');
        shapeId = (dim==='2d'?SHAPES_2D:SHAPES_3D)[0].id;
        populateShapeSelect();
        renderFields();
        ResultPanel.empty(document.getElementById('geo-result'));
      });
    });
    populateShapeSelect();
    renderFields();
    ResultPanel.empty(document.getElementById('geo-result'), 'Choose a shape and enter its dimensions.');
    document.getElementById('geo-calc').addEventListener('click', compute);
    document.getElementById('geo-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('geo-result')); ErrBanner.clear(); });
  }

  function shapeList(){ return dim==='2d' ? SHAPES_2D : SHAPES_3D; }
  function currentShape(){ return shapeList().find(s => s.id === shapeId) || shapeList()[0]; }

  function populateShapeSelect(){
    const sel = document.getElementById('geo-shape');
    sel.innerHTML = shapeList().map(s => `<option value="${s.id}">${Util.esc(s.label)}</option>`).join('');
    sel.value = shapeId;
    sel.onchange = () => { shapeId = sel.value; renderFields(); ResultPanel.empty(document.getElementById('geo-result')); };
  }

  function renderFields(){
    const shape = currentShape();
    document.getElementById('geo-fields').innerHTML = `<div class="field-grid">` +
      shape.fields.map(f => `<div class="field"><label>${Util.esc(f.label)} <span class="req">*</span></label><input type="number" class="input" id="geo-${f.id}" placeholder="e.g. 10"><span class="field-err" id="geo-${f.id}-err"></span></div>`).join('') +
      `</div>`;
  }

  function num(id, label, errs){
    const el = document.getElementById('geo-'+id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push(['geo-'+id, label + ' is required']); return NaN; }
    const n = Util.toNum(v);
    if (n <= 0) { errs.push(['geo-'+id, label + ' must be greater than zero']); return NaN; }
    return n;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('geo-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input').forEach(e => e.classList.remove('err'));
    const PI = Math.PI;
    let out;
    const shape = currentShape();
    const L = (id,label) => num(id,label,errs);

    try {
      switch(shapeId){
        case 'circle': { const r=L('r','Radius'); if(!errs.length){ const area=PI*r*r, circ=2*PI*r;
          out = { extras:[{k:'Area',v:Util.fmt(area)},{k:'Circumference',v:Util.fmt(circ)},{k:'Diameter',v:Util.fmt(2*r)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
            steps:[`Area = πr² = π×${Util.fmt(r)}² = <b>${Util.fmt(area)}</b>`, `Circumference = 2πr = <b>${Util.fmt(circ)}</b>`], expr:`circle r=${r}`, raw:area }; } break; }
        case 'sector': { const r=L('r','Radius'), theta=L('theta','Angle (degrees)'); if(!errs.length){
          if (theta <= 0 || theta > 360) { errs.push(['geo-theta','Angle must be between 0 and 360 degrees']); }
          else { const area = (theta/360)*PI*r*r; const arcLen = (theta/360)*2*PI*r; const per = arcLen + 2*r;
            out = { extras:[{k:'Arc length',v:Util.fmt(arcLen)},{k:'Perimeter',v:Util.fmt(per)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
              steps:[`Area = (θ/360) × πr² = (${Util.fmt(theta)}/360) × π×${Util.fmt(r)}² = <b>${Util.fmt(area)}</b>`, `Arc length = (θ/360) × 2πr = <b>${Util.fmt(arcLen)}</b>`], expr:`sector r=${r} θ=${theta}°`, raw:area }; } } break; }
        case 'square': { const s=L('s','Side'); if(!errs.length){ const area=s*s, per=4*s, diag=s*Math.SQRT2;
          out = { extras:[{k:'Perimeter',v:Util.fmt(per)},{k:'Diagonal',v:Util.fmt(diag)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
            steps:[`Area = s² = ${Util.fmt(s)}² = <b>${Util.fmt(area)}</b>`, `Perimeter = 4s = <b>${Util.fmt(per)}</b>`], expr:`square s=${s}`, raw:area }; } break; }
        case 'rectangle': { const l=L('l','Length'), w=L('w','Width'); if(!errs.length){ const area=l*w, per=2*(l+w), diag=Math.sqrt(l*l+w*w);
          out = { extras:[{k:'Perimeter',v:Util.fmt(per)},{k:'Diagonal',v:Util.fmt(diag)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
            steps:[`Area = l×w = ${Util.fmt(l)}×${Util.fmt(w)} = <b>${Util.fmt(area)}</b>`, `Perimeter = 2(l+w) = <b>${Util.fmt(per)}</b>`], expr:`rectangle ${l}x${w}`, raw:area }; } break; }
        case 'triangle': { const b=L('b','Base'), h=L('h','Height'); if(!errs.length){ const area=0.5*b*h;
          out = { main:{label:'Area',value:Util.fmt(area),unit:'sq units'}, steps:[`Area = ½ × base × height = ½ × ${Util.fmt(b)} × ${Util.fmt(h)} = <b>${Util.fmt(area)}</b>`], expr:`triangle b=${b} h=${h}`, raw:area }; } break; }
        case 'triangle3': { const a=L('a','Side a'), b=L('b','Side b'), c=L('c','Side c'); if(!errs.length){
          if (a+b<=c || b+c<=a || a+c<=b) { errs.push(['geo-a','These three sides cannot form a valid triangle']); }
          else { const s=(a+b+c)/2; const area=Math.sqrt(s*(s-a)*(s-b)*(s-c)); const per=a+b+c;
            out = { extras:[{k:'Perimeter',v:Util.fmt(per)},{k:'Semi-perimeter',v:Util.fmt(s)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
              steps:[`s = (a+b+c)/2 = ${Util.fmt(s)}`, `Area = √[s(s−a)(s−b)(s−c)] = <b>${Util.fmt(area)}</b> (Heron's formula)`], expr:`triangle a=${a} b=${b} c=${c}`, raw:area }; } } break; }
        case 'parallelogram': { const b=L('b','Base'), h=L('h','Height'); if(!errs.length){ const area=b*h;
          out = { main:{label:'Area',value:Util.fmt(area),unit:'sq units'}, steps:[`Area = base × height = ${Util.fmt(b)} × ${Util.fmt(h)} = <b>${Util.fmt(area)}</b>`], expr:`parallelogram b=${b} h=${h}`, raw:area }; } break; }
        case 'trapezoid': { const a=L('a','Side a'), b=L('b','Side b'), h=L('h','Height'); if(!errs.length){ const area=(a+b)/2*h;
          out = { main:{label:'Area',value:Util.fmt(area),unit:'sq units'}, steps:[`Area = ½(a+b)×h = ½×(${Util.fmt(a)}+${Util.fmt(b)})×${Util.fmt(h)} = <b>${Util.fmt(area)}</b>`], expr:`trapezoid a=${a} b=${b} h=${h}`, raw:area }; } break; }
        case 'rhombus': { const d1=L('d1','Diagonal 1'), d2=L('d2','Diagonal 2'); if(!errs.length){ const area=(d1*d2)/2; const side=Math.sqrt((d1/2)**2+(d2/2)**2); const per=4*side;
          out = { extras:[{k:'Side length',v:Util.fmt(side)},{k:'Perimeter',v:Util.fmt(per)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
            steps:[`Area = (d₁×d₂)/2 = (${Util.fmt(d1)}×${Util.fmt(d2)})/2 = <b>${Util.fmt(area)}</b>`], expr:`rhombus d1=${d1} d2=${d2}`, raw:area }; } break; }
        case 'ellipse': { const a=L('a','Semi-major axis'), b=L('b','Semi-minor axis'); if(!errs.length){ const area=PI*a*b;
          const h2=Math.pow((a-b)/(a+b),2); const per=PI*(a+b)*(1+3*h2/(10+Math.sqrt(4-3*h2)));
          out = { extras:[{k:'Approx. perimeter',v:Util.fmt(per)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
            steps:[`Area = π×a×b = π×${Util.fmt(a)}×${Util.fmt(b)} = <b>${Util.fmt(area)}</b>`, `Perimeter ≈ Ramanujan approximation = ${Util.fmt(per)}`], expr:`ellipse a=${a} b=${b}`, raw:area }; } break; }
        case 'hexagon': { const s=L('s','Side'); if(!errs.length){ const area=(3*Math.sqrt(3)/2)*s*s; const per=6*s;
          out = { extras:[{k:'Perimeter',v:Util.fmt(per)}], main:{label:'Area',value:Util.fmt(area),unit:'sq units'},
            steps:[`Area = (3√3/2)×s² = (3√3/2)×${Util.fmt(s)}² = <b>${Util.fmt(area)}</b>`], expr:`hexagon s=${s}`, raw:area }; } break; }
        case 'sphere': { const r=L('r','Radius'); if(!errs.length){ const vol=(4/3)*PI*r**3, surf=4*PI*r*r;
          out = { extras:[{k:'Surface area',v:Util.fmt(surf)}], main:{label:'Volume',value:Util.fmt(vol),unit:'cu units'},
            steps:[`Volume = (4/3)πr³ = <b>${Util.fmt(vol)}</b>`, `Surface area = 4πr² = <b>${Util.fmt(surf)}</b>`], expr:`sphere r=${r}`, raw:vol }; } break; }
        case 'cube': { const s=L('s','Side'); if(!errs.length){ const vol=s**3, surf=6*s*s;
          out = { extras:[{k:'Surface area',v:Util.fmt(surf)}], main:{label:'Volume',value:Util.fmt(vol),unit:'cu units'},
            steps:[`Volume = s³ = <b>${Util.fmt(vol)}</b>`, `Surface area = 6s² = <b>${Util.fmt(surf)}</b>`], expr:`cube s=${s}`, raw:vol }; } break; }
        case 'cuboid': { const l=L('l','Length'), w=L('w','Width'), h=L('h','Height'); if(!errs.length){ const vol=l*w*h, surf=2*(l*w+w*h+l*h);
          out = { extras:[{k:'Surface area',v:Util.fmt(surf)}], main:{label:'Volume',value:Util.fmt(vol),unit:'cu units'},
            steps:[`Volume = l×w×h = <b>${Util.fmt(vol)}</b>`, `Surface area = 2(lw+wh+lh) = <b>${Util.fmt(surf)}</b>`], expr:`cuboid ${l}x${w}x${h}`, raw:vol }; } break; }
        case 'cylinder': { const r=L('r','Radius'), h=L('h','Height'); if(!errs.length){ const vol=PI*r*r*h, surf=2*PI*r*(r+h);
          out = { extras:[{k:'Surface area',v:Util.fmt(surf)}], main:{label:'Volume',value:Util.fmt(vol),unit:'cu units'},
            steps:[`Volume = πr²h = <b>${Util.fmt(vol)}</b>`, `Surface area = 2πr(r+h) = <b>${Util.fmt(surf)}</b>`], expr:`cylinder r=${r} h=${h}`, raw:vol }; } break; }
        case 'cone': { const r=L('r','Radius'), h=L('h','Height'); if(!errs.length){ const vol=(1/3)*PI*r*r*h; const slant=Math.sqrt(r*r+h*h); const surf=PI*r*(r+slant);
          out = { extras:[{k:'Slant height',v:Util.fmt(slant)},{k:'Surface area',v:Util.fmt(surf)}], main:{label:'Volume',value:Util.fmt(vol),unit:'cu units'},
            steps:[`Volume = (1/3)πr²h = <b>${Util.fmt(vol)}</b>`, `Slant height l = √(r²+h²) = ${Util.fmt(slant)}`, `Surface area = πr(r+l) = <b>${Util.fmt(surf)}</b>`], expr:`cone r=${r} h=${h}`, raw:vol }; } break; }
        case 'pyramid': { const s=L('s','Base side'), h=L('h','Height'); if(!errs.length){ const base=s*s; const vol=(1/3)*base*h;
          out = { extras:[{k:'Base area',v:Util.fmt(base)}], main:{label:'Volume',value:Util.fmt(vol),unit:'cu units'},
            steps:[`Base area = s² = <b>${Util.fmt(base)}</b>`, `Volume = (1/3)×base×height = <b>${Util.fmt(vol)}</b>`], expr:`pyramid s=${s} h=${h}`, raw:vol }; } break; }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.main.label, value: Util.esc(out.main.value), unit: out.main.unit,
      sub: `${shape.label}`, extras: out.extras, steps: out.steps,
      plainValue: out.main.value, copyText: `${shape.label} (${out.expr}) → ${out.main.label}: ${out.main.value}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'geometry', calcLabel:'Geometry', expr: `${shape.label}: ${out.expr}`, resultText: out.main.value, resultRaw: out.raw });
  }

  return { render };
})();

/* ---------------- 7. SCIENTIFIC CALCULATOR ---------------- */
Calculators.scientific = (function(){
  let expr = '';
  let memory = 0;

  function render(container){
    expr = '';
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="select-inline" style="margin-bottom:10px;">
            <span class="chip-radio ${MState.angleMode==='deg'?'active':''}" data-angle="deg">DEG</span>
            <span class="chip-radio ${MState.angleMode==='rad'?'active':''}" data-angle="rad">RAD</span>
            <span class="badge badge-soft" style="margin-left:auto;align-self:center;">M = <span id="sci-mem">${Util.fmt(memory)}</span></span>
          </div>
          <div class="expr-display">
            <div class="ed-expr" id="sci-hist-line">&nbsp;</div>
            <div class="ed-live" id="sci-live">0</div>
          </div>
          <div class="field" style="margin-bottom:10px;">
            <input type="text" class="input" id="sci-direct" placeholder="Type expression, e.g. sin(30)+sqrt(49)" autocomplete="off">
          </div>
          <div class="keypad" id="sci-keypad-fn" style="grid-template-columns:repeat(5,1fr);margin-bottom:6px;"></div>
          <div class="keypad" id="sci-keypad"></div>
          <div class="info-box"><b>Constants:</b> pi, e &nbsp; <b>Functions:</b> sin cos tan asin acos atan sinh cosh tanh log ln sqrt cbrt abs round floor ceil exp fact(n) or n! &nbsp; <b>ans</b> recalls your last answer.</div>
        </div>
        <div class="result-panel" id="sci-result"></div>
      </div>
    `;
    buildKeypads();
    ResultPanel.empty(document.getElementById('sci-result'), 'Your calculation will appear here.');

    document.querySelectorAll('[data-angle]').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('[data-angle]').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        MState.saveAngleMode(el.getAttribute('data-angle'));
        Toast.show('Angle mode: ' + el.getAttribute('data-angle').toUpperCase(), 'ok');
      });
    });

    const direct = document.getElementById('sci-direct');
    direct.addEventListener('keydown', (e) => { if (e.key === 'Enter') { expr = direct.value; updateLive(); evaluate(); } });
    direct.addEventListener('input', () => { expr = direct.value; updateLive(); });

    document.addEventListener('keydown', keyHandler);
    container._cleanup = () => document.removeEventListener('keydown', keyHandler);
  }

  function keyHandler(e){
    if (MState.currentCalcId !== 'scientific') return;
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    if (/[0-9+\-*/.^%()!]/.test(e.key)) { append(e.key); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === '=') { evaluate(); e.preventDefault(); }
    else if (e.key === 'Backspace') { expr = expr.slice(0,-1); updateLive(); e.preventDefault(); }
    else if (e.key === 'Escape') { clearAll(); e.preventDefault(); }
  }

  function buildKeypads(){
    const fnKeys = ['sin(','cos(','tan(','log(','ln(','sqrt(','^2','^3','!','asin(','acos(','atan(','pi','e','ans'];
    const fnEl = document.getElementById('sci-keypad-fn');
    fnEl.innerHTML = fnKeys.map(k => `<button data-fn="${Util.esc(k)}" style="font-size:12px;padding:9px 0;">${Util.esc(k.replace('(','').replace('^2','x²').replace('^3','x³'))}</button>`).join('');
    fnEl.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => handleFn(btn.getAttribute('data-fn'))));

    const keys = [
      ['MC','mem'],['MR','mem'],['M+','mem'],['M-','mem'],
      ['(',''],[')',''],['C','clear'],['⌫','del'],
      ['7',''],['8',''],['9',''],['÷','op'],
      ['4',''],['5',''],['6',''],['×','op'],
      ['1',''],['2',''],['3',''],['−','op'],
      ['0',''],['.',''],['%','op'],['+','op'],
      ['=','eq']
    ];
    const kp = document.getElementById('sci-keypad');
    kp.innerHTML = keys.map(([label,cls]) => `<button class="${cls}" data-key="${Util.esc(label)}">${Util.esc(label)}</button>`).join('');
    kp.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => handleKeypad(btn.getAttribute('data-key'))));
  }

  function handleFn(fn){
    if (fn === '^2') { expr += '^2'; }
    else if (fn === '^3') { expr += '^3'; }
    else if (fn === '!') { expr += '!'; }
    else if (fn === 'pi' || fn === 'e' || fn === 'ans') { expr += fn; }
    else { expr += fn; }
    updateLive();
  }

  function handleKeypad(key){
    if (key === 'C') return clearAll();
    if (key === '⌫') { expr = expr.slice(0,-1); return updateLive(); }
    if (key === '=') return evaluate();
    if (key === 'MC') { memory = 0; document.getElementById('sci-mem').textContent = Util.fmt(memory); Toast.show('Memory cleared','ok'); return; }
    if (key === 'MR') { expr += Util.fmt(memory); return updateLive(); }
    if (key === 'M+' || key === 'M-') {
      try {
        const val = expr.trim() ? ExprParser.evaluate(expr, {angleMode: MState.angleMode}) : 0;
        memory = key === 'M+' ? memory + val : memory - val;
        document.getElementById('sci-mem').textContent = Util.fmt(memory);
        Toast.show('Memory ' + (key==='M+'?'+':'−') + ' ' + Util.fmt(val), 'ok');
      } catch(e) { Toast.show('Cannot store: ' + e.message, 'error'); }
      return;
    }
    const map = {'÷':'/', '×':'*', '−':'-'};
    expr += map[key] || key;
    updateLive();
  }

  function clearAll(){
    expr = ''; updateLive();
    document.getElementById('sci-hist-line').innerHTML = '&nbsp;';
    const direct = document.getElementById('sci-direct');
    if (direct) direct.value = '';
    ResultPanel.empty(document.getElementById('sci-result'), 'Your calculation will appear here.');
  }

  function updateLive(){
    const live = document.getElementById('sci-live');
    const direct = document.getElementById('sci-direct');
    if (live) live.textContent = expr || '0';
    if (direct && direct.value !== expr) direct.value = expr;
  }

  function evaluate(){
    if (!expr.trim()) return;
    try {
      const result = ExprParser.evaluate(expr, {angleMode: MState.angleMode});
      const resultText = Util.fmt(result);
      document.getElementById('sci-hist-line').textContent = expr + ' =';
      document.getElementById('sci-live').textContent = resultText;
      MState.saveLastAnswer(result);
      ResultPanel.render(document.getElementById('sci-result'), {
        label: 'Result', value: Util.esc(resultText), plainValue: resultText, copyText: resultText,
        sub: `Angle mode: ${MState.angleMode.toUpperCase()}`,
        steps: [`${Util.esc(expr)} = <b>${Util.esc(resultText)}</b>`],
        onReset: clearAll
      });
      MState.addHistory({ calcId:'scientific', calcLabel:'Scientific', expr, resultText, resultRaw: result });
      expr = resultText;
    } catch(e) {
      ResultPanel.error(document.getElementById('sci-result'), e.message || 'Invalid expression');
      Toast.show(e.message || 'Invalid expression', 'error');
    }
  }

  return { render };
})();

/* ---------------- 8. STATISTICS & PROBABILITY ---------------- */
Calculators.statistics = (function(){
  const MODES = [
    { id:'descriptive', label:'Mean, Median, Mode, SD (dataset)' },
    { id:'permutation', label:'Permutation (nPr)' },
    { id:'combination', label:'Combination (nCr)' },
    { id:'probability', label:'Simple probability' },
    { id:'binomial',    label:'Binomial probability' },
  ];
  let mode = 'descriptive';

  function render(container){
    container.innerHTML = `
      <div class="calc-layout">
        <div class="card card-pad">
          <div class="field" style="margin-bottom:14px;">
            <label>Choose calculation type</label>
            <select class="input" id="st-mode"></select>
          </div>
          <div id="st-fields"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="st-calc">${icon('calc')} Calculate</button>
            <button class="btn btn-ghost" id="st-reset">${icon('reset')} Reset</button>
          </div>
        </div>
        <div class="result-panel" id="st-result"></div>
      </div>
    `;
    const sel = document.getElementById('st-mode');
    sel.innerHTML = MODES.map(m => `<option value="${m.id}">${Util.esc(m.label)}</option>`).join('');
    sel.value = mode;
    sel.addEventListener('change', () => { mode = sel.value; renderFields(); ResultPanel.empty(document.getElementById('st-result')); });
    renderFields();
    ResultPanel.empty(document.getElementById('st-result'), 'Enter values to calculate.');
    document.getElementById('st-calc').addEventListener('click', compute);
    document.getElementById('st-reset').addEventListener('click', () => { renderFields(); ResultPanel.empty(document.getElementById('st-result')); ErrBanner.clear(); });
  }

  function fieldsFor(m){
    switch(m){
      case 'descriptive': return `
        <div class="field f1">
          <label>Dataset (comma or space separated) <span class="req">*</span></label>
          <textarea class="input" id="st-data" rows="3" placeholder="4, 8, 6, 5, 3, 7, 9, 2"></textarea>
          <span class="field-err" id="st-data-err"></span>
        </div>
        <div class="select-inline" style="margin-top:8px;">
          <span class="chip-radio active" data-vartype="sample">Sample (n−1)</span>
          <span class="chip-radio" data-vartype="population">Population (n)</span>
        </div>`;
      case 'permutation': case 'combination': return `
        <div class="field-grid">
          <div class="field"><label>n (total items) <span class="req">*</span></label><input type="number" class="input" id="st-n" placeholder="5" step="1"><span class="field-err" id="st-n-err"></span></div>
          <div class="field"><label>r (items chosen) <span class="req">*</span></label><input type="number" class="input" id="st-r" placeholder="3" step="1"><span class="field-err" id="st-r-err"></span></div>
        </div>`;
      case 'probability': return `
        <div class="field-grid">
          <div class="field"><label>Favorable outcomes <span class="req">*</span></label><input type="number" class="input" id="st-fav" placeholder="3" step="1"><span class="field-err" id="st-fav-err"></span></div>
          <div class="field"><label>Total possible outcomes <span class="req">*</span></label><input type="number" class="input" id="st-total" placeholder="6" step="1"><span class="field-err" id="st-total-err"></span></div>
        </div>`;
      case 'binomial': return `
        <div class="field-grid">
          <div class="field"><label>Number of trials (n) <span class="req">*</span></label><input type="number" class="input" id="st-n" placeholder="5" step="1"><span class="field-err" id="st-n-err"></span></div>
          <div class="field"><label>Successes wanted (k) <span class="req">*</span></label><input type="number" class="input" id="st-k" placeholder="3" step="1"><span class="field-err" id="st-k-err"></span></div>
          <div class="field"><label>Probability of success (p)</label><div class="input-suffix-wrap"><input type="number" class="input" id="st-p" placeholder="0.5" step="0.01"><span class="suffix">0–1</span></div><span class="field-err" id="st-p-err"></span></div>
        </div>`;
      default: return '';
    }
  }
  let varType = 'sample';
  function renderFields(){
    document.getElementById('st-fields').innerHTML = fieldsFor(mode);
    if (mode === 'descriptive') {
      varType = 'sample';
      document.querySelectorAll('[data-vartype]').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('[data-vartype]').forEach(x=>x.classList.remove('active'));
          el.classList.add('active'); varType = el.getAttribute('data-vartype');
        });
      });
    }
  }

  function fact(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
  function nPr(n,r){ return fact(n)/fact(n-r); }
  function nCr(n,r){ return fact(n)/(fact(r)*fact(n-r)); }

  function num(id, label, errs, opts){
    const el = document.getElementById(id);
    const v = el ? el.value : '';
    if (!Util.isNum(v)) { errs.push([id, label + ' is required']); return NaN; }
    const n = Util.toNum(v);
    if (opts && opts.int && !Number.isInteger(n)) { errs.push([id, label + ' must be a whole number']); return NaN; }
    if (opts && opts.nonneg && n < 0) { errs.push([id, label + ' cannot be negative']); return NaN; }
    return n;
  }

  function compute(){
    ErrBanner.clear();
    const resEl = document.getElementById('st-result');
    const errs = [];
    document.querySelectorAll('.field-err').forEach(e => e.textContent='');
    document.querySelectorAll('.input, textarea.input').forEach(e => e.classList.remove('err'));
    let out;

    try {
      if (mode === 'descriptive') {
        const raw = document.getElementById('st-data').value;
        const data = raw.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).map(Number);
        if (!raw.trim() || data.some(isNaN) || data.length < 1) {
          errs.push(['st-data', 'Enter a valid comma or space separated list of numbers']);
        } else if (data.length < 2 && varType === 'sample') {
          errs.push(['st-data', 'Sample standard deviation needs at least 2 values']);
        } else {
          const n = data.length;
          const sum = data.reduce((a,b)=>a+b,0);
          const mean = sum/n;
          const sorted = [...data].sort((a,b)=>a-b);
          const median = n%2===0 ? (sorted[n/2-1]+sorted[n/2])/2 : sorted[(n-1)/2];
          const freq = {};
          data.forEach(d => freq[d]=(freq[d]||0)+1);
          const maxFreq = Math.max(...Object.values(freq));
          const modes = Object.keys(freq).filter(k=>freq[k]===maxFreq).map(Number);
          const modeText = maxFreq === 1 ? 'No repeated value' : modes.map(m=>Util.fmt(m)).join(', ');
          const range = Math.max(...data) - Math.min(...data);
          const divisor = varType === 'sample' ? n-1 : n;
          const variance = data.reduce((a,b)=>a+Math.pow(b-mean,2),0)/divisor;
          const sd = Math.sqrt(variance);

          // Outlier detection via IQR (feature 27) — only meaningful with
          // enough data points to form real quartiles.
          let outlierInfo = null;
          if (n >= 4) {
            const quartile = (arr, q) => {
              const pos = (arr.length - 1) * q;
              const base = Math.floor(pos), rest = pos - base;
              return arr[base + 1] !== undefined ? arr[base] + rest * (arr[base+1] - arr[base]) : arr[base];
            };
            const q1 = quartile(sorted, 0.25), q3 = quartile(sorted, 0.75);
            const iqr = q3 - q1;
            const lowerFence = q1 - 1.5*iqr, upperFence = q3 + 1.5*iqr;
            const outliers = data.filter(v => v < lowerFence || v > upperFence);
            outlierInfo = { q1, q3, iqr, lowerFence, upperFence, outliers: [...new Set(outliers)].sort((a,b)=>a-b) };
          }

          out = {
            label:'Mean', value: Util.fmt(mean),
            extras:[
              {k:'Median', v:Util.fmt(median)},
              {k:'Mode', v:modeText},
              {k:'Range', v:Util.fmt(range)},
              {k:`Variance (${varType})`, v:Util.fmt(variance)},
              {k:`Std. deviation (${varType})`, v:Util.fmt(sd)},
              {k:'Count (n)', v:String(n)},
              {k:'Sum', v:Util.fmt(sum)},
              ...(outlierInfo ? [{k:'Outliers (IQR method)', v: outlierInfo.outliers.length ? outlierInfo.outliers.map(Util.fmt).join(', ') : 'None detected'}] : [])
            ],
            steps:[`Mean = Σx ÷ n = ${Util.fmt(sum)} ÷ ${n} = <b>${Util.fmt(mean)}</b>`,
                   `Median = middle value(s) of sorted data = <b>${Util.fmt(median)}</b>`,
                   `Variance (${varType}) = Σ(x−mean)² ÷ ${varType==='sample'?'(n−1)':'n'} = <b>${Util.fmt(variance)}</b>`,
                   `Std. deviation = √variance = <b>${Util.fmt(sd)}</b>`,
                   ...(outlierInfo ? [`IQR = Q3−Q1 = ${Util.fmt(outlierInfo.q3)}−${Util.fmt(outlierInfo.q1)} = <b>${Util.fmt(outlierInfo.iqr)}</b>; outlier fences at [${Util.fmt(outlierInfo.lowerFence)}, ${Util.fmt(outlierInfo.upperFence)}]`] : [])],
            expr:`stats of [${data.join(', ')}]`, raw: mean
          };
        }
      } else if (mode === 'permutation') {
        const n = num('st-n','n',errs,{int:true,nonneg:true}), r = num('st-r','r',errs,{int:true,nonneg:true});
        if (!errs.length) {
          if (r > n) { errs.push(['st-r','r cannot be greater than n']); }
          else if (n > 170) { errs.push(['st-n','n is too large (max 170)']); }
          else { const val = nPr(n,r);
            out = { label:`P(${n},${r})`, value: Util.fmt(val), steps:[`nPr = n! ÷ (n−r)! = ${n}! ÷ ${n-r}! = <b>${Util.fmt(val)}</b>`], expr:`${n}P${r}`, raw: val };
          }
        }
      } else if (mode === 'combination') {
        const n = num('st-n','n',errs,{int:true,nonneg:true}), r = num('st-r','r',errs,{int:true,nonneg:true});
        if (!errs.length) {
          if (r > n) { errs.push(['st-r','r cannot be greater than n']); }
          else if (n > 170) { errs.push(['st-n','n is too large (max 170)']); }
          else { const val = nCr(n,r);
            out = { label:`C(${n},${r})`, value: Util.fmt(val), steps:[`nCr = n! ÷ [r!(n−r)!] = <b>${Util.fmt(val)}</b>`], expr:`${n}C${r}`, raw: val };
          }
        }
      } else if (mode === 'probability') {
        const fav = num('st-fav','Favorable outcomes',errs,{nonneg:true}), total = num('st-total','Total outcomes',errs,{nonneg:true});
        if (!errs.length) {
          if (total === 0) { errs.push(['st-total','Total outcomes cannot be zero']); }
          else if (fav > total) { errs.push(['st-fav','Favorable outcomes cannot exceed total outcomes']); }
          else { const p = fav/total;
            out = { label:'Probability', value: Util.fmt(p), extras:[{k:'As percentage', v:Util.fmt(p*100)+'%'},{k:'As odds', v:`${Util.fmt(fav)} : ${Util.fmt(total-fav)}`}],
              steps:[`P = favorable ÷ total = ${Util.fmt(fav)} ÷ ${Util.fmt(total)} = <b>${Util.fmt(p)}</b>`], expr:`P(${fav}/${total})`, raw: p };
          }
        }
      } else if (mode === 'binomial') {
        const n = num('st-n','Trials',errs,{int:true,nonneg:true}), k = num('st-k','Successes',errs,{int:true,nonneg:true});
        const pEl = document.getElementById('st-p');
        let p = pEl && pEl.value !== '' ? Util.toNum(pEl.value) : 0.5;
        if (p < 0 || p > 1) { errs.push(['st-p','Probability p must be between 0 and 1']); }
        if (!errs.length) {
          if (k > n) { errs.push(['st-k','Successes cannot exceed trials']); }
          else if (n > 170) { errs.push(['st-n','n is too large (max 170)']); }
          else {
            const prob = nCr(n,k) * Math.pow(p,k) * Math.pow(1-p, n-k);
            out = { label:`P(X = ${k})`, value: Util.fmt(prob), extras:[{k:'As percentage', v:Util.fmt(prob*100)+'%'},{k:'Expected value (np)', v:Util.fmt(n*p)}],
              steps:[`P(X=k) = C(n,k)×p^k×(1−p)^(n−k)`, `= C(${n},${k})×${Util.fmt(p)}^${k}×${Util.fmt(1-p)}^${n-k} = <b>${Util.fmt(prob)}</b>`], expr:`Binomial n=${n} k=${k} p=${p}`, raw: prob };
          }
        }
      }
    } catch(e) {
      ErrBanner.show(e.message || 'Calculation error');
      return;
    }

    if (errs.length) {
      errs.forEach(([id,msg]) => FieldErr.set(id,msg));
      ErrBanner.show('Please fix the highlighted fields.');
      return;
    }
    if (!out) return;
    ResultPanel.render(resEl, {
      label: out.label, value: Util.esc(out.value), extras: out.extras, steps: out.steps,
      plainValue: out.value, copyText: `${out.expr} → ${out.label}: ${out.value}`,
      onReset: () => { renderFields(); ResultPanel.empty(resEl); }
    });
    MState.addHistory({ calcId:'statistics', calcLabel:'Statistics & Probability', expr: out.expr, resultText: out.value, resultRaw: out.raw });
  }

  return { render };
})();

    }},

      pa:{label:'Pascals (Pa)',f:1}, kpa:{label:'Kilopascals (kPa)',f:1000}, bar:{label:'Bar',f:100000}, atm:{label:'Atmospheres',f:101325}, psi:{label:'PSI',f:6894.757}, mmhg:{label:'mmHg',f:133.322}

    }},
    angle: { label:'Angle', units:{
      deg:{label:'Degrees',f:1}, rad:{label:'Radians',f:57.29577951308232}, grad:{label:'Gradians',f:0.9}, arcmin:{label:'Arcminutes',f:0.0166667}, arcsec:{label:'Arcseconds',f:0.000277778}

      hz:{label:'Hertz (Hz)',f:1}, khz:{label:'Kilohertz (kHz)',f:1000}, mhz:{label:'Megahertz (MHz)',f:1e6}, ghz:{label:'Gigahertz (GHz)',f:1e9}, rpm:{label:'RPM',f:0.0166667}

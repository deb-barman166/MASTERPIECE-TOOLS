/* ==========================================================================
   Sub-component: Attendance Calendar (year view) — port of
   src/components/AttendanceCalendar.tsx
   Usage: AttendanceCalendarComponent.build(studentId) -> DOM element
   ========================================================================== */

const AttendanceCalendarComponent = (function () {
  function build(studentId) {
    let currentYear = new Date().getFullYear();
    const container = h('div', { style: 'display:flex;flex-direction:column;gap:24px;' });

    function getStudentAttendance() {
      return Store.getState().attendance.filter((a) => a.studentId === studentId);
    }

    function getStatus(date, studentAttendance) {
      const dateStr = formatYMD(date);
      const record = studentAttendance.find((a) => a.date === dateStr);
      return record ? record.status : undefined;
    }

    function renderBody() {
      container.innerHTML = '';

      const nav = h('div', { class: 'year-nav' });
      const prevBtn = h('button', { class: 'year-nav-btn' }, icon_dom('ChevronLeft'));
      prevBtn.addEventListener('click', () => { currentYear -= 1; renderBody(); });
      const yearLabel = h('h3', { class: 'year-nav-label' }, String(currentYear));
      const nextBtn = h('button', { class: 'year-nav-btn' }, icon_dom('ChevronRight'));
      nextBtn.addEventListener('click', () => { currentYear += 1; renderBody(); });
      nav.appendChild(prevBtn);
      nav.appendChild(yearLabel);
      nav.appendChild(nextBtn);
      container.appendChild(nav);

      const monthsGrid = h('div', { class: 'months-grid' });
      const studentAttendance = getStudentAttendance();
      const todayD = new Date();

      for (let m = 0; m < 12; m++) {
        const monthStart = new Date(currentYear, m, 1);
        const days = eachDayOfMonth(currentYear, m);
        const firstDayOfWeek = monthStart.getDay();

        const monthCard = h('div', { class: 'month-card' });
        monthCard.appendChild(h('h4', { class: 'month-card-title' }, MONTH_NAMES[m]));

        const dowRow = h('div', { class: 'month-dow-row' });
        DAY_NAMES_SHORT2.forEach((d) => dowRow.appendChild(h('div', { class: 'month-dow-cell' }, d)));
        monthCard.appendChild(dowRow);

        const daysGrid = h('div', { class: 'month-days-grid' });
        for (let i = 0; i < firstDayOfWeek; i++) daysGrid.appendChild(h('div', { class: 'month-day-empty' }));

        days.forEach((day) => {
          const status = getStatus(day, studentAttendance);
          const isCurrentDay = isSameYMD(day, todayD);
          const cell = h('div', { class: 'month-day-cell' });

          let circleClass = 'month-day-circle';
          if (status === 'Present') circleClass += ' present';
          else if (status === 'Absent') circleClass += ' absent';
          else if (status === 'Late') circleClass += ' late';
          else if (status === 'Leave') circleClass += ' leave';
          if (isCurrentDay) circleClass += ' today';

          const circle = h('div', { class: circleClass }, String(day.getDate()));
          cell.appendChild(circle);

          const tooltip = h('div', { class: 'month-day-tooltip' });
          const tooltipInner = h('div', { class: 'month-day-tooltip-inner' });
          tooltipInner.textContent = formatMonthDayYear(day) + (status ? ` (${status})` : '');
          tooltip.appendChild(tooltipInner);
          cell.appendChild(tooltip);

          daysGrid.appendChild(cell);
        });

        monthCard.appendChild(daysGrid);
        monthsGrid.appendChild(monthCard);
      }
      container.appendChild(monthsGrid);
    }

    renderBody();
    return container;
  }

  return { build };
})();


// ---- 15-view-attendance.js ----
/* ==========================================================================
   View: Attendance — port of src/components/Attendance.tsx
   ========================================================================== */

const ViewAttendance = (function () {
  let selectedDate = todayYMD();
  let selectedBatchId = '';
  let viewMode = 'mark'; // 'mark' | 'history'
  let selectedHistoryStudentId = null;

  let rootEl = null;
  let tickInterval = null;

  function rerender() {
    if (!rootEl) return;
    const old = rootEl; // capture BEFORE render() runs, since render() reassigns rootEl itself
    const fresh = render();
    old.replaceWith(fresh);
  }

  function getSelectedDayOfWeek() {
    const date = parseYMDLocal(selectedDate);
    return DAY_NAMES_FROM_JS[date.getDay()];
  }

  function formatTime(time24) {
    if (!time24) return '';
    const parts = time24.split(':');
    const hours = parseInt(parts[0], 10);
    const ampm = hours >= 12 ? 'PM' : 'AM';
    const hours12 = hours % 12 || 12;
    return `${hours12}:${parts[1]} ${ampm}`;
  }

  function getBatchTimeDisplay(selectedBatch, selectedDayOfWeek) {
    if (!selectedBatch) return '';
    if (selectedBatch.dayTimes && selectedBatch.dayTimes[selectedDayOfWeek]) {
      const t = selectedBatch.dayTimes[selectedDayOfWeek];
      return `${formatTime(t.start)} to ${formatTime(t.end)}`;
    }
    return formatTime(selectedBatch.time);
  }

  function computeIsRightTime(isToday, selectedBatch, selectedDayOfWeek) {
    if (!isToday || !selectedBatch) return false;
    let startTimeStr = selectedBatch.time;
    let endTimeStr = '';
    if (selectedBatch.dayTimes && selectedBatch.dayTimes[selectedDayOfWeek]) {
      startTimeStr = selectedBatch.dayTimes[selectedDayOfWeek].start;
      endTimeStr = selectedBatch.dayTimes[selectedDayOfWeek].end;
    }
    if (!startTimeStr) return true;
    const now = new Date();
    const currentTime = now.getHours() * 60 + now.getMinutes();
    const parseTime = (t) => {
      if (!t) return 0;
      const parts = t.split(':').map(Number);
      return parts[0] * 60 + parts[1];
    };
    const startMins = parseTime(startTimeStr);
    const endMins = endTimeStr ? parseTime(endTimeStr) : startMins + 120;
    return currentTime >= (startMins - 30) && currentTime <= (endMins + 30);
  }

  function buildMarkView(state) {
    const { batches, students, attendance } = state;
    const todayStr = todayYMD();
    const isToday = selectedDate === todayStr;
    const isFuture = selectedDate > todayStr;
    const selectedDayOfWeek = getSelectedDayOfWeek();
    const batchesOnDay = batches.filter((b) => b.days.includes(selectedDayOfWeek));

    // Auto-select first batch if none selected or selected is not on this day
    if (batchesOnDay.length > 0) {
      if (!selectedBatchId || !batchesOnDay.find((b) => b.id === selectedBatchId)) {
        selectedBatchId = batchesOnDay[0].id;
      }
    } else {
      selectedBatchId = '';
    }

    const selectedBatch = batches.find((b) => b.id === selectedBatchId);
    const batchStudents = students.filter((s) => s.batchId === selectedBatchId);
    const isRightTime = computeIsRightTime(isToday, selectedBatch, selectedDayOfWeek);

    const panel = h('div', { class: 'card' });

    const grid = h('div', { class: 'form-grid cols-2' });
    const dateField = h('div', {});
    dateField.appendChild(h('label', { class: 'field-label' }, 'Select Date'));
    const dateRow = h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' });
    const datePickerEl = Widgets.customDatePicker({
      value: selectedDate,
      onChange: (v) => { selectedDate = v; rerender(); },
    });
    datePickerEl.style.flex = '1';
    dateRow.appendChild(datePickerEl);
    const yesterdayStr = formatYMD(new Date(Date.now() - 24 * 60 * 60 * 1000));
    const todayChip = h('button', { type: 'button', class: `day-pill ${selectedDate === todayStr ? 'active' : ''}` }, 'Today');
    todayChip.addEventListener('click', () => { selectedDate = todayStr; rerender(); });
    const yesterdayChip = h('button', { type: 'button', class: `day-pill ${selectedDate === yesterdayStr ? 'active' : ''}` }, 'Yesterday');
    yesterdayChip.addEventListener('click', () => { selectedDate = yesterdayStr; rerender(); });
    dateRow.appendChild(todayChip);
    dateRow.appendChild(yesterdayChip);
    dateField.appendChild(dateRow);
    const batchField = h('div', {});
    batchField.appendChild(h('label', { class: 'field-label' }, 'Select Batch'));
    batchField.appendChild(Widgets.customSelect({
      value: selectedBatchId,
      options: batchesOnDay.map((b) => ({ value: b.id, label: `${b.name} - ${b.subject}` })),
      placeholder: batchesOnDay.length > 0 ? 'Select a batch' : 'No batches on this day',
      onChange: (v) => { selectedBatchId = v; rerender(); },
    }));
    grid.appendChild(dateField);
    grid.appendChild(batchField);
    panel.appendChild(grid);

    if (selectedBatch) {
      const infoRow = h('div', { class: 'batch-info-row' });
      infoRow.innerHTML = `
        <div>
          <h3 class="batch-info-title">${escapeHtml(selectedBatch.name)}</h3>
          <p class="batch-info-sub">${escapeHtml(selectedBatch.subject)}</p>
        </div>
        <div class="batch-info-time">${icon('Clock', '')}<span>${escapeHtml(getBatchTimeDisplay(selectedBatch, selectedDayOfWeek))}</span></div>
      `;
      panel.appendChild(infoRow);
    }

    if (!isRightTime && isToday && selectedBatch) {
      panel.appendChild(h('div', { class: 'notice-banner' }, 'Note: It is currently not the scheduled time for this class. Attendance can only be marked during the scheduled class time.'));
    }
    if (isFuture && selectedBatch) {
      panel.appendChild(h('div', { class: 'notice-banner' }, 'Note: You cannot mark attendance for future dates.'));
    }

    if (!selectedBatch) {
      const empty = h('div', { class: 'empty-state-inline' });
      empty.innerHTML = `${icon('Calendar', '')}<p>Select a date and batch to manage attendance</p>`;
      panel.appendChild(empty);
    } else if (batchStudents.length === 0) {
      const empty = h('div', { class: 'empty-state-inline' });
      empty.innerHTML = `${icon('Users', '')}<p>No students in this batch</p>`;
      panel.appendChild(empty);
    } else {
      const isDisabled = (!isRightTime && isToday) || isFuture;

      const bulkRow = h('div', { style: 'display:flex;justify-content:flex-end;margin-bottom:12px;' });
      const bulkBtn = h('button', { class: 'btn btn-ghost-sm' });
      bulkBtn.innerHTML = `${icon('CheckCircle2', '')} Mark All Present`;
      if (isDisabled) bulkBtn.disabled = true;
      bulkBtn.addEventListener('click', () => {
        batchStudents.forEach((s) => Store.markAttendance(s.id, selectedBatch.id, selectedDate, 'Present'));
        Toast.show({ message: `Marked ${batchStudents.length} student${batchStudents.length === 1 ? '' : 's'} present.` });
        rerender();
      });
      bulkRow.appendChild(bulkBtn);
      panel.appendChild(bulkRow);

      const list = h('div', {});
      batchStudents.forEach((student) => {
        const record = attendance.find((a) => a.studentId === student.id && a.date === selectedDate);
        const status = record ? record.status : undefined;

        const row = h('div', { class: 'attendance-mark-row' });
        row.appendChild(h('div', { class: 'attendance-mark-name' }, student.name));
        const actions = h('div', { class: 'attendance-mark-actions' });

        const presentBtn = h('button', { class: `attn-btn present ${status === 'Present' ? 'active' : ''}` });
        presentBtn.innerHTML = `${icon('CheckCircle2', '')}Present`;
        if (isDisabled) presentBtn.disabled = true;
        presentBtn.addEventListener('click', () => {
          Store.markAttendance(student.id, selectedBatch.id, selectedDate, 'Present');
          rerender();
        });

        const lateBtn = h('button', { class: `attn-btn late ${status === 'Late' ? 'active' : ''}` });
        lateBtn.innerHTML = `${icon('Clock', '')}Late`;
        if (isDisabled) lateBtn.disabled = true;
        lateBtn.addEventListener('click', () => {
          Store.markAttendance(student.id, selectedBatch.id, selectedDate, 'Late');
          rerender();
        });

        const leaveBtn = h('button', { class: `attn-btn leave ${status === 'Leave' ? 'active' : ''}` });
        leaveBtn.innerHTML = `${icon('Calendar', '')}Leave`;
        if (isDisabled) leaveBtn.disabled = true;
        leaveBtn.addEventListener('click', () => {
          Store.markAttendance(student.id, selectedBatch.id, selectedDate, 'Leave');
          rerender();
        });

        const absentBtn = h('button', { class: `attn-btn absent ${status === 'Absent' ? 'active' : ''}` });
        absentBtn.innerHTML = `${icon('XCircle', '')}Absent`;
        if (isDisabled) absentBtn.disabled = true;
        absentBtn.addEventListener('click', () => {
          Store.markAttendance(student.id, selectedBatch.id, selectedDate, 'Absent');
          rerender();
        });

        actions.appendChild(presentBtn);
        actions.appendChild(lateBtn);
        actions.appendChild(leaveBtn);
        actions.appendChild(absentBtn);
        row.appendChild(actions);
        list.appendChild(row);
      });
      panel.appendChild(list);
    }

    return panel;
  }

  function buildHistoryView(state) {
    const { students, batches, attendance } = state;
    const grid = h('div', { class: 'cards-grid' });

    if (students.length === 0) {
      const empty = h('div', { class: 'empty-state' });
      empty.innerHTML = `${icon('Users', '')}<p>No students found.</p>`;
      grid.appendChild(empty);
      return grid;
    }

    students.forEach((student) => {
      const batch = batches.find((b) => b.id === student.batchId);
      const studentAttendance = attendance.filter((a) => a.studentId === student.id);
      const presentCount = studentAttendance.filter((a) => a.status === 'Present').length;
      const lateCount = studentAttendance.filter((a) => a.status === 'Late').length;
      const absentCount = studentAttendance.filter((a) => a.status === 'Absent').length;
      // Leave (excused) days are excluded from the percentage denominator entirely.
      const total = presentCount + lateCount + absentCount;
      const percentage = total > 0 ? Math.round(((presentCount + lateCount) / total) * 100) : 0;
      const isLow = total > 0 && percentage < state.lowAttendanceThreshold;

      const card = h('div', { class: 'attendance-card' });
      card.innerHTML = `
        <div class="attendance-card-glow"></div>
        <div class="attendance-card-body">
          <div class="attendance-card-icon">${icon('Users', '')}</div>
          <div style="flex:1;">
            <h3 class="attendance-card-name">${escapeHtml(student.name)}${isLow ? ` <span class="badge badge-red" style="margin-left:6px;">Low</span>` : ''}</h3>
            <p class="attendance-card-batch">${escapeHtml(batch ? batch.name : 'Unassigned Batch')}</p>
            <div class="attendance-card-stats">
              <div class="attendance-stat-pill present">${presentCount} Present</div>
              ${lateCount > 0 ? `<div class="attendance-stat-pill late">${lateCount} Late</div>` : ''}
              <div class="attendance-stat-pill absent">${absentCount} Absent</div>
              <div class="attendance-stat-pill pct">${percentage}%</div>
            </div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => { selectedHistoryStudentId = student.id; rerender(); });
      grid.appendChild(card);
    });
    return grid;
  }

  function buildHistoryModal(state) {
    const student = state.students.find((s) => s.id === selectedHistoryStudentId);
    if (!student) return null;

    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { selectedHistoryStudentId = null; rerender(); });
    const box = h('div', { class: 'modal-box modal-3xl modal-scroll-90', style: 'max-width:1024px;' });
    const closeBtn = h('button', { class: 'modal-close' }, icon_dom('XCircle'));
    closeBtn.addEventListener('click', () => { selectedHistoryStudentId = null; rerender(); });
    box.appendChild(closeBtn);

    const header = h('div', { class: 'modal-icon-header' });
    header.innerHTML = `
      <div class="modal-icon-badge" style="width:56px;height:56px;">${icon('Users', '')}</div>
      <div><h3 class="modal-icon-header-title" style="font-size:24px;">${escapeHtml(student.name)}</h3><p class="modal-icon-header-sub">Full Year Attendance</p></div>
    `;
    box.appendChild(header);

    const scrollArea = h('div', { class: 'custom-scrollbar', style: 'overflow-y:auto;padding-right:8px;flex:1;' });
    scrollArea.appendChild(AttendanceCalendarComponent.build(student.id));
    box.appendChild(scrollArea);

    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  function render() {
    const state = Store.getState();

    const wrap = h('div', { class: 'view-body', style: 'gap:24px;' });

    const header = h('div', { class: 'view-header stack-mobile' });
    const titleWrap = h('div', {});
    const title = h('h2', { class: 'view-title', style: 'font-size:24px;display:flex;align-items:center;gap:8px;' });
    title.innerHTML = `${icon('Users', '')}Attendance`;
    title.querySelector('svg').style.color = '#00F5FF';
    titleWrap.appendChild(title);
    titleWrap.appendChild(h('p', { class: 'view-subtitle', style: 'font-size:14px;margin-top:4px;' }, 'Track student attendance for your classes'));
    header.appendChild(titleWrap);

    const toggle = h('div', { class: 'view-toggle' });
    const markBtn = h('button', { class: `view-toggle-btn ${viewMode === 'mark' ? 'active' : ''}` }, 'Mark Attendance');
    markBtn.addEventListener('click', () => { viewMode = 'mark'; rerender(); });
    const histBtn = h('button', { class: `view-toggle-btn ${viewMode === 'history' ? 'active' : ''}` }, 'History');
    histBtn.addEventListener('click', () => { viewMode = 'history'; rerender(); });
    toggle.appendChild(markBtn);
    toggle.appendChild(histBtn);
    header.appendChild(toggle);
    if (viewMode === 'history' && state.attendance.length > 0) {
      const exportBtn = h('button', { class: 'btn btn-ghost-sm' });
      exportBtn.innerHTML = `${icon('FileText', '')} Export CSV`;
      exportBtn.addEventListener('click', () => {
        const data = state.attendance.slice().sort((a, b) => new Date(a.date) - new Date(b.date)).map((rec) => {
          const student = state.students.find((s) => s.id === rec.studentId);
          const batch = state.batches.find((b) => b.id === rec.batchId);
          return {
            'Date': rec.date,
            'Student Name': (student && student.name) || 'Unknown',
            'Batch': (batch && batch.name) || 'Unknown',
            'Status': rec.status,
          };
        });
        exportToCSV(data, 'Attendance_History');
      });
      header.appendChild(exportBtn);
    }
    wrap.appendChild(header);

    if (viewMode === 'mark') wrap.appendChild(buildMarkView(state));
    else wrap.appendChild(buildHistoryView(state));

    rootEl = wrap;

    clearModalPortal();
    if (selectedHistoryStudentId) {
      const modal = buildHistoryModal(state);
      if (modal) mountModal(modal);
    }

    // Re-check the time-gate every 30s so the Present/Absent buttons enable
    // themselves automatically once the class window opens, without requiring
    // the user to touch anything.
    if (tickInterval) clearInterval(tickInterval);
    tickInterval = setInterval(() => {
      if (viewMode === 'mark') rerender();
    }, 30000);
    App.registerCleanup(() => { if (tickInterval) { clearInterval(tickInterval); tickInterval = null; } });

    return wrap;
  }

  return { render };
})();

/* ==========================================================================
   View: Academics — test scores and homework tracking, added to close the
   gap between "manage the business" and "actually teach": a tutor needs to
   see who's falling behind and who hasn't done the reading.
   ========================================================================== */

const ViewAcademics = (function () {
  let subTab = 'tests'; // 'tests' | 'homework' | 'syllabus'
  let selectedBatchId = '';

  let showAddTest = false;
  let newTest = { title: '', batchId: '', date: todayYMD(), maxMarks: 100 };
  let markEntry = {}; // studentId -> marks string, while editing a test's scores
  let viewingTestId = null; // test currently open for score entry
  let deletingTestId = null;

  let showAddHomework = false;
  let newHomework = { title: '', batchId: '', assignedDate: todayYMD(), dueDate: '', description: '' };
  let viewingHomeworkId = null;
  let deletingHomeworkId = null;

  let newSyllabusEntry = { batchId: '', date: todayYMD(), topic: '' };
  let deletingSyllabusId = null;

  let rootEl = null;

  function rerender() {
    if (!rootEl) return;
    const old = rootEl;
    const fresh = render();
    old.replaceWith(fresh);
  }

  function buildSubTabBar() {
    const bar = h('div', { class: 'view-toggle', style: 'margin-bottom:20px;' });
    const testsBtn = h('button', { class: `view-toggle-btn ${subTab === 'tests' ? 'active' : ''}` }, 'Tests & Marks');
    testsBtn.addEventListener('click', () => { subTab = 'tests'; rerender(); });
    const hwBtn = h('button', { class: `view-toggle-btn ${subTab === 'homework' ? 'active' : ''}` }, 'Homework');
    hwBtn.addEventListener('click', () => { subTab = 'homework'; rerender(); });
    const syllabusBtn = h('button', { class: `view-toggle-btn ${subTab === 'syllabus' ? 'active' : ''}` }, 'Syllabus');
    syllabusBtn.addEventListener('click', () => { subTab = 'syllabus'; rerender(); });
    const leaderboardBtn = h('button', { class: `view-toggle-btn ${subTab === 'leaderboard' ? 'active' : ''}` });
    leaderboardBtn.innerHTML = `${icon('Award', '')} Leaderboard`;
    leaderboardBtn.addEventListener('click', () => { subTab = 'leaderboard'; rerender(); });
    bar.appendChild(testsBtn);
    bar.appendChild(hwBtn);
    bar.appendChild(syllabusBtn);
    bar.appendChild(leaderboardBtn);
    return bar;
  }

  // ---------------- Tests ----------------

  function handleAddTestSubmit(e) {
    e.preventDefault();
    if (!newTest.title || !newTest.batchId || !newTest.maxMarks) return;
    Store.addTest({
      title: newTest.title,
      batchId: newTest.batchId,
      date: newTest.date,
      maxMarks: parseFloat(newTest.maxMarks),
      scores: [],
    });
    showAddTest = false;
    newTest = { title: '', batchId: '', date: todayYMD(), maxMarks: 100 };
    rerender();
  }

  function buildAddTestForm(batches) {
    const panel = h('form', { class: 'form-panel', style: 'margin-bottom:24px;' });
    const closeBtn = h('button', { type: 'button', class: 'form-panel-close' }, icon_dom('X'));
    closeBtn.addEventListener('click', () => { showAddTest = false; rerender(); });
    panel.appendChild(closeBtn);
    panel.appendChild(h('h3', { class: 'form-panel-title' }, 'Add Test'));

    const grid = h('div', { class: 'form-grid cols-2' });

    const titleField = h('div', {});
    titleField.appendChild(h('label', { class: 'field-label' }, 'Test Title'));
    const titleInput = h('input', { type: 'text', class: 'text-input', placeholder: 'e.g., Unit 3 Test', required: 'required' });
    titleInput.value = newTest.title;
    titleInput.addEventListener('input', () => { newTest.title = titleInput.value; });
    titleField.appendChild(titleInput);

    const batchField = h('div', {});
    batchField.appendChild(h('label', { class: 'field-label' }, 'Batch'));
    batchField.appendChild(Widgets.customSelect({
      value: newTest.batchId,
      options: batches.map((b) => ({ value: b.id, label: `${b.name} (${b.subject})` })),
      placeholder: 'Select a batch',
      onChange: (v) => { newTest.batchId = v; },
    }));

    const dateField = h('div', {});
    dateField.appendChild(h('label', { class: 'field-label' }, 'Date'));
    dateField.appendChild(Widgets.customDatePicker({
      value: newTest.date,
      onChange: (v) => { newTest.date = v; },
    }));

    const maxField = h('div', {});
    maxField.appendChild(h('label', { class: 'field-label' }, 'Max Marks'));
    const maxInput = h('input', { type: 'number', min: '1', class: 'text-input', required: 'required' });
    maxInput.value = newTest.maxMarks;
    maxInput.addEventListener('input', () => { newTest.maxMarks = maxInput.value; });
    maxField.appendChild(maxInput);

    grid.appendChild(titleField);
    grid.appendChild(batchField);
    grid.appendChild(dateField);
    grid.appendChild(maxField);
    panel.appendChild(grid);

    const actions = h('div', { class: 'form-actions' });
    actions.appendChild(h('button', { type: 'submit', class: 'btn btn-white' }, 'Save Test'));
    panel.appendChild(actions);
    panel.addEventListener('submit', handleAddTestSubmit);
    return panel;
  }

  function testClassAverage(test) {
    if (!test.scores || test.scores.length === 0) return null;
    const pcts = test.scores.map((sc) => (sc.marks / test.maxMarks) * 100);
    return Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
  }

  function buildTestCard(test, state) {
    const batch = state.batches.find((b) => b.id === test.batchId);
    const batchStudentCount = state.students.filter((s) => s.batchId === test.batchId).length;
    const scoredCount = (test.scores || []).length;
    const avg = testClassAverage(test);

    const card = h('div', { class: 'card', style: 'padding:20px;cursor:pointer;' });
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div>
          <h3 style="font-size:16px;font-weight:700;color:white;">${escapeHtml(test.title)}</h3>
          <p style="font-size:13px;color:var(--color-text-muted);">${escapeHtml(batch ? batch.name : 'Unknown batch')} • ${escapeHtml(test.date)}</p>
        </div>
        <span class="badge badge-purple">Out of ${escapeHtml(String(test.maxMarks))}</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;">
        <span class="badge ${scoredCount < batchStudentCount ? 'badge-amber' : 'badge-emerald'}">${scoredCount}/${batchStudentCount} scored</span>
        ${avg !== null ? `<span class="badge badge-cyan">Class avg ${avg}%</span>` : ''}
      </div>
    `;
    card.addEventListener('click', () => { viewingTestId = test.id; markEntry = {}; (test.scores || []).forEach((sc) => { markEntry[sc.studentId] = String(sc.marks); }); rerender(); });
    const delBtn = h('button', { class: 'table-action-btn', style: 'float:right;margin-top:-56px;' }, icon_dom('Trash2'));
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deletingTestId = test.id; rerender(); });
    card.appendChild(delBtn);
    return card;
  }

  function buildTestScoreModal(state) {
    const test = state.tests.find((t) => t.id === viewingTestId);
    if (!test) { viewingTestId = null; return null; }
    const batchStudents = state.students.filter((s) => s.batchId === test.batchId);

    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { viewingTestId = null; rerender(); });
    const box = h('div', { class: 'modal-box modal-lg modal-scroll-90' });
    const closeBtn = h('button', { class: 'modal-close' }, icon_dom('X'));
    closeBtn.addEventListener('click', () => { viewingTestId = null; rerender(); });
    box.appendChild(closeBtn);
    box.appendChild(h('h3', { class: 'modal-title' }, `${test.title} — Enter Marks`));
    box.appendChild(h('p', { style: 'color:var(--color-text-muted);font-size:13px;margin-bottom:16px;' }, `Out of ${test.maxMarks} marks`));

    if (batchStudents.length === 0) {
      box.appendChild(h('div', { class: 'empty-state-inline' }, 'No students in this batch.'));
    } else {
      const list = h('div', { class: 'custom-scrollbar', style: 'max-height:50vh;overflow-y:auto;' });
      batchStudents.forEach((student) => {
        const row = h('div', { class: 'attendance-mark-row' });
        row.appendChild(h('div', { class: 'attendance-mark-name' }, student.name));
        const marksInput = h('input', { type: 'number', min: '0', max: String(test.maxMarks), class: 'text-input', style: 'max-width:100px;', placeholder: '-' });
        marksInput.value = markEntry[student.id] !== undefined ? markEntry[student.id] : '';
        marksInput.addEventListener('input', () => { markEntry[student.id] = marksInput.value; });
        row.appendChild(marksInput);
        list.appendChild(row);
      });
      box.appendChild(list);
    }

    const actions = h('div', { class: 'form-actions' });
    const saveBtn = h('button', { class: 'btn btn-primary' }, 'Save Marks');
    saveBtn.addEventListener('click', () => {
      const scores = Object.keys(markEntry)
        .filter((sid) => markEntry[sid] !== '' && markEntry[sid] !== undefined && !isNaN(parseFloat(markEntry[sid])))
        .map((sid) => ({ studentId: sid, marks: Math.min(parseFloat(markEntry[sid]), test.maxMarks) }));
      Store.updateTest(test.id, { scores });
      viewingTestId = null;
      rerender();
    });
    actions.appendChild(saveBtn);
    box.appendChild(actions);

    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  function buildTestDeleteModal() {
    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { deletingTestId = null; rerender(); });

    box.appendChild(h('h3', { class: 'modal-title' }, 'Delete this test?'));

    delBtn.addEventListener('click', () => { Store.deleteTest(deletingTestId); deletingTestId = null; rerender(); });

    actions.appendChild(delBtn);
    box.appendChild(actions);
    overlay.appendChild(backdrop);
    overlay.appendChild(box);

  function buildTestsPanel(state) {
    const wrap = h('div', {});

    const box = h('div', { class: 'modal-box' });

    box.appendChild(h('p', { style: 'color:var(--color-text-muted);margin-bottom:20px;' }, 'This will remove the assignment and completion records. This cannot be undone.'));
    const actions = h('div', { class: 'form-actions' });

    cancelBtn.addEventListener('click', () => { deletingHomeworkId = null; rerender(); });

    delBtn.addEventListener('click', () => { Store.deleteHomework(deletingHomeworkId); deletingHomeworkId = null; rerender(); });
    actions.appendChild(cancelBtn);
    actions.appendChild(delBtn);
    box.appendChild(actions);
    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  function buildHomeworkPanel(state) {
    const wrap = h('div', {});
    const filtered = selectedBatchId ? state.homework.filter((hw) => hw.batchId === selectedBatchId) : state.homework;
    const sorted = filtered.slice().sort((a, b) => new Date(b.assignedDate) - new Date(a.assignedDate));

    if (sorted.length === 0) {
      const empty = h('div', { class: 'empty-state' });

      wrap.appendChild(empty);
    } else {

  // ---------------- Syllabus / topics covered ----------------
  // A lightweight running log, separate from tests/homework, for the simple
  // "what did I actually teach and when" question a tutor gets asked by
  // parents (and sometimes needs to answer for themselves before a test).

  function handleAddSyllabusSubmit(e) {
    e.preventDefault();
    if (!newSyllabusEntry.batchId || !newSyllabusEntry.topic.trim()) return;
    Store.addSyllabusEntry({
      batchId: newSyllabusEntry.batchId,
      date: newSyllabusEntry.date,
      topic: newSyllabusEntry.topic.trim(),
    });
    newSyllabusEntry = { batchId: newSyllabusEntry.batchId, date: todayYMD(), topic: '' };
    rerender();
  }

  function buildSyllabusPanel(state) {
    const wrap = h('div', {});

    const quickAdd = h('form', { class: 'card', style: 'padding:20px;margin-bottom:24px;' });
    quickAdd.appendChild(h('h4', { style: 'font-size:15px;font-weight:700;color:white;margin-bottom:12px;' }, 'Log a Topic Covered'));
    const row = h('div', { style: 'display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;' });

    const batchField = h('div', { style: 'min-width:180px;' });
    batchField.appendChild(h('label', { class: 'field-label' }, 'Batch'));
    batchField.appendChild(Widgets.customSelect({
      value: newSyllabusEntry.batchId,
      options: state.batches.map((b) => ({ value: b.id, label: `${b.name} (${b.subject})` })),
      placeholder: 'Select a batch',
      onChange: (v) => { newSyllabusEntry.batchId = v; },
    }));

    const dateField = h('div', { style: 'min-width:150px;' });
    dateField.appendChild(h('label', { class: 'field-label' }, 'Date'));
    dateField.appendChild(Widgets.customDatePicker({
      value: newSyllabusEntry.date,
      onChange: (v) => { newSyllabusEntry.date = v; },
    }));

    const topicField = h('div', { style: 'flex:1;min-width:200px;' });
    topicField.appendChild(h('label', { class: 'field-label' }, 'Topic / What was covered'));
    const topicInput = h('input', { type: 'text', class: 'text-input', placeholder: 'e.g., Quadratic equations — factoring method', required: 'required' });
    topicInput.value = newSyllabusEntry.topic;
    topicInput.addEventListener('input', () => { newSyllabusEntry.topic = topicInput.value; });
    topicField.appendChild(topicInput);

    const submitBtn = h('button', { type: 'submit', class: 'btn btn-primary' }, 'Log It');

    row.appendChild(batchField);
    row.appendChild(dateField);
    row.appendChild(topicField);
    row.appendChild(submitBtn);
    quickAdd.appendChild(row);
    quickAdd.addEventListener('submit', handleAddSyllabusSubmit);
    wrap.appendChild(quickAdd);

    const filtered = selectedBatchId ? (state.syllabusEntries || []).filter((e) => e.batchId === selectedBatchId) : (state.syllabusEntries || []);
    const sorted = filtered.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

    if (sorted.length === 0) {

        `;

  // ---------------- Leaderboard (new) ----------------
  // Ranks students within a batch by their average percentage across all
  // tests recorded for that batch. Uses the same tests/scores data already
  // captured in the Tests & Marks tab — no new data entry required.
  function computeLeaderboard(state, batchId) {
    const batchTests = state.tests.filter((t) => t.batchId === batchId);
    const batchStudents = state.students.filter((s) => s.batchId === batchId);
    const rows = batchStudents.map((student) => {
      const percentages = [];
      batchTests.forEach((test) => {
        const sc = (test.scores || []).find((s) => s.studentId === student.id);
        if (sc && typeof sc.marks === 'number' && test.maxMarks > 0) {
          percentages.push((sc.marks / test.maxMarks) * 100);
        }
      });
      const avg = percentages.length > 0 ? percentages.reduce((a, b) => a + b, 0) / percentages.length : null;
      return { student, avg, testsCount: percentages.length, trend: percentages };
    }).filter((r) => r.avg !== null);
    rows.sort((a, b) => b.avg - a.avg);
    return rows;
  }

  function buildTrendSparkline(percentages) {
    if (percentages.length < 2) return '';
    const w = 90, hgt = 28;
    const step = w / (percentages.length - 1);
    const points = percentages.map((p, i) => {
      const x = i * step;
      const y = hgt - (Math.max(0, Math.min(100, p)) / 100) * hgt;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const lastUp = percentages[percentages.length - 1] >= percentages[0];
    const strokeColor = lastUp ? '#34d399' : '#f87171';
    return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" style="overflow:visible;"><polyline points="${points}" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function buildLeaderboardPanel(state) {
    const panel = h('div', {});
    if (!selectedBatchId) {
      const empty = h('div', { class: 'empty-state' });
      empty.innerHTML = `${icon('Award', '')}<p>Select a batch above to see its leaderboard.</p>`;
      panel.appendChild(empty);
      return panel;
    }
    const rows = computeLeaderboard(state, selectedBatchId);
    if (rows.length === 0) {
      const empty = h('div', { class: 'empty-state' });
      empty.innerHTML = `${icon('Award', '')}<p>No test scores recorded yet for this batch.</p><p style="font-size:14px;margin-top:4px;">Add a test and enter marks to populate the leaderboard.</p>`;
      panel.appendChild(empty);
      return panel;
    }
    const card = h('div', { class: 'card' });
    card.appendChild(h('h3', { class: 'settings-section-title' }, `Ranked by average score across ${state.tests.filter((t) => t.batchId === selectedBatchId).length} test(s)`));
    rows.forEach((row, idx) => {
      const rankClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
      const rowEl = h('div', { class: 'leaderboard-row' });
      rowEl.innerHTML = `
        <div class="leaderboard-rank ${rankClass}">${idx + 1}</div>
        <div style="flex:1;min-width:0;">
          <div class="leaderboard-name">${escapeHtml(row.student.name)}</div>
          <div class="leaderboard-sub">${row.testsCount} test${row.testsCount === 1 ? '' : 's'} recorded</div>
        </div>
        <div>${buildTrendSparkline(row.trend)}</div>
        <div class="leaderboard-score">${Math.round(row.avg)}%</div>
      `;
      card.appendChild(rowEl);
    });
    panel.appendChild(card);
    return panel;
  }

  // ---------------- Weak Topics (new, surfaced within Syllabus) ----------------
  function buildWeakTopicsCard(state) {
    const card = h('div', { class: 'card' });
    card.appendChild(h('h3', { class: 'settings-section-title' }, 'Revision List'));
    card.appendChild(h('p', { style: 'color:var(--color-text-muted);font-size:13px;margin:-8px 0 16px;' }, 'Topics flagged as needing revision before the next exam.'));

    const addRow = h('div', { style: 'display:flex;gap:8px;margin-bottom:14px;' });
    const topicInput = h('input', { type: 'text', class: 'text-input', placeholder: 'Topic that needs revision...', style: 'flex:1;' });
    const addBtn = h('button', { class: 'btn btn-ghost-sm' }, 'Add');
    addBtn.addEventListener('click', () => {
      if (!topicInput.value.trim() || !selectedBatchId) {
        Toast.show({ message: selectedBatchId ? 'Enter a topic.' : 'Select a batch first.' });
        return;
      }
      Store.addWeakTopic({ batchId: selectedBatchId, topic: topicInput.value.trim(), addedDate: todayYMD() });
      rerender();
    });
    addRow.appendChild(topicInput);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

    const relevant = (state.weakTopics || []).filter((w) => !selectedBatchId || w.batchId === selectedBatchId);
    if (relevant.length === 0) {
      card.appendChild(h('div', { class: 'empty-state-inline' }, 'No topics flagged yet.'));
    } else {
      relevant.slice().sort((a, b) => (a.resolved === b.resolved ? 0 : a.resolved ? 1 : -1)).forEach((w) => {
        const batch = state.batches.find((b) => b.id === w.batchId);
        const row = h('div', { class: `weak-topic-row ${w.resolved ? 'resolved' : ''}` });
        const left = h('div', {});
        left.innerHTML = `<div class="weak-topic-title" style="${w.resolved ? 'text-decoration:line-through;' : ''}">${escapeHtml(w.topic)}</div><div class="weak-topic-meta">${escapeHtml(batch ? batch.name : 'Unknown batch')} • flagged ${escapeHtml(w.addedDate)}</div>`;
        row.appendChild(left);
        const right = h('div', { style: 'display:flex;gap:6px;' });
        const toggleBtn = h('button', { class: 'fee-record-icon-btn', title: w.resolved ? 'Mark unresolved' : 'Mark revised' }, icon_dom('CheckCircle2'));
        toggleBtn.addEventListener('click', () => { Store.toggleWeakTopicResolved(w.id); rerender(); });
        const delBtn = h('button', { class: 'fee-record-icon-btn danger', title: 'Remove' }, icon_dom('Trash2'));
        delBtn.addEventListener('click', () => { Store.deleteWeakTopic(w.id); rerender(); });
        right.appendChild(toggleBtn);
        right.appendChild(delBtn);
        row.appendChild(right);
        card.appendChild(row);
      });
    }
    return card;
  }

  function render() {
    const state = Store.getState();
    const wrap = h('div', { class: 'view-body' });

    const header = h('div', { class: 'view-header stack-mobile' });
    header.appendChild(h('div', {}, [
      h('h2', { class: 'view-title' }, 'Academics'),
      h('p', { class: 'view-subtitle' }, 'Track test scores and homework completion by batch.'),
    ]));
    const addBtn = h('button', { class: 'btn btn-primary-sm' });
    addBtn.innerHTML = subTab === 'tests' ? `${icon('Plus', '')} Add Test` : `${icon('Plus', '')} Assign Homework`;
    addBtn.addEventListener('click', () => {
      if (subTab === 'tests') { showAddTest = true; } else { showAddHomework = true; }
      rerender();
    });
    if (subTab === 'tests' || subTab === 'homework') header.appendChild(addBtn);
    const hasExportable = subTab === 'tests' ? state.tests.length > 0 : state.homework.length > 0;
    if ((subTab === 'tests' || subTab === 'homework') && hasExportable) {
      const exportBtn = h('button', { class: 'btn btn-ghost-sm' });
      exportBtn.innerHTML = `${icon('FileText', '')} Export CSV`;
      exportBtn.addEventListener('click', () => {
        if (subTab === 'tests') {
          const rows = [];
          state.tests.forEach((test) => {
            const batch = state.batches.find((b) => b.id === test.batchId);
            const batchStudents = state.students.filter((s) => s.batchId === test.batchId);
            batchStudents.forEach((student) => {
              const sc = (test.scores || []).find((s) => s.studentId === student.id);
              rows.push({
                'Test': test.title,
                'Batch': (batch && batch.name) || 'Unknown',
                'Date': test.date,
                'Student Name': student.name,
                'Marks': sc ? sc.marks : '',
                'Max Marks': test.maxMarks,
                'Percentage': sc ? `${Math.round((sc.marks / test.maxMarks) * 100)}%` : '',
              });
            });
          });
          exportToCSV(rows, 'Test_Scores');
        } else {
          const rows = [];
          state.homework.forEach((hw) => {
            const batch = state.batches.find((b) => b.id === hw.batchId);
            const batchStudents = state.students.filter((s) => s.batchId === hw.batchId);
            batchStudents.forEach((student) => {
              rows.push({
                'Homework': hw.title,
                'Batch': (batch && batch.name) || 'Unknown',
                'Assigned Date': hw.assignedDate,
                'Due Date': hw.dueDate || '',
                'Student Name': student.name,
                'Status': (hw.doneBy || []).includes(student.id) ? 'Done' : 'Pending',
              });
            });
          });
          exportToCSV(rows, 'Homework_Completion');
        }
      });
      header.appendChild(exportBtn);
    }
    wrap.appendChild(header);

    wrap.appendChild(buildSubTabBar());

    const filterRow = h('div', { style: 'margin-bottom:20px;max-width:280px;' });
    filterRow.appendChild(Widgets.customSelect({
      value: selectedBatchId,
      options: state.batches.map((b) => ({ value: b.id, label: `${b.name} (${b.subject})` })),
      placeholder: 'All batches',
      onChange: (v) => { selectedBatchId = v; rerender(); },
    }));
    wrap.appendChild(filterRow);

    if (subTab === 'tests') {
      if (showAddTest) wrap.appendChild(buildAddTestForm(state.batches));
      wrap.appendChild(buildTestsPanel(state));
    } else if (subTab === 'homework') {
      if (showAddHomework) wrap.appendChild(buildAddHomeworkForm(state.batches));
      wrap.appendChild(buildHomeworkPanel(state));
    } else if (subTab === 'leaderboard') {
      wrap.appendChild(buildLeaderboardPanel(state));
      wrap.appendChild(buildWeakTopicsCard(state));
    } else {
      wrap.appendChild(buildSyllabusPanel(state));
    }

    rootEl = wrap;

    clearModalPortal();
    if (viewingTestId) {
      const modal = buildTestScoreModal(state);
      if (modal) mountModal(modal);
    } else if (deletingTestId) mountModal(buildTestDeleteModal());
    else if (viewingHomeworkId) {
      const modal = buildHomeworkModal(state);
      if (modal) mountModal(modal);
    } else if (deletingHomeworkId) mountModal(buildHomeworkDeleteModal());

    return wrap;
  }

  return { render };
})();


// ---- 16-view-schedule.js ----
/* ==========================================================================
   View: Schedule — custom flow canvas replacing @xyflow/react
   Port of src/components/Schedule.tsx
   ========================================================================== */

const ViewSchedule = (function () {
  const NODE_WIDTH = 210; // approx rendered width incl. padding, for edge anchor calc
  const NODE_HEIGHT_EST = 120; // approx rendered height, for edge anchor calc

  let isAddMenuOpen = false;

  // Viewport transform state (pan/zoom)
  let scale = 1;
  let panX = 0;
  let panY = 0;

  let rootEl = null;
  let statusTickInterval = null;
  let svgEl = null;
  let canvasEl = null;
  let viewportEl = null;
  let bgEl = null;
  let nodeEls = {}; // id -> element

  function rerenderFull() {
    if (!rootEl) return;
    const old = rootEl; // capture BEFORE render() runs, since render() reassigns rootEl itself
    const fresh = render();
    old.replaceWith(fresh);
  }

  // ---- Status computation (exact port of BatchNode status logic) ----
  function parseTime12to24Local(time12h) {
    const parts = time12h.split(' ');
    const time = parts[0], modifier = parts[1];
    if (!time || !modifier) return '';
    let timeParts = time.split(':');
    let hours = timeParts[0], minutes = timeParts[1];
    if (hours === '12') hours = '00';
    if (modifier === 'PM') hours = (parseInt(hours, 10) + 12).toString();
    return `${hours.padStart(2, '0')}:${minutes}`;
  }

  function computeNodeStatus(batch) {
    if (!batch) return 'not-today';
    const now = new Date();
    const currentDay = DAY_NAMES_FROM_JS[now.getDay()];
    const currentTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;

    if (!batch.days.includes(currentDay)) return 'not-today';

    let start = '', end = '';
    if (batch.dayTimes && batch.dayTimes[currentDay]) {
      start = batch.dayTimes[currentDay].start;
      end = batch.dayTimes[currentDay].end;
    } else {
      const dayStr = `${currentDay} (`;
      const dayIndex = batch.time.indexOf(dayStr);
      if (dayIndex !== -1) {
        const startIndex = dayIndex + dayStr.length;
        const endIndex = batch.time.indexOf(')', startIndex);
        if (endIndex !== -1) {
          const timeRange = batch.time.substring(startIndex, endIndex);
          const parts = timeRange.split(' - ');
          if (parts.length === 2) {
            start = parseTime12to24Local(parts[0]);
            end = parseTime12to24Local(parts[1]);
          }
        }
      }
    }

    if (start && end) {
      if (currentTime >= start && currentTime <= end) return 'in-progress';
      if (currentTime > end) return 'completed';
      return 'upcoming';
    }
    return 'upcoming';
  }

  // ---- Node dragging ----
  function makeNodeDraggable(nodeEl, node) {
    let dragging = false;
    let startClientX = 0, startClientY = 0;
    let startPosX = 0, startPosY = 0;

    function onPointerDown(e) {
      if (e.target.closest('.flow-node-delete') || e.target.closest('.flow-handle')) return;
      dragging = true;
      nodeEl.classList.add('dragging');
      startClientX = e.clientX;
      startClientY = e.clientY;
      startPosX = node.position.x;
      startPosY = node.position.y;
      nodeEl.setPointerCapture(e.pointerId);
      e.stopPropagation();
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const dx = (e.clientX - startClientX) / scale;
      const dy = (e.clientY - startClientY) / scale;
      node.position = { x: startPosX + dx, y: startPosY + dy };
      nodeEl.style.transform = `translate(${node.position.x}px, ${node.position.y}px)`;
      updateEdgesForNode(node.id);
    }
    function onPointerUp(e) {
      if (!dragging) return;
      dragging = false;
      nodeEl.classList.remove('dragging');
      try { nodeEl.releasePointerCapture(e.pointerId); } catch (err) {}
      Store.onNodesChange([{ id: node.id, type: 'position', position: node.position }]);
    }

    nodeEl.addEventListener('pointerdown', onPointerDown);
    nodeEl.addEventListener('pointermove', onPointerMove);
    nodeEl.addEventListener('pointerup', onPointerUp);
    nodeEl.addEventListener('pointercancel', onPointerUp);
  }

  // ---- Connection dragging (handle -> handle) ----
  let connectingFrom = null; // { nodeId }
  let tempEdgePath = null;

  function nodeCenterAnchor(node) {
    return {
      top: { x: node.position.x + NODE_WIDTH / 2, y: node.position.y },
      bottom: { x: node.position.x + NODE_WIDTH / 2, y: node.position.y + NODE_HEIGHT_EST },
    };
  }

  function startConnection(node, e) {
    connectingFrom = { nodeId: node.id };
    document.addEventListener('pointermove', onConnectionMove);
    document.addEventListener('pointerup', onConnectionUp);
    e.stopPropagation();
  }

  function canvasPointFromClient(clientX, clientY) {
    const rect = viewportEl.getBoundingClientRect();
    const x = (clientX - rect.left - panX) / scale;
    const y = (clientY - rect.top - panY) / scale;
    return { x, y };
  }

  function onConnectionMove(e) {
    if (!connectingFrom) return;
    const state = Store.getState();
    const sourceNode = state.scheduleNodes.find((n) => n.id === connectingFrom.nodeId);
    if (!sourceNode) return;
    const anchors = nodeCenterAnchor(sourceNode);
    const from = anchors.bottom;
    const to = canvasPointFromClient(e.clientX, e.clientY);
    drawTempEdge(from, to);
  }

  function onConnectionUp(e) {
    document.removeEventListener('pointermove', onConnectionMove);
    document.removeEventListener('pointerup', onConnectionUp);
    if (tempEdgePath) { tempEdgePath.remove(); tempEdgePath = null; }
    if (!connectingFrom) return;

    const targetHandle = document.elementFromPoint(e.clientX, e.clientY);
    const targetNodeEl = targetHandle ? targetHandle.closest('.flow-node') : null;
    if (targetNodeEl) {
      const targetId = targetNodeEl.getAttribute('data-node-id');
      if (targetId && targetId !== connectingFrom.nodeId) {
        Store.onConnect({ source: connectingFrom.nodeId, target: targetId });
        rebuildEdgesAndNodes();
      }
    }
    connectingFrom = null;
  }

  function drawTempEdge(from, to) {
    if (!tempEdgePath) {
      tempEdgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tempEdgePath.setAttribute('class', 'flow-edge-path');
      tempEdgePath.setAttribute('stroke-dasharray', '5,5');
      tempEdgePath.setAttribute('opacity', '0.6');
      svgEl.appendChild(tempEdgePath);
    }
    const offset = 20000;
    const d = bezierPath(from.x + offset, from.y + offset, to.x + offset, to.y + offset);
    tempEdgePath.setAttribute('d', d);
  }

  // ---- Bezier path calculation (matches getBezierPath vertical top/bottom flow) ----
  function bezierPath(sx, sy, tx, ty) {
    const dy = Math.abs(ty - sy);
    const curviness = Math.max(dy * 0.5, 40);
    const c1x = sx, c1y = sy + curviness;
    const c2x = tx, c2y = ty - curviness;
    return `M ${sx},${sy} C ${c1x},${c1y} ${c2x},${c2y} ${tx},${ty}`;
  }

  function edgeMidpoint(sx, sy, tx, ty) {
    const dy = Math.abs(ty - sy);
    const curviness = Math.max(dy * 0.5, 40);
    const c1x = sx, c1y = sy + curviness;
    const c2x = tx, c2y = ty - curviness;
    const mx = 0.125 * sx + 0.375 * c1x + 0.375 * c2x + 0.125 * tx;
    const my = 0.125 * sy + 0.375 * c1y + 0.375 * c2y + 0.125 * ty;
    return { x: mx, y: my };
  }

  function updateEdgesForNode(nodeId) {
    const state = Store.getState();
    state.scheduleEdges.forEach((edge) => {
      if (edge.source === nodeId || edge.target === nodeId) {
        drawEdge(edge, state);
      }
    });
  }

  function drawEdge(edge, state) {
    const sourceNode = state.scheduleNodes.find((n) => n.id === edge.source);
    const targetNode = state.scheduleNodes.find((n) => n.id === edge.target);
    if (!sourceNode || !targetNode) return;
    const offset = 20000;
    const sAnchor = nodeCenterAnchor(sourceNode).bottom;
    const tAnchor = nodeCenterAnchor(targetNode).top;
    const sx = sAnchor.x + offset, sy = sAnchor.y + offset;
    const tx = tAnchor.x + offset, ty = tAnchor.y + offset;
    const d = bezierPath(sx, sy, tx, ty);

    let pathEl = svgEl.querySelector(`path.flow-edge-path[data-edge-id="${edge.id}"]`);
    let hitEl = svgEl.querySelector(`path.flow-edge-hit[data-edge-id="${edge.id}"]`);
    // The delete button is a plain HTML div living directly in canvasEl (NOT inside
    // the SVG as a foreignObject) so it can be appended after node cards and always
    // paint on top of them, even when an edge's midpoint happens to fall underneath
    // a node — otherwise the node's own stacking would swallow clicks on the button.
    let delBtn = canvasEl.querySelector(`.flow-edge-delete-btn[data-edge-id="${edge.id}"]`);
    if (!pathEl) {
      hitEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hitEl.setAttribute('class', 'flow-edge-hit');
      hitEl.setAttribute('data-edge-id', edge.id);
      svgEl.appendChild(hitEl);

      pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pathEl.setAttribute('class', 'flow-edge-path');
      pathEl.setAttribute('data-edge-id', edge.id);
      pathEl.setAttribute('marker-end', 'url(#flow-arrow)');
      svgEl.appendChild(pathEl);

      const clickHandler = (ev) => {
        ev.stopPropagation();
        Store.onEdgesChange([{ id: edge.id, type: 'remove' }]);
        rebuildEdgesAndNodes();
      };
      hitEl.addEventListener('click', clickHandler);
      pathEl.addEventListener('click', clickHandler);

      delBtn = document.createElement('div');
      delBtn.className = 'flow-edge-delete-btn';
      delBtn.setAttribute('data-edge-id', edge.id);
      delBtn.innerHTML = icon('X', '', 'width="12" height="12"');
      delBtn.addEventListener('click', clickHandler);
      canvasEl.appendChild(delBtn);
    }
    pathEl.setAttribute('d', d);
    hitEl.setAttribute('d', d);
    const mid = edgeMidpoint(sx, sy, tx, ty);
    // mid.x/mid.y are in the same +20000 offset space used for the SVG's oversized
    // viewBox; canvasEl itself has no such offset, so subtract it back out here.
    delBtn.style.left = (mid.x - offset - 10) + 'px';
    delBtn.style.top = (mid.y - offset - 10) + 'px';
  }

  function rebuildEdgesAndNodes() {
    const state = Store.getState();
    svgEl.querySelectorAll('[data-edge-id]').forEach((el) => {
      const id = el.getAttribute('data-edge-id');
      if (!state.scheduleEdges.find((e) => e.id === id)) el.remove();
    });
    canvasEl.querySelectorAll('.flow-edge-delete-btn[data-edge-id]').forEach((el) => {
      const id = el.getAttribute('data-edge-id');
      if (!state.scheduleEdges.find((e) => e.id === id)) el.remove();
    });
    state.scheduleEdges.forEach((edge) => drawEdge(edge, state));

    Object.keys(nodeEls).forEach((id) => {
      if (!state.scheduleNodes.find((n) => n.id === id)) {
        nodeEls[id].remove();
        delete nodeEls[id];
      }
    });

    // Restore the empty-state hint if the last node was just removed
    if (state.scheduleNodes.length === 0 && rootEl) {
      const flowWrap = rootEl.querySelector('.flow-wrap');
      if (flowWrap && !flowWrap.querySelector('.flow-empty-hint')) {
        const hint = h('div', { class: 'flow-empty-hint' });
        hint.innerHTML = `<div class="flow-empty-hint-inner">${icon('Calendar', '')}<p>No batches added yet. Click "Add Batch Node" to start building your workflow.</p></div>`;
        flowWrap.appendChild(hint);
      }
    }
  }

  // ---- Node card build ----
  function buildNodeCard(node, state) {
    const batch = state.batches.find((b) => b.id === node.data.batchId);
    const status = computeNodeStatus(batch);
    const studentsCount = state.students.filter((s) => batch && s.batchId === batch.id).length;

    const nodeEl = document.createElement('div');
    nodeEl.className = 'flow-node';
    nodeEl.setAttribute('data-node-id', node.id);
    nodeEl.style.transform = `translate(${node.position.x}px, ${node.position.y}px)`;

    let statusClass = '';
    let iconName = 'Calendar';
    let iconClass = '';
    let statusPillHtml = '';
    if (status === 'in-progress') {
      statusClass = 'status-progress';
      iconName = 'Clock';
      iconClass = 'progress';
      statusPillHtml = '<span class="flow-node-status-pill progress">In Progress</span>';
    } else if (status === 'completed') {
      statusClass = 'status-completed';
      iconName = 'CheckCircle2';
      iconClass = 'completed';
      statusPillHtml = '<span class="flow-node-status-pill completed">Completed</span>';
    }

    const card = document.createElement('div');
    card.className = `flow-node-card ${statusClass}`;
    card.innerHTML = `
      <button class="flow-node-delete">${icon('X', '', 'width="12" height="12"')}</button>
      <button class="flow-handle target" title="Connect from here"></button>
      <div class="flow-node-head">
        <div class="flow-node-head-left">
          <h4 class="flow-node-name">${escapeHtml(node.data.name)}</h4>
          ${statusPillHtml}
        </div>
        <div class="flow-node-icon ${iconClass}">${icon(iconName, '')}</div>
      </div>
      <p class="flow-node-subject">${escapeHtml(node.data.subject)}</p>
      <div class="flow-node-meta">
        <div class="flow-node-meta-row">${icon('Clock', '')}<span>${escapeHtml(node.data.time)}</span></div>
        <div class="flow-node-meta-row">${icon('Users', '')}<span>${studentsCount} students</span></div>
      </div>
      <button class="flow-handle source" title="Drag to connect"></button>
    `;
    nodeEl.appendChild(card);

    card.querySelector('.flow-node-delete').addEventListener('click', (e) => {
      e.stopPropagation();
      Store.onNodesChange([{ id: node.id, type: 'remove' }]);
      Store.onEdgesChange(
        Store.getState().scheduleEdges
          .filter((ed) => ed.source === node.id || ed.target === node.id)
          .map((ed) => ({ id: ed.id, type: 'remove' }))
      );
      rebuildEdgesAndNodes();
    });

    card.querySelector('.flow-handle.source').addEventListener('pointerdown', (e) => startConnection(node, e));

    makeNodeDraggable(nodeEl, node);
    nodeEls[node.id] = nodeEl;
    return nodeEl;
  }

  // ---- Viewport transform ----
  function applyTransform() {
    canvasEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    bgEl.style.transform = `translate(${panX}px, ${panY}px)`;
    bgEl.style.backgroundPosition = `${panX}px ${panY}px`;
    bgEl.style.backgroundSize = `${24 * scale}px ${24 * scale}px`;
  }

  function zoomBy(factor, centerX, centerY) {
    const rect = viewportEl.getBoundingClientRect();
    const cx = centerX !== undefined ? centerX - rect.left : rect.width / 2;
    const cy = centerY !== undefined ? centerY - rect.top : rect.height / 2;
    const newScale = clamp(scale * factor, 0.2, 2);
    panX = cx - ((cx - panX) / scale) * newScale;
    panY = cy - ((cy - panY) / scale) * newScale;
    scale = newScale;
    applyTransform();
  }

  function fitView() {
    const state = Store.getState();
    if (state.scheduleNodes.length === 0) { scale = 1; panX = 40; panY = 40; applyTransform(); return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.scheduleNodes.forEach((n) => {
      minX = Math.min(minX, n.position.x);
      minY = Math.min(minY, n.position.y);
      maxX = Math.max(maxX, n.position.x + NODE_WIDTH);
      maxY = Math.max(maxY, n.position.y + NODE_HEIGHT_EST);
    });
    const rect = viewportEl.getBoundingClientRect();
    const contentW = Math.max(maxX - minX, 1);
    const contentH = Math.max(maxY - minY, 1);
    const padding = 60;
    const scaleX = (rect.width - padding * 2) / contentW;
    const scaleY = (rect.height - padding * 2) / contentH;
    scale = clamp(Math.min(scaleX, scaleY, 1.2), 0.2, 2);
    panX = (rect.width - contentW * scale) / 2 - minX * scale;
    panY = (rect.height - contentH * scale) / 2 - minY * scale;
    applyTransform();
  }

  function mountPanZoom() {
    let isPanning = false;
    let lastX = 0, lastY = 0;

    viewportEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.flow-node') || e.target.closest('.flow-controls') || e.target.closest('.flow-panel') || e.target.closest('.flow-edge-delete-btn') || e.target.classList.contains('flow-edge-hit') || e.target.classList.contains('flow-edge-path')) return;
      isPanning = true;
      viewportEl.classList.add('panning');
      lastX = e.clientX;
      lastY = e.clientY;
      viewportEl.setPointerCapture(e.pointerId);
    });
    viewportEl.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      panX += e.clientX - lastX;
      panY += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      applyTransform();
    });
    function endPan(e) {
      isPanning = false;
      viewportEl.classList.remove('panning');
      try { viewportEl.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    viewportEl.addEventListener('pointerup', endPan);
    viewportEl.addEventListener('pointercancel', endPan);

    viewportEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      zoomBy(factor, e.clientX, e.clientY);
    }, { passive: false });
  }

  // ---- Add-node panel ----
  function buildAddPanel(state) {
    const panel = h('div', { class: 'flow-panel' });
    const addBtn = h('button', { class: 'btn btn-primary' });
    addBtn.innerHTML = `${icon('Plus', '')} Add Batch Node`;
    addBtn.addEventListener('click', () => { isAddMenuOpen = !isAddMenuOpen; rerenderAddMenu(); });
    panel.appendChild(addBtn);

    const menuHolder = h('div', { id: 'flow-add-menu-holder' });
    panel.appendChild(menuHolder);
    if (isAddMenuOpen) menuHolder.appendChild(buildAddMenu(state));

    return panel;
  }

  function buildAddMenu(state) {
    const menu = h('div', { class: 'flow-add-menu' });
    const headRow = h('div', { class: 'flow-add-menu-head' });
    headRow.innerHTML = `<h4>Select Batch</h4>`;
    const closeBtn = h('button', {}, icon_dom('X'));
    closeBtn.addEventListener('click', () => { isAddMenuOpen = false; rerenderAddMenu(); });
    headRow.appendChild(closeBtn);
    menu.appendChild(headRow);

    const list = h('div', { class: 'flow-add-menu-list' });
    if (state.batches.length > 0) {
      state.batches.forEach((batch) => {
        const item = h('button', { class: 'flow-add-menu-item' });
        item.innerHTML = `<div class="flow-add-menu-item-name">${escapeHtml(batch.name)}</div><div class="flow-add-menu-item-time">${escapeHtml(batch.time)}</div>`;
        item.addEventListener('click', () => {
          const studentsCount = state.students.filter((s) => s.batchId === batch.id).length;
          const newNode = {
            id: `node_${Date.now()}`,
            type: 'batch',
            position: { x: Math.random() * 300 + 100, y: Math.random() * 300 + 100 },
            data: { batchId: batch.id, name: batch.name, subject: batch.subject, time: batch.time, studentsCount },
          };
          Store.addScheduleNode(newNode);
          isAddMenuOpen = false;
          const freshState = Store.getState();
          const el = buildNodeCard(newNode, freshState);
          canvasEl.appendChild(el);
          const emptyHint = rootEl && rootEl.querySelector('.flow-empty-hint');
          if (emptyHint) emptyHint.remove();
          rerenderAddMenu();
        });
        list.appendChild(item);
      });
    } else {
      list.appendChild(h('div', { class: 'flow-add-menu-empty' }, 'No batches available.'));
    }
    menu.appendChild(list);
    return menu;
  }

  function rerenderAddMenu() {
    if (!rootEl) return;
    const holder = rootEl.querySelector('#flow-add-menu-holder');
    if (!holder) return;
    holder.innerHTML = '';
    if (isAddMenuOpen) holder.appendChild(buildAddMenu(Store.getState()));
  }

  function render() {
    const state = Store.getState();
    nodeEls = {};

    const wrap = h('div', { class: 'view-body schedule-view' });

    const header = h('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;' });
    header.appendChild(h('div', {}, [
      h('h2', { class: 'view-title', style: 'margin-bottom:8px;' }, 'Workflow Schedule'),
      h('p', { class: 'view-subtitle' }, 'Connect batches to create your daily workflow.'),
    ]));
    const clearBtn = h('button', { class: 'btn btn-danger-soft' });
    clearBtn.innerHTML = `${icon('Trash2', '')} Clear Schedule`;
    clearBtn.addEventListener('click', () => {
      Store.clearSchedule();
      rerenderFull();
    });
    header.appendChild(clearBtn);
    wrap.appendChild(header);

    const flowWrap = h('div', { class: 'flow-wrap' });
    viewportEl = h('div', { class: 'flow-viewport' });
    bgEl = h('div', { class: 'flow-bg' });
    canvasEl = h('div', { class: 'flow-canvas' });

    svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgEl.setAttribute('class', 'flow-edges-svg');
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = `<marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="flow-edge-arrow"></path></marker>`;
    svgEl.appendChild(defs);

    canvasEl.appendChild(svgEl);
    viewportEl.appendChild(bgEl);
    viewportEl.appendChild(canvasEl);
    flowWrap.appendChild(viewportEl);

    if (state.scheduleNodes.length === 0) {
      const hint = h('div', { class: 'flow-empty-hint' });
      hint.innerHTML = `<div class="flow-empty-hint-inner">${icon('Calendar', '')}<p>No batches added yet. Click "Add Batch Node" to start building your workflow.</p></div>`;
      flowWrap.appendChild(hint);
    }

    const controls = h('div', { class: 'flow-controls' });
    const zoomInBtn = h('button', { class: 'flow-control-btn', title: 'Zoom in' }, '+');
    zoomInBtn.addEventListener('click', () => zoomBy(1.2));
    const zoomOutBtn = h('button', { class: 'flow-control-btn', title: 'Zoom out' }, '\u2212');
    zoomOutBtn.addEventListener('click', () => zoomBy(0.8));
    const fitBtn = h('button', { class: 'flow-control-btn', title: 'Fit view' }, icon_dom('Calendar'));
    fitBtn.addEventListener('click', () => fitView());
    controls.appendChild(zoomInBtn);
    controls.appendChild(zoomOutBtn);
    controls.appendChild(fitBtn);
    flowWrap.appendChild(controls);

    flowWrap.appendChild(buildAddPanel(state));

    wrap.appendChild(flowWrap);
    rootEl = wrap;

    requestAnimationFrame(() => {
      mountPanZoom();
      state.scheduleNodes.forEach((node) => canvasEl.appendChild(buildNodeCard(node, state)));
      state.scheduleEdges.forEach((edge) => drawEdge(edge, state));
      fitView();
      applyTransform();
    });

    if (statusTickInterval) clearInterval(statusTickInterval);
    statusTickInterval = setInterval(() => {
      const freshState = Store.getState();
      Object.keys(nodeEls).forEach((id) => {
        const node = freshState.scheduleNodes.find((n) => n.id === id);
        if (!node) return;
        const oldEl = nodeEls[id];
        const newEl = buildNodeCard(node, freshState);
        oldEl.replaceWith(newEl);
      });
    }, 60000);
    App.registerCleanup(() => {
      if (statusTickInterval) { clearInterval(statusTickInterval); statusTickInterval = null; }
    });

    return wrap;
  }

  return { render };
})();

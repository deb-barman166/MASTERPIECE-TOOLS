   View: Free Time — port of src/components/FreeTime.tsx
   ========================================================================== */

const ViewFreeTime = (function () {
  function parseTimeToMinutes(timeStr) {
    const parts = timeStr.split(' ');
    const time = parts[0], modifier = parts[1];
    let timeParts = time.split(':').map(Number);
    let hours = timeParts[0], minutes = timeParts[1];
    if (hours === 12) {
      hours = modifier === 'AM' ? 0 : 12;
    } else if (modifier === 'PM') {
      hours += 12;
    }
    return hours * 60 + minutes;
  }

  function formatMinutesToTime(minutes) {
    const hh = Math.floor(minutes / 60);
    const mm = minutes % 60;
    const modifier = hh >= 12 ? 'PM' : 'AM';
    const displayH = hh % 12 || 12;
    const displayM = String(mm).padStart(2, '0');
    return `${displayH}:${displayM} ${modifier}`;
  }

  function computeAutoFreeSlots(batches, freeTimeStart, freeTimeEnd) {
    const WORK_START = parseTimeToMinutes(freeTimeStart || '08:00');
    const WORK_END = parseTimeToMinutes(freeTimeEnd || '20:00');

    const slotsByDay = { Mon: [], Tue: [], Wed: [], Thu: [], Fri: [], Sat: [], Sun: [] };

    batches.forEach((batch) => {
      try {
        if (batch.dayTimes) {
          batch.days.forEach((day) => {
            const times = batch.dayTimes[day];
            if (times && times.start && times.end) {
              const startMin = parseTimeToMinutes(times.start);
              const endMin = parseTimeToMinutes(times.end);
              slotsByDay[day].push({ start: startMin, end: endMin });
            }
          });
        } else {
          const parts = batch.time.split(' - ');
          const startStr = parts[0], endStr = parts[1];
          if (!startStr || !endStr) return;
          const startMin = parseTimeToMinutes(startStr);
          const endMin = parseTimeToMinutes(endStr);
          batch.days.forEach((day) => {
            slotsByDay[day].push({ start: startMin, end: endMin });
          });
        }
      } catch (e) {
        // Ignore invalid time formats
      }
    });

    const freeSlots = { Mon: [], Tue: [], Wed: [], Thu: [], Fri: [], Sat: [], Sun: [] };

    DAYS_OF_WEEK.forEach((day) => {
      const busySlots = slotsByDay[day].slice().sort((a, b) => a.start - b.start);

      if (busySlots.length === 0) {
        freeSlots[day].push({ startTime: 'Full Day', endTime: 'Free', isFullDay: true });
        return;
      }

      const mergedBusy = [];
      let current = Object.assign({}, busySlots[0]);
      for (let i = 1; i < busySlots.length; i++) {
        if (busySlots[i].start <= current.end) {
          current.end = Math.max(current.end, busySlots[i].end);
        } else {
          mergedBusy.push(current);
          current = Object.assign({}, busySlots[i]);
        }
      }
      mergedBusy.push(current);

      let currentTime = WORK_START;
      mergedBusy.forEach((busy) => {
        if (busy.start > currentTime) {
          freeSlots[day].push({ startTime: formatMinutesToTime(currentTime), endTime: formatMinutesToTime(busy.start) });
        }
        currentTime = Math.max(currentTime, busy.end);
      });

      if (currentTime < WORK_END) {
        freeSlots[day].push({ startTime: formatMinutesToTime(currentTime), endTime: formatMinutesToTime(WORK_END) });
      }
    });

    return freeSlots;
  }

  function render() {
    const state = Store.getState();
    const { batches, freeTimeStart, freeTimeEnd } = state;
    const autoFreeSlots = computeAutoFreeSlots(batches, freeTimeStart, freeTimeEnd);

    const wrap = h('div', { class: 'view-body' });

    const header = h('div', {});
    header.appendChild(h('h2', { class: 'view-title' }, 'Free Time Tracker'));
    const rangeText = `Automatically calculated free slots between ${formatMinutesToTime(parseTimeToMinutes(freeTimeStart || '08:00'))} and ${formatMinutesToTime(parseTimeToMinutes(freeTimeEnd || '20:00'))}.`;
    header.appendChild(h('p', { class: 'view-subtitle' }, rangeText));
    wrap.appendChild(header);

    const grid = h('div', { class: 'freetime-grid' });
    DAYS_OF_WEEK.forEach((day) => {
      const daySlots = autoFreeSlots[day];
      const col = h('div', { class: 'freetime-day-col' });
      col.appendChild(h('div', { class: 'freetime-day-header' }, day));
      const body = h('div', { class: 'freetime-day-body' });

      if (daySlots.length > 0) {
        daySlots.forEach((slot) => {
          const slotEl = h('div', { class: 'freetime-slot' });
          if (slot.isFullDay) {
            slotEl.classList.add('freetime-slot-fullday');
            slotEl.innerHTML = `${icon('Clock', '')}<span>Full Day Free</span>`;
            const bookFullDayBtn = h('button', { class: 'btn btn-ghost-sm', style: 'width:100%;margin-top:8px;justify-content:center;' }, 'Book This Slot');
            bookFullDayBtn.addEventListener('click', () => {
              _pendingBatchPrefill = { day, startTime: freeTimeStart || '08:00', endTime: freeTimeEnd || '20:00' };
              App.setActiveTab('batches');
            });
            slotEl.appendChild(bookFullDayBtn);
          } else {
            slotEl.innerHTML = `
              <div class="freetime-slot-time-row">${icon('Clock', '')}<span>${escapeHtml(slot.startTime)}</span></div>
              <div class="freetime-slot-sep"><div class="freetime-slot-sep-bar"><div></div></div><span>to</span></div>
              <div class="freetime-slot-time-row">${icon('Clock', '')}<span>${escapeHtml(slot.endTime)}</span></div>
              <p class="freetime-slot-avail">Available</p>
            `;
            const bookBtn = h('button', { class: 'btn btn-ghost-sm', style: 'width:100%;margin-top:8px;justify-content:center;' }, 'Book This Slot');
            bookBtn.addEventListener('click', () => {
              _pendingBatchPrefill = { day, startTime: parseTime12hTo24h(slot.startTime), endTime: parseTime12hTo24h(slot.endTime) };
              App.setActiveTab('batches');
            });
            slotEl.appendChild(bookBtn);
          }
          body.appendChild(slotEl);
        });
      } else {
        body.appendChild(h('div', { class: 'freetime-empty' }, 'Fully Booked'));
      }
      col.appendChild(body);
      grid.appendChild(col);
    });
    wrap.appendChild(grid);

    return wrap;
  }

  return { render };
})();


// ---- 18-view-settings.js ----
/* ==========================================================================
   View: Settings — port of src/components/Settings.tsx
   ========================================================================== */

const ViewSettings = (function () {
  let showDeleteModal = false;
  let deleteConfirmation = '';
  let rootEl = null;

  function rerender() {
    if (!rootEl) return;
    const old = rootEl; // capture BEFORE render() runs, since render() reassigns rootEl itself
    const fresh = render();
    old.replaceWith(fresh);
  }

  // ---- Export helpers (see global exportToCSV/exportToExcel near the top of the script) ----

  function exportBatches(format, state) {
    const data = state.batches.map((batch) => {
      const batchStudents = state.students.filter((s) => s.batchId === batch.id);
      return {
        'Batch Name': batch.name,
        'Subject': batch.subject,
        'Days': batch.days.join(', '),
        'Time': batch.time,
        'Total Students': batchStudents.length,
      };
    });
    if (data.length === 0) { alert('No batch data to export.'); return; }
    if (format === 'csv') exportToCSV(data, 'Batches_Data');
    else exportToExcel(data, 'Batches_Data');
  }

  function exportFees(format, state) {
    const data = state.fees.map((fee) => {
      const student = state.students.find((s) => s.id === fee.studentId);
      const batch = state.batches.find((b) => b.id === (student && student.batchId));
      return {
        'Student Name': (student && student.name) || 'Unknown',
        'Phone': (student && student.phone) || 'N/A',
        'Batch Name': (batch && batch.name) || 'Unassigned',
        'Month': fee.month,
        'Amount': `${state.currency}${fee.amount}`,
        'Status': fee.status,
        'Paid Date': fee.paidDate ? new Date(fee.paidDate).toLocaleDateString() : 'N/A',
      };
    });
    if (data.length === 0) { alert('No fee data to export.'); return; }
    if (format === 'csv') exportToCSV(data, 'Fees_Data');
    else exportToExcel(data, 'Fees_Data');
  }

  function exportAllData(state) {
    const wb = XLSX.utils.book_new();

    const batchesData = state.batches.map((batch) => {
      const batchStudents = state.students.filter((s) => s.batchId === batch.id);
      return { 'Batch Name': batch.name, 'Subject': batch.subject, 'Days': batch.days.join(', '), 'Time': batch.time, 'Total Students': batchStudents.length };
    });
    if (batchesData.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(batchesData), 'Batches');

    const studentsData = state.students.map((student) => {
      const batch = state.batches.find((b) => b.id === student.batchId);
      return { 'Student Name': student.name, 'Phone': student.phone, 'Batch Name': (batch && batch.name) || 'Unassigned', 'Join Date': student.joinDate, 'Monthly Fee': `${state.currency}${student.feeAmount}` };
    });
    if (studentsData.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(studentsData), 'Students');

    const feesData = state.fees.map((fee) => {
      const student = state.students.find((s) => s.id === fee.studentId);
      const batch = state.batches.find((b) => b.id === (student && student.batchId));
      return {
        'Student Name': (student && student.name) || 'Unknown',
        'Phone': (student && student.phone) || 'N/A',
        'Batch Name': (batch && batch.name) || 'Unassigned',
        'Month': fee.month,
        'Amount': `${state.currency}${fee.amount}`,
        'Status': fee.status,
        'Paid Date': fee.paidDate ? new Date(fee.paidDate).toLocaleDateString() : 'N/A',
      };
    });
    if (feesData.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(feesData), 'Fees');

    const freeSlotsData = state.freeSlots.map((slot) => ({ 'Day': slot.day, 'Start Time': slot.startTime, 'End Time': slot.endTime, 'Note': slot.note || '' }));
    if (freeSlotsData.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(freeSlotsData), 'Free Time');

    if (wb.SheetNames.length === 0) { alert('No data available to export.'); return; }
    XLSX.writeFile(wb, 'TutorSync_All_Data.xlsx');
  }

  // ---- JSON backup / restore: a true data round-trip, distinct from the
  // human-readable Excel export above (which is for sharing/printing, not restoring). ----
  function exportJSONBackup(state) {
    const backupData = {
      batches: state.batches, students: state.students, fees: state.fees, freeSlots: state.freeSlots,
      attendance: state.attendance, scheduleNodes: state.scheduleNodes, scheduleEdges: state.scheduleEdges,
      tests: state.tests, homework: state.homework, studentNotes: state.studentNotes, communicationLog: state.communicationLog,
      syllabusEntries: state.syllabusEntries,
      teacherName: state.teacherName, currency: state.currency, autoGenerateFees: state.autoGenerateFees,
      dashboardTimeStart: state.dashboardTimeStart, dashboardTimeEnd: state.dashboardTimeEnd,
      freeTimeStart: state.freeTimeStart, freeTimeEnd: state.freeTimeEnd,
      lowAttendanceThreshold: state.lowAttendanceThreshold, feeOverdueDays: state.feeOverdueDays,
      _exportedAt: new Date().toISOString(),
      _exportVersion: 1,
    };
    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `TutorSync_Backup_${todayYMD()}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    Store.updateSettings({ lastBackupDate: new Date().toISOString() });
    rerender();
  }

  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      let parsed;
      try {
        parsed = JSON.parse(e.target.result);
      } catch (err) {
        alert('This file is not valid TutorSync backup JSON. Please choose a file created with "Download Backup" above.');
        return;
      }
      if (!parsed || typeof parsed !== 'object' || (!Array.isArray(parsed.students) && !Array.isArray(parsed.batches))) {
        alert('This file does not look like a TutorSync backup — no batches or students found in it.');
        return;
      }
      const existingCount = Store.getState().students.length + Store.getState().batches.length;
      const warning = existingCount > 0
        ? 'Importing will REPLACE your current batches, students, fees, attendance, tests, homework, notes, and schedule with the contents of this backup file. This cannot be undone. Continue?'
        : 'Import this backup into TutorSync?';
      if (!confirm(warning)) return;
      Store.importData(parsed);
      rerender();
      alert('Backup imported successfully.');
    };
    reader.onerror = () => alert('Could not read that file. Please try again.');
    reader.readAsText(file);
  }

  function buildDeleteModal() {
    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { showDeleteModal = false; rerender(); });
    const box = h('div', { class: 'modal-box modal-sm', style: 'border-color:rgba(239,68,68,0.3);' });

    const headRow = h('div', { style: 'display:flex;align-items:center;gap:12px;color:#f87171;margin-bottom:16px;' });
    headRow.innerHTML = `${icon('Trash2', '', 'width="24" height="24"')}<h2 style="font-size:20px;font-weight:700;">Delete All Data</h2>`;
    box.appendChild(headRow);

    const warnP = h('p', { style: 'color:var(--color-text-muted);margin-bottom:16px;' });
    warnP.innerHTML = `This action is <span style="color:white;font-weight:700;">irreversible</span>. It will permanently delete all your batches, students, fee records, and schedules.`;
    box.appendChild(warnP);

    const confirmField = h('div', { style: 'margin-bottom:24px;' });
    confirmField.innerHTML = `<label class="field-label">To confirm, type <span style="color:white;font-weight:700;">DELETED</span> below:</label>`;
    const confirmInput = h('input', { type: 'text', class: 'text-input', placeholder: 'Type DELETED', style: 'border-color:rgba(239,68,68,0.3);' });
    confirmInput.value = deleteConfirmation;
    const deleteAllBtn = h('button', { class: 'btn btn-flex1', style: 'padding:12px 0;' }, 'Delete All');
    function refreshDeleteBtnState() {
      const isMatch = deleteConfirmation === 'DELETED';
      deleteAllBtn.disabled = !isMatch;
      deleteAllBtn.style.background = isMatch ? '#ef4444' : 'rgba(239,68,68,0.2)';
      deleteAllBtn.style.color = isMatch ? 'white' : 'rgba(248,113,113,0.5)';
      deleteAllBtn.style.cursor = isMatch ? 'pointer' : 'not-allowed';
    }
    confirmInput.addEventListener('input', () => { deleteConfirmation = confirmInput.value; refreshDeleteBtnState(); });
    confirmField.appendChild(confirmInput);
    box.appendChild(confirmField);

    const actions = h('div', { style: 'display:flex;gap:12px;' });
    const cancelBtn = h('button', { class: 'btn btn-ghost-sm btn-flex1', style: 'padding:12px 0;' }, 'Cancel');
    cancelBtn.addEventListener('click', () => { showDeleteModal = false; rerender(); });
    deleteAllBtn.addEventListener('click', () => {
      if (deleteConfirmation === 'DELETED') {
        Store.clearAllData();
        showDeleteModal = false;
        rerender();
      }
    });
    refreshDeleteBtnState();
    actions.appendChild(cancelBtn);
    actions.appendChild(deleteAllBtn);
    box.appendChild(actions);

    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  function render() {
    const state = Store.getState();
    const wrap = h('div', { class: 'view-body' });

    wrap.appendChild(h('div', {}, [
      h('h2', { class: 'view-title' }, 'Settings'),
      h('p', { class: 'view-subtitle' }, 'Manage your profile and app preferences.'),
    ]));

    const grid = h('div', { class: 'settings-grid' });
    grid.appendChild(buildProfileCard(state));
    grid.appendChild(buildDataOverviewCard(state));
    grid.appendChild(buildExportCard(state));
    grid.appendChild(buildExpensesCard(state));
    grid.appendChild(buildBroadcastCard(state));
    grid.appendChild(buildAlertSettingsCard(state));
    wrap.appendChild(grid);

    rootEl = wrap;
    clearModalPortal();
    if (showDeleteModal) mountModal(buildDeleteModal());

    return wrap;
  }

  return { render };
})();

// ---- Quick Add FAB (new) ----------------------------------------------
// A single floating "+" button, present on every tab, that opens a small
// menu of the most common daily add actions and jumps straight to the
// relevant tab. It doesn't duplicate each view's own "Add" modal (those
// stay exactly as they were) — it just saves the trip through the sidebar.
const QuickAddFAB = (function () {
  let menuOpen = false;

  function closeMenu() {
    menuOpen = false;
    const menu = document.getElementById('quick-add-menu');
    if (menu) menu.remove();
    document.removeEventListener('click', onDocClick, true);
  }

  function onDocClick(e) {
    const fab = document.getElementById('quick-add-fab');
    const menu = document.getElementById('quick-add-menu');
    if (menu && !menu.contains(e.target) && e.target !== fab && !fab.contains(e.target)) {
      closeMenu();
    }
  }

  function openMenu(container) {
    menuOpen = true;
    const actions = [
      { label: 'Add Student', icon: 'UserPlus', tab: 'students' },
      { label: 'Mark Attendance', icon: 'CheckSquare', tab: 'attendance' },
      { label: 'Add Fee Record', icon: 'Coins', tab: 'fees' },
      { label: 'Add Test', icon: 'GraduationCap', tab: 'academics' },
      { label: 'Add Batch', icon: 'BookOpen', tab: 'batches' },
      { label: 'Add Expense', icon: 'Wallet', tab: 'settings', hint: 'expenses' },
    ];
    const menu = h('div', { id: 'quick-add-menu', class: 'quick-add-menu' });
    actions.forEach((a) => {
      const item = h('button', { class: 'quick-add-menu-item' });
      item.innerHTML = `${icon(a.icon, '')}<span>${escapeHtml(a.label)}</span>`;
      item.addEventListener('click', () => {
        closeMenu();
        App.setActiveTab(a.tab);
        if (a.hint === 'expenses') {
          setTimeout(() => {
            const anchor = document.getElementById('settings-expenses-anchor');
            if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 150);
        }
      });
      menu.appendChild(item);
    });
    container.appendChild(menu);
    setTimeout(() => document.addEventListener('click', onDocClick, true), 0);
  }

  function mount() {
    if (document.getElementById('quick-add-fab')) return; // already mounted, persists across tab renders
    const wrap = h('div', { class: 'quick-add-fab-wrap' });
    const fab = h('button', { id: 'quick-add-fab', class: 'quick-add-fab', title: 'Quick add' }, icon_dom('Plus'));
    fab.addEventListener('click', (e) => {
      e.stopPropagation();
      if (menuOpen) { closeMenu(); return; }
      openMenu(wrap);
    });
    wrap.appendChild(fab);
    document.body.appendChild(wrap);
  }

  return { mount };
})();

// ---- Keyboard Shortcuts (new) ------------------------------------------
// Lightweight, non-intrusive: only fires when the person isn't typing in a
// text field, textarea, or contentEditable element.
const KeyboardShortcuts = (function () {
  function isTypingContext(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
  }

  function handleKeydown(e) {
    if (isTypingContext(document.activeElement)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    const tabByDigit = {
      '1': 'dashboard', '2': 'batches', '3': 'students', '4': 'fees',
      '5': 'attendance', '6': 'academics', '7': 'schedule', '8': 'freetime', '9': 'settings',
    };
    if (tabByDigit[e.key]) {
      App.setActiveTab(tabByDigit[e.key]);
      return;
    }
    if (e.key === '?' || (e.key === '/' && e.shiftKey)) {
      Toast.show({ message: 'Shortcuts: 1-9 switch tabs • click + button to quick-add' });
    }
  }

  function mount() {
    document.addEventListener('keydown', handleKeydown);
  }

  return { mount };
})();

const App = (function () {
  let activeTab = 'dashboard';
  let isLoading = true;
  const root = document.getElementById('root');

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'batches', label: 'Batches', icon: 'BookOpen' },
    { id: 'students', label: 'Students', icon: 'Users' },
    { id: 'fees', label: 'Fees', icon: 'Coins' },
    { id: 'attendance', label: 'Attendance', icon: 'CheckSquare' },
    { id: 'academics', label: 'Academics', icon: 'GraduationCap' },
    { id: 'schedule', label: 'Schedule', icon: 'Calendar' },
    { id: 'freetime', label: 'Free Time', icon: 'Clock' },
    { id: 'settings', label: 'Settings', icon: 'Settings' },
  ];

  function setActiveTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;
    clearModalPortal();
    render();
  }

  function renderLoadingScreen() {
    root.innerHTML = `
      <div class="loading-screen">
        <div class="loading-badge">T</div>
        <h1 class="loading-title">TutorSync</h1>
        <p class="loading-sub">Loading Workspace...</p>
      </div>
    `;
  }

  function renderContentForTab(tab) {
    switch (tab) {
      case 'dashboard': return ViewDashboard.render();
      case 'batches': return ViewBatches.render();
      case 'students': return ViewStudents.render();
      case 'fees': return ViewFees.render();
      case 'attendance': return ViewAttendance.render();
      case 'academics': return ViewAcademics.render();
      case 'schedule': return ViewSchedule.render();
      case 'freetime': return ViewFreeTime.render();
      case 'settings': return ViewSettings.render();
      default: return ViewDashboard.render();
    }
  }

  // Views can register a cleanup function (e.g. to remove window listeners,
  // intervals) that gets called right before the next render swaps content out.
  let currentCleanup = null;
  function registerCleanup(fn) {
    currentCleanup = fn;
  }

  function render() {
    if (currentCleanup) {
      try { currentCleanup(); } catch (e) { /* no-op */ }
      currentCleanup = null;
    }

    if (isLoading) {
      renderLoadingScreen();
      return;
    }

    const state = Store.getState();

    // Same overdue/low-attendance logic as the Dashboard alerts panel, kept
    // lightweight here since it only needs counts, not full row details.
    const navNow = new Date();
    const navOverdueDays = state.feeOverdueDays || 7;
    const navCurrentMonthStr = formatYM(navNow);
    const navOverdueFeeCount = state.fees.filter((f) => {
      if (f.status !== 'Pending' || f.month > navCurrentMonthStr) return false;
      const parts = f.month.split('-').map(Number);
      const dueCutoff = new Date(parts[0], parts[1], navOverdueDays - 1);
      return navNow >= dueCutoff;
    }).length;
    const navLowAttendanceThreshold = state.lowAttendanceThreshold || 75;
    const navLowAttendanceCount = state.students.filter((student) => {
      const studentAttendance = state.attendance.filter((a) => a.studentId === student.id);
      const presentCount = studentAttendance.filter((a) => a.status === 'Present').length;
      const lateCount = studentAttendance.filter((a) => a.status === 'Late').length;
      const absentCount = studentAttendance.filter((a) => a.status === 'Absent').length;
      const total = presentCount + lateCount + absentCount;
      const pct = total > 0 ? Math.round(((presentCount + lateCount) / total) * 100) : null;
      return total >= 3 && pct !== null && pct < navLowAttendanceThreshold;
    }).length;
    const navBadges = { fees: navOverdueFeeCount, attendance: navLowAttendanceCount };

    root.innerHTML = `
      <div class="app-shell">
        ${Sidebar.template(activeTab, state.teacherName, navBadges)}
        <main class="app-main" id="app-main">
          <div class="app-main-glow"></div>
          <div class="app-content" id="app-content"></div>
        </main>
      </div>
    `;

    Sidebar.mount(setActiveTab);

    const contentEl = document.getElementById('app-content');
    contentEl.appendChild(renderContentForTab(activeTab));

    // Re-apply fade-in animation class for the tab transition
    contentEl.classList.add('tab-fade-in');
  }

  function init() {
    renderLoadingScreen();
    setTimeout(() => {
      isLoading = false;
      render();
      QuickAddFAB.mount();
      KeyboardShortcuts.mount();
    }, 1500);

    Store.subscribe(() => {
      // Only auto re-render on external state changes if we're not mid-interaction;
      // individual views call render() themselves after their own store mutations
      // to keep focus/scroll position control precise. This subscription exists
      // primarily so the Sidebar's teacher-name/profile badge and any
      // cross-view derived numbers stay correct.
    });
  }

  return { init, setActiveTab, registerCleanup, NAV_ITEMS, get activeTab() { return activeTab; } };
})();

document.addEventListener('DOMContentLoaded', function () {
  App.init();
});

</script>

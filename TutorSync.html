/* ==========================================================================
   Widget: Custom Date Picker — port of src/components/ui/CustomDatePicker.tsx
   Usage: Widgets.customDatePicker({ value, className, onChange })
   ========================================================================== */

(function () {
  const DAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

  Widgets.customDatePicker = function (opts) {
    let value = opts.value || '';
    const className = opts.className || '';
    const onChange = opts.onChange;

    const initialDate = value ? new Date(value) : new Date();
    const validInitialDate = isNaN(initialDate.getTime()) ? new Date() : initialDate;
    let currentMonth = validInitialDate.getMonth();
    let currentYear = validInitialDate.getFullYear();

    const container = h('div', { class: 'csel', style: 'width:100%;' });
    const trigger = h('div', { class: `cdate-trigger neon-input ${className}`, tabindex: '0' });
    container.appendChild(trigger);

    let isOpen = false;
    let dropdownEl = null;
    let resizeHandler = null, scrollHandler = null, outsideClickHandler = null;

    function renderTrigger() {
      trigger.classList.toggle('active', isOpen);
      trigger.innerHTML = `
        ${icon('Calendar', '')}
        <span class="${value ? 'has-value' : ''}">${escapeHtml(value || 'Select Date')}</span>
      `;
    }

    function updatePosition() {
      if (!dropdownEl) return;
      const rect = trigger.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const showAbove = spaceBelow < 350 && rect.top > 350;
      let left = rect.left;
      const dropdownWidth = 288;
      if (left + dropdownWidth > window.innerWidth - 16) left = window.innerWidth - dropdownWidth - 16;
      if (left < 16) left = 16;
      dropdownEl.style.left = left + 'px';
      if (showAbove) {
        dropdownEl.style.top = 'auto';
        dropdownEl.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      } else {
        dropdownEl.style.top = (rect.bottom + 8) + 'px';
        dropdownEl.style.bottom = 'auto';
      }
    }

    function renderCalendar() {
      const daysInMonthCount = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const todayStr = todayYMD();

      let daysHtml = '';
      for (let i = 0; i < firstDay; i++) daysHtml += `<div class="cdate-day-empty"></div>`;
      for (let d = 1; d <= daysInMonthCount; d++) {
        const dateStr = `${currentYear}-${pad2(currentMonth + 1)}-${pad2(d)}`;
        const isSelected = value === dateStr;
        const isToday = todayStr === dateStr;
        daysHtml += `<button type="button" class="cdate-day ${isSelected ? 'selected' : (isToday ? 'today' : '')}" data-day="${d}">${d}</button>`;
      }

      dropdownEl.innerHTML = `
        <div class="cdate-header">
          <button type="button" class="cdate-nav-btn" id="cdate-prev">${icon('ChevronLeft', '')}</button>
          <div class="cdate-title">${MONTH_NAMES[currentMonth]} ${currentYear}</div>
          <button type="button" class="cdate-nav-btn" id="cdate-next">${icon('ChevronRight', '')}</button>
        </div>
        <div class="cdate-dow-row">${DAYS.map((d) => `<div class="cdate-dow-cell">${d}</div>`).join('')}</div>
        <div class="cdate-days-grid">${daysHtml}</div>
      `;

      dropdownEl.querySelector('#cdate-prev').addEventListener('click', () => {
        if (currentMonth === 0) { currentMonth = 11; currentYear -= 1; } else { currentMonth -= 1; }
        renderCalendar();
      });
      dropdownEl.querySelector('#cdate-next').addEventListener('click', () => {
        if (currentMonth === 11) { currentMonth = 0; currentYear += 1; } else { currentMonth += 1; }
        renderCalendar();
      });
      dropdownEl.querySelectorAll('.cdate-day').forEach((btn) => {
        btn.addEventListener('click', () => {
          const day = parseInt(btn.getAttribute('data-day'), 10);
          value = `${currentYear}-${pad2(currentMonth + 1)}-${pad2(day)}`;
          renderTrigger();
          closeDropdown();
          if (onChange) onChange(value);
        });
      });
    }

    function openDropdown() {
      Widgets.closeAnyOpenDropdown();
      isOpen = true;
      renderTrigger();
      dropdownEl = h('div', { class: 'cdate-dropdown' });
      document.body.appendChild(dropdownEl);
      renderCalendar();
      updatePosition();
      resizeHandler = () => updatePosition();
      scrollHandler = () => updatePosition();
      window.addEventListener('resize', resizeHandler);
      window.addEventListener('scroll', scrollHandler, true);
      outsideClickHandler = (e) => {
        if (!container.contains(e.target) && dropdownEl && !dropdownEl.contains(e.target)) closeDropdown();
      };
      setTimeout(() => document.addEventListener('mousedown', outsideClickHandler), 0);
      Widgets._setOpenCloserSet(closeDropdown);
    }

    function closeDropdown() {
      isOpen = false;
      renderTrigger();
      if (dropdownEl && dropdownEl.parentNode) dropdownEl.parentNode.removeChild(dropdownEl);
      dropdownEl = null;
      if (resizeHandler) window.removeEventListener('resize', resizeHandler);
      if (scrollHandler) window.removeEventListener('scroll', scrollHandler, true);
      if (outsideClickHandler) document.removeEventListener('mousedown', outsideClickHandler);
      resizeHandler = scrollHandler = outsideClickHandler = null;
      if (Widgets._setOpenCloser === closeDropdown) Widgets._setOpenCloserSet(null);
    }

    trigger.addEventListener('click', () => {
      if (isOpen) closeDropdown(); else openDropdown();
    });

    renderTrigger();
    container.setValue = function (v) { value = v; renderTrigger(); };
    return container;
  };
})();

    const trigger = h('div', { class: `cdate-trigger neon-input ${className}`, tabindex: '0' });
    container.appendChild(trigger);

    let isOpen = false;
    let dropdownEl = null;
    let resizeHandler = null, scrollHandler = null, outsideClickHandler = null;

    function renderTrigger() {
      trigger.classList.toggle('active', isOpen);
      trigger.innerHTML = `
        ${icon('Calendar', '')}
        <span class="${value ? 'has-value' : ''}">${escapeHtml(value || 'Select Month')}</span>
      `;
    }

    function updatePosition() {
      if (!dropdownEl) return;
      const rect = trigger.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const showAbove = spaceBelow < 250 && rect.top > 250;
      let left = rect.left;
      const dropdownWidth = 256;
      if (left + dropdownWidth > window.innerWidth - 16) left = window.innerWidth - dropdownWidth - 16;
      if (left < 16) left = 16;
      dropdownEl.style.left = left + 'px';
      if (showAbove) {
        dropdownEl.style.top = 'auto';
        dropdownEl.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      } else {
        dropdownEl.style.top = (rect.bottom + 8) + 'px';
        dropdownEl.style.bottom = 'auto';
      }
    }

    function renderCalendar() {
      let monthsHtml = '';
      MONTH_NAMES_SHORT.forEach((m, index) => {
        const dateStr = `${currentYear}-${pad2(index + 1)}`;
        const isSelected = value === dateStr;
        monthsHtml += `<button type="button" class="cmonth-cell ${isSelected ? 'selected' : ''}" data-month="${index}">${m}</button>`;
      });

      dropdownEl.innerHTML = `
        <div class="cdate-header">
          <button type="button" class="cdate-nav-btn" id="cmonth-prev">${icon('ChevronLeft', '')}</button>
          <div class="cdate-title lg">${currentYear}</div>
          <button type="button" class="cdate-nav-btn" id="cmonth-next">${icon('ChevronRight', '')}</button>
        </div>
        <div class="cmonth-grid">${monthsHtml}</div>
      `;

      dropdownEl.querySelector('#cmonth-prev').addEventListener('click', () => { currentYear -= 1; renderCalendar(); });
      dropdownEl.querySelector('#cmonth-next').addEventListener('click', () => { currentYear += 1; renderCalendar(); });
      dropdownEl.querySelectorAll('.cmonth-cell').forEach((btn) => {
        btn.addEventListener('click', () => {
          const monthIndex = parseInt(btn.getAttribute('data-month'), 10);
          value = `${currentYear}-${pad2(monthIndex + 1)}`;
          renderTrigger();
          closeDropdown();
          if (onChange) onChange(value);
        });
      });
    }

    function openDropdown() {
      Widgets.closeAnyOpenDropdown();
      isOpen = true;
      renderTrigger();
      dropdownEl = h('div', { class: 'cdate-dropdown month-picker' });
      document.body.appendChild(dropdownEl);
      renderCalendar();
      updatePosition();
      resizeHandler = () => updatePosition();
      scrollHandler = () => updatePosition();
      window.addEventListener('resize', resizeHandler);
      window.addEventListener('scroll', scrollHandler, true);
      outsideClickHandler = (e) => {
        if (!container.contains(e.target) && dropdownEl && !dropdownEl.contains(e.target)) closeDropdown();
      };
      setTimeout(() => document.addEventListener('mousedown', outsideClickHandler), 0);
      Widgets._setOpenCloserSet(closeDropdown);
    }

    function closeDropdown() {
      isOpen = false;
      renderTrigger();
      if (dropdownEl && dropdownEl.parentNode) dropdownEl.parentNode.removeChild(dropdownEl);
      dropdownEl = null;
      if (resizeHandler) window.removeEventListener('resize', resizeHandler);
      if (scrollHandler) window.removeEventListener('scroll', scrollHandler, true);
      if (outsideClickHandler) document.removeEventListener('mousedown', outsideClickHandler);
      resizeHandler = scrollHandler = outsideClickHandler = null;
      if (Widgets._setOpenCloser === closeDropdown) Widgets._setOpenCloserSet(null);
    }

    trigger.addEventListener('click', () => {
      if (isOpen) closeDropdown(); else openDropdown();
    });

    renderTrigger();
    container.setValue = function (v) { value = v; renderTrigger(); };
    return container;
  };
})();

/* ==========================================================================
   Widget: Custom Time Input — port of src/components/ui/CustomTimeInput.tsx
   Usage: Widgets.customTimeInput({ value, className, required, onChange })
   value/onChange use 24-hour "HH:MM" format.
   ========================================================================== */

(function () {
  Widgets.customTimeInput = function (opts) {
    let value = opts.value || '';
    const className = opts.className || '';
    const required = !!opts.required;
    const onChange = opts.onChange;

    let localTime = '';
    let ampm = 'AM';
    let error = '';
    let isOpen = false;

    function syncFromValue() {
      if (value) {
        const parts = value.split(':');
        const hh = parts[0], m = parts[1];
        let hours = parseInt(hh, 10);
        const isPM = hours >= 12;
        if (hours === 0) hours = 12;
        else if (hours > 12) hours -= 12;
        localTime = `${pad2(hours)}:${m || '00'}`;
        ampm = isPM ? 'PM' : 'AM';
        error = '';
      } else {
        localTime = '';
        ampm = 'AM';
        error = '';
      }
    }
    syncFromValue();

    const container = h('div', { class: 'ctime-wrap' });
    const box = h('div', { class: `ctime-box neon-input ${className}` });
    const input = h('input', { type: 'text', class: 'ctime-input', placeholder: '12:00' });
    if (required) input.setAttribute('required', 'required');
    const ampmBtn = h('div', { class: 'ctime-ampm' });
    const errorMsg = h('div', { class: 'ctime-error-msg', style: 'display:none;' });

    box.appendChild(input);
    box.appendChild(ampmBtn);
    container.appendChild(box);
    container.appendChild(errorMsg);

    let dropdownEl = null;
    let resizeHandler = null, scrollHandler = null, outsideClickHandler = null;

    function renderState() {
      input.value = localTime;
      box.classList.toggle('error', !!error);
      input.classList.toggle('error', !!error);
      ampmBtn.innerHTML = `<span>${ampm}</span>${icon('ChevronDown', '')}`;
      if (error) {
        errorMsg.textContent = error;
        errorMsg.style.display = 'block';
      } else {
        errorMsg.style.display = 'none';
      }
    }

    function updateValue(timeStr, period) {
      if (!timeStr || timeStr.length < 5) return;
      const parts = timeStr.split(':');
      let hours = parseInt(parts[0], 10);
      const m = parts[1];
      if (period === 'PM' && hours < 12) hours += 12;
      if (period === 'AM' && hours === 12) hours = 0;
      const formatted24h = `${pad2(hours)}:${m}`;
      value = formatted24h;
      if (onChange) onChange(formatted24h);
    }

    input.addEventListener('input', () => {
      let val = input.value.replace(/[^0-9:]/g, '');
      if (val.length === 2 && val.indexOf(':') === -1 && localTime.length < val.length) {
        val += ':';
      }
      if (val.length > 5) val = val.slice(0, 5);

      const prevLen = localTime.length;
      localTime = val;
      error = '';

      if (val.length === 5) {
        const parts = val.split(':');
        const hours = parseInt(parts[0], 10);
        const minutes = parseInt(parts[1], 10);
        if (isNaN(hours) || isNaN(minutes) || hours > 12 || hours === 0 || minutes > 59) {
          error = 'Invalid time';
        } else {
          updateValue(val, ampm);
        }
      } else if (val === '') {
        value = '';
        if (onChange) onChange('');
      }
      renderState();
    });

    input.addEventListener('blur', () => {
      if (localTime && localTime.length > 0) {
        if (localTime.length < 5) {
          let parts = localTime.split(':');
          let hh = (parts[0] || '12').padStart(2, '0');
          let mm = (parts[1] || '00').padEnd(2, '0');
          let hours = parseInt(hh, 10);
          let minutes = parseInt(mm, 10);
          if (isNaN(hours) || isNaN(minutes) || hours > 12 || hours === 0 || minutes > 59) {
            error = 'Invalid time';
            renderState();
            return;
          }
          hh = pad2(hours);
          mm = pad2(minutes);
          const formatted = `${hh}:${mm}`;
          localTime = formatted;
          updateValue(formatted, ampm);
        } else {
          const parts = localTime.split(':');
          const hours = parseInt(parts[0], 10);
          const minutes = parseInt(parts[1], 10);
          if (isNaN(hours) || isNaN(minutes) || hours > 12 || hours === 0 || minutes > 59) {
            error = 'Invalid time';
          }
        }
        renderState();
      }
    });

    function updatePosition() {
      if (!dropdownEl) return;
      const rect = box.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const showAbove = spaceBelow < 100 && rect.top > 100;
      let left = rect.right - 80;
      if (left + 80 > window.innerWidth - 16) left = window.innerWidth - 80 - 16;
      if (left < 16) left = 16;
      dropdownEl.style.left = left + 'px';
      if (showAbove) {
        dropdownEl.style.top = 'auto';
        dropdownEl.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      } else {
        dropdownEl.style.top = (rect.bottom + 8) + 'px';
        dropdownEl.style.bottom = 'auto';
      }
    }

    function handleAmpmChange(newAmpm) {
      ampm = newAmpm;
      closeDropdown();
      renderState();
      if (localTime.length === 5) updateValue(localTime, newAmpm);
    }

    function openDropdown() {
      Widgets.closeAnyOpenDropdown();
      isOpen = true;
      dropdownEl = h('div', { class: 'ctime-dropdown' });
      const amOpt = h('div', { class: `ctime-opt ${ampm === 'AM' ? 'active' : ''}` }, 'AM');
      const pmOpt = h('div', { class: `ctime-opt ${ampm === 'PM' ? 'active' : ''}` }, 'PM');
      amOpt.addEventListener('click', () => handleAmpmChange('AM'));
      pmOpt.addEventListener('click', () => handleAmpmChange('PM'));
      dropdownEl.appendChild(amOpt);
      dropdownEl.appendChild(pmOpt);
      document.body.appendChild(dropdownEl);
      updatePosition();
      resizeHandler = () => updatePosition();
      scrollHandler = () => updatePosition();
      window.addEventListener('resize', resizeHandler);
      window.addEventListener('scroll', scrollHandler, true);
      outsideClickHandler = (e) => {
        if (!container.contains(e.target) && dropdownEl && !dropdownEl.contains(e.target)) closeDropdown();
      };
      setTimeout(() => document.addEventListener('mousedown', outsideClickHandler), 0);
      Widgets._setOpenCloserSet(closeDropdown);
    }

    function closeDropdown() {
      isOpen = false;
      if (dropdownEl && dropdownEl.parentNode) dropdownEl.parentNode.removeChild(dropdownEl);
      dropdownEl = null;
      if (resizeHandler) window.removeEventListener('resize', resizeHandler);
      if (scrollHandler) window.removeEventListener('scroll', scrollHandler, true);
      if (outsideClickHandler) document.removeEventListener('mousedown', outsideClickHandler);
      resizeHandler = scrollHandler = outsideClickHandler = null;
      if (Widgets._setOpenCloser === closeDropdown) Widgets._setOpenCloserSet(null);
    }

    ampmBtn.addEventListener('click', () => {
      if (isOpen) closeDropdown(); else openDropdown();
    });

    renderState();
    container.setValue = function (v) { value = v; syncFromValue(); renderState(); };
    return container;
  };
})();


// ---- 10-view-dashboard.js ----
/* ==========================================================================
   View: Dashboard — port of src/components/Dashboard.tsx
   ========================================================================== */

const ViewDashboard = (function () {
  let rootEl = null;

  function rerender() {
    if (!rootEl) return;
    const old = rootEl;
    // Deferred to the next frame so the click event that triggered this
    // (e.g. "Mark All Present") finishes bubbling/painting before we tear
    // out its own ancestor DOM — replacing an element synchronously from
    // within its own click handler can show a torn/glitched frame on some
    // mobile browsers.
    requestAnimationFrame(() => {
      const fresh = render();
      old.replaceWith(fresh);
    });
  }

  function render() {
    const state = Store.getState();
    const { students, batches, fees, currency, dashboardTimeStart, dashboardTimeEnd } = state;

    const totalStudents = students.length;
    const totalBatches = batches.length;

    const totalExpenses = (state.expenses || []).reduce((acc, e) => acc + Number(e.amount || 0), 0);
    const currentMonthKey = formatYM(new Date());
    const monthExpenses = (state.expenses || []).filter((e) => (e.date || '').slice(0, 7) === currentMonthKey).reduce((acc, e) => acc + Number(e.amount || 0), 0);

    const currentMonthStr = formatYM(new Date());
    const pastAndPresentFees = fees.filter((f) => f.month <= currentMonthStr);
    const pendingFees = pastAndPresentFees.filter((f) => f.status === 'Pending').reduce((acc, cur) => acc + cur.amount, 0);

    const totalCollected = fees.filter((f) => {
      if (f.status !== 'Paid') return false;
      if (!dashboardTimeStart && !dashboardTimeEnd) return true;
      const feeParts = f.month.split('-');
      const feeDate = new Date(Number(feeParts[0]), Number(feeParts[1]) - 1, 1);
      if (dashboardTimeStart) {
        const sp = dashboardTimeStart.split('-');
        const startDate = new Date(Number(sp[0]), Number(sp[1]) - 1, 1);
        if (feeDate < startDate) return false;
      }
      if (dashboardTimeEnd) {
        const ep = dashboardTimeEnd.split('-');
        const endDate = new Date(Number(ep[0]), Number(ep[1]), 0);
        if (feeDate > endDate) return false;
      }
      return true;
    }).reduce((acc, cur) => acc + cur.amount, 0);

    let collectedLabel = 'Collected (All Time)';
    if (dashboardTimeStart && dashboardTimeEnd) {
      const sp = dashboardTimeStart.split('-'), ep = dashboardTimeEnd.split('-');
      collectedLabel = `Collected (${formatMonthYearShort(new Date(Number(sp[0]), Number(sp[1]) - 1, 1))} - ${formatMonthYearShort(new Date(Number(ep[0]), Number(ep[1]) - 1, 1))})`;
    } else if (dashboardTimeStart) {
      const sp = dashboardTimeStart.split('-');
      collectedLabel = `Collected (From ${formatMonthYearShort(new Date(Number(sp[0]), Number(sp[1]) - 1, 1))})`;
    } else if (dashboardTimeEnd) {
      const ep = dashboardTimeEnd.split('-');
      collectedLabel = `Collected (Until ${formatMonthYearShort(new Date(Number(ep[0]), Number(ep[1]) - 1, 1))})`;
    }

    const todayStr = dayOfWeekShort(new Date());
    const todaysBatches = batches.filter((b) => !b.archived && b.days.includes(todayStr));
    const pendingList = pastAndPresentFees.filter((f) => f.status === 'Pending');

    // ---- Needs Attention: computed alerts a tutor would otherwise have to notice manually ----
    const now = new Date();
    const overdueDays = state.feeOverdueDays || 7;
    const overdueFees = pendingList.filter((f) => {
      // A fee's month, e.g. "2026-08", is considered overdue once we're at least
      // overdueDays into the FOLLOWING month.
      const [y, m] = f.month.split('-').map(Number);
      const dueCutoff = new Date(y, m, overdueDays - 1); // month is 0-indexed, so `m` = first of next month
      return now >= dueCutoff;
    });

    const lowAttendanceThreshold = state.lowAttendanceThreshold || 75;
    const lowAttendanceStudents = students.map((student) => {
      const studentAttendance = state.attendance.filter((a) => a.studentId === student.id);
      const presentCount = studentAttendance.filter((a) => a.status === 'Present').length;
      const lateCount = studentAttendance.filter((a) => a.status === 'Late').length;
      const absentCount = studentAttendance.filter((a) => a.status === 'Absent').length;
      const total = presentCount + lateCount + absentCount;
      const pct = total > 0 ? Math.round(((presentCount + lateCount) / total) * 100) : null;
      return { student, pct, total };
    }).filter((entry) => entry.total >= 3 && entry.pct !== null && entry.pct < lowAttendanceThreshold);

    // ---- Attendance anomaly detection (new) ----
    // Flags a student whose attendance in the last 14 days has dropped
    // sharply versus their attendance before that window — an early signal
    // that something has changed (illness, disengagement, dropout risk)
    // before it shows up as a low overall percentage.
    const fourteenDaysAgo = new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000);
    const attendanceAnomalies = students.map((student) => {
      const studentAttendance = state.attendance.filter((a) => a.studentId === student.id);
      const recent = studentAttendance.filter((a) => parseYMDLocal(a.date) >= fourteenDaysAgo);
      const older = studentAttendance.filter((a) => parseYMDLocal(a.date) < fourteenDaysAgo);
      const pctOf = (arr) => {
        const total = arr.length;
        if (total < 3) return null;
        const good = arr.filter((a) => a.status === 'Present' || a.status === 'Late').length;
        return Math.round((good / total) * 100);
      };
      const recentPct = pctOf(recent);
      const olderPct = pctOf(older);
      if (recentPct === null || olderPct === null) return null;
      const drop = olderPct - recentPct;
      return drop >= 25 ? { student, recentPct, olderPct, drop } : null;
    }).filter(Boolean).sort((a, b) => b.drop - a.drop);

    const sevenDaysFromNow = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    const upcomingTests = (state.tests || []).filter((t) => {
      const testDate = parseYMDLocal(t.date);
      return testDate >= new Date(now.getFullYear(), now.getMonth(), now.getDate()) && testDate <= sevenDaysFromNow;
    }).sort((a, b) => new Date(a.date) - new Date(b.date));

    const totalAlerts = overdueFees.length + lowAttendanceStudents.length + upcomingTests.length + attendanceAnomalies.length;

    const daysSinceBackup = state.lastBackupDate ? Math.floor((now - new Date(state.lastBackupDate)) / (24 * 60 * 60 * 1000)) : null;
    const backupNeeded = (students.length > 0 || batches.length > 0) && (daysSinceBackup === null || daysSinceBackup >= 30);

    const stats = [
      { label: 'Total Students', value: String(totalStudents), icon: 'Users', color: 'linear-gradient(to bottom right, rgba(59,130,246,0.2), transparent)', textColor: '#60a5fa' },
      { label: 'Active Batches', value: String(totalBatches), icon: 'BookOpen', color: 'linear-gradient(to bottom right, rgba(168,85,247,0.2), transparent)', textColor: '#c084fc' },
      { label: 'Pending Fees (Up to Now)', value: `${currency}${pendingFees}`, icon: 'Coins', color: 'linear-gradient(to bottom right, rgba(239,68,68,0.2), transparent)', textColor: '#f87171' },
      { label: collectedLabel, value: `${currency}${totalCollected}`, icon: 'TrendingUp', color: 'linear-gradient(to bottom right, rgba(16,185,129,0.2), transparent)', textColor: '#34d399' },
      { label: 'Net Profit (This Month)', value: `${currency}${totalCollected - monthExpenses}`, icon: 'Wallet', color: 'linear-gradient(to bottom right, rgba(0,245,255,0.2), transparent)', textColor: '#00F5FF' },
    ];

    const wrap = h('div', { class: 'view-body' });
    rootEl = wrap;

    wrap.appendChild(h('div', {}, [
      h('h2', { class: 'view-title' }, 'Dashboard Overview'),
      h('p', { class: 'view-subtitle' }, "Welcome back! Here's what's happening today."),
    ]));

    const statsGrid = h('div', { class: 'stats-grid' });
    stats.forEach((stat) => {
      const card = h('div', { class: 'stat-card' });
      card.innerHTML = `
        <div class="stat-card-glow" style="background:${stat.color}"></div>
        <div class="stat-card-body">
          <div>
            <p class="stat-card-label">${escapeHtml(stat.label)}</p>
            <p class="stat-card-value">${escapeHtml(stat.value)}</p>
          </div>
          <div class="stat-card-icon-wrap" style="color:${stat.textColor}">${icon(stat.icon, '')}</div>
        </div>
      `;
      statsGrid.appendChild(card);
    });
    wrap.appendChild(statsGrid);

    const panels = h('div', { class: 'dashboard-panels' });

    if (totalAlerts > 0 || backupNeeded) {
      const alertsPanel = h('div', { class: 'card', style: 'grid-column:1/-1;' });
      let alertsHtml = '';

      if (backupNeeded) {
        const backupSub = daysSinceBackup === null ? 'No backup has been taken yet' : `Last backup was ${daysSinceBackup} days ago`;
        alertsHtml += `
          <div class="list-row" data-nav-tab="settings" style="cursor:pointer;">
            <div><h4 class="list-row-title">${icon('Database', '')} Back up your data</h4><p class="list-row-sub">${escapeHtml(backupSub)} — go to Settings to download one.</p></div>
            <span class="badge badge-amber">Reminder</span>
          </div>
        `;
      }
      overdueFees.slice(0, 4).forEach((fee) => {
        const student = students.find((s) => s.id === fee.studentId);
        alertsHtml += `
          <div class="list-row" data-nav-tab="fees" style="cursor:pointer;">
            <div><h4 class="list-row-title">${escapeHtml(student ? student.name : 'Unknown Student')}</h4><p class="list-row-sub">Fee overdue for ${escapeHtml(fee.month)}</p></div>
            <span class="badge badge-red">${escapeHtml(currency)}${fee.amount} overdue</span>
          </div>
        `;
      });
      lowAttendanceStudents.slice(0, 4).forEach(({ student, pct }) => {
        alertsHtml += `
          <div class="list-row" data-nav-tab="attendance" style="cursor:pointer;">
            <div><h4 class="list-row-title">${escapeHtml(student.name)}</h4><p class="list-row-sub">Attendance below ${lowAttendanceThreshold}%</p></div>
            <span class="badge badge-amber">${pct}%</span>
          </div>
        `;
      });
      attendanceAnomalies.slice(0, 3).forEach(({ student, recentPct, olderPct }) => {
        alertsHtml += `
          <div class="list-row" data-nav-tab="attendance" style="cursor:pointer;">
            <div><h4 class="list-row-title">${icon('TrendingDown', '')} ${escapeHtml(student.name)}</h4><p class="list-row-sub">Attendance dropped from ${olderPct}% to ${recentPct}% in the last 2 weeks</p></div>
            <span class="badge badge-red">Watch</span>
          </div>
        `;
      });
      upcomingTests.slice(0, 4).forEach((test) => {
        const batch = batches.find((b) => b.id === test.batchId);
        alertsHtml += `
          <div class="list-row" data-nav-tab="academics" style="cursor:pointer;">
            <div><h4 class="list-row-title">${escapeHtml(test.title)}</h4><p class="list-row-sub">${escapeHtml(batch ? batch.name : 'Unknown batch')} • ${escapeHtml(test.date)}</p></div>
            <span class="badge badge-cyan">Upcoming</span>
          </div>
        `;
      });

      alertsPanel.innerHTML = `
        <div class="panel-header">
          <h3 class="panel-header-title" style="color:white;">${icon('AlertTriangle', '')} Needs Attention</h3>
        </div>
        ${alertsHtml}
      `;
      const alertIcon = alertsPanel.querySelector('.panel-header-title svg');
      if (alertIcon) alertIcon.style.color = '#fbbf24';
      alertsPanel.addEventListener('click', (e) => {
        const row = e.target.closest('[data-nav-tab]');
        if (row) App.setActiveTab(row.getAttribute('data-nav-tab'));
      });
      panels.appendChild(alertsPanel);
    }

    // ---- Today's Focus: one-tap attendance for today's batches, directly
    // from the Dashboard, without navigating to the Attendance tab. ----
    const focusPanel = h('div', { class: 'card', style: 'grid-column:1/-1;' });
    const focusHeader = h('div', { class: 'panel-header' });
    focusHeader.innerHTML = `<h3 class="panel-header-title" style="color:white;">${icon('CheckSquare', '')} Today's Focus — Quick Attendance</h3>`;
    const focusHeaderIcon = focusHeader.querySelector('.panel-header-title svg');
    if (focusHeaderIcon) focusHeaderIcon.style.color = '#34d399';
    focusPanel.appendChild(focusHeader);

    if (todaysBatches.length === 0) {
      const empty = h('div', { class: 'empty-state-inline' });
      empty.innerHTML = `${icon('CheckSquare', '')}<p>No batches today — nothing to mark.</p>`;
      focusPanel.appendChild(empty);
    } else {
      todaysBatches.forEach((batch) => {
        const batchStudents = students.filter((s) => s.batchId === batch.id);
        const todayAttendanceForBatch = state.attendance.filter((a) => a.batchId === batch.id && a.date === todayYMD());
        const markedCount = batchStudents.filter((s) => todayAttendanceForBatch.some((a) => a.studentId === s.id)).length;
        const allMarked = batchStudents.length > 0 && markedCount === batchStudents.length;

        const row = h('div', { class: 'list-row', style: 'align-items:center;' });
        const left = h('div', {});
        left.innerHTML = `
          <h4 class="list-row-title">${escapeHtml(batch.name)}</h4>
          <p class="list-row-sub">${escapeHtml(batch.subject)} • ${batchStudents.length} student${batchStudents.length === 1 ? '' : 's'} • ${markedCount}/${batchStudents.length} marked</p>
        `;
        row.appendChild(left);

        const right = h('div', { style: 'display:flex;gap:8px;align-items:center;' });
        if (allMarked) {

    const revenuePanel = h('div', { class: 'card', style: 'grid-column:1/-1;overflow:hidden;' });

      const pending = fees.filter((f) => f.month === key && f.status === 'Pending').reduce((a, f) => a + f.amount, 0);
      monthBuckets.push({ key, label: MONTH_NAMES_SHORT[d.getMonth()], collected, pending });

    const maxVal = Math.max(1, ...monthBuckets.map((m) => m.collected + m.pending));
    const chartHeight = 140;
    const barGroupWidth = 100 / monthBuckets.length;
    let barsHtml = '';
    monthBuckets.forEach((m, i) => {
      const collectedH = Math.round((m.collected / maxVal) * chartHeight);
      const pendingH = Math.round((m.pending / maxVal) * chartHeight);

    `;
    const revenueIcon = revenuePanel.querySelector('.panel-header-title svg');
    if (revenueIcon) revenueIcon.style.color = '#00F5FF';
    panels.appendChild(revenuePanel);

    // This Week strip: a quick lookahead without opening the full Schedule canvas.
    const weekPanel = h('div', { class: 'card', style: 'grid-column:1/-1;overflow:hidden;' });
    const dayAbbrevs = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

    for (let i = 0; i < 7; i++) {

        <div style="min-width:0;text-align:center;padding:8px 2px;border-radius:10px;background:${isToday ? 'rgba(0,245,255,0.08)' : 'rgba(255,255,255,0.03)'};border:1px solid ${isToday ? 'rgba(0,245,255,0.3)' : 'rgba(255,255,255,0.05)'};">
          <p style="font-size:10px;color:var(--color-text-muted);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(d.toLocaleDateString(undefined, { weekday: 'short' }))}</p>
          <p style="font-size:13px;font-weight:700;color:${isToday ? '#00F5FF' : 'white'};margin-bottom:4px;">${d.getDate()}</p>
          <p style="font-size:16px;font-weight:700;color:${dayBatches.length > 0 ? '#34d399' : 'var(--color-text-muted)'};">${dayBatches.length}</p>
          <p style="font-size:9px;color:var(--color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${dayBatches.length === 1 ? 'class' : 'classes'}</p>
        </div>

    weekPanel.innerHTML = `
      <div class="panel-header">
        <h3 class="panel-header-title" style="color:white;">${icon('Calendar', '')} This Week</h3>
      </div>
      ${weekStripHtml}
    `;
    const weekIcon = weekPanel.querySelector('.panel-header-title svg');
    if (weekIcon) weekIcon.style.color = '#7C3AED';
    panels.appendChild(weekPanel);

    // Today's classes panel
    const classesPanel = h('div', { class: 'card' });
    let classesBodyHtml = '';
    if (todaysBatches.length > 0) {
      classesBodyHtml = todaysBatches.map((batch) => {
        const batchStudents = students.filter((s) => s.batchId === batch.id).length;
        let displayTime = batch.time;
        if (batch.dayTimes && batch.dayTimes[todayStr]) {
          const times = batch.dayTimes[todayStr];
          if (times && times.start && times.end) {
            displayTime = `${formatTime12h(times.start)} - ${formatTime12h(times.end)}`;

        return `
          <div class="list-row">

      classesBodyHtml = `<div class="empty-state-inline"><p>No classes scheduled for today.</p><p style="font-size:14px;margin-top:4px;">Enjoy your free time!</p></div>`;

    classesPanel.innerHTML = `

        <h3 class="panel-header-title">${icon('Calendar', '')} Today's Classes</h3>
        <span class="panel-header-date">${escapeHtml(formatWeekdayMonthDay(new Date()))}</span>

    const coinIcon = feesPanel.querySelector('.panel-header-title svg');

    return wrap;

  return { render };
})();

/* ==========================================================================
   View: Batches — port of src/components/Batches.tsx

const ViewBatches = (function () {
  // Local UI state (mirrors React useState calls in the original component)
  let isAdding = false;
  let newBatch = { name: '', subject: '', days: [], capacity: '', defaultFee: '' };
  let newDayTimes = {};

  let editingBatch = null; // clone of batch being edited
  let editDayTimes = {};
  let confirmUpdate = false;

  let deletingBatchId = null;
  let viewingBatch = null;
  let showArchived = false;

  let rootEl = null;

  function resetAddForm() {
    isAdding = false;
    newBatch = { name: '', subject: '', days: [], capacity: '', defaultFee: '' };
    newDayTimes = {};
  }

  function parseTimeRange(timeString) {
    if (!timeString) return { start: '', end: '' };
    const parts = timeString.split(' - ');
    if (parts.length !== 2) return { start: '', end: '' };
    return { start: parseTime12to24(parts[0]), end: parseTime12to24(parts[1]) };
  }

  function buildTimeString(days, dayTimesObj) {
    return days.map((day) => {
      const times = dayTimesObj[day];
      if (times && times.start && times.end) {
        return `${day} (${formatTime12h(times.start)} - ${formatTime12h(times.end)})`;
      }
      return '';
    }).filter(Boolean).join(', ');
  }

  function handleAddSubmit(e) {
    e.preventDefault();
    if (!newBatch.name || !newBatch.subject || newBatch.days.length === 0) return;
    for (const day of newBatch.days) {
      if (!newDayTimes[day] || !newDayTimes[day].start || !newDayTimes[day].end) {
        alert(`Please set start and end time for ${day}`);
        return;
      }
    }
    const cleanedDayTimes = {};
    newBatch.days.forEach((day) => { if (newDayTimes[day]) cleanedDayTimes[day] = newDayTimes[day]; });
    const timeString = buildTimeString(newBatch.days, cleanedDayTimes);
    Store.addBatch({
      name: newBatch.name,
      subject: newBatch.subject,
      days: newBatch.days,
      time: timeString,
      dayTimes: cleanedDayTimes,
      capacity: newBatch.capacity ? parseInt(newBatch.capacity, 10) : null,
      defaultFee: newBatch.defaultFee ? parseFloat(newBatch.defaultFee) : null,
    });
    resetAddForm();
    rerender();
  }

  function handleEditSubmit(e) {
    e.preventDefault();
    if (!editingBatch || !editingBatch.name || !editingBatch.subject || editingBatch.days.length === 0) return;
    for (const day of editingBatch.days) {
      if (!editDayTimes[day] || !editDayTimes[day].start || !editDayTimes[day].end) {
        alert(`Please set start and end time for ${day}`);
        return;
      }
    }
    confirmUpdate = true;
    rerender();
  }

  function executeEdit() {
    if (!editingBatch) return;
    const cleanedDayTimes = {};
    editingBatch.days.forEach((day) => { if (editDayTimes[day]) cleanedDayTimes[day] = editDayTimes[day]; });
    const timeString = buildTimeString(editingBatch.days, cleanedDayTimes);
    const capacityVal = editingBatch.capacity === '' || editingBatch.capacity === null || editingBatch.capacity === undefined ? null : parseInt(editingBatch.capacity, 10);
    const defaultFeeVal = editingBatch.defaultFee === '' || editingBatch.defaultFee === null || editingBatch.defaultFee === undefined ? null : parseFloat(editingBatch.defaultFee);
    Store.updateBatch(editingBatch.id, Object.assign({}, editingBatch, { time: timeString, dayTimes: cleanedDayTimes, capacity: capacityVal, defaultFee: defaultFeeVal }));
    editingBatch = null;
    editDayTimes = {};
    confirmUpdate = false;
    rerender();
  }

  function startEditing(batch) {
    editingBatch = JSON.parse(JSON.stringify(batch));
    if (editingBatch.capacity === undefined) editingBatch.capacity = null;
    if (editingBatch.defaultFee === undefined) editingBatch.defaultFee = null;
    if (batch.dayTimes) {
      editDayTimes = JSON.parse(JSON.stringify(batch.dayTimes));
    } else {
      const parsed = parseTimeRange(batch.time);
      editDayTimes = {};
      batch.days.forEach((day) => { editDayTimes[day] = parsed; });
    }
    isAdding = false;
    rerender();
  }

  function rerender() {
    if (!rootEl) return;
    const old = rootEl; // capture BEFORE render() runs, since render() reassigns rootEl itself
    const fresh = render();
    old.replaceWith(fresh);
  }

  // ---- Day pills + day-time rows builder (shared between add/edit forms) ----
  function buildDaysAndTimesSection(days, dayTimesObj, onToggleDay, onTimeChange) {
    const wrap = h('div', { class: 'form-grid-full' });
    wrap.appendChild(h('label', { class: 'field-label' }, 'Days & Times'));

    const pillsRow = h('div', { class: 'day-pills' });
    DAYS_OF_WEEK.forEach((day) => {
      const active = days.includes(day);
      const pill = h('button', { type: 'button', class: `day-pill ${active ? 'active' : ''}` }, day);
      pill.addEventListener('click', () => onToggleDay(day));
      pillsRow.appendChild(pill);
    });
    wrap.appendChild(pillsRow);

    if (days.length > 0) {
      const rowsWrap = h('div', {});
      days.forEach((day) => {
        const row = h('div', { class: 'day-time-row' });
        row.appendChild(h('span', { class: 'day-time-row-label' }, day));
        const inputsWrap = h('div', { class: 'day-time-row-inputs' });

        const startInput = Widgets.customTimeInput({
          value: (dayTimesObj[day] && dayTimesObj[day].start) || '',
          required: true,
          onChange: (val) => onTimeChange(day, 'start', val),
        });
        const sep = h('span', { class: 'day-time-row-sep' }, 'to');
        const endInput = Widgets.customTimeInput({
          value: (dayTimesObj[day] && dayTimesObj[day].end) || '',
          required: true,
          onChange: (val) => onTimeChange(day, 'end', val),
        });
        startInput.style.flex = '1';
        endInput.style.flex = '1';
        inputsWrap.appendChild(startInput);
        inputsWrap.appendChild(sep);
        inputsWrap.appendChild(endInput);
        row.appendChild(inputsWrap);
        rowsWrap.appendChild(row);
      });
      wrap.appendChild(rowsWrap);
    }
    return wrap;
  }

  function buildAddForm() {
    const panel = h('form', { class: 'form-panel' });
    const closeBtn = h('button', { type: 'button', class: 'form-panel-close' }, icon_dom('X'));
    closeBtn.addEventListener('click', () => { resetAddForm(); rerender(); });
    panel.appendChild(closeBtn);
    panel.appendChild(h('h3', { class: 'form-panel-title' }, 'Create New Batch'));

    const grid = h('div', { class: 'form-grid cols-2' });

    const nameField = h('div', {});
    nameField.appendChild(h('label', { class: 'field-label' }, 'Batch Name'));
    const nameInput = h('input', { type: 'text', class: 'text-input', placeholder: 'e.g., Morning Physics A', required: 'required' });
    nameInput.value = newBatch.name;
    nameInput.addEventListener('input', () => { newBatch.name = nameInput.value; });
    nameField.appendChild(nameInput);

    const subjField = h('div', {});
    subjField.appendChild(h('label', { class: 'field-label' }, 'Subject'));
    const subjInput = h('input', { type: 'text', class: 'text-input', placeholder: 'e.g., Advanced Physics', required: 'required' });
    subjInput.value = newBatch.subject;
    subjInput.addEventListener('input', () => { newBatch.subject = subjInput.value; });
    subjField.appendChild(subjInput);

    const capField = h('div', {});
    capField.appendChild(h('label', { class: 'field-label' }, 'Max Students (optional)'));
    const capInput = h('input', { type: 'number', min: '1', class: 'text-input', placeholder: 'No limit' });
    capInput.value = newBatch.capacity;
    capInput.addEventListener('input', () => { newBatch.capacity = capInput.value; });
    capField.appendChild(capInput);

    const defFeeField = h('div', {});
    defFeeField.appendChild(h('label', { class: 'field-label' }, 'Default Monthly Fee (optional)'));
    const defFeeInput = h('input', { type: 'number', min: '0', class: 'text-input', placeholder: 'Pre-fill when adding students' });
    defFeeInput.value = newBatch.defaultFee;
    defFeeInput.addEventListener('input', () => { newBatch.defaultFee = defFeeInput.value; });
    defFeeField.appendChild(defFeeInput);

    grid.appendChild(nameField);
    grid.appendChild(subjField);
    grid.appendChild(capField);
    grid.appendChild(defFeeField);
    grid.appendChild(buildDaysAndTimesSection(
      newBatch.days,
      newDayTimes,
      (day) => {
        newBatch.days = newBatch.days.includes(day) ? newBatch.days.filter((d) => d !== day) : [...newBatch.days, day];
        rerender();
      },
      (day, field, val) => {
        newDayTimes[day] = Object.assign({}, newDayTimes[day], { [field]: val });
      }
    ));
    panel.appendChild(grid);

    const actions = h('div', { class: 'form-actions' });
    const submitBtn = h('button', { type: 'submit', class: 'btn btn-white' }, 'Save Batch');
    actions.appendChild(submitBtn);
    panel.appendChild(actions);

    panel.addEventListener('submit', handleAddSubmit);
    return panel;
  }

  function buildEditForm() {
    const panel = h('form', { class: 'form-panel' });
    const closeBtn = h('button', { type: 'button', class: 'form-panel-close' }, icon_dom('X'));
    closeBtn.addEventListener('click', () => { editingBatch = null; editDayTimes = {}; rerender(); });
    panel.appendChild(closeBtn);
    panel.appendChild(h('h3', { class: 'form-panel-title' }, 'Edit Batch'));

    const grid = h('div', { class: 'form-grid cols-2' });

    const nameField = h('div', {});
    nameField.appendChild(h('label', { class: 'field-label' }, 'Batch Name'));
    const nameInput = h('input', { type: 'text', class: 'text-input', required: 'required' });
    nameInput.value = editingBatch.name;
    nameInput.addEventListener('input', () => { editingBatch.name = nameInput.value; });
    nameField.appendChild(nameInput);

    const subjField = h('div', {});
    subjField.appendChild(h('label', { class: 'field-label' }, 'Subject'));
    const subjInput = h('input', { type: 'text', class: 'text-input', required: 'required' });
    subjInput.value = editingBatch.subject;
    subjInput.addEventListener('input', () => { editingBatch.subject = subjInput.value; });
    subjField.appendChild(subjInput);

    const capField = h('div', {});
    capField.appendChild(h('label', { class: 'field-label' }, 'Max Students (optional)'));
    const capInput = h('input', { type: 'number', min: '1', class: 'text-input', placeholder: 'No limit' });
    capInput.value = editingBatch.capacity === null || editingBatch.capacity === undefined ? '' : editingBatch.capacity;
    capInput.addEventListener('input', () => { editingBatch.capacity = capInput.value; });
    capField.appendChild(capInput);

    const defFeeField = h('div', {});
    defFeeField.appendChild(h('label', { class: 'field-label' }, 'Default Monthly Fee (optional)'));
    const defFeeInput = h('input', { type: 'number', min: '0', class: 'text-input', placeholder: 'Pre-fill when adding students' });
    defFeeInput.value = editingBatch.defaultFee === null || editingBatch.defaultFee === undefined ? '' : editingBatch.defaultFee;
    defFeeInput.addEventListener('input', () => { editingBatch.defaultFee = defFeeInput.value; });
    defFeeField.appendChild(defFeeInput);

    grid.appendChild(nameField);
    grid.appendChild(subjField);
    grid.appendChild(capField);
    grid.appendChild(defFeeField);
    grid.appendChild(buildDaysAndTimesSection(
      editingBatch.days,
      editDayTimes,
      (day) => {
        editingBatch.days = editingBatch.days.includes(day) ? editingBatch.days.filter((d) => d !== day) : [...editingBatch.days, day];
        rerender();
      },
      (day, field, val) => {
        editDayTimes[day] = Object.assign({}, editDayTimes[day], { [field]: val });
      }
    ));
    panel.appendChild(grid);

    const actions = h('div', { class: 'form-actions' });
    const cancelBtn = h('button', { type: 'button', class: 'btn btn-ghost' }, 'Cancel');
    cancelBtn.addEventListener('click', () => { editingBatch = null; editDayTimes = {}; rerender(); });
    const submitBtn = h('button', { type: 'submit', class: 'btn btn-white' }, 'Update Batch');
    actions.appendChild(cancelBtn);
    actions.appendChild(submitBtn);
    panel.appendChild(actions);

    panel.addEventListener('submit', handleEditSubmit);
    return panel;
  }

  function buildBatchCard(batch, studentsList) {
    const batchStudents = studentsList.filter((s) => s.batchId === batch.id).length;
    const hasCapacity = batch.capacity !== null && batch.capacity !== undefined;
    const isFull = hasCapacity && batchStudents >= batch.capacity;
    const card = h('div', { class: 'batch-card' });
    if (batch.archived) card.style.opacity = '0.6';

    const actionsRow = h('div', { class: 'batch-card-actions' });
    if (isFull) actionsRow.appendChild(h('span', { class: 'badge badge-red', style: 'margin-right:auto;' }, 'Full'));
    else if (batch.archived) actionsRow.appendChild(h('span', { class: 'badge', style: 'margin-right:auto;background:rgba(255,255,255,0.1);color:var(--color-text-muted);' }, 'Archived'));
    const viewBtn = h('button', { class: 'table-action-btn', title: 'View Details' }, icon_dom('Eye'));
    viewBtn.addEventListener('click', () => { viewingBatch = batch; rerender(); });
    const dupBtn = h('button', { class: 'table-action-btn', title: 'Duplicate Batch' }, icon_dom('Copy'));
    dupBtn.addEventListener('click', () => {
      Store.addBatch({
        name: `${batch.name} (Copy)`,
        subject: batch.subject,
        days: batch.days,
        time: batch.time,
        dayTimes: batch.dayTimes,
        capacity: batch.capacity,
        defaultFee: batch.defaultFee,
      });
      rerender();
    });
    const archiveBtn = h('button', { class: 'table-action-btn', title: batch.archived ? 'Unarchive Batch' : 'Archive Batch' }, icon_dom('Archive'));
    archiveBtn.addEventListener('click', () => { Store.updateBatch(batch.id, { archived: !batch.archived }); rerender(); });
    const editBtn = h('button', { class: 'table-action-btn', title: 'Edit Batch' }, icon_dom('Edit2'));
    editBtn.addEventListener('click', () => startEditing(batch));
    const delBtn = h('button', { class: 'table-action-btn', title: 'Delete Batch' }, icon_dom('Trash2'));
    delBtn.addEventListener('click', () => { deletingBatchId = batch.id; rerender(); });
    actionsRow.appendChild(viewBtn);
    actionsRow.appendChild(dupBtn);
    actionsRow.appendChild(archiveBtn);
    actionsRow.appendChild(editBtn);
    actionsRow.appendChild(delBtn);
    card.appendChild(actionsRow);

    card.appendChild(h('div', { class: 'batch-card-icon' }, icon_dom('BookOpen')));
    card.appendChild(h('h3', { class: 'batch-card-title' }, batch.name));
    card.appendChild(h('p', { class: 'batch-card-sub' }, batch.subject));

    const details = h('div', {});

  function buildDeleteModal() {
    const state = Store.getState();
    const affectedStudents = state.students.filter((s) => s.batchId === deletingBatchId).length;
    const affectedFees = state.fees.filter((f) => {
      const student = state.students.find((s) => s.id === f.studentId);
      return student && student.batchId === deletingBatchId;
    }).length;
    const affectedAttendance = state.attendance.filter((a) => a.batchId === deletingBatchId).length;
    const affectedTests = state.tests.filter((t) => t.batchId === deletingBatchId).length;
    const affectedHomework = state.homework.filter((hw) => hw.batchId === deletingBatchId).length;
    const impactParts = [];
    if (affectedStudents > 0) impactParts.push(`${affectedStudents} student${affectedStudents === 1 ? '' : 's'}`);
    if (affectedFees > 0) impactParts.push(`${affectedFees} fee record${affectedFees === 1 ? '' : 's'}`);
    if (affectedAttendance > 0) impactParts.push(`${affectedAttendance} attendance record${affectedAttendance === 1 ? '' : 's'}`);
    if (affectedTests > 0) impactParts.push(`${affectedTests} test${affectedTests === 1 ? '' : 's'}`);
    if (affectedHomework > 0) impactParts.push(`${affectedHomework} homework assignment${affectedHomework === 1 ? '' : 's'}`);

    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { deletingBatchId = null; rerender(); });
    const box = h('div', { class: 'modal-box modal-sm confirm-modal' });
    const bodyText = impactParts.length > 0
      ? `This will also permanently delete: ${impactParts.join(', ')}. This action cannot be undone.`
      : 'Are you sure you want to delete this batch? This action cannot be undone.';
    box.innerHTML = `
      <div class="confirm-icon-wrap red">${icon('AlertTriangle', '')}</div>
      <h3 class="confirm-title">Delete Batch?</h3>
      <p class="confirm-body">${escapeHtml(bodyText)}</p>

    const actions = h('div', { class: 'confirm-actions' });
    const cancelBtn = h('button', { class: 'btn btn-ghost-sm btn-flex1' }, 'Cancel');
    cancelBtn.addEventListener('click', () => { deletingBatchId = null; rerender(); });
    const delBtn = h('button', { class: 'btn btn-danger btn-flex1' }, 'Delete');

  function buildViewModal(studentsList, feesList) {

    statsGrid.innerHTML = `

        <p style="font-size:12px;color:var(--color-text-muted);margin-bottom:4px;">Total Students</p>
        <p style="font-size:14px;font-weight:500;color:white;">${enrolledStudents.length}</p>

    box.appendChild(statsGrid);

    box.appendChild(h('h4', { style: 'font-size:18px;font-weight:700;color:white;margin-bottom:16px;' }, 'Enrolled Students'));

    const pastAndPresentFees = feesList.filter((f) => f.month <= currentMonthStr);

    let rowsHtml = '';

        const pendingFeesForStudent = pastAndPresentFees.filter((f) => f.studentId === student.id && f.status === 'Pending');

        const statusBadge = pendingCount > 0
          ? `<span class="badge badge-red">${icon('AlertTriangle', '')} ${pendingCount} Months Pending</span>`
          : `<span class="badge badge-emerald">${icon('CheckCircle2', '')} Clear</span>`;
        const remindPhone = student.guardianPhone || student.phone;
        const reminderCell = pendingCount > 0 && remindPhone
          ? `<a href="${buildWhatsAppLink(remindPhone, `Hi ${student.name}, this is a reminder that you have ${pendingCount} month(s) of pending tuition fees. Please pay at your earliest convenience. Thank you!`)}" target="_blank" rel="noopener noreferrer" class="table-action-btn" title="Send WhatsApp Reminder" style="color:#25D366;display:inline-flex;">${icon('MessageCircle', '')}</a>`
          : '';
        return `
          <tr>
            <td style="color:white;font-weight:500;">${escapeHtml(student.name)}</td>
            <td style="color:var(--color-text-muted);font-size:14px;">${escapeHtml(student.joinDate)}</td>
            <td>${statusBadge}</td>
            <td class="right">${reminderCell}</td>
          </tr>
        `;
      }).join('');
    }

    tableWrap.innerHTML = `
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Student Name</th><th>Join Date</th><th>Pending Fees</th><th class="right">Remind</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
    box.appendChild(tableWrap);

    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  function render() {
    const state = Store.getState();
    const { batches, students, fees } = state;

    // Consume a one-shot prefill handed off from Free Time's "Book This Slot".
    if (_pendingBatchPrefill) {
      isAdding = true;
      editingBatch = null;
      newBatch = { name: '', subject: '', days: [_pendingBatchPrefill.day], capacity: '', defaultFee: '' };
      newDayTimes = { [_pendingBatchPrefill.day]: { start: _pendingBatchPrefill.startTime, end: _pendingBatchPrefill.endTime } };
      _pendingBatchPrefill = null;
    }

    const wrap = h('div', { class: 'view-body' });

    const header = h('div', { class: 'view-header stack-mobile' });
    header.appendChild(h('div', {}, [
      h('h2', { class: 'view-title' }, 'Batch Management'),
      h('p', { class: 'view-subtitle' }, 'Organize your classes and schedules.'),
    ]));
    const headerActions = h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' });
    const archivedCount = batches.filter((b) => b.archived).length;
    if (archivedCount > 0) {
      const toggleBtn = h('button', { class: 'btn btn-ghost-sm' });
      toggleBtn.innerHTML = showArchived ? `${icon('Eye', '')} Showing Archived (${archivedCount})` : `${icon('Archive', '')} Show Archived (${archivedCount})`;
      toggleBtn.addEventListener('click', () => { showArchived = !showArchived; rerender(); });
      headerActions.appendChild(toggleBtn);
    }
    const addBtn = h('button', { class: 'btn btn-primary' });
    addBtn.innerHTML = `${icon('Plus', '')} Add Batch`;
    addBtn.addEventListener('click', () => { isAdding = true; editingBatch = null; rerender(); });
    headerActions.appendChild(addBtn);
    header.appendChild(headerActions);
    wrap.appendChild(header);

    if (isAdding) wrap.appendChild(buildAddForm());
    if (editingBatch) wrap.appendChild(buildEditForm());

    const visibleBatches = batches.filter((b) => (showArchived ? !!b.archived : !b.archived));
    const grid = h('div', { class: 'cards-grid' });
    if (visibleBatches.length === 0 && !isAdding) {
      const empty = h('div', { class: 'empty-state' });
      if (showArchived) {
        empty.innerHTML = `${icon('Archive', '')}<p>No archived batches.</p>`;
      } else {
        empty.innerHTML = `${icon('BookOpen', '')}<p>No batches found.</p><p>Create your first batch to get started.</p>`;
      }
      grid.appendChild(empty);
    } else {
      visibleBatches.forEach((batch) => grid.appendChild(buildBatchCard(batch, students)));
    }
    wrap.appendChild(grid);

    rootEl = wrap;

    clearModalPortal();
    if (confirmUpdate) mountModal(buildConfirmUpdateModal());
    else if (deletingBatchId) mountModal(buildDeleteModal());
    else if (viewingBatch) mountModal(buildViewModal(students, fees));

    return wrap;
  }

  return { render };
})();

const ViewStudents = (function () {
  let isAdding = false;
  let searchQuery = '';
  let newStudent = { name: '', phone: '', batchId: '', joinDate: todayYMD(), feeAmount: 1000, guardianName: '', guardianPhone: '', gradeLevel: '' };
  let editingStudent = null;
  let deletingStudentId = null;
  let viewingProfileId = null;
  let profileTab = 'overview'; // 'overview' | 'academics' | 'notes' | 'contact'
  let newNoteText = '';
  let newLogEntry = { type: 'Call', note: '' };
  let rootEl = null;

  function rerender() {
    if (!rootEl) return;
    const old = rootEl; // capture BEFORE render() runs, since render() reassigns rootEl itself
    const fresh = render();
    old.replaceWith(fresh);
  }

  // Live-filtering the table as the user types must NOT replace the whole view
  // (that would steal focus from the search input on every keystroke). Instead
  // we surgically rebuild just the <tbody>.
  function rerenderTableOnly() {
    if (!rootEl) return;
    const state = Store.getState();
    const { students, batches } = state;
    const filteredStudents = students.filter((s) =>
      s.name.toLowerCase().includes(searchQuery.toLowerCase()) || s.phone.includes(searchQuery)
    );
    const tbody = rootEl.querySelector('tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    if (filteredStudents.length === 0) {
      const emptyRow = h('tr', {});
      emptyRow.innerHTML = `<td colspan="5" class="empty">${icon('User', '')}<p>No students found.</p></td>`;
      tbody.appendChild(emptyRow);
    } else {
      filteredStudents.forEach((student) => tbody.appendChild(buildStudentRow(student, batches)));
    }
  }

  function batchOptions(batches, studentsList, opts) {
    const excludeArchived = opts && opts.excludeArchived;
    const keepBatchId = opts && opts.keepBatchId;
    return batches
      .filter((b) => !excludeArchived || !b.archived || b.id === keepBatchId)
      .map((b) => {
        const count = studentsList ? studentsList.filter((s) => s.batchId === b.id).length : null;
        const isFull = studentsList && b.capacity !== null && b.capacity !== undefined && count >= b.capacity;
        const fillSuffix = studentsList && b.capacity !== null && b.capacity !== undefined ? ` [${count}/${b.capacity}${isFull ? ' FULL' : ''}]` : '';
        const archivedSuffix = b.archived ? ' (Archived)' : '';
        return { value: b.id, label: `${b.name} (${b.subject})${fillSuffix}${archivedSuffix}` };
      });
  }

  function handleAddSubmit(e) {
    e.preventDefault();
    if (!newStudent.name || !newStudent.phone || !newStudent.batchId || newStudent.feeAmount <= 0) return;
    const state = Store.getState();
    const batch = state.batches.find((b) => b.id === newStudent.batchId);
    if (batch && batch.capacity !== null && batch.capacity !== undefined) {
      const currentCount = state.students.filter((s) => s.batchId === batch.id).length;
      if (currentCount >= batch.capacity) {
        alert(`${batch.name} is full (${batch.capacity} students). Increase its capacity in Batches, or choose a different batch.`);
        return;
      }
    }
    Store.addStudent(Object.assign({}, newStudent));
    isAdding = false;
    newStudent = { name: '', phone: '', batchId: '', joinDate: todayYMD(), feeAmount: 1000, guardianName: '', guardianPhone: '', gradeLevel: '' };
    rerender();
  }

  function handleEditSubmit(e) {
    e.preventDefault();
    if (!editingStudent) return;
    const state = Store.getState();
    const originalStudent = state.students.find((s) => s.id === editingStudent.id);
    const isMovingBatch = originalStudent && originalStudent.batchId !== editingStudent.batchId;
    if (isMovingBatch) {
      const targetBatch = state.batches.find((b) => b.id === editingStudent.batchId);
      if (targetBatch && targetBatch.capacity !== null && targetBatch.capacity !== undefined) {
        const currentCount = state.students.filter((s) => s.batchId === targetBatch.id && s.id !== editingStudent.id).length;
        if (currentCount >= targetBatch.capacity) {
          alert(`${targetBatch.name} is full (${targetBatch.capacity} students). Increase its capacity in Batches, or choose a different batch.`);
          return;
        }
      }
    }
    Store.updateStudent(editingStudent.id, {
      name: editingStudent.name,
      phone: editingStudent.phone,
      batchId: editingStudent.batchId,
      joinDate: editingStudent.joinDate,
      feeAmount: editingStudent.feeAmount,
      guardianName: editingStudent.guardianName,

    editingStudent = null;

  function buildDeleteModal() {
    const state = Store.getState();
    const affectedFees = state.fees.filter((f) => f.studentId === deletingStudentId).length;
    const affectedAttendance = state.attendance.filter((a) => a.studentId === deletingStudentId).length;
    const affectedNotes = state.studentNotes.filter((n) => n.studentId === deletingStudentId).length;
    const impactParts = [];
    if (affectedFees > 0) impactParts.push(`${affectedFees} fee record${affectedFees === 1 ? '' : 's'}`);
    if (affectedAttendance > 0) impactParts.push(`${affectedAttendance} attendance record${affectedAttendance === 1 ? '' : 's'}`);
    if (affectedNotes > 0) impactParts.push(`${affectedNotes} note${affectedNotes === 1 ? '' : 's'}`);

    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { deletingStudentId = null; rerender(); });
    const box = h('div', { class: 'modal-box modal-sm confirm-modal' });
    const bodyText = impactParts.length > 0
      ? `This will also permanently delete: ${impactParts.join(', ')}, along with their test scores and homework records. This cannot be undone.`
      : 'Are you sure you want to delete this student? This action cannot be undone.';
    box.innerHTML = `
      <div class="confirm-icon-wrap red lg">${icon('Trash2', '')}</div>
      <h3 class="confirm-title">Delete Student?</h3>
      <p class="confirm-body mb-8">${escapeHtml(bodyText)}</p>
    `;
    const actions = h('div', { class: 'confirm-actions' });
    const cancelBtn = h('button', { class: 'btn btn-ghost-sm btn-flex1' }, 'Cancel');
    cancelBtn.addEventListener('click', () => { deletingStudentId = null; rerender(); });
    const delBtn = h('button', { class: 'btn btn-danger-soft btn-flex1' }, 'Yes, Delete');
    delBtn.addEventListener('click', () => {
      Store.deleteStudent(deletingStudentId);
      deletingStudentId = null;
      Toast.show({ message: 'Student deleted.' });
      rerender();
    });
    actions.appendChild(cancelBtn);
    actions.appendChild(delBtn);
    box.appendChild(actions);
    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  function printStudentProfile(student, state) {
    const batch = state.batches.find((b) => b.id === student.batchId);
    const studentAttendance = state.attendance.filter((a) => a.studentId === student.id);
    const presentCount = studentAttendance.filter((a) => a.status === 'Present').length;
    const lateCount = studentAttendance.filter((a) => a.status === 'Late').length;
    const absentCount = studentAttendance.filter((a) => a.status === 'Absent').length;
    const totalMarked = presentCount + lateCount + absentCount;
    const attendancePct = totalMarked > 0 ? Math.round(((presentCount + lateCount) / totalMarked) * 100) : null;

    const studentTests = state.tests.filter((t) => (t.scores || []).some((sc) => sc.studentId === student.id))
      .slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    const testRowsHtml = studentTests.map((t) => {
      const sc = t.scores.find((s) => s.studentId === student.id);
      const pct = sc && t.maxMarks ? Math.round((sc.marks / t.maxMarks) * 100) : null;
      return `<tr><td>${escapeHtml(t.title)}</td><td>${escapeHtml(t.date)}</td><td>${sc ? sc.marks : '-'} / ${t.maxMarks}</td><td>${pct !== null ? pct + '%' : '-'}</td></tr>`;
    }).join('');
    const avgPct = studentTests.length > 0
      ? Math.round(studentTests.reduce((acc, t) => {
          const sc = t.scores.find((s) => s.studentId === student.id);
          return acc + (sc && t.maxMarks ? (sc.marks / t.maxMarks) * 100 : 0);
        }, 0) / studentTests.length)
      : null;

    // Auto-generated remark, purely rule-based on locally available numbers
    // (no external AI call — keeps the app fully offline).
    let autoRemark = '';
    if (avgPct !== null) {
      if (avgPct >= 85) autoRemark = 'Excellent and consistent performance across tests.';
      else if (avgPct >= 70) autoRemark = 'Solid performance overall, with room to sharpen a few topics.';
      else if (avgPct >= 50) autoRemark = 'Moderate performance — regular revision is recommended.';
      else autoRemark = 'Needs focused attention and additional practice.';
    }
    if (attendancePct !== null && attendancePct < 75) {
      autoRemark += (autoRemark ? ' ' : '') + 'Attendance is below the recommended level and should improve.';
    }
    const relevantWeakTopics = (state.weakTopics || []).filter((w) => w.batchId === student.batchId && !w.resolved);

    const currentMonthStr = formatYM(new Date());
    const studentFees = state.fees.filter((f) => f.studentId === student.id).slice().sort((a, b) => a.month.localeCompare(b.month));

      const matchesSearch = student.name.toLowerCase().includes(searchQuery.toLowerCase()) || student.phone.includes(searchQuery);

      const studentFees = pastAndPresentFees.filter((f) => f.studentId === student.id);
      const hasPending = studentFees.some((f) => f.status === 'Pending');

        rerender();
      });
      const cancelBtn = h('button', { class: 'inline-confirm-btn confirm-neutral' }, 'Cancel');
      cancelBtn.addEventListener('click', () => { editingFeeId = null; rerender(); });
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      box.appendChild(actions);
      card.appendChild(box);
    } else if (isMarkingPaidThis) {
      const box = h('div', { class: 'inline-confirm success' });
      box.appendChild(h('label', {}, 'Select Paid Date'));
      const picker = Widgets.customDatePicker({ value: markPaidDate, onChange: (v) => { markPaidDate = v; }, className: 'mb-3' });
      picker.style.marginBottom = '12px';
      box.appendChild(picker);
      const actions = h('div', { class: 'inline-confirm-actions' });
      const confirmBtn = h('button', { class: 'inline-confirm-btn confirm-emerald' }, 'Confirm');
      confirmBtn.addEventListener('click', () => {
        Store.updateFeeRecord(fee.id, { status: 'Paid', paidDate: new Date(markPaidDate).toISOString() });
        markingPaidFeeId = null;
        rerender();
      });
      const cancelBtn = h('button', { class: 'inline-confirm-btn confirm-neutral' }, 'Cancel');
      cancelBtn.addEventListener('click', () => { markingPaidFeeId = null; rerender(); });
      actions.appendChild(confirmBtn);
      actions.appendChild(cancelBtn);
      box.appendChild(actions);
      card.appendChild(box);
    } else if (isMarkingUnpaidThis) {
      const box = h('div', { class: 'inline-confirm warn' });
      box.appendChild(h('p', {}, 'Mark this fee as unpaid?'));
      const actions = h('div', { class: 'inline-confirm-actions' });
      const confirmBtn = h('button', { class: 'inline-confirm-btn confirm-danger' }, 'Confirm');
      confirmBtn.addEventListener('click', () => { Store.updateFeeStatus(fee.id, 'Pending'); markingUnpaidFeeId = null; rerender(); });
      const cancelBtn = h('button', { class: 'inline-confirm-btn confirm-neutral' }, 'Cancel');
      cancelBtn.addEventListener('click', () => { markingUnpaidFeeId = null; rerender(); });
      actions.appendChild(confirmBtn);
      actions.appendChild(cancelBtn);
      box.appendChild(actions);
      card.appendChild(box);
    } else {
      const footer = h('div', { class: 'fee-record-footer' });
      const amountWrap = h('div', {});
      amountWrap.innerHTML = `<p class="fee-record-amount-label">Amount</p><p class="fee-record-amount">${escapeHtml(currency)}${fee.amount.toFixed(2)}</p>`;
      footer.appendChild(amountWrap);

        const markPaidBtn = h('button', { class: 'fee-record-mark-btn paid' }, 'Mark Paid');
        markPaidBtn.addEventListener('click', () => { markingPaidFeeId = fee.id; markPaidDate = todayYMD(); rerender(); });
        actionsWrap.appendChild(markPaidBtn);
        if (student) {
          const remindPhone = student.guardianPhone || student.phone;
          if (remindPhone) {
            const reminderBtn = h('a', {
              class: 'fee-record-mark-btn paid',
              style: 'background:rgba(37,211,102,0.15);color:#25D366;text-decoration:none;display:inline-flex;align-items:center;gap:6px;',
              target: '_blank',
              rel: 'noopener noreferrer',
              href: buildWhatsAppLink(remindPhone, `Hi ${student.name}, this is a reminder that your tuition fee of ${currency}${fee.amount} for ${formatMonthYear(parseYMDLocal(fee.month + '-01'))} is still pending. Please pay at your earliest convenience. Thank you!`),
            });
            reminderBtn.innerHTML = `${icon('MessageCircle', '')}Remind`;
            actionsWrap.appendChild(reminderBtn);
          }
        }
      } else {
        const markUnpaidBtn = h('button', { class: 'fee-record-mark-btn unpaid' }, 'Mark Unpaid');
        markUnpaidBtn.addEventListener('click', () => { markingUnpaidFeeId = fee.id; rerender(); });
        actionsWrap.appendChild(markUnpaidBtn);
        if (student) {
          const receiptBtn = h('button', { class: 'fee-record-mark-btn paid', style: 'background:rgba(0,245,255,0.1);color:#00F5FF;' }, 'Receipt');
          receiptBtn.addEventListener('click', () => openReceiptWindow(fee, currency, student, teacherName));
          actionsWrap.appendChild(receiptBtn);
        }
        if (fee.paidDate) {
          const d = new Date(fee.paidDate);

          actionsWrap.appendChild(paidDateWrap);
        }
      }
      footer.appendChild(actionsWrap);
      card.appendChild(footer);
    }

    return card;
  }

  function buildStudentFeesModal(state) {
    const student = state.students.find((s) => s.id === selectedStudentId);
    if (!student) return null;
    const selectedStudentFees = state.fees.filter((f) => f.studentId === student.id).sort((a, b) => new Date(a.month) - new Date(b.month));

    const overlay = h('div', { class: 'modal-overlay' });
    const backdrop = h('div', { class: 'modal-backdrop' });
    backdrop.addEventListener('click', () => { selectedStudentId = null; rerender(); });
    const box = h('div', { class: 'modal-box modal-2xl modal-scroll-90' });
    const closeBtn = h('button', { class: 'modal-close' }, icon_dom('X'));
    closeBtn.addEventListener('click', () => { selectedStudentId = null; rerender(); });
    box.appendChild(closeBtn);

    const header = h('div', { class: 'modal-icon-header' });
    header.innerHTML = `
      <div class="modal-icon-badge" style="width:56px;height:56px;">${icon('User', '')}</div>
      <div><h3 class="modal-icon-header-title" style="font-size:24px;">${escapeHtml(student.name)}</h3><p class="modal-icon-header-sub">Fee Records (${selectedStudentFees.length} Months)</p></div>
    `;
    box.appendChild(header);

    const scrollArea = h('div', { class: 'custom-scrollbar', style: 'overflow-y:auto;padding-right:8px;' });
    const grid = h('div', { class: 'fee-records-grid' });
    if (selectedStudentFees.length === 0) {
      grid.appendChild(h('div', { class: 'empty-state-inline', style: 'grid-column:1/-1;' }, 'No fee records found for this student.'));
    } else {
      selectedStudentFees.forEach((fee) => grid.appendChild(buildFeeRecordCard(fee, state.currency, student, state.teacherName)));
    }
    scrollArea.appendChild(grid);
    box.appendChild(scrollArea);

    overlay.appendChild(backdrop);
    overlay.appendChild(box);
    return overlay;
  }

  let showDueTimeline = true;

  // ---- Fee Due Timeline (new) -------------------------------------------
  // A flat, sorted list of this month's pending fees across ALL students —
  // the "what do I need to collect this week" view, instead of digging
  // through each student's card individually.
  function buildDueTimelinePanel(state) {
    const currentMonthStr = formatYM(new Date());
    const pending = state.fees
      .filter((f) => f.status === 'Pending' && f.month <= currentMonthStr)
      .map((f) => ({ fee: f, student: state.students.find((s) => s.id === f.studentId) }))
      .filter((row) => row.student)
      .sort((a, b) => a.fee.month.localeCompare(b.fee.month));

    const panel = h('div', { class: 'card', style: 'margin-bottom:20px;' });
    const headRow = h('div', { style: 'display:flex;align-items:center;justify-content:space-between;cursor:pointer;' });
    headRow.innerHTML = `<h3 class="settings-section-title" style="margin:0;">${icon('Calendar', '')} Due This Month & Overdue (${pending.length})</h3>`;
    const toggleIcon = h('span', {}, icon_dom(showDueTimeline ? 'ChevronUp' : 'ChevronDown'));
    headRow.appendChild(toggleIcon);
    headRow.addEventListener('click', () => { showDueTimeline = !showDueTimeline; rerender(); });
    panel.appendChild(headRow);

    if (showDueTimeline) {
      if (pending.length === 0) {
        panel.appendChild(h('p', { style: 'color:var(--color-text-muted);font-size:13px;margin-top:10px;' }, 'Nothing pending — all caught up!'));
      } else {
        const list = h('div', { style: 'margin-top:12px;' });
        pending.forEach(({ fee, student }) => {
          const isOverdue = fee.month < currentMonthStr;
          const row = h('div', { class: 'list-row', style: 'align-items:center;' });
          const left = h('div', {});
          left.innerHTML = `<h4 class="list-row-title">${escapeHtml(student.name)}</h4><p class="list-row-sub">${escapeHtml(formatMonthYear(parseYMDLocal(fee.month + '-01')))} • ${escapeHtml(state.currency)}${fee.amount}${isOverdue ? ' <span style="color:#f87171;">(Overdue)</span>' : ''}</p>`;
          row.appendChild(left);
          const right = h('div', { style: 'display:flex;gap:8px;' });
          const remindPhone = student.guardianPhone || student.phone;
          if (remindPhone) {
            const remindBtn = h('a', {
              class: 'btn btn-ghost-sm',
              style: 'background:rgba(37,211,102,0.12);color:#25D366;text-decoration:none;',
              target: '_blank', rel: 'noopener noreferrer',
              href: buildWhatsAppLink(remindPhone, buildFeeReminderMessage(state, student, fee)),
            });
            remindBtn.innerHTML = `${icon('MessageCircle', '')} Remind`;
            right.appendChild(remindBtn);
          }
          const payBtn = h('button', { class: 'btn btn-ghost-sm' }, 'Mark Paid');
          payBtn.addEventListener('click', () => { Store.updateFeeRecord(fee.id, { status: 'Paid', paidDate: new Date().toISOString() }); rerender(); });
          right.appendChild(payBtn);
          row.appendChild(right);
          list.appendChild(row);
        });
        panel.appendChild(list);
      }
    }
    return panel;
  }

  function render() {
    const state = Store.getState();

    const wrap = h('div', { class: 'view-body' });

    const header = h('div', { class: 'view-header stack-mobile' });
    header.appendChild(h('div', {}, [
      h('h2', { class: 'view-title' }, 'Fee Management'),
      h('p', { class: 'view-subtitle' }, 'Track student payments and pending dues.'),
    ]));
    if (!state.autoGenerateFees) {
      const addBtn = h('button', { class: 'btn btn-primary-sm' });
      addBtn.innerHTML = `${icon('Plus', '')} Add Fees`;
      addBtn.addEventListener('click', () => { showAddFeeModal = true; rerender(); });
      header.appendChild(addBtn);
    }
    if (batchFilter !== 'All') {
      const currentMonthStr = formatYM(new Date());
      const batchStudentIds = new Set(state.students.filter((s) => s.batchId === batchFilter).map((s) => s.id));
      const pendingThisMonth = state.fees.filter((f) => batchStudentIds.has(f.studentId) && f.month === currentMonthStr && f.status === 'Pending');
      if (pendingThisMonth.length > 0) {
        const bulkPaidBtn = h('button', { class: 'btn btn-ghost-sm' });
        bulkPaidBtn.innerHTML = `${icon('CheckCircle2', '')} Mark ${pendingThisMonth.length} Paid (This Month)`;
        bulkPaidBtn.addEventListener('click', () => {
          if (!confirm(`Mark this month's fee as Paid for ${pendingThisMonth.length} student(s) in this batch?`)) return;
          pendingThisMonth.forEach((fee) => Store.updateFeeStatus(fee.id, 'Paid'));
          Toast.show({ message: `${pendingThisMonth.length} fee record${pendingThisMonth.length === 1 ? '' : 's'} marked paid.` });
          rerender();
        });
        header.appendChild(bulkPaidBtn);
      }
    }
    wrap.appendChild(header);

    wrap.appendChild(buildDueTimelinePanel(state));
    wrap.appendChild(buildFilterBar(state));
    wrap.appendChild(buildStudentGrid(state));

    rootEl = wrap;

    clearModalPortal();
    if (showAddFeeModal) mountModal(buildAddFeeModal(state));
    else if (selectedStudentId) {
      const modal = buildStudentFeesModal(state);
      if (modal) mountModal(modal);
    }

    return wrap;
  }

  return { render };
})();

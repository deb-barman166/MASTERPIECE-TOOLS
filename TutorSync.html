:root {
  --color-bg-base: #0A0A0A;
  --color-bg-base-alt: #0D0D0D;
  --color-bg-card: #121212;
  --color-accent-cyan: #00F5FF;
  --color-accent-purple: #7C3AED;
  --color-text-main: #EAEAEA;
  --color-text-muted: #A0A0A0;
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  background-color: var(--color-bg-base);
  color: var(--color-text-main);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  width: 100%;
}

#root {
  height: 100%;
  width: 100%;
}

button {
  font-family: inherit;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
}

input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

input::placeholder {
  color: var(--color-text-muted);
}

a {
  color: inherit;
  text-decoration: none;
}

table {
  border-collapse: collapse;
}

svg {
  display: block;
}

::selection {
  background: rgba(0, 245, 255, 0.3);
  color: var(--color-accent-cyan);
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: #0D0D0D;
}
::-webkit-scrollbar-thumb {
  background: #1a1a1a;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #2a2a2a;
}
.custom-scrollbar {
  scrollbar-width: thin;
  scrollbar-color: #1a1a1a #0D0D0D;
}

/* Visible keyboard focus for accessibility */
button:focus-visible,
input:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--color-accent-cyan);
  outline-offset: 2px;
}

.tab-fade-in {
  animation: tab-fade-in 0.2s ease-out;
}
@keyframes tab-fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* ==========================================================================
   App shell & layout
   ========================================================================== */

.app-shell {
  display: flex;
  height: 100vh;
  height: 100dvh;
  background-color: var(--color-bg-base);
  color: var(--color-text-main);
  overflow: hidden;
  font-family: var(--font-sans);
}

.app-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  position: relative;
  padding-top: 64px;
}
@media (min-width: 768px) {
  .app-main { padding-top: 0; }
}

.app-main-glow {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 384px;
  background: linear-gradient(to bottom, rgba(124, 58, 237, 0.05), transparent);
  pointer-events: none;
}

.app-content {
  padding: 16px;
  max-width: 1280px;
  margin: 0 auto;
  position: relative;
  z-index: 10;
}
@media (min-width: 768px) {
  .app-content { padding: 32px; }
}

/* ---------- Loading screen ---------- */
.loading-screen {
  height: 100vh;
  height: 100dvh;
  width: 100%;
  background-color: #0A0A0A;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
}
.loading-badge {
  width: 80px;
  height: 80px;
  border-radius: 9999px;
  background: linear-gradient(to right, #00F5FF, #7C3AED);
  display: flex;
  align-items: center;
  justify-content: center;
  color: black;
  font-weight: 700;
  font-size: 36px;
  margin-bottom: 24px;
  box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
  animation: loading-spin-pulse 1.5s ease-in-out infinite;
}
@keyframes loading-spin-pulse {
  0% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.2) rotate(180deg); }
  100% { transform: scale(1) rotate(360deg); }
}
.loading-title {
  font-size: 30px;
  font-weight: 700;
  background: linear-gradient(to right, #00F5FF, #7C3AED);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  opacity: 0;
  animation: fade-slide-up 0.4s ease-out 0.3s forwards;
}
.loading-sub {

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; }

/* ---------- Modals ---------- */
.modal-overlay {

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.data-table th.right { text-align: right; }
.data-table tbody tr {
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background-color 0.15s;
}
.data-table tbody tr:last-child { border-bottom: none; }
.data-table tbody tr:hover { background: rgba(255,255,255,0.05); }
.data-table td { padding: 16px 24px; vertical-align: middle; }
.data-table td.right { text-align: right; }
.data-table td.empty { padding: 48px 24px; text-align: center; color: var(--color-text-muted); }
.data-table td.empty svg { width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.2; }

.table-cell-user {
  display: flex;
  align-items: center;
  gap: 12px;
}
.table-avatar {
  width: 40px;
  height: 40px;
  border-radius: 9999px;
  background: linear-gradient(to bottom right, rgba(0,245,255,0.2), rgba(124,58,237,0.2));
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.table-avatar svg { width: 20px; height: 20px; color: white; }
.table-cell-icon-text {
  display: flex;
  align-items: center;
  gap: 8px;
}
.table-cell-icon-text svg { width: 16px; height: 16px; color: var(--color-text-muted); flex-shrink: 0; }
.table-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.table-action-btn {
  padding: 8px;
  min-width: 40px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  color: var(--color-text-muted);
  transition: all 0.2s;
}
.table-action-btn:hover.cyan { color: #00F5FF; background: rgba(0,245,255,0.1); }
.table-action-btn:hover.purple { color: #7C3AED; background: rgba(124,58,237,0.1); }
.table-action-btn:hover.red { color: #ef4444; background: rgba(239,68,68,0.1); }
.table-action-btn svg { width: 20px; height: 20px; }

/* ---------- Filter bar ---------- */
.filter-bar {
  background: #121212;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: stretch;
}
@media (min-width: 768px) {
  .filter-bar { flex-direction: row; align-items: center; }
}
.filter-bar-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-text-muted);
  font-weight: 500;
  margin-right: 8px;
  flex-shrink: 0;
}
.filter-bar-label svg { width: 20px; height: 20px; }
.filter-bar-search { position: relative; flex: 1; width: 100%; }
.filter-bar-search svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--color-text-muted);
}
.filter-bar-search input {
  width: 100%;
  background: #0A0A0A;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 8px 16px 8px 36px;
  font-size: 14px;
  color: white;
  outline: none;
}
.filter-bar-search input:focus { border-color: #00F5FF; }
.filter-bar-select { width: 100%; }
@media (min-width: 768px) {
  .filter-bar-select { width: 192px; }
}

/* ---------- Search box (standalone) ---------- */
.search-box {
  position: relative;
  flex: 1;
}
@media (min-width: 768px) {
  .search-box { width: 256px; flex: none; }
}
.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: var(--color-text-muted);
}
.search-box input {
  width: 100%;
  background: #121212;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 16px 12px 40px;
  color: white;
  outline: none;
}
.search-box input:focus { border-color: #00F5FF; }

/* ---------- Toast ---------- */
.toast-wrap {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: #121212;
  border: 1px solid rgba(0,245,255,0.3);
  color: white;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 0 20px rgba(0,245,255,0.15);
  animation: toast-in 0.25s ease-out;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast.leaving {
  animation: toast-out 0.2s ease-in forwards;
}
@keyframes toast-out {
  to { opacity: 0; transform: translateY(10px); }
}


/* ==========================================================================
   View-specific styles: Dashboard, Attendance calendar, Free Time, Fees grid
   ========================================================================== */

/* ---------- Dashboard ---------- */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
@media (min-width: 768px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }

.dashboard-panels {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  min-width: 0;
}
.dashboard-panels > * { min-width: 0; }
@media (min-width: 1024px) { .dashboard-panels { grid-template-columns: 1fr 1fr; } }

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.panel-header-title {
  font-size: 20px;
  font-weight: 700;
  color: white;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-header-title svg { width: 20px; height: 20px; }
.panel-header-date { font-size: 14px; color: var(--color-text-muted); }

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.05);
  transition: background-color 0.15s;
}
.list-row:hover { background: rgba(255,255,255,0.1); }
.list-row + .list-row { margin-top: 16px; }
.list-row-title { font-weight: 600; color: white; word-break: break-word; }
.list-row-sub { font-size: 14px; color: var(--color-text-muted); word-break: break-word; }
.list-row-right { text-align: right; }
.list-row-value { color: #00F5FF; font-weight: 500; }
.list-row-value.red { color: #f87171; }
.list-row-meta { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }

/* ---------- Grid of student/batch cards ---------- */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
@media (min-width: 768px) { .cards-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }

.batch-card {
  background: #121212;
  padding: 24px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.05);
  position: relative;
  transition: border-color 0.3s;
}
.batch-card:hover { border-color: rgba(124,58,237,0.5); }
.batch-card-actions {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 8px;
}
.batch-card-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(to bottom right, rgba(124,58,237,0.2), transparent);
  border: 1px solid rgba(124,58,237,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.batch-card-icon svg { width: 24px; height: 24px; color: #7C3AED; }
.batch-card-title { font-size: 20px; font-weight: 700; color: white; margin-bottom: 4px; }
.batch-card-sub { color: var(--color-text-muted); font-size: 14px; margin-bottom: 24px; }
.batch-card-detail {
  display: flex;
  align-items: center;
  font-size: 14px;
  color: #EAEAEA;
  margin-bottom: 12px;
}
.batch-card-detail:last-child { margin-bottom: 0; }
.batch-card-detail svg { width: 16px; height: 16px; margin-right: 12px; color: #00F5FF; flex-shrink: 0; }

.student-fee-card {
  background: #121212;
  padding: 24px;
  border-radius: 16px;
  border: 1px solid;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.3s;
}
.student-fee-card.clear { border-color: rgba(16,185,129,0.2); }
.student-fee-card.clear:hover { border-color: rgba(16,185,129,0.5); }
.student-fee-card.pending { border-color: rgba(239,68,68,0.2); }
.student-fee-card.pending:hover { border-color: rgba(239,68,68,0.5); }
.student-fee-card-glow {
  position: absolute;
  top: 0; right: 0;
  width: 128px; height: 128px;
  filter: blur(48px);
  border-radius: 9999px;
  opacity: 0.1;
}
.student-fee-card.clear .student-fee-card-glow { background: #10b981; }
.student-fee-card.pending .student-fee-card-glow { background: #ef4444; }
.student-fee-card-body { display: flex; align-items: flex-start; gap: 16px; position: relative; z-index: 10; }
.student-fee-card-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid;
  flex-shrink: 0;
}
.student-fee-card.clear .student-fee-card-icon { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2); color: #10b981; }
.student-fee-card.pending .student-fee-card-icon { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); color: #ef4444; }
.student-fee-card-icon svg { width: 24px; height: 24px; }
.student-fee-card-name { font-weight: 700; color: white; font-size: 18px; margin-bottom: 4px; }
.student-fee-card-batch { font-size: 14px; color: var(--color-text-muted); margin-bottom: 12px; }

/* Attendance summary cards */
.attendance-card {
  background: #121212;
  padding: 24px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.3s;
}
.attendance-card:hover { border-color: rgba(0,245,255,0.5); }
.attendance-card-glow {
  position: absolute;
  top: 0; right: 0;
  width: 128px; height: 128px;
  filter: blur(48px);
  border-radius: 9999px;
  opacity: 0.1;
  background: #00F5FF;
}
.attendance-card-body { display: flex; align-items: flex-start; gap: 16px; position: relative; z-index: 10; }
.attendance-card-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(0,245,255,0.2);
  background: rgba(0,245,255,0.1);
  color: #00F5FF;
  flex-shrink: 0;
}
.attendance-card-icon svg { width: 24px; height: 24px; }
.attendance-card-name { font-weight: 700; color: white; font-size: 18px; margin-bottom: 4px; }
.attendance-card-batch { font-size: 14px; color: var(--color-text-muted); margin-bottom: 12px; }
.attendance-card-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 12px; font-weight: 500; }
.attendance-stat-pill { padding: 4px 8px; border-radius: 6px; border: 1px solid; }
.attendance-stat-pill.present { color: #34d399; background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2); }
.attendance-stat-pill.absent { color: #f87171; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); }
.attendance-stat-pill.late { color: #fbbf24; background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.2); }
.attendance-stat-pill.pct { color: #00F5FF; background: rgba(0,245,255,0.1); border-color: rgba(0,245,255,0.2); margin-left: auto; }

/* ---------- Attendance marking list ---------- */
.attendance-mark-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px;
  background: #0A0A0A;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  transition: border-color 0.2s;
}
@media (min-width: 640px) {
  .attendance-mark-row { align-items: center; flex-wrap: nowrap; }
}
.attendance-mark-row:hover { border-color: rgba(255,255,255,0.1); }
.attendance-mark-row + .attendance-mark-row { margin-top: 12px; }
.attendance-mark-name { font-weight: 500; color: white; word-break: break-word; }
.attendance-mark-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.attn-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.15s;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.05);
  color: var(--color-text-muted);
}
.attn-btn svg { width: 16px; height: 16px; }
.attn-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
.attn-btn.present.active { background: rgba(16,185,129,0.2); color: #34d399; border-color: rgba(16,185,129,0.3); }
.attn-btn.absent.active { background: rgba(239,68,68,0.2); color: #f87171; border-color: rgba(239,68,68,0.3); }
.attn-btn.late.active { background: rgba(245,158,11,0.2); color: #fbbf24; border-color: rgba(245,158,11,0.3); }
.attn-btn.leave.active { background: rgba(96,165,250,0.2); color: #60a5fa; border-color: rgba(96,165,250,0.3); }
.attn-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.notice-banner {
  padding: 16px;
  background: rgba(234,179,8,0.1);
  border: 1px solid rgba(234,179,8,0.2);
  border-radius: 12px;
  color: #facc15;
  font-size: 14px;
  margin-bottom: 24px;
}

.batch-info-row {
  padding: 16px;
  background: #0A0A0A;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}
@media (min-width: 640px) {
  .batch-info-row { flex-direction: row; align-items: center; justify-content: space-between; }
}
.batch-info-title { font-size: 18px; font-weight: 700; color: white; }
.batch-info-sub { font-size: 14px; color: var(--color-text-muted); }
.batch-info-time {
  display: flex; align-items: center; gap: 8px;
  color: #00F5FF;
  background: rgba(0,245,255,0.1);
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid rgba(0,245,255,0.2);
  font-size: 14px;
  font-weight: 700;
}
.batch-info-time svg { width: 16px; height: 16px; }

.view-toggle {
  display: flex;
  background: #121212;
  border-radius: 12px;
  padding: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.view-toggle::-webkit-scrollbar { display: none; }
.view-toggle-btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text-muted);
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.view-toggle-btn.active {
  background: rgba(0,245,255,0.2);
  color: #00F5FF;
  box-shadow: 0 0 10px rgba(0,245,255,0.2);
}

/* ---------- Attendance calendar (year view) ---------- */
.year-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0A0A0A;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 24px;
}
.year-nav-btn { padding: 8px; border-radius: 8px; color: var(--color-text-muted); }
.year-nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }
.year-nav-btn svg { width: 20px; height: 20px; }
.year-nav-label { font-size: 20px; font-weight: 700; color: white; letter-spacing: 0.05em; }

.months-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
@media (min-width: 768px) { .months-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .months-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1280px) { .months-grid { grid-template-columns: repeat(4, 1fr); } }

.month-card {
  background: #0A0A0A;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
}
.month-card-title { color: white; font-weight: 500; margin-bottom: 12px; text-align: center; }
.month-dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}
.month-dow-cell { font-size: 10px; text-align: center; color: var(--color-text-muted); font-weight: 500; }
.month-days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.month-day-empty { aspect-ratio: 1; }
.month-day-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.month-day-circle {
  width: 100%; height: 100%;
  border-radius: 9999px;
  border: 1px solid;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  transition: all 0.15s;
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.1);
  color: var(--color-text-muted);
}
.month-day-circle.present {
  background: rgba(16,185,129,0.1);
  color: #34d399;
  font-weight: 700;
  animation: neon-pulse-green 2s infinite alternate;
}
.month-day-circle.absent {
  background: rgba(239,68,68,0.1);
  color: #f87171;
  font-weight: 700;
  animation: neon-pulse-red 2s infinite alternate;
}
.month-day-circle.late {
  background: rgba(245,158,11,0.1);
  color: #fbbf24;
  font-weight: 700;
  animation: neon-pulse-amber 2s infinite alternate;
}
.month-day-circle.leave {
  background: rgba(96,165,250,0.1);
  color: #60a5fa;
  font-weight: 700;
  animation: neon-pulse-blue 2s infinite alternate;
}
.month-day-circle.today { box-shadow: 0 0 0 1px #00F5FF; }
@keyframes neon-pulse-green {
  0% { box-shadow: 0 0 5px rgba(16,185,129,0.4), inset 0 0 5px rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.4); }
  100% { box-shadow: 0 0 15px rgba(16,185,129,0.8), inset 0 0 10px rgba(16,185,129,0.4); border-color: rgba(16,185,129,1); }
}
@keyframes neon-pulse-red {
  0% { box-shadow: 0 0 5px rgba(239,68,68,0.4), inset 0 0 5px rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); }
  100% { box-shadow: 0 0 15px rgba(239,68,68,0.8), inset 0 0 10px rgba(239,68,68,0.4); border-color: rgba(239,68,68,1); }
}
@keyframes neon-pulse-amber {
  0% { box-shadow: 0 0 5px rgba(245,158,11,0.4), inset 0 0 5px rgba(245,158,11,0.2); border-color: rgba(245,158,11,0.4); }
  100% { box-shadow: 0 0 15px rgba(245,158,11,0.8), inset 0 0 10px rgba(245,158,11,0.4); border-color: rgba(245,158,11,1); }
}
@keyframes neon-pulse-blue {
  0% { box-shadow: 0 0 5px rgba(96,165,250,0.4), inset 0 0 5px rgba(96,165,250,0.2); border-color: rgba(96,165,250,0.4); }
  100% { box-shadow: 0 0 15px rgba(96,165,250,0.8), inset 0 0 10px rgba(96,165,250,0.4); border-color: rgba(96,165,250,1); }
}
.month-day-tooltip {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 4px;
  z-index: 10;
  display: none;
  white-space: nowrap;
}
.month-day-cell:hover .month-day-tooltip { display: block; }
.month-day-tooltip-inner {
  background: black;
  color: white;
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.2);
}

/* ---------- Free time grid ---------- */
.freetime-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 768px) { .freetime-grid { grid-template-columns: repeat(7, 1fr); } }

.freetime-day-col {
  background: #121212;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.05);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 300px;
}
.freetime-day-header {
  background: rgba(255,255,255,0.05);
  padding: 12px;
  text-align: center;
  font-weight: 700;
  color: white;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.freetime-day-body {
  padding: 12px;
  flex: 1;
  display: flex;

.csel { position: relative; width: 100%; }

/* ==========================================================================
   Schedule — custom flow canvas (replaces @xyflow/react)
   ========================================================================== */

.schedule-view {
  height: calc(100vh - 120px);
  height: calc(100dvh - 120px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.flow-wrap {
  flex: 1;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  overflow: hidden;
  position: relative;
  background: #0A0A0A;
}

.flow-viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
}
.flow-viewport.panning { cursor: grabbing; }

.flow-bg {
  position: absolute;
  inset: -4000px;
  background-image: radial-gradient(circle, #333 1.4px, transparent 1.4px);
  background-size: 24px 24px;
  transform-origin: 0 0;
  will-change: transform;
}

.flow-canvas {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

.flow-edges-svg {
  position: absolute;
  top: -20000px;
  left: -20000px;
  width: 40000px;
  height: 40000px;
  overflow: visible;
  pointer-events: none;
}
.flow-edge-path {
  fill: none;
  stroke: #00F5FF;
  stroke-width: 2;
  pointer-events: stroke;
  cursor: pointer;
}
.flow-edge-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 20;
  pointer-events: stroke;
  cursor: pointer;
}
.flow-edge-arrow { fill: #00F5FF; pointer-events: none; }
.flow-edge-delete-btn {
  position: absolute;
  top: 0;
  left: 0;
  width: 20px;
  height: 20px;
  border-radius: 9999px;
  background: rgba(239,68,68,0.85);
  border: 1px solid rgba(239,68,68,0.9);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: auto;
  /* Appended to canvasEl after node cards, but z-index guarantees the stacking
     even if DOM order ever changes (e.g. a node redrawn later via the status tick). */
  z-index: 30;
}
.flow-edge-delete-btn:hover { background: #ef4444; }
.flow-edge-delete-btn svg { width: 12px; height: 12px; }

.flow-node {
  position: absolute;
  top: 0;
  left: 0;
  cursor: grab;
  user-select: none;
  touch-action: none;
  z-index: 1;
}
.flow-node.dragging { cursor: grabbing; z-index: 50; }

.flow-node-card {
  background: #121212;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  min-width: 200px;
  max-width: 220px;
  position: relative;
  transition: border-color 0.2s;
}
.flow-node-card:hover { border-color: rgba(0,245,255,0.5); }
.flow-node-card.status-progress {
  border-color: rgba(245,158,11,0.5);
  box-shadow: 0 0 15px rgba(245,158,11,0.3);
}
.flow-node-card.status-completed {
  border-color: rgba(16,185,129,0.5);
  box-shadow: 0 0 15px rgba(16,185,129,0.2);
}

.flow-node-delete {
  position: absolute;
  top: -10px;
  right: -10px;
  width: 24px;
  height: 24px;
  border-radius: 9999px;
  background: rgba(239,68,68,0.2);
  color: #ef4444;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all 0.15s;
  border: 1px solid rgba(239,68,68,0.5);
  z-index: 10;
}
.flow-node-card:hover .flow-node-delete { opacity: 1; }
.flow-node-delete:hover { background: #ef4444; color: white; }
.flow-node-delete svg { width: 12px; height: 12px; }

.flow-handle {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 12px;
  border-radius: 9999px;
  border: none;
  cursor: crosshair;
  z-index: 5;
}
.flow-handle.target { top: -6px; background: #7C3AED; }
.flow-handle.source { bottom: -6px; background: #00F5FF; }
.flow-handle:hover { transform: translateX(-50%) scale(1.3); }

.flow-node-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  gap: 8px;
}
.flow-node-head-left { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; }
.flow-node-name { font-weight: 700; color: white; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-node-status-pill {

  margin-left: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;

}

  flex-shrink: 0;
}
.flow-node-icon svg { width: 16px; height: 16px; color: #00F5FF; }
.flow-node-icon.progress { background: linear-gradient(to bottom right, rgba(245,158,11,0.2), rgba(245,158,11,0.1)); }
.flow-node-icon.progress svg { color: #f59e0b; animation: flow-pulse 1.5s infinite; }
.flow-node-icon.completed { background: linear-gradient(to bottom right, rgba(16,185,129,0.2), rgba(16,185,129,0.1)); }
.flow-node-icon.completed svg { color: #10b981; }
.flow-node-subject { font-size: 12px; color: var(--color-text-muted); margin-bottom: 12px; }
.flow-node-meta { display: flex; flex-direction: column; gap: 4px; }
.flow-node-meta-row { display: flex; align-items: center; font-size: 12px; color: #EAEAEA; }
.flow-node-meta-row svg { width: 12px; height: 12px; margin-right: 8px; color: #7C3AED; flex-shrink: 0; }

/* Controls (zoom in/out/fit) */
.flow-controls {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  flex-direction: column;
  background: #121212;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  overflow: hidden;
  z-index: 20;
}
.flow-control-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 16px;
  font-weight: 700;
}
.flow-control-btn:last-child { border-bottom: none; }
.flow-control-btn:hover { background: rgba(255,255,255,0.1); }
.flow-control-btn svg { width: 16px; height: 16px; }

/* Top-right panel */
.flow-panel {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 20;
}
.flow-add-menu {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 8px;
  width: 256px;
  background: #121212;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
  overflow: hidden;
  z-index: 50;
}
.flow-add-menu-head {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.flow-add-menu-head h4 { font-size: 14px; font-weight: 700; color: white; }
.flow-add-menu-head button { color: var(--color-text-muted); }
.flow-add-menu-head button:hover { color: white; }
.flow-add-menu-head svg { width: 16px; height: 16px; }
.flow-add-menu-list { max-height: 256px; overflow-y: auto; }
.flow-add-menu-item {
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background-color 0.15s;
}
.flow-add-menu-item:last-child { border-bottom: none; }
.flow-add-menu-item:hover { background: rgba(255,255,255,0.05); }
.flow-add-menu-item-name { font-size: 14px; font-weight: 500; color: white; }
.flow-add-menu-item-time { font-size: 12px; color: var(--color-text-muted); }
.flow-add-menu-empty { padding: 16px; text-align: center; font-size: 14px; color: var(--color-text-muted); }

.flow-empty-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  color: var(--color-text-muted);
  text-align: center;
  padding: 24px;
}
.flow-empty-hint-inner { max-width: 320px; }
.flow-empty-hint svg { width: 40px; height: 40px; margin: 0 auto 12px; opacity: 0.3; }

/* ---------- Quick Add FAB (new) ---------- */
.quick-add-fab-wrap { position: fixed; right: 24px; bottom: 24px; z-index: 500; }
.quick-add-fab {
  width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, #00F5FF, #7C3AED);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(0,245,255,0.35);
  transition: transform 0.15s;
}
.quick-add-fab:hover { transform: scale(1.06); }
.quick-add-fab svg { width: 26px; height: 26px; color: #050814; stroke-width: 2.5; }
.quick-add-menu {
  position: absolute; right: 0; bottom: 68px;
  background: rgba(15,18,32,0.98); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 6px; min-width: 200px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
}
.quick-add-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; border-radius: 10px; border: none; background: transparent;
  color: white; font-size: 13.5px; cursor: pointer; text-align: left;
}
.quick-add-menu-item:hover { background: rgba(0,245,255,0.08); }
.quick-add-menu-item svg { width: 17px; height: 17px; color: #00F5FF; flex-shrink: 0; }

/* ---------- Leaderboard (new, Academics) ---------- */
.leaderboard-row {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px;
  border-radius: 12px; margin-bottom: 8px; background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
}
.leaderboard-rank {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; flex-shrink: 0; background: rgba(255,255,255,0.06); color: var(--color-text-muted);
}
.leaderboard-rank.gold { background: rgba(251,191,36,0.15); color: #fbbf24; }
.leaderboard-rank.silver { background: rgba(203,213,225,0.15); color: #cbd5e1; }
.leaderboard-rank.bronze { background: rgba(217,119,6,0.15); color: #d97706; }
.leaderboard-name { font-size: 14px; font-weight: 600; color: white; }
.leaderboard-sub { font-size: 12px; color: var(--color-text-muted); }
.leaderboard-score { margin-left: auto; font-size: 16px; font-weight: 700; color: #00F5FF; }

/* ---------- Weak topics (new, Academics/Syllabus) ---------- */
.weak-topic-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-radius: 10px; margin-bottom: 6px;
  background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.15);
}
.weak-topic-row.resolved { background: rgba(52,211,153,0.05); border-color: rgba(52,211,153,0.15); opacity: 0.7; }
.weak-topic-title { font-size: 13.5px; color: white; }
.weak-topic-meta { font-size: 11px; color: var(--color-text-muted); }

/* ---------- Expense rows (new, Settings) ---------- */
.expense-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-radius: 10px; margin-bottom: 6px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
}

/* ---------- Print styles for Report Card ---------- */
@media print {
  body * { visibility: hidden; }
  #report-card-print, #report-card-print * { visibility: visible; }
  #report-card-print { position: absolute; left: 0; top: 0; width: 100%; }
}

const DAYS_OF_WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_NAMES_FROM_JS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; // JS getDay() index -> name

function uuid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  // Fallback UUID v4 generator
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// date-fns replacements -----------------------------------------------------

function pad2(n) { return String(n).padStart(2, '0'); }

function formatYMD(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function formatYM(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
}

function todayYMD() {
  return formatYMD(new Date());
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_NAMES_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ---- WhatsApp deep-link helper (new) --------------------------------------
// Builds a wa.me link that opens WhatsApp (app or web) with a prefilled
// message. This is 100% offline/client-side: no API key, no server call —
// it just constructs a URL per the public wa.me convention and opens it in
// a new tab. The person's own WhatsApp client handles actually sending it.
function buildWhatsAppLink(phone, message) {
  const digitsOnly = String(phone || '').replace(/\D/g, '');
  if (!digitsOnly) return null;
  // If the number doesn't already look like it has a country code (heuristic:
  // typical Indian mobile numbers are 10 digits), prefix the configured
  // default country code from Settings.
  const state = Store.getState();
  const cc = (state.whatsappCountryCode || '91').replace(/\D/g, '');
  const withCountry = digitsOnly.length <= 10 ? `${cc}${digitsOnly}` : digitsOnly;
  return `https://wa.me/${withCountry}?text=${encodeURIComponent(message)}`;
}

function openWhatsAppMessage(phone, message) {
  const link = buildWhatsAppLink(phone, message);
  if (!link) {
    Toast.show({ message: 'No phone number on file for this student.' });
    return;
  }
  window.open(link, '_blank', 'noopener');
}

function buildFeeReminderMessage(state, student, fee) {

  })();
  return `Hi ${student.name}, this is a reminder that your ${monthLabel} tuition fee of ${state.currency}${fee.amount} is due. Kindly pay at your earliest convenience. Thank you! - ${state.teacherName || 'Your Tutor'}`;
}

];
const DAY_NAMES_SHORT2 = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function formatMonthYear(date) {
  return `${MONTH_NAMES[date.getMonth()]} ${date.getFullYear()}`;
}
function formatMonthYearShort(date) {
  return `${MONTH_NAMES_SHORT[date.getMonth()]} ${date.getFullYear()}`;
}
function formatFullDate(date) {
  // "MMMM do, yyyy" e.g. January 5th, 2025
  const day = date.getDate();
  const suffix = ordinalSuffix(day);
  return `${MONTH_NAMES[date.getMonth()]} ${day}${suffix}, ${date.getFullYear()}`;
}
function formatWeekdayMonthDay(date) {
  // "EEEE, MMM do" e.g. Monday, Jan 5th
  const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const day = date.getDate();
  return `${weekdays[date.getDay()]}, ${MONTH_NAMES_SHORT[date.getMonth()]} ${day}${ordinalSuffix(day)}`;
}
function formatMonthDayYear(date) {
  // "MMM d, yyyy"
  return `${MONTH_NAMES_SHORT[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
}
function ordinalSuffix(n) {
  const j = n % 10, k = n % 100;
  if (j === 1 && k !== 11) return 'st';
  if (j === 2 && k !== 12) return 'nd';
  if (j === 3 && k !== 13) return 'rd';
  return 'th';
}
function dayOfWeekShort(date) {
  // "EEE" e.g. Mon
  return DAY_NAMES_FROM_JS[date.getDay()];
}

function parseYMDLocal(str) {
  // Parses "YYYY-MM-DD" as a local date (avoids UTC off-by-one issues)
  if (!str) return new Date(NaN);
  const parts = str.split('-').map(Number);
  if (parts.length < 3 || parts.some(isNaN)) return new Date(NaN);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function daysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function eachDayOfMonth(year, month) {
  const n = daysInMonth(year, month);
  const result = [];
  for (let d = 1; d <= n; d++) result.push(new Date(year, month, d));
  return result;
}

function isSameYMD(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function formatTime12h(time24) {
  if (!time24) return '';
  const parts = time24.split(':');
  const h = parts[0], m = parts[1];
  const hours = parseInt(h, 10);
  const ampm = hours >= 12 ? 'PM' : 'AM';
  const h12 = hours % 12 || 12;
  return `${h12}:${m} ${ampm}`;
}

// Inverse of formatTime12h: "5:30 PM" -> "17:30". Used when a 12-hour display
// string (e.g. from Free Time's computed slots) needs to become a 24-hour
// HH:MM value for the day/time form inputs.
function parseTime12hTo24h(time12) {
  if (!time12) return '';
  const parts = time12.split(' ');
  const time = parts[0], modifier = parts[1];
  const timeParts = time.split(':').map(Number);
  let hours = timeParts[0];
  const minutes = timeParts[1] || 0;
  if (modifier === 'AM') { if (hours === 12) hours = 0; }
  else if (modifier === 'PM') { if (hours !== 12) hours += 12; }
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

function parseTime12to24(time12h) {
  if (!time12h) return '';
  const spaceIdx = time12h.lastIndexOf(' ');
  if (spaceIdx === -1) return '';
  const time = time12h.slice(0, spaceIdx);
  const modifier = time12h.slice(spaceIdx + 1);
  if (!time || !modifier) return '';
  let [hours, minutes] = time.split(':');
  if (hours === '12') hours = '00';
  if (modifier === 'PM') hours = (parseInt(hours, 10) + 12).toString();
  return `${hours.padStart(2, '0')}:${minutes}`;
}

function debounce(fn, wait) {
  let t;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

// Simple DOM helper: create element from tag with props/children
function h(tag, props, children) {
  const el = document.createElement(tag);
  if (props) {
    for (const key in props) {
      if (key === 'class') el.className = props[key];
      else if (key === 'style') el.setAttribute('style', props[key]);
      else if (key.startsWith('on') && typeof props[key] === 'function') {
        el.addEventListener(key.slice(2).toLowerCase(), props[key]);
      } else if (key === 'html') {
        el.innerHTML = props[key];
      } else {
        el.setAttribute(key, props[key]);
      }
    }
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c === null || c === undefined) return;
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
  }
  return el;
}

function icon(name, cls, extraAttrs) {
  const svgAttrs = extraAttrs || '';
  const path = ICONS[name] || '';
  return `<svg class="${cls || ''}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${svgAttrs}>${path}</svg>`;
}

// Build an icon as a real DOM node (for appendChild usage) rather than an HTML string
function icon_dom(name, cls) {
  const span = document.createElement('span');
  span.style.display = 'contents';
  span.innerHTML = icon(name, cls || '');
  return span.firstElementChild;
}

// ---- Modal portal ----
// Modals are mounted directly under <body> instead of inside each view's own
// DOM subtree. Views live inside .app-main, a nested scroll container, and
// .app-content picks up a brief CSS animation on every tab switch — on some
// simplified/embedded mobile WebViews (as opposed to a full mobile browser),
// a `position: fixed` element nested inside a scrolling/animated ancestor like
// that can get mis-rendered as fixed-relative-to-that-ancestor instead of the
// true viewport, so a modal opened after scrolling down a long list would
// visually scroll away with the content instead of staying centered on
// screen. Mounting at the body level sidesteps the whole problem, the same
// way the customSelect dropdown already does a few hundred lines up.
let _modalPortalEl = null;

// Shared one-shot handoff: Free Time's "Book This Slot" sets this, then
// navigates to Batches, which reads and clears it on its next render. Kept
// as a plain global since the two views are separate IIFEs with no other
// shared state channel.
let _pendingBatchPrefill = null;
function getModalPortal() {
  if (!_modalPortalEl || !document.body.contains(_modalPortalEl)) {
    _modalPortalEl = document.createElement('div');
    _modalPortalEl.id = 'modal-portal-root';
    document.body.appendChild(_modalPortalEl);
  }
  return _modalPortalEl;
}
// Mounts a modal overlay element into the portal. Only one modal is ever
// shown at a time in this app's design, so mounting replaces whatever was
// there before. Returns a close() function the caller can optionally use;
// most call sites just let the next mount (or clearModalPortal) replace it.
function mountModal(overlayEl) {
  const portal = getModalPortal();
  portal.innerHTML = '';
  portal.appendChild(overlayEl);
  // Hide the Quick Add FAB while any modal is open — it's fixed-position and
  // was sitting on top of in-modal controls (e.g. the Contact tab's own
  // add button) in the bottom-right corner.
  const fabWrap = document.querySelector('.quick-add-fab-wrap');
  if (fabWrap) fabWrap.style.display = 'none';
}
function clearModalPortal() {
  if (_modalPortalEl) _modalPortalEl.innerHTML = '';
  const fabWrap = document.querySelector('.quick-add-fab-wrap');
  if (fabWrap) fabWrap.style.display = '';
}

// ---- Toast / undo notifications ----
// Mounted at the body level for the same reason modals are: position: fixed
// nested inside the scrolling/animated view tree can misbehave on some
// mobile WebViews. Supports an optional "Undo" action with a countdown.
const Toast = (function () {
  let toastWrapEl = null;
  let activeTimeoutId = null;

  function getWrap() {
    if (!toastWrapEl || !document.body.contains(toastWrapEl)) {
      toastWrapEl = document.createElement('div');
      toastWrapEl.className = 'toast-wrap';
      document.body.appendChild(toastWrapEl);
    }
    return toastWrapEl;
  }

  // show({ message, actionLabel, onAction, duration }) — if onAction is
  // provided, an "Undo" (or actionLabel) button appears; onAction is called
  // if tapped before duration elapses.
  function show(opts) {
    const { message, actionLabel, onAction, duration = 5000 } = opts;
    const wrap = getWrap();
    wrap.innerHTML = ''; // only one toast at a time, matches the modal portal's approach
    if (activeTimeoutId) { clearTimeout(activeTimeoutId); activeTimeoutId = null; }

    const toastEl = document.createElement('div');
    toastEl.className = 'toast';
    toastEl.style.pointerEvents = 'auto';
    toastEl.style.display = 'flex';
    toastEl.style.alignItems = 'center';
    toastEl.style.gap = '16px';

    const msgSpan = document.createElement('span');
    msgSpan.textContent = message;
    toastEl.appendChild(msgSpan);

    function dismiss() {
      toastEl.classList.add('leaving');
      setTimeout(() => { if (toastEl.parentElement) toastEl.parentElement.removeChild(toastEl); }, 200);
    }

    if (onAction) {
      const actionBtn = document.createElement('button');
      actionBtn.textContent = actionLabel || 'Undo';
      actionBtn.style.color = '#00F5FF';
      actionBtn.style.fontWeight = '700';
      actionBtn.style.whiteSpace = 'nowrap';
      actionBtn.addEventListener('click', () => {
        onAction();
        if (activeTimeoutId) { clearTimeout(activeTimeoutId); activeTimeoutId = null; }
        dismiss();
      });
      toastEl.appendChild(actionBtn);
    }

    wrap.appendChild(toastEl);
    activeTimeoutId = setTimeout(dismiss, duration);
  }

  return { show };
})();

// Builds a wa.me link that opens WhatsApp with a pre-filled message. Strips
// everything but digits from the phone number since wa.me requires E.164-ish
// digits with no punctuation; this app doesn't collect country codes, so the
// number is used as-is (best effort) and the tutor can still edit the
// recipient/number inside WhatsApp itself before sending.
function buildWhatsAppLink(phone, message) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

// Shared export helpers — originally only used by Settings' full-data export,
// now used by any view that offers a CSV/Excel download of its own records
// (Attendance history, Test scores, Homework completion, etc).
function exportToCSV(data, filename) {
  if (!data || data.length === 0) { alert('No data to export.'); return; }
  const headers = Object.keys(data[0]).join(',');
  const rows = data.map((row) => Object.values(row).map((val) => `"${String(val).replace(/"/g, '""')}"`).join(','));
  const csv = [headers].concat(rows).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${filename}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function exportToExcel(data, filename) {
  if (!data || data.length === 0) { alert('No data to export.'); return; }
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, `${filename}.xlsx`);
}

/* ==========================================================================
   Store — state management + localStorage persistence
   Faithful port of src/lib/store.tsx
   ========================================================================== */

const STORAGE_KEY = 'tuition_management_data';

const initialState = {
  batches: [],
  students: [],
  fees: [],
  freeSlots: [],
  attendance: [],
  scheduleNodes: [],
  scheduleEdges: [],
  tests: [],
  homework: [],
  studentNotes: [],
  communicationLog: [],
  syllabusEntries: [],
  teacherName: 'Teacher Profile',
  currency: '₹',
  autoGenerateFees: false,
  dashboardTimeStart: '',
  dashboardTimeEnd: '',
  freeTimeStart: '05:30',
  freeTimeEnd: '22:00',
  lastBackupDate: '',
  lowAttendanceThreshold: 75,
  feeOverdueDays: 7,
  // ---- New in this update ----
  expenses: [],                 // { id, date(YMD), category, amount, note }
  feeReminderDaysBefore: 3,     // used by the "due soon" reminder list on Fees
  weakTopics: [],               // { id, batchId, topic, addedDate, resolved }
  whatsappCountryCode: '91',    // default dial code used when a student has no explicit one
};

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      return Object.assign({}, initialState, parsed);
    } catch (e) {
      console.error('Failed to parse local storage data');
    }
  }
  return Object.assign({}, initialState);
}

const Store = (function () {
  let state = loadState();
  const listeners = new Set();

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function setState(updater) {
    const patch = typeof updater === 'function' ? updater(state) : updater;
    state = Object.assign({}, state, patch);
    persist();
    listeners.forEach((fn) => fn(state));
  }

  function getState() {
    return state;
  }

  function subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  // ---- Batches ----
  function addBatch(batch) {
    setState((prev) => ({
      batches: [...prev.batches, Object.assign({}, batch, { id: uuid() })],
    }));
  }

  function updateBatch(id, data) {
    setState((prev) => {
      const oldBatch = prev.batches.find((b) => b.id === id);
      const updatedBatches = prev.batches.map((b) => (b.id === id ? Object.assign({}, b, data) : b));
      const updatedBatch = updatedBatches.find((b) => b.id === id);
      return {
        batches: updatedBatches,
        scheduleNodes: prev.scheduleNodes.map((node) => {
          const matchesById = node.data.batchId === id;
          const matchesLegacy = oldBatch && !node.data.batchId && node.data.name === oldBatch.name && node.data.subject === oldBatch.subject;
          if (matchesById || matchesLegacy) {
            return Object.assign({}, node, {
              data: Object.assign({}, node.data, {
                name: (updatedBatch && updatedBatch.name) || node.data.name,
                subject: (updatedBatch && updatedBatch.subject) || node.data.subject,
                time: (updatedBatch && updatedBatch.time) || node.data.time,
              }),
            });
          }
          return node;
        }),
      };
    });
  }

  function deleteBatch(id) {
    setState((prev) => {
      const removedStudentIds = new Set(prev.students.filter((s) => s.batchId === id).map((s) => s.id));
      return {
        batches: prev.batches.filter((b) => b.id !== id),
        students: prev.students.filter((s) => s.batchId !== id),
        fees: prev.fees.filter((f) => {
          const student = prev.students.find((s) => s.id === f.studentId);
          return !student || student.batchId !== id;
        }),
        attendance: prev.attendance.filter((a) => a.batchId !== id),
        tests: prev.tests.filter((t) => t.batchId !== id),
        homework: prev.homework.filter((hw) => hw.batchId !== id),
        syllabusEntries: (prev.syllabusEntries || []).filter((e) => e.batchId !== id),
        studentNotes: prev.studentNotes.filter((n) => !removedStudentIds.has(n.studentId)),
        communicationLog: prev.communicationLog.filter((c) => !removedStudentIds.has(c.studentId)),
        scheduleNodes: prev.scheduleNodes.filter((node) => node.data.batchId !== id),
        scheduleEdges: prev.scheduleEdges.filter((edge) => {
          const sourceNode = prev.scheduleNodes.find((n) => n.id === edge.source);
          const targetNode = prev.scheduleNodes.find((n) => n.id === edge.target);
          return (!sourceNode || sourceNode.data.batchId !== id) && (!targetNode || targetNode.data.batchId !== id);
        }),
      };
    });
  }

  // ---- Students ----
  function addStudent(student) {
    const studentId = uuid();
    const newStudent = Object.assign({}, student, { id: studentId });
    setState((prev) => {
      const generatedFees = [];
      if (prev.autoGenerateFees) {
        const joinDate = parseYMDLocal(student.joinDate);
        for (let i = 0; i < 12; i++) {
          const feeDate = new Date(joinDate.getFullYear(), joinDate.getMonth() + i, 1);
          const monthStr = `${feeDate.getFullYear()}-${pad2(feeDate.getMonth() + 1)}`;
          generatedFees.push({
            id: uuid(),
            studentId,
            month: monthStr,
            amount: student.feeAmount,
            status: 'Pending',
          });
        }
      }
      return {
        students: [...prev.students, newStudent],
        fees: [...prev.fees, ...generatedFees],
      };
    });
  }

  function updateStudent(id, data) {
    setState((prev) => ({
      students: prev.students.map((s) => (s.id === id ? Object.assign({}, s, data) : s)),
    }));
  }

  function deleteStudent(id) {
    setState((prev) => ({
      students: prev.students.filter((s) => s.id !== id),
      fees: prev.fees.filter((f) => f.studentId !== id),
      attendance: prev.attendance.filter((a) => a.studentId !== id),
      tests: prev.tests.map((t) => Object.assign({}, t, { scores: (t.scores || []).filter((sc) => sc.studentId !== id) })),
      homework: prev.homework.map((hw) => Object.assign({}, hw, { doneBy: (hw.doneBy || []).filter((sid) => sid !== id) })),
      studentNotes: prev.studentNotes.filter((n) => n.studentId !== id),
      communicationLog: prev.communicationLog.filter((c) => c.studentId !== id),
    }));
  }

  // Present in original store API though not wired to any component (kept for parity/future use)
  function updateStudentFeeAmount(id, newAmount) {
    setState((prev) => ({
      students: prev.students.map((s) => (s.id === id ? Object.assign({}, s, { feeAmount: newAmount }) : s)),
      fees: prev.fees.map((f) => (f.studentId === id && f.status === 'Pending' ? Object.assign({}, f, { amount: newAmount }) : f)),
    }));
  }

  // ---- Fees ----
  function addFeeRecord(fee) {
    setState((prev) => ({
      fees: [...prev.fees, Object.assign({}, fee, { id: uuid() })],
    }));
  }

  function updateFeeStatus(id, status) {
    setState((prev) => ({
      fees: prev.fees.map((f) =>
        f.id === id ? Object.assign({}, f, { status, paidDate: status === 'Paid' ? new Date().toISOString() : undefined }) : f
      ),
    }));
  }

  function updateFeeRecord(id, updates) {
    setState((prev) => ({
      fees: prev.fees.map((f) => (f.id === id ? Object.assign({}, f, updates) : f)),
    }));
  }

  function deleteFeeRecord(id) {
    setState((prev) => ({
      fees: prev.fees.filter((f) => f.id !== id),
    }));
  }

  // ---- Expenses (new) ----
  function addExpense(expense) {
    setState((prev) => ({
      expenses: [...(prev.expenses || []), Object.assign({}, expense, { id: uuid() })],
    }));
  }

  function updateExpense(id, data) {
    setState((prev) => ({
      expenses: (prev.expenses || []).map((e) => (e.id === id ? Object.assign({}, e, data) : e)),
    }));
  }

  function deleteExpense(id) {
    setState((prev) => ({
      expenses: (prev.expenses || []).filter((e) => e.id !== id),
    }));
  }

  // ---- Weak topics (new) — revision tracker surfaced from Academics/Syllabus ----
  function addWeakTopic(entry) {
    setState((prev) => ({
      weakTopics: [...(prev.weakTopics || []), Object.assign({}, entry, { id: uuid(), resolved: false })],
    }));
  }

  function toggleWeakTopicResolved(id) {
    setState((prev) => ({
      weakTopics: (prev.weakTopics || []).map((w) => (w.id === id ? Object.assign({}, w, { resolved: !w.resolved }) : w)),
    }));
  }

  function deleteWeakTopic(id) {
    setState((prev) => ({
      weakTopics: (prev.weakTopics || []).filter((w) => w.id !== id),
    }));
  }

  // ---- Free slots (legacy/unused by any UI, preserved for fidelity) ----
  function addFreeSlot(slot) {
    setState((prev) => ({
      freeSlots: [...prev.freeSlots, Object.assign({}, slot, { id: uuid() })],
    }));
  }

  function deleteFreeSlot(id) {
    setState((prev) => ({
      freeSlots: prev.freeSlots.filter((s) => s.id !== id),
    }));
  }

  // ---- Attendance ----
  function markAttendance(studentId, batchId, date, status) {
    setState((prev) => {
      const existingIndex = prev.attendance.findIndex((a) => a.studentId === studentId && a.date === date);
      if (existingIndex >= 0) {
        const newAttendance = prev.attendance.slice();
        newAttendance[existingIndex] = Object.assign({}, newAttendance[existingIndex], { status });
        return { attendance: newAttendance };
      }
      return {
        attendance: [...prev.attendance, { id: uuid(), studentId, batchId, date, status }],
      };
    });
  }

  // ---- Schedule (custom flow) ----
  function onNodesChange(changes) {
    // changes: array of { id, position } for drag moves, or { id, type: 'remove' }
    setState((prev) => {
      let nodes = prev.scheduleNodes;
      changes.forEach((change) => {
        if (change.type === 'remove') {
          nodes = nodes.filter((n) => n.id !== change.id);
        } else if (change.type === 'position') {
          nodes = nodes.map((n) => (n.id === change.id ? Object.assign({}, n, { position: change.position }) : n));
        }
      });
      return { scheduleNodes: nodes };
    });
  }

  function onEdgesChange(changes) {
    setState((prev) => {
      let edges = prev.scheduleEdges;
      changes.forEach((change) => {
        if (change.type === 'remove') {
          edges = edges.filter((e) => e.id !== change.id);
        }
      });
      return { scheduleEdges: edges };
    });
  }

  function onConnect(connection) {
    if (!connection.source || !connection.target) return;
    if (connection.source === connection.target) return; // no self loops
    setState((prev) => {
      // avoid exact duplicate edges
      const exists = prev.scheduleEdges.some(
        (e) => e.source === connection.source && e.target === connection.target
      );
      if (exists) return {};
      const newEdge = {
        id: `edge_${connection.source}_${connection.target}_${Date.now()}`,
        source: connection.source,
        target: connection.target,
        type: 'custom',
        animated: true,
      };
      return { scheduleEdges: [...prev.scheduleEdges, newEdge] };
    });
  }

  function addScheduleNode(node) {
    setState((prev) => ({
      scheduleNodes: [...prev.scheduleNodes, node],
    }));
  }

  function clearSchedule() {
    setState(() => ({ scheduleNodes: [], scheduleEdges: [] }));
  }

  // ---- Tests / Marks ----
  function addTest(test) {
    setState((prev) => ({
      tests: [...prev.tests, Object.assign({}, test, { id: uuid() })],
    }));

  function updateTest(id, data) {

    }));
  }

  function deleteTest(id) {
    setState((prev) => ({
      tests: prev.tests.filter((t) => t.id !== id),
    }));
  }

  // ---- Homework ----
  function addHomework(hw) {
    setState((prev) => ({
      homework: [...prev.homework, Object.assign({}, hw, { id: uuid() })],
    }));
  }

  function updateHomework(id, data) {
    setState((prev) => ({
      homework: prev.homework.map((hw) => (hw.id === id ? Object.assign({}, hw, data) : hw)),
    }));
  }

  function deleteHomework(id) {
    setState((prev) => ({
      homework: prev.homework.filter((hw) => hw.id !== id),
    }));
  }

  function toggleHomeworkStudentDone(homeworkId, studentId) {
    setState((prev) => ({
      homework: prev.homework.map((hw) => {
        if (hw.id !== homeworkId) return hw;
        const done = hw.doneBy || [];
        const isDone = done.includes(studentId);
        return Object.assign({}, hw, {
          doneBy: isDone ? done.filter((id) => id !== studentId) : [...done, studentId],
        });
      }),
    }));
  }

  // ---- Syllabus / topics covered ----
  function addSyllabusEntry(entry) {
    setState((prev) => ({
      syllabusEntries: [...(prev.syllabusEntries || []), Object.assign({}, entry, { id: uuid() })],
    }));
  }

  function deleteSyllabusEntry(id) {
    setState((prev) => ({
      syllabusEntries: (prev.syllabusEntries || []).filter((e) => e.id !== id),
    }));
  }

  // ---- Student Notes ----
  function addStudentNote(note) {
    setState((prev) => ({
      studentNotes: [...prev.studentNotes, Object.assign({}, note, { id: uuid(), createdAt: new Date().toISOString() })],
    }));
  }

  function deleteStudentNote(id) {
    setState((prev) => ({
      studentNotes: prev.studentNotes.filter((n) => n.id !== id),
    }));
  }

  // ---- Communication Log ----
  function addCommunicationLog(entry) {
    setState((prev) => ({
      communicationLog: [...prev.communicationLog, Object.assign({}, entry, { id: uuid(), createdAt: new Date().toISOString() })],
    }));
  }

  function deleteCommunicationLog(id) {
    setState((prev) => ({
      communicationLog: prev.communicationLog.filter((c) => c.id !== id),
    }));
  }

  function clearAllData() {
    setState((prev) => Object.assign({}, initialState, {
      teacherName: prev.teacherName,
      currency: prev.currency,
      autoGenerateFees: prev.autoGenerateFees,
      dashboardTimeStart: prev.dashboardTimeStart,
      dashboardTimeEnd: prev.dashboardTimeEnd,
      freeTimeStart: prev.freeTimeStart,
      freeTimeEnd: prev.freeTimeEnd,
      lowAttendanceThreshold: prev.lowAttendanceThreshold,
      feeOverdueDays: prev.feeOverdueDays,
    }));
  }

  function importData(importedState) {
    setState((prev) => {
      const merged = Object.assign({}, initialState, prev);
      // Merge arrays by concatenation with fresh IDs where collision risk exists,
      // and shallow-merge scalar settings only if the import explicitly provides them.
      const arrayKeys = ['batches', 'students', 'fees', 'freeSlots', 'attendance', 'scheduleNodes', 'scheduleEdges', 'tests', 'homework', 'studentNotes', 'communicationLog', 'syllabusEntries', 'expenses', 'weakTopics'];
      const next = Object.assign({}, merged);
      arrayKeys.forEach((key) => {
        if (Array.isArray(importedState[key])) {
          next[key] = importedState[key];
        }
      });
      ['teacherName', 'currency', 'autoGenerateFees', 'dashboardTimeStart', 'dashboardTimeEnd', 'freeTimeStart', 'freeTimeEnd', 'lowAttendanceThreshold', 'feeOverdueDays', 'feeReminderDaysBefore', 'whatsappCountryCode'].forEach((key) => {
        if (importedState[key] !== undefined) next[key] = importedState[key];
      });
      return next;
    });
  }

  function updateSettings(settings) {
    setState(() => settings);
  }

  return {
    getState,
    subscribe,
    addBatch,
    updateBatch,
    deleteBatch,
    addStudent,
    updateStudent,
    updateStudentFeeAmount,
    deleteStudent,
    addFeeRecord,
    updateFeeStatus,
    updateFeeRecord,
    deleteFeeRecord,
    addFreeSlot,
    deleteFreeSlot,
    markAttendance,
    onNodesChange,
    onEdgesChange,
    onConnect,
    addScheduleNode,
    clearSchedule,
    clearAllData,
    updateSettings,
    addTest,
    updateTest,
    deleteTest,
    addHomework,
    updateHomework,
    deleteHomework,
    toggleHomeworkStudentDone,
    addSyllabusEntry,
    deleteSyllabusEntry,
    addStudentNote,
    deleteStudentNote,
    addCommunicationLog,
    deleteCommunicationLog,
    importData,
    addExpense,
    updateExpense,
    deleteExpense,
    addWeakTopic,
    toggleWeakTopicResolved,
    deleteWeakTopic,
  };
})();


// ---- 03-sidebar.js ----
/* ==========================================================================
   Sidebar — port of src/components/Sidebar.tsx
   ========================================================================== */

const Sidebar = (function () {
  let isOpen = false;
  let isCollapsed = false;

  function template(activeTab, teacherName, navBadges) {
    const badges = navBadges || {};
    const navHtml = App.NAV_ITEMS.map((item) => {
      const isActive = activeTab === item.id;
      const badgeCount = badges[item.id] || 0;
      return `
        <button class="nav-item ${isActive ? 'active' : ''}" data-tab="${item.id}" title="${isCollapsed ? escapeHtml(item.label) : ''}">
          ${isActive ? '<div class="nav-item-bg"></div>' : ''}
          <span class="nav-item-icon">${icon(item.icon, '')}</span>
          <span class="nav-item-label">${escapeHtml(item.label)}</span>
          ${badgeCount > 0 ? `<span class="nav-item-badge">${badgeCount > 99 ? '99+' : badgeCount}</span>` : ''}
        </button>
      `;
    }).join('');

    const initial = teacherName ? teacherName.charAt(0).toUpperCase() : 'T';

    return `
      <div class="mobile-header">
        <h1 class="mobile-header-title">TutorSync</h1>
        <button class="mobile-header-btn" id="mobile-menu-btn">${icon('Menu', '', 'width="24" height="24"')}</button>
      </div>

      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <div class="sidebar ${isOpen ? 'open' : ''} ${isCollapsed ? 'collapsed' : ''}" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-header-title-wrap">
            <h1 class="sidebar-title">TutorSync</h1>
            <p class="sidebar-subtitle">Management</p>
          </div>
          <button class="sidebar-close-btn" id="sidebar-close-btn">${icon('X', '', 'width="24" height="24"')}</button>
          <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="${isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'}">
            ${isCollapsed ? icon('PanelLeftOpen', '', 'width="24" height="24"') : icon('PanelLeftClose', '', 'width="24" height="24"')}
          </button>
        </div>

        <nav class="sidebar-nav">
          ${navHtml}
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-profile">
            <div class="sidebar-avatar">${escapeHtml(initial)}</div>
            <div class="sidebar-profile-info">
              <p class="sidebar-profile-name">${escapeHtml(teacherName || 'Teacher Profile')}</p>
              <p class="sidebar-profile-plan">Pro Plan</p>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function mount(setActiveTab) {
    const menuBtn = document.getElementById('mobile-menu-btn');
    const closeBtn = document.getElementById('sidebar-close-btn');
    const overlay = document.getElementById('sidebar-overlay');
    const collapseBtn = document.getElementById('sidebar-collapse-btn');
    const sidebarEl = document.getElementById('sidebar');

    function openMobile() {
      isOpen = true;
      sidebarEl.classList.add('open');
      overlay.classList.add('open');
    }
    function closeMobile() {
      isOpen = false;
      sidebarEl.classList.remove('open');
      overlay.classList.remove('open');
    }

    if (menuBtn) menuBtn.addEventListener('click', openMobile);
    if (closeBtn) closeBtn.addEventListener('click', closeMobile);
    if (overlay) overlay.addEventListener('click', closeMobile);
    if (collapseBtn) {
      collapseBtn.addEventListener('click', () => {
        isCollapsed = !isCollapsed;
        sidebarEl.classList.toggle('collapsed', isCollapsed);
        collapseBtn.title = isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar';
        collapseBtn.innerHTML = isCollapsed ? icon('PanelLeftOpen', '', 'width="24" height="24"') : icon('PanelLeftClose', '', 'width="24" height="24"');
      });
    }

    sidebarEl.querySelectorAll('.nav-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        setActiveTab(tab);
        closeMobile();
      });
    });
  }

  return { template, mount };
})();


// ---- 04-widget-select.js ----
/* ==========================================================================
   Widget: Custom Select — port of src/components/CustomSelect.tsx
   Usage: Widgets.customSelect({ value, options: [{value,label}], placeholder, className, onChange })
   Returns a DOM element (the trigger container). The dropdown is portaled to <body>.
   ========================================================================== */

const Widgets = (function () {
  let openDropdownCloser = null; // tracks currently-open dropdown so only one is open at a time

  function closeAnyOpenDropdown() {
    if (openDropdownCloser) {
      openDropdownCloser();
      openDropdownCloser = null;
    }
  }

  function customSelect(opts) {
    const { options, placeholder = 'Select...', className = '', onChange } = opts;
    let value = opts.value;

    const container = h('div', { class: `csel ${className}` });
    const trigger = h('button', { type: 'button', class: 'csel-trigger' });
    container.appendChild(trigger);

    let isOpen = false;
    let dropdownEl = null;
    let resizeHandler = null;
    let scrollHandler = null;
    let outsideClickHandler = null;

    function selectedLabel() {
      const opt = options.find((o) => o.value === value);
      return opt ? opt.label : null;
    }

    function renderTrigger() {
      const label = selectedLabel();
      trigger.classList.toggle('open', isOpen);
      trigger.innerHTML = `
        <span class="csel-trigger-label ${label ? '' : 'placeholder'}">${escapeHtml(label || placeholder)}</span>
        ${icon('ChevronDown', '')}
      `;
    }

    function updatePosition() {
      if (!dropdownEl) return;
      const rect = trigger.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const showAbove = spaceBelow < 200 && rect.top > 200;
      let left = rect.left;
      const dropdownWidth = rect.width;
      if (left + dropdownWidth > window.innerWidth - 16) left = window.innerWidth - dropdownWidth - 16;
      if (left < 16) left = 16;

      dropdownEl.style.left = left + 'px';
      dropdownEl.style.width = rect.width + 'px';
      if (showAbove) {
        dropdownEl.style.top = 'auto';
        dropdownEl.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      } else {
        dropdownEl.style.top = (rect.bottom + 8) + 'px';
        dropdownEl.style.bottom = 'auto';
      }
    }

    function openDropdown() {
      closeAnyOpenDropdown();
      isOpen = true;
      renderTrigger();

      dropdownEl = h('div', { class: 'csel-dropdown' });
      const list = h('div', { class: 'csel-list custom-scrollbar' });
      if (options.length === 0) {
        list.appendChild(h('div', { class: 'csel-empty' }, 'No options available'));
      } else {
        options.forEach((opt) => {
          const optBtn = h('button', {
            type: 'button',
            class: `csel-opt ${value === opt.value ? 'selected' : ''}`,
          }, opt.label);
          optBtn.addEventListener('click', () => {
            value = opt.value;
            renderTrigger();
            closeDropdown();
            if (onChange) onChange(value);
          });
          list.appendChild(optBtn);
        });
      }
      dropdownEl.appendChild(list);
      document.body.appendChild(dropdownEl);
      updatePosition();

      resizeHandler = () => updatePosition();
      scrollHandler = () => updatePosition();
      window.addEventListener('resize', resizeHandler);
      window.addEventListener('scroll', scrollHandler, true);

      outsideClickHandler = (e) => {
        if (!container.contains(e.target) && dropdownEl && !dropdownEl.contains(e.target)) {
          closeDropdown();
        }
      };
      // Defer attaching to avoid catching the same click that opened it
      setTimeout(() => document.addEventListener('mousedown', outsideClickHandler), 0);

      openDropdownCloser = closeDropdown;
    }

    function closeDropdown() {
      isOpen = false;
      renderTrigger();
      if (dropdownEl && dropdownEl.parentNode) dropdownEl.parentNode.removeChild(dropdownEl);
      dropdownEl = null;
      if (resizeHandler) window.removeEventListener('resize', resizeHandler);
      if (scrollHandler) window.removeEventListener('scroll', scrollHandler, true);
      if (outsideClickHandler) document.removeEventListener('mousedown', outsideClickHandler);
      resizeHandler = scrollHandler = outsideClickHandler = null;
      if (openDropdownCloser === closeDropdown) openDropdownCloser = null;
    }

    trigger.addEventListener('click', () => {
      if (isOpen) closeDropdown();
      else openDropdown();
    });

    renderTrigger();

    // Expose a setter so callers can programmatically update value (e.g. after external state change)
    container.setValue = function (v) {
      value = v;
      renderTrigger();
    };
    container.setOptions = function (newOptions) {
      options.length = 0;
      newOptions.forEach((o) => options.push(o));
      if (isOpen) { closeDropdown(); openDropdown(); }
    };

    return container;
  }

  return { customSelect, closeAnyOpenDropdown, get _setOpenCloser() { return openDropdownCloser; }, _setOpenCloserSet: (fn) => { openDropdownCloser = fn; } };
})();

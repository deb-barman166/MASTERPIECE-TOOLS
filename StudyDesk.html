function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ const MS=86400000; const da=new Date(a); const db=new Date(b); da.setHours(0,0,0,0); db.setHours(0,0,0,0); return Math.round((db-da)/MS); }
function addDays(dateStr,n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString(); }
function fmtDate(iso,opts){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString(undefined, opts||{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return '—'; } }
function fmtTime(sec){
  sec = Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function esc(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function stripHtml(str){ const d=document.createElement('div'); d.innerHTML=str||''; return d.textContent||''; }
function clamp(n,min,max){ return Math.min(max,Math.max(min,n)); }
function debounce(fn,ms){ let t; return function(){ const a=arguments,ctx=this; clearTimeout(t); t=setTimeout(function(){fn.apply(ctx,a);},ms); }; }
function pct(part,total){ if(!total) return 0; return Math.round((part/total)*100); }
function truncate(str,n){ str=str||''; return str.length>n ? str.slice(0,n).trim()+'…' : str; }
function fileDownload(filename,content,mime){
  const blob = new Blob([content],{type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function toCSV(rows,headers){
  const lines=[headers.map(csvEscape).join(',')];
  rows.forEach(function(r){ lines.push(headers.map(function(h){return csvEscape(r[h]);}).join(',')); });
  return lines.join('\n');
}
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else {inQ=false;} }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(function(h){return h.trim();});
  return rows.slice(1).filter(function(r){return r.some(function(x){return x&&x.trim()!=='';});}).map(function(r){
    const obj={}; headers.forEach(function(h,i){obj[h]=r[i]!==undefined?r[i]:'';}); return obj;
  });
}

/* ---------------------------------------------------------
   INDEXEDDB LAYER
--------------------------------------------------------- */
const DB_NAME='studydesk_db';
const DB_VERSION=6;
const STORES=['settings','subjects','topics','questions','flashcardDecks','flashcards','notes','quizzes','attempts','mistakes','revisions','studySessions','achievements','plannerTasks','questionGroups','noteGroups','audioPlaylists','questionPapers','quickAddTemplates'];
let _db=null;

/* v2: openDB now self-heals. Some Android WebViews intermittently fail to open
   an IndexedDB connection (low storage, battery saver, a half-upgraded DB from
   a crashed prior session). Previously any such failure permanently broke DB.ready,
   which made EVERY view — Practice included — hit the generic "Something went
   wrong" screen on load, since every renderer awaits a DB call. This version
   retries once with a fresh connection before giving up. */
function openDB(attempt){
  attempt = attempt||1;
  return new Promise(function(resolve,reject){
    if(_db) return resolve(_db);
    let req;
    try{ req = indexedDB.open(DB_NAME,DB_VERSION); }
    catch(syncErr){ reject(syncErr); return; }
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      STORES.forEach(function(name){
        if(!db.objectStoreNames.contains(name)){
          const store = db.createObjectStore(name,{keyPath:'id'});
          if(name!=='settings'){ store.createIndex('updatedAt','updatedAt',{unique:false}); }
        }
      });
    };
    req.onsuccess = function(e){ _db=e.target.result;
      _db.onversionchange = function(){ try{_db.close();}catch(e2){} _db=null; };
      resolve(_db);
    };
    req.onblocked = function(){ /* another tab holds an old version open; surfaced via timeout below */ };
    req.onerror = function(e){
      if(attempt<2){
        setTimeout(function(){ openDB(2).then(resolve).catch(reject); },250);
      } else {
        reject(e.target.error || new Error('IndexedDB failed to open'));
      }
    };
  });
}
window.SD_dbHealthCheck = function(){ return !!_db; };

const DB = {
  ready: openDB(),
  async all(store){
    await this.ready;
    return new Promise(function(resolve,reject){
      const tx=_db.transaction(store,'readonly');
      const req=tx.objectStore(store).getAll();
      req.onsuccess=function(){resolve(req.result||[]);};
      req.onerror=function(){reject(req.error);};
    });
  },
  async get(store,id){
    await this.ready;
    return new Promise(function(resolve,reject){
      const tx=_db.transaction(store,'readonly');
      const req=tx.objectStore(store).get(id);
      req.onsuccess=function(){resolve(req.result||null);};
      req.onerror=function(){reject(req.error);};
    });
  },
  async put(store,obj){
    await this.ready;
    if(!obj.id) obj.id=uid();
    obj.updatedAt = nowISO();
    if(!obj.createdAt) obj.createdAt = obj.updatedAt;
    return new Promise(function(resolve,reject){
      const tx=_db.transaction(store,'readwrite');
      tx.objectStore(store).put(obj);
      tx.oncomplete=function(){resolve(obj);};
      tx.onerror=function(){reject(tx.error);};
    });
  },
  async bulkPut(store,arr){
    await this.ready;
    return new Promise(function(resolve,reject){
      const tx=_db.transaction(store,'readwrite');
      const os=tx.objectStore(store);
      arr.forEach(function(obj){
        if(!obj.id) obj.id=uid();
        if(!obj.updatedAt) obj.updatedAt=nowISO();
        if(!obj.createdAt) obj.createdAt=obj.updatedAt;
        os.put(obj);
      });
      tx.oncomplete=function(){resolve(arr);};
      tx.onerror=function(){reject(tx.error);};
    });
  },
  async delete(store,id){
    await this.ready;
    return new Promise(function(resolve,reject){
      const tx=_db.transaction(store,'readwrite');
      tx.objectStore(store).delete(id);
      tx.oncomplete=function(){resolve(true);};
      tx.onerror=function(){reject(tx.error);};
    });
  },
  async clear(store){
    await this.ready;
    return new Promise(function(resolve,reject){
      const tx=_db.transaction(store,'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete=function(){resolve(true);};
      tx.onerror=function(){reject(tx.error);};
    });
  },
  async clearAll(){
    for(const s of STORES) await this.clear(s);
  },
  async exportAll(){
    const data={};
    for(const s of STORES){ data[s]= s==='settings' ? await this.all(s) : await this.all(s); }
    return {app:'StudyDesk',version:DB_VERSION,exportedAt:nowISO(),data:data};
  },
  async importAll(payload){
    if(!payload || !payload.data) throw new Error('Invalid backup file');
    for(const s of STORES){
      if(Array.isArray(payload.data[s]) && payload.data[s].length){
        await this.bulkPut(s,payload.data[s]);
      }
    }
    return true;
  }
};
window.DB = DB;

    (opts.actionLabel? '<button class="toast-action" type="button">'+svgIcon('refresh',13)+' '+opts.actionLabel+'</button>':'')+
    '<button class="toast-close" aria-label="Dismiss">'+svgIcon('x',14)+'</button>';
  el.querySelector('.msg').textContent = msg;
  toastStack.appendChild(el);
  const remove = function(){
    if(!el.parentNode) return;
    el.classList.add('leaving');
    setTimeout(function(){ el.remove(); },160);
  };
  el.querySelector('.toast-close').addEventListener('click',remove);
  if(opts.actionLabel && opts.onAction){
    const actionBtn = el.querySelector('.toast-action');
    actionBtn.addEventListener('click',function(){ opts.onAction(); remove(); });
  }
  const dur = opts.duration || (opts.actionLabel ? 6000 : 3400);
  setTimeout(remove,dur);
  return el;
}

  State.subjects.forEach(function(s){ idx.push({type:'Subject',icon:'book',title:s.name,meta:'Subject',action:function(){navigate('questionbank',{subjectFilter:s.name});}}); });
  State.topics.forEach(function(t){ idx.push({type:'Topic',icon:'compass',title:t.name,meta:t.subject||'',action:function(){navigate('questionbank',{topicFilter:t.name});}}); });

function openCmdk(){
  cmdkItems = baseCommands();

function renderCmdkList(q){
  q=(q||'').toLowerCase();
  const filtered = cmdkItems.filter(function(c){ return c.label.toLowerCase().includes(q); });
  if(!filtered.length){ cmdkList.innerHTML='<div class="cmdk-empty">No matching commands</div>'; return; }
  const groups={};
  filtered.forEach(function(c){ (groups[c.group]=groups[c.group]||[]).push(c); });
  let html=''; let flatIndex=0; const flat=[];
  Object.keys(groups).forEach(function(g){
    html+='<div class="cmdk-group-label">'+g+'</div>';
    groups[g].forEach(function(c){
      flat.push(c);
      html+='<div class="cmdk-item'+(flatIndex===cmdkSelected?' selected':'')+'" data-i="'+flatIndex+'"><span class="ic">'+U.svgIcon(c.icon,15)+'</span><span>'+c.label+'</span></div>';
      flatIndex++;
    });
  });
  cmdkList.innerHTML = html;
  cmdkList.querySelectorAll('.cmdk-item').forEach(function(el){
    el.addEventListener('click',function(){ flat[parseInt(el.dataset.i,10)].run(); closeCmdk(); });
  });

}

document.addEventListener('keydown',function(e){
  const mod = e.ctrlKey||e.metaKey;
  if(mod && (e.key==='k'||e.key==='K')){ e.preventDefault(); openGlobalSearch(); return; }
  if(mod && e.key==='/'){ e.preventDefault(); if(cmdkOverlay.classList.contains('open')) closeCmdk(); else openCmdk(); return; }
  if(cmdkOverlay.classList.contains('open')){
    const flat = cmdkList._flat||[];
    if(e.key==='Escape'){ closeCmdk(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); cmdkSelected=Math.min(flat.length-1,cmdkSelected+1); renderCmdkList(cmdkInput.value); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkSelected=Math.max(0,cmdkSelected-1); renderCmdkList(cmdkInput.value); }
    else if(e.key==='Enter'){ e.preventDefault(); if(flat[cmdkSelected]){ flat[cmdkSelected].run(); closeCmdk(); } }
    return;
  }
  // Global shortcuts (only when not typing in a field)
  const tag = (document.activeElement && document.activeElement.tagName)||'';
  if(['INPUT','TEXTAREA','SELECT'].includes(tag)) return;
  if(e.key==='g'){ window.__sd_gpending = true; setTimeout(function(){window.__sd_gpending=false;},900); return; }
  if(window.__sd_gpending){
    const map={t:'today',d:'dashboard',q:'questionbank',f:'flashcards',n:'notes',p:'practice',a:'analytics',r:'revision',s:'settings',l:'planner'};
    if(map[e.key]){ navigate(map[e.key]); }
    window.__sd_gpending=false;
  }
});

--------------------------------------------------------- */
function xpForLevel(level){ return Math.round(100 * Math.pow(level,1.5)); }
function awardXP(amount,reason){
  State.settings.xp = (State.settings.xp||0) + amount;
  let leveledUp=false;
  while(State.settings.xp >= xpForLevel(State.settings.level||1)){
    State.settings.xp -= xpForLevel(State.settings.level||1);
    State.settings.level = (State.settings.level||1)+1;
    leveledUp=true;
  }
  persistSettings();
  if(leveledUp) toast('Level up! You reached Level '+State.settings.level,'success');
  return leveledUp;
}
window.awardXP = awardXP;
window.xpForLevel = xpForLevel;

function bumpStreak(){
  const today = U.todayKey();
  const last = State.settings.lastStudyDate;
  if(last===today) return; // already counted today
  if(last){
    const diff = U.daysBetween(last,new Date().toISOString());
    if(diff===1){ State.settings.streak = (State.settings.streak||0)+1; }
    else if(diff>1){ State.settings.streak = 1; }
  } else {
    State.settings.streak = 1;
  }
  State.settings.lastStudyDate = today;
  persistSettings();
  const sv=document.getElementById('sidebarStreakVal');
  if(sv) sv.textContent = State.settings.streak;
}

function buildHeatmap(weeks){
  weeks = weeks||18;

  State.studySessions.forEach(function(s){ counts[s.dateKey]=(counts[s.dateKey]||0)+1; });
  State.attempts.forEach(function(a){ const k=U.todayKey(new Date(a.ts||a.createdAt)); counts[k]=(counts[k]||0)+1; });
  const end = new Date();
  const cells=[];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(end.getDate()-i);
    const key = U.todayKey(d);
    const n = counts[key]||0;
    let level = n===0?0:n<3?1:n<7?2:n<12?3:4;
    cells.push({key:key,level:level,count:n,date:d});
  }
  // pad to full weeks starting Sunday
  const firstDow = cells[0].date.getDay();
  const pad = [];
  for(let i=0;i<firstDow;i++) pad.push({key:'',level:-1,count:0});
  const full = pad.concat(cells);
  let html = '<div class="heatmap-grid">';
  full.forEach(function(c){
    if(c.level<0){ html+='<div class="hm-cell" style="background:transparent;"></div>'; return; }

function weakTopics(limit){

    map[key].total++;
    if(a.correct) map[key].correct++;

    .filter(function(t){ return t.total>=2; })

/* ============================================================
   STUDYDESK — QUESTION BANK
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

const QTYPES = [
  {id:'mcq',label:'Multiple Choice'},
  {id:'truefalse',label:'True / False'},
  {id:'fillblank',label:'Fill in the Blank'},
  {id:'shortanswer',label:'Short Answer'},
  {id:'longanswer',label:'Long Answer'}
];

let qbFilters = {search:'',subject:'',topic:'',difficulty:'',type:'',bookmarkOnly:false,sort:'newest'};

function getSubjectNames(){ return Array.from(new Set(State.subjects.map(function(s){return s.name;}))).sort(); }
function getTopicNames(subject){
  return Array.from(new Set(State.topics.filter(function(t){ return !subject || t.subject===subject; }).map(function(t){return t.name;}))).sort();
}
async function ensureSubject(name){
  if(!name) return;
  if(!State.subjects.find(function(s){return s.name.toLowerCase()===name.toLowerCase();})){
    const row = await DB.put('subjects',{id:U.uid(),name:name});
    State.subjects.push(row);
  }
}
async function ensureTopic(name,subject){
  if(!name) return;
  if(!State.topics.find(function(t){return t.name.toLowerCase()===name.toLowerCase() && t.subject===subject;})){
    const row = await DB.put('topics',{id:U.uid(),name:name,subject:subject||''});
    State.topics.push(row);
  }
}

function filteredQuestions(){
  let list = State.questions.slice();
  const f = qbFilters;
  if(f.search){
    const s = f.search.toLowerCase();
    list = list.filter(function(q){ return (U.stripHtml(q.text)||'').toLowerCase().includes(s) || (q.tags||[]).join(' ').toLowerCase().includes(s) || (q.subject||'').toLowerCase().includes(s) || (q.topic||'').toLowerCase().includes(s); });
  }
  if(f.subject) list = list.filter(function(q){return q.subject===f.subject;});
  if(f.topic) list = list.filter(function(q){return q.topic===f.topic;});
  if(f.difficulty) list = list.filter(function(q){return q.difficulty===f.difficulty;});
  if(f.type) list = list.filter(function(q){return q.type===f.type;});
  if(f.bookmarkOnly) list = list.filter(function(q){return q.bookmarked;});
  const sorters = {
    newest:function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);},
    oldest:function(a,b){return new Date(a.createdAt)-new Date(b.createdAt);},
    difficulty:function(a,b){ const order={easy:0,medium:1,hard:2}; return (order[a.difficulty]||0)-(order[b.difficulty]||0); },
    marks:function(a,b){return (b.marks||0)-(a.marks||0);},
    alpha:function(a,b){return U.stripHtml(a.text).localeCompare(U.stripHtml(b.text));}
  };
  list.sort(sorters[f.sort]||sorters.newest);
  return list;
}

/* ---------------- Question Groups (nested) ---------------- */
// A group is {id, name, parentGroupId, tags}. parentGroupId is null/undefined
// for a top-level group, or another group's id to nest under it - this is
// what makes "group of group" possible, unlike the flat flashcard deck list.
function topLevelQuestionGroups(){
  return State.questionGroups.filter(function(g){return !g.parentGroupId;}).sort(function(a,b){return a.name.localeCompare(b.name);});
}
function childQuestionGroups(parentId){
  return State.questionGroups.filter(function(g){return g.parentGroupId===parentId;}).sort(function(a,b){return a.name.localeCompare(b.name);});
}
function questionGroupPath(groupId){
  const path = [];
  let current = State.questionGroups.find(function(g){return g.id===groupId;});
  let depth = 0;
  while(current && depth<20){
    path.unshift(current.name);
    current = current.parentGroupId ? State.questionGroups.find(function(g){return g.id===current.parentGroupId;}) : null;
    depth++;
  }
  return path;
}
function descendantGroupIds(groupId){
  const out = [groupId];
  let frontier = [groupId];
  let depth = 0;
  while(frontier.length && depth<20){
    const next = [];
    frontier.forEach(function(pid){
      childQuestionGroups(pid).forEach(function(c){ out.push(c.id); next.push(c.id); });
    });
    frontier = next;
    depth++;
  }
  return out;
}
function isDescendantOfQuestionGroup(candidateId,ancestorId){
  return descendantGroupIds(ancestorId).includes(candidateId);
}
function questionsInGroup(groupId,includeSubgroups){
  const ids = includeSubgroups ? descendantGroupIds(groupId) : [groupId];
  return State.questions.filter(function(q){return q.groupId && ids.includes(q.groupId);});
}
function questionGroupCounts(groupId){
  return {
    direct: State.questions.filter(function(q){return q.groupId===groupId;}).length,
    total: questionsInGroup(groupId,true).length
  };
}
async function saveQuestionGroup(payload){
  const row = await DB.put('questionGroups',payload);
  const i = State.questionGroups.findIndex(function(g){return g.id===row.id;});
  if(i>=0) State.questionGroups[i]=row; else State.questionGroups.push(row);
  return row;
}
async function deleteQuestionGroup(groupId,reassignTo){
  const childGroups = childQuestionGroups(groupId);
  for(const cg of childGroups){
    cg.parentGroupId = reassignTo || null;
    await DB.put('questionGroups',cg);
  }
  const childQuestions = State.questions.filter(function(q){return q.groupId===groupId;});
  for(const q of childQuestions){
    q.groupId = reassignTo || null;
    await DB.put('questions',q);
  }
  await DB.delete('questionGroups',groupId);
  State.questionGroups = State.questionGroups.filter(function(g){return g.id!==groupId;});
}

function diffDots(diff){
  const cls = 'diff-'+(diff||'medium');
  return '<span class="diff-dot '+cls+'"><span class="d1"></span><span class="d2"></span><span class="d3"></span></span>';
}
function typeLabel(t){ const m=QTYPES.find(function(x){return x.id===t;}); return m?m.label:t; }

function questionRow(q){
  const tagHtml = (q.tags||[]).map(function(t){return '<span class="tag">#'+U.esc(t)+'</span>';}).join('');
  return '<div class="list-row" data-qid="'+q.id+'">'+
    '<div class="list-row-main">'+
      '<div class="list-row-title">'+U.esc(U.truncate(U.stripHtml(q.text)||'(empty question)',90))+'</div>'+
      '<div class="list-row-meta">'+
        '<span class="tag">'+U.esc(q.subject||'—')+' › '+U.esc(q.topic||'—')+'</span>'+
        '<span class="tag">'+typeLabel(q.type)+'</span>'+
        diffDots(q.difficulty)+
        '<span>'+(q.marks||1)+' marks</span>'+
        (q.linkedNoteIds && q.linkedNoteIds.length ? '<span class="tag" title="Has linked note(s)">'+U.svgIcon('note',11)+' '+q.linkedNoteIds.length+'</span>' : '')+
        tagHtml+
      '</div>'+
    '</div>'+
    '<div class="list-row-actions">'+
      '<button class="icon-btn" data-act="bookmark" title="'+(q.bookmarked?'Remove bookmark':'Bookmark')+'" style="'+(q.bookmarked?'color:var(--amber-600);border-color:var(--amber-100);':'')+'">'+U.svgIcon('bookmark',14)+'</button>'+
      '<button class="icon-btn" data-act="dup" title="Duplicate">'+U.svgIcon('copy',14)+'</button>'+
      '<button class="icon-btn" data-act="edit" title="Edit">'+U.svgIcon('edit',14)+'</button>'+
      '<button class="icon-btn" data-act="del" title="Delete">'+U.svgIcon('trash',14)+'</button>'+
    '</div>'+
  '</div>';
}

/* ---------------- Group Mode ---------------- */
let qbGroupState = {currentGroupId:null, expanded:{}};
function groupTreeRow(group,depth){
  const counts = questionGroupCounts(group.id);
  const kids = childQuestionGroups(group.id);
  const isExpanded = !!qbGroupState.expanded[group.id];
  const isActive = qbGroupState.currentGroupId===group.id;
  let html = '<div class="qg-row'+(isActive?' active':'')+'" data-gid="'+group.id+'" style="padding-left:'+(depth*1.1)+'rem;">'+
    (kids.length ? '<button type="button" class="qg-toggle" data-gid="'+group.id+'">'+U.svgIcon(isExpanded?'chevron-down':'chevron-right',13)+'</button>' : '<span class="qg-toggle-spacer"></span>')+
    '<span class="qg-name" data-gid="'+group.id+'">'+U.svgIcon('folder',13)+' '+U.esc(group.name)+'</span>'+
    '<span class="qg-count">'+counts.direct+(counts.total!==counts.direct?' / '+counts.total:'')+'</span>'+
  '</div>';
  if(kids.length && isExpanded){
    html += kids.map(function(k){return groupTreeRow(k,depth+1);}).join('');
  }
  return html;
}
async function render(container,params){
  params = params||{};
  if(params.subjectFilter){ qbFilters.subject = params.subjectFilter; qbFilters.search=''; qbFilters.topic=''; qbFilters.bookmarkOnly=false; }
  if(params.topicFilter){ qbFilters.topic = params.topicFilter; }
  if(params.filterBookmark){ qbFilters.bookmarkOnly = true; qbFilters.search=''; qbFilters.subject=''; qbFilters.topic=''; }
  if(params.groupId!==undefined) qbGroupState.currentGroupId = params.groupId;
  const searchActive = !!(qbFilters.subject||qbFilters.topic||qbFilters.bookmarkOnly);
  const currentGroup = qbGroupState.currentGroupId ? State.questionGroups.find(function(g){return g.id===qbGroupState.currentGroupId;}) : null;
  const breadcrumb = currentGroup ? questionGroupPath(currentGroup.id) : [];
  const directSubgroups = childQuestionGroups(qbGroupState.currentGroupId);
  const directQuestions = State.questions.filter(function(q){return (q.groupId||null)===(qbGroupState.currentGroupId||null);});

  container.innerHTML =
  '<div class="view-head"><div><h1>Question Bank</h1><div class="sub">'+State.questionGroups.length+' group'+(State.questionGroups.length===1?'':'s')+' · '+State.questions.length+' questions</div></div>'+
  '<div class="view-head-actions">'+

function confirmDeleteQuestionGroup(groupId,container){
  const group = State.questionGroups.find(function(g){return g.id===groupId;});
  if(!group) return;
  const kids = childQuestionGroups(groupId);
  const directQ = State.questions.filter(function(q){return q.groupId===groupId;}).length;
  const parentName = group.parentGroupId ? (State.questionGroups.find(function(g){return g.id===group.parentGroupId;})||{}).name : null;
  const destination = parentName ? ('"'+parentName+'"') : 'the top level';
  const message = (kids.length||directQ)
    ? 'This group has '+kids.length+' subgroup(s) and '+directQ+' question(s) directly in it. They will all move up to '+destination+' rather than being deleted.'
    : 'This group is empty and will be removed.';
  confirmDialog({title:'Delete "'+group.name+'"?',message:message,danger:true,okText:'Delete group'}).then(function(ok){
    if(!ok) return;
    deleteQuestionGroup(groupId,group.parentGroupId).then(function(){
      qbGroupState.currentGroupId = group.parentGroupId || null;
      toast('Group deleted','info');
      render(container,{});
    });
  });
}

function openQuestionGroupModal(existingId,parentId){
  const existing = existingId ? State.questionGroups.find(function(g){return g.id===existingId;}) : null;
  const isEdit = !!existing;
  const effectiveParentId = isEdit ? existing.parentGroupId : parentId;
  const parentGroup = effectiveParentId ? State.questionGroups.find(function(g){return g.id===effectiveParentId;}) : null;
  const html = '<div class="modal-head"><h3>'+(isEdit?'Rename Group':'New Group')+'</h3><button class="icon-btn" data-modal-close>'+U.svgIcon('x',15)+'</button></div>'+
  '<div class="modal-body">'+
    (parentGroup ? '<p class="text-faint" style="font-size:.82rem;">Inside: '+U.esc(questionGroupPath(parentGroup.id).join(' › '))+'</p>' : '<p class="text-faint" style="font-size:.82rem;">Top-level group</p>')+
    '<div class="field"><label>Group name</label><input type="text" id="qgName" value="'+U.esc(existing?existing.name:'')+'" placeholder="e.g. Chapter 4 — Optics"></div>'+
  '</div>'+
  '<div class="modal-foot"><button class="btn btn-secondary" data-modal-close>Cancel</button><button class="btn btn-primary" id="qgSaveBtn">'+(isEdit?'Save':'Create Group')+'</button></div>';
  const wrap = openModal(html,{size:'sm'});
  wrap.querySelector('#qgSaveBtn').addEventListener('click',async function(){
    const name = wrap.querySelector('#qgName').value.trim();
    if(!name){ toast('Group name required','error'); return; }
    const payload = {id:existing?existing.id:undefined, name:name, parentGroupId: effectiveParentId||null, createdAt:existing?existing.createdAt:undefined};
    const row = await saveQuestionGroup(payload);
    toast(isEdit?'Group renamed':'Group created','success');
    closeModal();
    qbGroupState.currentGroupId = row.id;
    navigate('questionbank');
  });
}


async function duplicateQuestion(id){
  const q = State.questions.find(function(x){return x.id===id;});
  if(!q) return;
  const copy = Object.assign({},q,{id:U.uid(),text:q.text+' (copy)',bookmarked:false});
  delete copy.createdAt; delete copy.updatedAt;
  const row = await DB.put('questions',copy);
  State.questions.push(row);
  toast('Question duplicated','success');
}
async function deleteQuestion(id){
  const ok = await confirmDialog({title:'Delete question?',message:'This removes the question permanently. Related attempts and mistakes stay in your history.',danger:true,okText:'Delete'});
  if(!ok) return;
  const snapshot = State.questions.find(function(q){return q.id===id;});
  await DB.delete('questions',id);
  State.questions = State.questions.filter(function(q){return q.id!==id;});
  toast('Question deleted','info',{
    actionLabel:'Undo',
    onAction: async function(){
      if(!snapshot) return;
      await DB.put('questions',snapshot);
      State.questions.push(snapshot);
      toast('Question restored','success');
      if(State.currentView==='questionbank') navigate('questionbank');
    }
  });
}
async function toggleBookmark(id){
  const q = State.questions.find(function(x){return x.id===id;});
  if(!q) return;
  q.bookmarked = !q.bookmarked;
  await DB.put('questions',q);
}

      '<div class="field" style="flex:1;margin-bottom:0;"><input type="text" class="opt-text" placeholder="Option '+String.fromCharCode(65+i)+'" value="'+U.esc(opt.text!==undefined?opt.text:opt)+'"></div>'+
      '<button type="button" class="icon-btn" data-remove-opt style="margin-top:1.4rem;">'+U.svgIcon('x',14)+'</button>'+
    '</div>';
  }).join('');

    '</div>'+
    '<div class="field"><label>Question text</label><textarea id="qText" placeholder="Type the question…">'+U.esc(existing?existing.text:'')+'</textarea></div>'+
    '<div id="qTypeBody"></div>'+
    '<div class="field"><label>Explanation (shown after answering)</label><textarea id="qExplain" style="min-height:60px;" placeholder="Optional explanation">'+U.esc(existing?existing.explanation:'')+'</textarea></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Subject</label><input type="text" id="qSubject" list="qSubjectList" placeholder="e.g. Physics" value="'+U.esc(existing?existing.subject:'')+'"><datalist id="qSubjectList">'+getSubjectNames().map(function(s){return '<option value="'+U.esc(s)+'">';}).join('')+'</datalist></div>'+
      '<div class="field"><label>Chapter / Topic</label><input type="text" id="qTopic" list="qTopicList" placeholder="e.g. Optics" value="'+U.esc(existing?existing.topic:'')+'"><datalist id="qTopicList">'+getTopicNames().map(function(t){return '<option value="'+U.esc(t)+'">';}).join('')+'</datalist></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Difficulty</label><select id="qDifficulty"><option value="easy" '+(existing&&existing.difficulty==='easy'?'selected':'')+'>Easy</option><option value="medium" '+(!existing||existing.difficulty==='medium'?'selected':'')+'>Medium</option><option value="hard" '+(existing&&existing.difficulty==='hard'?'selected':'')+'>Hard</option></select></div>'+
      '<div class="field"><label>Marks</label><input type="number" id="qMarks" min="0" step="0.5" value="'+(existing?existing.marks:1)+'"></div>'+
    '</div>'+
    '<div class="field"><label>Tags (comma separated)</label><input type="text" id="qTags" placeholder="important, exam, formula" value="'+(existing&&existing.tags?existing.tags.join(', '):'')+'"></div>'+
    '<div class="field"><label>Linked notes <span class="text-faint" style="font-weight:400;">(shown alongside this question during practice &amp; revision)</span></label>'+
      '<div id="qLinkedNotes" class="sd2-tag-picker"></div>'+
    '</div>'+
    (State.questionGroups.length ? '<div class="field"><label>Group</label><select id="qGroupSelect"><option value="">No group</option>'+
      State.questionGroups.slice().sort(function(a,b){return questionGroupPath(a.id).join(' › ').localeCompare(questionGroupPath(b.id).join(' › '));}).map(function(g){
        return '<option value="'+g.id+'" '+(effectiveGroupId===g.id?'selected':'')+'>'+U.esc(questionGroupPath(g.id).join(' › '))+'</option>';
      }).join('')+'</select></div>' : '')+
    '<label class="checkbox-row"><input type="checkbox" id="qBookmark" '+(existing&&existing.bookmarked?'checked':'')+'><span style="font-size:.85rem;">Bookmark this question</span></label>'+
  '</div>'+
  '<div class="modal-foot"><button class="btn btn-secondary" data-modal-close>Cancel</button><button class="btn btn-primary" id="qSaveBtn">'+U.svgIcon('check',15)+' Save Question</button></div>';

  const wrap = openModal(html,{size:'lg'});
  const typeBody = wrap.querySelector('#qTypeBody');

  function renderTypeBody(t){
    if(t==='mcq'){
      typeBody.innerHTML = '<div class="field"><label>Options (select the correct one)</label><div id="optList">'+optionRowsHtml(opts)+'</div>'+
        '<button type="button" class="btn btn-ghost btn-sm" id="addOptBtn">'+U.svgIcon('plus',13)+' Add option</button></div>';
      wrap.querySelector('#addOptBtn').addEventListener('click',function(){
        const row=document.createElement('div');
        row.className='field-row'; row.setAttribute('style','align-items:center;margin-bottom:.5rem;'); row.setAttribute('data-opt-row','');
        const n = wrap.querySelectorAll('[data-opt-row]').length;
        row.innerHTML='<div class="field" style="flex:none;"><label class="checkbox-row" style="margin-top:1.5rem;"><input type="radio" name="correctOpt" value="'+n+'" style="width:18px;height:18px;"></label></div>'+
          '<div class="field" style="flex:1;margin-bottom:0;"><input type="text" class="opt-text" placeholder="Option '+String.fromCharCode(65+n)+'"></div>'+
          '<button type="button" class="icon-btn" data-remove-opt style="margin-top:1.4rem;">'+U.svgIcon('x',14)+'</button>';
        wrap.querySelector('#optList').appendChild(row);
        row.querySelector('[data-remove-opt]').addEventListener('click',function(){row.remove();});
        U.paintIcons(row);
      });
      wrap.querySelectorAll('[data-remove-opt]').forEach(function(b){ b.addEventListener('click',function(){ b.closest('[data-opt-row]').remove(); }); });
    } else if(t==='truefalse'){
      const ans = existing && existing.correctAnswer!==undefined ? existing.correctAnswer : 'true';
      typeBody.innerHTML = '<div class="field"><label>Correct answer</label><div class="segmented" id="tfSeg">'+
        '<button type="button" data-val="true" class="'+(ans==='true'||ans===true?'active':'')+'">True</button>'+
        '<button type="button" data-val="false" class="'+(ans==='false'||ans===false?'active':'')+'">False</button></div></div>';
      wrap.querySelectorAll('#tfSeg button').forEach(function(b){ b.addEventListener('click',function(){ wrap.querySelectorAll('#tfSeg button').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); }); });
    } else if(t==='fillblank'){
      typeBody.innerHTML = '<div class="field"><label>Correct answer(s) — comma separated for multiple acceptable answers</label><input type="text" id="fbAnswer" placeholder="e.g. mitochondria, Mitochondrion" value="'+U.esc(existing?existing.correctAnswer:'')+'"><p class="hint">Use ___ (underscores) in the question text to mark the blank.</p></div>';
    } else {
      typeBody.innerHTML = '<div class="field"><label>Model / reference answer</label><textarea id="saAnswer" placeholder="Reference answer for self-grading" style="min-height:90px;">'+U.esc(existing?existing.correctAnswer:'')+'</textarea></div>';
    }
  }
  renderTypeBody(type);
  let currentType = type;
  wrap.querySelectorAll('#qTypeSeg button').forEach(function(b){
    b.addEventListener('click',function(){
      wrap.querySelectorAll('#qTypeSeg button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); currentType=b.dataset.type; renderTypeBody(currentType);
    });
  });

  const linkedNoteIds = new Set(existing && existing.linkedNoteIds ? existing.linkedNoteIds : []);
  const notesPickerEl = wrap.querySelector('#qLinkedNotes');
  function renderNotesPicker(){
    if(!State.notes.length){
      notesPickerEl.innerHTML = '<p class="hint" style="margin:.4rem 0 0;">No notes yet — create one from the Notes tab, then come back to link it here.</p>';
      return;
    }
    notesPickerEl.innerHTML = State.notes.map(function(n){
      return '<button type="button" data-note-id="'+n.id+'" class="'+(linkedNoteIds.has(n.id)?'active':'')+'">'+U.esc(n.title||'Untitled')+'</button>';
    }).join('');
    notesPickerEl.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        const nid = b.dataset.noteId;
        if(linkedNoteIds.has(nid)){ linkedNoteIds.delete(nid); b.classList.remove('active'); }
        else { linkedNoteIds.add(nid); b.classList.add('active'); }
      });
    });
  }
  renderNotesPicker();

  wrap.querySelector('#qSaveBtn').addEventListener('click',async function(){
    const text = wrap.querySelector('#qText').value.trim();
    if(!text){ toast('Question text is required','error'); wrap.querySelector('#qText').focus(); return; }
    const subject = wrap.querySelector('#qSubject').value.trim();
    const topicVal = wrap.querySelector('#qTopic').value.trim();
    const payload = {
      id: existing?existing.id:undefined,
      type: currentType,
      text: text,
      explanation: wrap.querySelector('#qExplain').value.trim(),
      subject: subject, topic: topicVal,
      difficulty: wrap.querySelector('#qDifficulty').value,
      marks: parseFloat(wrap.querySelector('#qMarks').value)||1,
      tags: wrap.querySelector('#qTags').value.split(',').map(function(t){return t.trim();}).filter(Boolean),
      linkedNoteIds: Array.from(linkedNoteIds),
      bookmarked: wrap.querySelector('#qBookmark').checked,
      groupId: wrap.querySelector('#qGroupSelect') ? (wrap.querySelector('#qGroupSelect').value||null) : effectiveGroupId,
      createdAt: existing?existing.createdAt:undefined
    };
    if(currentType==='mcq'){
      const rows = wrap.querySelectorAll('[data-opt-row]');
      const options=[]; let hasCorrect=false;
      rows.forEach(function(r,i){
        const t = r.querySelector('.opt-text').value.trim();
        const radio = r.querySelector('input[type=radio]');
        const correct = radio.checked;
        if(correct) hasCorrect=true;
        if(t) options.push({text:t,correct:correct});
      });
      if(options.length<2){ toast('Add at least 2 options','error'); return; }
      if(!hasCorrect){ toast('Select the correct option','error'); return; }
      payload.options = options;
    } else if(currentType==='truefalse'){
      const active = wrap.querySelector('#tfSeg button.active');
      payload.correctAnswer = active ? active.dataset.val : 'true';
    } else if(currentType==='fillblank'){
      payload.correctAnswer = wrap.querySelector('#fbAnswer').value.trim();
      if(!payload.correctAnswer){ toast('Enter the correct answer','error'); return; }
    } else {
      payload.correctAnswer = wrap.querySelector('#saAnswer').value.trim();
    }
    await ensureSubject(subject);
    await ensureTopic(topicVal,subject);
    const row = await DB.put('questions',payload);
    if(existing){
      const idx = State.questions.findIndex(function(q){return q.id===row.id;});
      State.questions[idx]=row;
    } else {
      State.questions.push(row);
    }
    toast(existing?'Question updated':'Question added','success');
    closeModal();
    navigate('questionbank');
  });
}

/* v2: forgiving JSON parser aimed at students, not developers.
   - Accepts a bare array, or {questions:[...]}
   - Accepts options as either objects ({text,correct}) or plain strings + correctIndex
   - Turns JSON.parse's cryptic "Unexpected token" errors into a plain-language message
   - Validates just enough that a malformed paste can't silently create broken questions */
function parseFriendlyQuestionJSON(text){
  let data;
  try{
    data = JSON.parse(text);
  }catch(e){
    throw new Error('This doesn\'t look like valid JSON yet. Common fixes: make sure every question is wrapped in { }, items are separated by commas, and the whole thing is inside [ ]. (Parser said: '+e.message+')');
  }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.questions) ? data.questions : null);
  if(!arr) throw new Error('Expected a list of questions — either "[ {...}, {...} ]" or "{ \\"questions\\": [ {...} ] }".');
  if(!arr.length) throw new Error('That JSON is valid, but the list is empty — add at least one question.');
  const out = [];
  arr.forEach(function(raw,i){
    if(!raw || typeof raw!=='object') throw new Error('Question #'+(i+1)+' isn\'t an object — each question needs to be wrapped in { }.');
    if(!raw.text || !String(raw.text).trim()) throw new Error('Question #'+(i+1)+' is missing "text" — every question needs the question itself as text.');
    const type = (raw.type||'mcq').toLowerCase();
    let options;
    if(type==='mcq'){
      let rawOpts = raw.options;
      if(!Array.isArray(rawOpts) || rawOpts.length<2) throw new Error('Question #'+(i+1)+' ("'+U.truncate(String(raw.text),40)+'") needs at least 2 options for a multiple-choice question.');
      const correctIdx = typeof raw.correctIndex==='number' ? raw.correctIndex : rawOpts.findIndex(function(o){return o && o.correct;});
      options = rawOpts.map(function(o,oi){
        const t = (o && typeof o==='object') ? (o.text||'') : String(o);
        const c = (o && typeof o==='object') ? !!o.correct : (oi===correctIdx);
        return {text:t,correct:c};
      });
      if(!options.some(function(o){return o.correct;})) throw new Error('Question #'+(i+1)+' doesn\'t mark any option as correct — add "correctIndex": 0 (or higher) to say which option is right.');
    }
    out.push(normalizeImported({
      text:String(raw.text), type:type, explanation:raw.explanation||'',
      subject:raw.subject||'', topic:raw.topic||'', difficulty:(raw.difficulty||'medium').toLowerCase(),
      marks:raw.marks, tags:Array.isArray(raw.tags)?raw.tags:(typeof raw.tags==='string'?raw.tags.split(',').map(function(t){return t.trim();}).filter(Boolean):[]),
      options:options, correctAnswer:raw.correctAnswer!==undefined?String(raw.correctAnswer):undefined
    }));
  });
  return out;
}
window.SD_parseFriendlyQuestionJSON = parseFriendlyQuestionJSON;
function parseImportFile(filename,content){
  if(/\.json$/i.test(filename)){
    return parseFriendlyQuestionJSON(content);
  }
  if(/\.csv$/i.test(filename)){
    const rows = U.parseCSV(content);
    return rows.map(function(r){
      const opts=[];
      for(let i=1;i<=6;i++){ if(r['option'+i]) opts.push({text:r['option'+i],correct:parseInt(r.correctIndex,10)===i-1}); }
      return normalizeImported({
        text:r.text||r.question||'', type:r.type||'mcq', subject:r.subject||'', topic:r.topic||'',
        difficulty:r.difficulty||'medium', marks:parseFloat(r.marks)||1,
        tags:(r.tags||'').split(';').map(function(t){return t.trim();}).filter(Boolean),
        options:opts.length?opts:undefined, correctAnswer:r.correctAnswer||''
      });
    }).filter(function(q){return q.text;});
  }
  // TXT: "Question | Answer" per line
  return content.split('\n').map(function(line){
    line=line.trim(); if(!line) return null;
    const parts = line.split('|');
    return normalizeImported({text:(parts[0]||'').trim(),type:'shortanswer',correctAnswer:(parts[1]||'').trim(),difficulty:'medium',marks:1});
  }).filter(Boolean);
}
function normalizeImported(q){
  return {
    type:q.type||'mcq', text:q.text||'', explanation:q.explanation||'',
    subject:q.subject||'', topic:q.topic||'', difficulty:q.difficulty||'medium',
    marks:parseFloat(q.marks)||1, tags:q.tags||[], bookmarked:false,
    options:q.options, correctAnswer:q.correctAnswer
  };
}

function worksheetQuestionBody(q,answerSpace){
  if(q.type==='mcq'){
    return '<div class="ws-options">'+(q.options||[]).map(function(opt,i){
      return '<div class="ws-opt"><span class="ws-opt-letter">'+String.fromCharCode(65+i)+'.</span> '+U.esc(opt.text)+'</div>';
    }).join('')+'</div>';
  }
  if(q.type==='truefalse'){
    return '<div class="ws-options"><div class="ws-opt"><span class="ws-opt-letter">A.</span> True</div><div class="ws-opt"><span class="ws-opt-letter">B.</span> False</div></div>';
  }
  if(q.type==='fillblank'){
    return '<div class="ws-fillblank">Answer: <span class="ws-blankline"></span></div>';
  }
  // short/long answer
  if(!answerSpace) return '';
  const lines = q.type==='longanswer' ? 6 : 2;
  let out = '<div class="ws-ruled">';
  for(let i=0;i<lines;i++) out += '<div class="ws-ruled-line"></div>';
  out += '</div>';
  return out;
}

function renderWorksheetPrintArea(list,opts){
  let existing = document.getElementById('worksheetPrintArea');
  if(existing) existing.remove();
  const area = document.createElement('div');
  area.id = 'worksheetPrintArea';
  area.className = 'print-only';

  let bodyHtml = '<div class="ws-header"><h1>'+U.esc(opts.title)+'</h1>'+
    '<div class="ws-meta-row"><span>Name: <span class="ws-fill">________________________</span></span><span>Date: <span class="ws-fill">____________</span></span><span>Score: <span class="ws-fill">______ / '+
      (opts.showMarks ? list.reduce(function(s,q){return s+(q.marks||1);},0) : list.length)+'</span></span></div></div>';

  let counter = 0, lastSection = null;
  bodyHtml += '<ol class="ws-qlist">';
  list.forEach(function(q){
    if(opts.numbering==='section'){
      const sectionKey = q.subject||'General';
      if(sectionKey!==lastSection){
        if(lastSection!==null) bodyHtml += '</ol>';
        bodyHtml += '<li class="ws-section-title">'+U.esc(sectionKey)+'</li><ol class="ws-qlist ws-sub">';
        lastSection = sectionKey; counter = 0;
      }
    }
    counter++;
    const marksTag = (opts.showMarks && q.marks) ? ' <span class="ws-marks">['+q.marks+' mark'+(q.marks===1?'':'s')+']</span>' : '';
    bodyHtml += '<li class="ws-q"><div class="ws-qtext">'+U.esc(U.stripHtml(q.text))+marksTag+'</div>'+worksheetQuestionBody(q,opts.answerSpace)+'</li>';
  });
  bodyHtml += '</ol>';

  if(opts.includeKey){
    bodyHtml += '<div class="ws-pagebreak"></div><div class="ws-header"><h2>Answer Key — '+U.esc(opts.title)+'</h2></div><ol class="ws-keylist">';
    list.forEach(function(q){
      let ans = '';
      if(q.type==='mcq'){
        const idx = (q.options||[]).findIndex(function(o){return o.correct;});
        ans = idx>=0 ? (String.fromCharCode(65+idx)+'. '+U.esc(q.options[idx].text)) : '(no answer marked)';
      } else if(q.type==='truefalse'){
        ans = (String(q.correctAnswer)==='true') ? 'True' : 'False';
      } else if(q.type==='fillblank'){
        ans = U.esc(q.correctAnswer||'(not set)');
      } else {
        ans = q.correctAnswer ? U.esc(q.correctAnswer) : '(self-graded — no fixed answer)';
      }
      bodyHtml += '<li>'+ans+'</li>';
    });
    bodyHtml += '</ol>';
  }

  area.innerHTML = bodyHtml;
  document.body.appendChild(area);
}

   STUDYDESK — PRACTICE ENGINE + SHARED RUNNER CORE

(function(){
"use strict";
const U = window.SD_UTIL;

/* ---------------------------------------------------------
   SHARED: answer checking logic used by practice + quiz
--------------------------------------------------------- */
function checkAnswer(q,userAnswer){
  if(q.type==='mcq'){
    const correctIdx = (q.options||[]).findIndex(function(o){return o.correct;});
    return {correct: parseInt(userAnswer,10)===correctIdx, correctDisplay: q.options && q.options[correctIdx] ? q.options[correctIdx].text : ''};
  }
  if(q.type==='truefalse'){
    const ans = String(q.correctAnswer)==='true';
    return {correct: (userAnswer===true||userAnswer==='true')===ans, correctDisplay: ans?'True':'False'};
  }
  if(q.type==='fillblank'){
    const accepted = (q.correctAnswer||'').split(',').map(function(a){return a.trim().toLowerCase();}).filter(Boolean);
    const given = (userAnswer||'').trim().toLowerCase();
    return {correct: accepted.includes(given), correctDisplay: q.correctAnswer};
  }
  // short/long answer: self-graded
  return {correct: userAnswer==='self-correct', correctDisplay: q.correctAnswer||'(self-graded)', selfGraded:true};
}
window.SD_checkAnswer = checkAnswer;

async function recordAttempt(q,userAnswer,correct,timeSpent,confidence){
  const attempt = {
    id:U.uid(), questionId:q.id, userAnswer:userAnswer, correct:correct,
    timeSpent:timeSpent||0, confidence:confidence||null, ts:U.nowISO()
  };
  const row = await DB.put('attempts',attempt);
  State.attempts.push(row);

  if(!correct){
    const check = checkAnswer(q,userAnswer);
    const mistake = {
      id:U.uid(), questionId:q.id, myAnswer: displayAnswer(q,userAnswer), correctAnswer: check.correctDisplay||q.correctAnswer||'',
      explanation:q.explanation||'', reason:'', confidence:confidence||null, mastered:false, retryCount:0, ts:U.nowISO()
    };
    const mrow = await DB.put('mistakes',mistake);
    State.mistakes.push(mrow);
  }

  // Update / create revision queue entry using the same SM-2-style scheduler
  // flashcards use (window.SD_scheduleCard), so questions get real spaced
  // repetition instead of fixed 1/4/14-day steps. Confidence (1-5, defaults
  // to 3 if the person skips rating) maps to a 0-3 grade: an incorrect
  // answer is always "again" regardless of confidence, since confidence
  // reflects how sure they felt, not whether they were right.
  const grade = !correct ? 0 : (confidence<=2 ? 1 : confidence>=5 ? 3 : 2);
  const priority = !correct ? 'high' : (confidence && confidence<=2 ? 'medium' : 'low');
  let rev = State.revisions.find(function(r){return r.questionId===q.id;});
  if(!rev){
    rev = {id:U.uid(), questionId:q.id, attempts:0, correctCount:0, ease:2.5, interval:0, reps:0, state:'learning'};
  }
  rev.attempts=(rev.attempts||0)+1;
  rev.correctCount=(rev.correctCount||0)+(correct?1:0);
  rev.priority = priority;
  const scheduled = window.SD_scheduleCard(rev,grade);
  scheduled.status = scheduled.state==='mastered' ? 'mastered' : 'active';
  const rrow = await DB.put('revisions',scheduled);
  const idx = State.revisions.findIndex(function(r){return r.id===rrow.id;});
  if(idx>=0) State.revisions[idx]=rrow; else State.revisions.push(rrow);

  await window.logSessionSimple('attempt',{questionId:q.id,correct:correct});
  awardXP(correct?10:2,'attempt');
  updateNavBadges();
}

function displayAnswer(q,userAnswer){
  if(q.type==='mcq'){
    const i = parseInt(userAnswer,10);
    return q.options && q.options[i] ? q.options[i].text : '(no answer)';
  }
  if(q.type==='truefalse') return userAnswer===true||userAnswer==='true' ? 'True':'False';
  return userAnswer || '(no answer)';
}

function renderQuestionInteractive(container,q,onAnswered){
  let answered=false, userAns=null;
  if(q.type==='mcq'){
    container.innerHTML = '<div class="quiz-options">'+(q.options||[]).map(function(opt,i){
      return '<div class="quiz-opt" data-i="'+i+'"><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+U.esc(opt.text)+'</span></div>';
    }).join('')+'</div>';
    container.querySelectorAll('.quiz-opt').forEach(function(el){
      el.addEventListener('click',function(){
        if(answered) return;
        container.querySelectorAll('.quiz-opt').forEach(function(x){x.classList.remove('selected');});
        el.classList.add('selected');
        userAns = el.dataset.i;
        onAnswered(userAns);
      });
    });
  } else if(q.type==='truefalse'){
    container.innerHTML = '<div class="quiz-options">'+
      '<div class="quiz-opt" data-v="true"><span class="opt-letter">T</span><span>True</span></div>'+
      '<div class="quiz-opt" data-v="false"><span class="opt-letter">F</span><span>False</span></div></div>';
    container.querySelectorAll('.quiz-opt').forEach(function(el){
      el.addEventListener('click',function(){
        if(answered) return;
        container.querySelectorAll('.quiz-opt').forEach(function(x){x.classList.remove('selected');});
        el.classList.add('selected'); userAns=el.dataset.v; onAnswered(userAns);
      });
    });
  } else if(q.type==='fillblank'){
    container.innerHTML = '<div class="field"><input type="text" id="fbInput" placeholder="Type your answer…" autocomplete="off"></div><button class="btn btn-primary btn-sm" id="fbSubmit">Submit answer</button>';
    const input = container.querySelector('#fbInput');
    input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ userAns=input.value; onAnswered(userAns); } });
    container.querySelector('#fbSubmit').addEventListener('click',function(){ userAns=input.value; onAnswered(userAns); });
  } else {
    container.innerHTML = '<div class="field"><textarea id="saInput" placeholder="Write your answer…" style="min-height:110px;"></textarea></div>'+
      '<button class="btn btn-primary btn-sm" id="saSubmit">Reveal model answer</button>';
    container.querySelector('#saSubmit').addEventListener('click',function(){
      userAns = container.querySelector('#saInput').value;
      onAnswered('__reveal__');
    });
  }
  return {get value(){return userAns;}};
}

function showAnswerFeedback(container,q,userAnswer){
  if(q.type==='mcq'){
    const correctIdx=(q.options||[]).findIndex(function(o){return o.correct;});
    container.querySelectorAll('.quiz-opt').forEach(function(el){

function pickPracticeQuestions(mode,opts){
  let pool = State.questions.slice();
  if(mode==='topic'){
    if(opts.subject) pool = pool.filter(function(q){return q.subject===opts.subject;});
    if(opts.topic) pool = pool.filter(function(q){return q.topic===opts.topic;});
    if(opts.groupId){ const inGroup = new Set(SD_Bank.questionsInGroup(opts.groupId,true).map(function(q){return q.id;})); pool = pool.filter(function(q){return inGroup.has(q.id);}); }
  }
  if(mode==='weak'){
    const wrongIds = {};
    State.attempts.forEach(function(a){ if(!a.correct) wrongIds[a.questionId]=(wrongIds[a.questionId]||0)+1; });
    pool = pool.filter(function(q){return wrongIds[q.id];}).sort(function(a,b){return (wrongIds[b.id]||0)-(wrongIds[a.id]||0);});
  }
  if(mode==='incorrect'){
    const wrongIds = new Set(State.attempts.filter(function(a){return !a.correct;}).map(function(a){return a.questionId;}));
    pool = pool.filter(function(q){return wrongIds.has(q.id);});
  }
  if(mode==='daily'){
    // deterministic-ish daily set based on date seed
    const seed = U.todayKey().split('-').join('');
    pool = pool.slice().sort(function(a,b){return (a.id+seed).localeCompare(b.id+seed);}).slice(0,10);
  }
  if(mode==='speed'){
    pool = pool.filter(function(q){return q.type==='mcq'||q.type==='truefalse';});
  }
  // "random" and "speed" are explicit-by-name random modes — always shuffle
  // regardless of the global setting, since picking that mode is itself an
  // explicit per-session choice for randomness. "adaptive" always shuffles
  // by design too. Everywhere else (normal, timed, topic, incorrect), the
  // global "Random Question Order" setting decides whether the presented
  // order is shuffled or left as-is (insertion / weak-first / daily-seed
  // order, whichever this mode already produced above).
  if(mode==='adaptive') pool = shuffle(pool.slice());
  if(mode==='random'||mode==='speed') pool = shuffle(pool.slice());
  else if((mode==='normal'||mode==='timed'||mode==='topic'||mode==='incorrect') && State.settings.randomQuestionOrder!==false){
    pool = shuffle(pool.slice());
  }
  return pool;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

function launchPractice(mode,opts){
  const pool = pickPracticeQuestions(mode,opts);
  if(!pool.length){
    toast('No questions match this practice mode yet','info');
    return;
  }
  State.runtime.practice = {
    mode:mode, opts:opts, pool:pool, index:0,
    perQuestionTime: mode==='speed'?15:(mode==='timed'?45:0),
    results:[], startTs:Date.now()
  };
  navigate('practicerunner');
}

let practiceTimerHandle=null;
function renderPracticeRunner(container){
  const rt = State.runtime.practice;
  if(!rt){ navigate('practice'); return; }
  clearInterval(practiceTimerHandle);
  const q = rt.pool[rt.index];
  if(!q){ finishPractice(container); return; }
  let qStartTs = Date.now();
  let timeLeft = rt.perQuestionTime;

  container.innerHTML =
  '<div class="quiz-shell">'+
    '<div class="quiz-progress-row">'+
      '<div class="progress-track" style="flex:1;"><div class="progress-fill" style="width:'+U.pct(rt.index,rt.pool.length)+'%;"></div></div>'+
      '<span class="mono text-faint" style="font-size:.8rem;">'+(rt.index+1)+' / '+rt.pool.length+'</span>'+
      (rt.perQuestionTime? '<span class="quiz-timer" id="pTimer">'+U.svgIcon('clock',14)+' <span id="pTimerVal">'+timeLeft+'s</span></span>' : '')+
      '<button class="btn btn-ghost btn-sm" id="pExitBtn">Exit</button>'+
    '</div>'+
    '<div class="card quiz-qcard">'+
      '<div class="quiz-qmeta"><span class="tag">'+U.esc(q.subject||'General')+'</span><span class="tag">'+U.esc(q.topic||'—')+'</span>'+SD_Bank.diffDots(q.difficulty)+'<span class="text-faint" style="font-size:.75rem;">'+(q.marks||1)+' marks</span></div>'+
      '<div class="quiz-qtext">'+U.esc(q.text)+'</div>'+
      '<div id="pInteractive"></div>'+
      '<div id="pFeedback" style="margin-top:1rem;display:none;"></div>'+
    '</div>'+
    '<div class="quiz-nav-row"><span class="text-faint" style="font-size:.8rem;">'+capitalize(rt.mode)+' practice</span><button class="btn btn-primary" id="pNextBtn" disabled>Skip</button></div>'+
  '</div>';

  const interactiveWrap = container.querySelector('#pInteractive');
  const feedback = container.querySelector('#pFeedback');
  const nextBtn = container.querySelector('#pNextBtn');
  let locked=false;
  const runner = renderQuestionInteractive(interactiveWrap,q,function(ans){
    if(locked) return;
    handleAnswerSubmit(ans);
  });
  nextBtn.addEventListener('click',function(){
    if(!locked){ handleAnswerSubmit(null); return; }
    // pendingCommit can itself set a new pendingCommit (the short/long-answer
    // fallback resolves into the confidence-commit step), so drain it until
    // stable rather than firing once and nulling out whatever it just set.
    let guard=0;
    while(rt.pendingCommit && guard<5){
      const fn = rt.pendingCommit;
      rt.pendingCommit = null;
      fn();
      guard++;
    }
    rt.index++;
    navigate('practicerunner');
  });
  container.querySelector('#pExitBtn').addEventListener('click',async function(){
    const ok = await confirmDialog({title:'Exit practice?',message:'Your progress on remaining questions won\'t be saved as attempts.',okText:'Exit'});
    if(ok){
      let guard=0;
      while(rt.pendingCommit && guard<5){ const fn=rt.pendingCommit; rt.pendingCommit=null; fn(); guard++; }
      State.runtime.practice=null; navigate('practice');
    }
  });

  if(rt.perQuestionTime){
    const timerVal = container.querySelector('#pTimerVal');
    const timerEl = container.querySelector('#pTimer');
    practiceTimerHandle = setInterval(function(){
      timeLeft--;
      if(timerVal) timerVal.textContent = timeLeft+'s';
      if(timeLeft<=5 && timerEl) timerEl.classList.add('low');
      if(timeLeft<=0){ clearInterval(practiceTimerHandle); if(!locked) handleAnswerSubmit(null); }
    },1000);
  }

  async function handleAnswerSubmit(ans){
    locked=true;
    clearInterval(practiceTimerHandle);
    const timeSpent = Math.round((Date.now()-qStartTs)/1000);
    let correct=false, resultAns=ans;
    if(q.type==='shortanswer'||q.type==='longanswer'){
      feedback.style.display='block';
      feedback.innerHTML = '<div class="divider"></div><strong>Model answer:</strong><p style="margin-top:.4rem;">'+U.esc(q.correctAnswer||'No model answer provided.')+'</p>'+
        '<div class="field"><label>Self-assess</label><div class="segmented"><button type="button" class="btn-sa" data-v="1">Got it right</button><button type="button" class="btn-sa" data-v="0">Got it wrong</button></div></div>';
      feedback.querySelectorAll('.btn-sa').forEach(function(b){
        b.addEventListener('click',async function(){
          correct = b.dataset.v==='1';
          await finalizeAnswer(correct,'self-'+(correct?'correct':'incorrect'));
        });
      });
      // If they move on without tapping Got it right/wrong, still record the
      // attempt rather than silently dropping it - self-assessed as correct
      // is the safer default for scheduling (worst case a question that
      // needed more work looks slightly better-known than it is, which a
      // later wrong answer on a different attempt will naturally correct;
      // the reverse - discarding a real answer - loses data outright).
      rt.pendingCommit = function(){ finalizeAnswer(true,'self-correct'); };
      nextBtn.disabled=false; nextBtn.textContent='Next question';
      return;
    }
    const check = checkAnswer(q,ans);
    correct = check.correct;
    await finalizeAnswer(correct,ans);

    async function finalizeAnswer(isCorrect,storedAns){
      if(rt.mode==='adaptive'){
        // Track a rolling window of the last 3 results. 2+ correct out of
        // the last 3 nudges the remaining pool toward harder questions;
        // 2+ incorrect nudges it easier. Only the yet-unanswered tail of
        // the pool is reordered, so already-answered/current questions are
        // never touched.
        rt.adaptiveWindow = (rt.adaptiveWindow||[]).concat([isCorrect]).slice(-3);
        const correctCount = rt.adaptiveWindow.filter(Boolean).length;
        let targetDiff = null;
        if(rt.adaptiveWindow.length>=2){
          if(correctCount>=2) targetDiff='hard';
          else if(rt.adaptiveWindow.length-correctCount>=2) targetDiff='easy';
        }
        if(targetDiff){
          const tail = rt.pool.slice(rt.index+1);
          const head = rt.pool.slice(0,rt.index+1);
          tail.sort(function(a,b){
            const aMatch = a.difficulty===targetDiff?0:1;
            const bMatch = b.difficulty===targetDiff?0:1;
            return aMatch-bMatch;
          });
          rt.pool = head.concat(tail);
        }
      }
      showAnswerFeedback(interactiveWrap,q,ans);
      feedback.style.display='block';
      feedback.innerHTML = '<div class="divider"></div><span class="badge '+(isCorrect?'badge-correct':'badge-incorrect')+'">'+(isCorrect?'Correct':'Incorrect')+'</span>'+
        (q.explanation? '<p style="margin-top:.6rem;">'+U.esc(q.explanation)+'</p>' : '')+
        '<div class="confidence-row" style="margin-top:.8rem;max-width:320px;"><span class="text-faint" style="font-size:.78rem;width:100%;margin-bottom:.3rem;">How confident were you?</span></div>';
      const confRow = feedback.querySelector('.confidence-row');
      const confBtns = document.createElement('div');
      confBtns.style.cssText='display:flex;gap:.4rem;width:100%;';
      confBtns.innerHTML = [1,2,3,4,5].map(function(n){return '<button type="button" class="conf-btn" data-c="'+n+'">'+n+'</button>';}).join('');
      confRow.appendChild(confBtns);
      if(q.linkedNoteIds && q.linkedNoteIds.length){
        const linked = q.linkedNoteIds.map(function(nid){ return State.notes.find(function(n){return n.id===nid;}); }).filter(Boolean);
        if(linked.length){
          const notesBlock = document.createElement('div');
          notesBlock.className='linked-notes-block';
          notesBlock.style.cssText='margin-top:.9rem;';
          notesBlock.innerHTML = '<span class="text-faint" style="font-size:.78rem;">'+U.svgIcon('note',13)+' Linked note'+(linked.length===1?'':'s')+'</span>'+
            linked.map(function(n,i){
              return '<details class="linked-note-item" style="margin-top:.4rem;border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;">'+
                '<summary style="cursor:pointer;font-weight:600;font-size:.83rem;">'+U.esc(n.title||'Untitled')+'</summary>'+
                '<div style="margin-top:.5rem;font-size:.85rem;" class="note-preview-'+i+'"></div></details>';
            }).join('');
          feedback.appendChild(notesBlock);
          linked.forEach(function(n,i){
            const target = notesBlock.querySelector('.note-preview-'+i);
            if(target) target.innerHTML = window.SD_mdToHtml(n.content||'');
          });
        }
      }
      // Record exactly once. Default confidence is 3 (the same "good"
      // grade used elsewhere) in case the person moves on without rating -
      // that still logs the attempt/mistake/XP correctly, it just treats
      // an unrated answer as medium confidence rather than skipping
      // scheduling entirely. Tapping a rating before moving on overrides it.
      let confidence=3, recorded=false;
      function commit(){
        if(recorded) return;
        recorded=true;
        recordAttempt(q,storedAns,isCorrect,timeSpent,confidence);
      }
      confBtns.querySelectorAll('.conf-btn').forEach(function(b){
        b.addEventListener('click',function(){
          confBtns.querySelectorAll('.conf-btn').forEach(function(x){x.classList.remove('active');});
          b.classList.add('active'); confidence=parseInt(b.dataset.c,10);
          commit();
        });
      });
      rt.pendingCommit = commit;
      rt.results.push({questionId:q.id,correct:isCorrect,timeSpent:timeSpent});
      nextBtn.disabled=false; nextBtn.textContent='Next question';
    }
  }
}

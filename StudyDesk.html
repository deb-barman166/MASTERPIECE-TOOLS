<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyDesk — Learning &amp; Practice</title>
<meta name="description" content="Offline student learning and practice workspace.">
<style>
/* ============================================================
   STUDYDESK DESIGN SYSTEM
   Palette:  ink navy #12213D · paper #FAF7F0 · marker teal #0F766E
             amber #D97706 (due/attention) · green #15803D (correct)
             red #B91C1C (incorrect)
   Type:     display = serif "masthead" stack
             body    = system grotesk
             mono    = ui-monospace for scores/timers/counts
   ============================================================ */

:root{
  --ink-950:#0A1526;
  --ink-900:#12213D;
  --ink-800:#1B2E52;
  --ink-700:#28406E;
  --ink-600:#3A5487;
  --ink-500:#5872A3;
  --ink-400:#8598BE;
  --ink-300:#B2C0DA;
  --ink-200:#D6DEED;
  --ink-100:#EAEFF6;

  --paper-0:#FFFFFF;
  --paper-50:#FDFBF6;
  --paper-100:#FAF7F0;
  --paper-200:#F2EDE1;
  --paper-300:#E6DFCD;

  --teal-900:#0B4740;
  --teal-700:#0F766E;
  --teal-600:#13897F;
  --teal-500:#17A398;
  --teal-100:#DCF3F0;
  --teal-50:#EFFAF8;

  --amber-700:#B45309;
  --amber-600:#D97706;
  --amber-500:#F59E0B;
  --amber-100:#FDECC8;
  --amber-50:#FFF8EA;

  --green-700:#15803D;
  --green-600:#16A34A;
  --green-100:#DCFCE3;
  --green-50:#F0FDF5;

  --red-700:#B91C1C;
  --red-600:#DC2626;
  --red-100:#FEE2E2;
  --red-50:#FEF4F4;

  /* Deep Dark+ Purple theme palette. void-* is the near-black purple
     background family (distinct from ink-*'s navy dark theme); violet-*
     is the neon accent family used for the glow/highlight treatment. */
  --void-950:#0D0716;
  --void-900:#160D26;
  --void-850:#1D1233;
  --void-800:#251740;
  --void-700:#33204F;
  --void-600:#4A2E6E;
  --void-500:#6B3FA0;
  --void-400:#9B6FD9;
  --void-300:#C4A6EE;

  --violet-900:#2E1065;
  --violet-700:#6D28D9;
  --violet-600:#8B5CF6;
  --violet-500:#A78BFA;
  --violet-400:#C4B5FD;
  --violet-glow:rgba(168,85,247,.45);

  /* Modern theme palette — a colder, glassier near-black than void-*,
     paired with a cyan/magenta neon duo instead of purple's single-hue
     violet glow, so Modern reads as a distinct "glass HUD" identity
     rather than a purple reskin. */
  --glass-950:#05070C;
  --glass-900:#0A0E17;
  --glass-850:#0F1420;
  --glass-800:#141B2B;
  --glass-700:#1C2540;
  --glass-600:#293353;
  --glass-500:#3D4A72;
  --glass-400:#6472A0;
  --glass-300:#9AA6C9;

  --neon-cyan:#22D3EE;
  --neon-cyan-glow:rgba(34,211,238,.5);
  --neon-magenta:#F472B6;
  --neon-magenta-glow:rgba(244,114,182,.45);
  --neon-violet:#A78BFA;

  --font-display: "Iowan Old Style","Palatino Linotype","URW Palladio L",P052,"Georgia",serif;
  --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,monospace;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --radius-xl:22px;
  --radius-pill:999px;

  --shadow-sm:0 1px 2px rgba(18,33,61,.06), 0 1px 1px rgba(18,33,61,.04);
  --shadow-md:0 4px 14px rgba(18,33,61,.08), 0 1px 3px rgba(18,33,61,.06);
  --shadow-lg:0 12px 32px rgba(18,33,61,.14), 0 2px 6px rgba(18,33,61,.08);
  --shadow-focus:0 0 0 3px rgba(15,118,110,.35);

  --dur-fast:120ms;
  --dur-med:220ms;
  --dur-slow:380ms;
  --ease:cubic-bezier(.22,.9,.32,1);

  --bg:var(--paper-100);
  --surface:var(--paper-0);
  --surface-raised:var(--paper-50);
  --surface-sunken:var(--paper-200);
  --border:var(--paper-300);
  --border-strong:var(--ink-300);
  --text:var(--ink-900);
  --text-soft:var(--ink-600);
  --text-faint:var(--ink-400);
  --accent:var(--teal-700);
  --accent-strong:var(--teal-900);
  --accent-soft:var(--teal-100);
  --on-accent:#ffffff;

  --sidebar-w:248px;
  --topbar-h:60px;
  --bottomnav-h:64px;

  --scale:1;
  --motion-scale:1;
}

[data-theme="dark"]{
  --bg:var(--ink-950);
  --surface:var(--ink-900);
  --surface-raised:var(--ink-800);
  --surface-sunken:var(--ink-950);
  --border:var(--ink-700);
  --border-strong:var(--ink-600);
  --text:var(--paper-100);
  --text-soft:var(--ink-300);
  --text-faint:var(--ink-500);
  --accent:var(--teal-500);
  --accent-strong:var(--teal-100);
  --accent-soft:var(--teal-900);
  --on-accent:#04201C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.45);
}

[data-theme="purple"]{
  --bg:var(--void-950);
  --surface:var(--void-900);
  --surface-raised:var(--void-850);
  --surface-sunken:var(--void-950);
  --border:var(--void-700);
  --border-strong:var(--void-600);
  --text:var(--violet-400);
  --text-soft:var(--void-300);
  --text-faint:var(--void-500);
  --accent:var(--violet-600);
  --accent-strong:var(--violet-400);
  --accent-soft:var(--violet-900);
  --on-accent:#ffffff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.45), 0 0 18px var(--violet-glow);
  --shadow-lg:0 14px 36px rgba(0,0,0,.55), 0 0 28px var(--violet-glow);
  --shadow-focus:0 0 0 3px var(--violet-glow);
}

/* ============================================================
   MODERN THEME — deep dark glassmorphism + neon accent system.
   Same semantic token names as every other theme (--bg, --surface,
   --text, --accent, --shadow-*, --dur-*, --ease) so every existing
   component that already reads those tokens picks this theme up
   automatically. Everything below the root block is additive,
   Modern-only enhancement layered on top of that — glass blur,
   neon glow, richer hover/press motion, custom scrollbar, and an
   animated gradient border treatment for surfaces.
   ============================================================ */
[data-theme="modern"]{
  --bg:var(--glass-950);
  --surface:var(--glass-900);
  --surface-raised:var(--glass-800);
  --surface-sunken:var(--glass-950);
  --border:var(--glass-600);
  --border-strong:var(--neon-cyan);
  --text:#EAF2FF;
  --text-soft:var(--glass-300);
  --text-faint:var(--glass-500);
  --accent:var(--neon-cyan);
  --accent-strong:#67E8F9;
  --accent-soft:rgba(34,211,238,.14);
  --on-accent:#031014;
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow-md:0 6px 22px rgba(0,0,0,.5), 0 0 24px var(--neon-cyan-glow);
  --shadow-lg:0 20px 52px rgba(0,0,0,.65), 0 0 46px var(--neon-cyan-glow);
  --shadow-focus:0 0 0 3px var(--neon-cyan-glow);
  /* Deep, near-fully-transparent glass — surfaces are mostly the blurred
     scene behind them, tinted rather than filled. This is the core of the
     "psychological glass" identity: content floats, nothing feels opaque
     or boxed-in, and the neon accents read as light sources rather than
     flat color. */
  --glass-opacity-surface:.46;
  --glass-opacity-raised:.58;
  --glass-opacity-chrome:.38;
  --glass-blur:22px;
  --glass-blur-chrome:26px;
  --glass-saturate:170%;
  /* Snappier, springier motion than the other themes — Modern is the one
     place the app explicitly leans into "animated everything," and every
     dropdown-like surface (menus, modals, command palette, toasts) is
     driven off these same two tokens so they all animate consistently. */
  --dur-fast:150ms;
  --dur-med:260ms;
  --dur-slow:440ms;
  --ease:cubic-bezier(.34,1.4,.4,1);
}


[data-density="compact"]{
  --space-unit:.8;
}

/* ---- Modern theme: deep transparent glass, neon glow, animated everything ---- */
[data-theme="modern"] body{
  background:
    radial-gradient(ellipse 1000px 560px at 12% -12%, rgba(34,211,238,.14), transparent 58%),
    radial-gradient(ellipse 900px 700px at 105% 8%, rgba(244,114,182,.11), transparent 52%),
    radial-gradient(ellipse 700px 500px at 50% 105%, rgba(167,139,250,.08), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  animation:modernAmbient 22s ease-in-out infinite;
}
/* A slow, barely-perceptible ambient drift on the background glow — this
   is the "psychological" layer: the eye registers something is subtly
   alive without it ever being distracting or readable as an "animation". */
@keyframes modernAmbient{
  0%,100%{background-position:0 0,0 0,0 0,0 0;}
  50%{background-position:1.5% -1%,-1.5% 1%,0 -1.5%,0 0;}
}
@media (prefers-reduced-motion: reduce){ [data-theme="modern"] body{animation:none;} }

[data-theme="modern"] .sidebar,
[data-theme="modern"] .card,
[data-theme="modern"] .dropdown-menu,
[data-theme="modern"] .modal,
[data-theme="modern"] .search-trigger,
[data-theme="modern"] .icon-btn,
[data-theme="modern"] .btn-secondary,
[data-theme="modern"] .list-row,
[data-theme="modern"] .cmdk,
[data-theme="modern"] input,
[data-theme="modern"] select,
[data-theme="modern"] textarea{
  background:color-mix(in srgb, var(--surface) calc(var(--glass-opacity-surface) * 100%), transparent);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
}
[data-theme="modern"] .topbar{
  background:color-mix(in srgb, var(--bg) calc(var(--glass-opacity-chrome) * 100%), transparent);
  backdrop-filter:blur(var(--glass-blur-chrome)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter:blur(var(--glass-blur-chrome)) saturate(var(--glass-saturate));
  border-bottom:1px solid var(--border);
}
[data-theme="modern"] .bottom-nav{
  background:color-mix(in srgb, var(--surface) calc(var(--glass-opacity-raised) * 100%), transparent);
  backdrop-filter:blur(var(--glass-blur-chrome)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter:blur(var(--glass-blur-chrome)) saturate(var(--glass-saturate));
}
[data-theme="modern"] .card{
  border:1px solid var(--border);
  position:relative;
  transition:border-color var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease), transform var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
}
[data-theme="modern"] .card-hover:hover,
[data-theme="modern"] .card:hover{
  border-color:var(--neon-cyan);
  box-shadow:var(--shadow-md);
  transform:translateY(-3px);
  background:color-mix(in srgb, var(--surface) calc((var(--glass-opacity-surface) + .1) * 100%), transparent);
}
[data-theme="modern"] .sidebar{border-right:1px solid var(--border);}
[data-theme="modern"] .nav-item{transition:background var(--dur-med) var(--ease),color var(--dur-med) var(--ease),box-shadow var(--dur-med) var(--ease),transform var(--dur-fast) var(--ease);}
[data-theme="modern"] .nav-item:hover{background:rgba(34,211,238,.08);color:var(--text);transform:translateX(2px);}
[data-theme="modern"] .nav-item.active{
  background:linear-gradient(90deg, rgba(34,211,238,.16), rgba(244,114,182,.08));
  color:var(--accent-strong);
  box-shadow:inset 0 0 0 1px rgba(34,211,238,.3);
}
[data-theme="modern"] .nav-item.active::before{
  background:linear-gradient(180deg,var(--neon-cyan),var(--neon-magenta));
  box-shadow:0 0 8px var(--neon-cyan-glow);
}
[data-theme="modern"] .brand-mark{
  background:linear-gradient(155deg,var(--neon-cyan),var(--neon-magenta));
  box-shadow:0 0 16px var(--neon-cyan-glow);
}
[data-theme="modern"] .btn{transition:all var(--dur-med) var(--ease);}
[data-theme="modern"] .btn-primary{
  background:linear-gradient(135deg,var(--neon-cyan),#0EA5B7);
  box-shadow:0 0 0 rgba(34,211,238,0),var(--shadow-sm);
}
[data-theme="modern"] .btn-primary:hover{
  box-shadow:0 0 26px var(--neon-cyan-glow),var(--shadow-md);
  transform:translateY(-2px) scale(1.015);
}
[data-theme="modern"] .btn-primary:active{transform:translateY(0) scale(.98);}
[data-theme="modern"] .btn-secondary{border:1px solid var(--border);}
[data-theme="modern"] .btn-secondary:hover{border-color:var(--neon-cyan);box-shadow:0 0 14px rgba(34,211,238,.25);}
[data-theme="modern"] .btn-danger{box-shadow:0 0 0 rgba(220,38,38,0);}
[data-theme="modern"] .btn-danger:hover{box-shadow:0 0 16px rgba(220,38,38,.35);}
[data-theme="modern"] .icon-btn:hover{border-color:var(--neon-cyan);box-shadow:0 0 12px rgba(34,211,238,.3);color:var(--neon-cyan);}
[data-theme="modern"] input:focus,
[data-theme="modern"] select:focus,
[data-theme="modern"] textarea:focus{
  outline:none;border-color:var(--neon-cyan);box-shadow:0 0 0 3px rgba(34,211,238,.22);
}
[data-theme="modern"] .search-trigger:hover{border-color:var(--neon-cyan);box-shadow:0 0 14px rgba(34,211,238,.2);}

/* ---- Every dropdown-like surface animates the same way: fade + rise +
   settle, on the theme's springy --ease. This covers the generic
   .dropdown-menu component, the command palette, and toasts, so opening
   any menu anywhere in the app feels like part of one consistent system. ---- */
[data-theme="modern"] .dropdown-menu{border:1px solid var(--border);box-shadow:var(--shadow-lg);}
[data-theme="modern"] .dropdown-menu.open{animation:dropInModern var(--dur-med) var(--ease);}
[data-theme="modern"] .dropdown-item{transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),padding-left var(--dur-fast) var(--ease);}
[data-theme="modern"] .dropdown-item:hover{background:rgba(34,211,238,.1);color:var(--neon-cyan);padding-left:.9rem;}
@keyframes dropInModern{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

[data-theme="modern"] .switch .slider{background:var(--glass-600);transition:background var(--dur-med) var(--ease),box-shadow var(--dur-med) var(--ease);}
[data-theme="modern"] .switch input:checked + .slider{background:linear-gradient(90deg,var(--neon-cyan),var(--neon-magenta));box-shadow:0 0 12px var(--neon-cyan-glow);}
[data-theme="modern"] .switch .slider::before{transition:transform var(--dur-med) var(--ease),box-shadow var(--dur-med) var(--ease);}
[data-theme="modern"] .switch input:checked + .slider::before{box-shadow:0 0 6px rgba(0,0,0,.4);}

[data-theme="modern"] .modal-overlay{
  background:rgba(5,7,12,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:opacity var(--dur-med) var(--ease);
}
[data-theme="modern"] .modal{
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
  background:color-mix(in srgb, var(--surface) calc((var(--glass-opacity-surface) + .12) * 100%), transparent);
  transition:transform var(--dur-med) var(--ease), opacity var(--dur-med) var(--ease);
}

/* Command palette (Ctrl+/) — previously untouched by any theme; its
   overlay had a hardcoded color instead of reading theme tokens, so it
   silently ignored every theme including Modern. Fixed to read the
   correct glass background and to animate open/close on Modern's own
   springy curve, exactly like every other menu in the app. */
[data-theme="modern"] .cmdk-overlay{
  background:rgba(5,7,12,.68);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:opacity var(--dur-med) var(--ease);
}
[data-theme="modern"] .cmdk{
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
  transition:transform var(--dur-med) var(--ease);
}
[data-theme="modern"] .cmdk-overlay.open .cmdk{animation:dropInModern var(--dur-med) var(--ease);}
[data-theme="modern"] .cmdk-input-row{border-bottom:1px solid var(--border);}
[data-theme="modern"] .cmdk-item{transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),padding-left var(--dur-fast) var(--ease);}
[data-theme="modern"] .cmdk-item:hover{background:rgba(34,211,238,.08);padding-left:.85rem;}
[data-theme="modern"] .cmdk-item.selected{background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(244,114,182,.06));box-shadow:inset 0 0 0 1px rgba(34,211,238,.3);}

[data-theme="modern"] .toast{
  border:1px solid var(--border);
  background:color-mix(in srgb, var(--surface) calc((var(--glass-opacity-surface) + .2) * 100%), transparent);
  backdrop-filter:blur(16px) saturate(var(--glass-saturate));
  -webkit-backdrop-filter:blur(16px) saturate(var(--glass-saturate));
  box-shadow:var(--shadow-md);
}
[data-theme="modern"] .streak-pill{background:rgba(244,114,182,.12);border-color:rgba(244,114,182,.3);color:var(--neon-magenta);}
[data-theme="modern"] .segmented{background:color-mix(in srgb, var(--surface-sunken) calc(var(--glass-opacity-chrome) * 100%), transparent);}
[data-theme="modern"] .segmented button{transition:background var(--dur-med) var(--ease),color var(--dur-med) var(--ease),box-shadow var(--dur-med) var(--ease);}
[data-theme="modern"] .segmented button.active{
  background:linear-gradient(135deg,var(--neon-cyan),#0EA5B7);color:#031014;box-shadow:0 0 14px var(--neon-cyan-glow);
}
[data-theme="modern"]::-webkit-scrollbar{width:11px;height:11px;}
[data-theme="modern"] ::-webkit-scrollbar-track{background:transparent;}
[data-theme="modern"] ::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--neon-cyan),var(--neon-magenta));
  border-radius:6px;border:2px solid var(--bg);
  transition:box-shadow var(--dur-med) var(--ease);
}
[data-theme="modern"] ::-webkit-scrollbar-thumb:hover{box-shadow:0 0 10px var(--neon-cyan-glow);}
[data-theme="modern"] *{scrollbar-color:var(--neon-cyan) transparent;}
[data-theme="modern"] .tag{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.25);color:var(--neon-cyan);transition:background var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease);}
[data-theme="modern"] .tag:hover{box-shadow:0 0 8px rgba(34,211,238,.25);}
[data-theme="modern"] .badge-correct{background:rgba(34,211,238,.16);}
[data-theme="modern"] .badge-incorrect{background:rgba(244,114,182,.16);}
[data-theme="modern"] .quiz-opt{transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease);}
[data-theme="modern"] .quiz-opt:hover{border-color:var(--neon-cyan);box-shadow:0 0 14px rgba(34,211,238,.25);}
[data-theme="modern"] ::selection{background:rgba(34,211,238,.35);color:#fff;}
@media (max-width:640px){
  [data-theme="modern"]{
    --glass-blur:12px;
    --glass-blur-chrome:14px;
  }
  [data-theme="modern"] body{animation:none;}
}


*,*::before,*::after{box-sizing:border-box;}
html{
  -webkit-text-size-adjust:100%;
  font-size:calc(16px * var(--scale));
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:600;
  color:var(--text);
  margin:0 0 .4em;
  letter-spacing:-.01em;
}
h1{font-size:1.9rem;letter-spacing:-.02em;}
h2{font-size:1.4rem;}
h3{font-size:1.12rem;}
h4{font-size:.98rem;}
p{margin:0 0 .8em;color:var(--text-soft);}
a{color:var(--accent);}
button{font-family:inherit;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::selection{background:var(--accent-soft);color:var(--accent-strong);}

*:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}
button:focus-visible,.chip:focus-visible,.nav-item:focus-visible{
  box-shadow:var(--shadow-focus);
  outline:none;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}
[data-reduced-motion="true"] *,[data-reduced-motion="true"] *::before,[data-reduced-motion="true"] *::after{
  animation-duration:.001ms !important;
  transition-duration:.001ms !important;
}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid var(--bg);}

.visually-hidden{
  position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.skip-link{
  position:fixed;top:-60px;left:12px;z-index:9999;
  background:var(--accent);color:var(--on-accent);
  padding:.6em 1em;border-radius:var(--radius-md);
  transition:top var(--dur-fast) var(--ease);
  text-decoration:none;font-weight:600;
}
.skip-link:focus{top:12px;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  z-index:40;
}
.sidebar-brand{
  display:flex;align-items:center;gap:.65rem;
  padding:1.15rem 1.15rem .9rem;
}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(155deg,var(--teal-600),var(--teal-900));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.05rem;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text strong{font-family:var(--font-display);font-size:1.08rem;letter-spacing:-.01em;}
.brand-text span{font-size:.68rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;}

.sidebar-nav{
  flex:1;
  overflow-y:auto;
  padding:.4rem .7rem 1rem;
}
.nav-group{margin-bottom:.35rem;}
.nav-group-label{
  font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-faint);padding:.85rem .6rem .3rem;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:.65rem;
  width:100%;padding:.52rem .6rem;
  border:none;background:none;color:var(--text-soft);
  border-radius:var(--radius-md);
  font-size:.87rem;font-weight:500;text-align:left;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease);
  position:relative;
}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-item:hover{background:var(--surface-raised);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:700;}
.nav-item.active::before{
  content:"";position:absolute;left:-.7rem;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0;
}
.nav-item .badge-dot{
  margin-left:auto;background:var(--amber-500);color:#fff;
  font-size:.62rem;font-weight:800;min-width:17px;height:17px;
  border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;
  padding:0 4px;font-family:var(--font-mono);
}

.sidebar-foot{
  padding:.85rem .9rem 1rem;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;
}
.streak-pill{
  display:flex;align-items:center;gap:.4rem;
  background:var(--amber-50);color:var(--amber-700);
  border:1px solid var(--amber-100);
  padding:.35rem .65rem;border-radius:var(--radius-pill);
  font-size:.78rem;font-weight:700;font-family:var(--font-mono);
  flex:1;
}
[data-theme="dark"] .streak-pill{background:rgba(217,119,6,.12);border-color:rgba(217,119,6,.3);color:var(--amber-500);}

.icon-btn{
  width:34px;height:34px;border-radius:var(--radius-md);
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all var(--dur-fast) var(--ease);
}
.icon-btn:hover{background:var(--surface-raised);color:var(--text);border-color:var(--border-strong);}
.icon-btn svg{width:16px;height:16px;}

/* ---------- Main column ---------- */
.main-col{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:var(--topbar-h);
  display:flex;align-items:center;gap:.8rem;
  padding:0 1.3rem;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.hamburger{display:none;}
.topbar-title{font-family:var(--font-display);font-size:1.05rem;font-weight:600;flex-shrink:0;}
.topbar-spacer{flex:1;}
.search-trigger{
  display:flex;align-items:center;gap:.55rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-pill);
  padding:.55rem .9rem .55rem .8rem;
  color:var(--text-faint);font-size:.82rem;
  cursor:pointer;min-width:210px;
  transition:border-color var(--dur-fast);
}
.search-trigger:hover{border-color:var(--border-strong);}
.search-trigger kbd{
  margin-left:auto;font-family:var(--font-mono);font-size:.68rem;
  background:var(--surface-sunken);padding:.12rem .38rem;border-radius:4px;
  color:var(--text-faint);
}
.sc-key{
  font-family:var(--font-mono);font-size:.72rem;font-weight:600;
  background:var(--surface-raised);border:1px solid var(--border-strong);
  padding:.15rem .5rem;border-radius:5px;box-shadow:0 1.5px 0 var(--border-strong);
  color:var(--text-soft);
}
.topbar-actions{display:flex;align-items:center;gap:.5rem;}

.view-container{
  flex:1;padding:1.4rem 1.5rem calc(3rem + var(--audio-player-clearance,0px));
  max-width:1320px;width:100%;margin:0 auto;
  transition:padding-bottom var(--dur-med) var(--ease);
}
.view{display:none;}
.view.active{display:block;animation:viewIn var(--dur-med) var(--ease);}
@keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.view-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:1rem;margin-bottom:1.3rem;flex-wrap:wrap;
}
.view-head h1{margin-bottom:.2rem;}
.view-head .sub{color:var(--text-faint);font-size:.88rem;}
.view-head-actions{display:flex;gap:.55rem;flex-wrap:wrap;}

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  height:var(--bottomnav-h);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav-scroll{
  display:flex;height:100%;overflow-x:auto;scrollbar-width:none;
}
.bottom-nav-scroll::-webkit-scrollbar{display:none;}
.bn-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.15rem;min-width:64px;flex-shrink:0;
  border:none;background:none;color:var(--text-faint);
  font-size:.6rem;font-weight:600;cursor:pointer;padding:.3rem;
}
.bn-item .ic{width:20px;height:20px;}
.bn-item.active{color:var(--accent);}
.bn-more{color:var(--text-soft);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border-radius:var(--radius-md);
  border:1px solid transparent;
  padding:.55rem 1rem;
  font-size:.85rem;font-weight:600;
  cursor:pointer;
  transition:all var(--dur-fast) var(--ease);
  white-space:nowrap;
  line-height:1.2;
}
.btn svg{width:15px;height:15px;flex-shrink:0;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--teal-600);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.btn-primary:active{transform:translateY(0);}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-secondary:hover{border-color:var(--border-strong);background:var(--surface-raised);}
.btn-ghost{background:none;color:var(--text-soft);}
.btn-ghost:hover{background:var(--surface-raised);color:var(--text);}
.btn-danger{background:var(--red-50);color:var(--red-700);border-color:var(--red-100);}
.btn-danger:hover{background:var(--red-100);}
[data-theme="dark"] .btn-danger{background:rgba(185,28,28,.15);border-color:rgba(185,28,28,.35);color:#FCA5A5;}
.btn-outline-danger{background:transparent;color:var(--red-700);border-color:var(--red-100);}
.btn-outline-danger:hover{background:var(--red-50);border-color:var(--red-700);}
.btn-outline-danger:disabled{opacity:.4;cursor:not-allowed;}
.btn-outline-danger:disabled:hover{background:transparent;border-color:var(--red-100);}
[data-theme="dark"] .btn-outline-danger{color:#FCA5A5;border-color:rgba(185,28,28,.35);}
[data-theme="dark"] .btn-outline-danger:hover{background:rgba(185,28,28,.15);border-color:#FCA5A5;}
[data-theme="purple"] .btn-outline-danger{color:#FCA5A5;border-color:rgba(185,28,28,.4);}
[data-theme="purple"] .btn-outline-danger:hover{background:rgba(185,28,28,.18);border-color:#FCA5A5;}
.dz-list{display:flex;flex-direction:column;}
.dz-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.dz-list .dz-row:last-child{border-bottom:none;}
.dz-row-main{flex:1;min-width:180px;}
.dz-row-title{font-weight:600;font-size:.88rem;color:var(--text);}
.dz-row-desc{font-size:.78rem;color:var(--text-soft);margin:.15rem 0 0;}
.btn-sm{padding:.55rem .75rem;font-size:.78rem;}
.btn-lg{padding:.72rem 1.4rem;font-size:.92rem;}
.btn-block{width:100%;}
.btn-icon-only{padding:.5rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important;}

/* ---------- Cards / surfaces ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.15rem;
  box-shadow:var(--shadow-sm);
}
.card-hover{transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease);}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;gap:.6rem;}
.card-head h3{margin:0;}

.grid{display:grid;gap:1rem;}
.grid > *{min-width:0;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

/* Stat / KPI cards */
.stat-card{
  display:flex;flex-direction:column;gap:.35rem;
  position:relative;overflow:hidden;
}
.stat-card .stat-icon{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:.3rem;
}
.stat-card .stat-icon svg{width:16px;height:16px;}
.stat-card .stat-value{
  font-family:var(--font-mono);font-size:1.7rem;font-weight:700;
  letter-spacing:-.02em;color:var(--text);
}
.stat-card .stat-label{font-size:.76rem;color:var(--text-faint);font-weight:600;}
.stat-card .stat-delta{font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:.25rem;}
.stat-delta.up{color:var(--green-700);}
.stat-delta.down{color:var(--red-700);}
.icon-teal{background:var(--teal-100);color:var(--teal-700);}
.icon-amber{background:var(--amber-100);color:var(--amber-700);}
.icon-green{background:var(--green-100);color:var(--green-700);}
.icon-ink{background:var(--ink-100);color:var(--ink-700);}
[data-theme="dark"] .icon-teal{background:rgba(19,137,127,.18);}
[data-theme="dark"] .icon-amber{background:rgba(217,119,6,.18);}
[data-theme="dark"] .icon-green{background:rgba(22,163,74,.18);}
[data-theme="dark"] .icon-ink{background:rgba(133,152,190,.18);}

/* ---------- Forms ---------- */
label{display:block;font-size:.78rem;font-weight:700;color:var(--text-soft);margin-bottom:.32rem;}
.field{margin-bottom:.95rem;}
.field-row{display:flex;gap:.8rem;flex-wrap:wrap;}
.field-row > .field{flex:1;min-width:150px;}
input[type="text"],input[type="number"],input[type="date"],input[type="time"],input[type="search"],input[type="password"],
textarea,select{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:var(--radius-md);
  padding:.58rem .75rem;
  font-size:.87rem;
  font-family:inherit;
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
}
textarea{resize:vertical;min-height:80px;line-height:1.5;}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.hint{font-size:.74rem;color:var(--text-faint);margin-top:.3rem;}
.field-error{font-size:.74rem;color:var(--red-700);margin-top:.3rem;display:none;}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--red-600);}
.field.invalid .field-error{display:block;}

.checkbox-row{display:flex;align-items:center;gap:.55rem;cursor:pointer;user-select:none;}
.checkbox-row input[type="checkbox"]{
  width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;
}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{
  position:absolute;inset:0;background:var(--border-strong);border-radius:999px;
  cursor:pointer;transition:background var(--dur-fast);
}
.switch .slider::before{
  content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:transform var(--dur-fast) var(--ease);
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(18px);}
.switch input:focus-visible + .slider{box-shadow:var(--shadow-focus);}

.segmented{
  display:inline-flex;background:var(--surface-sunken);border-radius:var(--radius-md);
  padding:3px;border:1px solid var(--border);gap:2px;flex-wrap:wrap;
}
.segmented button{
  border:none;background:none;padding:.55rem .8rem;border-radius:7px;
  font-size:.8rem;font-weight:600;color:var(--text-soft);cursor:pointer;
  transition:all var(--dur-fast);
}
.segmented button.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow-sm);}

/* Interactive Quiz theme picker (teacher-facing, inside the output modal) */
.iq-theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem;}
.iq-theme-card{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.8rem .5rem;
  border:2px solid var(--border);border-radius:var(--radius-md);cursor:pointer;background:var(--surface-sunken);
  transition:border-color var(--dur-fast),transform var(--dur-fast);
}
.iq-theme-card:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.iq-theme-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.iq-theme-swatch{
  width:44px;height:44px;border-radius:50%;border:3px solid;
  display:flex;align-items:center;justify-content:center;
}
.iq-theme-swatch span{width:18px;height:18px;border-radius:50%;display:block;}
.iq-theme-name{font-size:.74rem;font-weight:600;color:var(--text);text-align:center;line-height:1.2;}

/* Chips / tags */
.chip{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.28rem .68rem;border-radius:var(--radius-pill);
  font-size:.72rem;font-weight:700;
  background:var(--surface-sunken);color:var(--text-soft);border:1px solid var(--border);
  cursor:pointer;transition:all var(--dur-fast);white-space:nowrap;
}
.chip:hover{border-color:var(--border-strong);}
.chip.active{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent;}
.chip .x{opacity:.6;font-weight:900;}
.chip-remove-btn{background:none;border:none;padding:0;margin-left:.15rem;cursor:pointer;color:inherit;opacity:.65;font-weight:900;line-height:1;}
.tag-row{display:flex;gap:.4rem;flex-wrap:wrap;}
.tag{
  font-size:.68rem;font-weight:700;padding:.16rem .5rem;border-radius:5px;
  background:var(--surface-sunken);color:var(--text-soft);
}
.tag-important{background:var(--red-50);color:var(--red-700);}
.tag-exam{background:var(--amber-50);color:var(--amber-700);}
.tag-weak{background:var(--red-50);color:var(--red-700);}
.tag-revision{background:var(--teal-50);color:var(--teal-700);}
.tag-favorite{background:var(--amber-50);color:var(--amber-700);}
[data-theme="dark"] .tag-important,[data-theme="dark"] .tag-weak{background:rgba(185,28,28,.15);color:#FCA5A5;}
[data-theme="dark"] .tag-exam,[data-theme="dark"] .tag-favorite{background:rgba(217,119,6,.15);color:#FCD34D;}
[data-theme="dark"] .tag-revision{background:rgba(19,137,127,.18);color:#5EEAD4;}

/* Difficulty */
.diff-dot{display:inline-flex;gap:3px;align-items:center;}
.diff-dot span{width:7px;height:7px;border-radius:50%;background:var(--border-strong);opacity:.5;}
.diff-easy .d1{background:var(--green-600);opacity:1;}
.diff-medium .d1,.diff-medium .d2{background:var(--amber-500);opacity:1;}
.diff-hard .d1,.diff-hard .d2,.diff-hard .d3{background:var(--red-600);opacity:1;}

/* Badges / pills */
.badge{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:.68rem;font-weight:800;padding:.18rem .55rem;border-radius:var(--radius-pill);
  text-transform:uppercase;letter-spacing:.03em;
}
.badge-correct{background:var(--green-100);color:var(--green-700);}
.badge-incorrect{background:var(--red-100);color:var(--red-700);}
.badge-pending{background:var(--surface-sunken);color:var(--text-faint);}
[data-theme="dark"] .badge-correct{background:rgba(22,163,74,.18);}
[data-theme="dark"] .badge-incorrect{background:rgba(220,38,38,.18);}

/* Progress */
.progress-track{height:8px;border-radius:99px;background:var(--surface-sunken);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width var(--dur-slow) var(--ease);}
.progress-fill.amber{background:var(--amber-500);}
.progress-fill.green{background:var(--green-600);}
.progress-fill.red{background:var(--red-600);}

.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-center .val{font-family:var(--font-mono);font-weight:800;line-height:1;}
.ring-center .lbl{font-size:.62rem;color:var(--text-faint);font-weight:700;margin-top:.15rem;}

/* Empty / loading states */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:3rem 1.5rem;color:var(--text-faint);
}
.empty-state .ic{
  width:52px;height:52px;border-radius:16px;background:var(--surface-sunken);
  display:flex;align-items:center;justify-content:center;margin-bottom:1rem;color:var(--text-faint);
}
.empty-state .ic svg{width:24px;height:24px;}
.empty-state h3{color:var(--text-soft);margin-bottom:.3rem;}
.empty-state p{max-width:340px;font-size:.85rem;margin-bottom:1rem;}

.spinner{
  width:18px;height:18px;border-radius:50%;
  border:2.5px solid var(--border);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-inline{display:flex;align-items:center;gap:.6rem;color:var(--text-faint);font-size:.85rem;padding:2rem;justify-content:center;}
.skel{background:linear-gradient(90deg,var(--surface-sunken) 25%,var(--border) 37%,var(--surface-sunken) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:var(--radius-md);}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* Tables / lists */
.data-list{display:flex;flex-direction:column;gap:.55rem;}

/* ---------- Nested group tree (Question Bank / Notes Group Mode) ---------- */
.qg-layout{display:grid;grid-template-columns:260px 1fr;gap:1rem;align-items:start;}
@media (max-width:900px){.qg-layout{grid-template-columns:1fr;}}
.qg-sidebar{padding:.5rem;max-height:70vh;overflow-y:auto;}
.qg-row{
  display:flex;align-items:center;gap:.4rem;padding:.45rem .5rem;border-radius:var(--radius-sm);
  cursor:pointer;font-size:.85rem;transition:background var(--dur-fast);
}
.qg-row:hover{background:var(--surface-raised);}
.qg-row.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
.qg-toggle{
  background:none;border:none;color:var(--text-faint);cursor:pointer;padding:.15rem;
  display:flex;align-items:center;flex-shrink:0;border-radius:4px;
}
.qg-toggle:hover{color:var(--text);background:var(--surface-sunken);}
.qg-toggle-spacer{width:19px;flex-shrink:0;}
.qg-name{display:flex;align-items:center;gap:.4rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

}

/* ---------- Persistent Audio mini-player (Spotify-style) ----------
   Lives in the app shell, not inside any view's container, so it stays
   visible and controllable no matter which section is currently open.
   Sits above .bottom-nav on mobile, flush to the viewport bottom on
   desktop where the bottom nav is hidden. Hidden entirely (translated
   off-screen + display swap via .visible) until something is playing. */
.audio-mini-player{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  display:flex;flex-direction:column;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid var(--border);
  box-shadow:0 -8px 28px rgba(0,0,0,.18);
  transform:translateY(110%);
  transition:transform var(--dur-med) var(--ease), visibility var(--dur-med) linear;
  max-height:78vh;
  /* Belt-and-suspenders beyond the transform: without these, the element
     is still `display:flex` and technically present in the layout even
     while translated off-screen, which on some mobile WebViews can leave
     it eating taps or interfering with the real footer/bottom-nav
     underneath due to composited-transform hit-test quirks. visibility
     + pointer-events fully remove it from hit-testing and the a11y tree
     when hidden, independent of whatever the transform/compositor does. */
  visibility:hidden;
  pointer-events:none;
}
.audio-mini-player.visible{
  transform:translateY(0);
  visibility:visible;
  pointer-events:auto;
}
@media (max-width:960px){ .audio-mini-player{bottom:var(--bottomnav-h);} }

.amp-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));transition:width .3s linear;}

.amp-row{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;cursor:pointer;flex-shrink:0;}

}
.amp-meta{flex:1;min-width:0;}
.amp-title{font-size:.85rem;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.amp-controls{display:flex;align-items:center;gap:.15rem;flex-shrink:0;}
.amp-btn{width:32px;height:32px;}
.amp-btn-primary{

}
.amp-btn-primary:hover{background:var(--accent-strong);}
.amp-close{flex-shrink:0;}

.amp-expanded{

.audio-mini-player.expanded .amp-expanded{max-height:60vh;opacity:1;border-top-color:var(--border);}
.amp-expanded-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem .3rem;}
.amp-expanded-kind{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-strong);}
.amp-expanded-text{padding:0 .9rem .7rem;font-size:.88rem;line-height:1.5;color:var(--text);max-height:16vh;overflow-y:auto;}
.amp-expanded-list{padding:.3rem 0 .7rem;overflow-y:auto;max-height:34vh;border-top:1px solid var(--border);}
.amp-queue-row{

}

.amp-queue-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,21,38,.45);
  backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:1rem;opacity:0;pointer-events:none;

}

  background:var(--surface);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;

/* Toasts */
.toast-stack{
  position:fixed;bottom:1.2rem;right:1.2rem;z-index:400;
  display:flex;flex-direction:column;gap:.55rem;max-width:340px;
  transition:bottom var(--dur-med) var(--ease);
}
@media (max-width:640px){.toast-stack{left:1rem;right:1rem;bottom:calc(var(--bottomnav-h) + .8rem);max-width:none;}}
/* A single source of truth for how much extra bottom clearance the
   persistent audio player needs, expressed as one custom property that
   every affected rule's calc() reads directly. This avoids the earlier
   bug: a separate, order-dependent `padding-bottom` override rule was
   losing to the base rule's `padding` SHORTHAND at the same mobile
   breakpoint, since the shorthand resets all four sides and the override
   rule's source position relative to it made the win non-obvious. Baking
   the value into one variable that every consumer's own calc() already
   includes removes the race entirely — there is no longer a second rule
   competing to set the same property. */
body[data-audio-player-visible="true"]{ --audio-player-clearance:4.5rem; }
@media (max-width:640px){ body[data-audio-player-visible="true"]{ --audio-player-clearance:4.2rem; } }
body[data-audio-player-visible="true"] .toast-stack{bottom:calc(1.2rem + var(--audio-player-clearance));}
@media (max-width:640px){ body[data-audio-player-visible="true"] .toast-stack{bottom:calc(var(--bottomnav-h) + .8rem + var(--audio-player-clearance));} }
body[data-audio-player-visible="true"] .sd2-fab{bottom:calc(1.1rem + var(--bottomnav-h,0px) + var(--audio-player-clearance));}
@media (min-width:901px){ body[data-audio-player-visible="true"] .sd2-fab{bottom:calc(1.3rem + var(--audio-player-clearance));} }
.toast{
  display:flex;align-items:flex-start;gap:.6rem;

  padding:.75rem .9rem;border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);font-size:.83rem;
  animation:toastIn var(--dur-med) var(--ease);
}
[data-theme="dark"] .toast{background:var(--paper-50);color:var(--ink-900);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95);}to{opacity:1;transform:none;}}
.toast.leaving{animation:toastOut var(--dur-fast) var(--ease) forwards;}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}
.toast .ic{flex-shrink:0;width:16px;height:16px;margin-top:.1rem;}

.toast.error .ic{color:#F87171;}
.toast.info .ic{color:#7DD3FC;}
.toast-close{margin-left:auto;background:none;border:none;color:inherit;opacity:.6;cursor:pointer;flex-shrink:0;padding:.35rem .5rem;margin:-.35rem -.5rem -.35rem 0;border-radius:6px;}
.toast-action{
  margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  color:inherit;cursor:pointer;font-size:.78rem;font-weight:700;padding:.3rem .6rem;border-radius:6px;
  display:flex;align-items:center;gap:.3rem;white-space:nowrap;
}
.toast-action:hover{background:rgba(255,255,255,.24);}
.toast-action + .toast-close{margin-left:.3rem;}
[data-theme="dark"] .toast-action{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.3);}
[data-theme="dark"] .toast-action:hover{background:rgba(0,0,0,.3);}

/* Command palette */
.cmdk-overlay{
  position:fixed;inset:0;background:rgba(10,21,38,.5);z-index:500;
  display:flex;align-items:flex-start;justify-content:center;padding:10vh 1rem 1rem;
  opacity:0;pointer-events:none;transition:opacity var(--dur-fast);
}
.cmdk-overlay.open{opacity:1;pointer-events:auto;}
.cmdk{
  width:100%;max-width:560px;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--border);
  transform:translateY(-8px);transition:transform var(--dur-fast);
}

.cmdk-input-row{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);}

.cmdk-input-row input{border:none;background:none;font-size:.95rem;flex:1;padding:0;color:var(--text);}

.cmdk-group-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:700;padding:.6rem .7rem .3rem;}
.cmdk-item{
  display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border-radius:var(--radius-md);
  cursor:pointer;font-size:.85rem;color:var(--text);
}
.cmdk-item .ic{width:16px;height:16px;color:var(--text-faint);flex-shrink:0;}
.cmdk-item.selected{background:var(--accent-soft);color:var(--accent-strong);}
.cmdk-item.selected .ic{color:var(--accent-strong);}
.cmdk-item .cmdk-meta{margin-left:auto;font-size:.7rem;color:var(--text-faint);}
.cmdk-empty{padding:2rem;text-align:center;color:var(--text-faint);font-size:.85rem;}

/* Flashcards */
.fc-stage{
  display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding:1rem 0 2rem;
}
.fc-card-outer{
  width:100%;max-width:480px;height:280px;perspective:1400px;
  position:relative;
}
.fc-card-outer::before{
  content:'';position:absolute;inset:-3px;border-radius:calc(var(--radius-xl) + 3px);
  background:linear-gradient(135deg,var(--accent),var(--accent-strong),var(--accent));
  opacity:.55;filter:blur(14px);z-index:0;
  transition:opacity var(--dur-med) var(--ease);
}
.fc-card-outer:hover::before{opacity:.85;}
.fc-card{
  width:100%;height:100%;position:relative;transform-style:preserve-3d;z-index:1;
  transition:transform var(--dur-slow) var(--ease);cursor:pointer;
}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:var(--radius-xl);border:1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.8rem;text-align:center;
  box-shadow:var(--shadow-lg), inset 0 1px 0 color-mix(in srgb, var(--accent) 12%, transparent);
  background:var(--surface);
}
.fc-face-front{background:linear-gradient(155deg,var(--surface),var(--surface-raised) 60%,color-mix(in srgb, var(--accent) 6%, var(--surface-raised)));}
.fc-face-back{transform:rotateY(180deg);background:linear-gradient(155deg,var(--accent-soft),color-mix(in srgb, var(--accent) 14%, var(--accent-soft)));border-color:color-mix(in srgb, var(--accent) 45%, var(--border));}
.fc-face .label{position:absolute;top:1rem;left:1.2rem;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-strong);opacity:.75;}
.fc-face .content{font-size:1.15rem;font-weight:600;font-family:var(--font-display);line-height:1.4;max-height:100%;overflow-y:auto;}
.fc-face img{max-width:100%;max-height:110px;border-radius:var(--radius-md);margin-top:.7rem;object-fit:contain;}
.fc-hint{font-size:.74rem;color:var(--text-faint);}
.fc-controls{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.fc-grade-row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:480px;}
.fc-grade-btn{
  flex:1;min-width:90px;padding:.65rem .5rem;border-radius:var(--radius-md);
  border:1.5px solid var(--border);background:var(--surface);cursor:pointer;
  font-size:.78rem;font-weight:700;transition:all var(--dur-fast);display:flex;flex-direction:column;gap:.15rem;align-items:center;
}
.fc-grade-btn:hover{transform:translateY(-3px);}
.fc-grade-btn small{font-weight:500;color:var(--text-faint);font-size:.65rem;}
.fc-grade-again{border-color:var(--red-100);color:var(--red-700);}
.fc-grade-again:hover{border-color:var(--red-600);box-shadow:0 4px 16px rgba(220,38,38,.3);}
.fc-grade-hard{border-color:var(--amber-100);color:var(--amber-700);}
.fc-grade-hard:hover{border-color:var(--amber-600);box-shadow:0 4px 16px rgba(217,119,6,.3);}
.fc-grade-good{border-color:var(--teal-100);color:var(--teal-700);}
.fc-grade-good:hover{border-color:var(--teal-600);box-shadow:0 4px 16px rgba(19,137,127,.3);}
.fc-grade-easy{border-color:var(--green-100);color:var(--green-700);}
.fc-grade-easy:hover{border-color:var(--green-600);box-shadow:0 4px 16px rgba(22,163,74,.3);}
[data-theme="dark"] .fc-grade-again{border-color:rgba(220,38,38,.4);color:#FCA5A5;}
[data-theme="dark"] .fc-grade-hard{border-color:rgba(217,119,6,.4);color:#FCD34D;}

/* Quiz runner */
.quiz-shell{max-width:760px;margin:0 auto;}
.quiz-progress-row{display:flex;align-items:center;gap:1rem;margin-bottom:1.3rem;}
.quiz-timer{
  font-family:var(--font-mono);font-weight:800;font-size:1rem;
  background:var(--surface);border:1px solid var(--border);padding:.4rem .8rem;border-radius:var(--radius-pill);
  display:flex;align-items:center;gap:.4rem;flex-shrink:0;
}
.quiz-timer.low{color:var(--red-700);border-color:var(--red-100);background:var(--red-50);}
.quiz-qcard{padding:1.6rem;}
.quiz-qmeta{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;}

}

.quiz-opt.selected{border-color:var(--accent);background:var(--accent-soft);}

.quiz-opt.incorrect{border-color:var(--red-600);background:var(--red-50);}
[data-theme="dark"] .quiz-opt.correct{background:rgba(22,163,74,.14);}
[data-theme="dark"] .quiz-opt.incorrect{background:rgba(220,38,38,.14);}
.quiz-opt .opt-letter{
  width:26px;height:26px;border-radius:50%;background:var(--surface-sunken);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;
}

.quiz-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.3rem;gap:.6rem;flex-wrap:wrap;}
.quiz-qgrid{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem;}
.qg-dot{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-mono);font-size:.72rem;font-weight:700;cursor:pointer;color:var(--text-soft);
}

/* Heatmap */
.heatmap-wrap{overflow-x:auto;padding-bottom:.4rem;}
.heatmap-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content;}
.hm-cell{width:11px;height:11px;border-radius:2px;background:var(--surface-sunken);}
.hm-cell[data-level="1"]{background:var(--teal-100);}
.hm-cell[data-level="2"]{background:var(--teal-500);}
.hm-cell[data-level="3"]{background:var(--teal-700);}
.hm-cell[data-level="4"]{background:var(--teal-900);}
[data-theme="dark"] .hm-cell[data-level="1"]{background:rgba(19,137,127,.35);}
.heatmap-legend{display:flex;align-items:center;gap:.3rem;font-size:.68rem;color:var(--text-faint);margin-top:.5rem;justify-content:flex-end;}

/* Bar chart (CSS) */
.bar-chart{display:flex;align-items:flex-end;gap:.5rem;height:150px;padding-top:1rem;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-chart .bar{width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 0 0;transition:height var(--dur-slow) var(--ease);min-height:2px;}
.bar-chart .bar-wrap{display:flex;align-items:flex-end;justify-content:center;height:118px;width:100%;}
.bar-chart .bar-empty{background:var(--border);height:4px !important;width:60%;border-radius:2px;align-self:center;}
.bar-chart .bar-label{font-size:.65rem;color:var(--text-faint);font-weight:600;margin-top:.5rem;}
.bar-chart .bar-value{font-size:.65rem;font-family:var(--font-mono);color:var(--text-soft);font-weight:700;margin-bottom:.5rem;}

/* Command / util */
.calc-display{
  background:var(--ink-900);color:#fff;border-radius:var(--radius-md);
  padding:1rem;text-align:right;font-family:var(--font-mono);font-size:1.7rem;
  margin-bottom:.8rem;overflow-x:auto;white-space:nowrap;
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;}
.calc-btn{padding:.9rem;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);font-size:1rem;font-weight:600;cursor:pointer;font-family:var(--font-mono);}
.calc-btn:hover{background:var(--surface-raised);}
.calc-btn.op{background:var(--accent-soft);color:var(--accent-strong);}
.calc-btn.eq{background:var(--accent);color:#fff;grid-row:span 1;}

.timer-display{
  font-family:var(--font-mono);font-size:3.4rem;font-weight:800;text-align:center;
  padding:1.5rem 0;letter-spacing:-.02em;
}
.timer-ring-wrap{display:flex;justify-content:center;margin-bottom:1rem;}

.pomo-mode-row{display:flex;justify-content:center;gap:.5rem;margin-bottom:1rem;}

/* Misc */
.divider{height:1px;background:var(--border);margin:1.1rem 0;border:none;}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:.7rem;}
.flex-gap{display:flex;align-items:center;gap:.5rem;}
.text-faint{color:var(--text-faint);}
.text-soft{color:var(--text-soft);}
.text-center{text-align:center;}
.mt-0{margin-top:0;}
.mb-0{margin-bottom:0;}
.w-full{width:100%;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scroll-x{overflow-x:auto;}
.kbd{font-family:var(--font-mono);font-size:.68rem;background:var(--surface-sunken);border:1px solid var(--border);border-bottom-width:2px;padding:.08rem .4rem;border-radius:5px;}

.section-title{
  font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-faint);margin:1.6rem 0 .7rem;
}
.section-title:first-child{margin-top:0;}

/* Command palette FAB removed in favor of topbar trigger; keep small util */
.dropdown{position:relative;display:inline-block;}
.dropdown-menu{
  position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);
  min-width:190px;padding:.4rem;z-index:60;display:none;
}
.dropdown-menu.open{display:block;animation:dropIn var(--dur-fast) var(--ease);}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.dropdown-item{
  display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem .65rem;
  border:none;background:none;border-radius:7px;font-size:.83rem;text-align:left;cursor:pointer;color:var(--text);
}
.dropdown-item:hover{background:var(--surface-raised);}
.dropdown-item svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
.dropdown-item.danger{color:var(--red-700);}

.confidence-row{display:flex;gap:.4rem;}
.conf-btn{
  flex:1;padding:.5rem;border-radius:var(--radius-md);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:.78rem;font-weight:700;
}
.conf-btn.active{background:var(--accent);color:#fff;border-color:transparent;}

.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;}
@media (max-width:640px){.match-grid{grid-template-columns:repeat(3,1fr);}}
.match-tile{
  aspect-ratio:1;border-radius:var(--radius-md);border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.78rem;font-weight:600;text-align:center;padding:.5rem;
  transition:all var(--dur-fast);
}
.match-tile.flipped{background:var(--accent-soft);border-color:var(--accent);}
.match-tile.matched{background:var(--green-50);border-color:var(--green-600);color:var(--green-700);opacity:.7;}
.match-tile.hidden-face{color:transparent;background:var(--surface-sunken);}
[data-theme="dark"] .match-tile.matched{background:rgba(22,163,74,.15);}

/* ---------- Week planner grid ---------- */
.week-nav{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;}
.week-nav .wn-label{font-family:var(--font-display);font-weight:600;font-size:1.02rem;flex:1;}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.55rem;min-width:0;}
@media (max-width:960px){
  .week-grid{grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.3rem;width:100%;box-sizing:border-box;}
  #plLeftCol,.week-nav{min-width:0;max-width:100%;}
}
.week-day{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:.7rem .6rem;min-height:150px;display:flex;flex-direction:column;gap:.4rem;
}
.week-day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.week-day-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:.4rem;border-bottom:1px solid var(--border);margin-bottom:.1rem;}
.week-day-head .wd-dow{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);}
.week-day-head .wd-num{font-family:var(--font-mono);font-weight:700;font-size:.95rem;}
.week-day.is-today .wd-num{color:var(--accent-strong);}
.wd-task{
  background:var(--surface-raised);border:1px solid var(--border);border-radius:7px;
  padding:.32rem .45rem;font-size:.72rem;font-weight:600;cursor:pointer;line-height:1.3;
  display:flex;align-items:flex-start;gap:.3rem;
}
.wd-task:hover{border-color:var(--border-strong);}
.wd-task.done{opacity:.55;text-decoration:line-through;}
.wd-task .wd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:.32rem;background:var(--ink-400);}
.wd-task.p-high .wd-dot{background:var(--red-600);}
.wd-task.p-medium .wd-dot{background:var(--amber-500);}
.wd-task.p-low .wd-dot{background:var(--teal-500);}
.wd-add{
  border:1.5px dashed var(--border);background:none;border-radius:7px;
  padding:.6rem .3rem;font-size:.7rem;color:var(--text-faint);cursor:pointer;text-align:center;
  margin-top:auto;
}
.wd-add:hover{border-color:var(--border-strong);color:var(--text-soft);}
.recur-pill{font-size:.6rem;background:var(--teal-100);color:var(--teal-700);padding:.05rem .34rem;border-radius:5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-left:.3rem;}
[data-theme="dark"] .recur-pill{background:rgba(19,137,127,.22);color:var(--teal-500);}

/* ---------- Today view ---------- */
.today-hero{
  background:linear-gradient(135deg,var(--ink-900),var(--ink-800));color:#fff;border:none;
  border-radius:var(--radius-xl);padding:1.5rem 1.6rem;margin-bottom:1.1rem;
}
.today-hero h2{color:#fff;margin-bottom:.25rem;}
.today-hero p{color:rgba(255,255,255,.7);margin-bottom:0;}
.today-hero .btn-primary{background:#fff;color:var(--ink-900);}
.today-hero .btn-primary:hover{background:var(--paper-200);}
.today-block{margin-bottom:1.1rem;}
.today-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;}
.today-block-head h3{margin:0;font-size:1.02rem;}
.suggest-row{
  display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);
  margin-bottom:.5rem;
}
.suggest-row .sr-icon{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.suggest-row .sr-main{flex:1;min-width:0;}
.suggest-row .sr-title{font-weight:600;font-size:.85rem;}
.suggest-row .sr-sub{font-size:.74rem;color:var(--text-faint);}

/* ---------- Backup reminder banner ---------- */
.backup-nudge{
  display:flex;align-items:center;gap:.7rem;
  background:var(--amber-50);border:1px solid var(--amber-100);border-radius:var(--radius-md);
  padding:.65rem .9rem;margin-bottom:1.1rem;font-size:.82rem;color:var(--amber-700);
}
[data-theme="dark"] .backup-nudge{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.28);color:var(--amber-500);}
.backup-nudge .bn-icon{flex-shrink:0;display:flex;}
.backup-nudge .bn-text{flex:1;}
.backup-nudge button{flex-shrink:0;}

/* ---------- Persistent mini timer (topbar) ---------- */
.mini-timer{
  display:flex;align-items:center;gap:.4rem;background:var(--accent-soft);color:var(--accent-strong);
  padding:.32rem .65rem;border-radius:var(--radius-pill);font-family:var(--font-mono);font-weight:700;
  font-size:.78rem;cursor:pointer;border:none;
}
.mini-timer .mt-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-strong);animation:mtpulse 1.6s ease infinite;}
@keyframes mtpulse{0%,100%{opacity:1;}50%{opacity:.3;}}

@media (max-width:960px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform var(--dur-med) var(--ease);box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim{position:fixed;inset:0;background:rgba(10,21,38,.4);z-index:39;opacity:0;pointer-events:none;transition:opacity var(--dur-med);}
  .sidebar-scrim.open{opacity:1;pointer-events:auto;}
  .hamburger{display:flex;}
  .search-trigger{min-width:0;flex:1;}
  .search-trigger span.st-label{display:none;}
  .search-trigger kbd{display:none;}
  .view-container{padding:1rem 1rem calc(var(--bottomnav-h) + 2rem + var(--audio-player-clearance,0px));}
  .bottom-nav{display:block;}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:480px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  h1{font-size:1.5rem;}
  .fc-card-outer{height:240px;}
}

@media print{
  .sidebar,.bottom-nav,.topbar,.toast-stack,.cmdk-overlay,.modal-overlay,.sd2-fab,.audio-mini-player{display:none !important;}
  body{background:#fff;color:#000;}
  .view-container{max-width:100%;padding:0;}
  .no-print{display:none !important;}
  #app{display:block !important;height:auto !important;min-height:0 !important;}
  #mainRegion > *:not(.print-only){display:none !important;}
  .print-only{display:block !important;}
}
.print-only{display:none;}

/* Print-only document styling for worksheets and the study report -
   deliberately plain/document-like (serif headings, black text, ruled
   lines) rather than matching the app's own UI chrome, since these are
   meant to be handed to someone else on paper. */
.print-only{font-family:Georgia,'Times New Roman',serif;color:#111;max-width:720px;margin:0 auto;padding:1.5rem;}
.print-only h1,.print-only h2,.print-only h3{color:#111;}
.print-only p{color:#111;}
.print-only .ws-header{border-bottom:2px solid #111;padding-bottom:.6rem;margin-bottom:1rem;}
.print-only .ws-header h1{font-size:1.5rem;margin:0 0 .5rem;}
.print-only .ws-header h2{font-size:1.2rem;margin:0;}
.print-only .ws-meta-row{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.85rem;}
.print-only .ws-fill{border-bottom:1px solid #111;padding-bottom:1px;}
.print-only h3{font-size:1.05rem;border-bottom:1px solid #999;padding-bottom:.3rem;margin-bottom:.6rem;}
.print-only table{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:.4rem;}
.print-only table th,.print-only table td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid #ddd;}
.print-only table th{font-weight:700;border-bottom:2px solid #111;color:#333;}
.print-only ol.ws-qlist{list-style:none;counter-reset:wsq;padding:0;margin:0;}
.print-only ol.ws-qlist.ws-sub{margin-left:0;}
.print-only .ws-q{counter-increment:wsq;margin-bottom:1.1rem;padding-bottom:.2rem;page-break-inside:avoid;}
.print-only .ws-q::before{content:counter(wsq)'. ';font-weight:700;}
.print-only .ws-section-title{font-weight:700;font-size:1.02rem;margin:1rem 0 .5rem;list-style:none;}
.print-only .ws-qtext{display:inline;}
.print-only .ws-marks{font-style:italic;color:#555;font-weight:400;}
.print-only .ws-options{margin:.5rem 0 0 1.4rem;}
.print-only .ws-opt{margin-bottom:.3rem;font-size:.92rem;}
.print-only .ws-opt-letter{font-weight:700;margin-right:.3rem;}
.print-only .ws-fillblank{margin:.5rem 0 0 1.4rem;font-size:.92rem;}
.print-only .ws-blankline{display:inline-block;width:200px;border-bottom:1px solid #111;margin-left:.3rem;}
.print-only .ws-ruled{margin:.6rem 0 0 1.4rem;}
.print-only .ws-ruled-line{border-bottom:1px solid #bbb;height:1.6rem;}
.print-only .ws-pagebreak{page-break-before:always;}
.print-only ol.ws-keylist{padding-left:1.4rem;font-size:.9rem;}
.print-only ol.ws-keylist li{margin-bottom:.35rem;}

/* ---------- Teacher Mode: Question Paper + OMR sheet print styles ---------- */
.print-only .qp-header{position:relative;}
.print-only .qp-school{text-align:center;font-size:1rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.2rem;}
.print-only .qp-sub-meta{text-align:center;font-size:.92rem;color:#333;margin-bottom:.5rem;}
.print-only .qp-set-badge{position:absolute;top:0;right:0;border:2px solid #111;padding:.2rem .6rem;font-weight:700;font-size:.85rem;}
.print-only .qp-instructions{font-size:.88rem;border:1px solid #999;padding:.5rem .7rem;margin-bottom:.9rem;background:#f7f7f7;}
.print-only .qp-marks-table{width:100%;border-collapse:collapse;margin-bottom:1.1rem;font-size:.85rem;}
.print-only .qp-marks-table th,.print-only .qp-marks-table td{border:1px solid #333;padding:.3rem .5rem;text-align:left;}
.print-only .qp-section-title{margin-top:1.1rem;margin-bottom:.4rem;font-size:1rem;border-bottom:1px solid #999;padding-bottom:.2rem;}

.print-only .omr-header{text-align:center;}
.print-only .omr-roll-grid{display:flex;gap:.35rem;justify-content:center;margin:1rem 0;}
.print-only .omr-roll-col{display:flex;flex-direction:column;align-items:center;gap:.25rem;}
.print-only .omr-roll-digit-label{font-size:.7rem;color:#555;margin-bottom:.15rem;}
.print-only .omr-bubble{
  width:1.15rem;height:1.15rem;border:1.5px solid #111;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#333;
}
.print-only .omr-instructions{font-size:.78rem;font-style:italic;color:#444;text-align:center;margin-bottom:1rem;}
.print-only .omr-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1.5rem;}
.print-only .omr-row{display:flex;align-items:center;gap:.4rem;font-size:.82rem;}
.print-only .omr-qnum{width:1.6rem;flex-shrink:0;font-weight:700;text-align:right;}
.print-only .omr-opt{display:flex;align-items:center;gap:.15rem;}
.print-only .omr-bubble-sm{width:.95rem;height:.95rem;font-size:.55rem;}

/* ============================================================
   STUDYDESK v2 UPGRADE — ADDITIVE STYLES
   ============================================================ */
.sd2-json-tabs{display:flex;gap:.4rem;margin-bottom:.8rem;border-bottom:1px solid var(--border);}
.sd2-json-tab{background:none;border:none;padding:.55rem .9rem;font-size:.82rem;font-weight:600;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font-body);}
.sd2-json-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.sd2-json-pane{display:none;}
.sd2-json-pane.active{display:block;}
.sd2-paste-area{width:100%;min-height:180px;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;padding:.7rem;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface-raised);color:var(--text);resize:vertical;}
.sd2-paste-area:focus{outline:2px solid var(--accent);outline-offset:1px;}
.sd2-sample-block{background:var(--surface-sunken);border-radius:var(--radius-sm);padding:.6rem .7rem;font-family:var(--font-mono);font-size:.7rem;line-height:1.5;overflow-x:auto;white-space:pre;color:var(--text-soft);margin:.5rem 0;max-height:140px;overflow-y:auto;}
.sd2-import-summary{border-radius:var(--radius-md);padding:.7rem .9rem;font-size:.8rem;margin-top:.6rem;}
.sd2-import-summary.ok{background:var(--green-50);color:var(--green-700);border:1px solid var(--green-100);}
.sd2-import-summary.err{background:var(--red-50);color:var(--red-700);border:1px solid var(--red-100);}
.sd2-import-summary code{background:rgba(0,0,0,.08);padding:.1rem .3rem;border-radius:4px;}
.sd2-dupe-row{display:flex;justify-content:space-between;gap:.6rem;padding:.3rem 0;font-size:.78rem;border-bottom:1px dashed var(--border);}
.sd2-dupe-row:last-child{border-bottom:none;}
.sd2-mode-toggle{display:flex;gap:.5rem;margin:.7rem 0;flex-wrap:wrap;}
.sd2-mode-opt{flex:1;min-width:130px;border:1px solid var(--border);border-radius:var(--radius-md);padding:.6rem .7rem;cursor:pointer;font-size:.78rem;}
.sd2-mode-opt.active{border-color:var(--accent);background:var(--teal-50);}
.sd2-mode-opt b{display:block;font-size:.8rem;margin-bottom:.15rem;}
[data-theme="dark"] .sd2-mode-opt.active{background:var(--ink-800);}
.sd2-fab{position:fixed;z-index:40;bottom:calc(var(--bottomnav-h) + 1.1rem);right:1.1rem;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;}
@media (min-width:901px){.sd2-fab{bottom:1.3rem;right:1.3rem;}}
.sd2-goal-ring-row{display:flex;align-items:center;gap:1rem;}
.sd2-pin-badge{position:absolute;top:.5rem;right:.5rem;color:var(--amber-600);}
.sd2-quickcap-overlay{position:fixed;inset:0;background:rgba(10,21,38,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:640px){.sd2-quickcap-overlay{align-items:center;}}
.sd2-quickcap-box{background:var(--surface);width:100%;max-width:480px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1rem;box-shadow:0 -8px 30px rgba(0,0,0,.25);}
@media (min-width:640px){.sd2-quickcap-box{border-radius:var(--radius-lg);}}
.sd2-cmd-hint{font-size:.7rem;color:var(--text-faint);text-align:center;margin-top:.4rem;}
.sd2-progress-mini{height:6px;border-radius:4px;background:var(--surface-sunken);overflow:hidden;}
.sd2-progress-mini > div{height:100%;background:var(--accent);}
.sd2-focus-overlay{position:fixed;inset:0;background:var(--ink-950);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:1.2rem;}
.sd2-focus-time{font-family:var(--font-mono);font-size:3.4rem;font-weight:700;letter-spacing:.02em;}
.sd2-streak-chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--amber-50);color:var(--amber-700);border-radius:999px;padding:.25rem .6rem;font-size:.72rem;font-weight:700;}
[data-theme="dark"] .sd2-streak-chip{background:rgba(245,158,11,.15);}
.sd2-formula-chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--surface-sunken);border-radius:6px;padding:.15rem .5rem;font-family:var(--font-mono);font-size:.76rem;cursor:pointer;border:1px solid var(--border);margin:.15rem;}
.sd2-formula-chip:hover{border-color:var(--accent);}
.sd2-textclamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sd2-banner{border-radius:var(--radius-md);padding:.65rem .9rem;font-size:.8rem;display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;}
.sd2-banner.warn{background:var(--amber-50);color:var(--amber-700);border:1px solid var(--amber-100);}
[data-theme="dark"] .sd2-banner.warn{background:rgba(217,119,6,.13);}

/* ---- Deep Dark+ Purple theme component overrides (mirrors the dark
   theme overrides above; semantic colors - amber/red/green for
   warning/danger/success - keep the same meaning across all dark-family
   themes, teal-tinted accent rules become violet-tinted to match the

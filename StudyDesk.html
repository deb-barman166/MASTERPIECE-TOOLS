      '<div class="section-title" style="margin-top:.9rem;">2. Set once, applies to everything you add below</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Subject</label><input type="text" id="qaSubject" list="qaSubjectList" value="'+U.esc(qaState.subject)+'" placeholder="e.g. Physics"><datalist id="qaSubjectList">'+SD_Bank.getSubjectNames().map(function(s){return '<option value="'+U.esc(s)+'">';}).join('')+'</datalist></div>'+
        '<div class="field"><label>Topic</label><input type="text" id="qaTopic" list="qaTopicList" value="'+U.esc(qaState.topic)+'" placeholder="e.g. Optics"><datalist id="qaTopicList">'+SD_Bank.getTopicNames().map(function(t){return '<option value="'+U.esc(t)+'">';}).join('')+'</datalist></div>'+
      '</div>'+
      '<div id="qaGroupWrap" style="display:'+(qaState.contentType!=='flashcards'?'block':'none')+';">'+
        '<div class="field"><label>Group (optional)</label><select id="qaGroup"><option value="">No group</option>'+groupOpts.map(function(g){return '<option value="'+g.id+'"'+(qaState.groupId===g.id?' selected':'')+'>'+U.esc(g.path)+'</option>';}).join('')+'</select></div>'+
      '</div>'+
      '<div id="qaDeckWrap" style="display:'+(qaState.contentType==='flashcards'?'block':'none')+';">'+
        '<div class="field"><label>Deck</label><select id="qaDeck"><option value="__new__">+ Create a new deck</option>'+State.flashcardDecks.map(function(d){return '<option value="'+d.id+'"'+(qaState.deckId===d.id?' selected':'')+'>'+U.esc(d.name)+'</option>';}).join('')+'</select></div>'+
        '<div class="field" id="qaNewDeckWrap"><label>New deck name</label><input type="text" id="qaNewDeckName" placeholder="e.g. Physics — Optics"></div>'+
      '</div>'+
      '<div id="qaDifficultyWrap" style="display:'+(qaState.contentType!=='notes'?'block':'none')+';">'+
        '<div class="field"><label>Default difficulty</label><select id="qaDifficulty">'+
          '<option value="easy"'+(qaState.difficulty==='easy'?' selected':'')+'>Easy</option>'+
          '<option value="medium"'+(qaState.difficulty==='medium'?' selected':'')+'>Medium</option>'+
          '<option value="hard"'+(qaState.difficulty==='hard'?' selected':'')+'>Hard</option>'+
        '</select></div>'+
      '</div>'+

      '<div class="section-title" style="margin-top:.9rem;">3. Add items</div>'+
      '<div id="qaItemForm"></div>'+
    '</div>'+

    '<div class="as-side-col">'+
      '<div class="card">'+
        '<h3 style="margin-bottom:.3rem;">Added this session</h3>'+
        '<div class="sub" style="margin-bottom:.6rem;" id="qaDraftCount"></div>'+
        '<div id="qaDraftList" class="data-list" style="max-height:360px;overflow-y:auto;"></div>'+
        '<button class="btn btn-primary" id="qaSaveAllBtn" style="width:100%;margin-top:.8rem;">'+U.svgIcon('check',15)+' Save All to StudyDesk</button>'+
      '</div>'+
      (savedTemplates.length ? '<div class="card"><h3 style="margin-bottom:.6rem;">Saved Templates</h3><div class="data-list">'+
        savedTemplates.map(function(t){
          return '<div class="list-row" data-tplid="'+t.id+'"><div class="list-row-main"><div class="list-row-title">'+U.esc(t.name)+'</div>'+
            '<div class="list-row-meta"><span class="tag">'+U.esc(t.config.contentType)+'</span>'+(t.config.subject?'<span class="tag">'+U.esc(t.config.subject)+'</span>':'')+'</div></div>'+
            '<div class="list-row-actions"><button class="btn btn-secondary btn-sm" data-act="load">Load</button><button class="icon-btn" data-act="del">'+U.svgIcon('trash',13)+'</button></div></div>';
        }).join('')+'</div></div>' : '')+
    '</div>'+
  '</div>';

  function renderDraftList(){
    const listEl = container.querySelector('#qaDraftList');
    const countEl = container.querySelector('#qaDraftCount');
    countEl.textContent = qaState.drafts.length+' item'+(qaState.drafts.length===1?'':'s')+' waiting to be saved';
    container.querySelector('#qaSaveAllBtn').disabled = !qaState.drafts.length;
    if(!qaState.drafts.length){
      listEl.innerHTML = '<p class="text-faint" style="font-size:.8rem;">Nothing added yet — use the form to the left.</p>';
      return;
    }
    listEl.innerHTML = qaState.drafts.map(function(d,i){
      const label = d.kind==='question' ? U.truncate(d.text||'(empty)',60) : d.kind==='flashcard' ? U.truncate(d.front||'(empty)',60) : U.truncate(d.title||'(empty)',60);
      return '<div class="list-row" data-idx="'+i+'"><div class="list-row-main"><div class="list-row-title" style="font-size:.82rem;">'+U.esc(label)+'</div></div>'+
        '<div class="list-row-actions"><button class="icon-btn" data-act="del" title="Remove">'+U.svgIcon('trash',13)+'</button></div></div>';
    }).join('');
    listEl.querySelectorAll('[data-idx]').forEach(function(row){
      row.querySelector('[data-act="del"]').addEventListener('click',function(){
        qaState.drafts.splice(parseInt(row.dataset.idx,10),1);
        renderDraftList();
      });
    });
    U.paintIcons(listEl);
  }

  function renderItemForm(){
    const formEl = container.querySelector('#qaItemForm');
    if(qaState.contentType==='questions'){
      formEl.innerHTML =
        '<div class="field"><label>Question type</label><div class="segmented" id="qaQTypeSeg">'+
          '<button data-v="mcq" class="active">Multiple choice</button><button data-v="truefalse">True / False</button>'+
        '</div></div>'+
        '<div class="field"><label>Question text</label><textarea id="qaQText" rows="2" placeholder="Type the question…"></textarea></div>'+
        '<div id="qaQTypeBody"></div>'+
        '<div class="field"><label>Explanation (optional)</label><input type="text" id="qaQExplain" placeholder="Shown after answering"></div>'+
        '<button type="button" class="btn btn-primary" id="qaAddItemBtn" style="width:100%;">'+U.svgIcon('plus',14)+' Add &amp; Next</button>';
      renderQuestionTypeBody('mcq');
      formEl.querySelector('#qaQTypeSeg').querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){
          formEl.querySelector('#qaQTypeSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
          b.classList.add('active');
          renderQuestionTypeBody(b.dataset.v);
        });
      });
    } else if(qaState.contentType==='flashcards'){
      formEl.innerHTML =
        '<div class="field"><label>Front</label><input type="text" id="qaFcFront" placeholder="Question or term"></div>'+
        '<div class="field"><label>Back</label><input type="text" id="qaFcBack" placeholder="Answer or definition"></div>'+
        '<button type="button" class="btn btn-primary" id="qaAddItemBtn" style="width:100%;">'+U.svgIcon('plus',14)+' Add &amp; Next</button>';
    } else {
      formEl.innerHTML =
        '<div class="field"><label>Title</label><input type="text" id="qaNTitle" placeholder="Short, specific title"></div>'+
        '<div class="field"><label>Body</label><textarea id="qaNBody" rows="4" placeholder="Note content — supports # headings, - bullets, ** bold"></textarea></div>'+
        '<button type="button" class="btn btn-primary" id="qaAddItemBtn" style="width:100%;">'+U.svgIcon('plus',14)+' Add &amp; Next</button>';
    }
    formEl.querySelector('#qaAddItemBtn').addEventListener('click',addCurrentItem);
  }
  function renderQuestionTypeBody(qtype){
    const wrap = container.querySelector('#qaQTypeBody');
    if(qtype==='mcq'){
      wrap.innerHTML = '<div class="field"><label>Options (select the correct one)</label>'+
        [0,1,2,3].map(function(i){
          return '<div class="flex-gap" style="margin-bottom:.4rem;align-items:center;">'+
            '<input type="radio" name="qaMcqCorrect" value="'+i+'" '+(i===0?'checked':'')+'>'+
            '<input type="text" class="qa-opt-text" data-idx="'+i+'" placeholder="Option '+String.fromCharCode(65+i)+'" style="flex:1;">'+
          '</div>';
        }).join('')+'</div>';
    } else {
      wrap.innerHTML = '<div class="field"><label>Correct answer</label><div class="segmented" id="qaTfSeg"><button data-v="true" class="active">True</button><button data-v="false">False</button></div></div>';
      wrap.querySelector('#qaTfSeg').querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){ wrap.querySelector('#qaTfSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); });
      });
    }
  }

  function addCurrentItem(){
    if(qaState.contentType==='questions'){
      const text = container.querySelector('#qaQText').value.trim();
      if(!text){ toast('Question text is required','error'); return; }
      const qtype = container.querySelector('#qaQTypeSeg button.active').dataset.v;
      const draft = {kind:'question', text:text, qtype:qtype, explanation:container.querySelector('#qaQExplain').value.trim()};
      if(qtype==='mcq'){
        const optEls = container.querySelectorAll('.qa-opt-text');
        const options = Array.from(optEls).map(function(el){return el.value.trim();});
        const filled = options.filter(Boolean);
        if(filled.length<2){ toast('Add at least 2 options','error'); return; }
        const correctIdx = parseInt(container.querySelector('input[name="qaMcqCorrect"]:checked').value,10);
        if(!options[correctIdx]){ toast('The selected correct option is empty','error'); return; }
        draft.options = options; draft.correctIndex = correctIdx;
      } else {
        draft.tfAnswer = container.querySelector('#qaTfSeg button.active').dataset.v;
      }
      qaState.drafts.push(draft);
      container.querySelector('#qaQText').value='';
      container.querySelector('#qaQExplain').value='';
      if(qtype==='mcq') container.querySelectorAll('.qa-opt-text').forEach(function(el){el.value='';});
      container.querySelector('#qaQText').focus();
    } else if(qaState.contentType==='flashcards'){
      const front = container.querySelector('#qaFcFront').value.trim();
      const back = container.querySelector('#qaFcBack').value.trim();
      if(!front||!back){ toast('Both front and back are required','error'); return; }
      qaState.drafts.push({kind:'flashcard', front:front, back:back});
      container.querySelector('#qaFcFront').value=''; container.querySelector('#qaFcBack').value='';
      container.querySelector('#qaFcFront').focus();
    } else {
      const title = container.querySelector('#qaNTitle').value.trim();
      const body = container.querySelector('#qaNBody').value.trim();
      if(!title){ toast('Title is required','error'); return; }
      qaState.drafts.push({kind:'note', title:title, body:body});
      container.querySelector('#qaNTitle').value=''; container.querySelector('#qaNBody').value='';
      container.querySelector('#qaNTitle').focus();
    }
    renderDraftList();
  }

  renderItemForm();
  renderDraftList();

  container.querySelectorAll('.as-source-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      if(qaState.drafts.length){
        confirmDialog({title:'Switch content type?',message:'You have '+qaState.drafts.length+' unsaved item(s) in this session. Switching content type will clear them (they are not saved until you click "Save All").',danger:true,okText:'Switch anyway'}).then(function(ok){
          if(!ok) return;
          qaState.drafts = [];
          switchContentType(tab.dataset.ct);
        });
      } else {
        switchContentType(tab.dataset.ct);
      }
    });
  });
  function switchContentType(ct){
    qaState.contentType = ct;
    render(container,{});
  }

  const groupSel = container.querySelector('#qaGroup');
  if(groupSel) groupSel.addEventListener('change',function(e){ qaState.groupId = e.target.value; });
  const deckSel = container.querySelector('#qaDeck');
  if(deckSel){
    const newDeckWrap = container.querySelector('#qaNewDeckWrap');
    function syncDeckWrap(){ newDeckWrap.style.display = deckSel.value==='__new__' ? 'block' : 'none'; }
    syncDeckWrap();
    deckSel.addEventListener('change',function(e){ qaState.deckId = e.target.value; syncDeckWrap(); });
  }
  container.querySelector('#qaSubject').addEventListener('input',U.debounce(function(e){ qaState.subject = e.target.value; },200));
  container.querySelector('#qaTopic').addEventListener('input',U.debounce(function(e){ qaState.topic = e.target.value; },200));
  const diffSel = container.querySelector('#qaDifficulty');
  if(diffSel) diffSel.addEventListener('change',function(e){ qaState.difficulty = e.target.value; });

  container.querySelector('#qaSaveAllBtn').addEventListener('click',async function(){
    if(!qaState.drafts.length) return;
    const subject = qaState.subject.trim(), topic = qaState.topic.trim();
    if(subject) await SD_Bank.ensureSubject(subject);
    if(topic) await SD_Bank.ensureTopic(topic,subject);

    let targetDeckId = qaState.deckId;
    if(qaState.contentType==='flashcards' && (targetDeckId==='__new__' || !targetDeckId)){
      const name = container.querySelector('#qaNewDeckName') ? container.querySelector('#qaNewDeckName').value.trim() : '';
      if(!name){ toast('Give the new deck a name first','error'); return; }
      const deckRow = await DB.put('flashcardDecks',{name:name,tags:[]});
      State.flashcardDecks.push(deckRow);
      targetDeckId = deckRow.id;
    }

    let savedCount = 0;
    for(const d of qaState.drafts){
      if(d.kind==='question'){
        const payload = {
          type:d.qtype, text:d.text, explanation:d.explanation||'',
          subject:subject, topic:topic, difficulty:qaState.difficulty, marks:1, tags:[],
          bookmarked:false, groupId:qaState.groupId||null
        };
        if(d.qtype==='mcq'){
          // Determine correctness against the ORIGINAL option positions
          // before filtering out blanks — filtering first and then
          // comparing by index would silently shift which option ends up
          // marked correct if an earlier option was left empty.
          payload.options = d.options.map(function(t,i){return {text:t,correct:i===d.correctIndex};}).filter(function(o){return o.text;});
        } else {
          payload.correctAnswer = d.tfAnswer;
        }
        const row = await DB.put('questions',payload);
        State.questions.push(row);
      } else if(d.kind==='flashcard'){
        const payload = Object.assign({ease:2.5,interval:0,reps:0,state:'learning'}, {
          deckId:targetDeckId, front:d.front, back:d.back, difficulty:qaState.difficulty, tags:[], favorite:false
        });
        const row = await DB.put('flashcards',payload);
        State.flashcards.push(row);
      } else {
        const payload = {title:d.title, body:d.body, subject:subject, topic:topic, groupId:qaState.groupId||null};
        const row = await DB.put('notes',payload);
        State.notes.push(row);
      }
      savedCount++;
    }
    qaState.drafts = [];
    toast(savedCount+' item(s) saved to StudyDesk','success');
    render(container,{});
  });

  container.querySelector('#qaSaveTemplateBtn').addEventListener('click',async function(){
    const name = prompt('Name this template (e.g. "Weekly Chapter Setup"):');
    if(!name || !name.trim()) return;
    const config = {contentType:qaState.contentType, subject:qaState.subject, topic:qaState.topic, groupId:qaState.groupId, difficulty:qaState.difficulty};
    const payload = {name:name.trim(), config:config, updatedAt:U.nowISO()};
    const row = await DB.put('quickAddTemplates',payload);
    const i = State.quickAddTemplates.findIndex(function(t){return t.id===row.id;});
    if(i>=0) State.quickAddTemplates[i]=row; else State.quickAddTemplates.push(row);
    toast('Template saved','success');
    render(container,{});
  });
  container.querySelectorAll('[data-tplid]').forEach(function(row){
    const tpl = savedTemplates.find(function(t){return t.id===row.dataset.tplid;});
    const loadBtn = row.querySelector('[data-act="load"]');
    if(loadBtn) loadBtn.addEventListener('click',function(){
      Object.assign(qaState,tpl.config);
      qaState.drafts = [];
      render(container,{});
      toast('Template loaded','success');
    });
    const delBtn = row.querySelector('[data-act="del"]');
    if(delBtn) delBtn.addEventListener('click',async function(){
      const ok = await confirmDialog({title:'Delete "'+tpl.name+'"?',danger:true,okText:'Delete'});
      if(!ok) return;
      await DB.delete('quickAddTemplates',tpl.id);
      State.quickAddTemplates = State.quickAddTemplates.filter(function(t){return t.id!==tpl.id;});
      render(container,{});
    });
  });

  U.paintIcons(container);
}

window.VIEW_RENDERERS = window.VIEW_RENDERERS || {};
window.VIEW_RENDERERS.quickadd = render;
})();



/* ============================================================
   STUDYDESK — MISTAKE JOURNAL + SMART REVISION
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

/* ================= MISTAKE JOURNAL ================= */
let mjFilter = 'active'; // active | mastered | all
let mjSubjectFilter_ = '';
let mjGroupFilter_ = '';

const MISTAKE_REASONS = [
  {id:'careless',label:'Careless slip'},
  {id:'conceptual',label:"Didn't know it"},
  {id:'misread',label:'Misread question'},
  {id:'rushed',label:'Ran out of time'},
  {id:'formula',label:'Wrong formula/method'}
];
function mistakeRow(m){
  const q = State.questions.find(function(x){return x.id===m.questionId;});
  return '<div class="card" data-mid="'+m.id+'" style="'+(m.mastered?'opacity:.65;':'')+'">'+
    '<div class="flex-between"><h4 style="margin:0;font-size:.95rem;">'+U.esc(U.truncate(q?U.stripHtml(q.text):'(question removed)',90))+'</h4>'+
    '<span class="badge '+(m.mastered?'badge-correct':'badge-incorrect')+'">'+(m.mastered?'Mastered':'Needs work')+'</span></div>'+
    '<div class="grid grid-2" style="margin-top:.7rem;gap:.6rem;">'+
      '<div><div class="text-faint" style="font-size:.7rem;font-weight:700;text-transform:uppercase;">My answer</div><p style="margin:.2rem 0 0;font-size:.85rem;color:var(--red-700);">'+U.esc(m.myAnswer||'—')+'</p></div>'+
      '<div><div class="text-faint" style="font-size:.7rem;font-weight:700;text-transform:uppercase;">Correct answer</div><p style="margin:.2rem 0 0;font-size:.85rem;color:var(--green-700);">'+U.esc(m.correctAnswer||'—')+'</p></div>'+
    '</div>'+
    (m.explanation? '<p style="margin-top:.6rem;font-size:.82rem;"><em>'+U.esc(m.explanation)+'</em></p>':'')+
    '<div style="margin-top:.7rem;">'+
      '<label style="font-size:.7rem;color:var(--text-faint);font-weight:700;text-transform:uppercase;">What went wrong?</label>'+
      '<div class="sd2-tag-picker mj-reason-picker" data-picker-for="'+m.id+'">'+MISTAKE_REASONS.map(function(r){
        return '<button type="button" data-reason-id="'+r.id+'" class="'+(m.reasonCategory===r.id?'active':'')+'">'+U.esc(r.label)+'</button>';
      }).join('')+'</div>'+
    '</div>'+
    '<div class="field" style="margin-top:.6rem;margin-bottom:.5rem;"><label style="font-size:.7rem;">Any more detail (optional)</label><input type="text" class="mj-reason-input" data-reason-for="'+m.id+'" value="'+U.esc(m.reason||'')+'" placeholder="e.g. Mixed up the formula with a similar one…"></div>'+
    '<div class="flex-between" style="flex-wrap:wrap;gap:.5rem;">'+
      '<span class="text-faint" style="font-size:.75rem;">Retried '+(m.retryCount||0)+'x</span>'+
      '<div class="flex-gap">'+
        (q? '<button class="btn btn-secondary btn-sm" data-act="retry">'+U.svgIcon('refresh',13)+' Retry</button>':'')+
        (!m.mastered? '<button class="btn btn-primary btn-sm" data-act="master">'+U.svgIcon('check',13)+' Mark mastered</button>' : '<button class="btn btn-secondary btn-sm" data-act="unmaster">Reopen</button>')+
      '</div>'+
    '</div>'+
  '</div>';
}

async function renderMistakes(container){
  const active = State.mistakes.filter(function(m){return !m.mastered;});
  const mastered = State.mistakes.filter(function(m){return m.mastered;});
  const subjectsInUse = Array.from(new Set(State.mistakes.map(function(m){
    const q = State.questions.find(function(x){return x.id===m.questionId;});
    return q ? q.subject : null;
  }).filter(Boolean))).sort();
  let mjSubjectFilter = mjSubjectFilter_ || '';
  let mjGroupFilter = mjGroupFilter_ || '';
  const mistakeQuestionGroupIds = new Set(State.mistakes.map(function(m){
    const q = State.questions.find(function(x){return x.id===m.questionId;});
    return q ? (q.groupId||null) : null;
  }).filter(Boolean));
  const groupsInUse = (SD_Bank.allQuestionGroupsWithPaths ? SD_Bank.allQuestionGroupsWithPaths() : []).filter(function(g){
    return mistakeQuestionGroupIds.has(g.id);
  });

  container.innerHTML =
  '<div class="view-head"><div><h1>Mistake Journal</h1><div class="sub">'+active.length+' active · '+mastered.length+' mastered</div></div>'+
  '<div class="view-head-actions"><button class="btn btn-secondary" id="mjExportBtn">'+U.svgIcon('download',15)+' Export</button></div></div>'+
  '<div class="flex-between" style="flex-wrap:wrap;gap:.6rem;margin-bottom:1.1rem;">'+
    '<div class="segmented" id="mjSeg">'+
      '<button data-f="active" class="'+(mjFilter==='active'?'active':'')+'">Needs work ('+active.length+')</button>'+
      '<button data-f="mastered" class="'+(mjFilter==='mastered'?'active':'')+'">Mastered ('+mastered.length+')</button>'+
      '<button data-f="all" class="'+(mjFilter==='all'?'active':'')+'">All ('+State.mistakes.length+')</button>'+
    '</div>'+
    '<div class="flex-gap">'+
    (subjectsInUse.length>1 ? '<select id="mjSubjectSel" style="max-width:200px;"><option value="">All subjects</option>'+
      subjectsInUse.map(function(s){return '<option value="'+U.esc(s)+'" '+(mjSubjectFilter===s?'selected':'')+'>'+U.esc(s)+'</option>';}).join('')+'</select>' : '')+
    (groupsInUse.length>1 ? '<select id="mjGroupSel" style="max-width:200px;"><option value="">All groups</option>'+
      groupsInUse.map(function(g){return '<option value="'+g.id+'" '+(mjGroupFilter===g.id?'selected':'')+'>'+U.esc(g.path)+'</option>';}).join('')+'</select>' : '')+
    '</div>'+
  '</div>'+
  '<div id="mjBulkBar" style="display:none;margin-bottom:.8rem;"></div>'+
  '<div id="mjList"></div>';

  function currentList(){
    let list = mjFilter==='active'?active : mjFilter==='mastered'?mastered : State.mistakes;
    if(mjSubjectFilter){
      list = list.filter(function(m){
        const q = State.questions.find(function(x){return x.id===m.questionId;});
        return q && q.subject===mjSubjectFilter;
      });
    }
    if(mjGroupFilter){
      const inGroup = new Set(SD_Bank.questionsInGroup(mjGroupFilter,true).map(function(q){return q.id;}));
      list = list.filter(function(m){ return inGroup.has(m.questionId); });
    }
    return list;
  }

  function draw(){
    const list = currentList();
    const sorted = list.slice().sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
    const wrap = container.querySelector('#mjList');
    const bulkBar = container.querySelector('#mjBulkBar');
    if(!sorted.length){
      wrap.innerHTML = '<div class="empty-state"><div class="ic">'+U.svgIcon('alert',22)+'</div><h3>Nothing here</h3><p>'+(mjFilter==='active'?'No active mistakes — nice work! Incorrect answers from practice will show up here automatically.':'Nothing in this filter yet.')+'</p></div>';
      bulkBar.style.display='none';
      return;
    }
    const activeInView = sorted.filter(function(m){return !m.mastered;});
    if(mjFilter!=='mastered' && activeInView.length>1){
      bulkBar.style.display='flex';

/* ================= SMART REVISION ================= */
function revisionQueueItems(){
  const now = new Date().toISOString();
  return State.revisions.filter(function(r){ return r.status!=='mastered' && (!r.nextReview || U.daysBetween(r.nextReview,now)>=0); })
    .map(function(r){
      const q = State.questions.find(function(x){return x.id===r.questionId;});
      return {rev:r,q:q};
    }).filter(function(item){return item.q;})
    .sort(function(a,b){
      const order={high:0,medium:1,low:2};
      return (order[a.rev.priority]||1)-(order[b.rev.priority]||1);
    });
}

async function renderRevision(container){
  const queue = revisionQueueItems();
  const weak = State.questions.filter(function(q){
    const attempts = State.attempts.filter(function(a){return a.questionId===q.id;});
    if(attempts.length<2) return false;
    return U.pct(attempts.filter(function(a){return a.correct;}).length,attempts.length) < 50;
  });
  const difficult = State.questions.filter(function(q){return q.difficulty==='hard';});
  const incorrectOnly = State.questions.filter(function(q){
    return State.attempts.some(function(a){return a.questionId===q.id && !a.correct;});
  });
  const fcDue = State.flashcards.filter(function(c){ return !c.nextReview || U.daysBetween(c.nextReview,new Date().toISOString())>=0; });

  // Revision streak: consecutive calendar days (ending today or yesterday,
  // so a still-open today doesn't reset it) with at least one revision
  // record touched via lastReviewed.
  const reviewDays = new Set(State.revisions.filter(function(r){return r.lastReviewed;}).map(function(r){return U.todayKey(new Date(r.lastReviewed));}));
  let revStreak=0;
  {
    let cursor = new Date(); cursor.setHours(0,0,0,0);
    const todayKey = U.todayKey(cursor);
    if(!reviewDays.has(todayKey)) cursor.setDate(cursor.getDate()-1); // today not yet reviewed - check if yesterday keeps the streak alive
    while(reviewDays.has(U.todayKey(cursor))){ revStreak++; cursor.setDate(cursor.getDate()-1); }
  }

  // Per-subject breakdown: how many questions per subject are in the
  // revision queue right now, so a person can see which subjects need
  // the most attention at a glance rather than scrolling the full queue.
  const subjectBreakdown = {};
  queue.forEach(function(item){
    const subj = item.q.subject || 'Uncategorized';
    subjectBreakdown[subj] = (subjectBreakdown[subj]||0)+1;
  });
  const subjectRows = Object.keys(subjectBreakdown).map(function(s){return {subject:s,count:subjectBreakdown[s]};}).sort(function(a,b){return b.count-a.count;});
  const maxSubjectCount = subjectRows.length ? subjectRows[0].count : 1;

  container.innerHTML =
  '<div class="view-head"><div><h1>Smart Revision</h1><div class="sub">Spaced repetition queue, scheduled by how well you know each question</div></div>'+
  '<div class="view-head-actions"><button class="btn btn-primary" id="revStartAllBtn">'+U.svgIcon('play',15)+' Start Revision Session</button></div></div>'+

  '<div class="grid grid-4" style="margin-bottom:1.2rem;">'+
    revStat('alert','icon-amber',queue.length,'In revision queue')+
    revStat('target','icon-ink',weak.length,'Weak questions')+
    revStat('zap','icon-teal',difficult.length,'Difficult questions')+
    revStat('cards','icon-green',fcDue.length,'Flashcards due')+
  '</div>'+
  '<div class="grid grid-2" style="margin-bottom:1.2rem;">'+
    '<div class="card stat-card" style="flex-direction:row;align-items:center;gap:.8rem;text-align:left;">'+
      '<div class="stat-icon icon-amber">'+U.svgIcon('flame',18)+'</div>'+
      '<div><div class="stat-value" style="margin:0;">'+revStreak+' day'+(revStreak===1?'':'s')+'</div><div class="stat-label" style="margin:0;">Revision streak</div></div>'+
    '</div>'+
    (subjectRows.length ? '<div class="card"><div class="card-head" style="margin-bottom:.5rem;"><h3 style="font-size:.88rem;">Where the queue is coming from</h3></div>'+
      subjectRows.slice(0,4).map(function(r){
        const pct = Math.round((r.count/maxSubjectCount)*100);
        return '<div style="margin-bottom:.45rem;"><div class="flex-between" style="font-size:.78rem;margin-bottom:.15rem;"><span>'+U.esc(r.subject)+'</span><span class="text-faint">'+r.count+'</span></div>'+
          '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div></div>';
      }).join('')+'</div>' : '<div class="card text-center" style="display:flex;align-items:center;justify-content:center;"><p class="text-faint" style="margin:0;font-size:.82rem;">Nothing in the queue right now.</p></div>')+
  '</div>'+

  '<div class="section-title">Revision Queue <span class="text-faint" style="font-weight:500;text-transform:none;letter-spacing:0;">— priority order</span></div>'+
  (queue.length? '<div class="data-list">'+queue.slice(0,25).map(function(item){
    const priorityColor = item.rev.priority==='high'?'var(--red-700)':item.rev.priority==='medium'?'var(--amber-700)':'var(--text-faint)';
    return '<div class="list-row" data-qid="'+item.q.id+'"><div class="list-row-main"><div class="list-row-title">'+U.esc(U.truncate(U.stripHtml(item.q.text),85))+'</div>'+
      '<div class="list-row-meta"><span style="color:'+priorityColor+';font-weight:700;text-transform:capitalize;">'+item.rev.priority+' priority</span>'+
      '<span class="tag">'+U.esc(item.q.subject||'')+'</span><span>'+(item.rev.attempts||0)+' attempts</span></div></div>'+
      '<button class="btn btn-secondary btn-sm" data-act="review">Review</button></div>';
  }).join('')+'</div>' : '<div class="empty-state"><div class="ic">'+U.svgIcon('check-circle',20)+'</div><h3>Queue is clear</h3><p>Nothing due for revision right now. Keep practicing to build your history.</p></div>')+

  '<div class="section-title">Review History</div>'+
  '<div class="card">'+(State.revisions.length? '<div style="overflow-x:auto;"><table><thead><tr><th>Attempts</th><th>Correct</th><th>Priority</th><th>Status</th><th>Last reviewed</th></tr></thead><tbody>'+
    State.revisions.slice().sort(function(a,b){return new Date(b.lastReviewed)-new Date(a.lastReviewed);}).slice(0,10).map(function(r){
      return '<tr><td class="mono">'+(r.attempts||0)+'</td><td class="mono">'+(r.correctCount||0)+'</td><td style="text-transform:capitalize;">'+r.priority+'</td><td style="text-transform:capitalize;">'+r.status+'</td><td>'+U.fmtDate(r.lastReviewed)+'</td></tr>';
    }).join('')+'</tbody></table></div>' : '<p class="text-faint" style="margin:0;">No revision history yet.</p>')+'</div>';

  container.querySelectorAll('[data-act="review"]').forEach(function(btn){
    btn.addEventListener('click',function(){
      const qid = btn.closest('[data-qid]').dataset.qid;
      const q = State.questions.find(function(x){return x.id===qid;});
      State.runtime.practice = {mode:'revision',opts:{},pool:[q],index:0,perQuestionTime:0,results:[],startTs:Date.now()};
      navigate('practicerunner');
    });
  });
  container.querySelector('#revStartAllBtn').addEventListener('click',function(){
    const pool = queue.map(function(i){return i.q;});
    if(!pool.length){ toast('Nothing in the revision queue right now','info'); return; }
    State.runtime.practice = {mode:'revision',opts:{},pool:pool,index:0,perQuestionTime:0,results:[],startTs:Date.now()};
    navigate('practicerunner');
  });
}

(function(){
"use strict";
const U = window.SD_UTIL;

function subjectPerformance(){
  const map={};
  State.attempts.forEach(function(a){
    const q = State.questions.find(function(x){return x.id===a.questionId;});
    const subj = q ? (q.subject||'General') : 'General';
    map[subj]=map[subj]||{subject:subj,correct:0,total:0,timeSum:0};
    map[subj].total++;
    if(a.correct) map[subj].correct++;
    map[subj].timeSum += (a.timeSpent||0);
  });
  return Object.values(map).map(function(s){ s.acc=U.pct(s.correct,s.total); s.avgTime=s.total?Math.round(s.timeSum/s.total):0; return s; })
    .sort(function(a,b){return b.total-a.total;});
}
function topicPerformance(){
  const map={};
  State.attempts.forEach(function(a){
    const q = State.questions.find(function(x){return x.id===a.questionId;});
    if(!q) return;
    const key = (q.subject||'General')+' › '+(q.topic||'General');
    map[key]=map[key]||{key:key,correct:0,total:0};
    map[key].total++;
    if(a.correct) map[key].correct++;
  });
  return Object.values(map).map(function(t){t.acc=U.pct(t.correct,t.total); return t;}).sort(function(a,b){return a.acc-b.acc;});
}
function dailySeries(days){
  const out=[];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = U.todayKey(d);
    const attempts = State.attempts.filter(function(a){return U.todayKey(new Date(a.ts||a.createdAt))===key;});
    out.push({label:d.toLocaleDateString(undefined,{weekday:'narrow'}),key:key,count:attempts.length,correct:attempts.filter(function(a){return a.correct;}).length});
  }
  return out;
}
function weeklySeries(weeks){
  const out=[];
  for(let w=weeks-1;w>=0;w--){
    const end = new Date(); end.setDate(end.getDate()-w*7);
    const start = new Date(end); start.setDate(end.getDate()-6);
    const attempts = State.attempts.filter(function(a){ const t=new Date(a.ts||a.createdAt); return t>=start && t<=end; });
    out.push({label:'W'+(weeks-w),count:attempts.length,correct:attempts.filter(function(a){return a.correct;}).length});
  }
  return out;
}
function monthlySeries(months){
  const out=[];
  for(let m=months-1;m>=0;m--){
    const d = new Date(); d.setMonth(d.getMonth()-m);
    const key = d.getFullYear()+'-'+d.getMonth();
    const attempts = State.attempts.filter(function(a){ const t=new Date(a.ts||a.createdAt); return (t.getFullYear()+'-'+t.getMonth())===key; });
    out.push({label:d.toLocaleDateString(undefined,{month:'short'}),count:attempts.length,correct:attempts.filter(function(a){return a.correct;}).length});
  }
  return out;
}

function barChart(series,valueKey,maxHint){
  const max = maxHint || Math.max.apply(null,series.map(function(s){return s[valueKey];}).concat([1]));
  return '<div class="bar-chart">'+series.map(function(s){
    const isZero = !s[valueKey];
    const h = isZero ? 0 : (max? Math.max(4,Math.round((s[valueKey]/max)*118)) : 4);
    return '<div class="bar-col"><span class="bar-value">'+s[valueKey]+'</span><div class="bar-wrap"><div class="bar'+(isZero?' bar-empty':'')+'" style="height:'+h+'px;"></div></div><span class="bar-label">'+s.label+'</span></div>';
  }).join('')+'</div>';
}

    setTimeout(function(){ window.print(); },80);
  });

function aStat(icon,cls,val,label){
  return '<div class="card stat-card"><div class="stat-icon '+cls+'">'+U.svgIcon(icon,16)+'</div><div class="stat-value">'+val+'</div><div class="stat-label">'+label+'</div></div>';
}
function emptyMini(msg){ return '<div class="empty-state" style="padding:1.6rem;"><p style="font-size:.82rem;">'+msg+'</p></div>'; }

function buildHeatmapLocal(weeks){
  const days=weeks*7;
  const counts={};
  State.studySessions.forEach(function(s){ counts[s.dateKey]=(counts[s.dateKey]||0)+1; });
  State.attempts.forEach(function(a){ const k=U.todayKey(new Date(a.ts||a.createdAt)); counts[k]=(counts[k]||0)+1; });
  const end = new Date();
  const cells=[];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(end.getDate()-i);
    const key = U.todayKey(d);
    const n = counts[key]||0;
    let level = n===0?0:n<3?1:n<7?2:n<12?3:4;
    cells.push({key:key,level:level,count:n,date:d});
  }
  const firstDow = cells[0].date.getDay();
  const pad=[]; for(let i=0;i<firstDow;i++) pad.push({level:-1});
  const full = pad.concat(cells);
  let html='<div class="heatmap-grid">';
  full.forEach(function(c){
    if(c.level<0){ html+='<div class="hm-cell" style="background:transparent;"></div>'; return; }
    html+='<div class="hm-cell" data-level="'+c.level+'" title="'+c.count+' activities"></div>';
  });
  return html+'</div>';
}

/* ============================================================
   STUDYDESK — STUDY PLANNER
   Week grid + recurring tasks + subject-linked tasks, and a
   page-level persistent Focus Timer (Pomodoro/Stopwatch/Countdown)
   that keeps ticking across navigation instead of resetting.
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

let plannerFilter='pending';
let weekOffset=0; // 0 = this week, -1 = last week, 1 = next week

/* ---------------- Recurrence helpers ---------------- */
// t.recurrence: null | 'daily' | 'weekdays' | 'weekly'
// t.dueDate is the anchor date for weekly recurrence (matches day-of-week).
// Recurring tasks are templates: a single stored row represents every future
// occurrence, so completion is tracked per-date in t.doneDates (array of yyyy-mm-dd).
function occursOn(t,dateKey){
  if(!t.recurrence) return U.todayKey(new Date(t.dueDate))===dateKey;
  const d = new Date(dateKey+'T00:00:00');
  const dow = d.getDay();
  if(t.recurrence==='daily') return true;
  if(t.recurrence==='weekdays') return dow>=1 && dow<=5;
  if(t.recurrence==='weekly'){
    if(!t.dueDate) return false;
    return new Date(t.dueDate).getDay()===dow;
  }
  return false;
}
function isDoneOn(t,dateKey){
  if(!t.recurrence) return !!t.done;
  return (t.doneDates||[]).includes(dateKey);
}
function startOfWeek(d){
  const c = new Date(d); c.setHours(0,0,0,0);
  c.setDate(c.getDate()-c.getDay());
  return c;
}
function weekDates(offset){
  const base = startOfWeek(new Date());
  base.setDate(base.getDate()+offset*7);
  const out=[];
  for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(base.getDate()+i); out.push(d); }
  return out;
}
function tasksForDate(dateKey){
  return State.plannerTasks.filter(function(t){ return occursOn(t,dateKey); });
}

/* ---------------- List row (Agenda tab) ---------------- */
function taskRow(t){
  const today = U.todayKey();
  const occKey = t.recurrence ? today : (t.dueDate?U.todayKey(new Date(t.dueDate)):'');
  const done = isDoneOn(t,occKey||today);
  const overdue = !done && !t.recurrence && t.dueDate && U.daysBetween(new Date().toISOString(),t.dueDate)<0;
  return '<div class="list-row" data-tid="'+t.id+'">'+
    '<label class="checkbox-row" style="flex-shrink:0;"><input type="checkbox" class="task-check" data-check-for="'+t.id+'" '+(done?'checked':'')+'></label>'+
    '<div class="list-row-main">'+
      '<div class="list-row-title" style="'+(done?'text-decoration:line-through;color:var(--text-faint);':'')+'">'+U.esc(t.title)+(t.recurrence?'<span class="recur-pill">'+(t.recurrence==='daily'?'Daily':t.recurrence==='weekdays'?'Weekdays':'Weekly')+'</span>':'')+'</div>'+
      '<div class="list-row-meta">'+(t.dueDate&&!t.recurrence?'<span style="'+(overdue?'color:var(--red-700);font-weight:700;':'')+'">'+U.svgIcon('calendar',11)+' '+U.fmtDate(t.dueDate)+'</span>':'')+
      (t.subject?'<span class="tag">'+U.esc(t.subject)+(t.topic?' › '+U.esc(t.topic):'')+'</span>':'')+
      (t.category?'<span class="tag">'+U.esc(t.category)+'</span>':'')+(t.priority==='high'?'<span class="tag tag-important">High priority</span>':'')+'</div>'+
    '</div>'+
    '<div class="list-row-actions">'+
      (t.subject?'<button class="icon-btn" data-act="study" title="Study this subject">'+U.svgIcon('target',13)+'</button>':'')+
      '<button class="icon-btn" data-act="edit">'+U.svgIcon('edit',13)+'</button><button class="icon-btn" data-act="del">'+U.svgIcon('trash',13)+'</button></div>'+
  '</div>';
}

/* ---------------- Main render ---------------- */
async function render(container,params){
  params=params||{};
  const pending = State.plannerTasks.filter(function(t){return !isDoneOn(t,U.todayKey());});
  const done = State.plannerTasks.filter(function(t){return isDoneOn(t,U.todayKey());});

  '<div class="segmented" style="margin-bottom:1.1rem;" id="plTabSeg">'+

  '</div>'+

  '<div class="grid" style="grid-template-columns:1.4fr 1fr;gap:1rem;" id="plMainGrid">'+

      '</div>'+

      '<div class="week-grid" id="weekGrid"></div>';
    const grid = col.querySelector('#weekGrid');
    grid.innerHTML = dates.map(function(d){
      const key = U.todayKey(d);
      const isToday = key===today;
      const dayTasks = tasksForDate(key).sort(function(a,b){
        const order={high:0,medium:1,low:2};
        return (order[a.priority]||1)-(order[b.priority]||1);
      });
      return '<div class="week-day'+(isToday?' is-today':'')+'" data-daykey="'+key+'">'+

        dayTasks.map(function(t){
          const isDone = isDoneOn(t,key);

    grid.querySelectorAll('.wd-task').forEach(function(el){

    col.querySelector('#wkPrevBtn').addEventListener('click',function(){ weekOffset--; drawLeft(); });

    const tb = col.querySelector('#wkTodayBtn'); if(tb) tb.addEventListener('click',function(){ weekOffset=0; drawLeft(); });
    U.paintIcons(col);
  }

  function drawAgenda(col){
    col.innerHTML =
      '<div class="segmented" style="margin-bottom:1rem;" id="plSeg">'+
        '<button data-f="pending" class="'+(plannerFilter==='pending'?'active':'')+'">Pending ('+pending.length+')</button>'+
        '<button data-f="done" class="'+(plannerFilter==='done'?'active':'')+'">Completed ('+done.length+')</button>'+
        '<button data-f="all" class="'+(plannerFilter==='all'?'active':'')+'">All</button>'+
      '</div>'+
      '<div id="plList"></div>';
    const list = plannerFilter==='pending'?pending : plannerFilter==='done'?done : State.plannerTasks;
    const sorted = list.slice().sort(function(a,b){
      const aDone=isDoneOn(a,today), bDone=isDoneOn(b,today);
      if(aDone!==bDone) return aDone?1:-1;
      return new Date(a.dueDate||'9999')-new Date(b.dueDate||'9999');
    });
    const wrap = col.querySelector('#plList');
    if(!sorted.length){
      wrap.innerHTML = '<div class="empty-state"><div class="ic">'+U.svgIcon('calendar',22)+'</div><h3>No tasks here</h3><p>Add study goals, deadlines, and revision blocks to plan your day.</p><button class="btn btn-primary" id="plEmptyBtn">'+U.svgIcon('plus',15)+' New Task</button></div>';
      const b=wrap.querySelector('#plEmptyBtn'); if(b) b.addEventListener('click',function(){openTaskModal();});
      col.querySelector('#plSeg').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ plannerFilter=b.dataset.f; drawLeft(); }); });
      return;
    }
    wrap.innerHTML = '<div class="data-list">'+sorted.map(taskRow).join('')+'</div>';
    wrap.querySelectorAll('.task-check').forEach(function(cb){
      cb.addEventListener('change',async function(){ await toggleTaskDone(cb.dataset.checkFor,today); drawLeft(); });

        if(!ok) return;
        const snapshot = State.plannerTasks.find(function(t){return t.id===tid;});
        await DB.delete('plannerTasks',tid);
        State.plannerTasks = State.plannerTasks.filter(function(t){return t.id!==tid;});
        toast('Task deleted','info',{actionLabel:'Undo',onAction:async function(){
          if(!snapshot) return;
          await DB.put('plannerTasks',snapshot);
          State.plannerTasks.push(snapshot);
          toast('Task restored','success');
          drawLeft();
        }});
        drawLeft();
      });
    });
    U.paintIcons(wrap);
    col.querySelector('#plSeg').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ plannerFilter=b.dataset.f; drawLeft(); }); });

  container.querySelector('#plSaveExamBtn').addEventListener('click',async function(){

    const d = container.querySelector('#plExamDate').value;
    State.settings.examDate = d ? new Date(d).toISOString() : '';
    await persistSettings();
    toast('Exam info saved','success');
  });

  window.SD_Timer.mount(container);

  const grid = container.querySelector('#plMainGrid');
  function applyResp(){ grid.style.gridTemplateColumns = window.innerWidth<960 ? '1fr' : '1.4fr 1fr'; }
  applyResp(); window.addEventListener('resize',applyResp,{passive:true});

  if(params.openNew) openTaskModal();
}

async function toggleTaskDone(taskId,dateKey){
  const t = State.plannerTasks.find(function(x){return x.id===taskId;});
  if(!t) return;
  const nowDone = !isDoneOn(t,dateKey);
  if(t.recurrence){
    t.doneDates = t.doneDates||[];
    if(nowDone){ if(!t.doneDates.includes(dateKey)) t.doneDates.push(dateKey); }
    else { t.doneDates = t.doneDates.filter(function(k){return k!==dateKey;}); }
  } else {
    t.done = nowDone;
    t.completedAt = nowDone ? U.nowISO() : null;
  }
  await DB.put('plannerTasks',t);
  if(nowDone) awardXP(5,'task');
}
window.SD_togglePlannerTask = toggleTaskDone;

/* Launch a practice/revision session scoped to a task's subject/topic,
   and mark the task done for today once that session finishes. */
function studyFromTask(taskId){
  const t = State.plannerTasks.find(function(x){return x.id===taskId;});
  if(!t || !t.subject){ toast('This task has no linked subject yet','info'); return; }
  State.runtime.pendingTaskComplete = {taskId:t.id,dateKey:U.todayKey()};
  navigate('practice',{mode:'topic'});
  setTimeout(function(){
    const subjSel = document.querySelector('#tpSubject');
    if(subjSel){
      subjSel.value = t.subject;
      subjSel.dispatchEvent(new Event('change'));
      setTimeout(function(){ const topicSel=document.querySelector('#tpTopic'); if(topicSel && t.topic) topicSel.value=t.topic; },40);
    }
  },80);
}
window.SD_studyFromTask = studyFromTask;

/* ---------------- Suggested tasks (weak topics + revision → one-tap add) --------------- */
function buildSuggestions(){
  const out=[];
  const seenSubjTopic = {};
  const weak = (window.SD_weakTopics ? window.SD_weakTopics(4) : []);
  weak.forEach(function(w){
    const parts = w.key.split(' › ');
    const key=parts[0]+'|'+(parts[1]||'');
    if(seenSubjTopic[key]) return; seenSubjTopic[key]=1;
    out.push({title:'Revise '+w.key+' ('+w.acc+'% accuracy)',subject:parts[0]==='General'?'':parts[0],topic:parts[1]==='General'?'':parts[1],priority:'high',category:'Revision'});
  });
  const dueRevCount = State.revisions.filter(function(r){return r.status!=='mastered' && (!r.nextReview||U.daysBetween(r.nextReview,new Date().toISOString())>=0);}).length;
  if(dueRevCount>0) out.push({title:'Clear the revision queue ('+dueRevCount+' due)',priority:'high',category:'Revision'});
  const dueFc = State.flashcards.filter(function(c){return !c.nextReview||U.daysBetween(c.nextReview,new Date().toISOString())>=0;}).length;
  if(dueFc>0) out.push({title:'Review flashcards ('+dueFc+' due)',priority:'medium',category:'Flashcards'});

/* ============================================================
   STUDYDESK — PERSISTENT FOCUS TIMER
   Module-scope singleton so the interval keeps running (and the
   ring/display keep updating) no matter which view is on screen.
   Mounted into the Planner card when present, and mirrored as a
   compact pill in the topbar from every other view.
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

let ts = {mode:'pomodoro',running:false,seconds:25*60,totalSeconds:25*60,phase:'focus'};
let tickHandle=null;
let mountedEls=null; // {display,controls,modeSeg,ringWrap,hint} when Planner is on screen

function notify(title,body){
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted'){
    try{ new Notification(title,{body:body,silent:false}); }catch(e){}
  }
}
async function ensureNotifyPermission(){
  if(!('Notification' in window)) return 'unsupported';
  if(Notification.permission==='default'){
    try{ return await Notification.requestPermission(); }catch(e){ return 'denied'; }
  }
  return Notification.permission;
}

function isActive(){ return ts.running; }

function renderMini(){
  const slot = document.getElementById('miniTimerSlot');
  if(!slot) return;
  if(!ts.running){ slot.innerHTML=''; return; }
  slot.innerHTML = '<button type="button" class="mini-timer" id="miniTimerBtn" title="Go to Focus Timer"><span class="mt-dot"></span>'+U.fmtTime(ts.seconds)+(ts.mode==='pomodoro'?(ts.phase==='break'?' break':' focus'):'')+'</button>';
  const btn = slot.querySelector('#miniTimerBtn');
  if(btn) btn.addEventListener('click',function(){ navigate('planner'); });
}

function renderMounted(){
  if(!mountedEls) return;
  const {display,controls,modeSeg,ringWrap,hint} = mountedEls;
  if(!document.body.contains(display)){ mountedEls=null; return; }
  display.textContent = U.fmtTime(ts.seconds);
  const pct = ts.mode==='stopwatch' ? 0 : U.clamp(100 - (ts.seconds/(ts.totalSeconds||1))*100,0,100);
  ringWrap.innerHTML = ts.mode==='stopwatch' ? '' : window.SD_ring(pct,110,9,ts.phase==='break'?'var(--green-600)':'var(--accent)',U.fmtTime(ts.seconds).split(':')[0],ts.mode==='pomodoro'?(ts.phase==='break'?'BREAK':'FOCUS'):'LEFT');
  controls.innerHTML =
    '<button class="btn btn-primary" id="timerStartBtn">'+U.svgIcon(ts.running?'pause':'play',14)+' '+(ts.running?'Pause':'Start')+'</button>'+
    '<button class="btn btn-secondary" id="timerResetBtn">'+U.svgIcon('reload',14)+' Reset</button>';
  controls.querySelector('#timerStartBtn').addEventListener('click',toggleRun);
  controls.querySelector('#timerResetBtn').addEventListener('click',function(){ setMode(ts.mode); });
  modeSeg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active',b.dataset.m===ts.mode); });
  if(hint){
    if(!('Notification' in window)) hint.textContent='';
    else if(Notification.permission==='granted') hint.textContent='You\'ll get a notification when this finishes.';
    else if(Notification.permission==='denied') hint.textContent='Notifications are blocked — check your browser settings to enable them.';
    else hint.innerHTML = '<button type="button" class="btn btn-ghost btn-sm" id="timerNotifyBtn" style="padding:0;">Enable notifications for when this finishes</button>';
  }
  const nb = controls.parentElement ? controls.parentElement.querySelector('#timerNotifyBtn') : null;
  if(nb) nb.addEventListener('click',async function(){ await ensureNotifyPermission(); renderMounted(); });
  U.paintIcons(controls); U.paintIcons(ringWrap);
}

function draw(){ renderMounted(); renderMini(); }

function setMode(mode){
  ts = {mode:mode,running:false,phase:'focus',
    seconds: mode==='pomodoro'?25*60 : mode==='countdown'?10*60 : 0,
    totalSeconds: mode==='pomodoro'?25*60 : mode==='countdown'?10*60 : 0};
  draw();
}
function toggleRun(){
  ts.running = !ts.running;
  draw();
}
function tick(){
  if(!ts.running) return;
  if(ts.mode==='stopwatch'){ ts.seconds++; }
  else {
    ts.seconds--;
    if(ts.seconds<=0){
      if(ts.mode==='pomodoro'){
        if(ts.phase==='focus'){
          toast('Focus block complete — take a break!','success');
          notify('Focus block complete','Take a 5-minute break — nice work.');
          awardXP(15,'pomodoro');
          window.logSessionSimple('pomodoro',{});
          ts.phase='break'; ts.seconds=5*60; ts.totalSeconds=5*60;
        } else {
          toast('Break over — back to focus.','info');
          notify('Break\'s over','Back to focus when you\'re ready.');
          ts.phase='focus'; ts.seconds=25*60; ts.totalSeconds=25*60;
        }
      } else {
        ts.running=false; ts.seconds=0;
        toast('Countdown finished','info');
        notify('Countdown finished','Your timer has ended.');
      }
    }
  }
  draw();
}
tickHandle = setInterval(tick,1000);

/* Warn before an accidental tab close while actively focusing or mid-timer. */
window.addEventListener('beforeunload',function(e){
  if(ts.running || (State.runtime && (State.runtime.quiz || (State.runtime.practice && State.runtime.practice.perQuestionTime)))){
    e.preventDefault(); e.returnValue='';
  }
});

function mount(container){
  const display = container.querySelector('#timerDisplay');
  if(!display) return;
  mountedEls = {
    display:display, controls:container.querySelector('#timerControls'),
    modeSeg:container.querySelector('#timerModeSeg'), ringWrap:container.querySelector('#timerRingWrap'),
    hint:container.querySelector('#timerNotifyHint')
  };
  mountedEls.modeSeg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){ setMode(b.dataset.m); });
  });
  draw();
}

window.SD_Timer = {mount:mount,isActive:isActive,ensureNotifyPermission:ensureNotifyPermission};
window.__sd_timer_loaded = true;
})();

function xpHistoryChart(){
  // No per-event XP log is kept, only the running total, so this
  // reconstructs an approximate daily figure from attempts (the largest
  // and most reliably timestamped XP source, matching recordAttempt's
  // exact reward: 10 XP correct, 2 XP incorrect) rather than claim a
  // precise total that would silently omit flashcards/games/quizzes/focus
  // sessions. Labeled "Practice XP" rather than "Total XP" for that reason.
  const days=[];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = U.todayKey(d);
    const dayAttempts = State.attempts.filter(function(a){ return U.todayKey(new Date(a.ts||a.createdAt))===key; });
    const xp = dayAttempts.reduce(function(sum,a){ return sum+(a.correct?10:2); },0);
    days.push({label:d.toLocaleDateString(undefined,{weekday:'narrow'}),xp:xp});
  }
  if(!State.attempts.length) return '<p class="text-faint" style="margin:0;">Practice a few questions to start seeing your XP trend here.</p>';
  return window.SD_barChart(days,'xp');
}

function runSprint(stage,subject){
  const pool = shuffle(State.questions.filter(function(q){return q.subject===subject && (q.type==='mcq'||q.type==='truefalse'||q.type==='fillblank');}));
  let idx=0, score=0, seconds=90, handle=null;
  function finish(){
    clearInterval(handle);
    stage.innerHTML = '<div class="card text-center"><h3>Sprint complete</h3><p>'+score+' correct in '+subject+' · 90 seconds</p>'+
      '<button class="btn btn-secondary btn-sm" id="sprintAgainBtn" style="margin-top:.6rem;">'+U.svgIcon('refresh',13)+' Race again</button></div>';
    if(score>0) awardXP(score*2,'game');
    const again = stage.querySelector('#sprintAgainBtn');
    if(again) again.addEventListener('click',function(){ launchSprint(stage); });
  }
  function draw(){
    if(idx>=pool.length){ finish(); return; }
    const q = pool[idx];
    stage.innerHTML = '<div class="card"><div class="flex-between" style="margin-bottom:.6rem;">'+
      '<span class="tag">'+U.esc(subject)+'</span>'+
      '<span class="quiz-timer" style="display:inline-flex;">'+U.svgIcon('clock',13)+' <span id="sprintTime">'+seconds+'s</span></span></div>'+
      '<div class="text-faint mono" style="font-size:.78rem;margin-bottom:.5rem;">Score: '+score+'</div>'+
      '<div class="quiz-qtext" style="font-size:1rem;">'+U.esc(q.text)+'</div>'+
      '<div id="sprintInteractive" style="margin-top:.8rem;"></div></div>';
    const wrap = stage.querySelector('#sprintInteractive');
    window.SD_renderQuestionInteractive(wrap,q,function(ans){
      const check = window.SD_checkAnswer(q,ans);
      if(check.correct) score++;
      idx++;
      draw();
    });
  }
  draw();
  handle = setInterval(function(){
    seconds--;
    const t = stage.querySelector('#sprintTime');
    if(t) t.textContent = seconds+'s';
    if(seconds<=0) finish();
  },1000);
}

function launchMatching(stage){
  if(!State.flashcards.length){ toast('Add some flashcards first','info'); return; }
  const deckIds = Array.from(new Set(State.flashcards.map(function(c){return c.deckId;})));
  const cards = shuffle(State.flashcards.filter(function(c){return c.deckId===deckIds[0];})).slice(0,6);
  if(cards.length<3){ toast('Need at least 3 cards in a deck to play matching','info'); return; }
  const tiles = [];
  cards.forEach(function(c){ tiles.push({key:c.id,text:c.front,pairKey:c.id}); tiles.push({key:c.id+'_b',text:c.back,pairKey:c.id}); });
  shuffle(tiles);
  let flipped=[]; let matched=new Set(); let moves=0;
  stage.innerHTML = '<div class="card"><div class="flex-between"><h3>Flashcard Matching</h3><span class="mono text-faint" id="mmMoves">0 moves</span></div>'+
    '<div class="match-grid" id="mmGrid" style="margin-top:1rem;"></div></div>';
  const grid = stage.querySelector('#mmGrid');
  function draw(){
    grid.innerHTML = tiles.map(function(t,i){
      const isFlipped = flipped.includes(i) || matched.has(t.pairKey);
      return '<div class="match-tile'+(isFlipped?' flipped':'')+(matched.has(t.pairKey)?' matched':'')+'" data-i="'+i+'">'+(isFlipped?U.esc(U.truncate(t.text,40)):'?')+'</div>';
    }).join('');
    grid.querySelectorAll('.match-tile').forEach(function(el){
      el.addEventListener('click',function(){
        const i = parseInt(el.dataset.i,10);
        if(flipped.includes(i)||matched.has(tiles[i].pairKey)||flipped.length>=2) return;
        flipped.push(i); draw();
        if(flipped.length===2){
          moves++;
          stage.querySelector('#mmMoves').textContent = moves+' moves';
          const [a,b] = flipped;
          if(tiles[a].pairKey===tiles[b].pairKey && a!==b){
            matched.add(tiles[a].pairKey); flipped=[];
            if(matched.size===cards.length){ setTimeout(function(){ toast('Matched all pairs in '+moves+' moves!','success'); awardXP(20,'game'); },200); }
            draw();
          } else {
            setTimeout(function(){ flipped=[]; draw(); },700);
          }
        }
      });
    });
  }
  draw();
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t;} return arr; }

/* Boss Round: mixed question types (mcq/truefalse/fillblank - excludes
   self-graded short/long answer since there's no way to auto-check a life
   loss), difficulty escalates every 3 correct answers (easy -> medium ->
   hard, then stays at hard), 3 lives, ends on the 3rd miss or when the
   pool of remaining eligible questions runs out. */
function launchBoss(stage){
  const pool = State.questions.filter(function(q){return q.type==='mcq'||q.type==='truefalse'||q.type==='fillblank';});
  if(pool.length<5){ toast('Add a few more MCQ/True-False/Fill-blank questions to play Boss Round','info'); return; }
  let lives=3, score=0, streak=0, tier=0; // tier 0=easy,1=medium,2=hard
  const TIERS=['easy','medium','hard'];
  const used = new Set();
  function pickNext(){
    const wantDiff = TIERS[tier];
    let candidates = pool.filter(function(q){return q.difficulty===wantDiff && !used.has(q.id);});
    if(!candidates.length) candidates = pool.filter(function(q){return !used.has(q.id);});
    if(!candidates.length) return null;
    return candidates[Math.floor(Math.random()*candidates.length)];
  }
  function drawLives(){
    let h=''; for(let i=0;i<3;i++) h += '<span style="color:'+(i<lives?'var(--red-600)':'var(--border)')+';">'+U.svgIcon('heart',16)+'</span>';
    return h;
  }
  function finish(won){
    stage.innerHTML = '<div class="card text-center"><h3>'+(won?'Boss Round cleared!':'Boss Round over')+'</h3>'+
      '<p>Score: '+score+' · Best streak: '+bestStreakSoFar+' · Reached '+capitalizeFirst(TIERS[tier])+' tier</p></div>';
    if(score>0) awardXP(score*4,'game');
    if(tier>=2) logSessionSimple('boss-round-hard-tier',{score:score});
  }
  let bestStreakSoFar=0;
  function capitalizeFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function draw(){
    const q = pickNext();
    if(!q){ finish(true); return; }
    used.add(q.id);
    stage.innerHTML = '<div class="card"><div class="flex-between" style="margin-bottom:.6rem;">'+
      '<span class="tag" style="text-transform:capitalize;">'+TIERS[tier]+' tier</span>'+
      '<div class="flex-gap" style="gap:.3rem;">'+drawLives()+'</div></div>'+
      '<div class="text-faint mono" style="font-size:.78rem;margin-bottom:.5rem;">Score: '+score+' · Streak: '+streak+'</div>'+
      '<div class="quiz-qtext" style="font-size:1rem;">'+U.esc(q.text)+'</div>'+
      '<div id="bossInteractive" style="margin-top:.8rem;"></div></div>';
    const wrap = stage.querySelector('#bossInteractive');
    window.SD_renderQuestionInteractive(wrap,q,function(ans){
      const check = window.SD_checkAnswer(q,ans);
      window.SD_showAnswerFeedback(wrap,q,ans);
      if(check.correct){
        score++; streak++; if(streak>bestStreakSoFar) bestStreakSoFar=streak;
        if(streak>0 && streak%3===0 && tier<2) tier++;
      } else {
        lives--; streak=0;
      }
      setTimeout(function(){ if(lives<=0) finish(false); else draw(); },850);
    });
  }
  draw();
}

/* Endless Streak: no timer, no fixed length. Mixed question types (same
   eligible set as Boss Round). Ends the instant they get one wrong. Tracks
   and displays their personal best streak, stored in settings so it
   persists across sessions like a high score. */
function launchEndless(stage){
  const pool = State.questions.filter(function(q){return q.type==='mcq'||q.type==='truefalse'||q.type==='fillblank';});
  if(pool.length<3){ toast('Add a few more MCQ/True-False/Fill-blank questions to play Endless Streak','info'); return; }
  let streak=0;
  const best = State.settings.bestEndlessStreak||0;
  let freezeAvailable = !!State.settings.endlessStreakFreeze;
  let queue = shuffle(pool.slice()), idx=0;
  function draw(){
    if(idx>=queue.length){ queue=shuffle(pool.slice()); idx=0; }
    const q = queue[idx];
    stage.innerHTML = '<div class="card"><div class="flex-between" style="margin-bottom:.6rem;">'+
      '<span class="text-faint mono" style="font-size:.8rem;">Streak: <strong style="color:var(--accent-strong);">'+streak+'</strong></span>'+
      (freezeAvailable? '<span class="tag" style="font-size:.7rem;" title="A wrong answer will cost this instead of ending your run">'+U.svgIcon('check-circle',12)+' Freeze ready</span>' : '')+
      '<span class="text-faint mono" style="font-size:.8rem;">Best: '+best+'</span></div>'+
      '<div class="quiz-qtext" style="font-size:1rem;">'+U.esc(q.text)+'</div>'+
      '<div id="endlessInteractive" style="margin-top:.8rem;"></div></div>';
    const wrap = stage.querySelector('#endlessInteractive');
    window.SD_renderQuestionInteractive(wrap,q,async function(ans){
      const check = window.SD_checkAnswer(q,ans);
      window.SD_showAnswerFeedback(wrap,q,ans);
      if(check.correct){
        streak++; idx++;
        setTimeout(draw,650);
      } else if(freezeAvailable){
        freezeAvailable = false;
        idx++;
        toast('Streak-freeze used — your run continues','info');
        setTimeout(draw,850);
      } else {
        const isNewBest = streak>best;
        if(isNewBest){
          State.settings.bestEndlessStreak = streak;
          await persistSettings();
        }
        if(streak>0) awardXP(streak,'game');
        setTimeout(function(){
          stage.innerHTML = '<div class="card text-center"><h3>Streak ended at '+streak+'</h3>'+
            '<p>'+(isNewBest && streak>0 ? 'New personal best!' : 'Best streak: '+(isNewBest?streak:best))+'</p>'+
            '<button class="btn btn-primary btn-sm" id="endlessRetryBtn" style="margin-top:.6rem;">Try again</button></div>';
          const retryBtn = stage.querySelector('#endlessRetryBtn');
          if(retryBtn) retryBtn.addEventListener('click',function(){ launchEndless(stage); });
        },850);
      }
    });
  }
  draw();
}

/* ---- GPA / CGPA calculator ---- */
function gpaUtil(stage){
  const SCALE4 = [{min:90,pt:4.0},{min:80,pt:3.7},{min:70,pt:3.3},{min:60,pt:3.0},{min:50,pt:2.3},{min:40,pt:2.0},{min:0,pt:0}];
  let courses = [{name:'Course 1',pct:'',credits:'3'}];
  function draw(){
    stage.innerHTML = '<div class="card" style="max-width:640px;"><div class="flex-between"><h3>GPA / CGPA Calculator</h3>'+
      '<button class="btn btn-secondary btn-sm" id="gpaAddBtn">'+U.svgIcon('plus',13)+' Add course</button></div>'+
      '<p class="text-faint" style="font-size:.78rem;">Enter a percentage and credit weight per course. Uses a standard 4.0 scale (90%+ = 4.0, 80-89% = 3.7, down to 0 below 40%).</p>'+
      '<div id="gpaRows"></div>'+
      '<div class="card" style="background:var(--surface-raised);text-align:center;padding:1rem;margin-top:.8rem;" id="gpaResult"></div></div>';
    const rows = stage.querySelector('#gpaRows');
    rows.innerHTML = courses.map(function(c,i){
      return '<div class="field-row" data-i="'+i+'" style="align-items:flex-end;">'+
        '<div class="field" style="flex:2;"><label>Course</label><input type="text" class="gpa-name" value="'+U.esc(c.name)+'"></div>'+
        '<div class="field"><label>% score</label><input type="number" class="gpa-pct" min="0" max="100" value="'+U.esc(c.pct)+'"></div>'+
        '<div class="field"><label>Credits</label><input type="number" class="gpa-credits" min="0" step="0.5" value="'+U.esc(c.credits)+'"></div>'+
        (courses.length>1? '<button class="icon-btn gpa-remove" style="margin-bottom:.1rem;">'+U.svgIcon('trash',13)+'</button>' : '')+
      '</div>';
    }).join('');
    rows.querySelectorAll('[data-i]').forEach(function(row){
      const i = parseInt(row.dataset.i,10);
      row.querySelector('.gpa-name').addEventListener('input',function(e){ courses[i].name=e.target.value; calc(); });
      row.querySelector('.gpa-pct').addEventListener('input',function(e){ courses[i].pct=e.target.value; calc(); });
      row.querySelector('.gpa-credits').addEventListener('input',function(e){ courses[i].credits=e.target.value; calc(); });
      const rm = row.querySelector('.gpa-remove');
      if(rm) rm.addEventListener('click',function(){ courses.splice(i,1); draw(); calc(); });
    });
    stage.querySelector('#gpaAddBtn').addEventListener('click',function(){ courses.push({name:'Course '+(courses.length+1),pct:'',credits:'3'}); draw(); calc(); });
    U.paintIcons(stage);
    calc();
  }
  function pctToPoint(pct){
    for(const s of SCALE4){ if(pct>=s.min) return s.pt; }
    return 0;
  }
  function calc(){
    const res = stage.querySelector('#gpaResult');
    if(!res) return;
    let totalCredits=0, totalPoints=0, anyValid=false;
    courses.forEach(function(c){
      const pct = parseFloat(c.pct), credits = parseFloat(c.credits);
      if(!isFinite(pct)||!isFinite(credits)||credits<=0) return;
      anyValid=true;
      totalCredits += credits;
      totalPoints += pctToPoint(pct)*credits;
    });
    if(!anyValid || totalCredits===0){ res.innerHTML = '<span class="text-faint">Enter at least one course with a score and credits</span>'; return; }
    const gpa = totalPoints/totalCredits;
    res.innerHTML = '<div class="mono" style="font-size:2rem;font-weight:800;color:var(--accent-strong);">'+gpa.toFixed(2)+'</div><div class="text-faint">GPA across '+totalCredits+' credit'+(totalCredits===1?'':'s')+'</div>';
  }
  draw();
}

/* ---- Unit converter ---- */
const CONVERT_GROUPS = {
  length:{label:'Length',units:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,yd:0.9144,ft:0.3048,in:0.0254}},
  weight:{label:'Weight',units:{kg:1,g:0.001,mg:0.000001,lb:0.453592,oz:0.0283495,ton:1000}},
  temp:{label:'Temperature',units:{C:'C',F:'F',K:'K'}},
  time:{label:'Time',units:{s:1,min:60,hr:3600,day:86400,week:604800}}
};
function convertUtil(stage){
  let group='length', from='m', to='km';
  function convertTemp(v,f,t){
    let c = f==='C'?v : f==='F'?(v-32)*5/9 : v-273.15;
    if(t==='C') return c;
    if(t==='F') return c*9/5+32;
    return c+273.15;
  }
  function draw(){
    const g = CONVERT_GROUPS[group];
    const unitKeys = Object.keys(g.units);
    if(!unitKeys.includes(from)) from=unitKeys[0];
    if(!unitKeys.includes(to)) to=unitKeys[1]||unitKeys[0];
    stage.innerHTML = '<div class="card" style="max-width:460px;"><h3>Unit Converter</h3>'+
      '<div class="segmented" id="cvGroupSeg" style="margin-bottom:.8rem;">'+Object.keys(CONVERT_GROUPS).map(function(k){
        return '<button data-g="'+k+'" class="'+(group===k?'active':'')+'">'+CONVERT_GROUPS[k].label+'</button>';
      }).join('')+'</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>From</label><input type="number" id="cvFromVal" value="1"></div>'+
        '<div class="field"><label></label><select id="cvFromUnit">'+unitKeys.map(function(u){return '<option value="'+u+'" '+(u===from?'selected':'')+'>'+u+'</option>';}).join('')+'</select></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>To</label><input type="text" id="cvToVal" readonly style="font-weight:700;"></div>'+
        '<div class="field"><label></label><select id="cvToUnit">'+unitKeys.map(function(u){return '<option value="'+u+'" '+(u===to?'selected':'')+'>'+u+'</option>';}).join('')+'</select></div>'+
      '</div></div>';
    stage.querySelector('#cvGroupSeg').querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){ group=b.dataset.g; from=null; to=null; draw(); });
    });
    stage.querySelector('#cvFromVal').addEventListener('input',calc);
    stage.querySelector('#cvFromUnit').addEventListener('change',function(e){ from=e.target.value; calc(); });
    stage.querySelector('#cvToUnit').addEventListener('change',function(e){ to=e.target.value; calc(); });
    calc();
  }
  function calc(){
    const g = CONVERT_GROUPS[group];
    const v = parseFloat(stage.querySelector('#cvFromVal').value);
    const fromU = stage.querySelector('#cvFromUnit').value, toU = stage.querySelector('#cvToUnit').value;
    const out = stage.querySelector('#cvToVal');
    if(!isFinite(v)){ out.value=''; return; }
    let result;
    if(group==='temp') result = convertTemp(v,fromU,toU);
    else result = (v*g.units[fromU])/g.units[toU];
    out.value = (Math.round(result*100000)/100000).toString();
  }
  draw();
}

/* ---- Quick timer presets (one-tap Pomodoro-style durations) ---- */
function quickTimerUtil(stage){
  const PRESETS = [{label:'25 min focus',secs:25*60},{label:'5 min break',secs:5*60},{label:'50 min focus',secs:50*60},{label:'10 min break',secs:10*60}];
  let remaining=0, total=0, handle=null, running=false;
  function fmt(s){ const m=Math.floor(s/60), sec=s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }
  function draw(){
    stage.innerHTML = '<div class="card text-center" style="max-width:400px;">'+
      '<h3>Quick Timer</h3>'+
      '<div class="mono" id="qtDisplay" style="font-size:2.6rem;font-weight:800;margin:.8rem 0;">'+(total?fmt(remaining):'--:--')+'</div>'+
      '<div class="grid grid-2" style="gap:.5rem;margin-bottom:.8rem;">'+PRESETS.map(function(p){
        return '<button type="button" class="btn btn-secondary btn-sm qt-preset" data-secs="'+p.secs+'">'+p.label+'</button>';
      }).join('')+'</div>'+
      '<div class="flex-gap" style="justify-content:center;">'+
        '<button class="btn btn-primary btn-sm" id="qtStartBtn" '+(!total?'disabled':'')+'>'+(running?'Pause':'Start')+'</button>'+
        '<button class="btn btn-secondary btn-sm" id="qtResetBtn" '+(!total?'disabled':'')+'>Reset</button>'+
      '</div></div>';
    stage.querySelectorAll('.qt-preset').forEach(function(b){
      b.addEventListener('click',function(){
        clearInterval(handle); running=false;
        total = parseInt(b.dataset.secs,10); remaining=total;
        draw();
      });
    });
    const startBtn = stage.querySelector('#qtStartBtn');
    if(startBtn) startBtn.addEventListener('click',function(){
      if(running){ clearInterval(handle); running=false; draw(); return; }
      running=true; draw();
      handle = setInterval(function(){
        remaining--;
        const disp = stage.querySelector('#qtDisplay');
        if(disp) disp.textContent = fmt(Math.max(0,remaining));
        if(remaining<=0){
          clearInterval(handle); running=false;
          toast('Timer done!','success');
          if('Notification' in window && Notification.permission==='granted') new Notification('Timer done',{body:'Your quick timer has finished.'});
          draw();
        }
      },1000);
    });
    const resetBtn = stage.querySelector('#qtResetBtn');
    if(resetBtn) resetBtn.addEventListener('click',function(){ clearInterval(handle); running=false; remaining=total; draw(); });
  }
  draw();
}

/* ---- Memorization pad: type a list, get it quizzed back in random order ---- */
function memoShuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t;} return arr; }
function memoPadUtil(stage){
  let items=[], mode='edit', quizIndex=0, quizOrder=[], revealed=false, score=0;
  function draw(){
    if(mode==='edit'){
      stage.innerHTML = '<div class="card" style="max-width:520px;"><h3>Memorization Pad</h3>'+
        '<p class="text-faint" style="font-size:.78rem;">Type one item per line — a list, vocab words, formulas, dates. Then quiz yourself in a random order.</p>'+
        '<textarea id="mpInput" style="min-height:160px;" placeholder="Mitochondria&#10;Ribosome&#10;Golgi apparatus&#10;...">'+U.esc(items.join('\n'))+'</textarea>'+
        '<button class="btn btn-primary btn-sm" id="mpStartBtn" style="margin-top:.7rem;">'+U.svgIcon('play',13)+' Quiz me on this list</button></div>';
      stage.querySelector('#mpStartBtn').addEventListener('click',function(){
        const lines = stage.querySelector('#mpInput').value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
        if(lines.length<2){ toast('Add at least 2 items, one per line','info'); return; }
        items = lines;
        quizOrder = memoShuffle(items.map(function(_,i){return i;}));
        quizIndex=0; revealed=false; score=0; mode='quiz';
        draw();
      });
      U.paintIcons(stage);
      return;
    }
    if(quizIndex>=quizOrder.length){
      stage.innerHTML = '<div class="card text-center" style="max-width:420px;">'+
        '<h3>Done!</h3><p>You went through all '+items.length+' items.</p>'+
        '<div class="flex-gap" style="justify-content:center;margin-top:.6rem;">'+
          '<button class="btn btn-secondary btn-sm" id="mpAgainBtn">Quiz again (reshuffled)</button>'+
          '<button class="btn btn-secondary btn-sm" id="mpEditBtn">Edit list</button>'+
        '</div></div>';
      stage.querySelector('#mpAgainBtn').addEventListener('click',function(){ quizOrder=memoShuffle(items.map(function(_,i){return i;})); quizIndex=0; revealed=false; draw(); });
      stage.querySelector('#mpEditBtn').addEventListener('click',function(){ mode='edit'; draw(); });
      return;
    }
    const idx = quizOrder[quizIndex];
    stage.innerHTML = '<div class="card text-center" style="max-width:420px;">'+
      '<div class="text-faint mono" style="font-size:.78rem;margin-bottom:.6rem;">'+(quizIndex+1)+' / '+quizOrder.length+'</div>'+
      '<h3 style="min-height:2.4rem;">'+(revealed? U.esc(items[idx]) : '?')+'</h3>'+
      '<p class="text-faint" style="font-size:.8rem;">'+(revealed? 'Did you get it?' : 'Try to recall this item, then reveal.')+'</p>'+
      (revealed? '<div class="flex-gap" style="justify-content:center;margin-top:.6rem;"><button class="btn btn-secondary btn-sm" id="mpNoBtn">Missed it</button><button class="btn btn-primary btn-sm" id="mpYesBtn">Got it</button></div>'
        : '<button class="btn btn-primary btn-sm" id="mpRevealBtn" style="margin-top:.6rem;">Reveal</button>')+
      '<div class="text-faint" style="font-size:.72rem;margin-top:.8rem;">Score so far: '+score+' / '+quizIndex+'</div></div>';
    const revealBtn = stage.querySelector('#mpRevealBtn');
    if(revealBtn) revealBtn.addEventListener('click',function(){ revealed=true; draw(); });
    const yesBtn = stage.querySelector('#mpYesBtn');
    if(yesBtn) yesBtn.addEventListener('click',function(){ score++; quizIndex++; revealed=false; draw(); });
    const noBtn = stage.querySelector('#mpNoBtn');
    if(noBtn) noBtn.addEventListener('click',function(){ quizIndex++; revealed=false; draw(); });
  }
  draw();
}

function textCountUtil(stage){

    const v = e.target.value;

    stage.querySelector('#tcLines').textContent = v? v.split('\n').length : 0;
  });
}

function subjectGoalCandidates(){
  // Union State.subjects (populated via ensureSubject on the normal
  // Add Question flow) with distinct subject strings actually present on
  // questions, so goals still work even if a subject was set some other
  // way (e.g. bulk import) without going through ensureSubject.
  const fromStore = SD_Bank.getSubjectNames();
  const fromQuestions = Array.from(new Set(State.questions.map(function(q){return q.subject;}).filter(Boolean)));
  return Array.from(new Set(fromStore.concat(fromQuestions))).sort();
}

function printQuestionPaper(questions,title){

  }).join('');
  const totalMarks = questions.reduce(function(a,q){return a+(q.marks||1);},0);
  w.document.write('<html><head><title>'+U.esc(title)+'</title><style>'+
    'body{font-family:Georgia,serif;padding:2.2rem;color:#111;max-width:800px;margin:0 auto;}'+
    'h1{font-size:1.4rem;border-bottom:2px solid #111;padding-bottom:.5rem;}'+

    '@media print{body{padding:0.5rem;}}'+
    '</style></head><body>'+
    '<h1>'+U.esc(title)+'</h1>'+
    '<div class="meta"><span>Total Questions: '+questions.length+'</span><span>Total Marks: '+totalMarks+'</span><span>Time: _______</span></div>'+
    rows+
    '</body></html>');
  w.document.close(); w.focus();
  setTimeout(function(){w.print();},350);
}

/* ============================================================
   STUDYDESK v2 — NEW FEATURES MODULE
   Additive only: everything here reuses existing DB/State/UI
   primitives (DB, State, toast, openModal, confirmDialog, U, SD_Bank)
   and does not modify any renderer defined above. Safe to remove
   this whole block to fully revert the feature additions.

(function(){
"use strict";
const U = window.SD_UTIL;

/* Shared insertion helper for the Dashboard/Today banners (weekly digest,
   today's focus, streak reminder, low-storage warning). Every one of these
   inserts immediately after .view-head specifically — never after each
   other — so the on-screen stacking order is controlled purely by which
   order they're CALLED in (last called = ends up first, since each new
   one is inserted right after the header, pushing earlier ones down).
   This avoids the fragile "anchor to the previous banner" approach where
   getting insertion order and call order backwards silently produces the
   wrong stack. */
function sd2InsertBanner(host,el){
  const viewHead = host.querySelector('.view-head');
  if(viewHead && viewHead.parentNode===host){ viewHead.insertAdjacentElement('afterend', el); return; }
  const firstCard = host.querySelector('.card');
  if(firstCard && firstCard.parentNode===host){ host.insertBefore(el, firstCard); return; }
  host.insertBefore(el, host.firstChild);
}

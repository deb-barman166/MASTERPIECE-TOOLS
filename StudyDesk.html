/* ============================================================
   STUDYDESK — QUIZ / EXAM BUILDER
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

let qzActiveTab = 'quizzes';
async function render(container,params){
  params=params||{};
  const isTeacher = State.settings.userMode==='teacher';
  container.innerHTML =
  '<div class="view-head"><div><h1>Quiz &amp; Exam Builder</h1><div class="sub">'+(isTeacher?'Build practice quizzes, or create printable question papers':'Build a custom quiz or start an exam-style test')+'</div></div>'+
  '<div class="view-head-actions" id="qzHeadActions"></div></div>'+
  (isTeacher ? '<div class="segmented" id="qzTabSeg" style="margin-bottom:1.1rem;">'+
    '<button data-v="quizzes" class="'+(qzActiveTab==='quizzes'?'active':'')+'">'+U.svgIcon('doc-check',13)+' Practice Quizzes</button>'+
    '<button data-v="papers" class="'+(qzActiveTab==='papers'?'active':'')+'">'+U.svgIcon('layers',13)+' Question Papers</button>'+
  '</div>' : '')+
  '<div id="qzListWrap"></div>';

  const headActions = container.querySelector('#qzHeadActions');
  function syncHeadActions(){
    if(isTeacher && qzActiveTab==='papers'){
      headActions.innerHTML = '<button class="btn btn-primary" id="qpNewBtn">'+U.svgIcon('plus',15)+' New Question Paper</button>';
      const b = headActions.querySelector('#qpNewBtn'); if(b) b.addEventListener('click',function(){ openQuestionPaperModal(null,container); });
    } else {
      headActions.innerHTML = '<button class="btn btn-primary" id="qzNewBtn">'+U.svgIcon('plus',15)+' New Quiz</button>';
      const b = headActions.querySelector('#qzNewBtn'); if(b) b.addEventListener('click',openQuizBuilderModal);
    }
  }

  function renderQuizList(){
    const wrap = container.querySelector('#qzListWrap');
    if(!State.quizzes.length){
      wrap.innerHTML = '<div class="empty-state"><div class="ic">'+U.svgIcon('doc-check',22)+'</div><h3>No quizzes yet</h3><p>Create a custom quiz with your own question count, time limit, and marking scheme.</p><button class="btn btn-primary" id="qzEmptyBtn">'+U.svgIcon('plus',15)+' New Quiz</button></div>';
      const b=wrap.querySelector('#qzEmptyBtn'); if(b) b.addEventListener('click',openQuizBuilderModal);
      return;
    }
    const groupLookup = SD_Bank.allQuestionGroupsWithPaths ? SD_Bank.allQuestionGroupsWithPaths() : [];
    wrap.innerHTML = '<div class="data-list">'+State.quizzes.slice().reverse().map(function(qz){
      const bestAttempt = State.attempts.length? null:null;
      const history = quizHistoryFor(qz.id);
      const best = history.length? Math.max.apply(null,history.map(function(h){return h.scorePct;})) : null;
      const qzGroup = qz.groupId ? groupLookup.find(function(g){return g.id===qz.groupId;}) : null;
      return '<div class="list-row" data-qzid="'+qz.id+'"><div class="list-row-main"><div class="list-row-title">'+U.esc(qz.name)+'</div>'+
        '<div class="list-row-meta"><span class="tag">'+(qz.questionIds||[]).length+' questions</span><span class="tag">'+(qz.timeLimit?qz.timeLimit+' min':'No limit')+'</span>'+
        (qz.negativeMarking?'<span class="tag">−'+qz.negativeMarking+' per wrong</span>':'')+
        (qzGroup?'<span class="tag">'+U.svgIcon('folder',11)+' '+U.esc(qzGroup.path)+'</span>':'')+
        (best!==null?'<span class="tag">Best: '+best+'%</span>':'')+'</div></div>'+
        '<div class="list-row-actions"><button class="btn btn-secondary btn-sm" data-act="preview">Review</button><button class="btn btn-primary btn-sm" data-act="start">Start</button><button class="icon-btn" data-act="del">'+U.svgIcon('trash',14)+'</button></div></div>';
    }).join('')+'</div>';
    wrap.querySelectorAll('.list-row').forEach(function(row){
      const id = row.dataset.qzid;
      row.querySelector('[data-act="start"]').addEventListener('click',function(){ startQuiz(id); });
      row.querySelector('[data-act="del"]').addEventListener('click',async function(){
        const ok = await confirmDialog({title:'Delete this quiz?',danger:true,okText:'Delete'});
        if(!ok) return;
        const snapshot = State.quizzes.find(function(q){return q.id===id;});
        await DB.delete('quizzes',id);
        State.quizzes = State.quizzes.filter(function(q){return q.id!==id;});
        toast('Quiz deleted','info',{actionLabel:'Undo',onAction:async function(){
          if(!snapshot) return;
          await DB.put('quizzes',snapshot);
          State.quizzes.push(snapshot);
          toast('Quiz restored','success');
          renderQuizList();
        }});
        renderQuizList();
      });
      row.querySelector('[data-act="preview"]').addEventListener('click',function(){ openQuizHistoryModal(id); });
    });
    U.paintIcons(wrap);
  }

  function renderPaperList(){
    const wrap = container.querySelector('#qzListWrap');
    if(!State.questionPapers.length){
      wrap.innerHTML = '<div class="empty-state"><div class="ic">'+U.svgIcon('layers',22)+'</div><h3>No question papers yet</h3><p>Build a printable exam paper — pick your questions, set the marks scheme, and generate multiple randomized sets with matching answer keys.</p><button class="btn btn-primary" id="qpEmptyBtn">'+U.svgIcon('plus',15)+' New Question Paper</button></div>';
      const b=wrap.querySelector('#qpEmptyBtn'); if(b) b.addEventListener('click',function(){ openQuestionPaperModal(null,container); });
      return;
    }
    wrap.innerHTML = '<div class="data-list">'+State.questionPapers.slice().reverse().map(function(p){
      const marks = paperTotalMarks(p), qCount = paperTotalQuestions(p);
      return '<div class="list-row" data-pid="'+p.id+'"><div class="list-row-main"><div class="list-row-title">'+U.esc(p.name)+'</div>'+
        '<div class="list-row-meta"><span class="tag">'+qCount+' questions</span><span class="tag">'+marks+' marks</span>'+
        '<span class="tag">'+(p.setCount||1)+' set'+(p.setCount>1?'s':'')+'</span>'+
        (p.className?'<span class="tag">'+U.esc(p.className)+'</span>':'')+'</div></div>'+
        '<div class="list-row-actions"><button class="btn btn-secondary btn-sm" data-act="edit">Edit</button><button class="btn btn-primary btn-sm" data-act="output">Generate</button><button class="icon-btn" data-act="del">'+U.svgIcon('trash',14)+'</button></div></div>';
    }).join('')+'</div>';
    wrap.querySelectorAll('.list-row').forEach(function(row){
      const id = row.dataset.pid;
      const p = State.questionPapers.find(function(x){return x.id===id;});
      row.querySelector('[data-act="edit"]').addEventListener('click',function(){ openQuestionPaperModal(id,container); });
      row.querySelector('[data-act="output"]').addEventListener('click',function(){ openPaperOutputModal(p); });
      row.querySelector('[data-act="del"]').addEventListener('click',async function(){
        const ok = await confirmDialog({title:'Delete "'+p.name+'"?',message:'This removes the saved paper template. The underlying questions are not affected.',danger:true,okText:'Delete'});
        if(!ok) return;
        await DB.delete('questionPapers',id);
        State.questionPapers = State.questionPapers.filter(function(x){return x.id!==id;});
        renderPaperList();
        toast('Question paper deleted','info');
      });
    });
    U.paintIcons(wrap);
  }

  function renderCurrentTab(){
    syncHeadActions();
    if(isTeacher && qzActiveTab==='papers') renderPaperList(); else renderQuizList();
  }
  renderCurrentTab();

  const tabSeg = container.querySelector('#qzTabSeg');
  if(tabSeg) tabSeg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      qzActiveTab = b.dataset.v;
      tabSeg.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      renderCurrentTab();
    });
  });

  if(params.openNew) openQuizBuilderModal();
  if(params.openNewPaper && isTeacher){ qzActiveTab='papers'; if(tabSeg){tabSeg.querySelectorAll('button').forEach(function(x){x.classList.toggle('active',x.dataset.v==='papers');});} renderCurrentTab(); openQuestionPaperModal(null,container); }
}

/* ================= TEACHER MODE: QUESTION PAPER BUILDER ================= */
function blankPaperSection(){ return {id:U.uid(), title:'Section A', marksEach:1, questionIds:[]}; }
function openQuestionPaperModal(existingId,listContainer){
  const existing = existingId ? State.questionPapers.find(function(p){return p.id===existingId;}) : null;
  const isEdit = !!existing;
  const tp = State.settings.teacherProfile || {};
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    name:'', examName:'', className:'', subject:'', schoolName:tp.schoolName||'',
    instructions:tp.defaultInstructions||'', duration:tp.defaultDuration||60,
    setCount:1, seed: Math.floor(Math.random()*1e9),
    randomizeQuestionOrder:true, randomizeOptionOrder:true,
    sections:[blankPaperSection()]
  };
  const subjects = SD_Bank.getSubjectNames();
  const groupOpts = SD_Bank.allQuestionGroupsWithPaths ? SD_Bank.allQuestionGroupsWithPaths() : [];

  const html = '<div class="modal-head"><h3>'+(isEdit?'Edit':'New')+' Question Paper</h3><button class="icon-btn" data-modal-close>'+U.svgIcon('x',15)+'</button></div>'+
  '<div class="modal-body">'+
    '<div class="field-row">'+
      '<div class="field"><label>Paper name (for your own reference)</label><input type="text" id="qpName" value="'+U.esc(draft.name)+'" placeholder="e.g. Term 1 Physics — Class 10"></div>'+
      '<div class="field"><label>Exam title (shown on the paper)</label><input type="text" id="qpExamName" value="'+U.esc(draft.examName)+'" placeholder="e.g. First Terminal Examination"></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Class / Section</label><input type="text" id="qpClassName" value="'+U.esc(draft.className)+'" placeholder="e.g. Class 10 — Section B"></div>'+
      '<div class="field"><label>Subject</label><input type="text" id="qpSubject" value="'+U.esc(draft.subject)+'" placeholder="e.g. Physics"></div>'+
      '<div class="field"><label>Duration (minutes)</label><input type="number" id="qpDuration" min="5" value="'+draft.duration+'"></div>'+
    '</div>'+
    '<div class="field"><label>School / institution name (optional, shown on the paper)</label><input type="text" id="qpSchoolName" value="'+U.esc(draft.schoolName)+'"></div>'+
    '<div class="field"><label>Instructions</label><textarea id="qpInstructions" rows="2">'+U.esc(draft.instructions)+'</textarea></div>'+

    '<div class="section-title" style="margin-top:.9rem;">Sections &amp; Questions</div>'+
    '<div id="qpSectionsWrap"></div>'+
    '<button type="button" class="btn btn-secondary btn-sm" id="qpAddSectionBtn" style="margin-top:.4rem;">'+U.svgIcon('plus',13)+' Add Section</button>'+

    '<div class="section-title" style="margin-top:1.1rem;">Sets &amp; Randomization</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Number of sets</label><input type="number" id="qpSetCount" min="1" max="6" value="'+(draft.setCount||1)+'"></div>'+
    '</div>'+
    '<label class="checkbox-row"><input type="checkbox" id="qpRandQOrder" '+(draft.randomizeQuestionOrder!==false?'checked':'')+'><span style="font-size:.82rem;">Shuffle question order per set</span></label>'+
    '<label class="checkbox-row" style="margin-top:.3rem;"><input type="checkbox" id="qpRandOOrder" '+(draft.randomizeOptionOrder!==false?'checked':'')+'><span style="font-size:.82rem;">Shuffle answer option order per set (each set gets a genuinely different A/B/C/D arrangement)</span></label>'+
    '<p class="hint" style="margin-top:.4rem;">Sets stay identical every time you regenerate or reprint this paper — the answer key always matches whichever set you handed out.</p>'+
  '</div>'+
  '<div class="modal-foot"><button class="btn btn-secondary" data-modal-close>Cancel</button><button class="btn btn-primary" id="qpSaveBtn">'+U.svgIcon('save',15)+' Save Paper</button></div>';

  const wrap = openModal(html,{size:'xl'});

  function renderSections(){
    const secWrap = wrap.querySelector('#qpSectionsWrap');
    secWrap.innerHTML = draft.sections.map(function(sec,idx){
      return '<div class="card" data-secid="'+sec.id+'" style="margin-bottom:.7rem;">'+
        '<div class="field-row" style="margin-bottom:.5rem;align-items:flex-end;">'+
          '<div class="field" style="flex:2;"><label>Section title</label><input type="text" class="qp-sec-title" value="'+U.esc(sec.title)+'"></div>'+
          '<div class="field"><label>Marks each</label><input type="number" class="qp-sec-marks" min="1" step="0.5" value="'+sec.marksEach+'"></div>'+
          (draft.sections.length>1 ? '<button type="button" class="icon-btn qp-sec-del" title="Remove section">'+U.svgIcon('trash',14)+'</button>' : '')+
        '</div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Subject filter</label><select class="qp-sec-subject"><option value="">Any</option>'+subjects.map(function(s){return '<option value="'+U.esc(s)+'"'+(sec._filterSubject===s?' selected':'')+'>'+U.esc(s)+'</option>';}).join('')+'</select></div>'+
          '<div class="field"><label>Group filter</label><select class="qp-sec-group"><option value="">Any</option>'+groupOpts.map(function(g){return '<option value="'+g.id+'"'+(sec._filterGroup===g.id?' selected':'')+'>'+U.esc(g.path)+'</option>';}).join('')+'</select></div>'+
          '<div class="field"><label>Difficulty</label><select class="qp-sec-diff"><option value="">Any</option><option value="easy"'+(sec._filterDiff==='easy'?' selected':'')+'>Easy</option><option value="medium"'+(sec._filterDiff==='medium'?' selected':'')+'>Medium</option><option value="hard"'+(sec._filterDiff==='hard'?' selected':'')+'>Hard</option></select></div>'+
        '</div>'+
        '<div class="qp-sec-qlist" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.4rem;margin-top:.4rem;"></div>'+
        '<div class="text-faint qp-sec-count" style="font-size:.76rem;margin-top:.3rem;"></div>'+
      '</div>';
    }).join('');

    draft.sections.forEach(function(sec){
      const secEl = secWrap.querySelector('[data-secid="'+sec.id+'"]');
      renderSectionQuestionList(secEl,sec);
      secEl.querySelector('.qp-sec-title').addEventListener('input',function(e){ sec.title=e.target.value; });
      secEl.querySelector('.qp-sec-marks').addEventListener('input',function(e){ sec.marksEach=parseFloat(e.target.value)||1; });
      const delBtn = secEl.querySelector('.qp-sec-del');
      if(delBtn) delBtn.addEventListener('click',function(){
        draft.sections = draft.sections.filter(function(s){return s.id!==sec.id;});
        renderSections();
      });
      secEl.querySelector('.qp-sec-subject').addEventListener('change',function(e){ sec._filterSubject=e.target.value; renderSectionQuestionList(secEl,sec); });
      secEl.querySelector('.qp-sec-group').addEventListener('change',function(e){ sec._filterGroup=e.target.value; renderSectionQuestionList(secEl,sec); });
      secEl.querySelector('.qp-sec-diff').addEventListener('change',function(e){ sec._filterDiff=e.target.value; renderSectionQuestionList(secEl,sec); });
    });
    U.paintIcons(secWrap);
  }
  function renderSectionQuestionList(secEl,sec){
    let pool = State.questions.slice();
    if(sec._filterSubject) pool = pool.filter(function(q){return q.subject===sec._filterSubject;});
    if(sec._filterGroup){ const inGroup=new Set(SD_Bank.questionsInGroup(sec._filterGroup,true).map(function(q){return q.id;})); pool = pool.filter(function(q){return inGroup.has(q.id);}); }
    if(sec._filterDiff) pool = pool.filter(function(q){return q.difficulty===sec._filterDiff;});
    const listEl = secEl.querySelector('.qp-sec-qlist');
    if(!pool.length){
      listEl.innerHTML = '<p class="text-faint" style="font-size:.78rem;">No questions match this filter.</p>';
    } else {
      listEl.innerHTML = pool.map(function(q){
        const checked = sec.questionIds.includes(q.id);
        return '<label class="checkbox-row" style="padding:.25rem 0;"><input type="checkbox" class="qp-q-cb" data-qid="'+q.id+'" '+(checked?'checked':'')+'><span style="font-size:.8rem;">'+U.esc(U.truncate(U.stripHtml(q.text),80))+'</span></label>';
      }).join('');
      listEl.querySelectorAll('.qp-q-cb').forEach(function(cb){
        cb.addEventListener('change',function(){
          const qid = cb.dataset.qid;
          if(cb.checked){ if(!sec.questionIds.includes(qid)) sec.questionIds.push(qid); }
          else { sec.questionIds = sec.questionIds.filter(function(x){return x!==qid;}); }
          updateSectionCount(secEl,sec);
        });
      });
    }
    updateSectionCount(secEl,sec);
  }
  function updateSectionCount(secEl,sec){
    const countEl = secEl.querySelector('.qp-sec-count');
    if(countEl) countEl.textContent = sec.questionIds.length+' question(s) selected in this section';
  }
  renderSections();

  wrap.querySelector('#qpAddSectionBtn').addEventListener('click',function(){
    const nextLetter = String.fromCharCode(65+draft.sections.length);
    draft.sections.push(Object.assign(blankPaperSection(),{title:'Section '+nextLetter}));
    renderSections();
  });

  wrap.querySelector('#qpSaveBtn').addEventListener('click',async function(){
    draft.name = wrap.querySelector('#qpName').value.trim() || 'Untitled Paper';
    draft.examName = wrap.querySelector('#qpExamName').value.trim();
    draft.className = wrap.querySelector('#qpClassName').value.trim();
    draft.subject = wrap.querySelector('#qpSubject').value.trim();
    draft.duration = parseInt(wrap.querySelector('#qpDuration').value,10)||60;
    draft.schoolName = wrap.querySelector('#qpSchoolName').value.trim();
    draft.instructions = wrap.querySelector('#qpInstructions').value.trim();
    draft.setCount = Math.max(1,Math.min(6,parseInt(wrap.querySelector('#qpSetCount').value,10)||1));
    draft.randomizeQuestionOrder = wrap.querySelector('#qpRandQOrder').checked;
    draft.randomizeOptionOrder = wrap.querySelector('#qpRandOOrder').checked;
    const totalQ = draft.sections.reduce(function(sum,s){return sum+s.questionIds.length;},0);
    if(!totalQ){ toast('Add at least one question to a section first','error'); return; }
    draft.updatedAt = U.nowISO();
    const row = await DB.put('questionPapers',draft);
    const i = State.questionPapers.findIndex(function(p){return p.id===row.id;});
    if(i>=0) State.questionPapers[i]=row; else State.questionPapers.push(row);
    toast(isEdit?'Question paper updated':'Question paper saved','success');
    closeModal();
    if(listContainer) render(listContainer,{});
    else openPaperOutputModal(row);
  });
}

function openPaperOutputModal(paper){
  const marks = paperTotalMarks(paper), qCount = paperTotalQuestions(paper);
  const setLabels = Array.from({length:paper.setCount||1}).map(function(_,i){return String.fromCharCode(65+i);});
  const tp = State.settings.teacherProfile || {};
  const html = '<div class="modal-head"><h3>Generate — '+U.esc(paper.name)+'</h3><button class="icon-btn" data-modal-close>'+U.svgIcon('x',15)+'</button></div>'+
  '<div class="modal-body">'+
    '<p class="hint" style="margin-bottom:.8rem;">'+qCount+' questions · '+marks+' marks · '+(paper.setCount||1)+' set'+(paper.setCount>1?'s':'')+' ('+setLabels.join(', ')+')</p>'+
    '<div class="field"><label>Output type</label><div class="segmented" id="qpLayoutSeg">'+
      '<button data-v="standard" class="active">Standard Paper</button>'+
      '<button data-v="compact">Compact Worksheet</button>'+
      '<button data-v="omr">Paper + OMR Sheet</button>'+
      '<button data-v="interactive">'+U.svgIcon('zap',13)+' Interactive Quiz (HTML)</button>'+
    '</div></div>'+
    '<div id="qpPrintOptionsWrap"><label class="checkbox-row" style="margin-top:.4rem;"><input type="checkbox" id="qpIncludeKey" checked><span style="font-size:.82rem;">Include answer key (appended at the end, one per set)</span></label></div>'+
    '<div id="qpInteractiveOptionsWrap" style="display:none;"></div>'+
    '<div class="section-title" style="margin-top:1rem;">Output</div>'+
    '<div class="flex-gap" style="flex-wrap:wrap;" id="qpOutputActionsWrap">'+
      '<button class="btn btn-secondary" id="qpPrintBtn">'+U.svgIcon('print',15)+' Print</button>'+
      '<button class="btn btn-secondary" id="qpHtmlBtn">'+U.svgIcon('download',15)+' Download HTML file</button>'+
    '</div>'+
    '<p class="hint" style="margin-top:.6rem;" id="qpOutputHint">The downloaded HTML file is fully self-contained — open it in any browser to view or print later, no internet or StudyDesk needed.</p>'+
  '</div>'+
  '<div class="modal-foot"><button class="btn btn-secondary" data-modal-close>Close</button></div>';
  const wrap = openModal(html,{size:'xl'});
  let layout = 'standard';

  const interactiveDefaults = {
    quizTitle: paper.examName||paper.name, schoolName: paper.schoolName||tp.schoolName||'',
    timerMode:'total', totalMinutes: paper.duration||60, perQuestionSeconds:60,
    shuffleQuestions:true, shuffleOptions:true, useFixedSet:false, fixedSetLabel:'A',
    showPalette:true, allowFreeNavigation:true, allowReview:true,
    showResultsImmediately:true, showCorrectAnswers:true, showSectionBreakdown:true,
    negativeMarking: State.settings.negativeMarkDefault||0,
    passPercent:40, passMessage:'Well done — you\'ve passed!', failMessage:'Keep practicing — you\'ll get there.',
    captureStudentInfo:true, autoSaveProgress:true, detectTabSwitch:true, accentColor:'#3B82F6', theme:'classic'
  };
  const iv = Object.assign({},interactiveDefaults);

  function renderInteractiveOptions(){
    const w = wrap.querySelector('#qpInteractiveOptionsWrap');
    const themeCardsHtml = Object.keys(INTERACTIVE_QUIZ_THEMES).map(function(tid){
      const t = INTERACTIVE_QUIZ_THEMES[tid];
      const bg = (t.vars['--iq-bg'])||'#eef1f6';
      const accent = (t.vars['--iq-accent'])||iv.accentColor||'#3B82F6';
      const surface = (t.vars['--iq-surface'])||'#fff';
      const selected = (iv.theme||'classic')===tid;
      return '<button type="button" class="iq-theme-card'+(selected?' selected':'')+'" data-theme-id="'+tid+'" style="background:'+bg+';">'+
        '<span class="iq-theme-swatch" style="background:'+surface+';border-color:'+accent+';"><span style="background:'+accent+';"></span></span>'+
        '<span class="iq-theme-name">'+U.esc(t.label)+'</span>'+
      '</button>';
    }).join('');
    w.innerHTML =
      '<div class="field-row"><div class="field"><label>Quiz title (shown to students)</label><input type="text" id="ivTitle" value="'+U.esc(iv.quizTitle)+'"></div>'+
      '<div class="field"><label>School / institution name</label><input type="text" id="ivSchool" value="'+U.esc(iv.schoolName)+'"></div></div>'+
      '<div class="field"><label>Accent color</label><input type="color" id="ivAccent" value="'+iv.accentColor+'" style="height:2.2rem;width:5rem;"></div>'+

      '<div class="section-title" style="margin-top:.8rem;">Theme &amp; Style</div>'+
      '<p class="hint" style="margin-bottom:.6rem;">Pick the overall look students see when they open the quiz. Your accent color above still applies within whichever theme you choose.</p>'+
      '<div class="iq-theme-grid" id="ivThemeGrid">'+themeCardsHtml+'</div>'+
      '<p class="hint" id="ivThemeDesc" style="margin-top:.5rem;">'+U.esc((INTERACTIVE_QUIZ_THEMES[iv.theme||'classic']||{}).desc||'')+'</p>'+

      '<div class="section-title" style="margin-top:.8rem;">Timer</div>'+
      '<div class="segmented" id="ivTimerSeg"><button data-v="total" class="'+(iv.timerMode==='total'?'active':'')+'">Total time</button><button data-v="perq" class="'+(iv.timerMode==='perq'?'active':'')+'">Per-question time</button><button data-v="none" class="'+(iv.timerMode==='none'?'active':'')+'">No timer</button></div>'+
      '<div class="field-row" style="margin-top:.4rem;">'+
        '<div class="field" id="ivTotalMinWrap"><label>Total minutes</label><input type="number" id="ivTotalMin" min="1" value="'+iv.totalMinutes+'"></div>'+
        '<div class="field" id="ivPerQSecWrap" style="display:none;"><label>Seconds per question</label><input type="number" id="ivPerQSec" min="5" value="'+iv.perQuestionSeconds+'"></div>'+

/* Builds a fully self-contained HTML document (inline styles, no external
   dependencies) so a teacher can open, email, or print this file on any
   computer without StudyDesk installed. Reuses the exact same section/
   OMR rendering functions as the in-app print path, just serialized into
   a standalone <html> document instead of injected into the live page. */
function buildStandaloneQuestionPaperHTML(paper,setLabels,layout,includeKey){
  let body = '';
  setLabels.forEach(function(setLabel,idx){
    const gen = generatePaperSet(paper,setLabel);
    if(idx>0) body += '<div class="ws-pagebreak"></div>';
    body += renderOnePaperSet(paper,gen,layout==='omr'?'standard':layout,{});
    if(layout==='omr'){ body += '<div class="ws-pagebreak"></div>'+renderOmrSheet(paper,gen); }
  });
  if(includeKey){
    setLabels.forEach(function(setLabel){
      const gen = generatePaperSet(paper,setLabel);
      body += '<div class="ws-pagebreak"></div>'+renderPaperAnswerKey(paper,gen);
    });
  }
  const css = extractPrintOnlyCSS();
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+U.esc(paper.examName||paper.name)+'</title>'+
    '<style>'+css+' body{background:#fff;} .print-only{display:block !important;}</style>'+
    '</head><body><div class="print-only">'+body+'</div></body></html>';
}
/* Pulls just the .print-only / .ws-* / .qp-* / .omr-* rule text out of the
   live stylesheet, so the standalone export doesn't need to duplicate a
   second copy of that CSS by hand and risk drifting out of sync with the
   in-app print styles over time. */
function extractPrintOnlyCSS(){
  let out = '';
  for(const sheet of document.styleSheets){
    let rules;
    try{ rules = sheet.cssRules || sheet.rules; }catch(e){ continue; }
    if(!rules) continue;
    for(const rule of rules){
      if(rule.selectorText && (rule.selectorText.indexOf('.print-only')!==-1 || rule.selectorText.indexOf('.ws-')!==-1 || rule.selectorText.indexOf('.qp-')!==-1 || rule.selectorText.indexOf('.omr-')!==-1)){
        out += rule.cssText+'\n';
      } else if(rule.cssRules){
        for(const inner of rule.cssRules){
          if(inner.selectorText && (inner.selectorText.indexOf('.print-only')!==-1 || inner.selectorText.indexOf('.ws-')!==-1 || inner.selectorText.indexOf('.qp-')!==-1 || inner.selectorText.indexOf('.omr-')!==-1)){
            out += inner.cssText+'\n';
          }
        }
      }
    }
  }
  return out;
}

function buildInteractiveThemeCSS(themeId){
  const theme = INTERACTIVE_QUIZ_THEMES[themeId] || INTERACTIVE_QUIZ_THEMES.classic;

const INTERACTIVE_QUIZ_JS = ''+
'(function(){\n'+
'"use strict";\n'+
'var CFG = window.__QUIZ_DATA__;\n'+
'document.documentElement.style.setProperty("--iq-accent", CFG.accentColor||"#3B82F6");\n'+
'var flatQuestions = []; // {sectionTitle, marksEach, text, type, options, correctIndex, correctBool}\n'+

'  sec.questions.forEach(function(q){\n'+

'  });\n'+
'});\n'+
'function shuffleArr(arr){ var out=arr.slice(); for(var i=out.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=out[i]; out[i]=out[j]; out[j]=t; } return out; }\n'+
'var questions = flatQuestions;\n'+
'if(CFG.shuffleQuestions) questions = shuffleArr(questions);\n'+
'if(CFG.shuffleOptions){\n'+
'  questions = questions.map(function(q){\n'+
'    if(q.type!=="mcq"||!q.options) return q;\n'+
'    var idxs = q.options.map(function(_,i){return i;});\n'+
'    var shuffledIdx = shuffleArr(idxs);\n'+
'    var newOptions = shuffledIdx.map(function(i){return q.options[i];});\n'+
'    var newCorrect = shuffledIdx.indexOf(q.correctIndex);\n'+
'    var copy = Object.assign({},q); copy.options=newOptions; copy.correctIndex=newCorrect; return copy;\n'+
'  });\n'+
'}\n'+
'var current = 0;\n'+
'var answers = new Array(questions.length).fill(null); // index for mcq, boolean for truefalse\n'+
'var flagTabSwitches = 0;\n'+
'var startedAt = null, submittedAt = null;\n'+

'function byId(id){ return document.getElementById(id); }\n'+

'function loadSavedProgress(){\n'+
'  if(!CFG.autoSaveProgress) return null;\n'+
'  try{ var raw = localStorage.getItem(CFG.storageKey); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }\n'+
'}\n'+
'function saveProgress(){\n'+
'  if(!CFG.autoSaveProgress) return;\n'+
'  try{ localStorage.setItem(CFG.storageKey, JSON.stringify({answers:answers, current:current, secondsLeft:secondsLeft, studentName:studentName, studentRoll:studentRoll, startedAt:startedAt})); }catch(e){}\n'+
'}\n'+
'function clearSavedProgress(){ if(CFG.autoSaveProgress){ try{ localStorage.removeItem(CFG.storageKey); }catch(e){} } }\n'+

'function init(){\n'+
'  byId("iqIntroSchool").textContent = CFG.schoolName||"";\n'+
'  byId("iqIntroTitle").textContent = CFG.quizTitle||"Quiz";\n'+
'  var minutesNote = CFG.timerMode==="total" ? Math.round(CFG.totalSeconds/60)+" minutes total" : CFG.timerMode==="perq" ? CFG.perQuestionSeconds+" seconds per question" : "No time limit";\n'+
'  byId("iqIntroMeta").textContent = questions.length+" questions · "+minutesNote;\n'+
'  byId("iqQuizSchool").textContent = CFG.schoolName||"";\n'+
'  byId("iqQuizTitle").textContent = CFG.quizTitle||"Quiz";\n'+
'  if(!CFG.captureStudentInfo) byId("iqStudentInfoWrap").style.display="none";\n'+

'  byId("iqPrevBtn").addEventListener("click",function(){ goTo(current-1); });\n'+

'var lastResult = null;\n'+
'function computeAndShowResults(){\n'+
'  var correct=0, wrong=0, unanswered=0, rawMarks=0;\n'+

/* Produces a completely standalone, self-taking quiz: timer, question
   palette, click-to-answer, optional student-info capture, auto-save to
   localStorage, tab-switch detection, and a results/review screen with
   section-wise scoring and negative marking — all in one HTML file with
   zero external dependencies, so a student can open it offline in any
   browser with no internet connection and no StudyDesk installed. */
function safeJsonForScriptTag(obj){
  // JSON.stringify does not escape "</script" — if any question text
  // happens to contain that literal substring, embedding the JSON
  // directly inside a <script> tag would prematurely close the tag and
  // corrupt the rest of the document (a real, well-known XSS-adjacent
  // footgun, not a hypothetical one). Escaping the forward slash inside
  // that specific sequence neutralizes it without altering the JSON's
  // meaning (JS string literals treat \/ and / identically).
  return JSON.stringify(obj).replace(/<\/script/gi,'<\\/script');
}
function buildInteractiveQuizData(paper,setLabels,iv){
  // If locked to one fixed set, bake that exact set's already-shuffled
  // order/options in directly. Otherwise, ship the RAW (unshuffled)
  // question pool and let the exported file's own JS shuffle it fresh on
  // every load — this is what makes "a different random order for every
  // student who opens the file" actually true, since a shuffle baked in
  // at export time would be identical for every student instead.
  let sectionsData;
  if(iv.useFixedSet){
    const gen = generatePaperSet(paper,iv.fixedSetLabel||'A');
    sectionsData = gen.sections.map(function(sec){
      return {title:sec.title, marksEach:sec.marksEach, questions: sec.items.map(function(item){
        return {
          text: U.stripHtml(item.question.text),
          type: item.question.type,
          options: item.shuffledOptions ? item.shuffledOptions.map(function(o){return o.text;}) : null,
          correctIndex: item.shuffledOptions ? item.shuffledOptions.findIndex(function(o){return o.correct;}) : null,
          correctBool: item.question.type==='truefalse' ? (String(item.question.correctAnswer)==='true') : null
        };
      })};
    });
  } else {
    sectionsData = paper.sections.map(function(sec){
      return {title:sec.title, marksEach:sec.marksEach, questions: sec.questionIds.map(function(qid){
        const q = State.questions.find(function(x){return x.id===qid;});
        if(!q) return null;
        if(q.type==='mcq' && Array.isArray(q.options)){
          return {text:U.stripHtml(q.text), type:'mcq', options:q.options.map(function(o){return o.text;}), correctIndex:q.options.findIndex(function(o){return o.correct;}), correctBool:null};
        }
        if(q.type==='truefalse'){
          return {text:U.stripHtml(q.text), type:'truefalse', options:null, correctIndex:null, correctBool:(String(q.correctAnswer)==='true')};
        }
        return null; // interactive quiz only supports objective question types (mcq/true-false) — see UI note
      }).filter(Boolean)};
    });
  }
  return {
    quizTitle: iv.quizTitle, schoolName: iv.schoolName, accentColor: iv.accentColor,
    timerMode: iv.timerMode, totalSeconds: (iv.totalMinutes||60)*60, perQuestionSeconds: iv.perQuestionSeconds||60,
    shuffleQuestions: !iv.useFixedSet && iv.shuffleQuestions, shuffleOptions: !iv.useFixedSet && iv.shuffleOptions,
    showPalette: iv.showPalette, allowFreeNavigation: iv.allowFreeNavigation, allowReview: iv.allowReview,
    showResultsImmediately: iv.showResultsImmediately, showCorrectAnswers: iv.showCorrectAnswers, showSectionBreakdown: iv.showSectionBreakdown,
    negativeMarking: iv.negativeMarking||0, passPercent: iv.passPercent, passMessage: iv.passMessage, failMessage: iv.failMessage,
    captureStudentInfo: iv.captureStudentInfo, autoSaveProgress: iv.autoSaveProgress, detectTabSwitch: iv.detectTabSwitch,
    sections: sectionsData,
    storageKey: 'sd_iq_'+(paper.id||'p').slice(0,8)
  };
}
function buildInteractiveQuizHTML(paper,setLabels,iv){
  const data = buildInteractiveQuizData(paper,setLabels,iv);
  const dataJson = safeJsonForScriptTag(data);
  const themeId = iv.theme || 'classic';
  const themeCSS = buildInteractiveThemeCSS(themeId);
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">'+
    '<title>'+U.esc(data.quizTitle||'Quiz')+'</title>'+

    '</head><body data-iqtheme="'+U.esc(themeId)+'">'+
    '<div id="app" class="iq-app">'+INTERACTIVE_QUIZ_SKELETON+'</div>'+

function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t;} return arr; }

/* ---------- seeded PRNG for reproducible multi-set randomization ----------
   Question papers need deterministic shuffling: "Set B" must produce the
   exact same question order and option order every time it's regenerated
   or reprinted, not a fresh shuffle each time — otherwise a teacher who
   printed Set B, then reopens the paper a week later to print a few more
   copies, would get a DIFFERENT Set B and the answer key would no longer
   match the papers already handed out. mulberry32 is a small, fast,
   well-known PRNG with good-enough statistical distribution for shuffling
   exam questions (this is not a security/cryptographic use case). */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr,seed){
  const rng = mulberry32(seed);
  const out = arr.slice();
  for(let i=out.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=out[i]; out[i]=out[j]; out[j]=t; }
  return out;
}
/* Deterministically turns a paper's base seed + a set label ("A","B","C"…)
   into a distinct-but-reproducible numeric seed for that specific set, so
   every set gets its own stable shuffle derived from the same paper. */
function seedForSet(baseSeed,setLabel){
  let h = baseSeed >>> 0;
  for(let i=0;i<setLabel.length;i++){ h = (Math.imul(h,31) + setLabel.charCodeAt(i)) >>> 0; }
  return h;
}

/* ---------- generate one concrete "Set" from a paper's base selection ----------
   Returns {setLabel, sections:[{title,marksEach,items:[{question,shuffledOptions,correctLetter}]}]}
   with every MCQ's options shuffled per-set (so Set A and Set B don't even
   share the same option order for the same question) and the answer key
   computed AFTER that per-set shuffle — this is the part that's easy to
   get subtly wrong: the key must reflect where the correct option actually
   landed in *this set's* shuffled order, not the original stored order. */
function generatePaperSet(paper,setLabel){
  const seed = seedForSet(paper.seed||1,setLabel);
  const qSeed = seed, oSeed = (seed+7919)>>>0; // distinct sub-seeds so question order and per-question option order don't correlate
  let qCounter = 0, oCounter = 0;
  const sections = paper.sections.map(function(section){
    const qs = section.questionIds.map(function(qid){return State.questions.find(function(q){return q.id===qid;});}).filter(Boolean);
    const orderedQs = paper.randomizeQuestionOrder ? seededShuffle(qs, (qSeed + (qCounter++))>>>0) : qs;
    const items = orderedQs.map(function(q){
      let shuffledOptions = null, correctLetter = null;
      if(q.type==='mcq' && Array.isArray(q.options)){
        shuffledOptions = paper.randomizeOptionOrder ? seededShuffle(q.options, (oSeed + (oCounter++))>>>0) : q.options.slice();
        const idx = shuffledOptions.findIndex(function(o){return o.correct;});
        correctLetter = idx>=0 ? String.fromCharCode(65+idx) : null;
      } else if(q.type==='truefalse'){
        correctLetter = (String(q.correctAnswer)==='true') ? 'True' : 'False';
      } else if(q.type==='fillblank'){
        correctLetter = q.correctAnswer || null;
      } else {
        correctLetter = q.correctAnswer || null;
      }
      return {question:q, shuffledOptions:shuffledOptions, correctLetter:correctLetter};
    });
    return {title:section.title, marksEach:section.marksEach, items:items};
  });
  return {setLabel:setLabel, sections:sections};
}
function paperTotalMarks(paper){
  return paper.sections.reduce(function(sum,sec){return sum + (sec.questionIds.length * (sec.marksEach||1));},0);
}
function paperTotalQuestions(paper){
  return paper.sections.reduce(function(sum,sec){return sum + sec.questionIds.length;},0);
}

/* ---------- print rendering: standard/compact paper layout ---------- */
function paperItemBody(item,layout){
  const q = item.question;
  if(q.type==='mcq' && item.shuffledOptions){
    return '<div class="ws-options">'+item.shuffledOptions.map(function(opt,i){
      return '<div class="ws-opt"><span class="ws-opt-letter">'+String.fromCharCode(65+i)+'.</span> '+U.esc(opt.text)+'</div>';
    }).join('')+'</div>';
  }
  if(q.type==='truefalse'){
    return '<div class="ws-options"><div class="ws-opt"><span class="ws-opt-letter">A.</span> True</div><div class="ws-opt"><span class="ws-opt-letter">B.</span> False</div></div>';
  }
  if(q.type==='fillblank'){
    return '<div class="ws-fillblank">Answer: <span class="ws-blankline"></span></div>';
  }
  if(layout==='compact') return '';
  const lines = q.type==='longanswer' ? 6 : 2;
  let out = '<div class="ws-ruled">';
  for(let i=0;i<lines;i++) out += '<div class="ws-ruled-line"></div>';
  out += '</div>';
  return out;
}

function renderPaperAnswerKey(paper,gen){
  let html = '<div class="ws-header"><h2>Answer Key — '+U.esc(paper.examName||paper.name)+(gen.setLabel?' — Set '+U.esc(gen.setLabel):'')+'</h2></div><ol class="ws-keylist">';
  gen.sections.forEach(function(sec){
    sec.items.forEach(function(item){
      let ans = item.correctLetter;
      if(item.question.type==='mcq' && item.shuffledOptions && item.correctLetter){
        const idx = item.correctLetter.charCodeAt(0)-65;
        const opt = item.shuffledOptions[idx];
        ans = item.correctLetter+'. '+U.esc(opt?opt.text:'');
      } else {
        ans = ans ? U.esc(String(ans)) : '(no answer set)';
      }
      html += '<li>'+ans+'</li>';
    });
  });
  html += '</ol>';
  return html;
}
/* ---------- OMR (Optical Mark Recognition) style bubble answer sheet ----------
   A separate, dedicated sheet from the question paper itself — the way
   real OMR sheets work — with a roll-number bubble grid and one bubble
   row per question, sized to that question's actual option count (MCQ
   options vary 2-6; true/false is always 2). Genuinely scannable-style
   layout: filled reference circles, clear question numbering, consistent
   bubble spacing — not just a label that says "OMR". */
function renderOmrSheet(paper,gen){
  const totalQ = paperTotalQuestions(paper);
  let html = '<div class="ws-header omr-header"><h2>Answer Sheet'+(gen.setLabel?' — Set '+U.esc(gen.setLabel):'')+'</h2>'+
    '<div class="ws-meta-row"><span>Name: <span class="ws-fill">________________________</span></span><span>Roll No:</span></div></div>'+
    '<div class="omr-roll-grid">'+
      Array.from({length:10}).map(function(_,col){
        return '<div class="omr-roll-col"><div class="omr-roll-digit-label">'+col+'</div>'+
          Array.from({length:10}).map(function(_,row){return '<div class="omr-bubble">'+row+'</div>';}).join('')+
        '</div>';
      }).join('')+
    '</div>'+
    '<div class="omr-instructions">Darken the bubble completely for your chosen answer. Use a dark pen or pencil. Do not fold this sheet.</div>'+
    '<div class="omr-grid">';
  let qNum = 0;
  gen.sections.forEach(function(sec){
    sec.items.forEach(function(item){
      qNum++;
      const optCount = item.shuffledOptions ? item.shuffledOptions.length : (item.question.type==='truefalse' ? 2 : 4);
      const letters = Array.from({length:optCount}).map(function(_,i){return String.fromCharCode(65+i);});
      html += '<div class="omr-row"><span class="omr-qnum">'+qNum+'</span>'+
        letters.map(function(L){return '<span class="omr-opt"><span class="omr-bubble omr-bubble-sm">'+L+'</span></span>';}).join('')+
      '</div>';
    });
  });
  html += '</div>';
  return html;
}

async function submitQuiz(container){
  const rt = State.runtime.quiz;
  if(rt.submitted) return;
  rt.submitted = true;
  clearInterval(quizTimerHandle);
  const quiz = rt.quiz;
  let scoreMarks=0, maxMarks=0, correctCount=0, incorrectCount=0, skippedCount=0;
  const reviewItems=[];
  for(const q of rt.questions){
    maxMarks += (q.marks||1);
    const ans = rt.answers[q.id];
    if(ans===undefined||ans===''){
      skippedCount++;
      reviewItems.push({q:q,ans:null,correct:null});
      continue;
    }
    if(q.type==='shortanswer'||q.type==='longanswer'){
      // credit given as attempted; self-grading not enforced in exam context
      correctCount++;
      scoreMarks += (q.marks||1);
      reviewItems.push({q:q,ans:ans,correct:true,ungraded:true});
      continue;
    }
    const check = SD_checkAnswer(q,ans);
    if(check.correct){
      correctCount++; scoreMarks += (q.marks||1);
    } else {
      incorrectCount++; scoreMarks -= (quiz.negativeMarking||0);
    }
    reviewItems.push({q:q,ans:ans,correct:check.correct});
    await SD_recordAttempt(q,ans,check.correct,0,null).catch(function(){});
  }
  scoreMarks = Math.max(0,scoreMarks);
  const scorePct = U.pct(scoreMarks,maxMarks||1);

  await window.logSessionSimple('quiz-complete',{quizId:quiz.id,scorePct:scorePct,scoreMarks:scoreMarks,maxMarks:maxMarks,correctCount:correctCount,incorrectCount:incorrectCount,skippedCount:skippedCount,ts:U.nowISO()});
  awardXP(Math.round(scorePct/2),'quiz');

  renderQuizResult(container,{quiz:quiz,reviewItems:reviewItems,scoreMarks:scoreMarks,maxMarks:maxMarks,scorePct:scorePct,correctCount:correctCount,incorrectCount:incorrectCount,skippedCount:skippedCount});
  State.runtime.quiz=null;
}

/* ============================================================
   STUDYDESK — FLASHCARD STUDIO
   Rule-based spaced repetition (simplified SM-2 style):
   grade 0 (again): interval resets to 1 day, ease -0.2
   grade 1 (hard):  interval *1.2, ease -0.15
   grade 2 (good):  interval *ease, ease unchanged
   grade 3 (easy):  interval *ease*1.3, ease +0.15
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

function newCardSchedule(){ return {ease:2.5, interval:0, reps:0, state:'learning'}; }

function scheduleCard(card,grade){
  let ease = card.ease || 2.5;
  let interval = card.interval || 0;
  let reps = card.reps || 0;
  if(grade===0){ // again
    interval = 1/24; // ~1 hour, but we operate in days -> treat as due almost immediately (0 days from now effectively "today")
    interval = 0; // due again today
    ease = Math.max(1.3, ease-0.2);
    reps = 0;
  } else if(grade===1){ // hard
    interval = Math.max(1, Math.round(interval*1.2)) || 1;
    ease = Math.max(1.3, ease-0.15);
    reps++;
  } else if(grade===2){ // good
    interval = interval<1 ? 1 : Math.round(interval*ease);
    reps++;
  } else { // easy
    interval = interval<1 ? 3 : Math.round(interval*ease*1.3);
    ease += 0.15;
    reps++;
  }
  const state = reps===0 ? 'learning' : (interval>=21 ? 'mastered' : 'learning');
  card.ease=ease; card.interval=interval; card.reps=reps; card.state=state;
  card.lastReviewed = U.nowISO();
  card.nextReview = U.addDays(new Date().toISOString(), interval);
  return card;
}
window.SD_scheduleCard = scheduleCard;

function deckStats(deckId){
  const cards = State.flashcards.filter(function(c){return c.deckId===deckId;});
  const now = new Date().toISOString();
  const due = cards.filter(function(c){return !c.nextReview || U.daysBetween(c.nextReview,now)>=0;}).length;
  const mastered = cards.filter(function(c){return c.state==='mastered';}).length;
  return {total:cards.length,due:due,mastered:mastered,learning:cards.length-mastered};
}

function openDeckMenu(deckId,anchor){

/* ---------------- Study session (spaced repetition review) ---------------- */
function startFlashcardSession(deckId){
  const now = new Date().toISOString();
  let cards = State.flashcards.filter(function(c){return c.deckId===deckId;});
  if(!cards.length){ toast('This deck has no cards yet','info'); return; }
  const due = cards.filter(function(c){return !c.nextReview || U.daysBetween(c.nextReview,now)>=0;});
  const queue = (due.length? due : cards).slice();
  shuffleFc(queue);
  State.runtime.flashcard = {deckId:deckId,queue:queue,index:0,flipped:false,reviewed:0};
  navigate('flashcardrunner');
}
function shuffleFc(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t;} return arr; }

const FC_SAMPLE_JSON = '[\n'+
'  { "front": "What is H2O?", "back": "Water" },\n'+
'  { "front": "Capital of Japan", "back": "Tokyo", "difficulty": "easy" }\n'+
']';

function parseFriendlyFlashcardJSON(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('This doesn\'t look like valid JSON yet. Make sure every card is wrapped in { }, cards are separated by commas, and the whole thing is inside [ ]. (Parser said: '+e.message+')'); }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.cards) ? data.cards : (data && Array.isArray(data.flashcards) ? data.flashcards : null));
  if(!arr) throw new Error('Expected a list of cards — either "[ {...}, {...} ]" or "{ \\"cards\\": [ {...} ] }".');
  if(!arr.length) throw new Error('That JSON is valid, but the list is empty — add at least one card.');
  const out = [];
  arr.forEach(function(raw,i){
    if(!raw || typeof raw!=='object') throw new Error('Card #'+(i+1)+' isn\'t an object — each card needs to be wrapped in { }.');
    const front = raw.front || raw.question || raw.term;
    const back = raw.back || raw.answer || raw.definition;
    if(!front || !String(front).trim()) throw new Error('Card #'+(i+1)+' is missing "front" — that\'s the question or term side.');
    if(!back || !String(back).trim()) throw new Error('Card #'+(i+1)+' is missing "back" — that\'s the answer side.');
    out.push({
      front:String(front), back:String(back), image:raw.image||'',
      difficulty:(raw.difficulty||'medium').toLowerCase(),
      tags:Array.isArray(raw.tags)?raw.tags:(typeof raw.tags==='string'?raw.tags.split(',').map(function(t){return t.trim();}).filter(Boolean):[]),
      favorite:!!raw.favorite
    });
  });
  return out;
}
window.SD_parseFriendlyFlashcardJSON = parseFriendlyFlashcardJSON;

/* ============================================================
   STUDYDESK — NOTES
   Lightweight structured notes with a minimal markdown-like
   toolbar (headings, lists, bold, formulas-as-code, important
   callouts) rendered to safe HTML on display.
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

let notesSearch='';
let notesSubjectFilter='';

function mdToHtml(md){
  md = md||'';
  const esc = U.esc(md);
  const lines = esc.split('\n');
  let html=''; let inList=false;
  lines.forEach(function(line){
    let l = line;
    if(/^###\s+/.test(l)){ closeList(); html+='<h4>'+l.replace(/^###\s+/,'')+'</h4>'; return; }
    if(/^##\s+/.test(l)){ closeList(); html+='<h3>'+l.replace(/^##\s+/,'')+'</h3>'; return; }
    if(/^#\s+/.test(l)){ closeList(); html+='<h2>'+l.replace(/^#\s+/,'')+'</h2>'; return; }
    if(/^\*\s+/.test(l)||/^-\s+/.test(l)){
      if(!inList){ html+='<ul>'; inList=true; }
      html+='<li>'+inline(l.replace(/^[\*\-]\s+/,''))+'</li>'; return;
    }
    if(/^!\s+/.test(l)){ closeList(); html+='<p style="background:var(--amber-50);border-left:3px solid var(--amber-500);padding:.5rem .7rem;border-radius:6px;margin:.4rem 0;">'+inline(l.replace(/^!\s+/,''))+'</p>'; return; }
    closeList();
    if(l.trim()==='') { html+='<div style="height:.4rem;"></div>'; return; }
    html+='<p>'+inline(l)+'</p>';
  });
  closeList();
  function closeList(){ if(inList){ html+='</ul>'; inList=false; } }
  function inline(s){
    s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/`(.+?)`/g,'<code style="background:var(--surface-sunken);padding:.1rem .35rem;border-radius:4px;font-family:var(--font-mono);font-size:.85em;">$1</code>');
    return s;
  }
  return html || '<p class="text-faint">Empty note</p>';
}

function filteredNotes(){
  let list = State.notes.slice();
  if(notesSubjectFilter) list = list.filter(function(n){return n.subject===notesSubjectFilter;});
  if(notesSearch){
    const s = notesSearch.toLowerCase();
    list = list.filter(function(n){ return (n.title||'').toLowerCase().includes(s) || (n.body||'').toLowerCase().includes(s) || (n.subject||'').toLowerCase().includes(s); });
  }
  return list.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt);});
}

/* ---------------- Note Groups (nested, mirrors Question Groups) ---------------- */
function topLevelNoteGroups(){
  return State.noteGroups.filter(function(g){return !g.parentGroupId;}).sort(function(a,b){return a.name.localeCompare(b.name);});
}
function childNoteGroups(parentId){
  return State.noteGroups.filter(function(g){return g.parentGroupId===parentId;}).sort(function(a,b){return a.name.localeCompare(b.name);});
}
function noteGroupPath(groupId){
  const path = [];
  let current = State.noteGroups.find(function(g){return g.id===groupId;});
  let depth = 0;
  while(current && depth<20){
    path.unshift(current.name);
    current = current.parentGroupId ? State.noteGroups.find(function(g){return g.id===current.parentGroupId;}) : null;
    depth++;
  }
  return path;
}
function noteDescendantGroupIds(groupId){
  const out = [groupId];
  let frontier = [groupId];
  let depth = 0;
  while(frontier.length && depth<20){
    const next = [];
    frontier.forEach(function(pid){
      childNoteGroups(pid).forEach(function(c){ out.push(c.id); next.push(c.id); });
    });
    frontier = next;
    depth++;
  }
  return out;
}
function noteGroupCounts(groupId){
  const ids = noteDescendantGroupIds(groupId);
  return {
    direct: State.notes.filter(function(n){return n.groupId===groupId;}).length,
    total: State.notes.filter(function(n){return n.groupId && ids.includes(n.groupId);}).length
  };
}
async function saveNoteGroup(payload){
  const row = await DB.put('noteGroups',payload);
  const i = State.noteGroups.findIndex(function(g){return g.id===row.id;});
  if(i>=0) State.noteGroups[i]=row; else State.noteGroups.push(row);
  return row;
}
async function deleteNoteGroup(groupId,reassignTo){
  const childGroups = childNoteGroups(groupId);
  for(const cg of childGroups){
    cg.parentGroupId = reassignTo || null;
    await DB.put('noteGroups',cg);
  }
  const childNotes = State.notes.filter(function(n){return n.groupId===groupId;});
  for(const n of childNotes){
    n.groupId = reassignTo || null;
    await DB.put('notes',n);
  }
  await DB.delete('noteGroups',groupId);
  State.noteGroups = State.noteGroups.filter(function(g){return g.id!==groupId;});
}

let ngGroupState = {currentGroupId:null, expanded:{}};
function noteGroupTreeRow(group,depth){
  const counts = noteGroupCounts(group.id);
  const kids = childNoteGroups(group.id);
  const isExpanded = !!ngGroupState.expanded[group.id];
  const isActive = ngGroupState.currentGroupId===group.id;
  let html = '<div class="qg-row'+(isActive?' active':'')+'" data-gid="'+group.id+'" style="padding-left:'+(depth*1.1)+'rem;">'+
    (kids.length ? '<button type="button" class="ng-toggle" data-gid="'+group.id+'">'+U.svgIcon(isExpanded?'chevron-down':'chevron-right',13)+'</button>' : '<span class="qg-toggle-spacer"></span>')+
    '<span class="ng-name" data-gid="'+group.id+'">'+U.svgIcon('folder',13)+' '+U.esc(group.name)+'</span>'+
    '<span class="qg-count">'+counts.direct+(counts.total!==counts.direct?' / '+counts.total:'')+'</span>'+
  '</div>';
  if(kids.length && isExpanded){
    html += kids.map(function(k){return noteGroupTreeRow(k,depth+1);}).join('');
  }
  return html;
}

function confirmDeleteNoteGroup(groupId,container){
  const group = State.noteGroups.find(function(g){return g.id===groupId;});
  if(!group) return;
  const kids = childNoteGroups(groupId);
  const directN = State.notes.filter(function(n){return n.groupId===groupId;}).length;
  const parentName = group.parentGroupId ? (State.noteGroups.find(function(g){return g.id===group.parentGroupId;})||{}).name : null;
  const destination = parentName ? ('"'+parentName+'"') : 'the top level';
  const message = (kids.length||directN)
    ? 'This group has '+kids.length+' subgroup(s) and '+directN+' note(s) directly in it. They will all move up to '+destination+' rather than being deleted.'
    : 'This group is empty and will be removed.';
  confirmDialog({title:'Delete "'+group.name+'"?',message:message,danger:true,okText:'Delete group'}).then(function(ok){
    if(!ok) return;
    deleteNoteGroup(groupId,group.parentGroupId).then(function(){
      ngGroupState.currentGroupId = group.parentGroupId || null;
      toast('Group deleted','info');
      render(container,{});
    });
  });
}

const NT_SAMPLE_JSON = '[\n'+
'  {\n'+
'    "title": "Newton\'s Laws",\n'+
'    "body": "# Newton\'s Laws\\n- First law: objects stay at rest or in motion unless acted on\\n- Second law: F = m * a",\n'+
'    "subject": "Physics",\n'+
'    "topic": "Mechanics"\n'+
'  }\n'+
']';

function parseFriendlyNotesJSON(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('This doesn\'t look like valid JSON yet. Make sure every note is wrapped in { }, notes are separated by commas, and the whole thing is inside [ ]. (Parser said: '+e.message+')'); }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.notes) ? data.notes : null);
  if(!arr) throw new Error('Expected a list of notes — either "[ {...}, {...} ]" or "{ \\"notes\\": [ {...} ] }".');
  if(!arr.length) throw new Error('That JSON is valid, but the list is empty — add at least one note.');
  const out = [];
  arr.forEach(function(raw,i){
    if(!raw || typeof raw!=='object') throw new Error('Note #'+(i+1)+' isn\'t an object — each note needs to be wrapped in { }.');
    const body = raw.body || raw.content || raw.text;
    if((!raw.title || !String(raw.title).trim()) && (!body || !String(body).trim())) throw new Error('Note #'+(i+1)+' needs at least a "title" or a "body" — it can\'t be completely empty.');
    out.push({
      title:raw.title?String(raw.title):'Untitled Note',
      body:body?String(body):'',
      subject:raw.subject||'', topic:raw.topic||''
    });
  });
  return out;
}
window.SD_parseFriendlyNotesJSON = parseFriendlyNotesJSON;

/* ============================================================
   STUDYDESK — AUDIO STUDIO
   Turn any selection of Questions / Flashcards / Notes — picked by
   Group (with subgroups), by Deck, or individually — into a spoken
   playlist: read aloud in-app with full voice controls, or captured
   to a real downloadable audio file via the browser's own tab-audio
   recorder. A plain-text script export is always available as a
   friction-free fallback that needs no special permission.
   ============================================================ */
(function(){
"use strict";
const U = window.SD_UTIL;

/* ---------- local group-tree helpers (mirrors the Question Bank /
   Notes modules' own helpers, so this module doesn't need to reach
   into their IIFEs — State itself is the shared source of truth) ---------- */
function qTopLevelGroups(){ return State.questionGroups.filter(function(g){return !g.parentGroupId;}); }
function qChildGroups(parentId){ return State.questionGroups.filter(function(g){return g.parentGroupId===parentId;}); }
function qGroupPath(groupId){
  const path=[]; let g=State.questionGroups.find(function(x){return x.id===groupId;});
  while(g){ path.unshift(g.name); g = g.parentGroupId ? State.questionGroups.find(function(x){return x.id===g.parentGroupId;}) : null; }
  return path;
}
function qQuestionsInGroup(groupId,includeSub){
  const ids = [groupId];
  if(includeSub){
    let frontier=[groupId];
    while(frontier.length){
      const next = State.questionGroups.filter(function(g){return frontier.includes(g.parentGroupId);}).map(function(g){return g.id;});
      ids.push.apply(ids,next); frontier=next;
    }
  }
  return State.questions.filter(function(q){return q.groupId && ids.includes(q.groupId);});
}
function nTopLevelGroups(){ return State.noteGroups.filter(function(g){return !g.parentGroupId;}); }
function nChildGroups(parentId){ return State.noteGroups.filter(function(g){return g.parentGroupId===parentId;}); }
function nGroupPath(groupId){
  const path=[]; let g=State.noteGroups.find(function(x){return x.id===groupId;});
  while(g){ path.unshift(g.name); g = g.parentGroupId ? State.noteGroups.find(function(x){return x.id===g.parentGroupId;}) : null; }
  return path;
}
function nNotesInGroup(groupId,includeSub){
  const ids=[groupId];
  if(includeSub){
    let frontier=[groupId];
    while(frontier.length){
      const next = State.noteGroups.filter(function(g){return frontier.includes(g.parentGroupId);}).map(function(g){return g.id;});
      ids.push.apply(ids,next); frontier=next;
    }
  }
  return State.notes.filter(function(n){return n.groupId && ids.includes(n.groupId);});
}

/* ---------- persisted "as-selection" state for the builder screen,
   module-level so it survives navigating away and back (matches the
   pattern used by qbFilters / mjFilter elsewhere in the app) ---------- */
const asState = {
  selectedQuestionGroupIds: [], selectedQuestionIds: [], includeUngroupedQuestions:false,
  selectedNoteGroupIds: [], selectedNoteIds: [], includeUngroupedNotes:false,
  selectedDeckIds: [],
  expandedQGroups:{}, expandedNGroups:{},
  voiceURI:'', rate:1, pitch:1, volume:1, gapSeconds:0.6,
  questionReadMode:'qa_pause', flashcardReadMode:'front_back', noteReadMode:'title_body',
  shufflePlaylist:false
};

/* ---------- building the actual ordered playlist from current selection ---------- */
function collectSelectedQuestions(){
  const set = new Map();
  asState.selectedQuestionGroupIds.forEach(function(gid){
    qQuestionsInGroup(gid,true).forEach(function(q){ set.set(q.id,q); });
  });
  asState.selectedQuestionIds.forEach(function(qid){
    const q = State.questions.find(function(x){return x.id===qid;});
    if(q) set.set(q.id,q);
  });
  if(asState.includeUngroupedQuestions){
    State.questions.filter(function(q){return !q.groupId;}).forEach(function(q){ set.set(q.id,q); });
  }
  return Array.from(set.values());
}
function collectSelectedNotes(){
  const set = new Map();
  asState.selectedNoteGroupIds.forEach(function(gid){
    nNotesInGroup(gid,true).forEach(function(n){ set.set(n.id,n); });
  });
  asState.selectedNoteIds.forEach(function(nid){
    const n = State.notes.find(function(x){return x.id===nid;});
    if(n) set.set(n.id,n);
  });
  if(asState.includeUngroupedNotes){
    State.notes.filter(function(n){return !n.groupId;}).forEach(function(n){ set.set(n.id,n); });
  }
  return Array.from(set.values());
}
function collectSelectedFlashcards(){
  const set = new Map();
  asState.selectedDeckIds.forEach(function(did){
    State.flashcards.filter(function(c){return c.deckId===did;}).forEach(function(c){ set.set(c.id,c); });
  });
  return Array.from(set.values());
}

/* Every playlist item is normalized to {kind, id, segments:[{label,text}]}
   so the player doesn't need to know source-specific shape — segments
   are spoken in order with the configured gap between each, and the
   read-mode settings decide which segments exist per source. */
function buildPlaylist(){
  const items = [];
  collectSelectedQuestions().forEach(function(q){
    const qText = U.stripHtml(q.text||'');
    const answerText = answerTextFor(q);
    const mode = asState.questionReadMode;
    const segs = [];
    if(mode==='q_only'){ segs.push({label:'Question',text:qText}); }
    else if(mode==='qa_together'){ segs.push({label:'Question & Answer',text:qText+'. Answer: '+answerText}); }
    else { segs.push({label:'Question',text:qText}); segs.push({label:'Answer',text:answerText}); }
    items.push({kind:'question', id:q.id, title:qText, segments:segs});
  });
  collectSelectedFlashcards().forEach(function(c){
    const mode = asState.flashcardReadMode;
    const segs = [];
    if(mode==='front_only'){ segs.push({label:'Front',text:c.front}); }
    else { segs.push({label:'Front',text:c.front}); segs.push({label:'Back',text:c.back}); }
    items.push({kind:'flashcard', id:c.id, title:c.front, segments:segs});
  });
  collectSelectedNotes().forEach(function(n){
    const mode = asState.noteReadMode;
    const bodyText = U.stripHtml((n.body||'').replace(/[#*\-`]/g,''));
    const segs = [];
    if(mode==='title_only'){ segs.push({label:'Title',text:n.title||'Untitled'}); }
    else { segs.push({label:n.title||'Untitled',text:(n.title||'Untitled')+'. '+bodyText}); }
    items.push({kind:'note', id:n.id, title:n.title||'Untitled', segments:segs});
  });
  let list = items;
  if(asState.shufflePlaylist){
    list = list.slice();
    for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=list[i]; list[i]=list[j]; list[j]=t; }
  }
  return list;
}
function answerTextFor(q){
  if(q.type==='mcq' && Array.isArray(q.options)){
    const correct = q.options.filter(function(o){return o.correct;}).map(function(o){return o.text;});
    return correct.join(', ') || 'not set';
  }
  if(q.type==='truefalse'){ return q.correctAnswer===true || q.correctAnswer==='true' ? 'True' : 'False'; }
  if(q.correctAnswer!==undefined && q.correctAnswer!==null && q.correctAnswer!=='') return String(q.correctAnswer);
  return 'not set';
}

/* rough spoken-duration estimate for the "estimated length" display —
   ~150 words/minute at rate 1, scaled by the chosen rate, plus the
   configured inter-item gap. Not exact (real TTS timing varies by
   voice/engine) but close enough to be a useful planning number. */
function estimateSeconds(playlist){
  const wordsPerSec = (150/60) * (asState.rate||1);
  let total=0;
  playlist.forEach(function(item){
    item.segments.forEach(function(seg){
      const words = (seg.text||'').trim().split(/\s+/).filter(Boolean).length;
      total += words/wordsPerSec + 0.4;
    });
    total += asState.gapSeconds;
  });
  return Math.round(total);
}
function fmtDuration(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m+':'+String(s).padStart(2,'0');
}

/* ---------- voices: getVoices() is often empty on first call and
   populates asynchronously via the voiceschanged event — a very common
   source of "the voice list is empty" bugs if this isn't handled. ---------- */
let cachedVoices = [];
function loadVoices(cb){
  if(!('speechSynthesis' in window)){ cb([]); return; }
  const v = window.speechSynthesis.getVoices();
  if(v && v.length){ cachedVoices=v; cb(v); return; }
  window.speechSynthesis.onvoiceschanged = function(){
    cachedVoices = window.speechSynthesis.getVoices();
    cb(cachedVoices);
  };
  // some browsers need a nudge to populate the list at all
  setTimeout(function(){ if(!cachedVoices.length){ cachedVoices=window.speechSynthesis.getVoices(); if(cachedVoices.length) cb(cachedVoices); } },300);
}

/* ---------- runtime player state ---------- */
const player = {
  playlist:[], index:0, segIndex:0, playing:false, paused:false,
  recorder:null, recordedChunks:[], recording:false, recordStream:null,
  onDoneCallback:null
};
function stopSpeech(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}
function currentSegmentText(){
  const item = player.playlist[player.index];
  if(!item) return null;
  const seg = item.segments[player.segIndex];
  return seg ? seg.text : null;
}
function speakNext(onProgress,onEnd){
  if(player.index>=player.playlist.length){ player.playing=false; onEnd(); return; }
  const item = player.playlist[player.index];
  if(player.segIndex>=item.segments.length){
    player.index++; player.segIndex=0;
    setTimeout(function(){ speakNext(onProgress,onEnd); }, asState.gapSeconds*1000);
    return;
  }
  const seg = item.segments[player.segIndex];
  onProgress(player.index,player.segIndex,item,seg);
  const utter = new SpeechSynthesisUtterance(seg.text||'');
  if(asState.voiceURI){
    const v = cachedVoices.find(function(x){return x.voiceURI===asState.voiceURI;});
    if(v) utter.voice = v;
  }
  utter.rate = asState.rate; utter.pitch = asState.pitch; utter.volume = asState.volume;
  utter.onend = function(){
    if(!player.playing) return; // stopped externally
    player.segIndex++;
    speakNext(onProgress,onEnd);
  };
  utter.onerror = function(){
    if(!player.playing) return;
    player.segIndex++;
    speakNext(onProgress,onEnd);
  };
  window.speechSynthesis.speak(utter);
}

/* ---------- text-script export: always available, no permission
   needed, works in every browser regardless of speechSynthesis or
   recording support. This is the reliable companion to the audio
   recording feature below. ---------- */
function buildScriptText(playlist){
  const lines = ['STUDYDESK AUDIO STUDIO — SCRIPT','Generated '+new Date().toLocaleString(),'Items: '+playlist.length,'Estimated length: '+fmtDuration(estimateSeconds(playlist)),'',''];
  playlist.forEach(function(item,i){
    lines.push('['+(i+1)+'/'+playlist.length+'] '+item.kind.toUpperCase());
    item.segments.forEach(function(seg){
      lines.push(seg.label+': '+seg.text);
    });
    lines.push('');
  });
  return lines.join('\n');
}

/* ---------- real downloadable audio via tab-audio capture. The Web
   Speech API has no direct way to export its output as an audio
   buffer/file — utterances play straight to system audio, and there is
   no standard API to intercept that stream. The one approach that
   genuinely works in Chromium browsers is capturing this tab's own
   audio output through the browser's native tab/screen-share picker
   (the same permission dialog used for screen recording), which is
   why this requires an explicit one-time prompt rather than being
   silent/automatic — that prompt is a real browser security boundary,
   not something this app can skip. ---------- */
async function recordPlaylistToBlob(playlist,onProgress){
  if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getDisplayMedia){
    throw new Error('Recording isn\'t supported in this browser. Use the text script export instead, or try Chrome/Edge on desktop.');
  }
  const stream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
  const audioTracks = stream.getAudioTracks();
  if(!audioTracks.length){
    stream.getTracks().forEach(function(t){t.stop();});
    throw new Error('No audio track was shared. When the picker appears, make sure to check "Share tab audio" (or "Share system audio").');
  }
  // we only need the audio; stop any video track immediately so the
  // browser's recording indicator doesn't imply we're capturing video
  stream.getVideoTracks().forEach(function(t){t.stop();});
  const audioOnlyStream = new MediaStream(audioTracks);
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
  const recorder = new MediaRecorder(audioOnlyStream, {mimeType:mimeType});
  const chunks = [];
  recorder.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
  const donePromise = new Promise(function(resolve){ recorder.onstop = resolve; });
  recorder.start();
  stopSpeech();
  player.playlist = playlist; player.index=0; player.segIndex=0; player.playing=true;
  await new Promise(function(resolve){
    speakNext(function(idx,segIdx,item,seg){ onProgress(idx,segIdx,item,seg); }, function(){ resolve(); });
  });
  recorder.stop();
  audioTracks.forEach(function(t){t.stop();});
  await donePromise;
  return new Blob(chunks,{type:mimeType});
}

async function render(container,params){

  container.innerHTML =

  '<div class="as-layout">'+

        '<button class="as-source-tab" data-src="flashcards" type="button">'+U.svgIcon('cards',14)+' Flashcards</button>'+
        '<button class="as-source-tab" data-src="notes" type="button">'+U.svgIcon('note',14)+' Notes</button>'+
      '</div>'+
      '<div id="asSourcePane"></div>'+
    '</div>'+

    '<div class="as-side-col">'+
      '<div class="card">'+
        '<h3 style="margin-bottom:.6rem;">2. Voice &amp; playback</h3>'+
        '<div class="field"><label>Voice</label><select id="asVoice"><option value="">Loading voices…</option></select></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Speed ('+asState.rate.toFixed(2)+'×)</label><input type="range" id="asRate" min="0.5" max="2" step="0.05" value="'+asState.rate+'"></div>'+

      '</div>'+

      '<div class="card">'+
        '<h3 style="margin-bottom:.6rem;">3. How to read each type</h3>'+
        '<div class="field"><label>Questions</label><select id="asQMode">'+
          '<option value="q_only"'+(asState.questionReadMode==='q_only'?' selected':'')+'>Question only</option>'+
          '<option value="qa_together"'+(asState.questionReadMode==='qa_together'?' selected':'')+'>Question + answer together</option>'+

/* ================= PLAYER BAR ================= */
/* ================= PERSISTENT MINI-PLAYER =================
   Lives outside the Audio Studio view entirely (in the app shell, as a
   sibling of #mainRegion — see #audioMiniPlayer near the top of the
   document), so it survives navigating to any other section exactly
   like the toast stack and command palette already do. Previously this
   player rendered *inside* the Audio Studio view's own container,
   which meant navigate() replacing mainRegion.innerHTML for any other
   view silently destroyed it — speech could keep talking with zero UI
   left to control or even stop it. */
let ampExpandedState = false;
function startPlayback(){
  const list = buildPlaylist();
  if(!list.length){ toast('Select something to include first','error'); return; }
  stopSpeech();
  player.playlist = list; player.index=0; player.segIndex=0; player.playing=true; player.paused=false;
  showMiniPlayer();
  driveSpeech();
}
function driveSpeech(){
  speakNext(
    function(idx,segIdx,item,seg){ updateMiniPlayer(idx,segIdx,item,seg); },
    function(){ player.playing=false; toast('Playback finished','success'); updateMiniPlayerButtons(); }
  );
}
function ampEl(id){ return document.getElementById(id); }
function showMiniPlayer(){
  const root = ampEl('audioMiniPlayer');
  if(!root) return;
  root.classList.add('visible');
  document.body.setAttribute('data-audio-player-visible','true');
  wireMiniPlayerOnce();
  updateMiniPlayerButtons();
  renderExpandedList();
}
function hideMiniPlayer(){
  const root = ampEl('audioMiniPlayer');
  if(root) root.classList.remove('visible','expanded');
  document.body.removeAttribute('data-audio-player-visible');
  ampExpandedState = false;
}
let _ampWired = false;
function wireMiniPlayerOnce(){
  if(_ampWired) return; _ampWired = true;
  ampEl('ampPauseResume').addEventListener('click',function(){
    if(!player.playing && !player.paused) return;
    if(player.paused){ window.speechSynthesis.resume(); player.paused=false; }
    else { window.speechSynthesis.pause(); player.paused=true; }
    updateMiniPlayerButtons();
  });
  ampEl('ampSkipFwd').addEventListener('click',function(){
    if(!player.playlist.length) return;
    stopSpeech(); player.index++; player.segIndex=0;
    if(player.index>=player.playlist.length){ player.playing=false; updateMiniPlayerButtons(); return; }
    driveSpeech();
  });
  ampEl('ampSkipBack').addEventListener('click',function(){
    if(!player.playlist.length) return;
    stopSpeech(); player.index=Math.max(0,player.index-1); player.segIndex=0;
    driveSpeech();
  });
  ampEl('ampClose').addEventListener('click',function(e){
    e.stopPropagation();
    stopSpeech(); player.playing=false; player.paused=false; player.playlist=[]; player.index=0; player.segIndex=0;
    hideMiniPlayer();
  });
  ampEl('ampRow').addEventListener('click',function(e){
    if(e.target.closest('.amp-btn')) return; // let control buttons handle their own click
    toggleExpanded();
  });
  ampEl('ampCollapseBtn').addEventListener('click',function(e){ e.stopPropagation(); toggleExpanded(); });
  document.addEventListener('keydown',function(e){
    const root = ampEl('audioMiniPlayer');
    if(!root || !root.classList.contains('visible')) return;
    if(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if(e.code==='Space'){ e.preventDefault(); ampEl('ampPauseResume').click(); }
    else if(e.key==='ArrowRight'){ ampEl('ampSkipFwd').click(); }
    else if(e.key==='ArrowLeft'){ ampEl('ampSkipBack').click(); }
    else if(e.key==='Escape' && ampExpandedState){ toggleExpanded(); }
  });
}
function toggleExpanded(){
  ampExpandedState = !ampExpandedState;
  const root = ampEl('audioMiniPlayer');
  if(root) root.classList.toggle('expanded',ampExpandedState);
  if(ampExpandedState) renderExpandedList();
}
function updateMiniPlayer(idx,segIdx,item,seg){
  const titleEl = ampEl('ampTitle'), subEl = ampEl('ampSub'), fill = ampEl('ampProgressFill');
  const kindIcon = item.kind==='question' ? 'bank' : item.kind==='flashcard' ? 'cards' : 'note';
  ampEl('ampArt').innerHTML = U.svgIcon(kindIcon,16);
  if(titleEl) titleEl.textContent = U.truncate(item.title||'Untitled',48);
  if(subEl) subEl.textContent = 'Item '+(idx+1)+'/'+player.playlist.length+' · '+seg.label;
  if(fill) fill.style.width = Math.round(((idx)/Math.max(1,player.playlist.length))*100)+'%';
  const expandedKind = ampEl('ampExpandedKind'), expandedText = ampEl('ampExpandedText');
  if(expandedKind) expandedKind.textContent = item.kind.charAt(0).toUpperCase()+item.kind.slice(1)+' · '+seg.label;
  if(expandedText) expandedText.textContent = seg.text||'';
  updateMiniPlayerButtons();
  highlightExpandedRow(idx);
}
function updateMiniPlayerButtons(){
  const btn = ampEl('ampPauseResume');
  if(!btn) return;
  const showPause = player.playing && !player.paused;
  btn.innerHTML = U.svgIcon(showPause?'pause':'play',15);
  btn.title = showPause ? 'Pause' : 'Resume';
}
function renderExpandedList(){
  const listEl = ampEl('ampExpandedList');
  if(!listEl) return;
  listEl.innerHTML = player.playlist.map(function(item,i){
    const kindIcon = item.kind==='question' ? 'bank' : item.kind==='flashcard' ? 'cards' : 'note';
    return '<div class="amp-queue-row'+(i===player.index?' current':'')+'" data-idx="'+i+'">'+
      '<span class="amp-queue-num">'+(i+1)+'</span>'+
      U.svgIcon(kindIcon,13)+
      '<span class="amp-queue-title">'+U.esc(U.truncate(item.title||'Untitled',60))+'</span>'+
    '</div>';
  }).join('');
  listEl.querySelectorAll('.amp-queue-row').forEach(function(row){
    row.addEventListener('click',function(){
      stopSpeech(); player.index=parseInt(row.dataset.idx,10); player.segIndex=0;
      driveSpeech();
    });
  });
  U.paintIcons(listEl);
}
function highlightExpandedRow(idx){
  const listEl = ampEl('ampExpandedList');
  if(!listEl) return;
  listEl.querySelectorAll('.amp-queue-row').forEach(function(row){
    row.classList.toggle('current', parseInt(row.dataset.idx,10)===idx);
  });
}

function loadSavedPlaylist(p){

   modal each time — with a running list on screen you can edit or

   generator.

    const b = container.querySelector('#qaGoSettingsBtn');
    if(b) b.addEventListener('click',function(){ navigate('settings'); });

  }
  const savedTemplates = State.quickAddTemplates.slice().sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
  const groupOpts = SD_Bank.allQuestionGroupsWithPaths ? SD_Bank.allQuestionGroupsWithPaths() : [];

  container.innerHTML =
  '<div class="view-head"><div><h1>Quick Add</h1><div class="sub">Bulk-create questions, flashcards, or notes — fast, fully offline, no AI involved</div></div>'+
  '<div class="view-head-actions"><button class="btn btn-secondary" id="qaSaveTemplateBtn">'+U.svgIcon('save',15)+' Save Context as Template</button></div></div>'+

  '<div class="as-layout">'+
    '<div class="card as-source-picker">'+

        '<button class="as-source-tab'+(qaState.contentType==='flashcards'?' active':'')+'" data-ct="flashcards" type="button">'+U.svgIcon('cards',14)+' Flashcards</button>'+
        '<button class="as-source-tab'+(qaState.contentType==='notes'?' active':'')+'" data-ct="notes" type="button">'+U.svgIcon('note',14)+' Notes</button>'+

function openQuickCapture(){
  if(document.querySelector('.sd2-quickcap-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className='sd2-quickcap-overlay';
  overlay.innerHTML =
    '<div class="sd2-quickcap-box">'+
      '<div class="flex-between" style="margin-bottom:.6rem;"><h3 style="margin:0;">Quick Capture</h3><button class="icon-btn" id="qcCloseBtn">'+U.svgIcon('x',15)+'</button></div>'+
      '<div class="segmented" id="qcTypeSeg" style="margin-bottom:.7rem;">'+
        '<button data-t="note" class="active">Note</button><button data-t="question">Question</button><button data-t="card">Flashcard</button>'+
      '</div>'+
      '<div class="field" id="qcMainField"><label>Note</label><textarea id="qcMainInput" style="min-height:90px;" placeholder="Jot it down before you lose it…"></textarea></div>'+
      '<div class="field" id="qcBackField" style="display:none;"><label>Back / Answer</label><textarea id="qcBackInput" style="min-height:60px;"></textarea></div>'+
      '<button class="btn btn-primary" id="qcSaveBtn" style="width:100%;">'+U.svgIcon('check',15)+' Save</button>'+
      '<div class="sd2-cmd-hint">Press <span class="kbd">Esc</span> to cancel</div>'+
    '</div>';
  document.body.appendChild(overlay);
  U.paintIcons(overlay);
  let type='note';
  const mainLabel = overlay.querySelector('#qcMainField label');
  const mainInput = overlay.querySelector('#qcMainInput');
  const backField = overlay.querySelector('#qcBackField');
  overlay.querySelectorAll('#qcTypeSeg button').forEach(function(b){
    b.addEventListener('click',function(){
      overlay.querySelectorAll('#qcTypeSeg button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); type=b.dataset.t;
      if(type==='note'){ mainLabel.textContent='Note'; mainInput.placeholder='Jot it down before you lose it…'; backField.style.display='none'; }
      else if(type==='question'){ mainLabel.textContent='Question text'; mainInput.placeholder='Type the question — you can add options and details later in Question Bank'; backField.style.display='none'; }
      else { mainLabel.textContent='Front'; mainInput.placeholder='Question or term'; backField.style.display=''; }
    });
  });
  function close(){ overlay.remove(); document.removeEventListener('keydown',escHandler); }
  function escHandler(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',escHandler);
  overlay.querySelector('#qcCloseBtn').addEventListener('click',close);
  overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
  overlay.querySelector('#qcSaveBtn').addEventListener('click',async function(){
    const val = mainInput.value.trim();
    if(!val){ toast('Nothing to save yet','error'); return; }
    if(type==='note'){
      const row = await DB.put('notes',{title:val.split('\n')[0].slice(0,60)||'Untitled Note',body:val,subject:'',topic:''});
      State.notes.push(row);
      toast('Note captured','success');
    } else if(type==='question'){
      const row = await DB.put('questions',{type:'shortanswer',text:val,explanation:'',subject:'',topic:'',difficulty:'medium',marks:1,tags:[],bookmarked:false,correctAnswer:''});
      State.questions.push(row);
      toast('Question captured — add details in Question Bank anytime','success');
    } else {
      const back = overlay.querySelector('#qcBackInput').value.trim();
      if(!back){ toast('Add the back/answer side too','error'); return; }
      let deckId;
      if(!State.flashcardDecks.length){
        const deckRow = await DB.put('flashcardDecks',{name:'Quick Captures',tags:[]});
        State.flashcardDecks.push(deckRow); deckId=deckRow.id;
      } else {
        deckId = State.flashcardDecks[0].id;
      }
      const row = await DB.put('flashcards',Object.assign({ease:2.5,interval:0,reps:0,state:'learning'},{deckId:deckId,front:val,back:back,image:'',difficulty:'medium',tags:[],favorite:false}));
      State.flashcards.push(row);
      toast('Card captured into "'+(State.flashcardDecks.find(function(d){return d.id===deckId;})||{name:'a deck'}).name+'"','success');
      if(window.updateNavBadges) updateNavBadges();
    }
    close();
    if(State.currentView && window.VIEW_RENDERERS[State.currentView]) navigate(State.currentView);
  });
  setTimeout(function(){ mainInput.focus(); },60);
}

/* Notes pin state lives in settings (small, not worth a DB migration) */
function getPinnedNoteIds(){ return (State.settings.pinnedNoteIds)||[]; }
async function toggleNotePin(id){
  let pins = getPinnedNoteIds().slice();
  const i = pins.indexOf(id);
  if(i>=0) pins.splice(i,1); else pins.unshift(id);
  State.settings.pinnedNoteIds = pins;

}

/* Wrap navigate to post-process the Notes grid: add pin buttons + sort pins
   first + make code chips in note cards click-to-copy. Runs after the
   existing notes renderer, so it never touches that function's internals. */
const _origNavigateV2a = window.navigate;
window.navigate = async function(viewId,params){
  await _origNavigateV2a(viewId,params);
  if(viewId==='notes'){
    enhanceNotesGrid();
  }
  if(viewId==='dashboard' || viewId==='today'){
    /* Each of these prepends to the top of the view, so calling them in
       reverse-of-desired-priority means the last call ends up visually
       first. Order here: storage warning (systemic, most urgent) is called
       last so it lands on top; the passive weekly digest is called first
       so it settles near the bottom. */
    injectWeeklyDigest();
    injectTodaysFocus();
    injectStreakSaveReminder();
    injectLowStorageBanner();
  }
  if(viewId==='flashcards'){
    injectDeckMergeButton();
  }
  if(viewId==='questionbank'){
    injectSingleExportButtons();
  }
  if(viewId==='settings'){
    injectBulkRenameTool();
  }
  injectQuickCaptureFab();
  // The quiz/practice runners have their own primary action button (Next
  // question / Next) anchored bottom-right of the question card, the same
  // screen territory the FAB occupies. On short viewports the FAB can end
  // up sitting directly on top of that button, blocking the tap the person
  // actually needs. Hide the FAB for the duration of an active run rather
  // than trying to reposition around content whose height varies per
  // question; it reappears immediately on any other view.
  const fabEl = document.getElementById('sd2QuickCapFab');

};

function enhanceNotesGrid(){
  const grid = document.getElementById('ntGrid');
  if(!grid) return;
  const pins = getPinnedNoteIds();
  // Re-sort existing cards: pinned first, preserving current relative order otherwise.
  if(pins.length){
    const cards = Array.prototype.slice.call(grid.querySelectorAll('[data-nid]'));
    cards.sort(function(a,b){
      const ap = pins.indexOf(a.dataset.nid), bp = pins.indexOf(b.dataset.nid);
      if(ap===-1 && bp===-1) return 0;
      if(ap===-1) return 1; if(bp===-1) return -1;
      return ap-bp;
    });
    cards.forEach(function(c){ grid.appendChild(c); });
  }
  grid.querySelectorAll('[data-nid]').forEach(function(card){
    if(card.querySelector('.sd2-pin-badge')) return; // already enhanced
    card.style.position = card.style.position || 'relative';
    const id = card.dataset.nid;
    const isPinned = pins.indexOf(id)>=0;
    const pinBtn = document.createElement('button');
    pinBtn.className='icon-btn sd2-pin-badge';
    pinBtn.setAttribute('aria-label',isPinned?'Unpin note':'Pin note to top');
    pinBtn.innerHTML = U.svgIcon('star',15);
    pinBtn.style.opacity = isPinned ? '1' : '.35';
    pinBtn.addEventListener('click',async function(e){
      e.stopPropagation();
      await toggleNotePin(id);
      navigate('notes');
    });
    card.appendChild(pinBtn);
    U.paintIcons(card);
  });
}

/* ---------- 4. FOCUS MODE — full-screen Pomodoro ---------- */
let focusInterval=null;
function openFocusMode(minutes){
  minutes = minutes||25;
  if(document.querySelector('.sd2-focus-overlay')) return;
  let secondsLeft = minutes*60;
  const overlay = document.createElement('div');
  overlay.className='sd2-focus-overlay';
  overlay.innerHTML =
    '<div style="font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;">Focus session</div>'+
    '<div class="sd2-focus-time" id="sd2FocusTime"></div>'+
    '<div class="flex-gap">'+
      '<button class="btn btn-secondary" id="sd2FocusPauseBtn">Pause</button>'+
      '<button class="btn btn-ghost" id="sd2FocusExitBtn" style="color:#fff;">End session</button>'+
    '</div>'+
    '<p style="opacity:.55;font-size:.78rem;max-width:280px;text-align:center;">One task, no tabs, no notifications. Studydesk will log this as a Pomodoro focus block when it finishes.</p>';
  document.body.appendChild(overlay);
  const timeEl = overlay.querySelector('#sd2FocusTime');
  let paused=false;
  function draw(){
    const m = Math.floor(secondsLeft/60), s = secondsLeft%60;
    timeEl.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  draw();
  focusInterval = setInterval(function(){
    if(paused) return;
    secondsLeft--;
    if(secondsLeft<=0){
      clearInterval(focusInterval); focusInterval=null;
      window.logSessionSimple('pomodoro',{minutes:minutes});
      awardXP(8,'focus-session');
      toast('Focus session complete — nice work!','success');
      overlay.remove();
      return;
    }
    draw();
  },1000);
  overlay.querySelector('#sd2FocusPauseBtn').addEventListener('click',function(e){
    paused=!paused; e.target.textContent = paused?'Resume':'Pause';
  });
  overlay.querySelector('#sd2FocusExitBtn').addEventListener('click',async function(){
    const ok = await confirmDialog({title:'End this focus session?',message:'Your progress this session won\'t be logged.',okText:'End session'});
    if(!ok) return;
    if(focusInterval){ clearInterval(focusInterval); focusInterval=null; }
    overlay.remove();
  });
}
window.SD_openFocusMode = openFocusMode;

let _storageWarned = false;
function injectLowStorageBanner(){
  if(_storageWarned) return;
  if(!(navigator.storage && navigator.storage.estimate)) return;
  navigator.storage.estimate().then(function(est){
    if(!est.quota) return;
    const usedPct = (est.usage/est.quota)*100;
    if(usedPct < 85) return;
    _storageWarned = true;
    const host = document.querySelector('.view-container') || document.getElementById('mainRegion');
    if(!host || document.getElementById('sd2StorageBanner')) return;
    const el = document.createElement('div');
    el.id='sd2StorageBanner'; el.className='sd2-banner warn';
    el.innerHTML = U.svgIcon('alert',16)+'<span style="flex:1;">Device storage is running low ('+Math.round(usedPct)+'% used) — this can cause StudyDesk to fail to save. Consider exporting a backup and freeing up space.</span><button class="btn btn-secondary btn-sm" style="flex-shrink:0;" onclick="navigate(\'backup\')">Backup now</button>';
    sd2InsertBanner(host,el);
    U.paintIcons(el);
  }).catch(function(){});
}

/* ---------- 11. DRAFT AUTO-RECOVERY for the Note editor ---------- */
/* Only tracks drafts for brand-new notes, not edits to existing ones — the
   note modal only renders a #ntDeleteBtn when editing an existing note, so
   its absence is a reliable "this is a new, unsaved note" signal. Without
   this check, a stray edit to an existing note (typed a character, then
   closed without saving) would later get offered as a "recover unsaved
   note" prompt while creating a completely unrelated new note, which is
   confusing and wrong. */
const DRAFT_KEY = 'sd2_note_draft';
function sd2IsNewNoteModalOpen(){
  return !!document.getElementById('ntBody') && !document.getElementById('ntDeleteBtn');
}
document.addEventListener('input',function(e){
  if(e.target && e.target.id==='ntBody' && sd2IsNewNoteModalOpen()){
    try{
      const titleEl = document.getElementById('ntTitle');
      sessionStorage.setItem(DRAFT_KEY, JSON.stringify({title:titleEl?titleEl.value:'',body:e.target.value,ts:Date.now()}));
    }catch(err){}
  }
});
function checkForNoteDraft(){
  try{
    if(!sd2IsNewNoteModalOpen()) return; // only offer recovery when opening a fresh "New Note", never mid-edit of an existing one
    const raw = sessionStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const draft = JSON.parse(raw);
    if(!draft.body || !draft.body.trim()) return;
    if(Date.now()-draft.ts > 1000*60*60*6){ sessionStorage.removeItem(DRAFT_KEY); return; } // stale >6h
    setTimeout(function(){
      const bodyEl = document.getElementById('ntBody');
      if(!bodyEl || bodyEl.value.trim() || !sd2IsNewNoteModalOpen()) return; // editor not open, already has content, or is now an edit modal
      confirmDialog({title:'Recover unsaved note?',message:'It looks like a note draft ("'+U.truncate(draft.title||draft.body,40)+'") wasn\'t saved. Restore it?',okText:'Restore'}).then(function(ok){
        if(ok){
          bodyEl.value = draft.body;
          const titleEl = document.getElementById('ntTitle');
          if(titleEl && draft.title) titleEl.value = draft.title;
          bodyEl.dispatchEvent(new Event('input'));
        }
        sessionStorage.removeItem(DRAFT_KEY);
      });
    },300);
  }catch(err){}
}
/* openNoteEditor isn't exposed on window (same closure privacy as the
   command palette internals), so instead of trying to hook the function
   directly, watch for its modal appearing in the DOM — robust to any
   future internal changes in the notes renderer. */
const _sd2ModalWatcher = new MutationObserver(function(){
  if(document.getElementById('ntBody')) checkForNoteDraft();
});
_sd2ModalWatcher.observe(document.getElementById('modalOverlay')||document.body,{childList:true,subtree:true});
/* Clear the draft on a successful, deliberate save */
document.addEventListener('click',function(e){
  if(e.target && (e.target.id==='ntSaveBtn')){
    setTimeout(function(){ try{ sessionStorage.removeItem(DRAFT_KEY); }catch(err){} },50);
  }
});

  const items=[];
  if(weak) items.push({label:'Weakest topic: '+weak.key+' ('+weak.acc+'% accuracy)',action:function(){navigate('practice',{mode:'weak'});},cta:'Practice it'});
  if(dueCards>0) items.push({label:dueCards+' flashcard(s) due for review',action:function(){navigate('flashcards');},cta:'Review'});
  if(dueRevisions>0) items.push({label:dueRevisions+' item(s) due in Smart Revision',action:function(){navigate('revision');},cta:'Open'});
  if(!items.length) return;
  const el = document.createElement('div');
  el.id='sd2TodaysFocus'; el.className='card'; el.style.marginBottom='1rem';
  el.innerHTML = '<h4 style="margin:0 0 .5rem;">'+U.svgIcon('target',15)+' Today\'s focus</h4>'+
    items.slice(0,3).map(function(it,i){
      return '<div class="flex-between" style="padding:.4rem 0;'+(i<items.length-1?'border-bottom:1px dashed var(--border);':'')+'"><span style="font-size:.82rem;">'+U.esc(it.label)+'</span><button class="btn btn-secondary btn-sm" data-sd2-focus-idx="'+i+'">'+it.cta+'</button></div>';
    }).join('');
  sd2InsertBanner(host,el);
  U.paintIcons(el);
  el.querySelectorAll('[data-sd2-focus-idx]').forEach(function(btn){
    btn.addEventListener('click',function(){ items[parseInt(btn.dataset.sd2FocusIdx,10)].action(); });
  });
}

/* ---------- 13 & 14. Command palette: add Import / Quick Capture / Focus entries ----------
   Note: openCmdk/baseCommands/cmdkItems are private to the IIFE they're defined in and
   are not exposed on window, so they can't be overridden from here. Instead this observes
   the palette opening and appends extra rows directly into #cmdkList. These rows are
   click/tap-only (they don't participate in the palette's internal arrow-key index), which
   is an acceptable trade-off since Claude is running in the mobile app where tapping, not
   arrow-key navigation, is how this gets used anyway. */
function sd2ExtraCmdkRows(){
  return [
    {label:'Import Questions (JSON/CSV/TXT)',icon:'upload',run:function(){ navigate('questionbank'); setTimeout(function(){ const b=document.getElementById('qbImportBtn'); if(b) b.click(); },250); }},
    {label:'Import Flashcards (JSON/CSV)',icon:'upload',run:function(){ navigate('flashcards'); setTimeout(function(){ const b=document.getElementById('fcImportBtn'); if(b) b.click(); },250); }},
    {label:'Import Notes (JSON)',icon:'upload',run:function(){ navigate('notes'); setTimeout(function(){ const b=document.getElementById('ntImportBtn'); if(b) b.click(); },250); }},
    {label:'Quick Capture',icon:'zap',run:function(){ openQuickCapture(); }},
    {label:'Start Focus Mode (25 min)',icon:'timer',run:function(){ openFocusMode(25); }}
  ].concat(State.flashcardDecks.length>=2 ? [{label:'Merge Flashcard Decks',icon:'layers',run:function(){ navigate('flashcards'); setTimeout(openDeckMergeModal,250); }}] : []);
}
function injectCmdkExtras(){
  const cmdkOverlay = document.getElementById('cmdkOverlay');
  const cmdkList = document.getElementById('cmdkList');
  if(!cmdkOverlay || !cmdkList) return;
  if(cmdkList.querySelector('.sd2-cmdk-extra')) return; // already injected for this render
  const q = (document.getElementById('cmdkInput')||{value:''}).value.toLowerCase();
  const rows = sd2ExtraCmdkRows().filter(function(r){ return r.label.toLowerCase().includes(q); });
  if(!rows.length) return;
  const label = document.createElement('div');
  label.className='cmdk-group-label sd2-cmdk-extra';
  label.textContent='StudyDesk v2';
  cmdkList.appendChild(label);
  rows.forEach(function(r){
    const item = document.createElement('div');
    item.className='cmdk-item sd2-cmdk-extra';
    item.innerHTML = '<span class="ic">'+U.svgIcon(r.icon,15)+'</span><span>'+U.esc(r.label)+'</span>';
    item.addEventListener('click',function(){
      r.run();
      cmdkOverlay.classList.remove('open');
    });
    cmdkList.appendChild(item);
    U.paintIcons(item);
  });
}
const _cmdkOverlayEl = document.getElementById('cmdkOverlay');
const _cmdkListEl = document.getElementById('cmdkList');
if(_cmdkOverlayEl && _cmdkListEl){
  new MutationObserver(function(){
    if(_cmdkOverlayEl.classList.contains('open')) setTimeout(injectCmdkExtras,20);
  }).observe(_cmdkOverlayEl,{attributes:true,attributeFilter:['class']});
  // The palette's own renderCmdkList() rewrites #cmdkList.innerHTML on every keystroke,
  // which wipes the rows above — re-inject whenever that happens too.
  new MutationObserver(function(){
    if(_cmdkOverlayEl.classList.contains('open')) setTimeout(injectCmdkExtras,20);
  }).observe(_cmdkListEl,{childList:true});
} else {
  console.warn('StudyDesk v2: command palette DOM (#cmdkOverlay/#cmdkList) not found — palette extras were not added.');
}

/* ---------- 15. Shortcut cheat-sheet: extend Settings' keyboard row ---------- */
const _origRenderSettings = window.VIEW_RENDERERS && window.VIEW_RENDERERS.settings;
if(_origRenderSettings){
  window.VIEW_RENDERERS.settings = async function(container){
    await _origRenderSettings(container);
    const accessCard = Array.prototype.find.call(container.querySelectorAll('.card'),function(c){ return c.querySelector('h3') && c.querySelector('h3').textContent==='Accessibility'; });
    if(accessCard && !accessCard.querySelector('.sd2-extra-shortcuts')){
      const row = document.createElement('div');
      row.className='flex-gap sd2-extra-shortcuts';
      row.style.cssText='flex-wrap:wrap;font-size:.78rem;color:var(--text-faint);margin-top:.5rem;';
      row.innerHTML = '<span class="kbd">c</span> Quick capture &nbsp; <span class="kbd">Esc</span> Close any overlay';
      accessCard.appendChild(row);
    }
  };
}

console.log('StudyDesk v2 upgrade module loaded: 3 JSON importers, boot self-heal, 15 new features.');
})();

/* ============================================================
   FINAL BOOT (guarded so it only ever runs once)
   ============================================================ */
function __sd_runBootOnce(){
  if(window.__sd_booted) return;
  window.__sd_booted = true;
  if(window.SD_BOOT) window.SD_BOOT();
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',__sd_runBootOnce);
} else {
  __sd_runBootOnce();
}

</script>
